name: Build EPUBs

# Builds one EPUB per book and publishes them on the release named by
# epub_release in library.yaml. Does nothing while the library has no books.
on:
  push:
    branches: [main]
    paths: ['created-books/**', 'improved-materials/**', 'library.yaml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  epub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Find the books
        id: books
        run: |
          find created-books improved-materials -mindepth 2 -maxdepth 2 -name book.yaml \
            -exec dirname {} \; > books.txt 2>/dev/null || true
          echo "count=$(wc -l < books.txt)" >> "$GITHUB_OUTPUT"
          cat books.txt

      - name: Get the Syllabook scripts
        if: steps.books.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # use the copy in this repository if there is one; otherwise the latest release
          if [ -d skills/syllabook/scripts ]; then
            echo "SCRIPTS=$PWD/skills/syllabook/scripts" >> "$GITHUB_ENV"
          else
            gh release download --repo Joshpcbrrj/syllabook --pattern syllabook.zip --dir "$RUNNER_TEMP"
            unzip -q "$RUNNER_TEMP/syllabook.zip" -d "$RUNNER_TEMP"
            echo "SCRIPTS=$RUNNER_TEMP/syllabook/scripts" >> "$GITHUB_ENV"
          fi

      - name: Build the EPUBs
        if: steps.books.outputs.count != '0'
        run: |
          pip install pyyaml pypandoc_binary
          while read -r book; do
            python "$SCRIPTS/build.py" --book "$book" --out dist --no-zip
          done < books.txt

      - name: Publish on the release
        if: steps.books.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python -c "import yaml; print(yaml.safe_load(open('library.yaml'))['epub_release'])")
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "EPUBs" --notes "One EPUB per book, rebuilt on every change."
          gh release upload "$tag" dist/*.epub --clobber
