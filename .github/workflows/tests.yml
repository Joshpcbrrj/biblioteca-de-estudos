name: Kit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # kit-only: libraries created from the template do not run it
    if: github.repository == 'Joshpcbrrj/syllabook'
    strategy:
      fail-fast: false
      matrix:
        # users run the skill's scripts on Windows, macOS and Linux sandboxes
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: Lint (code and workflows)
        run: |
          ruff check .
          actionlint .github/workflows/*.yml skills/syllabook/assets/library/.github/workflows/*.yml
      - name: Plugin and marketplace manifests are valid JSON
        run: python -c "import json; [json.load(open(p)) for p in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]"
      - name: Tests with coverage
        run: pytest --cov
