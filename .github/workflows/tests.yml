name: Kit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # kit-only: libraries created from the template do not run it
    if: github.repository == 'Joshpcbrrj/syllabook'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # pandoc (EPUB) and zensical (website) let the tests build a real book and site
      - run: pip install pyyaml pypandoc_binary zensical
      - run: python tests/run.py
