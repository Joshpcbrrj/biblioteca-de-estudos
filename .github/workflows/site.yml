name: Website

# Builds the searchable website with every book and publishes it on GitHub Pages.
# Turn it on once: Settings → Pages → Source: GitHub Actions.
# Does nothing while the library has no books.
on:
  push:
    branches: [main]
    paths: ['created-books/**', 'improved-materials/**', 'site/**', 'library.yaml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.books.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Find the books
        id: books
        run: |
          n=$(find created-books improved-materials -mindepth 2 -maxdepth 2 -name book.yaml 2>/dev/null | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Get the Syllabook scripts
        if: steps.books.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d skills/syllabook/scripts ]; then
            echo "SCRIPTS=$PWD/skills/syllabook/scripts" >> "$GITHUB_ENV"
          else
            gh release download --repo Joshpcbrrj/syllabook --pattern syllabook.zip --dir "$RUNNER_TEMP"
            unzip -q "$RUNNER_TEMP/syllabook.zip" -d "$RUNNER_TEMP"
            echo "SCRIPTS=$RUNNER_TEMP/syllabook/scripts" >> "$GITHUB_ENV"
          fi

      - name: Build the website
        if: steps.books.outputs.count != '0'
        run: |
          pip install pyyaml zensical
          python "$SCRIPTS/build.py" site --library . --out _site
          cd _site && zensical build --clean

      - uses: actions/configure-pages@v6
        if: steps.books.outputs.count != '0'
      - uses: actions/upload-pages-artifact@v5
        if: steps.books.outputs.count != '0'
        with:
          path: _site/site

  deploy:
    needs: build
    if: needs.build.outputs.count != '0'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
