name: Report an error (Reportar erro)
description: An error in a book (fact, code, calculation, link) or in the skill · Um erro num livro ou na skill
title: "[Error] "
labels: ["error"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where is the error? (Onde está o erro?)
      options:
        - In a book or material (Num livro ou material)
        - In the skill or scripts (Na skill ou nos scripts)
        - In the documentation (Na documentação)
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Book and chapter, or file (Livro e capítulo, ou arquivo)
      placeholder: "E.g.: Docker Compose in practice, ch. 6"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What is wrong? (O que está errado?)
      description: Copy the passage and explain the problem. You can write in English or Portuguese.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What would be correct? (Qual seria o certo?) — optional
      description: If it is a fact, include the source.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before sending (Antes de enviar)
      options:
        - label: I did not include personal data, passwords or tokens. (Não incluí dados pessoais, senhas ou tokens.)
          required: true
