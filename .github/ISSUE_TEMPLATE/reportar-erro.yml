name: Reportar erro
description: Um erro num livro (fato, código, conta, link) ou na skill
title: "[Erro] "
labels: ["erro"]
body:
  - type: dropdown
    id: onde
    attributes:
      label: Onde está o erro?
      options:
        - Num livro ou material
        - Na skill ou nos scripts
        - Na documentação
    validations:
      required: true
  - type: input
    id: local
    attributes:
      label: Livro e capítulo (ou arquivo)
      placeholder: "Ex.: Docker Compose na prática, cap. 6"
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: O que está errado?
      description: Copie o trecho e explique o problema.
    validations:
      required: true
  - type: textarea
    id: correcao
    attributes:
      label: Qual seria o certo? (opcional)
      description: Se for um fato, mande a fonte.
  - type: checkboxes
    id: privacidade
    attributes:
      label: Antes de enviar
      options:
        - label: Não incluí dados pessoais, senhas ou tokens.
          required: true
