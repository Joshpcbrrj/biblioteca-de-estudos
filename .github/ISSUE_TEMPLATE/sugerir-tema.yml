name: Sugerir tema
description: Um tema para um livro novo ou uma melhoria num livro existente
title: "[Tema] "
labels: ["sugestão"]
body:
  - type: input
    id: tema
    attributes:
      label: Tema
      placeholder: "Ex.: Git do zero, inglês para viagem, eletrônica básica"
    validations:
      required: true
  - type: textarea
    id: objetivo
    attributes:
      label: Para que você quer aprender?
      description: Trabalho, prova, hobby, um projeto... Isso ajuda a montar a ementa.
    validations:
      required: true
  - type: dropdown
    id: nivel
    attributes:
      label: Seu nível hoje
      options:
        - Nunca estudei
        - Sei o básico
        - Já uso, quero aprofundar
  - type: textarea
    id: extra
    attributes:
      label: Algo mais? (opcional)
      description: Tópicos que não podem faltar, materiais de referência, livros relacionados.
