<svg xmlns="http://www.w3.org/2000/svg" width="760" height="288" viewBox="0 0 760 288"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Faixas da média: o encadeamento testa de cima para baixo</text><rect x="60" y="98" width="320" height="44" rx="0" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="220" y="126" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">Reprovado</text><text x="220" y="86" class="m" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">senao</text><rect x="380" y="98" width="128" height="44" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="444" y="126" font-size="15" font-weight="bold" fill="#D97706" text-anchor="middle">Recuperação</text><text x="444" y="66" class="m" font-size="12.5" font-weight="bold" fill="#D97706" text-anchor="middle">senao se (media &gt;= 5.0)</text><rect x="508" y="98" width="192" height="44" rx="0" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="604" y="126" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">Aprovado</text><text x="604" y="86" class="m" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="middle">se (media &gt;= 7.0)</text><line x1="60" y1="142" x2="60" y2="150" stroke="#9CA3AF" stroke-width="1.2"/><text x="60" y="166" font-size="12" fill="#6B7280" text-anchor="middle">0</text><line x1="124" y1="142" x2="124" y2="150" stroke="#9CA3AF" stroke-width="1.2"/><text x="124" y="166" font-size="12" fill="#6B7280" text-anchor="middle">1</text><line x1="188" y1="142" x2="188" y2="150" stroke="#9CA3AF" stroke-width="1.2"/><text x="188" y="166" font-size="12" fill="#6B7280" text-anchor="middle">2</text><line x1="252" y1="142" x2="252" y2="150" stroke="#9CA3AF" stroke-width="1.2"/><text x="252" y="166" font-size="12" fill="#6B7280" text-anchor="middle">3</text><line x1="316" y1="142" x2="316" y2="150" stroke="#9CA3AF" stroke-width="1.2"/><text x="316" y="166" font-size="12" fill="#6B7280" text-anchor="middle">4</text><line x1="380" y1="142" x2="380" y2="150" stroke="#9CA3AF" stroke-width="1.2"/><text x="380" y="166" font-size="12" fill="#6B7280" text-anchor="middle">5</text><line x1="444" y1="142" x2="444" y2="150" stroke="#9CA3AF" stroke-width="1.2"/><text x="444" y="166" font-size="12" fill="#6B7280" text-anchor="middle">6</text><line x1="508" y1="142" x2="508" y2="150" stroke="#9CA3AF" stroke-width="1.2"/><text x="508" y="166" font-size="12" fill="#6B7280" text-anchor="middle">7</text><line x1="572" y1="142" x2="572" y2="150" stroke="#9CA3AF" stroke-width="1.2"/><text x="572" y="166" font-size="12" fill="#6B7280" text-anchor="middle">8</text><line x1="636" y1="142" x2="636" y2="150" stroke="#9CA3AF" stroke-width="1.2"/><text x="636" y="166" font-size="12" fill="#6B7280" text-anchor="middle">9</text><line x1="700" y1="142" x2="700" y2="150" stroke="#9CA3AF" stroke-width="1.2"/><text x="700" y="166" font-size="12" fill="#6B7280" text-anchor="middle">10</text><text x="380" y="200" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">ordem dos testes:</text><text x="140" y="230" class="m" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">1º&#160; media &gt;= 7.0 ?</text><text x="380" y="230" class="m" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">2º&#160; media &gt;= 5.0 ?</text><text x="620" y="230" class="m" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">3º&#160; nenhum: senao</text><text x="380" y="270" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">No 2º teste não é preciso escrever media &lt; 7: se chegou ali, o 1º já deu falso.</text></svg>