<svg xmlns="http://www.w3.org/2000/svg" width="480" height="508" viewBox="0 0 480 508"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">escolha / caso: um desvio para cada valor</text><rect x="140" y="52" width="200" height="44" rx="6" class="xP"/><text x="240.0" y="78.5" class="m b c">escolha (opcao)</text><polygon points="110,124 200.0,153.0 110,182 20.0,153.0" class="xO"/><text x="110" y="158.0" class="m b c">caso 'a':</text><rect x="230" y="131" width="230" height="44" rx="6" class="xG"/><text x="345.0" y="149.5" class="m c">escreva("Letra A")</text><text x="345.0" y="167.5" class="m c">pare</text><path d="M200,153 L230,153" class="l" marker-end="url(#a)"/><text x="208" y="146" class="s">sim</text><path d="M110,182 L110,216" class="l" marker-end="url(#a)"/><text x="118" y="204" class="s">não</text><polygon points="110,216 200.0,245.0 110,274 20.0,245.0" class="xO"/><text x="110" y="250.0" class="m b c">caso 'b':</text><rect x="230" y="223" width="230" height="44" rx="6" class="xG"/><text x="345.0" y="241.5" class="m c">escreva("Letra B")</text><text x="345.0" y="259.5" class="m c">pare</text><path d="M200,245 L230,245" class="l" marker-end="url(#a)"/><text x="208" y="238" class="s">sim</text><path d="M110,274 L110,308" class="l" marker-end="url(#a)"/><text x="118" y="296" class="s">não</text><polygon points="110,308 200.0,337.0 110,366 20.0,337.0" class="xY"/><text x="110" y="342.0" class="m b c">caso contrario:</text><rect x="230" y="315" width="230" height="44" rx="6" class="xG"/><text x="345.0" y="341.5" class="m c">escreva("Inválida")</text><path d="M200,337 L230,337" class="l" marker-end="url(#a)"/><text x="208" y="330" class="s">sim</text><path d="M240,96 L240,108 L110,108 L110,124" class="l" marker-end="url(#a)"/><rect x="140" y="412" width="200" height="40" rx="6" class="xY"/><text x="240.0" y="436.5" class="b c">continua o programa</text><path d="M460,153 L470,153 L470,432 L340,432" class="l"/><path d="M460,245 L470,245 L470,432 L340,432" class="l"/><path d="M460,337 L470,337 L470,432 L340,432" class="l"/><text x="240.0" y="484" class="n c">O pare encerra o escolha depois do caso executado.</text></svg>