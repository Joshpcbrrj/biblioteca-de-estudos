<svg xmlns="http://www.w3.org/2000/svg" width="480" height="562" viewBox="0 0 480 562"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">A ideia da recursão</text><rect x="20" y="60" width="200" height="42" rx="6" class="xB"/><text x="120" y="87" class="m b c">resolver(n)</text><rect x="60" y="122" width="200" height="42" rx="6" class="xB"/><text x="160" y="149" class="m b c">resolver(n - 1)</text><path d="M100,102 L100,122" class="l" marker-end="url(#a)"/><rect x="100" y="184" width="200" height="42" rx="6" class="xB"/><text x="200" y="211" class="m b c">resolver(n - 2)</text><path d="M140,164 L140,184" class="l" marker-end="url(#a)"/><rect x="140" y="246" width="200" height="42" rx="6" class="xG"/><text x="240" y="273" class="m b c">caso base</text><path d="M180,226 L180,246" class="l" marker-end="url(#a)"/><path d="M400,267 L400,81" class="l d" marker-end="url(#a)"/><text x="408" y="120" class="s">os</text><text x="408" y="136" class="s">resultados</text><text x="408" y="152" class="s">voltam</text><rect x="20" y="318" width="440" height="76" rx="6" class="xB"/><text x="36" y="342" class="b">Passo recursivo</text><text x="36" y="366" class="s">resolve uma parte e chama uma versão</text><text x="36" y="384" class="s">um pouco menor do mesmo problema</text><rect x="20" y="408" width="440" height="76" rx="6" class="xG"/><text x="36" y="432" class="b">Caso base</text><text x="36" y="456" class="s">o caso mais simples, resolvido sem nova</text><text x="36" y="474" class="s">chamada: é ele que faz a recursão parar</text><text x="240.0" y="518" class="n c">Sem caso base, ou se o problema não diminuir,</text><text x="240.0" y="538" class="n c">a função chama a si mesma para sempre.</text></svg>