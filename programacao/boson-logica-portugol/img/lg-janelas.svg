<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">As janelas da casa: e, ou, nao</text><rect x="20" y="56" width="38" height="38" rx="6" class="xG"/><text x="39" y="81" class="m b c">'a'</text><rect x="66" y="56" width="38" height="38" rx="6" class="xG"/><text x="85" y="81" class="m b c">'a'</text><rect x="112" y="56" width="38" height="38" rx="6" class="xG"/><text x="131" y="81" class="m b c">'a'</text><text x="170" y="80" class="b">todas abertas</text><rect x="20" y="104" width="440" height="52" rx="6" class="xG"/><text x="36" y="126" class="m">a1 == 'a' e a2 == 'a' e a3 == 'a'</text><text x="36" y="146" class="m b">→ verdadeiro</text><rect x="20" y="176" width="38" height="38" rx="6" class="xG"/><text x="39" y="201" class="m b c">'a'</text><rect x="66" y="176" width="38" height="38" rx="6" class="xY"/><text x="85" y="201" class="m b c">'f'</text><rect x="112" y="176" width="38" height="38" rx="6" class="xY"/><text x="131" y="201" class="m b c">'f'</text><text x="170" y="200" class="b">pelo menos uma aberta</text><rect x="20" y="224" width="440" height="52" rx="6" class="xG"/><text x="36" y="246" class="m">a1 == 'a' ou a2 == 'a' ou a3 == 'a'</text><text x="36" y="266" class="m b">→ verdadeiro</text><rect x="20" y="296" width="38" height="38" rx="6" class="xG"/><text x="39" y="321" class="m b c">'a'</text><rect x="66" y="296" width="38" height="38" rx="6" class="xY"/><text x="85" y="321" class="m b c">'f'</text><rect x="112" y="296" width="38" height="38" rx="6" class="xY"/><text x="131" y="321" class="m b c">'f'</text><text x="170" y="320" class="b">inverte o resultado</text><rect x="20" y="344" width="440" height="52" rx="6" class="xR"/><text x="36" y="366" class="m">nao (a1 == 'a')</text><text x="36" y="386" class="m b">→ falso</text><text x="240.0" y="436" class="n c">'a' = aberta   'f' = fechada</text></svg>