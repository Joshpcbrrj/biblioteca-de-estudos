<svg xmlns="http://www.w3.org/2000/svg" width="480" height="570" viewBox="0 0 480 570"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Cadastro de 10 matrículas válidas</text><rect x="20" y="52" width="440" height="40" rx="6" class="xP"/><text x="240" y="77" class="m b c">para (pos = 0; pos &lt; 10; pos++)</text><path d="M200,92 L200,112" class="l" marker-end="url(#a)"/><polygon points="200,112 335.0,138.0 200,164 65.0,138.0" class="xO"/><text x="200" y="143.0" class="m b c">enquanto (verdadeiro)</text><path d="M200,164 L200,182" class="l" marker-end="url(#a)"/><text x="208" y="176" class="b">V</text><polygon points="130,182 290,182 270,222 110,222" class="xB"/><text x="200.0" y="207" class="m c">leia(mat)</text><path d="M200,222 L200,242" class="l" marker-end="url(#a)"/><polygon points="200,242 320.0,268.0 200,294 80.0,268.0" class="xO"/><text x="200" y="273.0" class="m b c">fora de 100..200?</text><rect x="340" y="248" width="130" height="40" rx="6" class="xR"/><text x="405.0" y="272.5" class="m b c">"Inválido"</text><path d="M320,268 L340,268" class="l" marker-end="url(#a)"/><text x="324" y="260" class="b">V</text><path d="M200,294 L200,314" class="l" marker-end="url(#a)"/><text x="208" y="308" class="b">F</text><polygon points="200,314 320.0,340.0 200,366 80.0,340.0" class="xO"/><text x="200" y="345.0" class="m b c">já cadastrada?</text><rect x="340" y="320" width="130" height="40" rx="6" class="xR"/><text x="405.0" y="344.5" class="m b c">"Repetida"</text><path d="M320,340 L340,340" class="l" marker-end="url(#a)"/><text x="324" y="332" class="b">V</text><path d="M200,366 L200,386" class="l" marker-end="url(#a)"/><text x="208" y="380" class="b">F</text><rect x="60" y="386" width="280" height="40" rx="6" class="xG"/><text x="200.0" y="411" class="m c">matriculas[pos] = mat; pare</text><path d="M470,340 L476,340 L476,138 L335,138" class="l" marker-end="url(#a)"/><path d="M470,268 L476,268" class="l"/><rect x="60" y="456" width="360" height="40" rx="6" class="xO"/><text x="240.0" y="481" class="m c">ordena matriculas[] (selection sort)</text><path d="M240,426 L240,456" class="l" marker-end="url(#a)"/><text x="240.0" y="526" class="n c">Cada posição só é preenchida quando o</text><text x="240.0" y="546" class="n c">número passa nas duas validações.</text></svg>