<svg xmlns="http://www.w3.org/2000/svg" width="480" height="546" viewBox="0 0 480 546"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">As 3 partes do para e a ordem em que rodam</text><rect x="20" y="52" width="440" height="40" rx="6" class="xW"/><text x="240" y="78" class="m c">para (c = 1; c &lt;= 5; c++) escreva(c)</text><rect x="80" y="118" width="320" height="52" rx="6" class="xB"/><text x="240.0" y="140.5" class="b c">1. início</text><text x="240.0" y="158.5" class="m c">c = 1 (uma vez só)</text><rect x="80" y="188" width="320" height="52" rx="6" class="xP"/><text x="240.0" y="210.5" class="b c">2. condição</text><text x="240.0" y="228.5" class="m c">c &lt;= 5 ? testada antes</text><path d="M240,170 L240,188" class="l" marker-end="url(#a)"/><rect x="80" y="258" width="320" height="52" rx="6" class="xG"/><text x="240.0" y="280.5" class="b c">3. corpo</text><text x="240.0" y="298.5" class="m c">escreva(c)</text><path d="M240,240 L240,258" class="l" marker-end="url(#a)"/><rect x="80" y="328" width="320" height="52" rx="6" class="xO"/><text x=