<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">enquanto: testa antes de cada volta</text><rect x="100" y="52" width="140" height="36" rx="18" class="xY"/><text x="170" y="75" class="b c">início</text><path d="M170,88 L170,104" class="l" marker-end="url(#a)"/><rect x="70" y="104" width="200" height="40" rx="6" class="xB"/><text x="170.0" y="129" class="m c">num = 1</text><path d="M170,144 L170,164" class="l" marker-end="url(#a)"/><polygon points="170,164 280.0,194.0 170,224 60.0,194.0" class="xO"/><text x="170" y="199.0" class="m b c">num &lt;= 100</text><text x="178" y="242" class="b">V</text><path d="M170,224 L170,250" class="l" marker-end="url(#a)"/><polygon points="90,250 270,250 250,290 70,290" class="xB"/><text x="170.0" y="275" class="m c">escreva(num)</text><rect x="70" y="306" width="200" height="40" rx="6" class="xO"/><text x="170.0" y="331" class="m c">num++</text><path d="M170,290 L170,306" class="l" marker-end="url(#a)"/><path d="M70,326 L40,326 L40,194 L60,194" class="l" marker-end="url(#a)"/><text x="46" y="224" class="s">volta</text><path d="M280,194 L390,194 L390,386" class="l" marker-end="url(#a)"/><text x="300" y="186" class="b">F</text><rect x="320" y="386" width="140" height="36" rx="18" class="xY"/><text x="390" y="409" class="b c">fim</text><text x="240.0" y="456" class="n c">O num++ garante que um dia a condição fique F.</text></svg>