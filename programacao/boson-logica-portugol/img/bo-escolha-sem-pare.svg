<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Esqueceu o pare? Os casos seguintes também rodam</text><text x="20" y="66" class="m b">opcao = 'a'</text><rect x="20" y="80" width="250" height="64" rx="6" class="xG"/><text x="145.0" y="108.5" class="m b c">caso 'a':</text><text x="145.0" y="126.5" class="m c">escreva("Maçã")</text><rect x="20" y="164" width="250" height="64" rx="6" class="xR"/><text x="145.0" y="192.5" class="m b c">caso 'b':</text><text x="145.0" y="210.5" class="m c">escreva("Banana")</text><path d="M145,144 L145,164" class="l" marker-end="url(#a)"/><rect x="20" y="248" width="250" height="64" rx="6" class="xY"/><text x="145.0" y="276.5" class="m b c">caso 'c':</text><text x="145.0" y="294.5" class="m c">escreva("Caju")  pare</text><path d="M145,228 L145,248" class="l" marker-end="url(#a)"/><text x="290" y="112" class="s">combina: entra</text><text x="290" y="196" class="s">sem pare: entra também</text><text x="290" y="280" class="s">o pare encerra aqui</text><rect x="20" y="344" width="440" height="60" rx="6" class="xW"/><text x="36" y="370" class="b">Saída:</text><text x="110" y="370" class="m">Maçã Banana Caju</text><text x="240.0" y="436" class="n c">Com pare em cada caso, a saída seria só 'Maçã'.</text></svg>