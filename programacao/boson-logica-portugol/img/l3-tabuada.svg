<svg xmlns="http://www.w3.org/2000/svg" width="400" height="376" viewBox="0 0 400 376"><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'Courier New',Menlo,Consolas,monospace}</style><rect width="100%" height="100%" fill="#FAF9F6"/><text x="200" y="24" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Exemplo de saída: tabuada do 7</text><rect x="20" y="40" width="360" height="322" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><path d="M28,41 h344 a7,7 0 0 1 7,7 v18 h-358 v-18 a7,7 0 0 1 7,-7 z" fill="#111827"/><circle cx="36" cy="54" r="4.5" fill="#B4472B"/><circle cx="51" cy="54" r="4.5" fill="#D9A520"/><circle cx="66" cy="54" r="4.5" fill="#22C55E"/><text x="200" y="58" font-size="12" fill="#D9D2C5" text-anchor="middle">Console</text><text x="36" y="88" class="m" font-size="13.5" fill="#9DBEF5" xml:space="preserve">Digite um número: 7</text><text x="36" y="129.8" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">7 x&#160; 0 = 0</text><text x="36" y="150.8" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">7 x&#160; 1 = 7</text><text x="36" y="171.7" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">7 x&#160; 2 = 14</text><text x="36" y="192.6" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">7 x&#160; 3 = 21</text><text x="36" y="213.6" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">7 x&#160; 4 = 28</text><text x="36" y="234.5" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">7 x&#160; 5 = 35</text><text x="36" y="255.4" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">7 x&#160; 6 = 42</text><text x="36" y="276.3" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">7 x&#160; 7 = 49</text><text x="36" y="297.2" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">7 x&#160; 8 = 56</text><text x="36" y="318.2" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">7 x&#160; 9 = 63</text><text x="36" y="339.1" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">7 x 10 = 70</text></svg>