<svg xmlns="http://www.w3.org/2000/svg" width="820" height="462" viewBox="0 0 820 462"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Troca com variável auxiliar, passo a passo (x = 5, y = 8)</text><text x="30" y="96" class="m" font-size="15" font-weight="bold" fill="#6B7280">início</text><text x="300" y="64" class="m" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">x</text><rect x="250" y="72" width="100" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.6"/><text x="300" y="100.3" class="m" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">5</text><text x="480" y="64" class="m" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">y</text><rect x="430" y="72" width="100" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.6"/><text x="480" y="100.3" class="m" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">8</text><text x="660" y="64" class="m" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">aux</text><rect x="610" y="72" width="100" height="44" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="660" y="98.5" class="m" font-size="13" fill="#6B7280" text-anchor="middle">vazia</text><text x="30" y="192" class="m" font-size="15" font-weight="bold" fill="#7C3AED">1. aux = x</text><text x="300" y="160" class="m" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">x</text><rect x="250" y="168" width="100" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.6"/><text x="300" y="196.3" class="m