xt x="698" y="95" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">executa</text><text x="698" y="115" font-size="11.5" fill="#6B7280" text-anchor="middle">rápido, várias vezes</text><text x="20" y="176" font-size="14" font-weight="bold" fill="#D97706">Interpretada</text><rect x="20" y="190" width="170" height="58" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="105" y="215" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">código-fonte</text><text x="105" y="235" font-size="11.5" fill="#6B7280" text-anchor="middle">o que escrevemos</text><line x1="192" y1="219" x2="222" y2="219" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="226" y="190" width="376" height="58" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="414" y="215" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">interpretador</text><text x="414" y="235" font-size="11.5" fill="#6B7280" text-anchor="middle">lê, traduz e executa uma instrução por vez</text><line x1="604" y1="219" x2="634" y2="219" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="638" y="190" width="120" height="58" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="698" y="215" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">resultado</text><text x="698" y="235" font-size="11.5" fill="#6B7280" text-anchor="middle">na hora</text><text x="390" y="282" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Exemplos: C e C++ costumam ser compiladas; Python e JavaScript, interpretadas.</text></svg>