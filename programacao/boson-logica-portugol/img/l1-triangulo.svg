<svg xmlns="http://www.w3.org/2000/svg" width="480" height="456" viewBox="0 0 480 456"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Área do triângulo = base × altura / 2</text><rect x="120" y="60" width="240" height="144" rx="0" class="xY"/><rect x="120" y="60" width="240" height="144" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="5 4"/><polygon points="120,204 360,204 264.0,60" class="xG"/><path d="M264.0,60 L264.0,204" class="l d"/><text x="256.0" y="157.0" class="b r">altura = 6</text><text x="240.0" y="228" class="b c">base = 10</text><text x="240.0" y="254" class="n c">O triângulo ocupa metade do retângulo.</text><rect x="60" y="274" width="360" height="44" rx="6" class="xY"/><text x="240.0" y="300.5" class="m b c">area = (base * altura) / 2</text><rect x="60" y="334" width="360" height="44" rx="6" class="xO"/><text x="240.0" y="360.5" class="m b c">(10 * 6) / 2</text><path d="M240.0,318 L240.0,334" class="l" marker-end="url(#a)"/><rect x="60" y="394" width="360" height="44" rx="6" class="xG"/><text x="240.0" y="420.5" class="m b c">30 cm²</text><path d="M240.0,378 L240.0,394" class="l" marker-end="url(#a)"/></svg>