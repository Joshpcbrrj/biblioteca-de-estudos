<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" viewBox="0 0 760 296"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Área do triângulo = base × altura / 2</text><rect x="80" y="80" width="300" height="170" rx="0" fill="#fff" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M80,250 L380,250 L260,80 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><line x1="260" y1="80" x2="260" y2="250" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 4"/><text x="268" y="175" font-size="13.5" font-weight="bold" fill="#7C3AED">altura = 6</text><text x="230" y="276" font-size="13.5" font-weight="bold" fill="#D97706" text-anchor="middle">base = 10</text><text x="230" y="72" font-size="11.5" font-style="italic" fill="#6B7280" text-anchor="middle">o triângulo ocupa metade do retângulo</text><rect x="450" y="100" width="270" height="130" rx="8" fill="#fff" stroke="#9CA3AF" stroke-width="1.5"/><text x="585" y="132" class="m" font-size="11" fill="#2563EB" text-anchor="middle">area_do_tri = (base * altura) / 2</text><text x="585" y="170" class="m" font-size="18" fill="#1F2937" text-anchor="middle">(10 * 6) / 2</text><text x="585" y="208" class="m" font-size="20" font-weight="bold" fill="#16A34A" text-anchor="middle">= 30 cm²</text></svg>