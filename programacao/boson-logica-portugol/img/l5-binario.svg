<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">65 em binário: divisões sucessivas por 2</text><rect x="20" y="56" width="220" height="34" rx="6" class="xW"/><text x="40" y="79" class="m">65 / 2 = 32</text><text x="256" y="79" class="s">resto</text><rect x="300" y="56" width="40" height="34" rx="6" class="xO"/><text x="320" y="79" class="m b c">1</text><rect x="20" y="98" width="220" height="34" rx="6" class="xW"/><text x="40" y="121" class="m">32 / 2 = 16</text><text x="256" y="121" class="s">resto</text><rect x="300" y="98" width="40" height="34" rx="6" class="xY"/><text x="320" y="121" class="m b c">0</text><rect x="20" y="140" width="220" height="34" rx="6" class="xW"/><text x="40" y="163" class="m">16 / 2 = 8</text><text x="256" y="163" class="s">resto</text><rect x="300" y="140" width="40" height="34" rx="6" class="xY"/><text x="320" y="163" class="m b c">0</text><rect x="20" y="182" width="220" height="34" rx="6" class="xW"/><text x="40" y="205" class="m">8 / 2 = 4</text><text x="256" y="205" class="s">resto</text><rect x="300" y="182" width="40" height="34" rx="6" class="xY"/><text x="320" y="205" class="m b c">0</text><rect x="20" y="224" width="220" height="34" rx="6" class="xW"/><text x="40" y="247" class="m">4 / 2 = 2</text><text x="256" y="247" class="s">resto</text><rect x="300" y="224" width="40" height="34" rx="6" class="xY"/><text x="320" y="247" class="m b c">0</text><rect x="20" y="266" width="220" height="34" rx="6" class="xW"/><text x="40" y="289" class="m">2 / 2 = 1</text><text x="256" y="289" class="s">resto</text><rect x="300" y="266" width="40" height="34" rx="6" class="xY"/><text x="320" y="289" class="m b c">0</text><rect x="20" y="308" width="220" height="34" rx="6" class="xW"/><text x="40" y="331" class="m">1 / 2 = 0</text><text x="256" y="331" class="s">resto</text><rect x="300" y="308" width="40" height="34" rx="6" class="xO"/><text x="320" y="331" class="m b c">1</text><path d="M370,325 L370,73" class="l" marker-end="url(#a)"/><text x="380" y="180" class="s">leia</text><text x="380" y="196" class="s">de baixo</text><text x="380" y="212" class="s">para cima</text><rect x="80" y="360" width="320" height="44" rx="6" class="xG"/><text x="240" y="388" class="m b c">65 = 1000001</text><text x="240.0" y="436" class="n c">num % 2 dá o resto;</text><text x="240.0" y="456" class="n c">num / 2 (inteira) dá o próximo número.</text></svg>