<svg xmlns="http://www.w3.org/2000/svg" width="480" height="350" viewBox="0 0 480 350"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">x++ × ++x dentro de uma expressão</text><text x="20" y="66" class="b">Começando com x = 5:</text><rect x="20" y="80" width="210" height="190" rx="6" class="xB"/><text x="125" y="106" class="m b c">y = x++</text><text x="36" y="138" class="s">1. y recebe 5</text><text x="36" y="160" class="s">2. x vira 6</text><rect x="36" y="196" width="178" height="56" rx="6" class="xW"/><text x="125.0" y="220.5" class="m b c">y = 5</text><text x="125.0" y="238.5" class="m c">x = 6</text><rect x="250" y="80" width="210" height="190" rx="6" class="xG"/><text x="355" y="106" class="m b c">y = ++x</text><text x="266" y="138" class="s">1. x vira 6</text><text x="266" y="160" class="s">2. y recebe 6</text><rect x="266" y="196" width="178" height="56" rx="6" class="xW"/><text x="355.0" y="220.5" class="m b c">y = 6</text><text x="355.0" y="238.5" class="m c">x = 6</text><text x="20" y="306" class="s">Sozinho numa linha (x++), tanto faz: x vira 6.</text><text x="20" y="326" class="s">Pós: usa e depois soma. Pré: soma e depois usa.</text></svg>