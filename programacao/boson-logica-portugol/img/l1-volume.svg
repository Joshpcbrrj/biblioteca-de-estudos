<svg xmlns="http://www.w3.org/2000/svg" width="760" height="314" viewBox="0 0 760 314"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Volume da caixa d&#x27;água = altura × largura × profundidade</text><path d="M110,110 L190,60 L390,60 L310,110 Z" fill="#BFDBFE" stroke="#2563EB" stroke-width="2"/><path d="M310,110 L390,60 L390,200 L310,250 Z" fill="#93C5FD" stroke="#2563EB" stroke-width="2"/><rect x="110" y="110" width="200" height="140" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="210" y="276" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">largura = 50 cm</text><text x="96" y="184" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="end">altura</text><text x="96" y="202" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="end">= 40 cm</text><text x="366" y="259" font-size="13" font-weight="bold" fill="#1F2937">profundidade = 30 cm</text><rect x="470" y="90" width="260" height="140" rx="8" fill="#fff" stroke="#9CA3AF" stroke-width="1.5"/><text x="600" y="122" class="m" font-size="11.5" fill="#2563EB" text-anchor="middle">vol = altura * largura * profund</text><text x="600" y="160" class="m" font-size="17" fill="#1F2937" text-anchor="middle">40 * 50 * 30</text><text x="600" y="198" class="m" font-size="19" font-weight="bold" fill="#16A34A" text-anchor="middle">= 60000 cm³</text><text x="600" y="220" font-size="12.5" fill="#6B7280" text-anchor="middle">(60 litros)</text><text x="380" y="296" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Como as medidas estão em cm, o volume sai em cm³ (1000 cm³ = 1 litro).</text></svg>