<svg xmlns="http://www.w3.org/2000/svg" width="480" height="488" viewBox="0 0 480 488"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Volume da caixa d'água</text><polygon points="110,70 160,40 360,40 310,70" class="xB"/><polygon points="310,70 360,40 360,170 310,200" class="xP"/><rect x="110" y="70" width="200" height="130" rx="0" class="xB"/><text x="210.0" y="224" class="b c">largura = 50 cm</text><text x="100" y="140.0" class="b r">altura</text><text x="100" y="159.0" class="b r">40 cm</text><text x="366" y="115.0" class="b">profund.</text><text x="366" y="134.0" class="b">30 cm</text><rect x="50" y="250" width="380" height="46" rx="6" class="xY"/><text x="240.0" y="277.5" class="m b c">vol = altura * largura * profund</text><rect x="50" y="312" width="380" height="46" rx="6" class="xO"/><text x="240.0" y="339.5" class="m b c">40 * 50 * 30</text><path d="M240.0,296 L240.0,312" class="l" marker-end="url(#a)"/><rect x="50" y="374" width="380" height="46" rx="6" class="xG"/><text x="240.0" y="393.5" class="m b c">60000 cm³</text><text x="240.0" y="411.5" class="m c">= 60 litros</text><path d="M240.0,358 L240.0,374" class="l" marker-end="url(#a)"/><text x="240.0" y="444" class="n c">Medidas em cm dão volume em cm³.</text><text x="240.0" y="464" class="n c">1000 cm³ = 1 litro.</text></svg>