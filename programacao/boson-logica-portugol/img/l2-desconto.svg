<svg xmlns="http://www.w3.org/2000/svg" width="480" height="388" viewBox="0 0 480 388"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Desconto de 10% a partir de R$ 100</text><polygon points="80,52 420,52 400,92 60,92" class="xB"/><text x="240.0" y="77" class="m c">leia(compra)</text><path d="M170,92 L170,108" class="l" marker-end="url(#a)"/><polygon points="170,108 290.0,137.0 170,166 50.0,137.0" class="xO"/><text x="170" y="142.0" class="m b c">compra &gt;= 100.00</text><text x="178" y="186" class="b">F</text><text x="298" y="128" class="b">V</text><rect x="300" y="184" width="170" height="58" rx="6" class="xG"/><text x="385.0" y="209.5" class="m b c">total =</text><text x="385.0" y="227.5" class="m c">compra * 0.9</text><path d="M290,137 L385,137 L385,184" class="l" marker-end="url(#a)"/><rect x="70" y="198" width="200" height="44" rx="6" class="xY"/><text x="170.0" y="224.5" class="m b c">total = compra</text><path d="M170,166 L170,198" class="l" marker-end="url(#a)"/><path d="M170,242 L170,278" class="l"/><path d="M385,242 L385,278 L170,278" class="l"/><polygon points="80,294 420,294 400,334 60,334" class="xG"/><text x="240.0" y="319" class="m c">escreva("Total: R$ ", total)</text><path d="M240,278 L240,294" class="l" marker-end="url(#a)"/><text x="240.0" y="364" class="n c">R$ 150,00 → desconto de R$ 15,00 → paga R$ 135,00.</text></svg>