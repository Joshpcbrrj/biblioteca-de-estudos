<svg xmlns="http://www.w3.org/2000/svg" width="480" height="468" viewBox="0 0 480 468"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">leia() guarda; escreva() mostra</text><rect x="140" y="52" width="200" height="48" rx="6" class="xY"/><text x="240.0" y="72.5" class="b c">teclado</text><text x="240.0" y="90.5" class="s c">usuário digita Ana</text><rect x="140" y="128" width="200" height="48" rx="6" class="xB"/><text x="240.0" y="148.5" class="m b c">leia(nome)</text><text x="240.0" y="166.5" class="s c">entrada</text><rect x="140" y="204" width="200" height="56" rx="6" class="xO"/><text x="240.0" y="228.5" class="m b c">nome = "Ana"</text><text x="240.0" y="246.5" class="s c">memória (variável)</text><rect x="100" y="288" width="280" height="48" rx="6" class="xG"/><text x="240.0" y="308.5" class="m b c">escreva("Olá, ", nome)</text><text x="240.0" y="326.5" class="s c">saída</text><rect x="140" y="364" width="200" height="48" rx="6" class="xP"/><text x="240.0" y="392.5" class="m b c">tela: Olá, Ana</text><path d="M240,100 L240,128" class="l" ma