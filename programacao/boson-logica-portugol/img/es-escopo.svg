<svg xmlns="http://www.w3.org/2000/svg" width="780" height="388" viewBox="0 0 780 388"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="390" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Quem enxerga o quê: escopo global e local</text><rect x="30" y="46" width="720" height="300" rx="10" fill="#F9FAFB" stroke="#374151" stroke-width="2"/><text x="48" y="70" class="m" font-size="14" font-weight="bold" fill="#1F2937">programa { }</text><rect x="260" y="56" width="260" height="40" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="390" y="81" class="m" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">real numero_global</text><text x="535" y="81" font-size="12" fill="#2563EB">global: visível em todo o programa</text><rect x="60" y="120" width="310" height="200" rx="8" fill="#fff" stroke="#16A34A" stroke-width="2"/><text x="74" y="144" class="m" font-size="14" font-weight="bold" fill="#16A34A">funcao inicio()</text><rect x="80" y="160" width="270" height="38" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="215" y="184" class="m" font-size="13" fill="#1F2937" text-anchor="middle">real numero_local_inicio</text><text x="215" y="216" font-size="12" fill="#6B7280" text-anchor="middle">local: só existe aqui dentro</text><rect x="410" y="120" width="310" height="200" rx="8" fill="#fff" stroke="#D97706" stroke-width="2"/><text x="424" y="144" class="m" font-size="14" font-weight="bold" fill="#D97706">funcao calcula()</text><rect x="430" y="160" width="270" height="38" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="565" y="184" class="m" font-size="13" fill="#1F2937" text-anchor="middle">real numero_local_calcula</text><text x="565" y="216" font-size="12" fill="#6B7280" text-anchor="middle">local: só existe aqui dentro</text><text x="215" y="256" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">✓ usa numero_global</text><text x="215" y="282" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">✗ não vê numero_local_calcula</text><text x="565" y="256" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">✓ usa numero_global</text><text x="565" y="282" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">✗ não vê numero_local_inicio</text><text x="390" y="370" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">A variável local nasce quando a função começa e some quando ela termina.</text></svg>