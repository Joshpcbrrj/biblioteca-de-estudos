<svg xmlns="http://www.w3.org/2000/svg" width="480" height="306" viewBox="0 0 480 306"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Fibonacci: cada termo soma os dois anteriores</text><rect x="26" y="96" width="40" height="40" rx="6" class="xB"/><text x="46" y="122" class="m b c">0</text><text x="46" y="154" class="s c">1º</text><rect x="70" y="96" width="40" height="40" rx="6" class="xB"/><text x="90" y="122" class="m b c">1</text><text x="90" y="154" class="s c">2º</text><rect x="114" y="96" width="40" height="40" rx="6" class="xO"/><text x="134" y="122" class="m b c">1</text><text x="134" y="154" class="s c">3º</text><rect x="158" y="96" width="40" height="40" rx="6" class="xB"/><text x="178" y="122" class="m b c">2</text><text x="178" y="154" class="s c">4º</text><rect x="202" y="96" width="40" height="40" rx="6" class="xB"/><text x="222" y="122" class="m b c">3</text><text x="222" y="154" class="s c">5º</text><rect x="246" y="96" width="40" height="40" rx="6" class="xB"/><text x="266" y="122" class="m b c">5</text><text x="266" y="154" class="s c">6º</text><rect x="290" y="96" width="40" height="40" rx="6" class="xB"/><text x="310" y="122" class="m b c">8</text><text x="310" y="154" class="s c">7º</text><rect x="334" y="96" width="40" height="40" rx="6" class="xO"/><text x="354" y="122" class="m b c">13</text><text x="354" y="154" class="s c">8º</text><rect x="378" y="96" width="40" height="40" rx="6" class="xB"/><text x="398" y="122" class="m b c">21</text><text x="398" y="154" class="s c">9º</text><rect x="422" y="96" width="40" height="40" rx="6" class="xB"/><text x="442" y="122" class="m b c">34</text><text x="442" y="154" class="s c">10º</text><path d="M46,92 Q68,72 90,92" class="l"/><path d="M90,92 Q112,72 134,92" class="l"/><text x="90" y="66" class="s c">0 + 1 = 1</text><rect x="20" y="172" width="440" height="58" rx="6" class="xW"/><text x="36" y="196" class="m">fibonacci(0) = 0, fibonacci(1) = 1</text><text x="36" y="218" class="m">n-ésimo termo = fibonacci(n - 1)</text><text x="240.0" y="262" class="n c">Ex.: 3º termo = fibonacci(2) = 1;</text><text x="240.0" y="282" class="n c">8º termo = fibonacci(7) = 13.</text></svg>