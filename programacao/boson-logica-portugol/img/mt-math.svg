<svg xmlns="http://www.w3.org/2000/svg" width="820" height="314" viewBox="0 0 820 314"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Matriz na matemática: A com m linhas e n colunas (m × n)</text><text x="210" y="168" font-size="24" font-weight="bold" fill="#1F2937" text-anchor="end">A =</text><path d="M260,60 H250 V260 H260" fill="none" stroke="#1F2937" stroke-width="2.5"/><path d="M580,60 H590 V260 H580" fill="none" stroke="#1F2937" stroke-width="2.5"/><text x="295" y="94" font-size="20" font-style="italic" fill="#1F2937" text-anchor="middle">a₁₁</text><text x="377" y="94" font-size="20" font-style="italic" fill="#1F2937" text-anchor="middle">a₁₂</text><text x="459" y="94" font-size="20" fill="#1F2937" text-anchor="middle">…</text><text x="541" y="94" font-size="20" font-style="italic" fill="#1F2937" text-anchor="middle">a₁ₙ</text><text x="295" y="140" font-size="20" font-style="italic" fill="#1F2937" text-anchor="middle">a₂₁</text><text x="377" y="140" font-size="20" font-style="italic" fill="#7C3AED" text-anchor="middle">a₂₂</text><text x="459" y="140" font-size="20" fill="#1F2937" text-anchor="middle">…</text><text x="541" y="140" font-size="20" font-style="italic" fill="#1F2937" text-anchor="middle">a₂ₙ</text><text x="295" y="186" font-size="20" fill="#1F2937" text-anchor="middle">⋮</text><text x="377" y="186" font-size="20" fill="#1F2937" text-anchor="middle">⋮</text><text x="541" y="186" font-size="20" fill="#1F2937" text-anchor="middle">⋮</text><text x="295" y="232" font-size="20" font-style="italic" fill="#1F2937" text-anchor="middle">aₘ₁</text><text x="377" y="232" font-size="20" font-style="italic" fill="#1F2937" text-anchor="middle">aₘ₂</text><text x="459" y="232" font-size="20" fill="#1F2937" text-anchor="middle">…</text><text x="541" y="232" font-size="20" font-style="italic" fill="#1F2937" text-anchor="middle">aₘₙ</text><text x="620" y="120" font-size="22" font-weight="bold" font-style="italic" fill="#7C3AED">aᵢⱼ</text><text x="620" y="148" font-size="14" fill="#1F2937">i = número da linha</text><text x="620" y="170" font-size="14" fill="#1F2937">j = número da coluna</text><text x="620" y="200" font-size="13" font-style="italic" fill="#6B7280">ex.: a₂₂ = linha 2,</text><text x="620" y="218" font-size="13" font-style="italic" fill="#6B7280">coluna 2</text><text x="410" y="296" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Na matemática a contagem começa em 1; na programação, linhas e colunas começam em 0.</text></svg>