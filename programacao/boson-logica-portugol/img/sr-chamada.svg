<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">O caminho de uma chamada de função</text><rect x="20" y="50" width="360" height="230" rx="10" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="36" y="74" class="m" font-size="14" font-weight="bold" fill="#2563EB">funcao inicio()</text><text x="40" y="110" class="m" font-size="12.5" fill="#1F2937">leia(larg)&#160;&#160; // 20.0</text><text x="40" y="144" class="m" font-size="12.5" fill="#1F2937">leia(comp)&#160;&#160; // 30.0</text><text x="40" y="178" class="m" font-size="12.5" font-weight="bold" fill="#2563EB">area_total = calcula_area(larg, comp)</text><text x="40" y="212" class="m" font-size="12.5" fill="#1F2937">escreva(area_total)&#160; // 600.0</text><rect x="440" y="70" width="340" height="170" rx="10" fill="#fff" stroke="#16A34A" stroke-width="2"/><text x="456" y="94" class="m" font-size="13" font-weight="bold" fill="#16A34A">funcao real calcula_area(</text><text x="476" y="114" class="m" font-size="13" font-weight="bold" fill="#16A34A">real largura, real comprimento)</text><text x="470" y="150" class="m" font-size="12.5" fill="#1F2937">area = largura * comprimento</text><text x="470" y="184" class="m" font-size="13" font-weight="bold" fill="#D97706">retorne area</text><path d="M330,170 C390,170 390,110 440,110" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><circle cx="400" cy="128" r="11" fill="#2563EB"/><text x="400" y="133" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1</text><path d="M440,190 C400,190 400,174 340,174" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#aro)"/><circle cx="400" cy="196" r="11" fill="#D97706"/><text x="400" y="201" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="40" y="310" font-size="12.5" fill="#2563EB">① os valores de larg e comp são copiados para largura e comprimento</text><text x="40" y="332" font-size="12.5" fill="#D97706">② o retorne devolve 600.0, que é gravado em area_total; inicio() continua de onde parou</text></svg>