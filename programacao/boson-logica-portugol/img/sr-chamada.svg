<svg xmlns="http://www.w3.org/2000/svg" width="480" height="466" viewBox="0 0 480 466"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">O caminho de uma chamada de função</text><rect x="20" y="52" width="440" height="150" rx="6" class="xB"/><text x="36" y="76" class="m b">funcao inicio()</text><text x="36" y="104" class="m">leia(larg)    // 20.0</text><text x="36" y="128" class="m">leia(comp)    // 30.0</text><text x="36" y="152" class="m">area_total = calcula_area(larg, comp)</text><text x="36" y="176" class="m">escreva(area_total)    // 600.0</text><rect x="20" y="262" width="440" height="110" rx="6" class="xG"/><text x="36" y="286" class="m b">funcao real calcula_area(</text><text x="36" y="306" class="m b">    real largura, real comprimento)</text><text x="36" y="334" class="m">area = largura * comprimento</text><text x="36" y="358" class="m">retorne area</text><path d="M60,202 L60,262" class="l" marker-end="url(#a)"/><circle cx="80" cy="232" r="11" class="xO"/><text x="80" y="237" class="b c">1</text><path d="M420,262 L420,202" class="l" marker-end="url(#a)"/><circle cx="400" cy="232" r="11" class="xO"/><text x="400" y="237" class="b c">2</text><text x="98" y="237" class="s">copia 20.0 e 30.0</text><text x="382" y="237" class="s r">devolve 600.0</text><text x="240.0" y="402" class="n c">1: os valores são copiados para os parâmetros.</text><text x="240.0" y="422" class="n c">2: o retorne entrega 600.0 em area_total,</text><text x="240.0" y="442" class="n c">e inicio() continua de onde parou.</text></svg>