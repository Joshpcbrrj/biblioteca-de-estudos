<svg xmlns="http://www.w3.org/2000/svg" width="480" height="304" viewBox="0 0 480 304"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">para percorre o vetor pelo índice</text><rect x="20" y="50" width="440" height="40" rx="6" class="xW"/><text x="240" y="75" class="m b c">para (i = 0; i &lt; 10; i++)  v[i] = i * 2</text><rect x="26" y="130" width="39" height="40" rx="3" class="xG"/><text x="45.5" y="155.0" class="m b c">0</text><text x="45.5" y="186" class="s c">[0]</text><rect x="69" y="130" width="39" height="40" rx="3" class="xG"/><text x="88.5" y="155.0" class="m b c">2</text><text x="88.5" y="186" class="s c">[1]</text><rect x="112" y="130" width="39" height="40" rx="3" class="xG"/><text x="131.5" y="155.0" class="m b c">4</text><text x="131.5" y="186" class="s c">[2]</text><rect x="155" y="130" width="39" height="40" rx="3" class="xO"/><text x="174.5" y="155.0" class="m b c">6</text><text x="174.5" y="186" class="s c">[3]</text><rect x="198" y="130" width="39" height="40" rx="3" class="xW"/><text x="217.5" y="155.0" class="m b c">8</text><text x="217.5" y="186" class="s c">[4]</text><rect x="241" y="130" width="39" height="40" rx="3" class="xW"/><text x="260.5" y="155.0" class="m b c">10</text><text x="260.5" y="186" class="s c">[5]</text><rect x="284" y="130" width="39" height="40" rx="3" class="xW"/><text x="303.5" y="155.0" class="m b c">12</text><text x="303.5" y="186" class="s c">[6]</text><rect x="327" y="130" width="39" height="40" rx="3" class="xW"/><text x="346.5" y="155.0" class="m b c">14</text><text x="346.5" y="186" class="s c">[7]</text><rect x="370" y="130" width="39" height="40" rx="3" class="xW"/><text x="389.5" y="155.0" class="m b c">16</text><text x="389.5" y="186" class="s c">[8]</text><rect x="413" y="130" width="39" height="40" rx="3" class="xW"/><text x="432.5" y="155.0" class="m b c">18</text><text x="432.5" y="186" class="s c">[9]</text><text x="174" y="122" class="m b c" style="fill:#D97706">i = 3</text><text x="45" y="206" class="s" style="fill:#16A34A">já gravados</text><text x="240.0" y="240" class="n c">A cada volta, i aponta uma posição:</text><text x="240.0" y="260" class="n c">grava (ou lê) v[i] e passa para a próxima.</text><text x="240.0" y="280" class="n c">i &lt; 10, e não &lt;=: v[10] não existe.</text></svg>