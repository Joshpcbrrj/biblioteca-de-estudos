<svg xmlns="http://www.w3.org/2000/svg" width="500" height="274" viewBox="0 0 500 274"><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'Courier New',Menlo,Consolas,monospace}</style><rect width="100%" height="100%" fill="#FAF9F6"/><text x="250" y="24" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Exemplo de saída: 4 conjuntos com 5 números</text><rect x="20" y="40" width="460" height="196.5" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><path d="M28,41 h444 a7,7 0 0 1 7,7 v18 h-458 v-18 a7,7 0 0 1 7,-7 z" fill="#111827"/><circle cx="36" cy="54" r="4.5" fill="#B4472B"/><circle cx="51" cy="54" r="4.5" fill="#D9A520"/><circle cx="66" cy="54" r="4.5" fill="#22C55E"/><text x="250" y="58" font-size="12" fill="#D9D2C5" text-anchor="middle">Console</text><text x="36" y="88" class="m" font-size="13.5" fill="#9DBEF5" xml:space="preserve">Quantos conjuntos? 4</text><text x="36" y="108.9" class="m" font-size="13.5" fill="#9DBEF5" xml:space="preserve">Quantos números em cada? 5</text><text x="36" y="150.8" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">Conjunto 1:&#160; 42&#160;&#160; 20&#160;&#160; 51&#160;&#160; 84&#160; &#160; 7</text><text x="36" y="171.7" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">Conjunto 2:&#160; 10&#160;&#160; 69&#160;&#160; 13&#160;&#160; 47&#160;&#160; 75</text><text x="36" y="192.6" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">Conjunto 3:&#160;&#160; 8&#160;&#160; 65&#160;&#160; 28&#160; &#160; 5&#160;&#160; 12</text><text x="36" y="213.6" class="m" font-size="13.5" fill="#E4DED3" xml:space="preserve">Conjunto 4:&#160; 56&#160;&#160; 54&#160; &#160; 9&#160;&#160; 31&#160;&#160; 12</text><text x="250" y="262.5" font-size="13" font-style="italic" fill="#7A7F8C" text-anchor="middle">Os números são sorteados de 1 a 100; cada execução gera valores diferentes.</text></svg>