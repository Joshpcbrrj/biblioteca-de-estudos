<svg xmlns="http://www.w3.org/2000/svg" width="480" height="372" viewBox="0 0 480 372"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Velocidade: conversão e tempo de viagem</text><text x="20" y="64" class="b">1. km/h → m/s: divida por 3,6</text><rect x="20" y="76" width="440" height="62" rx="6" class="xB"/><text x="36" y="100" class="m">1 km/h = 1000 m / 3600 s</text><text x="36" y="124" class="m">90 / 3.6 = 25 m/s</text><text x="20" y="170" class="b">2. tempo = distância / velocidade</text><circle cx="60" cy="210" r="9" class="xO"/><circle cx="420" cy="210" r="9" class="xO"/><path d="M70,210 L410,210" class="l d"/><text x="60" y="240" class="s c">São Paulo</text><text x="420" y="240" class="s c">Rio</text><text x="240" y="202" class="b c">≈ 435 km</text><rect x="20" y="256" width="440" height="62" rx="6" class="xG"/><text x="36" y="280" class="m">435 / 90 ≈ 4.83 h</text><text x="36" y="304" class="m">cerca de 4 h 50 min</text><text x="240.0" y="348" class="n c">km com km/h dá o tempo em horas.</text></svg>