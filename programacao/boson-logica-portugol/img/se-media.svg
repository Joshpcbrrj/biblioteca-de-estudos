<svg xmlns="http://www.w3.org/2000/svg" width="480" height="532" viewBox="0 0 480 532"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">se simples: o bloco só roda quando é V</text><rect x="170" y="52" width="140" height="36" rx="18" class="xY"/><text x="240" y="75" class="b c">início</text><path d="M240,88 L240,104" class="l" marker-end="url(#a)"/><polygon points="80,104 420,104 400,144 60,144" class="xB"/><text x="240" y="129" class="m c">leia(nota_1, nota_2, nota_3)</text><path d="M240,144 L240,160" class="l" marker-end="url(#a)"/><rect x="60" y="160" width="360" height="40" rx="6" class="xB"/><text x="240" y="185" class="m c">media = (nota_1 + nota_2 + nota_3) / 3</text><path d="M240,200 L240,216" class="l" marker-end="url(#a)"/><polygon points="170,216 270.0,246.0 170,276 70.0,246.0" class="xO"/><text x="170" y="251.0" class="m b c">media &gt;= 7</text><rect x="310" y="296" width="150" height="44" rx="6" class="xG"/><text x="385.0" y="322.5" class="m b c">"Aprovado"</text><path d="M270,246 L385,246 L385,296" class="l" marker-end="url(#a)"/><text x="392" y="240" class="b">V</text><path d="M385,340 L385,366 L170,366" class="l"/><path d="M170,276 L170,386" class="l" marker-end="url(#a)"/><text x="178" y="316" class="b">F</text><polygon points="80,386 420,386 400,426 60,426" class="xG"/><text x="240" y="411" class="m c">escreva("Sua média foi: ", media)</text><path d="M240,426 L240,442" class="l" marker-end="url(#a)"/><rect x="170" y="442" width="140" height="36" rx="18" class="xY"/><text x="240" y="465" class="b c">fim</text><text x="240.0" y="508" class="n c">Se der F, o bloco é pulado e o programa segue.</text></svg>