<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Área do retângulo = largura × comprimento</text><rect x="150" y="70" width="320" height="180" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/><line x1="190" y1="70" x2="190" y2="250" stroke="#93C5FD" stroke-width="1"/><line x1="230" y1="70" x2="230" y2="250" stroke="#93C5FD" stroke-width="1"/><line x1="270" y1="70" x2="270" y2="250" stroke="#93C5FD" stroke-width="1"/><line x1="310" y1="70" x2="310" y2="250" stroke="#93C5FD" stroke-width="1"/><line x1="350" y1="70" x2="350" y2="250" stroke="#93C5FD" stroke-width="1"/><line x1="390" y1="70" x2="390" y2="250" stroke="#93C5FD" stroke-width="1"/><line x1="430" y1="70" x2="430" y2="250" stroke="#93C5FD" stroke-width="1"/><line x1="150" y1="115" x2="470" y2="115" stroke="#93C5FD" stroke-width="1"/><line x1="150" y1="160" x2="470" y2="160" stroke="#93C5FD" stroke-width="1"/><line x1="150" y1="205" x2="470" y2="205" stroke="#93C5FD" stroke-width="1"/><path d="M150,272 V282 H470 V272" fill="none" stroke="#6B7280" stroke-width="1.6"/><text x="310" y="302" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">comprimento = 8 m</text><path d="M128,70 H118 V250 H128" fill="none" stroke="#6B7280" stroke-width="1.6"/><text x="108" y="165" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="end">largura = 4 m</text><rect x="520" y="120" width="260" height="80" rx="10" fill="#fff" stroke="#9CA3AF" stroke-width="1.5"/><text x="650" y="152" class="m" font-size="20" font-weight="bold" fill="#2563EB" text-anchor="middle">4 × 8 = 32 m²</text><text x="650" y="180" font-size="12.5" font-style="italic" fill="#6B7280" text-anchor="middle">32 quadradinhos de 1 m²</text></svg>