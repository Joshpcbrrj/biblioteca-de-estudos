<svg xmlns="http://www.w3.org/2000/svg" width="760" height="308" viewBox="0 0 760 308"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Divisão inteira e resto: 17 / 5 e 17 % 5</text><text x="140" y="100" class="m" font-size="30" font-weight="bold" fill="#1F2937" text-anchor="middle">17</text><path d="M180,70 L180,118 L270,118" fill="none" stroke="#1F2937" stroke-width="2"/><text x="225" y="100" class="m" font-size="30" font-weight="bold" fill="#1F2937" text-anchor="middle">5</text><text x="225" y="150" class="m" font-size="30" font-weight="bold" fill="#2563EB" text-anchor="middle">3</text><text x="134" y="150" class="m" font-size="24" fill="#6B7280" text-anchor="middle">-15</text><line x1="90" y1="162" x2="170" y2="162" stroke="#6B7280" stroke-width="1.5"/><text x="140" y="194" class="m" font-size="30" font-weight="bold" fill="#D97706" text-anchor="middle">2</text><text x="225" y="182" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">quociente</text><text x="140" y="216" font-size="12" font-weight="bold" fill="#D97706" text-anchor="middle">resto</text><rect x="380" y="70" width="350" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="555" y="108" class="m" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">17 / 5&#160; →&#160; 3</text><text x="555" y="148" font-size="12.5" fill="#6B7280" text-anchor="middle">com inteiros, a divisão descarta a sobra</text><rect x="380" y="170" width="350" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="555" y="208" class="m" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">17 % 5&#160; →&#160; 2</text><text x="555" y="248" font-size="12.5" fill="#6B7280" text-anchor="middle">% devolve só o que sobrou</text><text x="380" y="290" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Uso clássico: numero % 2 == 0 diz se um número é par.</text></svg>