<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="390" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Pesquisa linear: compara posição por posição</text><text x="60" y="82" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">busca 6</text><rect x="130" y="60" width="60" height="44" rx="5" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.8"/><text x="160" y="88" class="m" font-size="17" fill="#1F2937" text-anchor="middle">8</text><text x="160" y="120" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[0]</text><rect x="190" y="60" width="60" height="44" rx="5" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.8"/><text x="220" y="88" class="m" font-size="17" fill="#1F2937" text-anchor="middle">3</text><text x="220" y="120" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[1]</text><rect x="250" y="60" width="60" height="44" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="280" y="88" class="m" font-size="17" fill="#1F2937" text-anchor="middle">6</text><text x="280" y="120" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[2]</text><rect x="310" y="60" width="60" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="340" y="88" class="m" font-size="17" fill="#1F2937" text-anchor="middle">1</text><text x="340" y="120" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[3]</text><rect x="370" y="60" width="60" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="400" y="88" class="m" font-size="17" fill="#1F2937" text-anchor="middle">9</text><text x="400" y="120" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[4]</text><text x="160" y="140" font-size="12" fill="#6B7280" text-anchor="middle">8 ≠ 6</text><text x="220" y="140" font-size="12" fill="#6B7280" text-anchor="middle">3 ≠ 6</text><text x="280" y="140" font-size="12" font-weight="bold" fill="#16A34A" text-anchor="middle">6 = 6 ✓</text><text x="560" y="82" font-size="14" font-weight="bold" fill="#16A34A">encontrado na posição 2</text><text x="560" y="104" font-size="12" fill="#6B7280">(3 comparações)</text><text x="60" y="202" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">busca 4</text><rect x="130" y="180" width="60" height="44" rx="5" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.8"/><text x="160" y="207.9" class="m" font-size="17" fill="#1F2937" text-anchor="middle">8</text><text x="160" y="240" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[0]</text><rect x="190" y="180" width="60" height="44" rx="5" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.8"/><text x="220" y="207.9" class="m" font-size="17" fill="#1F2937" text-anchor="middle">3</text><text x="220" y="240" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[1]</text><rect x="250" y="180" width="60" height="44" rx="5" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.8"/><text x="280" y="207.9" class="m" font-size="17" fill="#1F2937" text-anchor="middle">6</text><text x="280" y="240" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[2]</text><rect x="310" y="180" width="60" height="44" rx="5" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.8"/><text x="340" y="207.9" class="m" font-size="17" fill="#1F2937" text-anchor="middle">1</text><text x="340" y="240" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[3]</text><rect x="370" y="180" width="60" height="44" rx="5" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.8"/><text x="400" y="207.9" class="m" font-size="17" fill="#1F2937" text-anchor="middle">9</text><text x="400" y="240" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[4]</text><text x="280" y="260" font-size="12" fill="#6B7280" text-anchor="middle">nenhuma posição é igual a 4</text><text x="560" y="202" font-size="14" font-weight="bold" fill="#DC2626">não existe no vetor</text><text x="560" y="224" font-size="12" fill="#6B7280">(percorreu tudo: 5 comparações)</text><rect x="110" y="280" width="560" height="40" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><text x="390" y="305" class="m" font-size="13" fill="#E5E7EB" text-anchor="middle">enquanto ((pos &lt; 4) e (vet[pos] != num))&#160; pos++</text></svg>