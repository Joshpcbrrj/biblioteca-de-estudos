<svg xmlns="http://www.w3.org/2000/svg" width="480" height="414" viewBox="0 0 480 414"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">2 + 3 * (4 - 1): resolvendo na ordem certa</text><rect x="80" y="56" width="320" height="54" rx="6" class="xY"/><text x="240.0" y="79.5" class="m b c">2 + 3 * (4 - 1)</text><text x="240.0" y="97.5" class="m c">expressão original</text><rect x="80" y="128" width="320" height="54" rx="6" class="xP"/><text x="240.0" y="151.5" class="m b c">2 + 3 * 3</text><text x="240.0" y="169.5" class="m c">1º parênteses: 4 - 1 = 3</text><path d="M240.0,110 L240.0,128" class="l" marker-end="url(#a)"/><rect x="80" y="200" width="320" height="54" rx="6" class="xO"/><text x="240.0" y="223.5" class="m b c">2 + 9</text><text x="240.0" y="241.5" class="m c">2º multiplicação: 3 * 3 = 9</text><path d="M240.0,182 L240.0,200" class="l" marker-end="url(#a)"/><rect x="80" y="272" width="320" height="54" rx="6" class="xG"/><text x="240.0" y="295.5" class="m b c">11</text><text x="240.0" y="313.5" class="m c">3º soma</text><path d="M240.0,254 L240.0,272" class="l" marker-end="url(#a)"/><text x="240.0" y="370" class="n c">Sem os parênteses: 2 + 3 * 4 - 1 = 2 + 12 - 1 = 13.</text><text x="240.0" y="390" class="n c">A ordem muda o resultado.</text></svg>