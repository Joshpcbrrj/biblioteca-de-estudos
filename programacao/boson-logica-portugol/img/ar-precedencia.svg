<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" viewBox="0 0 760 296"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Resolvendo 2 + 3 * (4 - 1) na ordem certa</text><text x="234.2" y="76" class="m" font-size="19" fill="#1F2937" xml:space="preserve">2 + 3 * </text><rect x="322.7" y="55" width="86.1" height="31" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="325.7" y="76" class="m" font-size="19" fill="#1F2937" xml:space="preserve">(4 - 1)</text><text x="730" y="71" font-size="12.5" fill="#6B7280" text-anchor="end">1º parênteses</text><text x="268.5" y="128" class="m" font-size="19" fill="#1F2937" xml:space="preserve">2 + </text><rect x="311.3" y="107" width="63.2" height="31" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="314.3" y="128" class="m" font-size="19" fill="#1F2937" xml:space="preserve">3 * 3</text><text x="730" y="123" font-size="12.5" fill="#6B7280" text-anchor="end">2º multiplicação</text><rect x="288.4" y="159" width="63.2" height="31" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="291.4" y="180" class="m" font-size="19" fill="#1F2937" xml:space="preserve">2 + 9</text><text x="730" y="175" font-size="12.5" fill="#6B7280" text-anchor="end">3º soma</text><text x="308.6" y="232" class="m" font-size="19" fill="#1F2937" xml:space="preserve">11</text><text x="730" y="227" font-size="12.5" fill="#6B7280" text-anchor="end">resultado</text><text x="380" y="278" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Sem os parênteses seria 2 + 12 - 1 = 13: a ordem muda o resultado.</text></svg>