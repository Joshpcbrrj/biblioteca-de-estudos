<svg xmlns="http://www.w3.org/2000/svg" width="480" height="526" viewBox="0 0 480 526"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Pares de 1000 até 1: duas formas</text><rect x="20" y="52" width="440" height="182" rx="6" class="xB"/><text x="36" y="78" class="b">para + se: filtra todos</text><text x="444" y="78" class="b r">1000 voltas</text><rect x="36" y="92" width="408" height="80" rx="6" class="xW"/><text x="50" y="116" class="m">para (n = 1000; n &gt;= 1; n--)</text><text x="50" y="136" class="m">  se (n % 2 == 0)</text><text x="50" y="156" class="m">    escreva(n)</text><rect x="36" y="184" width="74" height="36" rx="6" class="xG"/><text x="73" y="207" class="m b c">1000</text><rect x="118" y="184" width="74" height="36" rx="6" class="xY"/><text x="155" y="207" class="m b c">999</text><rect x="200" y="184" width="74" height="36" rx="6" class="xG"/><text x="237" y="207" class="m b c">998</text><rect x="282" y="184" width="74" height="36" rx="6" class="xY"/><text x="319" y="207" class="m b c">997</text><rect x="364" y="184" width="74" height="36" rx="6" class="xG"/><text x="401" y="207" class="m b c">996</text><rect x="20" y="250" width="440" height="222" rx="6" class="xO"/><text x="36" y="276" class="b">passo -2: pula direto</text><text x="444" y="276" class="b r">500 voltas</text><rect x="36" y="290" width="408" height="120" rx="6" class="xW"/><text x="50" y="314" class="m">n = 1000</text><text x="50" y="334" class="m">enquanto (n &gt; 0) {</text><text x="50" y="354" class="m">  escreva(n)</text><text x="50" y="374" class="m">  n -= 2</text><text x="50" y="394" class="m">}</text><rect x="36" y="422" width="74" height="36" rx="6" class="xG"/><text x="73" y="445" class="m b c">1000</text><rect x="118" y="422" width="74" height="36" rx="6" class="xG"/><text x="155" y="445" class="m b c">998</text><rect x="200" y="422" width="74" height="36" rx="6" class="xG"/><text x="237" y="445" class="m b c">996</text><rect x="282" y="422" width="74" height="36" rx="6" class="xG"/><text x="319" y="445" class="m b c">994</text><rect x="364" y="422" width="74" height="36" rx="6" class="xG"/><text x="401" y="445" class="m b c">992</text><text x="240.0" y="502" class="n c">Cinza: visitado mas descartado pelo se.</text></svg>