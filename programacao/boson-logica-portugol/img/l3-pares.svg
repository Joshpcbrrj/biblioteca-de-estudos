<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="390" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Pares de 1000 até 1: duas formas de chegar lá</text><text x="200" y="64" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="middle">para + se</text><rect x="20" y="76" width="360" height="136" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><text x="36" y="104" class="m" font-size="13" fill="#E5E7EB" xml:space="preserve">para (num = 1000; num &gt;= 1; num--) {</text><text x="36" y="124.2" class="m" font-size="13" fill="#E5E7EB" xml:space="preserve">&#160;&#160; se (num % 2 == 0)</text><text x="36" y="144.3" class="m" font-size="13" fill="#E5E7EB" xml:space="preserve">&#160; &#160; &#160; escreva(num)</text><text x="36" y="164.4" class="m" font-size="13" fill="#E5E7EB" xml:space="preserve">}</text><text x="200" y="234" font-size="12.5" fill="#6B7280" text-anchor="middle">passa por todos os 1000 e filtra</text><text x="580" y="64" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">enquanto com passo -2</text><rect x="400" y="76" width="360" height="136" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><text x="416" y="104" class="m" font-size="13" fill="#E5E7EB" xml:space="preserve">num = 1000</text><text x="416" y="124.2" class="m" font-size="13" fill="#E5E7EB" xml:space="preserve">enquanto (num &gt; 0) {</text><text x="416" y="144.3" class="m" font-size="13" fill="#E5E7EB" xml:space="preserve">&#160;&#160; escreva(num)</text><text x="416" y="164.4" class="m" font-size="13" fill="#E5E7EB" xml:space="preserve">&#160;&#160; num -= 2</text><text x="416" y="184.6" class="m" font-size="13" fill="#E5E7EB" xml:space="preserve">}</text><text x="580" y="234" font-size="12.5" fill="#6B7280" text-anchor="middle">pula direto de par em par: 500 voltas</text><rect x="60" y="270" width="58" height="32" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="89" y="290.6" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">1000</text><rect x="124" y="270" width="58" height="32" rx="5" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.8"/><text x="153" y="290.6" class="m" font-size="13" fill="#9CA3AF" text-anchor="middle">999</text><rect x="188" y="270" width="58" height="32" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="217" y="290.6" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">998</text><rect x="252" y="270" width="58" height="32" rx="5" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.8"/><text x="281" y="290.6" class="m" font-size="13" fill="#9CA3AF" text-anchor="middle">997</text><rect x="316" y="270" width="58" height="32" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="345" y="290.6" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">996</text><rect x="430" y="270" width="58" height="32" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="459" y="290.6" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">1000</text><path d="M470,268 Q491,252 512,268" fill="none" stroke="#16A34A" stroke-width="1.4" marker-end="url(#arv)"/><rect x="494" y="270" width="58" height="32" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="523" y="290.6" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">998</text><path d="M534,268 Q555,252 576,268" fill="none" stroke="#16A34A" stroke-width="1.4" marker-end="url(#arv)"/><rect x="558" y="270" width="58" height="32" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="587" y="290.6" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">996</text><path d="M598,268 Q619,252 640,268" fill="none" stroke="#16A34A" stroke-width="1.4" marker-end="url(#arv)"/><rect x="622" y="270" width="58" height="32" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="651" y="290.6" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">994</text><path d="M662,268 Q683,252 704,268" fill="none" stroke="#16A34A" stroke-width="1.4" marker-end="url(#arv)"/><rect x="686" y="270" width="58" height="32" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="715" y="290.6" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">992</text></svg>