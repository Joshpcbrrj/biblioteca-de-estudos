<svg xmlns="http://www.w3.org/2000/svg" width="480" height="457" viewBox="0 0 480 457"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Entrada → processamento → saída</text><rect x="60" y="52" width="360" height="56" rx="6" class="xB"/><text x="240.0" y="76.5" class="b c">Entrada</text><text x="240.0" y="94.5" class="s c">teclado · mouse · arquivo</text><rect x="60" y="130" width="360" height="56" rx="6" class="xO"/><text x="240.0" y="154.5" class="b c">Processamento</text><text x="240.0" y="172.5" class="s c">CPU + memória: cálculos e decisões</text><path d="M240.0,108 L240.0,130" class="l" marker-end="url(#a)"/><rect x="60" y="208" width="360" height="56" rx="6" class="xG"/><text x="240.0" y="232.5" class="b c">Saída</text><text x="240.0" y="250.5" class="s c">tela · impressora · arquivo</text><path d="M240.0,186 L240.0,208" class="l" marker-end="url(#a)"/><rect x="60" y="286" width="360" height="48" rx="6" class="xY"/><text x="240.0" y="306.5" class="b c">Armazenamento</text><text x="240.0" y="324.5" class="s c">HD / SSD: guarda para depois</