<svg xmlns="http://www.w3.org/2000/svg" width="480" height="532" viewBox="0 0 480 532"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">enquanto por fora, para por dentro</text><polygon points="190,52 325.0,80.0 190,108 55.0,80.0" class="xO"/><text x="190" y="85.0" class="m b c">enquanto (verdadeiro)</text><path d="M190,108 L190,126" class="l" marker-end="url(#a)"/><text x="198" y="120" class="b">V</text><polygon points="100,126 300,126 280,166 80,166" class="xB"/><text x="190.0" y="151" class="m c">leia(quant_num)</text><path d="M190,166 L190,186" class="l" marker-end="url(#a)"/><polygon points="190,186 305.0,214.0 190,242 75.0,214.0" class="xO"/><text x="190" y="219.0" class="m b c">quant_num == 0</text><rect x="330" y="192" width="130" height="44" rx="6" class="xR"/><text x="395.0" y="210.5" class="m b c">pare</text><text x="395.0" y="228.5" class="s c">encerra</text><path d="M305,214 L330,214" class="l" marker-end="url(#a)"/><text x="310" y="206" class="b">V</text><path d="M190,242 L190,262" class="l" marker-end="url(#a)"/><text x="198" y="25