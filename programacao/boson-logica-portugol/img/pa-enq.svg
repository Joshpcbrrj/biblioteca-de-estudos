<svg xmlns="http://www.w3.org/2000/svg" width="480" height="482" viewBox="0 0 480 482"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">para ou enquanto?</text><rect x="20" y="52" width="440" height="198" rx="6" class="xB"/><text x="36" y="80" class="m b">para</text><text x="140" y="80" class="b">Sei quantas voltas vou dar</text><text x="36" y="108" class="s">• imprimir de 1 a 100</text><text x="36" y="128" class="s">• sortear 5 números</text><rect x="36" y="152" width="408" height="84" rx="6" class="xW"/><text x="50" y="178" class="m">para (i = 1; i &lt;= 5; i++) {</text><text x="50" y="200" class="m">  escreva(i)</text><text x="50" y="222" class="m">}</text><rect x="20" y="266" width="440" height="198" rx="6" class="xO"/><text x="36" y="294" class="m b">enquanto</text><text x="140" y="294" class="b">Depende de algo acontecer</text><text x="36" y="322" class="s">• ler nomes até digitarem x</text><text x="36" y="342" class="s">• jogo até acertar</text><rect x="36" y="366" width="408" height="84" rx="6" class="xW"/><text x="50" y="392" class="m">enquanto (nome != "x") {</text><text x="50" y="414" class="m">  leia(nome)</text><text x="50" y="436" class="m">}</text></svg>