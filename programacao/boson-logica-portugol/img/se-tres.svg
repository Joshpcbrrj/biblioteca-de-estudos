370.5" class="m b c">"Reprovado"</text><path d="M310,366 L326,366" class="l" marker-end="url(#a)"/><text x="312" y="358" class="b">V</text><path d="M170,396 L170,428" class="l" marker-end="url(#a)"/><text x="178" y="416" class="b">F</text><rect x="20" y="428" width="440" height="40" rx="12" class="xG"/><text x="240" y="453" class="m c">escreva("Sua média foi: ", media)</text><text x="240.0" y="498" class="n c">Mesmo depois de um V, os testes seguintes rodam.</text><text x="240.0" y="518" class="n c">O encadeamento (senao se) evita isso.</text></svg>