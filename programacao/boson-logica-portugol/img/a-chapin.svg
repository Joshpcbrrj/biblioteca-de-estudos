<svg xmlns="http://www.w3.org/2000/svg" width="480" height="518" viewBox="0 0 480 518"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Diagrama de Chapin: tudo é feito de quadros</text><text x="20" y="66" class="b">Sequência</text><rect x="20" y="76" width="440" height="30" rx="6" class="xB"/><text x="36" y="96" class="m">instrução 1</text><rect x="20" y="106" width="440" height="30" rx="6" class="xB"/><text x="36" y="126" class="m">instrução 2</text><rect x="20" y="136" width="440" height="30" rx="6" class="xB"/><text x="36" y="156" class="m">instrução 3</text><text x="20" y="196" class="b">Decisão (se / senão)</text><rect x="20" y="206" width="440" height="56" class="xO"/><path d="M20,206 L240,262 L460,206" fill="none" stroke="#D97706" stroke-width="2"/><text x="240" y="226" class="m b c">condição?</text><text x="40" y="254" class="b">V</text><text x="440" y="254" class="b r">F</text><rect x="20" y="262" width="220" height="40" rx="6" class="xG"/><rect x="240" y="262" width="220" height="40" rx="6" class="xR"/><text x="130" y="287" class="m c">bloco V</text><text x="350" y="287" class="m c">bloco F</text><text x="20" y="340" class="b">Repetição (enquanto)</text><rect x="20" y="350" width="440" height="90" rx="6" class="xP"/><text x="36" y="374" class="m b">enquanto condição</text><rect x="60" y="386" width="400" height="54" rx="6" class="xW"/><text x="76" y="418" class="m">corpo do laço</text><text x="240.0" y="474" class="n c">Sem setas: lê-se de cima para baixo, e cada</text><text x="240.0" y="494" class="n c">estrutura fica encaixada dentro da outra.</text></svg>