<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Diagrama de Chapin (Nassi-Shneiderman): tudo é feito de quadros</text><text x="135" y="58" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">Sequência</text><rect x="20" y="72" width="230" height="40" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="135" y="97" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">instrução 1</text><rect x="20" y="112" width="230" height="40" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="135" y="137" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">instrução 2</text><rect x="20" y="152" width="230" height="40" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="135" y="177" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">instrução 3</text><text x="410" y="58" font-size="14" font-weight="bold" fill="#DB2777" text-anchor="middle">Decisão (se / senão)</text><rect x="295" y="72" width="230" height="60" rx="0" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.6"/><path d="M295,72 L410,132 L525,72" fill="none" stroke="#DB2777" stroke-width="1.6"/><text x="410" y="92" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">condição?</text><text x="311" y="124" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">V</text><text x="509" y="124" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">F</text><rect x="295" y="132" width="115" height="60" rx="0" fill="#fff" stroke="#DB2777" stroke-width="1.6"/><rect x="410" y="132" width="115" height="60" rx="0" fill="#fff" stroke="#DB2777" stroke-width="1.6"/><text x="352.5" y="166" class="m" font-size="13" fill="#1F2937" text-anchor="middle">bloco V</text><text x="467.5" y="166" class="m" font-size="13" fill="#1F2937" text-anchor="middle">bloco F</text><text x="685" y="58" font-size="14" font-weight="bold" fill="#7C3AED" text-anchor="middle">Repetição (enquanto)</text><path d="M570,72 H800 V112 H606 V192 H570 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="685" y="97" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">enquanto condição</text><rect x="606" y="112" width="194" height="80" rx="0" fill="#fff" stroke="#7C3AED" stroke-width="1.6"/><text x="703" y="156" class="m" font-size="13" fill="#1F2937" text-anchor="middle">corpo do laço</text><text x="410" y="222" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Sem setas: a ordem é de cima para baixo, e cada estrutura fica encaixada dentro da outra.</text></svg>