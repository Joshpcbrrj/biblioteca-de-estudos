<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Procedimento faz; função faz e devolve</text><text x="20" y="70" class="b" style="fill:#2563EB">Procedimento</text><rect x="20" y="82" width="130" height="50" rx="6" class="xY"/><text x="85.0" y="111.5" class="b c">argumentos</text><rect x="180" y="82" width="280" height="50" rx="6" class="xB"/><text x="320.0" y="103.5" class="m b c">funcao mostra_menu()</text><text x="320.0" y="121.5" class="s c">executa a tarefa</text><path d="M150,107 L180,107" class="l" marker-end="url(#a)"/><text x="20" y="160" class="m">chamada:  mostra_menu()</text><text x="20" y="182" class="s">nada volta (só escreve na tela)</text><text x="20" y="230" class="b" style="fill:#16A34A">Função (com retorno)</text><rect x="20" y="242" width="130" height="50" rx="6" class="xY"/><text x="85.0" y="271.5" class="m b c">larg, comp</text><rect x="180" y="242" width="280" height="50" rx="6" class="xG"/><text x="320.0" y="263.5" class="m b c">funcao real area(...)</text><text x="320.0" y="281.5" class="m c">retorne larg * comp</text><path d="M150,267 L180,267" class="l" marker-end="url(#a)"/><path d="M320,292 L320,330 L150,330" class="l" marker-end="url(#a)"/><rect x="20" y="312" width="130" height="40" rx="6" class="xO"/><text x="85.0" y="336.5" class="m b c">total</text><text x="20" y="384" class="m">chamada:  total = area(3, 4)</text><text x="20" y="406" class="s">o valor 12 volta para quem chamou</text></svg>