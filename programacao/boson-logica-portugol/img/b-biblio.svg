<svg xmlns="http://www.w3.org/2000/svg" width="480" height="512" viewBox="0 0 480 512"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Incluir uma biblioteca e usar suas funções</text><rect x="20" y="50" width="440" height="50" rx="6" class="xP"/><text x="240" y="82" class="m b c">inclua biblioteca Matematica --&gt; m</text><text x="190" y="118" class="s c">nome</text><text x="352" y="118" class="s c">apelido</text><rect x="20" y="136" width="180" height="80" rx="6" class="xB"/><text x="110" y="181.0" class="m b c">Matematica --&gt; m</text><rect x="210" y="136" width="250" height="80" rx="6" class="xW"/><text x="224" y="160" class="m">m.PI</text><text x="224" y="182" class="m">m.raiz(x, 2)</text><text x="224" y="204" class="m">m.arredondar(x, 2)</text><rect x="20" y="220" width="180" height="58" rx="6" class="xG"/><text x="110" y="254.0" class="m b c">Texto --&gt; t</text><rect x="210" y="220" width="250" height="58" rx="6" class="xW"/><text x="224" y="244" class="m">t.caixa_alta(s)</text><text x="224" y="266" class="m">t.numero_caracteres(s)</