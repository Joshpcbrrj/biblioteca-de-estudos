<svg xmlns="http://www.w3.org/2000/svg" width="800" height="328" viewBox="0 0 800 328"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Incluindo uma biblioteca e usando suas funções</text><text x="215.8" y="75" class="m" font-size="18" fill="#1F2937" xml:space="preserve">inclua biblioteca </text><rect x="407.8" y="52" width="114.4" height="32" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="410.8" y="75" class="m" font-size="18" fill="#1F2937" xml:space="preserve">Matematica</text><text x="519.2" y="75" class="m" font-size="18" fill="#1F2937" xml:space="preserve"> --&gt; </text><rect x="570.4" y="52" width="16.8" height="32" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="573.4" y="75" class="m" font-size="18" fill="#1F2937" xml:space="preserve">m</text><text x="378" y="106" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">nome da biblioteca</text><text x="560" y="106" font-size="12" font-weight="bold" fill="#D97706" text-anchor="middle">apelido (alias)</text><rect x="16" y="130" width="186" height="150" rx="8" fill="#fff" stroke="#2563EB" stroke-width="2"/><rect x="16" y="130" width="186" height="34" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="109" y="152" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">Matematica --&gt; m</text><text x="28" y="190" class="m" font-size="12" fill="#1F2937">m.PI</text><text x="28" y="218" class="m" font-size="12" fill="#1F2937">m.raiz(x, indice)</text><text x="28" y="246" class="m" font-size="12" fill="#1F2937">m.arredondar(x, 2)</text><rect x="210" y="130" width="186" height="150" rx="8" fill="#fff" stroke="#16A34A" stroke-width="2"/><rect x="210" y="130" width="186" height="34" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="303" y="152" class="m" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">Texto --&gt; t</text><text x="222" y="190" class="m" font-size="12" fill="#1F2937">t.caixa_alta(s)</text><text x="222" y="218" class="m" font-size="12" fill="#1F2937">t.caixa_baixa(s)</text><text x="222" y="246" class="m" font-size="12" fill="#1F2937">t.numero_caracteres(s)</text><rect x="404" y="130" width="186" height="150" rx="8" fill="#fff" stroke="#D97706" stroke-width="2"/><rect x="404" y="130" width="186" height="34" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="497" y="152" class="m" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">Util --&gt; u</text><text x="416" y="190" class="m" font-size="12" fill="#1F2937">u.sorteia(1, 10)</text><text x="416" y="218" class="m" font-size="12" fill="#1F2937">u.aguarde(2000)</text><rect x="598" y="130" width="186" height="150" rx="8" fill="#fff" stroke="#7C3AED" stroke-width="2"/><rect x="598" y="130" width="186" height="34" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="691" y="152" class="m" font-size="13" font-weight="bold" fill="#7C3AED" text-anchor="middle">Calendario --&gt; c</text><text x="610" y="190" class="m" font-size="12" fill="#1F2937">c.dia_mes_atual()</text><text x="610" y="218" class="m" font-size="12" fill="#1F2937">c.ano_atual()</text><text x="400" y="310" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Depois de incluir, use apelido.função(): o ponto diz de qual biblioteca ela vem.</text></svg>