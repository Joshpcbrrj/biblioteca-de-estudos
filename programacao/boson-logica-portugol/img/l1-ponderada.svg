<svg xmlns="http://www.w3.org/2000/svg" width="480" height="498" viewBox="0 0 480 498"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Média ponderada: cada prova pesa diferente</text><text x="20" y="80" class="b">prova 1: nota 6</text><rect x="170" y="56" width="116" height="34" rx="6" class="xB"/><text x="228" y="78" class="b c">peso 2</text><text x="20" y="128" class="b">prova 2: nota 7</text><rect x="170" y="104" width="174" height="34" rx="6" class="xO"/><text x="257" y="126" class="b c">peso 3</text><text x="20" y="176" class="b">prova 3: nota 8</text><rect x="170" y="152" width="290" height="34" rx="6" class="xG"/><text x="315" y="174" class="b c">peso 5</text><text x="240.0" y="214" class="n c">largura da barra = peso (total 10)</text><rect x="50" y="236" width="380" height="52" rx="6" class="xY"/><text x="240.0" y="258.5" class="m b c">(6*2 + 7*3 + 8*5) / (2+3+5)</text><text x="240.0" y="276.5" class="m c">soma de nota × peso, ÷ soma dos pesos</text><rect x="50" y="306" width="380" height="52" rx="6" class="xO"/><text x="240.0" y="336.5" class="m b c">(12 + 21 + 40) / 10</text><path d="M240.0,288 L240.0,306" class="l" marker-end="url(#a)"/><rect x="50" y="376" width="380" height="52" rx="6" class="xG"/><text x="240.0" y="398.5" class="m b c">7.3</text><text x="240.0" y="416.5" class="m c">média ponderada</text><path d="M240.0,358 L240.0,376" class="l" marker-end="url(#a)"/><text x="240.0" y="454" class="n c">A média simples daria 7.0: o peso 5</text><text x="240.0" y="474" class="n c">puxa o resultado para perto do 8.</text></svg>