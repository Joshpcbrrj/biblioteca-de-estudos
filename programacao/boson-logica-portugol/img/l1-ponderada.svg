 class="xO"/><text x="257" y="126" class="b c">peso 3</text><text x="20" y="176" class="b">prova 3: nota 8</text><rect x="170" y="152" width="290" height="34" rx="8" class="xG"/><text x="315" y="174" class="b c">peso 5</text><text x="240.0" y="214" class="n c">largura da barra = peso (total 10)</text><rect x="52" y="239" width="380" height="52" rx="8" class="sh"/><rect x="50" y="236" width="380" height="52" rx="8" class="xY"/><text x="240.0" y="258.5" class="m b c">(6*2 + 7*3 + 8*5) / (2+3+5)</text><text x="240.0" y="276.5" class="m c">soma de nota × peso, ÷ soma dos pesos</text><rect x="52" y="309" width="380" height="52" rx="8" class="sh"/><rect x="50" y="306" width="380" height="52" rx="8" class="xO"/><text x="240.0" y="336.5" class="m b c">(12 + 21 + 40) / 10</text><path d="M240.0,288 L240.0,306" class="l" marker-end="url(#a)"/><rect x="52" y="379" width="380" height="52" rx="8" class="sh"/><rect x="50" y="376" width="380" height="52" rx="8" class="xG"/><text x="240.0" y="398.5" class="m b c">7.3</text><text x="240.0" y="416.5" class="m c">média ponderada</text><path d="M240.0,358 L240.0,376" class="l" marker-end="url(#a)"/><text x="240.0" y="454" class="n c">A média simples daria 7.0: o peso 5</text><text x="240.0" y="474" class="n c">puxa o resultado para perto do 8.</text></svg>