<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Média ponderada: cada prova pesa diferente</text><rect x="60" y="60" width="124" height="54" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="122" y="82" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">prova 1: nota 6</text><text x="122" y="102" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="middle">peso 2</text><rect x="188" y="60" width="186" height="54" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="281" y="82" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">prova 2: nota 7</text><text x="281" y="102" font-size="12.5" font-weight="bold" fill="#7C3AED" text-anchor="middle">peso 3</text><rect x="378" y="60" width="310" height="54" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="533" y="82" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">prova 3: nota 8</text><text x="533" y="102" font-size="12.5" font-weight="bold" fill="#D97706" text-anchor="middle">peso 5</text><text x="380" y="140" font-size="11.5" font-style="italic" fill="#6B7280" text-anchor="middle">barra proporcional ao peso (total 10)</text><text x="221.4" y="192" class="m" font-size="17" fill="#1F2937" xml:space="preserve">(6*2 + 7*3 + 8*5) / (2 + 3 + 5)</text><text x="282.8" y="236" class="m" font-size="17" fill="#1F2937" xml:space="preserve">(12 + 21 + 40) / 10</text><rect x="359.8" y="259" width="40.3" height="31" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="362.8" y="280" class="m" font-size="19" fill="#1F2937" xml:space="preserve">7.3</text><text x="380" y="318" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Na média simples daria 7.0: a prova de peso 5 puxa o resultado para perto do 8.</text></svg>