<svg xmlns="http://www.w3.org/2000/svg" width="760" height="274" viewBox="0 0 760 274"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Par ou ímpar: o resto da divisão por 2 decide</text><circle cx="70" cy="80" r="12" fill="#2563EB"/><circle cx="70" cy="114" r="12" fill="#2563EB"/><circle cx="104" cy="80" r="12" fill="#2563EB"/><circle cx="104" cy="114" r="12" fill="#2563EB"/><circle cx="138" cy="80" r="12" fill="#2563EB"/><circle cx="138" cy="114" r="12" fill="#2563EB"/><circle cx="172" cy="80" r="12" fill="#2563EB"/><circle cx="172" cy="114" r="12" fill="#2563EB"/><rect x="54" y="64" width="32" height="66" rx="14" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="88" y="64" width="32" height="66" rx="14" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="122" y="64" width="32" height="66" rx="14" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="156" y="64" width="32" height="66" rx="14" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="3 3"/><text x="140" y="160" class="m" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">8 % 2 == 0</text><text x="140" y="186" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">todos formam pares → par</text><circle cx="450" cy="80" r="12" fill="#7C3AED"/><circle cx="450" cy="114" r="12" fill="#7C3AED"/><circle cx="484" cy="80" r="12" fill="#7C3AED"/><circle cx="484" cy="114" r="12" fill="#7C3AED"/><circle cx="518" cy="80" r="12" fill="#7C3AED"/><circle cx="518" cy="114" r="12" fill="#7C3AED"/><circle cx="552" cy="80" r="12" fill="#D97706"/><rect x="434" y="64" width="32" height="66" rx="14" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="468" y="64" width="32" height="66" rx="14" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="502" y="64" width="32" height="66" rx="14" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="3 3"/><text x="520" y="160" class="m" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">7 % 2 == 1</text><text x="520" y="186" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">sobra 1 → ímpar</text><rect x="170" y="214" width="420" height="40" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="380" y="240" class="m" font-size="14" fill="#1F2937" text-anchor="middle">se ((num % 2) == 0)&#160; → par;&#160; senao → ímpar</text></svg>