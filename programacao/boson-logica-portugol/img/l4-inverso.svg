<svg xmlns="http://www.w3.org/2000/svg" width="780" height="248" viewBox="0 0 780 248"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="390" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Lê de 0 a 9, mostra de 9 a 0</text><rect x="70" y="90" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="102" y="117.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">4</text><text x="102" y="150" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[0]</text><rect x="134" y="90" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="166" y="117.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">8</text><text x="166" y="150" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[1]</text><rect x="198" y="90" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="230" y="117.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">15</text><text x="230" y="150" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[2]</text><rect x="262" y="90" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="294" y="117.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">16</text><text x="294" y="150" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[3]</text><rect x="326" y="90" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="358" y="117.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">23</text><text x="358" y="150" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[4]</text><rect x="390" y="90" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="422" y="117.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">42</text><text x="422" y="150" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[5]</text><rect x="454" y="90" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="486" y="117.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">7</text><text x="486" y="150" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[6]</text><rect x="518" y="90" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="550" y="117.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">1</text><text x="550" y="150" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[7]</text><rect x="582" y="90" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="614" y="117.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">9</text><text x="614" y="150" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[8]</text><rect x="646" y="90" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="678" y="117.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">30</text><text x="678" y="150" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[9]</text><path d="M90,76 L690,76" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arb)"/><text x="390" y="64" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">leitura: para (i = 0; i &lt;= 9; i++)&#160; leia(vetor[i])</text><path d="M690,172 L90,172" fill="none" stroke="#D97706" stroke-width="2.2" marker-end="url(#aro)"/><text x="390" y="198" class="m" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">saída: para (i = 9; i &gt;= 0; i--)&#160; escreva(vetor[i])</text><text x="390" y="230" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">O vetor não muda: só o sentido em que o índice é percorrido.</text></svg>