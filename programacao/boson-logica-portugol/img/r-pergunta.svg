 y="136.5" class="m b c">x = n1 == n2</text><path d="M190,132 L220,132" class="l" marker-end="url(#a)"/><rect x="222" y="109" width="110" height="52" rx="8" class="sh"/><rect x="220" y="106" width="110" height="52" rx="8" class="xO"/><text x="275.0" y="136.5" class="m b c">7 == 3 ?</text><path d="M330,132 L350,132" class="l" marker-end="url(#a)"/><rect x="352" y="109" width="110" height="52" rx="8" class="sh"/><rect x="350" y="106" width="110" height="52" rx="8" class="xR"/><text x="405.0" y="128.5" class="m b c">falso</text><text x="405.0" y="146.5" class="s c">logico</text><rect x="22" y="179" width="170" height="52" rx="8" class="sh"/><rect x="20" y="176" width="170" height="52" rx="8" class="xW"/><text x="105.0" y="206.5" class="m b c">y = n1 &gt; n2</text><path d="M190,202 L220,202" class="l" marker-end="url(#a)"/><rect x="222" y="179" width="110" height="52" rx="8" class="sh"/><rect x="220" y="176" width="110" height="52" rx="8" class="xO"/><text x="275.0" y="206.5" class="m b c">7 &gt; 3 ?</text><path d="M330,202 L350,202" class="l" marker-end="url(#a)"/><rect x="352" y="179" width="110" height="52" rx="8" class="sh"/><rect x="350" y="176" width="110" height="52" rx="8" class="xG"/><text x="405.0" y="198.5" class="m b c">verdadeiro</text><text x="405.0" y="216.5" class="s c">logico</text><rect x="22" y="249" width="170" height="52" rx="8" class="sh"/><rect x="20" y="246" width="170" height="52" rx="8" class="xW"/><text x="105.0" y="276.5" class="m b c">z = n1 != n2</text><path d="M190,272 L220,272" class="l" marker-end="url(#a)"/><rect x="222" y="249" width="110" height="52" rx="8" class="sh"/><rect x="220" y="246" width="110" height="52" rx="8" class="xO"/><text x="275.0" y="276.5" class="m b c">7 != 3 ?</text><path d="M330,272 L350,272" class="l" marker-end="url(#a)"/><rect x="352" y="249" width="110" height="52" rx="8" class="sh"/><rect x="350" y="246" width="110" height="52" rx="8" class="xG"/><text x="405.0" y="268.5" class="m b c">verdadeiro</text><text x="405.0" y="286.5" class="s c">logico</text><text x="240.0" y="330" class="n c">O resultado pode ir para uma variável logico</text><text x="240.0" y="350" class="n c">ou direto para um se.</text></svg>