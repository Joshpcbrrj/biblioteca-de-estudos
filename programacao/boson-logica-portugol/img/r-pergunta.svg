<svg xmlns="http://www.w3.org/2000/svg" width="760" height="276" viewBox="0 0 760 276"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Comparar é fazer uma pergunta: a resposta é verdadeiro ou falso</text><text x="380" y="58" class="m" font-size="14" fill="#6B7280" text-anchor="middle">inteiro n1 = 7,&#160; n2 = 3</text><text x="40" y="107" class="m" font-size="15" font-weight="bold" fill="#2563EB">x = n1 == n2</text><rect x="250" y="80" width="180" height="40" rx="20" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="340" y="106" class="m" font-size="16" fill="#1F2937" text-anchor="middle">7 == 3 ?</text><line x1="434" y1="100" x2="490" y2="100" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="496" y="80" width="150" height="40" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="571" y="106" class="m" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">falso</text><text x="660" y="106" class="m" font-size="12" fill="#6B7280">logico</text><text x="40" y="163" class="m" font-size="15" font-weight="bold" fill="#2563EB">y = n1 &gt; n2</text><rect x="250" y="136" width="180" height="40" rx="20" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="340" y="162" class="m" font-size="16" fill="#1F2937" text-anchor="middle">7 &gt; 3 ?</text><line x1="434" y1="156" x2="490" y2="156" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="496" y="136" width="150" height="40" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="571" y="162" class="m" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">verdadeiro</text><text x="660" y="162" class="m" font-size="12" fill="#6B7280">logico</text><text x="40" y="219" class="m" font-size="15" font-weight="bold" fill="#2563EB">z = n1 != n2</text><rect x="250" y="192" width="180" height="40" rx="20" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="340" y="218" class="m" font-size="16" fill="#1F2937" text-anchor="middle">7 != 3 ?</text><line x1="434" y1="212" x2="490" y2="212" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="496" y="192" width="150" height="40" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="571" y="218" class="m" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">verdadeiro</text><text x="660" y="218" class="m" font-size="12" fill="#6B7280">logico</text><text x="380" y="258" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Operadores: ==&#160; !=&#160; &gt;&#160; &lt;&#160; &gt;=&#160; &lt;=&#160; ; os dois lados precisam ser do mesmo tipo.</text></svg>