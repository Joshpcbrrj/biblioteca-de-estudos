<svg xmlns="http://www.w3.org/2000/svg" width="480" height="374" viewBox="0 0 480 374"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Comparar é perguntar: a resposta é V ou F</text><rect x="20" y="50" width="440" height="36" rx="6" class="xY"/><text x="240" y="74" class="m c">inteiro n1 = 7, n2 = 3</text><rect x="20" y="106" width="170" height="52" rx="6" class="xW"/><text x="105.0" y="136.5" class="m b c">x = n1 == n2</text><path d="M190,132 L220,132" class="l" marker-end="url(#a)"/><rect x="220" y="106" width="110" height="52" rx="6" class="xO"/><text x="275.0" y="136.5" class="m b c">7 == 3 ?</text><path d="M330,132 L350,132" class="l" marker-end="url(#a)"/><rect x="350" y="106" width="110" height="52" rx="6" class="xR"/><text x="405.0" y="128.5" class="m b c">falso</text><text x="405.0" y="146.5" class="s c">logico</text><rect x="20" y="176" width="170" height="52" rx="6" class="xW"/><text x="105.0" y="206.5" class="m b c">y = n1 &gt; n2</text><path d="M190,202 L220,202" class="l" marker-end="url(#a)"/><rect x="220" y="176" width="110" height="52" rx="6" class="xO"/><text x="275.0" y="206.5" class="m b c">7 &gt; 3 ?</text><path d="M330,202 L350,202" class="l" marker-end="url(#a)"/><rect x="350" y="176" width="110" height="52" rx="6" class="xG"/><text x="405.0" y="198.5" class="m b c">verdadeiro</text><text x="405.0" y="216.5" class="s c">logico</text><rect x="20" y="246" width="170" height="52" rx="6" class="xW"/><text x="105.0" y="276.5" class="m b c">z = n1 != n2</text><path d="M190,272 L220,272" class="l" marker-end="url(#a)"/><rect x="220" y="246" width="110" height="52" rx="6" class="xO"/><text x="275.0" y="276.5" class="m b c">7 != 3 ?</text><path d="M330,272 L350,272" class="l" marker-end="url(#a)"/><rect x="350" y="246" width="110" height="52" rx="6" class="xG"/><text x="405.0" y="268.5" class="m b c">verdadeiro</text><text x="405.0" y="286.5" class="s c">logico</text><text x="240.0" y="330" class="n c">O resultado pode ir para uma variável logico</text><text x="240.0" y="350" class="n c">ou direto para um se.</text></svg>