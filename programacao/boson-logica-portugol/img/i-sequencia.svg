<svg xmlns="http://www.w3.org/2000/svg" width="820" height="434" viewBox="0 0 820 434"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Trocar uma lâmpada queimada: a ordem dos passos importa</text><text x="205" y="62" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">Sequência lógica</text><text x="615" y="62" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">Sequência desordenada e ambígua</text><rect x="20" y="78" width="370" height="36" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="42" y="101" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">1</text><text x="62" y="101" font-size="13.5" fill="#1F2937">pegue uma lâmpada nova</text><rect x="20" y="124" width="370" height="36" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="42" y="147" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">2</text><text x="62" y="147" font-size="13.5" fill="#1F2937">desligue o interruptor</text><rect x="20" y="170" width="370" height="36" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="42" y="193" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">3</text><text x="62" y="193" font-size="13.5" fill="#1F2937">posicione a escada embaixo da lâmpada</text><rect x="20" y="216" width="370" height="36" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="42" y="239" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">4</text><text x="62" y="239" font-size="13.5" fill="#1F2937">suba na escada</text><rect x="20" y="262" width="370" height="36" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="42" y="285" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">5</text><text x="62" y="285" font-size="13.5" fill="#1F2937">retire a lâmpada queimada</text><rect x="20" y="308" width="370" height="36" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="42" y="331" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">6</text><text x="62" y="331" font-size="13.5" fill="#1F2937">coloque a lâmpada nova</text><rect x="20" y="354" width="370" height="36" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="42" y="377" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">7</text><text x="62" y="377" font-size="13.5" fill="#1F2937">desça e ligue o interruptor</text><rect x="430" y="78" width="370" height="36" rx="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="452" y="101" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">1</text><text x="472" y="94" font-size="13.5" fill="#1F2937">suba na escada</text><text x="472" y="109" font-size="11" font-style="italic" fill="#DC2626">subir onde? a escada nem foi posicionada</text><rect x="430" y="124" width="370" height="36" rx="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="452" y="147" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">2</text><text x="472" y="140" font-size="13.5" fill="#1F2937">coloque a lâmpada nova</text><text x="472" y="155" font-size="11" font-style="italic" fill="#DC2626">a queimada ainda está no lugar</text><rect x="430" y="170" width="370" height="36" rx="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="452" y="193" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">3</text><text x="472" y="186" font-size="13.5" fill="#1F2937">desligue o interruptor</text><text x="472" y="201" font-size="11" font-style="italic" fill="#DC2626">já mexeu na lâmpada com a luz ligada</text><rect x="430" y="216" width="370" height="36" rx="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="452" y="239" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">4</text><text x="472" y="232" font-size="13.5" fill="#1F2937">retire a lâmpada</text><text x="472" y="247" font-size="11" font-style="italic" fill="#DC2626">qual delas? (ambíguo)</text><rect x="430" y="262" width="370" height="36" rx="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="452" y="285" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">5</text><text x="472" y="278" font-size="13.5" fill="#1F2937">pegue uma lâmpada</text><text x="472" y="293" font-size="11" font-style="italic" fill="#DC2626">nova ou queimada?</text><rect x="430" y="308" width="370" height="36" rx="7" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="452" y="331" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">6</text><text x="472" y="331" font-size="13.5" fill="#1F2937">ligue o interruptor</text><rect x="430" y="354" width="370" height="36" rx="7" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="452" y="377" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">7</text><text x="472" y="377" font-size="13.5" fill="#1F2937">desça</text><text x="410" y="418" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Mesmos passos, ordem diferente: só a sequência da esquerda chega ao objetivo sem dúvidas.</text></svg>