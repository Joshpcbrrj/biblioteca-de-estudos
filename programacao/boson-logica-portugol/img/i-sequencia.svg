nova</text><rect x="20" y="278" width="440" height="32" rx="6" class="xG"/><text x="44" y="299" class="b c">6</text><text x="66" y="299" class="">desça e ligue o interruptor</text><text x="20" y="340" class="b" style="fill:#DC2626">❌ Fora de ordem</text><rect x="20" y="352" width="440" height="40" rx="6" class="xR"/><text x="36" y="370" class="b">suba na escada</text><text x="36" y="386" class="s">subir onde? nem foi posicionada</text><rect x="20" y="400" width="440" height="40" rx="6" class="xR"/><text x="36" y="418" class="b">coloque a lâmpada nova</text><text x="36" y="434" class="s">a queimada ainda está lá</text><rect x="20" y="448" width="440" height="40" rx="6" class="xR"/><text x="36" y="466" class="b">desligue o interruptor</text><text x="36" y="482" class="s">tarde demais: mexeu com a luz ligada</text><text x="240.0" y="512" class="n c">Mesmos passos, ordem diferente: só a primeira</text><text x="240.0" y="532" class="n c">chega ao objetivo sem dúvidas.</text></svg>