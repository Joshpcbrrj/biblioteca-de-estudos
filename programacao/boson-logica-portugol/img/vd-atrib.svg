<svg xmlns="http://www.w3.org/2000/svg" width="780" height="302" viewBox="0 0 780 302"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="390" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Duas formas de preencher inteiro vetor[4]</text><text x="200" y="64" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">1. posição por posição</text><text x="200" y="92" class="m" font-size="14" fill="#1F2937" text-anchor="middle">vetor[0] = 1</text><text x="200" y="114" class="m" font-size="14" fill="#1F2937" text-anchor="middle">vetor[1] = 2</text><text x="200" y="136" class="m" font-size="14" fill="#1F2937" text-anchor="middle">vetor[2] = 3</text><text x="200" y="158" class="m" font-size="14" fill="#1F2937" text-anchor="middle">vetor[3] = 4</text><text x="580" y="64" font-size="14" font-weight="bold" fill="#7C3AED" text-anchor="middle">2. tudo na declaração</text><text x="580" y="104" class="m" font-size="14" fill="#1F2937" text-anchor="middle">inteiro vetor[] = {1, 2, 3, 4}</text><text x="580" y="130" font-size="12" fill="#6B7280" text-anchor="middle">o tamanho vem da quantidade de valores</text><rect x="286" y="196" width="52" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="312" y="224.3" class="m" font-size="18" fill="#1F2937" text-anchor="middle">1</text><text x="312" y="256" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[0]</text><rect x="338" y="196" width="52" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="364" y="224.3" class="m" font-size="18" fill="#1F2937" text-anchor="middle">2</text><text x="364" y="256" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[1]</text><rect x="390" y="196" width="52" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="416" y="224.3" class="m" font-size="18" fill="#1F2937" text-anchor="middle">3</text><text x="416" y="256" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[2]</text><rect x="442" y="196" width="52" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="468" y="224.3" class="m" font-size="18" fill="#1F2937" text-anchor="middle">4</text><text x="468" y="256" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[3]</text><text x="390" y="284" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Resultado igual: 4 posições, índices de 0 a 3 (a última é tamanho - 1).</text></svg>