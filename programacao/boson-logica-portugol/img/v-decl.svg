<svg xmlns="http://www.w3.org/2000/svg" width="480" height="504" viewBox="0 0 480 504"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Declarar, atribuir e copiar</text><text x="20" y="66" class="b">1. Declarar e depois atribuir</text><rect x="20" y="78" width="200" height="92" rx="6" class="xW"/><text x="34" y="106" class="m">inteiro a</text><text x="34" y="130" class="m">a = 10</text><text x="295" y="98" class="m b c">a</text><rect x="250" y="106" width="90" height="46" rx="6" class="xY"/><text x="295" y="135" class="m b c">?</text><text x="405" y="98" class="m b c">a</text><rect x="360" y="106" width="90" height="46" rx="6" class="xG"/><text x="405" y="135" class="m b c">10</text><path d="M340,129 L360,129" class="l" marker-end="url(#a)"/><text x="20" y="196" class="b">2. Declarar já atribuindo</text><rect x="20" y="208" width="200" height="92" rx="6" class="xW"/><text x="34" y="236" class="m">inteiro a = 10</text><text x="295" y="228" class="m b c">a</text><rect x="250" y="236" width="90" height="46" rx="6" class="xG"/><text x="295" y="265" class="m b c">10</text><text x="20" y="326" class="b">3. Copiar de outra variável</text><rect x="20" y="338" width="200" height="92" rx="6" class="xW"/><text x="34" y="366" class="m">inteiro a = 10</text><text x="34" y="390" class="m">inteiro b = a</text><text x="295" y="358" class="m b c">a</text><rect x="250" y="366" width="90" height="46" rx="6" class="xG"/><text x="295" y="395" class="m b c">10</text><text x="405" y="358" class="m b c">b</text><rect x="360" y="366" width="90" height="46" rx="6" class="xB"/><text x="405" y="395" class="m b c">10</text><text x="240.0" y="460" class="n c">O = é atribuição: leia "a recebe 10".</text><text x="240.0" y="480" class="n c">Em 3, b recebe uma cópia: mudar b não muda a.</text></svg>