"auto-start-reverse"><path d="M1,1L9,5L1,9" fill="none" stroke="#7A7F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="240.0" y="30" class="t c">Declarar, atribuir e copiar</text><rect x="200.0" y="38" width="80" height="4" rx="2" fill="url(#gT0)"/><text x="20" y="66" class="b">1. Declarar e depois atribuir</text><rect x="20" y="78" width="200" height="92" rx="12" class="xW"/><text x="34" y="106" class="m">inteiro a</text><text x="34" y="130" class="m">a = 10</text><text x="295" y="98" class="m b c">a</text><rect x="250" y="106" width="90" height="46" rx="12" class="xY"/><text x="295" y="135" class="m b c">?</text><text x="405" y="98" class="m b c">a</text><rect x="360" y="106" width="90" height="46" rx="12" class="xG"/><text x="405" y="135" class="m b c">10</text><path d="M340,129 L360,129" class="l" marker-end="url(#a)"/><text x="20" y="196" class="b">2. Declarar já atribuindo</text><rect x="20" y="208" width="200" height="92" rx="12" class="xW"/><text x="34" y="236" class="m">inteiro a = 10</text><text x="295" y="228" class="m b c">a</text><rect x="250" y="236" width="90" height="46" rx="12" class="xG"/><text x="295" y="265" class="m b c">10</text><text x="20" y="326" class="b">3. Copiar de outra variável</text><rect x="20" y="338" width="200" height="92" rx="12" class="xW"/><text x="34" y="366" class="m">inteiro a = 10</text><text x="34" y="390" class="m">inteiro b = a</text><text x="295" y="358" class="m b c">a</text><rect x="250" y="366" width="90" height="46" rx="12" class="xG"/><text x="295" y="395" class="m b c">10</text><text x="405" y="358" class="m b c">b</text><rect x="360" y="366" width="90" height="46" rx="12" class="xB"/><text x="405" y="395" class="m b c">10</text><text x="240.0" y="460" class="n c">O = é atribuição: leia "a recebe 10".</text><text x="240.0" y="480" class="n c">Em 3, b recebe uma cópia: mudar b não muda a.</text></svg>