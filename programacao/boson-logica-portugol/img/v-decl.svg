<svg xmlns="http://www.w3.org/2000/svg" width="780" height="286" viewBox="0 0 780 286"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="390" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Declarar, atribuir e copiar</text><text x="140" y="62" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">1. declarar e depois atribuir</text><text x="140" y="92" class="m" font-size="14" fill="#2563EB" text-anchor="middle">inteiro a</text><text x="140" y="114" class="m" font-size="14" fill="#2563EB" text-anchor="middle">a = 10</text><text x="400" y="62" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">2. declarar já atribuindo</text><text x="400" y="92" class="m" font-size="14" fill="#2563EB" text-anchor="middle">inteiro a = 10</text><text x="650" y="62" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">3. copiar de outra variável</text><text x="650" y="92" class="m" font-size="14" fill="#2563EB" text-anchor="middle">inteiro a = 10</text><text x="650" y="114" class="m" font-size="14" fill="#2563EB" text-anchor="middle">inteiro b = a</text><text x="95" y="152" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">inteiro a</text><rect x="50" y="160" width="90" height="50" rx="8" fill="#fff" stroke="#9CA3AF" stroke-width="2"/><text x="95" y="192" class="m" font-size="18" font-weight="bold" fill="#6B7280" text-anchor="middle">?</text><line x1="145" y1="185" x2="175" y2="185" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="220" y="152" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">inteiro a</text><rect x="175" y="160" width="90" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="220" y="192" class="m" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">10</text><text x="95" y="230" font-size="11.5" fill="#6B7280" text-anchor="middle">criada, vazia</text><text x="220" y="230" font-size="11.5" fill="#6B7280" text-anchor="middle">recebe 10</text><text x="400" y="152" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">inteiro a</text><rect x="355" y="160" width="90" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="400" y="192" class="m" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">10</text><text x="400" y="230" font-size="11.5" fill="#6B7280" text-anchor="middle">nasce com valor</text><text x="595" y="152" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">inteiro a</text><rect x="550" y="160" width="90" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="595" y="192" class="m" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">10</text><text x="715" y="152" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">inteiro b</text><rect x="670" y="160" width="90" height="50" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="715" y="192" class="m" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">10</text><path d="M610,140 Q655,112 700,140" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arv)"/><text x="655" y="230" font-size="11.5" fill="#6B7280" text-anchor="middle">b recebe uma cópia do valor de a</text><text x="390" y="268" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">O sinal = é atribuição: leia &quot;a recebe 10&quot;, não &quot;a é igual a 10&quot;.</text></svg>