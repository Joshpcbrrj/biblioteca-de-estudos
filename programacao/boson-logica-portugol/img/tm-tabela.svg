<svg xmlns="http://www.w3.org/2000/svg" width="480" height="462" viewBox="0 0 480 462"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Teste de mesa: uma linha por passo</text><rect x="20" y="52" width="440" height="98" rx="6" class="xW"/><text x="36" y="76" class="m">soma = 0</text><text x="36" y="98" class="m">para (i = 1; i &lt;= 4; i++)</text><text x="36" y="120" class="m">  soma = soma + i</text><rect x="20" y="170" width="440" height="34" rx="6" class="xP"/><text x="70.0" y="192" class="b c">Passo</text><text x="160.0" y="192" class="b c">i</text><text x="255.0" y="192" class="b c">i &lt;= 4?</text><text x="385.0" y="192" class="b c">soma</text><rect x="20" y="204" width="440" height="34" rx="6" class="xY"/><text x="70.0" y="226" class="m c">início</text><text x="160.0" y="226" class="m c">—</text><text x="255.0" y="226" class="m c">—</text><text x="385.0" y="226" class="m c">0</text><rect x="20" y="238" width="440" height="34" rx="6" class="xW"/><text x="70.0" y="260" class="m c">1</text><text x="160.0" y="260" class="m c">1</text><text x="255.0" y="260" class="m c">V</text><text x="385.0" y="260" class="m c">1</text><rect x="20" y="272" width="440" height="34" rx="6" class="xW"/><text x="70.0" y="294" class="m c">2</text><text x="160.0" y="294" class="m c">2</text><text x="255.0" y="294" class="m c">V</text><text x="385.0" y="294" class="m c">3</text><rect x="20" y="306" width="440" height="34" rx="6" class="xW"/><text x="70.0" y="328" class="m c">3</text><text x="160.0" y="328" class="m c">3</text><text x="255.0" y="328" class="m c">V</text><text x="385.0" y="328" class="m c">6</text><rect x="20" y="340" width="440" height="34" rx="6" class="xW"/><text x="70.0" y="362" class="m c">4</text><text x="160.0" y="362" class="m c">4</text><text x="255.0" y="362" class="m c">V</text><text x="385.0" y="362" class="m c">10</text><rect x="20" y="374" width="440" height="34" rx="6" class="xG"/><text x="70.0" y="396" class="m c">5</text><text x="160.0" y="396" class="m c">5</text><text x="255.0" y="396" class="m c">F</text><text x="385.0" y="396" class="m c">sai: 10</text><text x="240.0" y="438" class="n c">Quando i vira 5, a condição falha e o laço termina.</text></svg>