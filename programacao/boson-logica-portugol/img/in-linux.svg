<svg xmlns="http://www.w3.org/2000/svg" width="480" height="314" viewBox="0 0 480 314"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Instalar no Linux em 3 comandos</text><rect x="60" y="56" width="400" height="52" rx="6" class="xB"/><text x="260.0" y="78.5" class="m b c">$ unzip portugol-studio.zip</text><text x="260.0" y="96.5" class="m c">descompacta e gera o .run</text><text x="38" y="88.0" class="b c">1</text><rect x="60" y="126" width="400" height="52" rx="6" class="xO"/><text x="260.0" y="148.5" class="m b c">$ chmod 755 portugol-studio.run</text><text x="260.0" y="166.5" class="m c">dá permissão de execução</text><text x="38" y="158.0" class="b c">2</text><path d="M260.0,108 L260.0,126" class="l" marker-end="url(#a)"/><rect x="60" y="196" width="400" height="52" rx="6" class="xG"/><text x="260.0" y="218.5" class="m b c">$ sudo ./portugol-studio.run</text><text x="260.0" y="236.5" class="m c">executa como administrador</text><text x="38" y="228.0" class="b c">3</text><path d="M260.0,178 L260.0,196" class="l" marker-end="url(#a)"/><text 