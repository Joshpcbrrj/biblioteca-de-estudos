<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">fibonacci(4): cada chamada se divide em duas</text><line x1="240" y1="88" x2="140" y2="132" stroke="#9CA3AF" stroke-width="1.8"/><line x1="240" y1="88" x2="360" y2="132" stroke="#9CA3AF" stroke-width="1.8"/><line x1="140" y1="168" x2="80" y2="212" stroke="#9CA3AF" stroke-width="1.8"/><line x1="140" y1="168" x2="200" y2="212" stroke="#9CA3AF" stroke-width="1.8"/><line x1="360" y1="168" x2="310" y2="212" stroke="#9CA3AF" stroke-width="1.8"/><line x1="360" y1="168" x2="420" y2="212" stroke="#9CA3AF" stroke-width="1.8"/><line x1="80" y1="248" x2="50" y2="292" stroke="#9CA3AF" stroke-width="1.8"/><line x1="80" y1="248" x2="150" y2="292" stroke="#9CA3AF" stroke-width="1.8"/><rect x="202.0" y="52.0" width="76" height="36" rx="6" class="xB"/><text x="240" y="75" class="m b c">fib(4)</text><rect x="102.0" y="132.0" width="76" height="36" rx="6" class="xB"/><text x="140" y="155" class="m b c">fib(3)</text><rect x="322.0" y="132.0" width="76" height="36" rx="6" class="xB"/><text x="360" y="155" class="m b c">fib(2)</text><rect x="42.0" y="212.0" width="76" height="36" rx="6" class="xB"/><text x="80" y="235" class="m b c">fib(2)</text><rect x="156.0" y="212.0" width="88" height="36" rx="6" class="xG"/><text x="200" y="235" class="m b c">fib(1)=1</text><rect x="266.0" y="212.0" width="88" height="36" rx="6" class="xG"/><text x="310" y="235" class="m b c">fib(1)=1</text><rect x="376.0" y="212.0" width="88" height="36" rx="6" class="xG"/><text x="420" y="235" class="m b c">fib(0)=0</text><rect x="6.0" y="292.0" width="88" height="36" rx="6" class="xG"/><text x="50" y="315" class="m b c">fib(1)=1</text><rect x="106.0" y="292.0" width="88" height="36" rx="6" class="xG"/><text x="150" y="315" class="m b c">fib(0)=0</text><rect x="20" y="346" width="440" height="40" rx="6" class="xO"/><text x="240" y="371" class="m b c">fib(4) = fib(3) + fib(2) = 2 + 1 = 3</text><text x="240.0" y="416" class="n c">Verde: casos base (num &lt;= 1) devolvem o próprio num.</text><text x="240.0" y="436" class="n c">Os demais somam os dois resultados de baixo.</text></svg>