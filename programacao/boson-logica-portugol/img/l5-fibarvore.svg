<svg xmlns="http://www.w3.org/2000/svg" width="800" height="358" viewBox="0 0 800 358"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">fibonacci(4): cada chamada se divide em duas até chegar a num &lt;= 1</text><line x1="400" y1="82" x2="220" y2="118" stroke="#9CA3AF" stroke-width="1.4"/><line x1="400" y1="82" x2="580" y2="118" stroke="#9CA3AF" stroke-width="1.4"/><line x1="220" y1="152" x2="120" y2="188" stroke="#9CA3AF" stroke-width="1.4"/><line x1="220" y1="152" x2="320" y2="188" stroke="#9CA3AF" stroke-width="1.4"/><line x1="580" y1="152" x2="500" y2="188" stroke="#9CA3AF" stroke-width="1.4"/><line x1="580" y1="152" x2="660" y2="188" stroke="#9CA3AF" stroke-width="1.4"/><line x1="120" y1="222" x2="60" y2="258" stroke="#9CA3AF" stroke-width="1.4"/><line x1="120" y1="222" x2="180" y2="258" stroke="#9CA3AF" stroke-width="1.4"/><rect x="366" y="48" width="68" height="34" rx="17" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="400" y="70" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">fib(4)</text><rect x="186" y="118" width="68" height="34" rx="17" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="220" y="140" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">fib(3)</text><rect x="546" y="118" width="68" height="34" rx="17" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="580" y="140" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">fib(2)</text><rect x="86" y="188" width="68" height="34" rx="17" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="120" y="210" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">fib(2)</text><rect x="286" y="188" width="68" height="34" rx="17" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="320" y="210" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">fib(1)</text><text x="320" y="238" font-size="12" font-weight="bold" fill="#16A34A" text-anchor="middle">= 1</text><rect x="466" y="188" width="68" height="34" rx="17" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="500" y="210" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">fib(1)</text><text x="500" y="238" font-size="12" font-weight="bold" fill="#16A34A" text-anchor="middle">= 1</text><rect x="626" y="188" width="68" height="34" rx="17" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="660" y="210" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">fib(0)</text><text x="660" y="238" font-size="12" font-weight="bold" fill="#16A34A" text-anchor="middle">= 0</text><rect x="26" y="258" width="68" height="34" rx="17" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="60" y="280" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">fib(1)</text><text x="60" y="308" font-size="12" font-weight="bold" fill="#16A34A" text-anchor="middle">= 1</text><rect x="146" y="258" width="68" height="34" rx="17" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="180" y="280" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">fib(0)</text><text x="180" y="308" font-size="12" font-weight="bold" fill="#16A34A" text-anchor="middle">= 0</text><text x="560" y="290" class="m" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">fib(4) = fib(3) + fib(2) = 2 + 1 = 3</text><text x="400" y="340" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Casos base (verde) devolvem o próprio num; os demais somam os dois resultados de baixo.</text></svg>