<svg xmlns="http://www.w3.org/2000/svg" width="480" height="540" viewBox="0 0 480 540"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">senao se: o primeiro V vence</text><rect x="60" y="52" width="360" height="40" rx="6" class="xB"/><text x="240" y="77" class="m c">media = (n1 + n2 + n3) / 3</text><path d="M170,92 L170,112" class="l" marker-end="url(#a)"/><polygon points="170,112 290.0,142.0 170,172 50.0,142.0" class="xO"/><text x="170" y="147.0" class="m b c">media &gt;= 7.0</text><rect x="310" y="120" width="160" height="44" rx="6" class="xG"/><text x="390.0" y="146.5" class="m b c">"Aprovado"</text><path d="M290,142 L310,142" class="l" marker-end="url(#a)"/><text x="298" y="134" class="b">V</text><text x="178" y="192" class="b">F</text><path d="M170,204 L170,224" class="l" marker-end="url(#a)"/><polygon points="170,224 290.0,254.0 170,284 50.0,254.0" class="xO"/><text x="170" y="259.0" class="m b c">media &gt;= 5.0</text><rect x="310" y="232" width="160" height="44" rx="6" class="xO"/><text x="390.0" y="258.5" class="m b c">"Em recuperação"</text><path d="M290,254 L310,254" class="l" marker-end="url(#a)"/><text x="298" y="246" class="b">V</text><text x="178" y="304" class="b">F</text><path d="M170,284 L170,336" class="l" marker-end="url(#a)"/><rect x="100" y="336" width="140" height="44" rx="6" class="xR"/><text x="170.0" y="354.5" class="m b c">"Reprovado"</text><text x="170.0" y="372.5" class="s c">senao</text><path d="M470,142 L475,142 L475,406" class="l"/><path d="M470,254 L475,254" class="l"/><path d="M170,380 L170,406 L475,406" class="l"/><path d="M310,406 L310,426" class="l" marker-end="url(#a)"/><rect x="160" y="426" width="300" height="40" rx="6" class="xY"/><text x="310" y="451" class="m c">escreva(media)</text><text x="240.0" y="496" class="n c">Os testes são feitos em ordem; os demais</text><text x="240.0" y="516" class="n c">são ignorados depois do primeiro V.</text></svg>