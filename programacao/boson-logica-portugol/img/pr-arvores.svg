<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Precedência com a = 2, b = 3, c = 4</text><rect x="20" y="56" width="440" height="136" rx="6" class="xW"/><text x="36" y="82" class="m b">a + b * c</text><text x="444" y="82" class="s r">* antes de +</text><circle cx="140" cy="106" r="16" class="xO"/><text x="140" y="111" class="m b c">+</text><line x1="140" y1="122" x2="190" y2="136" stroke="#9CA3AF" stroke-width="1.8"/><line x1="140" y1="122" x2="90" y2="138" stroke="#9CA3AF" stroke-width="1.8"/><circle cx="190" cy="152" r="16" class="xP"/><text x="190" y="157" class="m b c">*</text><rect x="74" y="138" width="32" height="28" rx="6" class="xY"/><text x="90" y="157" class="m b c">2</text><line x1="190" y1="168" x2="164" y2="174" stroke="#9CA3AF" stroke-width="1.8"/><text x="164" y="188" class="m b c">3</text><line x1="190" y1="168" x2="216" y2="174" stroke="#9CA3AF" stroke-width="1.8"/><text x="216" y="188" class="m b c">4</text><text x="270" y="126" class="s">1º  *</text><text x="270" y="148" class="s">2º  +</text><rect x="260" y="158" width="190" height="28" rx="6" class="xG"/><text x="355" y="177" class="m b c">2 + 12 = 14</text><rect x="20" y="206" width="440" height="136" rx="6" class="xW"/><text x="36" y="232" class="m b">(a + b) * c</text><text x="444" y="232" class="s r">parênteses primeiro</text><circle cx="140" cy="256" r="16" class="xO"/><text x="140" y="261" class="m b c">*</text><line x1="140" y1="272" x2="90" y2="286" stroke="#9CA3AF" stroke-width="1.8"/><line x1="140" y1="272" x2="190" y2="288" stroke="#9CA3AF" stroke-width="1.8"/><circle cx="90" cy="302" r="16" class="xP"/><text x="90" y="307" class="m b c">+</text><rect x="174" y="288" width="32" height="28" rx="6" class="xY"/><text x="190" y="307" class="m b c">4</text><line x1="90" y1="318" x2="64" y2="324" stroke="#9CA3AF" stroke-width="1.8"/><text x="64" y="338" class="m b c">2</text><line x1="90" y1="318" x2="116" y2="324" stroke="#9CA3AF" stroke-width="1.8"/><text x="116" y="338" class="m b c">3</text><text x="270" y="276" class="s">1º  +</text><text x="270" y="298" class="s">2º  *</text><rect x="260" y="308" width="190" height="28" rx="6" class="xG"/><text x="355" y="327" class="m b c">5 * 4 = 20</text><rect x="20" y="356" width="440" height="136" rx="6" class="xW"/><text x="36" y="382" class="m b">a + b - c</text><text x="444" y="382" class="s r">mesma precedência: da esquerda</text><circle cx="140" cy="406" r="16" class="xO"/><text x="140" y="411" class="m b c">-</text><line x1="140" y1="422" x2="90" y2="436" stroke="#9CA3AF" stroke-width="1.8"/><line x1="140" y1="422" x2="190" y2="438" stroke="#9CA3AF" stroke-width="1.8"/><circle cx="90" cy="452" r="16" class="xP"/><text x="90" y="457" class="m b c">+</text><rect x="174" y="438" width="32" height="28" rx="6" class="xY"/><text x="190" y="457" class="m b c">4</text><line x1="90" y1="468" x2="64" y2="474" stroke="#9CA3AF" stroke-width="1.8"/><text x="64" y="488" class="m b c">2</text><line x1="90" y1="468" x2="116" y2="474" stroke="#9CA3AF" stroke-width="1.8"/><text x="116" y="488" class="m b c">3</text><text x="270" y="426" class="s">1º  +</text><text x="270" y="448" class="s">2º  -</text><rect x="260" y="458" width="190" height="28" rx="6" class="xG"/><text x="355" y="477" class="m b c">5 - 4 = 1</text><text x="240.0" y="516" class="n c">O operador mais embaixo na árvore</text><text x="240.0" y="536" class="n c">é calculado primeiro.</text></svg>