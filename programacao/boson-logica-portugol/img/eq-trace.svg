<svg xmlns="http://www.w3.org/2000/svg" width="760" height="284" viewBox="0 0 760 284"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Rastreando enquanto (num &lt;= 100): escreve de 1 a 100</text><rect x="40" y="48" width="100" height="32" rx="0" fill="#374151" stroke="#374151" stroke-width="1"/><text x="90" y="69" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">volta</text><rect x="140" y="48" width="120" height="32" rx="0" fill="#374151" stroke="#374151" stroke-width="1"/><text x="200" y="69" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">num</text><rect x="260" y="48" width="190" height="32" rx="0" fill="#374151" stroke="#374151" stroke-width="1"/><text x="355" y="69" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">num &lt;= 100 ?</text><rect x="450" y="48" width="270" height="32" rx="0" fill="#374151" stroke="#374151" stroke-width="1"/><text x="585" y="69" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">o que acontece</text><rect x="40" y="80" width="100" height="32" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="90" y="101" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">1ª</text><rect x="140" y="80" width="120" height="32" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="200" y="101" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">1</text><rect x="260" y="80" width="190" height="32" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="355" y="101" class="m" font-size="13.5" font-weight="bold" fill="#16A34A" text-anchor="middle">verdadeiro</text><rect x="450" y="80" width="270" height="32" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="585" y="101" font-size="13.5" fill="#1F2937" text-anchor="middle">escreve 1, num++ → 2</text><rect x="40" y="112" width="100" height="32" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="90" y="133" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">2ª</text><rect x="140" y="112" width="120" height="32" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="200" y="133" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">2</text><rect x="260" y="112" width="190" height="32" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="355" y="133" class="m" font-size="13.5" font-weight="bold" fill="#16A34A" text-anchor="middle">verdadeiro</text><rect x="450" y="112" width="270" height="32" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="585" y="133" font-size="13.5" fill="#1F2937" text-anchor="middle">escreve 2, num++ → 3</text><rect x="40" y="144" width="100" height="32" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="90" y="165" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">…</text><rect x="140" y="144" width="120" height="32" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="200" y="165" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">…</text><rect x="260" y="144" width="190" height="32" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="355" y="165" class="m" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">…</text><rect x="450" y="144" width="270" height="32" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="585" y="165" font-size="13.5" fill="#1F2937" text-anchor="middle">…</text><rect x="40" y="176" width="100" height="32" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="90" y="197" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">100ª</text><rect x="140" y="176" width="120" height="32" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="200" y="197" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">100</text><rect x="260" y="176" width="190" height="32" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="355" y="197" class="m" font-size="13.5" font-weight="bold" fill="#16A34A" text-anchor="middle">verdadeiro</text><rect x="450" y="176" width="270" height="32" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="585" y="197" font-size="13.5" fill="#1F2937" text-anchor="middle">escreve 100, num++ → 101</text><rect x="40" y="208" width="100" height="32" rx="0" fill="#FEE2E2" stroke="#E5E7EB" stroke-width="1"/><text x="90" y="229" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle"></text><rect x="140" y="208" width="120" height="32" rx="0" fill="#FEE2E2" stroke="#E5E7EB" stroke-width="1"/><text x="200" y="229" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">101</text><rect x="260" y="208" width="190" height="32" rx="0" fill="#FEE2E2" stroke="#E5E7EB" stroke-width="1"/><text x="355" y="229" class="m" font-size="13.5" font-weight="bold" fill="#DC2626" text-anchor="middle">falso</text><rect x="450" y="208" width="270" height="32" rx="0" fill="#FEE2E2" stroke="#E5E7EB" stroke-width="1"/><text x="585" y="229" font-size="13.5" fill="#1F2937" text-anchor="middle">sai do laço</text><text x="380" y="266" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Sem o num++ a condição nunca ficaria falsa: seria um laço infinito.</text></svg>