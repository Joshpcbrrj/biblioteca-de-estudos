<svg xmlns="http://www.w3.org/2000/svg" width="480" height="588" viewBox="0 0 480 588"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Situação do aluno: faltas antes da média</text><polygon points="80,52 420,52 400,92 60,92" class="xB"/><text x="240.0" y="77" class="m c">leia(4 notas, faltas)</text><rect x="60" y="108" width="360" height="40" rx="6" class="xB"/><text x="240.0" y="133" class="m c">media = soma / 4</text><path d="M240,92 L240,108" class="l" marker-end="url(#a)"/><path d="M170,148 L170,168" class="l" marker-end="url(#a)"/><polygon points="170,168 280.0,196.0 170,224 60.0,196.0" class="xO"/><text x="170" y="201.0" class="m b c">faltas &gt;= 10</text><rect x="300" y="174" width="170" height="44" rx="6" class="xR"/><text x="385.0" y="192.5" class="m b c">"Reprovado"</text><text x="385.0" y="210.5" class="s c">por faltas</text><path d="M280,196 L300,196" class="l" marker-end="url(#a)"/><text x="284" y="188" class="b">V</text><text x="178" y="242" class="b">F</text><path d="M170,248 L170,268" class="l" marker-end="url(#a)"/><polygon points="170,268 280.0,296.0 170,324 60.0,296.0" class="xO"/><text x="170" y="301.0" class="m b c">media &gt;= 7</text><rect x="300" y="274" width="170" height="44" rx="6" class="xG"/><text x="385.0" y="300.5" class="m b c">"Aprovado!"</text><path d="M280,296 L300,296" class="l" marker-end="url(#a)"/><text x="284" y="288" class="b">V</text><text x="178" y="342" class="b">F</text><path d="M170,348 L170,368" class="l" marker-end="url(#a)"/><polygon points="170,368 280.0,396.0 170,424 60.0,396.0" class="xO"/><text x="170" y="401.0" class="m b c">media &gt;= 5</text><rect x="300" y="374" width="170" height="44" rx="6" class="xO"/><text x="385.0" y="400.5" class="m b c">"Recuperação"</text><path d="M280,396 L300,396" class="l" marker-end="url(#a)"/><text x="284" y="388" class="b">V</text><text x="178" y="442" class="b">F</text><path d="M170,424 L170,468" class="l" marker-end="url(#a)"/><rect x="80" y="468" width="180" height="44" rx="6" class="xR"/><text x="170.0" y="486.5" class="m b c">"Reprovado"</text><text x="170.0" y="504.5" class="s c">senao</text><text x="240.0" y="544" class="n c">Testar as faltas primeiro garante a regra</text><text x="240.0" y="564" class="n c">"independente da média".</text></svg>