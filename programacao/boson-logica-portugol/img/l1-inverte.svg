<svg xmlns="http://www.w3.org/2000/svg" width="480" height="342" viewBox="0 0 480 342"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Lendo numa ordem, mostrando na outra</text><text x="140" y="66" class="m c">leia(num_a)</text><rect x="60" y="78" width="160" height="46" rx="6" class="xB"/><text x="140" y="107" class="m b c">7</text><text x="140" y="142" class="s c">num_a</text><text x="340" y="66" class="m c">leia(num_b)</text><rect x="260" y="78" width="160" height="46" rx="6" class="xB"/><text x="340" y="107" class="m b c">15</text><text x="340" y="142" class="s c">num_b</text><text x="240" y="182" class="b c">escreva na ordem inversa</text><path d="M240,190 L240,210" class="l" marker-end="url(#a)"/><rect x="60" y="214" width="360" height="74" rx="6" class="xG"/><text x="80" y="244" class="m">escreva(num_b, "\n")   → 15</text><text x="80" y="270" class="m">escreva(num_a, "\n")   → 7</text><text x="240.0" y="318" class="n c">O "\n" faz cada número sair numa linha.</text></svg>