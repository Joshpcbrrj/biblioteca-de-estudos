<svg xmlns="http://www.w3.org/2000/svg" width="480" height="514" viewBox="0 0 480 514"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">No máximo 4 tentativas (número de 1 a 20)</text><text x="20" y="82" class="b">tentativa 1</text><rect x="150" y="56" width="80" height="40" rx="6" class="xR"/><text x="190" y="82" class="m b c">5</text><text x="250" y="82" class="b">errou</text><text x="20" y="140" class="b">tentativa 2</text><rect x="150" y="114" width="80" height="40" rx="6" class="xR"/><text x="190" y="140" class="m b c">12</text><text x="250" y="140" class="b">errou</text><text x="20" y="198" class="b">tentativa 3</text><rect x="150" y="172" width="80" height="40" rx="6" class="xG"/><text x="190" y="198" class="m b c">17</text><text x="250" y="198" class="b">acertou!</text><text x="20" y="256" class="b">tentativa 4</text><rect x="150" y="230" width="80" height="40" rx="6" class="xY"/><text x="190" y="256" class="m b c">–</text><text x="250" y="256" class="b">não usada</text><text x="460" y="198" class="b r" style="fill:#16A34A">← sai</text><rect x="20" y="298" width="440" height="146" rx="6" class="xW"/><text x="34" y="322" class="m">enquanto (tentativas &lt; 4 e nao acertou) {</text><text x="34" y="343" class="m">  leia(chute)</text><text x="34" y="364" class="m">  tentativas++</text><text x="34" y="385" class="m">  se (chute == num)</text><text x="34" y="406" class="m">    acertou = verdadeiro</text><text x="34" y="427" class="m">}</text><text x="240.0" y="470" class="n c">Termina quando acerta ou quando o</text><text x="240.0" y="490" class="n c">contador chega a 4 (fim de jogo).</text></svg>