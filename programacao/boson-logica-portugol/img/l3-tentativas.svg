<svg xmlns="http://www.w3.org/2000/svg" width="760" height="254" viewBox="0 0 760 254"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">No máximo 4 tentativas para o jogador 2 (número entre 1 e 20)</text><rect x="60" y="56" width="150" height="110" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="135" y="80" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">tentativa 1</text><text x="135" y="122" class="m" font-size="26" font-weight="bold" fill="#1F2937" text-anchor="middle">5</text><text x="135" y="152" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">errou</text><rect x="230" y="56" width="150" height="110" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="305" y="80" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">tentativa 2</text><text x="305" y="122" class="m" font-size="26" font-weight="bold" fill="#1F2937" text-anchor="middle">12</text><text x="305" y="152" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">errou</text><rect x="400" y="56" width="150" height="110" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="475" y="80" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">tentativa 3</text><text x="475" y="122" class="m" font-size="26" font-weight="bold" fill="#1F2937" text-anchor="middle">17</text><text x="475" y="152" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">acertou!</text><rect x="570" y="56" width="150" height="110" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2"/><text x="645" y="80" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">tentativa 4</text><text x="645" y="122" class="m" font-size="26" font-weight="bold" fill="#D1D5DB" text-anchor="middle">–</text><text x="645" y="152" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">não usada</text><text x="380" y="200" class="m" font-size="14" fill="#1F2937" text-anchor="middle">enquanto (num_tentativas &lt; 4)&#160; ...&#160; se (adivinha == num) → pare</text><text x="380" y="236" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">O laço termina pelo pare (acertou) ou pelo contador chegar a 4 (game over).</text></svg>