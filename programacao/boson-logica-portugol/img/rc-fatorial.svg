<svg xmlns="http://www.w3.org/2000/svg" width="800" height="358" viewBox="0 0 800 358"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">calcula_fatorial(4): desce até o caso base e volta multiplicando</text><rect x="40" y="52" width="380" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="54" y="80" class="m" font-size="14" font-weight="bold" fill="#1F2937">calcula_fatorial(4)</text><text x="260" y="80" class="m" font-size="13" fill="#6B7280">4 * fat(3)</text><line x1="80" y1="98" x2="130" y2="112" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arb)"/><rect x="620" y="56" width="120" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="680" y="80" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">retorna 24</text><rect x="90" y="114" width="380" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="104" y="142" class="m" font-size="14" font-weight="bold" fill="#1F2937">calcula_fatorial(3)</text><text x="310" y="142" class="m" font-size="13" fill="#6B7280">3 * fat(2)</text><line x1="130" y1="160" x2="180" y2="174" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arb)"/><rect x="620" y="118" width="120" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="680" y="142" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">retorna 6</text><line x1="700" y1="116" x2="700" y2="96" stroke="#D97706" stroke-width="1.8" marker-end="url(#aro)"/><rect x="140" y="176" width="380" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="154" y="204" class="m" font-size="14" font-weight="bold" fill="#1F2937">calcula_fatorial(2)</text><text x="360" y="204" class="m" font-size="13" fill="#6B7280">2 * fat(1)</text><line x1="180" y1="222" x2="230" y2="236" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arb)"/><rect x="620" y="180" width="120" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="680" y="204" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">retorna 2</text><line x1="700" y1="178" x2="700" y2="158" stroke="#D97706" stroke-width="1.8" marker-end="url(#aro)"/><rect x="190" y="238" width="380" height="44" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="204" y="266" class="m" font-size="14" font-weight="bold" fill="#1F2937">calcula_fatorial(1)</text><text x="410" y="266" class="m" font-size="13" font-weight="bold" fill="#16A34A">caso base: retorne 1</text><rect x="620" y="242" width="120" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="680" y="266" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">retorna 1</text><line x1="700" y1="240" x2="700" y2="220" stroke="#D97706" stroke-width="1.8" marker-end="url(#aro)"/><text x="60" y="312" font-size="12.5" font-weight="bold" fill="#2563EB">descida: cada chamada espera a de baixo</text><text x="740" y="312" font-size="12.5" font-weight="bold" fill="#D97706" text-anchor="end">volta: 1 → 2 → 6 → 24</text><text x="400" y="340" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Sem o caso base (n == 0 ou n == 1) a função chamaria a si mesma para sempre.</text></svg>