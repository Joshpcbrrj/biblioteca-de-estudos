<svg xmlns="http://www.w3.org/2000/svg" width="522" height="448" viewBox="0 0 522 448"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.k{font-weight:bold}.lb{font-size:11.5px;font-style:italic;fill:#6B7280}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.if{fill:#FCE7F3;stroke:#DB2777;stroke-width:2}.lp{fill:#EDE9FE;stroke:#7C3AED;stroke-width:2}.cl{fill:#E0F2FE;stroke:#0284C7;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g transform="translate(14.6,0)"><path class="in" d="M95.7,14 L219.3,14 L205.3,62 L81.7,62 Z"/><text class="t" x="108.7" y="34" text-anchor="start" xml:space="preserve">leia(num_1)</text><text class="t" x="108.7" y="50" text-anchor="start" xml:space="preserve">leia(num_2)</text><path class="e" d="M150.5,62 L150.5,84" marker-end="url(#a)"/><path class="if" d="M150.5,84 L227.1,113.8 L150.5,143.6 L74,113.8 Z"/><text class="t" x="150.5" y="117.8" text-anchor="middle">num_1 &gt; num_2</text><text class="lb" x="231.1" y="108.8" text-anchor="start">Verdadeiro</text><path class="e" d="M227.1,113.8 L344.1,113.8 L344.1,135.8" marker-end="url(#a)"/><path class="ou" d="M255.1,135.8 L447.1,135.8 L433.1,167.8 L241.1,167.8 Z"/><text class="t" x="344.1" y="155.8" text-anchor="middle" xml:space="preserve">&quot;O primeiro é maior&quot;</text><path class="e" d="M344.1,167.8 L344.1,175.8 L465.1,175.8"/><circle cx="465.1" cy="175.8" r="3" fill="#4B5563"/><path class="e" d="M150.5,143.6 L150.5,183.8" marker-end="url(#a)"/><text class="lb" x="155.5" y="156.6" text-anchor="start">Falso</text><path class="if" d="M150.5,183.8 L227.1,213.6 L150.5,243.4 L74,213.6 Z"/><text class="t" x="150.5" y="217.6" text-anchor="middle">num_2 &gt; num_1</text><text class="lb" x="231.1" y="208.6" text-anchor="start">Verdadeiro</text><path class="e" d="M227.1,213.6 L344.1,213.6 L344.1,235.6" marker-end="url(#a)"/><path class="ou" d="M258.9,235.6 L443.3,235.6 L429.3,267.6 L244.9,267.6 Z"/><text class="t" x="344.1" y="255.6" text-anchor="middle" xml:space="preserve">&quot;O segundo é maior&quot;</text><path class="e" d="M344.1,267.6 L344.1,275.6 L465.1,275.6"/><circle cx="465.1" cy="275.6" r="3" fill="#4B5563"/><text class="lb" x="155.5" y="256.4" text-anchor="start">Falso</text><path class="e" d="M150.5,243.4 L150.5,289.6" marker-end="url(#a)"/><path class="ou" d="M50.1,289.6 L264.9,289.6 L250.9,321.6 L36.1,321.6 Z"/><text class="t" x="150.5" y="309.6" text-anchor="middle" xml:space="preserve">&quot;Os números são iguais&quot;</text><path class="e" d="M150.5,321.6 L150.5,349.6"/><path class="e" d="M465.1,175.8 L465.1,349.6 L150.5,349.6"/><circle cx="150.5" cy="349.6" r="4" fill="#4B5563"/><path class="e" d="M150.5,353.6 L150.5,375.6" marker-end="url(#a)"/><rect class="te" x="126.1" y="375.6" width="48.8" height="32" rx="16"/><text class="t" x="150.5" y="395.6" text-anchor="middle" xml:space="preserve">fim</text></g><text x="261.1" y="429.6" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">Se nenhum é maior que o outro, só sobra uma possibilidade: são iguais.</text></svg>