<svg xmlns="http://www.w3.org/2000/svg" width="480" height="412" viewBox="0 0 480 412"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Maior de dois números</text><polygon points="80,52 420,52 400,92 60,92" class="xB"/><text x="240.0" y="77" class="m c">leia(num_1, num_2)</text><path d="M170,92 L170,108" class="l" marker-end="url(#a)"/><polygon points="170,108 280.0,137.0 170,166 60.0,137.0" class="xO"/><text x="170" y="142.0" class="m b c">num_1 &gt; num_2</text><rect x="300" y="115" width="170" height="44" rx="6" class="xG"/><text x="385.0" y="141.5" class="m b c">"O primeiro"</text><path d="M280,137 L300,137" class="l" marker-end="url(#a)"/><text x="284" y="128" class="b">V</text><path d="M170,166 L170,198" class="l" marker-end="url(#a)"/><text x="178" y="186" class="b">F</text><polygon points="170,198 280.0,227.0 170,256 60.0,227.0" class="xO"/><text x="170" y="232.0" class="m b c">num_2 &gt; num_1</text><rect x="300" y="205" width="170" height="44" rx="6" class="xO"/><text x="385.0" y="231.5" class="m b c">"O segundo"</text><path d="M280,227 L300,227" class="l" marker-end="url(#a)"/><text x="284" y="218" class="b">V</text><path d="M170,256 L170,288" class="l" marker-end="url(#a)"/><text x="178" y="276" class="b">F</text><rect x="80" y="288" width="180" height="44" rx="6" class="xY"/><text x="170.0" y="314.5" class="m b c">"São iguais"</text><text x="240.0" y="368" class="n c">Se nenhum é maior que o outro,</text><text x="240.0" y="388" class="n c">só sobra uma opção: são iguais.</text></svg>