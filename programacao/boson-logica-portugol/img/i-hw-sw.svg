<svg xmlns="http://www.w3.org/2000/svg" width="480" height="366" viewBox="0 0 480 366"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Seu código chega ao hardware pelo software</text><rect x="60" y="56" width="360" height="58" rx="6" class="xY"/><text x="240.0" y="81.5" class="b c">Usuário</text><text x="240.0" y="99.5" class="s c">digita, clica, lê a tela</text><rect x="60" y="140" width="360" height="58" rx="6" class="xB"/><text x="240.0" y="165.5" class="b c">Software (parte lógica)</text><text x="240.0" y="183.5" class="s c">nossos programas · sistema operacional</text><path d="M240.0,114 L240.0,140" class="l" marker-end="url(#a)"/><rect x="60" y="224" width="360" height="58" rx="6" class="xO"/><text x="240.0" y="249.5" class="b c">Hardware (parte física)</text><text x="240.0" y="267.5" class="s c">CPU · RAM · SSD · teclado · monitor</text><path d="M240.0,198 L240.0,224" class="l" marker-end="url(#a)"/><text x="240.0" y="322" class="n c">O código nunca mexe direto nas peças:</text><text x="240.0" y="342" class="n c">ele vira instruções que 