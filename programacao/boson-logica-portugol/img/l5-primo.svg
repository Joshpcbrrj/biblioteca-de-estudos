<svg xmlns="http://www.w3.org/2000/svg" width="480" height="380" viewBox="0 0 480 380"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Primo? Procura um divisor de 2 até n / 2</text><text x="20" y="72" class="m b">n = 13</text><rect x="20" y="84" width="80" height="52" rx="6" class="xW"/><text x="60" y="106" class="m c">13 % 2</text><text x="60" y="126" class="m b c">= 1</text><rect x="108" y="84" width="80" height="52" rx="6" class="xW"/><text x="148" y="106" class="m c">13 % 3</text><text x="148" y="126" class="m b c">= 1</text><rect x="196" y="84" width="80" height="52" rx="6" class="xW"/><text x="236" y="106" class="m c">13 % 4</text><text x="236" y="126" class="m b c">= 1</text><rect x="284" y="84" width="80" height="52" rx="6" class="xW"/><text x="324" y="106" class="m c">13 % 5</text><text x="324" y="126" class="m b c">= 3</text><rect x="372" y="84" width="80" height="52" rx="6" class="xW"/><text x="412" y="106" class="m c">13 % 6</text><text x="412" y="126" class="m b c">= 1</text><text x="240" y="162" class="b c" style="fill:#16A34A">nenhum resto 0 → primo</text><text x="20" y="206" class="m b">n = 15</text><rect x="20" y="218" width="80" height="52" rx="6" class="xW"/><text x="60" y="240" class="m c">15 % 2</text><text x="60" y="260" class="m b c">= 1</text><rect x="108" y="218" width="80" height="52" rx="6" class="xR"/><text x="148" y="240" class="m c">15 % 3</text><text x="148" y="260" class="m b c">= 0</text><text x="200" y="250" class="s">← para no 1º divisor</text><text x="240" y="296" class="b c" style="fill:#DC2626">resto 0 em 3 → não é primo</text><text x="240.0" y="336" class="n c">Basta testar até n / 2: nenhum divisor próprio</text><text x="240.0" y="356" class="n c">é maior que a metade do número.</text></svg>