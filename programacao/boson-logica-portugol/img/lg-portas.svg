<svg xmlns="http://www.w3.org/2000/svg" width="820" height="532" viewBox="0 0 820 532"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Os operadores lógicos como portas lógicas</text><rect x="30" y="60" width="245" height="132" rx="10" fill="#fff" stroke="#9CA3AF" stroke-width="1.4"/><line x1="90" y1="93" x2="120" y2="93" stroke="#1F2937" stroke-width="2"/><line x1="90" y1="117" x2="120" y2="117" stroke="#1F2937" stroke-width="2"/><path d="M120,80 H150 A25,25 0 0 1 150,130 H120 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><line x1="175" y1="105" x2="201" y2="105" stroke="#1F2937" stroke-width="2"/><text x="152" y="152" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">E (AND)</text><text x="152" y="170" class="m" font-size="13.5" font-weight="bold" fill="#7C3AED" text-anchor="middle">a e b</text><text x="152" y="186" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">V só se as duas forem V</text><rect x="295" y="60" width="245" height="132" rx="10" fill="#fff" stroke="#9CA3AF" stroke-width="1.4"/><line x1="355" y1="93" x2="393" y2="93" stroke="#1F2937" stroke-width="2"/><line x1="355" y1="117" x2="393" y2="117" stroke="#1F2937" stroke-width="2"/><path d="M385,80 Q430,80 447,105 Q430,130 385,130 Q401,105 385,80 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><line x1="447" y1="105" x2="473" y2="105" stroke="#1F2937" stroke-width="2"/><text x="417" y="152" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">OU (OR)</text><text x="417" y="170" class="m" font-size="13.5" font-weight="bold" fill="#7C3AED" text-anchor="middle">a ou b</text><text x="417" y="186" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">V se pelo menos uma for V</text><rect x="560" y="60" width="245" height="132" rx="10" fill="#fff" stroke="#9CA3AF" stroke-width="1.4"/><line x1="620" y1="105" x2="650" y2="105" stroke="#1F2937" stroke-width="2"/><path d="M650,80 L700,105 L650,130 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><circle cx="706" cy="105" r="6" fill="#fff" stroke="#2563EB" stroke-width="2"/><line x1="712" y1="105" x2="738" y2="105" stroke="#1F2937" stroke-width="2"/><text x="682" y="152" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">NÃO (NOT)</text><text x="682" y="170" class="m" font-size="13.5" font-weight="bold" fill="#7C3AED" text-anchor="middle">nao a</text><text x="682" y="186" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">inverte o valor</text><rect x="30" y="210" width="245" height="132" rx="10" fill="#fff" stroke="#9CA3AF" stroke-width="1.4"/><line x1="90" y1="243" x2="120" y2="243" stroke="#1F2937" stroke-width="2"/><line x1="90" y1="267" x2="120" y2="267" stroke="#1F2937" stroke-width="2"/><path d="M120,230 H150 A25,25 0 0 1 150,280 H120 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><circle cx="181" cy="255" r="6" fill="#fff" stroke="#2563EB" stroke-width="2"/><line x1="187" y1="255" x2="213" y2="255" stroke="#1F2937" stroke-width="2"/><text x="152" y="302" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">NÃO-E (NAND)</text><text x="152" y="320" class="m" font-size="13.5" font-weight="bold" fill="#7C3AED" text-anchor="middle">nao (a e b)</text><text x="152" y="336" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">contrário do E</text><rect x="295" y="210" width="245" height="132" rx="10" fill="#fff" stroke="#9CA3AF" stroke-width="1.4"/><line x1="355" y1="243" x2="393" y2="243" stroke="#1F2937" stroke-width="2"/><line x1="355" y1="267" x2="393" y2="267" stroke="#1F2937" stroke-width="2"/><path d="M385,230 Q430,230 447,255 Q430,280 385,280 Q401,255 385,230 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><circle cx="453" cy="255" r="6" fill="#fff" stroke="#2563EB" stroke-width="2"/><line x1="459" y1="255" x2="485" y2="255" stroke="#1F2937" stroke-width="2"/><text x="417" y="302" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">NÃO-OU (NOR)</text><text x="417" y="320" class="m" font-size="13.5" font-weight="bold" fill="#7C3AED" text-anchor="middle">nao (a ou b)</text><text x="417" y="336" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">contrário do OU</text><rect x="30" y="360" width="245" height="132" rx="10" fill="#fff" stroke="#9CA3AF" stroke-width="1.4"/><line x1="90" y1="393" x2="128" y2="393" stroke="#1F2937" stroke-width="2"/><line x1="90" y1="417" x2="128" y2="417" stroke="#1F2937" stroke-width="2"/><path d="M120,380 Q165,380 182,405 Q165,430 120,430 Q136,405 120,380 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M111,380 Q127,405 111,430" fill="none" stroke="#2563EB" stroke-width="2"/><line x1="182" y1="405" x2="208" y2="405" stroke="#1F2937" stroke-width="2"/><text x="152" y="452" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">OU-EXCLUSIVO (XOR)</text><text x="152" y="470" class="m" font-size="13.5" font-weight="bold" fill="#7C3AED" text-anchor="middle">a != b</text><text x="152" y="486" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">V se forem diferentes</text><rect x="295" y="360" width="245" height="132" rx="10" fill="#fff" stroke="#9CA3AF" stroke-width="1.4"/><line x1="355" y1="393" x2="393" y2="393" stroke="#1F2937" stroke-width="2"/><line x1="355" y1="417" x2="393" y2="417" stroke="#1F2937" stroke-width="2"/><path d="M385,380 Q430,380 447,405 Q430,430 385,430 Q401,405 385,380 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M376,380 Q392,405 376,430" fill="none" stroke="#2563EB" stroke-width="2"/><circle cx="453" cy="405" r="6" fill="#fff" stroke="#2563EB" stroke-width="2"/><line x1="459" y1="405" x2="485" y2="405" stroke="#1F2937" stroke-width="2"/><text x="417" y="452" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">XNOR</text><text x="417" y="470" class="m" font-size="13.5" font-weight="bold" fill="#7C3AED" text-anchor="middle">a == b</text><text x="417" y="486" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">V se forem iguais</text><rect x="560" y="210" width="245" height="282" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.4"/><text x="682" y="238" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">No Portugol</text><text x="682" y="266" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">e&#160; ·&#160; ou&#160; ·&#160; nao</text><text x="682" y="288" font-size="13" fill="#6B7280" text-anchor="middle">são palavras-chave;</text><text x="682" y="310" font-size="13" fill="#6B7280" text-anchor="middle">NAND, NOR, XOR e XNOR</text><text x="682" y="332" font-size="13" fill="#6B7280" text-anchor="middle">não têm operador próprio,</text><text x="682" y="354" font-size="13" fill="#6B7280" text-anchor="middle">mas são montados</text><text x="682" y="376" font-size="13" fill="#6B7280" text-anchor="middle">com e, ou, nao,</text><text x="682" y="398" font-size="13" fill="#6B7280" text-anchor="middle">== e !=</text><text x="410" y="514" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Para a e b do tipo logico, a != b funciona como XOR e a == b como XNOR.</text></svg>