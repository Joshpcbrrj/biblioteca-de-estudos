<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.s{font-size:11.5px;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xP{fill:#EDE9FE;stroke:#7C3AED}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Passagem por valor x por referência</text><text x="230" y="62" class="b c">Por valor (padrão)</text><rect x="40" y="76" width="380" height="120" rx="6" class="xY"/><text x="54" y="96" class="b">inicio()</text><rect x="70" y="108" width="130" height="60" rx="6" class="xW"/><text x="135" y="135" class="b c">num</text><text x="135" y="152" class="s c">5</text><rect x="40" y="220" width="380" height="120" rx="6" class="xY"/><text x="54" y="240" class="b">dobra(inteiro n)</text><rect x="260" y="250" width="130" height="60" rx="6" class="xB"/><text x="325" y="277" class="b c">n (cópia)</text><text x="325" y="294" class="s c">5 → 10</text><path d="M200,150C260,150 260,200 325,250" class="l" marker-end="url(#a)"/><text x="290" y="186" class="s">copia o valor</text><text x="230" y="368" class="s c">mudar n não muda num: num continua 5</text><text x="670" y="62" class="b c">Por referência (&amp;)</text><rect x="480" y="76" width="380" height="120" rx="6" class="xY"/><text x="494" y="96" class="b">inicio()</text><rect x="510" y="108" width="130" height="60" rx="6" class="xW"/><text x="575" y="135" class="b c">num</text><text x="575" y="152" class="s c">5 → 10</text><rect x="480" y="220" width="380" height="120" rx="6" class="xY"/><text x="494" y="240" class="b">dobra(inteiro &amp;n)</text><rect x="700" y="250" width="130" height="60" rx="6" class="xP"/><text x="765" y="277" class="b c">n = apelido</text><text x="765" y="294" class="s c">aponta para num</text><path d="M765,250C730,200 700,150 640,140" class="l" marker-end="url(#a)"/><text x="730" y="186" class="s">mesma variável</text><text x="670" y="368" class="s c">mudar n muda num</text></svg>