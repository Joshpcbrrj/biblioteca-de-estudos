<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Incremento e decremento</text><line x1="110" y1="110" x2="530" y2="110" stroke="#D1D5DB" stroke-width="2"/><line x1="120" y1="105" x2="120" y2="115" stroke="#9CA3AF" stroke-width="1.2"/><text x="120" y="132" font-size="11.5" fill="#6B7280" text-anchor="middle">-2</text><line x1="186.7" y1="105" x2="186.7" y2="115" stroke="#9CA3AF" stroke-width="1.2"/><text x="186.7" y="132" font-size="11.5" fill="#6B7280" text-anchor="middle">-1</text><line x1="253.3" y1="105" x2="253.3" y2="115" stroke="#9CA3AF" stroke-width="1.2"/><text x="253.3" y="132" font-size="11.5" fill="#6B7280" text-anchor="middle">0</text><line x1="320" y1="105" x2="320" y2="115" stroke="#9CA3AF" stroke-width="1.2"/><text x="320" y="132" font-size="11.5" fill="#6B7280" text-anchor="middle">1</text><line x1="386.7" y1="105" x2="386.7" y2="115" stroke="#9CA3AF" stroke-width="1.2"/><text x="386.7" y="132" font-size="11.5" fill="#6B7280" text-anchor="middle">2</text><line x1="453.3" y1="105" x2="453.3" y2="115" stroke="#9CA3AF" stroke-width="1.2"/><text x="453.3" y="132" font-size="11.5" fill="#6B7280" text-anchor="middle">3</text><line x1="520" y1="105" x2="520" y2="115" stroke="#9CA3AF" stroke-width="1.2"/><text x="520" y="132" font-size="11.5" fill="#6B7280" text-anchor="middle">4</text><circle cx="253.3" cy="110" r="7" fill="#fff" stroke="#9CA3AF" stroke-width="2"/><circle cx="320" cy="110" r="7" fill="#16A34A"/><path d="M253.3,98 Q286.7,64 320,98" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="286.7" y="66" class="m" font-size="16" font-weight="bold" fill="#16A34A" text-anchor="middle">x++</text><text x="560" y="106" class="m" font-size="14" fill="#1F2937">x = x + 1&#160; →&#160; 1</text><line x1="110" y1="210" x2="530" y2="210" stroke="#D1D5DB" stroke-width="2"/><line x1="120" y1="205" x2="120" y2="215" stroke="#9CA3AF" stroke-width="1.2"/><text x="120" y="232" font-size="11.5" fill="#6B7280" text-anchor="middle">6</text><line x1="186.7" y1="205" x2="186.7" y2="215" stroke="#9CA3AF" stroke-width="1.2"/><text x="186.7" y="232" font-size="11.5" fill="#6B7280" text-anchor="middle">7</text><line x1="253.3" y1="205" x2="253.3" y2="215" stroke="#9CA3AF" stroke-width="1.2"/><text x="253.3" y="232" font-size="11.5" fill="#6B7280" text-anchor="middle">8</text><line x1="320" y1="205" x2="320" y2="215" stroke="#9CA3AF" stroke-width="1.2"/><text x="320" y="232" font-size="11.5" fill="#6B7280" text-anchor="middle">9</text><line x1="386.7" y1="205" x2="386.7" y2="215" stroke="#9CA3AF" stroke-width="1.2"/><text x="386.7" y="232" font-size="11.5" fill="#6B7280" text-anchor="middle">10</text><line x1="453.3" y1="205" x2="453.3" y2="215" stroke="#9CA3AF" stroke-width="1.2"/><text x="453.3" y="232" font-size="11.5" fill="#6B7280" text-anchor="middle">11</text><line x1="520" y1="205" x2="520" y2="215" stroke="#9CA3AF" stroke-width="1.2"/><text x="520" y="232" font-size="11.5" fill="#6B7280" text-anchor="middle">12</text><circle cx="386.7" cy="210" r="7" fill="#fff" stroke="#9CA3AF" stroke-width="2"/><circle cx="320" cy="210" r="7" fill="#DC2626"/><path d="M386.7,198 Q353.3,164 320,198" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arr)"/><text x="353.3" y="166" class="m" font-size="16" font-weight="bold" fill="#DC2626" text-anchor="middle">x--</text><text x="560" y="206" class="m" font-size="14" fill="#1F2937">x = x - 1&#160; →&#160; 9</text><text x="120" y="66" class="m" font-size="13" fill="#6B7280">inteiro x = 0</text><text x="120" y="166" class="m" font-size="13" fill="#6B7280">inteiro x = 10</text><text x="380" y="262" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Muito usados em laços: avançam (ou recuam) o contador uma unidade por vez.</text></svg>