<svg xmlns="http://www.w3.org/2000/svg" width="820" height="338" viewBox="0 0 820 338"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">65 em binário: divisões sucessivas por 2, guardando os restos</text><text x="150" y="80" class="m" font-size="15" fill="#1F2937">65 / 2 = 32</text><text x="330" y="80" font-size="13" font-style="italic" fill="#6B7280">resto</text><rect x="385" y="60" width="40" height="28" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="405" y="79.2" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">1</text><text x="150" y="114" class="m" font-size="15" fill="#1F2937">32 / 2 = 16</text><text x="330" y="114" font-size="13" font-style="italic" fill="#6B7280">resto</text><rect x="385" y="94" width="40" height="28" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="405" y="113.2" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">0</text><text x="150" y="148" class="m" font-size="15" fill="#1F2937">16 / 2 = 8 </text><text x="330" y="148" font-size="13" font-style="italic" fill="#6B7280">resto</text><rect x="385" y="128" width="40" height="28" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="405" y="147.2" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">0</text><text x="150" y="182" class="m" font-size="15" fill="#1F2937"> 8 / 2 = 4 </text><text x="330" y="182" font-size="13" font-style="italic" fill="#6B7280">resto</text><rect x="385" y="162" width="40" height="28" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="405" y="181.2" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">0</text><text x="150" y="216" class="m" font-size="15" fill="#1F2937"> 4 / 2 = 2 </text><text x="330" y="216" font-size="13" font-style="italic" fill="#6B7280">resto</text><rect x="385" y="196" width="40" height="28" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="405" y="215.2" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">0</text><text x="150" y="250" class="m" font-size="15" fill="#1F2937"> 2 / 2 = 1 </text><text x="330" y="250" font-size="13" font-style="italic" fill="#6B7280">resto</text><rect x="385" y="230" width="40" height="28" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="405" y="249.2" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">0</text><text x="150" y="284" class="m" font-size="15" fill="#1F2937"> 1 / 2 = 0 </text><text x="330" y="284" font-size="13" font-style="italic" fill="#6B7280">resto</text><rect x="385" y="264" width="40" height="28" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="405" y="283.2" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">1</text><path d="M455,288 V66" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arp)"/><text x="470" y="180" font-size="14" font-weight="bold" fill="#7C3AED">leia os restos</text><text x="470" y="200" font-size="14" font-weight="bold" fill="#7C3AED">de baixo para cima</text><rect x="470" y="230" width="300" height="50" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="620" y="262" class="m" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">65 = 1000001</text><text x="410" y="320" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">O operador % dá o resto (num % 2) e a divisão inteira dá o próximo número (num / 2).</text></svg>