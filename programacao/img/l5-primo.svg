<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Primo ou não? Procura um divisor entre 2 e n / 2</text><text x="40" y="86" class="m" font-size="16" font-weight="bold" fill="#1F2937">n = 13</text><rect x="150" y="60" width="80" height="40" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="190" y="84.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">13 % 2</text><text x="190" y="118" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">= 1</text><rect x="242" y="60" width="80" height="40" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="282" y="84.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">13 % 3</text><text x="282" y="118" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">= 1</text><rect x="334" y="60" width="80" height="40" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="374" y="84.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">13 % 4</text><text x="374" y="118" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">= 1</text><rect x="426" y="60" width="80" height="40" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="466" y="84.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">13 % 5</text><text x="466" y="118" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">= 3</text><rect x="518" y="60" width="80" height="40" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="558" y="84.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">13 % 6</text><text x="558" y="118" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">= 1</text><text x="780" y="86" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="end">nenhum resto 0 → primo</text><text x="40" y="186" class="m" font-size="16" font-weight="bold" fill="#1F2937">n = 15</text><rect x="150" y="160" width="80" height="40" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="190" y="184.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">15 % 2</text><text x="190" y="218" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">= 1</text><rect x="242" y="160" width="80" height="40" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="282" y="184.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">15 % 3</text><text x="282" y="218" class="m" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">= 0</text><text x="780" y="186" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="end">resto 0 em 3 → não é primo</text><text x="334" y="186" font-size="12.5" font-style="italic" fill="#6B7280">para no 1º divisor encontrado</text><text x="410" y="262" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Basta testar até n / 2: nenhum número tem divisor (além dele mesmo) maior que a sua metade.</text></svg>