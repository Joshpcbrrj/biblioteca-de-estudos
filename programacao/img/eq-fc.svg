 x="120.8" y="234" width="64" height="32" rx="3"/><text class="t" x="152.8" y="254" text-anchor="middle" xml:space="preserve">num++</text><path class="e" d="M152.8,266 L152.8,278 L24,278 L24,139 L50,139" marker-end="url(#a)"/><path class="e" d="M255.6,139 L285.6,139 L285.6,298 L152.8,298"/><text class="lb" x="259.6" y="134" text-anchor="start">Falso</text><circle cx="152.8" cy="298" r="4" fill="#4B5563"/><path class="e" d="M152.8,302 L152.8,324" marker-end="url(#a)"/><rect class="te" x="128.4" y="324" width="48.8" height="32" rx="16"/><text class="t" x="152.8" y="344" text-anchor="middle" xml:space="preserve">fim</text></g><text x="312.8" y="378" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">A condição é testada antes de cada volta; o num++ garante que um dia ela fique falsa.</text></svg>