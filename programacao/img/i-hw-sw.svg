<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Hardware e software: a programação fala com o hardware por meio do software</text><rect x="110" y="50" width="540" height="62" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="380" y="76" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Usuário</text><text x="380" y="97" font-size="13" fill="#6B7280" text-anchor="middle">digita, clica, lê a tela</text><line x1="380" y1="114" x2="380" y2="134" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="110" y="136" width="540" height="62" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="380" y="162" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Software (parte lógica)</text><text x="380" y="183" font-size="13" fill="#6B7280" text-anchor="middle">programas que escrevemos&#160; ·&#160; sistema operacional</text><line x1="380" y1="200" x2="380" y2="220" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="110" y="222" width="540" height="62" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="380" y="248" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Hardware (parte física)</text><text x="380" y="269" font-size="13" fill="#6B7280" text-anchor="middle">CPU&#160; ·&#160; memória RAM&#160; ·&#160; HD/SSD&#160; ·&#160; teclado&#160; ·&#160; monitor</text><text x="380" y="314" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Nosso código nunca mexe direto nas peças: ele vira instruções que o sistema leva até o hardware.</text></svg>