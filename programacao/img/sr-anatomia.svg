<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomia de uma função</text><text x="112.3" y="74" class="m" font-size="16" fill="#1F2937" xml:space="preserve">funcao </text><rect x="181.7" y="52" width="46.5" height="32" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="185.7" y="74" class="m" font-size="16" fill="#1F2937" xml:space="preserve">real</text><text x="230.3" y="74" class="m" font-size="16" fill="#1F2937" xml:space="preserve"> </text><rect x="241.9" y="52" width="123.6" height="32" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="245.9" y="74" class="m" font-size="16" fill="#1F2937" xml:space="preserve">calcula_area</text><text x="367.5" y="74" class="m" font-size="16" fill="#1F2937" xml:space="preserve">(</text><rect x="379.1" y="52" width="297" height="32" rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="383.1" y="74" class="m" font-size="16" fill="#1F2937" xml:space="preserve">real largura, real comprimento</text><text x="678.1" y="74" class="m" font-size="16" fill="#1F2937" xml:space="preserve">)</text><text x="112.3" y="112" class="m" font-size="15" fill="#1F2937" xml:space="preserve">{</text><text x="112.3" y="135.2" class="m" font-size="15" fill="#1F2937" xml:space="preserve">&#160; &#160; real area = largura * comprimento</text><text x="112.3" y="158.5" class="m" font-size="15" fill="#1F2937" xml:space="preserve">&#160; &#160; retorne area</text><text x="112.3" y="181.8" class="m" font-size="15" fill="#1F2937" xml:space="preserve">}</text><rect x="40" y="228" width="230" height="58" rx="8" fill="#fff" stroke="#D97706" stroke-width="2"/><text x="155" y="250" font-size="13.5" font-weight="bold" fill="#D97706" text-anchor="middle">tipo do retorno</text><text x="155" y="272" font-size="11" fill="#1F2937" text-anchor="middle">real, inteiro, cadeia...; vazio = procedimento</text><line x1="205" y1="86" x2="155" y2="226" stroke="#D97706" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#aro)"/><rect x="290" y="228" width="230" height="58" rx="8" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="405" y="250" font-size="13.5" font-weight="bold" fill="#2563EB" text-anchor="middle">nome</text><text x="405" y="272" font-size="11" fill="#1F2937" text-anchor="middle">verbo que diz o que ela faz</text><line x1="303.7" y1="86" x2="405" y2="226" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arb)"/><rect x="540" y="228" width="230" height="58" rx="8" fill="#fff" stroke="#7C3AED" stroke-width="2"/><text x="655" y="250" font-size="13.5" font-weight="bold" fill="#7C3AED" text-anchor="middle">parâmetros</text><text x="655" y="272" font-size="11" fill="#1F2937" text-anchor="middle">tipo + nome, separados por vírgula</text><line x1="527.6" y1="86" x2="655" y2="226" stroke="#7C3AED" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arp)"/><text x="362.3" y="160" font-size="12.5" font-weight="bold" fill="#16A34A">← última instrução: devolve o valor</text></svg>