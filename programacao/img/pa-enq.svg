<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="390" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">para ou enquanto?</text><rect x="20" y="50" width="360" height="230" rx="10" fill="#fff" stroke="#2563EB" stroke-width="2"/><rect x="20" y="50" width="360" height="40" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="200" y="77" class="m" font-size="17" font-weight="bold" fill="#2563EB" text-anchor="middle">para</text><text x="200" y="118" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Sei quantas voltas vou dar</text><text x="200" y="142" font-size="12" fill="#6B7280" text-anchor="middle">imprimir de 1 a 100; sortear 5 números</text><rect x="50" y="160" width="300" height="96" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><text x="66" y="192" class="m" font-size="13.5" fill="#E5E7EB" xml:space="preserve">para (i = 1; i &lt;= 5; i++) {</text><text x="66" y="212.9" class="m" font-size="13.5" fill="#E5E7EB" xml:space="preserve">&#160;&#160; escreva(i)</text><text x="66" y="233.8" class="m" font-size="13.5" fill="#E5E7EB" xml:space="preserve">}</text><rect x="400" y="50" width="360" height="230" rx="10" fill="#fff" stroke="#7C3AED" stroke-width="2"/><rect x="400" y="50" width="360" height="40" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="580" y="77" class="m" font-size="17" font-weight="bold" fill="#7C3AED" text-anchor="middle">enquanto</text><text x="580" y="118" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Não sei: depende de algo acontecer</text><text x="580" y="142" font-size="12" fill="#6B7280" text-anchor="middle">ler nomes até digitarem x; jogo até acertar</text><rect x="430" y="160" width="300" height="96" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><text x="446" y="192" class="m" font-size="13.5" fill="#E5E7EB" xml:space="preserve">enquanto (nome != &quot;x&quot;) {</text><text x="446" y="212.9" class="m" font-size="13.5" fill="#E5E7EB" xml:space="preserve">&#160;&#160; leia(nome)</text><text x="446" y="233.8" class="m" font-size="13.5" fill="#E5E7EB" xml:space="preserve">}</text></svg>