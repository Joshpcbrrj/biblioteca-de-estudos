<svg xmlns="http://www.w3.org/2000/svg" width="800" height="204" viewBox="0 0 800 204"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Entrada e saída: leia() guarda, escreva() mostra</text><rect x="20" y="70" width="120" height="64" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="80" y="98" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">teclado</text><text x="80" y="118" font-size="10.5" fill="#6B7280" text-anchor="middle">usuário digita &quot;Ana&quot;</text><line x1="142" y1="102" x2="176" y2="102" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="180" y="80" width="120" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="240" y="106.9" class="m" font-size="14" fill="#1F2937" text-anchor="middle">leia(nome)</text><line x1="302" y1="102" x2="336" y2="102" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="400" y="64" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">cadeia nome</text><rect x="350" y="76" width="100" height="52" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="400" y="107.6" class="m" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">&quot;Ana&quot;</text><line x1="452" y1="102" x2="486" y2="102" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="488" y="80" width="196" height="44" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="586" y="106.4" class="m" font-size="12.5" fill="#1F2937" text-anchor="middle">escreva(&quot;Olá, &quot;, nome)</text><line x1="686" y1="102" x2="712" y2="102" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="714" y="74" width="70" height="56" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><text x="749" y="107" class="m" font-size="11.5" fill="#E5E7EB" text-anchor="middle">Olá, Ana</text><text x="240" y="150" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="middle">entrada</text><text x="400" y="150" font-size="12.5" font-weight="bold" fill="#D97706" text-anchor="middle">memória</text><text x="586" y="150" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="middle">saída</text><text x="400" y="186" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">leia() pausa o programa até o usuário apertar Enter; o valor digitado vai para a variável.</text></svg>