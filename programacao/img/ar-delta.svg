<svg xmlns="http://www.w3.org/2000/svg" width="760" height="244" viewBox="0 0 760 244"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Calculando delta = b * b - 4 * a * c&#160; (a = 1, b = -3, c = 2)</text><rect x="185.5" y="55" width="131.8" height="31" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="188.5" y="76" class="m" font-size="19" fill="#1F2937" xml:space="preserve">(-3) * (-3)</text><text x="314.3" y="76" class="m" font-size="19" fill="#1F2937" xml:space="preserve"> - </text><rect x="345.6" y="55" width="108.9" height="31" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="348.6" y="76" class="m" font-size="19" fill="#1F2937" xml:space="preserve">4 * 1 * 2</text><text x="730" y="71" font-size="12.5" fill="#6B7280" text-anchor="end">multiplicações primeiro</text><rect x="288.4" y="107" width="63.2" height="31" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="291.4" y="128" class="m" font-size="19" fill="#1F2937" xml:space="preserve">9 - 8</text><text x="730" y="123" font-size="12.5" fill="#6B7280" text-anchor="end">depois a subtração</text><text x="314.3" y="180" class="m" font-size="19" fill="#1F2937" xml:space="preserve">1</text><text x="730" y="175" font-size="12.5" fill="#6B7280" text-anchor="end">delta</text><text x="380" y="226" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Delta &gt; 0: duas raízes reais; = 0: uma; &lt; 0: nenhuma raiz real.</text></svg>