<svg xmlns="http://www.w3.org/2000/svg" width="820" height="396" viewBox="0 0 820 396"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">A ideia da recursão: o problema chama uma versão menor de si mesmo</text><rect x="60" y="56" width="300" height="50" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="210" y="87" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">resolver(n)</text><path d="M100,106 V134" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="110" y="124" font-size="11.5" font-style="italic" fill="#2563EB">chama</text><path d="M386,159 C420,126 420,96 364,81" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><rect x="110" y="134" width="270" height="50" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="245" y="165" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">resolver(n - 1)</text><path d="M150,184 V212" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="160" y="202" font-size="11.5" font-style="italic" fill="#2563EB">chama</text><path d="M406,237 C440,204 440,174 384,159" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><rect x="160" y="212" width="240" height="50" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="280" y="243" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">resolver(n - 2)</text><path d="M200,262 V290" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="210" y="280" font-size="11.5" font-style="italic" fill="#2563EB">chama</text><path d="M426,315 C460,282 460,252 404,237" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><rect x="210" y="290" width="210" height="50" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="315" y="321" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">caso base</text><text x="560" y="82" font-size="14" font-weight="bold" fill="#2563EB">Passo recursivo (caso geral)</text><text x="560" y="104" font-size="12.5" fill="#1F2937">divide o problema em uma parte</text><text x="560" y="122" font-size="12.5" fill="#1F2937">que sabe resolver e uma versão</text><text x="560" y="140" font-size="12.5" fill="#1F2937">um pouco menor do mesmo problema</text><text x="560" y="230" font-size="14" font-weight="bold" fill="#16A34A">Caso base</text><text x="560" y="252" font-size="12.5" fill="#1F2937">o caso mais simples, resolvido</text><text x="560" y="270" font-size="12.5" fill="#1F2937">direto e sem nova chamada:</text><text x="560" y="288" font-size="12.5" fill="#1F2937">é o que faz a recursão parar</text><text x="560" y="340" font-size="12.5" font-style="italic" fill="#16A34A">← os resultados voltam subindo</text><text x="410" y="378" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Sem caso base (ou se o problema não diminuir), a função chama a si mesma para sempre.</text></svg>