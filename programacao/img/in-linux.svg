<svg xmlns="http://www.w3.org/2000/svg" width="760" height="304" viewBox="0 0 760 304"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Instalando no Linux em 3 comandos</text><circle cx="44" cy="80" r="17" fill="#2563EB"/><text x="44" y="85" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1</text><rect x="76" y="52" width="380" height="56" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><text x="92" y="86" class="m" font-size="14" fill="#E5E7EB">$ unzip portugol-studio.zip</text><text x="476" y="86" font-size="13" fill="#1F2937">descompacta e gera o script .run</text><circle cx="44" cy="154" r="17" fill="#7C3AED"/><text x="44" y="159" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">2</text><rect x="76" y="126" width="380" height="56" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><text x="92" y="160" class="m" font-size="14" fill="#E5E7EB">$ chmod 755 portugol-studio.run</text><text x="476" y="160" font-size="13" fill="#1F2937">dá permissão de execução ao script</text><circle cx="44" cy="228" r="17" fill="#16A34A"/><text x="44" y="233" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">3</text><rect x="76" y="200" width="380" height="56" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><text x="92" y="234" class="m" font-size="14" fill="#E5E7EB">$ sudo ./portugol-studio.run</text><text x="476" y="234" font-size="13" fill="#1F2937">executa o instalador como administrador</text><text x="380" y="288" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Os nomes de arquivo são exemplos: use os nomes do arquivo que você baixou.</text></svg>