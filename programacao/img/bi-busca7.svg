="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/><text x="140" y="235.2" class="m" font-size="15" fill="#1F2937" text-anchor="middle">0</text><text x="140" y="266" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[0]</text><rect x="170" y="210" width="60" height="40" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/><text x="200" y="235.2" class="m" font-size="15" fill="#1F2937" text-anchor="middle">1</text><text x="200" y="266" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[1]</text><rect x="230" y="210" width="60" height="40" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/><text x="260" y="235.2" class="m" font-size="15" fill="#1F2937" text-anchor="middle">2</text><text x="260" y="266" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[2]</text><rect x="290" y="210" width="60" height="40" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/><text x="320" y="235.2" class="m" font-size="15" fill="#1F2937" text-anchor="middle">3</text><text x="320" y="266" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[3]</text><rect x="350" y="210" width="60" height="40" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/><text x="380" y="235.2" class="m" font-size="15" fill="#1F2937" text-anchor="middle">4</text><text x="380" y="266" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[4]</text><rect x="410" y="210" width="60" height="40" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="440" y="235.2" class="m" font-size="15" fill="#1F2937" text-anchor="middle">5</text><text x="440" y="266" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[5]</text><rect x="470" y="210" width="60" height="40" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="500" y="235.2" class="m" font-size="15" fill="#1F2937" text-anchor="middle">6</text><text x="500" y="266" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">[6]</text><rect x="