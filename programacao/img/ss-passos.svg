 / 2</text><text x="540" y="242" class="m" font-size="13" fill="#1F2937">= (16 - 4) / 2 = 6</text><rect x="16" y="350" width="22" height="16" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="46" y="363" font-size="12" fill="#1F2937">posição já definitiva</text><rect x="226" y="350" width="22" height="16" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="256" y="363" font-size="12" fill="#1F2937">par que acabou de trocar (usa aux)</text></svg>