oke="#16A34A" stroke-width="1.8"/><text x="192" y="238.3" class="m" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">8</text><rect x="230" y="200" width="64" height="64" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="262" y="238.3" class="m" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">9</text><text x="76" y="96" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="end">linha 0</text><text x="76" y="166" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="end">linha 1</text><text x="76" y="236" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="end">linha 2</text><rect x="350" y="70" width="400" height="150" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><text x="366" y="100" class="m" font-size="12.5" fill="#E5E7EB" xml:space="preserve">para (linha = 0; linha &lt; 3; linha++) {</text><text x="366" y="119.4" class="m" font-size="12.5" fill="#E5E7EB" xml:space="preserve">&#160;&#160; para (coluna = 0; coluna &lt; 3; coluna++) {</text><text x="366" y="138.8" class="m" font-size="12.5" fill="#E5E7EB" xml:space="preserve">&#160; &#160; &#160; leia(matriz[linha][coluna])</text><text x="366" y="158.1" class="m" font-size="12.5" fill="#E5E7EB" xml:space="preserve">&#160;&#160; }</text><text x="366" y="177.5" class="m" font-size="12.5" fill="#E5E7EB" xml:space="preserve">}</text><text x="390" y="290" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Os números mostram a ordem de preenchimento: a linha só avança quando a coluna termina.</text></svg>