<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" viewBox="0 0 760 296"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Variável x constante</text><rect x="30" y="50" width="330" height="200" rx="10" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="195" y="78" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="middle">Variável</text><text x="195" y="106" class="m" font-size="14" fill="#1F2937" text-anchor="middle">inteiro idade = 31</text><rect x="85" y="124" width="70" height="46" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/><text x="120" y="153.3" class="m" font-size="18" fill="#1F2937" text-anchor="middle">31</text><line x1="160" y1="147" x2="228" y2="147" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><rect x="235" y="124" width="70" height="46" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="270" y="153.3" class="m" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">32</text><text x="195" y="200" class="m" font-size="14" fill="#1F2937" text-anchor="middle">idade = 32</text><text x="195" y="228" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">✓ o valor pode mudar</text><rect x="400" y="50" width="330" height="200" rx="10" fill="#fff" stroke="#7C3AED" stroke-width="2"/><text x="565" y="78" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="middle">Constante</text><text x="565" y="106" class="m" font-size="14" fill="#1F2937" text-anchor="middle">const real PI = 3.1415</text><rect x="510" y="124" width="110" height="46" rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="565" y="152.9" class="m" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">3.1415</text><rect x="632" y="140" width="26" height="22" rx="3" fill="#7C3AED" stroke="#7C3AED" stroke-width="1"/><path d="M637,140 v-6 a8,8 0 0 1 16,0 v6" fill="none" stroke="#7C3AED" stroke-width="2.5"/><text x="565" y="200" class="m" font-size="14" fill="#1F2937" text-anchor="middle">PI = 3</text><text x="565" y="228" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">✗ erro: constante não muda</text><text x="380" y="278" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Constante nasce com valor e, por convenção, tem o nome em MAIÚSCULAS.</text></svg>