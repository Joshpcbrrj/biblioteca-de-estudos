<svg xmlns="http://www.w3.org/2000/svg" width="780" height="314" viewBox="0 0 780 314"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="390" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Convertendo km/h em m/s e estimando o tempo de viagem</text><rect x="40" y="54" width="330" height="120" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="205" y="82" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">km/h → m/s: divida por 3,6</text><text x="205" y="120" class="m" font-size="19" font-weight="bold" fill="#1F2937" text-anchor="middle">90 / 3.6 = 25 m/s</text><text x="205" y="154" font-size="12" fill="#6B7280" text-anchor="middle">1 km/h = 1000 m / 3600 s</text><rect x="410" y="54" width="330" height="120" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="575" y="82" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">tempo = distância / velocidade</text><text x="575" y="120" class="m" font-size="19" font-weight="bold" fill="#1F2937" text-anchor="middle">435 / 90 ≈ 4.83 h</text><text x="575" y="154" font-size="12" fill="#6B7280" text-anchor="middle">cerca de 4 h 50 min</text><line x1="90" y1="230" x2="690" y2="230" stroke="#9CA3AF" stroke-width="6"/><line x1="110" y1="230" x2="128" y2="230" stroke="#fff" stroke-width="2"/><line x1="150" y1="230" x2="168" y2="230" stroke="#fff" stroke-width="2"/><line x1="190" y1="230" x2="208" y2="230" stroke="#fff" stroke-width="2"/><line x1="230" y1="230" x2="248" y2="230" stroke="#fff" stroke-width="2"/><line x1="270" y1="230" x2="288" y2="230" stroke="#fff" stroke-width="2"/><line x1="310" y1="230" x2="328" y2="230" stroke="#fff" stroke-width="2"/><line x1="350" y1="230" x2="368" y2="230" stroke="#fff" stroke-width="2"/><line x1="390" y1="230" x2="408" y2="230" stroke="#fff" stroke-width="2"/><line x1="430" y1="230" x2="448" y2="230" stroke="#fff" stroke-width="2"/><line x1="470" y1="230" x2="488" y2="230" stroke="#fff" stroke-width="2"/><line x1="510" y1="230" x2="528" y2="230" stroke="#fff" stroke-width="2"/><line x1="550" y1="230" x2="568" y2="230" stroke="#fff" stroke-width="2"/><line x1="590" y1="230" x2="608" y2="230" stroke="#fff" stroke-width="2"/><line x1="630" y1="230" x2="648" y2="230" stroke="#fff" stroke-width="2"/><line x1="670" y1="230" x2="688" y2="230" stroke="#fff" stroke-width="2"/><circle cx="90" cy="230" r="11" fill="#2563EB"/><circle cx="690" cy="230" r="11" fill="#16A34A"/><text x="90" y="264" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">São Paulo</text><text x="690" y="264" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Rio de Janeiro</text><text x="390" y="214" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">≈ 435 km</text><text x="390" y="296" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Atenção às unidades: distância em km com velocidade em km/h dá o tempo em horas.</text></svg>