<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.s{font-size:11.5px;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}rect{stroke-width:1.8}</style><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Operadores de atribuição compostos</text><text x="450" y="58" class="s c">Partindo sempre de x = 10</text><rect x="150" y="70" width="600" height="34" rx="4" class="xB"/><text x="250" y="92" class="b c">Forma curta</text><text x="450" y="92" class="b c">Equivale a</text><text x="650" y="92" class="b c">Resultado</text><rect x="150" y="104" width="600" height="34" rx="0" class="xY"/><text x="250" y="126" class="m c">x += 3</text><text x="450" y="126" class="m c">x = x + 3</text><text x="650" y="126" class="b c">13</text><rect x="150" y="138" width="600" height="34" rx="0" class="xW"/><text x="250" y="160" class="m c">x -= 3</text><text x="450" y="160" class="m c">x = x - 3</text><text x="650" y="160" class="b c">7</text><rect x="150" y="172" width="600" height="34" rx="0" class="xY"/><text x="250" y="194" class="m c">x *= 3</text><text x="450" y="194" class="m c">x = x * 3</text><text x="650" y="194" class="b c">30</text><rect x="150" y="206" width="600" height="34" rx="0" class="xW"/><text x="250" y="228" class="m c">x /= 2</text><text x="450" y="228" class="m c">x = x / 2</text><text x="650" y="228" class="b c">5</text></svg>