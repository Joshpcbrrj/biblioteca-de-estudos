<svg xmlns="http://www.w3.org/2000/svg" width="800" height="384" viewBox="0 0 800 384"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Como um cookie funciona</text><rect x="70" y="44" width="160" height="34" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="150" y="66" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Navegador</text><rect x="570" y="44" width="160" height="34" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="650" y="66" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Servidor</text><path d="M150,78 V340" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M650,78 V340" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="150" y1="100" x2="648" y2="112" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="400" y="98" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">POST /login</text><text x="400" y="128" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">usuário e senha</text><line x1="650" y1="160" x2="152" y2="172" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="400" y="158" class="m" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">200 OK + Set-Cookie: sessao=abc123</text><text x="400" y="188" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">o navegador guarda o cookie</text><line x1="150" y1="220" x2="648" y2="232" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="400" y="218" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">GET /carrinho&#160; Cookie: sessao=abc123</text><text x="400" y="248" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">enviado automaticamente nas próximas requisições</text><line x1="650" y1="280" x2="152" y2="292" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="400" y="278" class="m" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">200 OK (carrinho da sessão abc123)</text><text x="400" y="308" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">o servidor reconhece quem é</text><text x="400" y="364" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Atributos importantes: Expires/Max-Age, HttpOnly, Secure e SameSite.</text></svg>