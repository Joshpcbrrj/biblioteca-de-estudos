<svg xmlns="http://www.w3.org/2000/svg" width="820" height="402" viewBox="0 0 820 402"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Implementações de Set</text><rect x="345" y="50" width="130" height="34" rx="17" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 3"/><text x="410" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Collection</text><rect x="360" y="120" width="100" height="34" rx="17" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 3"/><text x="410" y="142" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Set</text><path d="M410,120 V102 H410 V95" fill="none" stroke="#6B7280" stroke-width="1.6"/><path d="M410,84 l-7,11 h14 z" fill="#fff" stroke="#6B7280" stroke-width="1.6"/><rect x="560" y="190" width="120" height="34" rx="17" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 3"/><text x="620" y="212" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">SortedSet</text><path d="M620,190 V172 H410 V165" fill="none" stroke="#6B7280" stroke-width="1.6"/><path d="M410,154 l-7,11 h14 z" fill="#fff" stroke="#6B7280" stroke-width="1.6"/><rect x="125" y="200" width="150" height="34" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="200" y="222" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">HashSet</text><path d="M200,200 V177 H410 V165" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M410,154 l-7,11 h14 z" fill="#fff" stroke="#6B7280" stroke-width="1.6"/><rect x="115" y="290" width="170" height="34" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="200" y="312" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">LinkedHashSet</text><path d="M200,290 V262 H200 V245" fill="none" stroke="#6B7280" stroke-width="1.6"/><path d="M200,234 l-7,11 h14 z" fill="#fff" stroke="#6B7280" stroke-width="1.6"/><rect x="550" y="290" width="140" height="34" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="620" y="312" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">TreeSet</text><path d="M620,290 V257 H620 V235" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M620,224 l-7,11 h14 z" fill="#fff" stroke="#6B7280" stroke-width="1.6"/><text x="200" y="352" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">estende HashSet + lista ligada</text><text x="320" y="222" font-size="12" fill="#1F2937">sem ordem · O(1)</text><text x="290" y="312" font-size="12" fill="#1F2937">ordem de inserção</text><text x="620" y="342" font-size="12" fill="#1F2937" text-anchor="middle">ordenado · O(log n)</text><text x="410" y="384" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Todos rejeitam elementos repetidos: HashSet/LinkedHashSet usam equals + hashCode; TreeSet usa compareTo.</text></svg>