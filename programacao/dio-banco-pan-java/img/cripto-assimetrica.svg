<svg xmlns="http://www.w3.org/2000/svg" width="860" height="288" viewBox="0 0 860 288"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="430" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Criptografia assimétrica: par de chaves</text><rect x="30" y="80" width="140" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="100" y="115" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Ana</text><rect x="690" y="80" width="140" height="60" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="760" y="107" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Rui</text><text x="760" y="125" font-size="11.5" fill="#6B7280" text-anchor="middle">dono do par</text><rect x="250" y="80" width="120" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="310" y="115" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">cifrar</text><rect x="490" y="80" width="120" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="550" y="115" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">decifrar</text><rect x="380" y="92" width="100" height="36" rx="6" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="430" y="115" class="m" font-size="12" fill="#E5E7EB" text-anchor="middle">Qz7&amp;e@</text><line x1="172" y1="110" x2="248" y2="110" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><line x1="372" y1="110" x2="378" y2="110" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><line x1="482" y1="110" x2="488" y2="110" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><line x1="612" y1="110" x2="688" y2="110" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="310" y="178" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">🔓 pública do Rui</text><text x="550" y="178" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">🔐 privada do Rui</text><line x1="310" y1="160" x2="310" y2="142" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><line x1="550" y1="160" x2="550" y2="142" stroke="#DC2626" stroke-width="2" marker-end="url(#arr)"/><text x="430" y="220" font-size="12.5" fill="#1F2937" text-anchor="middle">qualquer um cifra com a chave pública; só a privada decifra</text><text x="430" y="242" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">assinatura digital: o inverso — assina com a privada, qualquer um confere com a pública</text><text x="430" y="266" font-size="12.5" fill="#1F2937" text-anchor="middle">✔ resolve a troca de chaves (RSA, ECC)&#160;&#160; ✖ bem mais lenta que a simétrica</text></svg>