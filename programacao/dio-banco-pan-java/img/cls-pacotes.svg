<svg xmlns="http://www.w3.org/2000/svg" width="820" height="314" viewBox="0 0 820 314"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Organizando classes em pacotes</text><text x="50" y="72" font-size="14" fill="#1F2937">📁 src</text><text x="76" y="100" font-size="14" fill="#1F2937">📁 com</text><text x="102" y="128" font-size="14" fill="#1F2937">📁 suaempresa</text><text x="128" y="156" font-size="14" font-weight="bold" fill="#2563EB">📁 conta</text><text x="154" y="184" font-size="14" fill="#1F2937">📄 ContaBanco.java</text><text x="154" y="212" font-size="14" fill="#1F2937">📄 ContaPoupanca.java</text><text x="128" y="240" font-size="14" font-weight="bold" fill="#2563EB">📁 cliente</text><text x="154" y="268" font-size="14" fill="#1F2937">📄 Cliente.java</text><rect x="420" y="60" width="370" height="200" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="440" y="88" font-size="13" font-weight="bold" fill="#1F2937">No topo de ContaBanco.java:</text><text x="440" y="116" class="m" font-size="14" fill="#7C3AED" xml:space="preserve">package com.suaempresa.conta;</text><text x="440" y="156" font-size="13" font-weight="bold" fill="#1F2937">Nome simples:</text><text x="440" y="178" class="m" font-size="14" fill="#2563EB" xml:space="preserve">ContaBanco</text><text x="440" y="212" font-size="13" font-weight="bold" fill="#1F2937">Nome qualificado:</text><text x="440" y="234" class="m" font-size="14" fill="#2563EB" xml:space="preserve">com.suaempresa.conta.ContaBanco</text><text x="410" y="296" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Pacote = pasta. Convenção: domínio da empresa ao contrário, tudo em minúsculas.</text></svg>