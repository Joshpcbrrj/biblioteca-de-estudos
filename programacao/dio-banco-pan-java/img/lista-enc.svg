<svg xmlns="http://www.w3.org/2000/svg" width="820" height="262" viewBox="0 0 820 262"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Lista encadeada: remover = religar a referência do anterior</text><text x="20" y="98" class="m" font-size="13" fill="#7C3AED" xml:space="preserve">entrada</text><line x1="84" y1="92" x2="98" y2="92" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arp)"/><rect x="100" y="70" width="130" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><line x1="196" y1="70" x2="196" y2="114" stroke="#2563EB" stroke-width="1.5"/><text x="110" y="97" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">teste1</text><circle cx="213" cy="92" r="4" fill="#2563EB"/><line x1="213" y1="92" x2="268" y2="92" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arb)"/><rect x="270" y="70" width="130" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><line x1="366" y1="70" x2="366" y2="114" stroke="#2563EB" stroke-width="1.5"/><text x="280" y="97" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">teste2</text><circle cx="383" cy="92" r="4" fill="#2563EB"/><rect x="440" y="70" width="130" height="44" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><line x1="536" y1="70" x2="536" y2="114" stroke="#DC2626" stroke-width="1.5"/><text x="450" y="97" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">teste3</text><circle cx="553" cy="92" r="4" fill="#DC2626"/><line x1="553" y1="92" x2="608" y2="92" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arb)"/><rect x="610" y="70" width="130" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><line x1="706" y1="70" x2="706" y2="114" stroke="#2563EB" stroke-width="1.5"/><text x="620" y="97" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">teste4</text><circle cx="723" cy="92" r="4" fill="#2563EB"/><line x1="383" y1="92" x2="438" y2="92" stroke="#F3F4F6" stroke-width="1.8"/><path d="M383,92 C430,160 560,160 608,116" fill="none" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arv)"/><text x="495" y="168" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="middle">novo ponteiro: teste2 → teste4</text><text x="505" y="62" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">remove(2)</text><line x1="723" y1="92" x2="760" y2="92" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arb)"/><text x="764" y="97" font-size="14" font-weight="bold" fill="#DC2626">null</text><rect x="30" y="196" width="760" height="50" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="410" y="218" font-size="13" fill="#1F2937" text-anchor="middle">get(i) e remove(i) precisam percorrer desde a entrada: custo O(n).</text><text x="410" y="236" font-size="12.5" font-style="italic" fill="#6B7280" text-anchor="middle">Em compensação, inserir ou remover não desloca nenhum elemento.</text></svg>