f" stroke-width="0"/><text x="594.5" y="292" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">git restore --staged</text><line x1="497" y1="345" x2="306" y2="345" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arg)"/><rect x="349.9" y="317.5" width="99.2" height="21.5" rx="5" fill="#fff" stroke="#fff" stroke-width="0"/><text x="399.5" y="332" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">git restore</text><line x1="302" y1="385" x2="111" y2="385" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arg)"/><rect x="139.4" y="357.5" width="130.2" height="21.5" rx="5" fill="#fff" stroke="#fff" stroke-width="0"/><text x="204.5" y="372" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">git rm --cached</text></svg>