<svg xmlns="http://www.w3.org/2000/svg" width="480" height="454" viewBox="0 0 480 454"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Os quatro estados de um arquivo</text><rect x="40" y="80" width="160" height="56" rx="6" class="xY"/><text x="120.0" y="104.5" class="b c">Untracked</text><text x="120.0" y="122.5" class="s c">não rastreado</text><rect x="280" y="80" width="160" height="56" rx="6" class="xG"/><text x="360.0" y="104.5" class="b c">Staged</text><text x="360.0" y="122.5" class="s c">preparado</text><rect x="40" y="300" width="160" height="56" rx="6" class="xB"/><text x="120.0" y="324.5" class="b c">Unmodified</text><text x="120.0" y="342.5" class="s c">igual ao commit</text><rect x="280" y="300" width="160" height="56" rx="6" class="xO"/><text x="360.0" y="324.5" class="b c">Modified</text><text x="360.0" y="342.5" class="s c">alterado</text><path d="M200,96 L280,96" class="l" marker-end="url(#a)"/><text x="240" y="88" class="m s c">git add</text><path d="M360,136 L240,300" class="l" marker-end="url(#a)"/><text x="292" y="212" class="m s r">git commit</text><path d="M200,322 L280,322" class="l" marker-end="url(#a)"/><text x="240" y="338" class="s c">editar</text><path d="M360,300 L360,136" class="l" marker-end="url(#a)"/><text x="368" y="230" class="m s">git add</text><path d="M280,124 L200,124" class="l d" marker-end="url(#a)"/><text x="240" y="142" class="m s c">git rm --cached</text><path d="M280,350 L200,350" class="l d" marker-end="url(#a)"/><text x="240" y="374" class="m s c">git restore</text><path d="M120,300 L120,136" class="l d" marker-end="url(#a)"/><text x="110" y="222" class="m s r">git rm</text><text x="110" y="240" class="m s r">--cached</text><text x="240.0" y="410" class="n c">Setas cheias: avançam. Tracejadas: desfazem.</text><text x="240.0" y="430" class="n c">git restore --staged volta de Staged a Modified.</text></svg>