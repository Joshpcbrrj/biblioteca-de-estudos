<svg xmlns="http://www.w3.org/2000/svg" width="820" height="334" viewBox="0 0 820 334"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Map: pares chave → valor (fora da hierarquia de Collection)</text><rect x="360" y="50" width="100" height="34" rx="17" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 3"/><text x="410" y="72" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Map</text><rect x="590" y="120" width="120" height="34" rx="17" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 3"/><text x="650" y="142" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">SortedMap</text><path d="M650,120 V102 H410 V95" fill="none" stroke="#6B7280" stroke-width="1.6"/><path d="M410,84 l-7,11 h14 z" fill="#fff" stroke="#6B7280" stroke-width="1.6"/><rect x="100" y="130" width="140" height="34" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="170" y="152" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">HashMap</text><path d="M170,130 V107 H410 V95" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M410,84 l-7,11 h14 z" fill="#fff" stroke="#6B7280" stroke-width="1.6"/><rect x="85" y="220" width="170" height="34" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="170" y="242" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">LinkedHashMap</text><path d="M170,220 V192 H170 V175" fill="none" stroke="#6B7280" stroke-width="1.6"/><path d="M170,164 l-7,11 h14 z" fill="#fff" stroke="#6B7280" stroke-width="1.6"/><rect x="585" y="220" width="130" height="34" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="650" y="242" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">TreeMap</text><path d="M650,220 V187 H650 V165" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M650,154 l-7,11 h14 z" fill="#fff" stroke="#6B7280" stroke-width="1.6"/><text x="170" y="280" font-size="12" fill="#1F2937" text-anchor="middle">ordem de inserção</text><text x="180" y="196" font-size="12" fill="#1F2937">sem ordem · O(1)</text><text x="650" y="280" font-size="12" fill="#1F2937" text-anchor="middle">chaves ordenadas · O(log n)</text><rect x="320" y="140" width="180" height="120" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="410" y="162" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">exemplo</text><text x="340" y="188" class="m" font-size="13" fill="#1F2937" xml:space="preserve">&quot;Gol&quot;&#160;&#160; → 15.2</text><text x="340" y="210" class="m" font-size="13" fill="#1F2937" xml:space="preserve">&quot;Uno&quot;&#160;&#160; → 15.6</text><text x="340" y="232" class="m" font-size="13" fill="#1F2937" xml:space="preserve">&quot;Mobi&quot;&#160; → 16.1</text><text x="410" y="316" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Chaves são únicas: um put() com chave repetida substitui o valor anterior.</text></svg>