<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Map: pares chave → valor</text><rect x="186.0" y="52" width="108" height="32" rx="6" class="xP"/><text x="240" y="73" class="m s b c">Map</text><rect x="20" y="110" width="440" height="56" rx="6" class="xB"/><text x="36" y="134" class="m b">HashMap</text><text x="220" y="134" class="s">sem ordem</text><text x="220" y="154" class="s b">O(1)</text><rect x="20" y="180" width="440" height="56" rx="6" class="xB"/><text x="36" y="204" class="m b">LinkedHashMap</text><text x="220" y="204" class="s">ordem de inserção</text><text x="220" y="224" class="s b"></text><rect x="20" y="250" width="440" height="56" rx="6" class="xB"/><text x="36" y="274" class="m b">TreeMap</text><text x="220" y="274" class="s">chaves ordenadas</text><text x="220" y="294" class="s b">O(log n)</text><rect x="20" y="330" width="440" height="96" rx="6" class="xY"/><text x="36" y="354" class="s b">exemplo: consumo (km/l)</text><text x="36" y="378" c