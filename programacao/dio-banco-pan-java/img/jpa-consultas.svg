<svg xmlns="http://www.w3.org/2000/svg" width="720" height="696" viewBox="0 0 720 696">
<style>.t{font:bold 17px Helvetica, Arial, sans-serif;fill:#1F2937}.b{font:bold 16px Helvetica, Arial, sans-serif;fill:#1F2937}.n{font:15px Helvetica, Arial, sans-serif;fill:#1F2937}.s{font:14px Helvetica, Arial, sans-serif;fill:#4B5563}.c{font:15px Menlo, Consolas, monospace;fill:#1F2937}.r{font:bold 15px Helvetica, Arial, sans-serif;fill:#4B5563}.l{stroke:#4B5563;stroke-width:2.5;fill:none}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4B5563"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/><text x="360" y="34" class="t" text-anchor="middle">O nome do método vira a consulta</text><rect x="40" y="60" width="640" height="84" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="60" y="92" class="c" text-anchor="start">findByEmail(email)</text><text x="60" y="124" class="c" fill="#2563EB" text-anchor="start">→ WHERE email = ?</text><rect x="40" y="160" width="640" height="84" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="60" y="192" class="c" text-anchor="start">findByIdadeGreaterThan(18)</text><text x="60" y="224" class="c" fill="#2563EB" text-anchor="start">→ WHERE idade > ?</text><rect x="40" y="260" width="640" height="84" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="60" y="292" class="c" text-anchor="start">findByNomeContaining(txt)</text><text x="60" y="324" class="c" fill="#2563EB" text-anchor="start">→ WHERE nome LIKE '%txt%'</text><rect x="40" y="360" width="640" height="84" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="60" y="392" class="c" text-anchor="start">findByCidadeOrderByNome(c)</text><text x="60" y="424" class="c" fill="#2563EB" text-anchor="start">→ WHERE cidade = ? ORDER BY nome</text><rect x="40" y="460" width="640" height="84" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="60" y="492" class="c" text-anchor="start">existsByEmail(email)</text><text x="60" y="524" class="c" fill="#2563EB" text-anchor="start">→ SELECT 1 ... WHERE email = ?</text><rect x="40" y="560" width="640" height="84" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="60" y="592" class="c" text-anchor="start">countByCidade(c)</text><text x="60" y="624" class="c" fill="#2563EB" text-anchor="start">→ SELECT COUNT(*) ... WHERE ...</text><text x="360" y="672" class="s" text-anchor="middle">O Spring Data lê o nome e gera a consulta sozinho.</text></svg>