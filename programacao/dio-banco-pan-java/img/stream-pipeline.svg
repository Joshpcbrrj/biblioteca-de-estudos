<svg xmlns="http://www.w3.org/2000/svg" width="820" height="310" viewBox="0 0 820 310"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">O caminho de uma Stream</text><rect x="30" y="56" width="240" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="150" y="82" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">Fonte</text><text x="97.5" y="112" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">lista.stream()</text><text x="150" y="146" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">coleção, array, arquivo…</text><line x1="272" y1="111" x2="293" y2="111" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="295" y="56" width="240" height="110" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="415" y="82" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">Operações intermediárias</text><text x="317.5" y="112" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">.filter() .map() .sorted()</text><text x="415" y="146" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">devolvem outra Stream (lazy)</text><line x1="537" y1="111" x2="558" y2="111" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="560" y="56" width="240" height="110" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="680" y="82" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">Operação terminal</text><text x="575" y="112" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">.collect() .forEach() .sum()</text><text x="680" y="146" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">dispara o processamento</text><rect x="30" y="190" width="760" height="80" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><text x="46" y="216" class="m" font-size="13" fill="#E5E7EB" xml:space="preserve">List&lt;String&gt; nomes = List.of(&quot;João&quot;, &quot;Maria&quot;, &quot;José&quot;, &quot;Pedro&quot;);</text><text x="46" y="237" class="m" font-size="13" fill="#E5E7EB" xml:space="preserve">nomes.stream().filter(n -&gt; n.startsWith(&quot;J&quot;)).map(String::toUpperCase)</text><text x="46" y="258" class="m" font-size="13" fill="#E5E7EB" xml:space="preserve">&#160; &#160;&#160; .collect(Collectors.toList());&#160;&#160; // [JOÃO, JOSÉ]</text><text x="410" y="292" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Nada é executado até a operação terminal — e a coleção original não é alterada.</text></svg>