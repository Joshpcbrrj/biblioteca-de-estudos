<svg xmlns="http://www.w3.org/2000/svg" width="820" height="322" viewBox="0 0 820 322"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Os 12 princípios ágeis, resumidos</text><rect x="30" y="52" width="244" height="54" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><circle cx="56" cy="79" r="14" fill="#2563EB"/><text x="56" y="84" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="78" y="84" font-size="12.5" fill="#1F2937">Entregar valor cedo e sempre</text><rect x="288" y="52" width="244" height="54" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><circle cx="314" cy="79" r="14" fill="#2563EB"/><text x="314" y="84" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="336" y="84" font-size="12.5" fill="#1F2937">Mudanças são bem-vindas</text><rect x="546" y="52" width="244" height="54" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><circle cx="572" cy="79" r="14" fill="#2563EB"/><text x="572" y="84" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="594" y="84" font-size="12.5" fill="#1F2937">Entregas frequentes (semanas)</text><rect x="30" y="118" width="244" height="54" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><circle cx="56" cy="145" r="14" fill="#16A34A"/><text x="56" y="150" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="78" y="150" font-size="12.5" fill="#1F2937">Negócio e devs juntos, todo dia</text><rect x="288" y="118" width="244" height="54" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><circle cx="314" cy="145" r="14" fill="#16A34A"/><text x="314" y="150" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">5</text>