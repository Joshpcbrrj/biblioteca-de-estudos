<svg xmlns="http://www.w3.org/2000/svg" width="860" height="376" viewBox="0 0 860 376"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="430" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Abertura de uma conexão WebSocket</text><rect x="90" y="44" width="160" height="34" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="170" y="66" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Cliente</text><rect x="610" y="44" width="160" height="34" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="690" y="66" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Servidor</text><path d="M170,78 V332" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M690,78 V332" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="170" y1="100" x2="688" y2="112" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="430" y="98" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">GET /chat&#160; Upgrade: websocket</text><text x="430" y="128" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">Connection: Upgrade + Sec-WebSocket-Key (aleatória)</text><line x1="690" y1="158" x2="172" y2="170" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="430" y="156" class="m" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">101 Switching Protocols</text><text x="430" y="186" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">Sec-WebSocket-Accept = hash da chave do cliente</text><line x1="170" y1="216" x2="688" y2="228" stroke="#7C3AED" stroke-width="2" marker-end="url(#arp)"/><text x="430" y="214" class="m" font-size="13" font-weight="bold" fill="#7C3AED" text-anchor="middle">frame: &quot;oi&quot;</text><text x="430" y="244" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">a partir daqui não é mais HTTP: são frames WebSocket</text><line x1="690" y1="274" x2="172" y2="286" stroke="#7C3AED" stroke-width="2" marker-end="url(#arp)"/><text x="430" y="272" class="m" font-size="13" font-weight="bold" fill="#7C3AED" text-anchor="middle">frame: &quot;olá!&quot;</text><text x="430" y="302" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">qualquer lado envia a qualquer momento</text><text x="430" y="356" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Endereços ws:// (sem criptografia) e wss:// (com TLS, como o HTTPS).</text></svg>