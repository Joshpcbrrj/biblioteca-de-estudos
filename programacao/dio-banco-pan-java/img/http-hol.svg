<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="440" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Head-of-line blocking</text><text x="220" y="62" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">HTTP/1.1: fila por conexão</text><rect x="40" y="82" width="200" height="40" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="140" y="107" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">CSS (lento)</text><rect x="248" y="82" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="283" y="107" font-size="12" fill="#1F2937" text-anchor="middle">JS</text><rect x="326" y="82" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="361" y="107" font-size="12" fill="#1F2937" text-anchor="middle">img</text><text x="220" y="150" font-size="12.5" fill="#DC2626" text-anchor="middle">JS e imagem esperam o CSS terminar</text><text x="220" y="170" font-size="11.5" font-style="italic" fill="#6B7280" text-anchor="middle">(navegadores abrem ~6 conexões para contornar)</text><line x1="440" y1="50" x2="440" y2="200" stroke="#9CA3AF" stroke-width="2"/><text x="660" y="62" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">HTTP/2: streams intercalados</text><rect x="480" y="82" width="40" height="40" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><rect x="526" y="82" width="40" height="40" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><rect x="572" y="82" width="40" height="40" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><rect x="618" y="82" width="40" height="40" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><rect x="664" y="82" width="40" height="40" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><rect x="710" y="82" width="40" height="40" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><rect x="756" y="82" width="40" height="40" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><rect x="802" y="82" width="40" height="40" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="660" y="150" font-size="12.5" fill="#16A34A" text-anchor="middle">pedaços de vários recursos na mesma conexão</text><text x="660" y="170" font-size="11.5" font-style="italic" fill="#6B7280" text-anchor="middle">um recurso lento não trava os outros</text><text x="440" y="222" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">No HTTP/2 ainda existe HOL no TCP (um pacote perdido segura todos os streams); o HTTP/3 (QUIC) resolve isso.</text></svg>