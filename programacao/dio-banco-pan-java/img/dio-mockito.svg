<svg xmlns="http://www.w3.org/2000/svg" width="480" height="408" viewBox="0 0 480 408"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Teste com Mockito: Arrange, Act, Assert</text><rect x="20" y="56" width="150" height="52" rx="6" class="xB"/><text x="95.0" y="78.5" class="b c">teste JUnit</text><text x="95.0" y="96.5" class="m c">@Test</text><rect x="220" y="56" width="240" height="52" rx="6" class="xG"/><text x="340.0" y="78.5" class="m b c">TransferenciaService</text><text x="340.0" y="96.5" class="s c">classe real (@InjectMocks)</text><rect x="220" y="150" width="110" height="52" rx="6" class="xO"/><text x="275.0" y="172.5" class="m b c">contas</text><text x="275.0" y="190.5" class="m c">@Mock</text><rect x="350" y="150" width="110" height="52" rx="6" class="xO"/><text x="405.0" y="172.5" class="m b c">notificacao</text><text x="405.0" y="190.5" class="m c">@Mock</text><path d="M170,82 L220,82" class="l" marker-end="url(#a)"/><path d="M275,108 L275,150" class="l" marker-end="url(#a)"/><path d="M405,108 L405,150" class="l" marker-end="url(#a)"/><rect x="20" y="232" width="440" height="124" rx="6" class="xW"/><text x="36" y="256" class="m">1 Arrange: when(contas.findById(1L))</text><text x="36" y="276" class="m">            .thenReturn(Optional.of(origem));</text><text x="36" y="296" class="m">2 Act:     service.transferir(1L, 2L, 200);</text><text x="36" y="316" class="m">3 Assert:  assertEquals(300, saldo) e</text><text x="36" y="336" class="m">           verify(contas, times(2)).save(any());</text><text x="240.0" y="384" class="n c">Sem banco e sem e-mail de verdade: só a regra é testada.</text></svg>