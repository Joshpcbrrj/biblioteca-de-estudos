"132" x2="355" y2="178" stroke="#DC2626" stroke-width="2" marker-end="url(#arr)"/><text x="366" y="160" font-size="11.5" fill="#DC2626">exceção sobe</text><rect x="540" y="150" width="310" height="130" rx="8" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="556" y="176" class="m" font-size="12" fill="#93C5FD" xml:space="preserve">HTTP/1.1 404 Not Found</text><text x="556" y="194" class="m" font-size="12" fill="#E5E7EB" xml:space="preserve">{</text><text x="556" y="212" class="m" font-size="12" fill="#86EFAC" xml:space="preserve">&#160; &quot;status&quot;: 404,</text><text x="556" y="230" class="m" font-size="12" fill="#86EFAC" xml:space="preserve">&#160; &quot;erro&quot;: &quot;Usuário 7 não</text><text x="556" y="248" class="m" font-size="12" fill="#86EFAC" xml:space="preserve">&#160; &#160; &#160; &#160; &#160;&#160; encontrado&quot;</text><text x="556" y="266" class="m" font-size="12" fill="#E5E7EB" xml:space="preserve">}</text><line x1="452" y1="215" x2="538" y2="215" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="495" y="206" font-size="11.5" font-weight="bold" fill="#16A34A" text-anchor="middle">resposta</text><text x="440" y="310" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Um único lugar transforma exceções em respostas HTTP padronizadas, sem try/catch em cada endpoint.</text></svg>