<svg xmlns="http://www.w3.org/2000/svg" width="820" height="392" viewBox="0 0 820 392"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Modelo tradicional (cascata / waterfall)</text><rect x="40" y="50" width="170" height="40" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="125" y="76" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Requisitos</text><path d="M210,70 H235 V94" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arg)"/><rect x="180" y="96" width="170" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="265" y="122" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Projeto</text><path d="M350,116 H375 V140" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arg)"/><rect x="320" y="142" width="170" height="40" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="405" y="168" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Implementação</text><path d="M490,162 H515 V186" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arg)"/><rect x="460" y="188" width="170" height="40" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="545" y="214" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Testes</text><path d="M630,208 H655 V232" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arg)"/><rect x="600" y="234" width="170" height="40" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="685" y="260" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Entrega</text><text x="40" y="330" font-size="13" fill="#1F2937">• cada fase só começa quando a anterior termina</text><text x="40" y="352" font-size="13" fill="#1F2937">• escopo, custo e prazo definidos no início</text><text x="40" y="374" font-size="13" font-weight="bold" fill="#DC2626">• o cliente só vê valor no fim do projeto</text></svg>