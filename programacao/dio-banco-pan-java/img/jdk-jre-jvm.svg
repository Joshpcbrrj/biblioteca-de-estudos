<svg xmlns="http://www.w3.org/2000/svg" width="820" height="338" viewBox="0 0 820 338"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">JDK, JRE e JVM: um dentro do outro</text><rect x="40" y="46" width="740" height="250" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="70" y="76" font-size="18" font-weight="bold" fill="#2563EB">JDK</text><text x="70" y="98" font-size="12.5" fill="#1F2937">kit para PROGRAMAR</text><text x="70" y="130" font-size="13" fill="#1F2937">+ javac (compilador)</text><text x="70" y="154" font-size="13" fill="#1F2937">+ javadoc, jar, jshell</text><text x="70" y="178" font-size="13" fill="#1F2937">+ depurador (jdb) e outras</text><rect x="330" y="66" width="430" height="210" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="355" y="94" font-size="17" font-weight="bold" fill="#16A34A">JRE</text><text x="355" y="116" font-size="12.5" fill="#1F2937">kit para RODAR</text><text x="355" y="146" font-size="13" fill="#1F2937">+ bibliotecas padrão</text><text x="355" y="170" font-size="12" fill="#6B7280">(java.lang, java.util…)</text><rect x="570" y="100" width="170" height="150" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="655" y="134" font-size="17" font-weight="bold" fill="#7C3AED" text-anchor="middle">JVM</text><text x="655" y="164" font-size="12.5" fill="#1F2937" text-anchor="middle">máquina virtual</text><text x="655" y="184" font-size="12.5" fill="#1F2937" text-anchor="middle">que executa</text><text x="655" y="204" font-size="12.5" fill="#1F2937" text-anchor="middle">o bytecode</text><text x="410" y="320" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Para desenvolver, instale o JDK — ele já traz o JRE e a JVM.</text></svg>