<svg xmlns="http://www.w3.org/2000/svg" width="480" height="448" viewBox="0 0 480 448"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">JDK, JRE e JVM: um dentro do outro</text><rect x="20" y="52" width="440" height="320" rx="6" class="xO"/><text x="36" y="78" class="b">JDK: kit para PROGRAMAR</text><text x="36" y="100" class="m s">+ javac, javadoc, jar, jshell, jdb</text><rect x="50" y="118" width="380" height="236" rx="6" class="xB"/><text x="66" y="144" class="b">JRE: kit para RODAR</text><text x="66" y="166" class="m s">+ bibliotecas (java.lang, java.util…)</text><rect x="80" y="186" width="320" height="150" rx="6" class="xP"/><text x="240" y="240" class="b c" style="font-size:20px">JVM</text><text x="240" y="270" class="s c">máquina virtual que</text><text x="240" y="290" class="s c">executa o bytecode</text><text x="240.0" y="404" class="n c">Para desenvolver, instale o JDK:</text><text x="240.0" y="424" class="n c">ele já traz o JRE e a JVM.</text></svg>