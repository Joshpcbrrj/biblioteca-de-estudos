<svg xmlns="http://www.w3.org/2000/svg" width="900" height="232" viewBox="0 0 900 232"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Camadas da API (Spring Data JPA)</text><rect x="20" y="70" width="150" height="64" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="95" y="99" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Cliente</text><text x="95" y="117" font-size="11.5" fill="#6B7280" text-anchor="middle">Swagger / Postman</text><rect x="198" y="70" width="150" height="64" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="273" y="99" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Controller</text><text x="273" y="117" font-size="11.5" fill="#6B7280" text-anchor="middle">@RestController</text><line x1="172" y1="94" x2="196" y2="94" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><line x1="196" y1="112" x2="172" y2="112" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><rect x="376" y="70" width="150" height="64" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="451" y="99" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Service</text><text x="451" y="117" font-size="11.5" fill="#6B7280" text-anchor="middle">@Service</text><line x1="350" y1="94" x2="374" y2="94" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><line x1="374" y1="112" x2="350" y2="112" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><rect x="554" y="70" width="150" height="64" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="629" y="99" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Repository</text><text x="629" y="117" font-size="11.5" fill="#6B7280" text-anchor="middle">JpaRepository</text><line x1="528" y1="94" x2="552" y2="94" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><line x1="552" y1="112" x2="528" y2="112" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><rect x="732" y="70" width="150" height="64" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="807" y="99" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Banco</text><text x="807" y="117" font-size="11.5" fill="#6B7280" text-anchor="middle">PostgreSQL / H2</text><line x1="706" y1="94" x2="730" y2="94" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><line x1="730" y1="112" x2="706" y2="112" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="186" y="160" class="m" font-size="11.5" fill="#2563EB" text-anchor="middle">Form (entrada)</text><text x="186" y="178" class="m" font-size="11.5" fill="#16A34A" text-anchor="middle">entidade (saída)</text><text x="542" y="160" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">save / findAll / findById</text><text x="720" y="160" font-size="11.5" font-style="italic" fill="#6B7280" text-anchor="middle">SQL gerado pelo Hibernate</text><text x="450" y="214" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Controller recebe HTTP, Service aplica as regras, Repository conversa com o banco via JPA/Hibernate.</text></svg>