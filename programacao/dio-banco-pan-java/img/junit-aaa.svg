<svg xmlns="http://www.w3.org/2000/svg" width="820" height="314" viewBox="0 0 820 314"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomia de um teste: Arrange · Act · Assert</text><rect x="30" y="54" width="240" height="150" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="150" y="80" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">Arrange</text><text x="150" y="100" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">prepara</text><rect x="42" y="116" width="216" height="70" rx="6" fill="#fff" stroke="#2563EB" stroke-width="1"/><text x="52" y="142" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">Pessoa p = new Pessoa(</text><text x="52" y="161.4" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">&#160; &#160; &quot;João&quot;, 25);</text><rect x="295" y="54" width="240" height="150" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="415" y="80" font-size="16" font-weight="bold" fill="#D97706" text-anchor="middle">Act</text><text x="415" y="100" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">executa</text><rect x="307" y="116" width="216" height="70" rx="6" fill="#fff" stroke="#D97706" stroke-width="1"/><text x="317" y="142" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">boolean maior =</text><text x="317" y="161.4" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">&#160; &#160; p.ehMaiorDeIdade();</text><line x1="273" y1="129" x2="292" y2="129" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="560" y="54" width="240" height="150" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="680" y="80" font-size="16" font-weight="bold" fill="#16A34A" text-anchor="middle">Assert</text><text x="680" y="100" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">confere</text><rect x="572" y="116" width="216" height="70" rx="6" fill="#fff" stroke="#16A34A" stroke-width="1"/><text x="582" y="142" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">assertTrue(maior);</text><line x1="538" y1="129" x2="557" y2="129" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="250" y="228" width="320" height="40" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="410" y="253" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">✔ verde: passou&#160; &#160; ✖ vermelho: falhou</text><text x="410" y="296" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Um teste unitário verifica uma única unidade (um método) de forma isolada e automática.</text></svg>