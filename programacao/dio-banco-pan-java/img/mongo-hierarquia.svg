<svg xmlns="http://www.w3.org/2000/svg" width="780" height="344" viewBox="0 0 780 344"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="390" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Como o MongoDB organiza os dados</text><rect x="30" y="50" width="720" height="250" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="50" y="76" font-size="14" font-weight="bold" fill="#7C3AED">database: loja</text><rect x="60" y="92" width="320" height="190" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="76" y="116" font-size="13" font-weight="bold" fill="#2563EB">collection: clientes</text><rect x="76" y="130" width="288" height="40" rx="6" fill="#fff" stroke="#16A34A" stroke-width="1.5"/><text x="88" y="155" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">{ _id: 1, nome: &quot;Ana&quot; }</text><rect x="76" y="180" width="288" height="40" rx="6" fill="#fff" stroke="#16A34A" stroke-width="1.5"/><text x="88" y="205" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">{ _id: 2, nome: &quot;Rui&quot;, vip: true }</text><text x="220" y="270" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">cada caixa verde = 1 documento</text><rect x="405" y="92" width="320" height="190" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="421" y="116" font-size="13" font-weight="bold" fill="#2563EB">collection: pedidos</text><rect x="421" y="130" width="288" height="40" rx="6" fill="#fff" stroke="#16A34A" stroke-width="1.5"/><text x="433" y="155" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">{ _id: 10, cliente: 1, total: 99 }</text><rect x="421" y="180" width="288" height="40" rx="6" fill="#fff" stroke="#16A34A" stroke-width="1.5"/><text x="433" y="205" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">{ _id: 11, cliente: 2, total: 45 }</text><text x="565" y="270" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">cada caixa verde = 1 documento</text><text x="390" y="326" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">database → collections → documentos (equivalem, grosso modo, a banco → tabelas → linhas).</text></svg>