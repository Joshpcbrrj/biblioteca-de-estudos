<svg xmlns="http://www.w3.org/2000/svg" width="880" height="284" viewBox="0 0 880 284"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="440" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Proxy de encaminhamento x proxy reverso</text><text x="220" y="60" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">Forward proxy: representa os clientes</text><rect x="30" y="80" width="90" height="38" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="75" y="104" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">PC 1</text><line x1="122" y1="99" x2="178" y2="148" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="30" y="130" width="90" height="38" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="75" y="154" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">PC 2</text><line x1="122" y1="149" x2="178" y2="148" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="30" y="180" width="90" height="38" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="75" y="204" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">PC 3</text><line x1="122" y1="199" x2="178" y2="148" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="180" y="122" width="100" height="52" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="230" y="153" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">proxy</text><line x1="282" y1="148" x2="338" y2="148" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="340" y="122" width="80" height="52" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="380" y="153" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">🌐</text><text x="220" y="260" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">a internet vê só o IP do proxy</text><line x1="440" y1="50" x2="440" y2="280" stroke="#9CA3AF" stroke-width="2"/><text x="660" y="60" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">Reverse proxy: representa os servidores</text><rect x="460" y="122" width="80" height="52" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="500" y="153" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">🌐</text><line x1="542" y1="148" x2="598" y2="148" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="600" y="122" width="100" height="52" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="650" y="145" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">proxy</text><text x="650" y="163" font-size="11.5" fill="#6B7280" text-anchor="middle">Nginx</text><line x1="702" y1="148" x2="758" y2="99" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="760" y="80" width="100" height="38" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="810" y="104" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">app 1</text><line x1="702" y1="148" x2="758" y2="149" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="760" y="130" width="100" height="38" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="810" y="154" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">app 2</text><line x1="702" y1="148" x2="758" y2="199" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="760" y="180" width="100" height="38" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="810" y="204" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">app 3</text><text x="660" y="260" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">TLS, cache, balanceamento; o cliente não vê os servidores</text></svg>