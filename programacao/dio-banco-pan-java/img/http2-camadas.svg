<svg xmlns="http://www.w3.org/2000/svg" width="860" height="332" viewBox="0 0 860 332"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="430" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">A camada de enquadramento binário do HTTP/2</text><text x="210" y="60" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">HTTP/1.1 (texto)</text><rect x="40" y="74" width="340" height="150" rx="8" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="56" y="100" class="m" font-size="12.5" fill="#93C5FD" xml:space="preserve">POST /produtos HTTP/1.1</text><text x="56" y="122" class="m" font-size="12.5" fill="#FDE68A" xml:space="preserve">Host: api.loja.com</text><text x="56" y="144" class="m" font-size="12.5" fill="#FDE68A" xml:space="preserve">Content-Type: application/json</text><text x="56" y="188" class="m" font-size="12.5" fill="#86EFAC" xml:space="preserve">{&quot;nome&quot;:&quot;Caneca&quot;}</text><line x1="392" y1="150" x2="468" y2="150" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="650" y="60" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">HTTP/2 (binário)</text><rect x="480" y="80" width="340" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="650" y="104" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">HEADERS frame</text><text x="650" y="124" class="m" font-size="11" fill="#6B7280" text-anchor="middle">:method POST&#160; :path /produtos (HPACK)</text><rect x="480" y="156" width="340" height="60" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="650" y="180" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">DATA frame</text><text x="650" y="200" class="m" font-size="11" fill="#6B7280" text-anchor="middle">{&quot;nome&quot;:&quot;Caneca&quot;}</text><rect x="40" y="248" width="780" height="40" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="430" y="273" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">aplicação (HTTP)&#160; →&#160; enquadramento binário&#160; →&#160; TLS&#160; →&#160; TCP&#160; →&#160; IP</text><text x="430" y="314" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">A semântica não muda (métodos, status, cabeçalhos); muda só como os bytes vão para a rede.</text></svg>