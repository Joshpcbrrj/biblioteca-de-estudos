xt><line x1="378" y1="144" x2="424" y2="144" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="428" y="124" width="370" height="40" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="613" y="150" class="m" font-size="12.5" fill="#1F2937" text-anchor="middle">f7ff9e8b7bb2e09b70935a5d785e0cc5d9d0abf0</text><rect x="30" y="188" width="170" height="40" rx="6" fill="#fff" stroke="#9CA3AF" stroke-width="1.5"/><text x="115" y="214" class="m" font-size="14" fill="#1F2937" text-anchor="middle">&quot;Olá, mundo!&quot;</text><line x1="204" y1="208" x2="260" y2="208" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="264" y="182" width="110" height="52" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="319" y="213" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">SHA-1</text><line x1="378" y1="208" x2="424" y2="208" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="428" y="188" width="370" height="40" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="613" y="214" class="m" font-size="12.5" fill="#1F2937" text-anchor="middle">0c4ba6b3b0c1d6c7f2a8e9133dbfa1b2c04e7d55</text><text x="613" y="274" font-size="12.5" font-style="italic" fill="#6B7280" text-anchor="middle">40 caracteres hexadecimais (160 bits)</text><text x="410" y="302" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Os hashes acima são ilustrativos. O Git calcula o SHA-1 de cada blob, tree e commit.</text></svg>