<svg xmlns="http://www.w3.org/2000/svg" width="820" height="302" viewBox="0 0 820 302"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Modelo ágil: ciclos curtos (sprints) com entrega a cada ciclo</text><circle cx="110" cy="130" r="56" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="110" y="112" font-size="12.5" fill="#1F2937" text-anchor="middle">planejar</text><text x="110" y="132" font-size="12.5" fill="#1F2937" text-anchor="middle">fazer</text><text x="110" y="152" font-size="12.5" fill="#1F2937" text-anchor="middle">revisar</text><text x="110" y="210" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">sprint 1</text><rect x="70" y="226" width="80" height="30" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="110" y="246" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">entrega 1</text><line x1="170" y1="130" x2="236" y2="130" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="203" y="120" font-size="11" font-style="italic" fill="#D97706" text-anchor="middle">feedback</text><circle cx="300" cy="130" r="56" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="300" y="112" font-size="12.5" fill="#1F2937" text-anchor="middle">planejar</text><text x="300" y="132" font-size="12.5" fill="#1F2937" text-anchor="middle">fazer</text><text x="300" y="152" font-size="12.5" fill="#1F2937" text-anchor="middle">revisar</text><text x="300" y="210" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">sprint 2</text><rect x="260" y="226" width="80" height="30" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="300" y="246" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">entrega 2</text><line x1="360" y1="130" x2="426" y2="130" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="393" y="120" font-size="11" font-style="italic" fill="#D97706" text-anchor="middle">feedback</text><circle cx="490" cy="130" r="56" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="490" y="112" font-size="12.5" fill="#1F2937" text-anchor="middle">planejar</text><text x="490" y="132" font-size="12.5" fill="#1F2937" text-anchor="middle">fazer</text><text x="490" y="152" font-size="12.5" fill="#1F2937" text-anchor="middle">revisar</text><text x="490" y="210" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">sprint 3</text><rect x="450" y="226" width="80" height="30" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="490" y="246" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">entrega 3</text><line x1="550" y1="130" x2="616" y2="130" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="583" y="120" font-size="11" font-style="italic" fill="#D97706" text-anchor="middle">feedback</text><circle cx="680" cy="130" r="56" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="680" y="112" font-size="12.5" fill="#1F2937" text-anchor="middle">planejar</text><text x="680" y="132" font-size="12.5" fill="#1F2937" text-anchor="middle">fazer</text><text x="680" y="152" font-size="12.5" fill="#1F2937" text-anchor="middle">revisar</text><text x="680" y="210" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">sprint 4</text><rect x="640" y="226" width="80" height="30" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="680" y="246" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">entrega 4</text><text x="410" y="284" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Valor iterativo e incremental: o produto cresce um pouco a cada sprint, e o feedback guia o próximo ciclo.</text></svg>