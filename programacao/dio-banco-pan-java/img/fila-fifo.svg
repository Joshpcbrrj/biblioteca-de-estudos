<svg xmlns="http://www.w3.org/2000/svg" width="480" height="378" viewBox="0 0 480 378"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Fila (FIFO): primeiro a entrar, 1º a sair</text><rect x="20" y="100" width="104" height="44" rx="6" class="xG"/><text x="72" y="127" class="b c">Primeiro</text><rect x="132" y="100" width="104" height="44" rx="6" class="xB"/><text x="184" y="127" class="b c">Segundo</text><rect x="244" y="100" width="104" height="44" rx="6" class="xB"/><text x="296" y="127" class="b c">Terceiro</text><rect x="356" y="100" width="104" height="44" rx="6" class="xB"/><text x="408" y="127" class="b c">Quarto</text><text x="72" y="90" class="s b c">frente</text><text x="408" y="90" class="s b c">fim</text><path d="M72,144 L72,190" class="l" marker-end="url(#a)"/><rect x="20" y="190" width="130" height="50" rx="6" class="xR"/><text x="85.0" y="211.5" class="m b c">dequeue()</text><text x="85.0" y="229.5" class="s c">sai daqui</text><path d="M408,190 L408,144" class="l" marker-end="url(#a)"/><rect x="330" y="190" width="130" height="50" rx="6" class="xG"/><text x="395.0" y="211.5" class="m b c">enqueue()</text><text x="395.0" y="229.5" class="s c">entra aqui</text><rect x="20" y="264" width="440" height="40" rx="6" class="xW"/><text x="240" y="289" class="m b c">first() → "Primeiro"</text><text x="240.0" y="334" class="n c">Como a fila do banco: quem chega</text><text x="240.0" y="354" class="n c">primeiro é atendido primeiro.</text></svg>