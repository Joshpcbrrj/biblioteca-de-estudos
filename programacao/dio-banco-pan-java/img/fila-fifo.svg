<svg xmlns="http://www.w3.org/2000/svg" width="820" height="264" viewBox="0 0 820 264"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Fila (FIFO): o primeiro que entra é o primeiro que sai</text><rect x="150" y="90" width="126" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="179.4" y="120" class="m" font-size="14" fill="#1F2937" xml:space="preserve">Primeiro</text><rect x="290" y="90" width="126" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="323.6" y="120" class="m" font-size="14" fill="#1F2937" xml:space="preserve">Segundo</text><rect x="430" y="90" width="126" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="459.4" y="120" class="m" font-size="14" fill="#1F2937" xml:space="preserve">Terceiro</text><rect x="570" y="90" width="126" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="607.8" y="120" class="m" font-size="14" fill="#1F2937" xml:space="preserve">Quarto</text><text x="213" y="80" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">frente (head)</text><text x="633" y="80" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="middle">fim (tail)</text><rect x="20" y="90" width="110" height="50" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="36" y="113" class="m" font-size="12.5" fill="#DC2626" xml:space="preserve">dequeue()</text><text x="75" y="131" font-size="11.5" fill="#1F2937" text-anchor="middle">sai daqui</text><line x1="150" y1="115" x2="132" y2="115" stroke="#DC2626" stroke-width="2" marker-end="url(#arr)"/><rect x="720" y="160" width="90" height="50" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="728" y="183" class="m" font-size="12" fill="#16A34A" xml:space="preserve">enqueue()</text><text x="765" y="201" font-size="11.5" fill="#1F2937" text-anchor="middle">entra aqui</text><path d="M765,160 C765,140 740,130 712,125" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><rect x="150" y="170" width="220" height="40" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="166" y="195" class="m" font-size="13" fill="#7C3AED" xml:space="preserve">first() → &quot;Primeiro&quot;</text><text x="410" y="246" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Como a fila do banco: quem chega primeiro é atendido primeiro.</text></svg>