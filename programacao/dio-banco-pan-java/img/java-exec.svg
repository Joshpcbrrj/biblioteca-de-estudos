<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Como um programa Java é executado</text><rect x="80" y="52" width="320" height="52" rx="6" class="xW"/><text x="240.0" y="74.5" class="m b c">Ola.java</text><text x="240.0" y="92.5" class="m c">código-fonte</text><rect x="80" y="122" width="320" height="52" rx="6" class="xO"/><text x="240.0" y="144.5" class="m b c">javac</text><text x="240.0" y="162.5" class="m c">compilador</text><path d="M240.0,104 L240.0,122" class="l" marker-end="url(#a)"/><rect x="80" y="192" width="320" height="52" rx="6" class="xB"/><text x="240.0" y="214.5" class="m b c">Ola.class</text><text x="240.0" y="232.5" class="m c">bytecode (compila uma vez)</text><path d="M240.0,174 L240.0,192" class="l" marker-end="url(#a)"/><rect x="80" y="262" width="320" height="52" rx="6" class="xP"/><text x="240.0" y="284.5" class="b c">JVM</text><text x="240.0" y="302.5" class="s c">carrega, verifica e executa (JIT)</text><path d="M240.0,244 L240.0,262" c