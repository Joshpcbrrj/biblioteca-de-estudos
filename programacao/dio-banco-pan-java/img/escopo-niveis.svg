<svg xmlns="http://www.w3.org/2000/svg" width="820" height="376" viewBox="0 0 820 376"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Escopo: cada variável só existe dentro do seu bloco</text><rect x="30" y="46" width="760" height="290" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="46" y="72" class="m" font-size="14.5" fill="#2563EB" xml:space="preserve">public class Conta {</text><text x="70" y="96" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">double saldo = 10.0;&#160;&#160; // atributo: visível em TODA a classe</text><rect x="60" y="110" width="330" height="100" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="74" y="132" class="m" font-size="13.5" fill="#16A34A" xml:space="preserve">void sacar(double valor) {</text><text x="92" y="156" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">double novoSaldo = ...;</text><text x="92" y="178" class="m" font-size="12.5" fill="#6B7280" xml:space="preserve">// só existe aqui</text><text x="74" y="200" class="m" font-size="13.5" fill="#16A34A" xml:space="preserve">}</text><rect x="410" y="110" width="360" height="100" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="424" y="132" class="m" font-size="13.5" fill="#DC2626" xml:space="preserve">void imprimirSaldo() {</text><text x="442" y="156" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">println(saldo);&#160; &#160;&#160; ✔</text><text x="442" y="178" class="m" font-size="13.5" fill="#DC2626" xml:space="preserve">println(novoSaldo); ✘</text><text x="424" y="200" class="m" font-size="13.5" fill="#DC2626" xml:space="preserve">}</text><rect x="60" y="222" width="710" height="104" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="74" y="244" class="m" font-size="13.5" fill="#16A34A" xml:space="preserve">double calcularDivida() {&#160;&#160; double montante = 0;</text><rect x="90" y="254" width="520" height="52" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="104" y="276" class="m" font-size="12.5" fill="#D97706" xml:space="preserve">for (int x = 1; x &lt;= 5; x++) { double parcela = 50 * x; ... }</text><text x="104" y="296" class="m" font-size="12" fill="#6B7280" xml:space="preserve">// x e parcela só existem dentro do for</text><text x="74" y="320" class="m" font-size="13.5" fill="#16A34A" xml:space="preserve">}</text><text x="760" y="72" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="end">classe</text><text x="760" y="244" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="end">método</text><text x="756" y="284" font-size="12.5" font-weight="bold" fill="#D97706" text-anchor="end">bloco for</text><text x="410" y="358" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Um bloco interno enxerga o que está nos blocos externos — nunca o contrário.</text></svg>