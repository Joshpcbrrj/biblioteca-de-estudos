<svg xmlns="http://www.w3.org/2000/svg" width="480" height="484" viewBox="0 0 480 484"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Escopo: cada variável vive no seu bloco</text><rect x="20" y="52" width="440" height="360" rx="6" class="xB"/><text x="36" y="74" class="m b">class Conta {</text><text x="36" y="96" class="m s">double saldo;  // vale na classe toda</text><rect x="40" y="110" width="410" height="70" rx="6" class="xG"/><text x="56" y="132" class="m b">void sacar(double valor) {</text><text x="72" y="154" class="m s">double novoSaldo;  // só aqui</text><rect x="40" y="190" width="410" height="82" rx="6" class="xG"/><text x="56" y="212" class="m b">void imprimirSaldo() {</text><text x="72" y="234" class="m">println(saldo);      ✔</text><text x="72" y="256" class="m">println(novoSaldo);  ✘ não existe</text><rect x="40" y="282" width="410" height="116" rx="6" class="xG"/><text x="56" y="304" class="m b">double calcularDivida() {</text><rect x="60" y="316" width="380" height="70" rx="6" class="xO"/><text x="76" y="338" class="m b">for (int x = 1; x &lt;= 5; x++) {</text><text x="92" y="360" class="m s">double parcela = 50 * x;</text><text x="76" y="378" class="m s">}  // x e parcela morrem aqui</text><text x="240.0" y="440" class="n c">Um bloco interno enxerga os externos,</text><text x="240.0" y="460" class="n c">nunca o contrário.</text></svg>