<svg xmlns="http://www.w3.org/2000/svg" width="480" height="394" viewBox="0 0 480 394"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Pilha (LIFO): último a entrar, 1º a sair</text><rect x="60" y="70" width="140" height="38" rx="6" class="xO"/><text x="130" y="95" class="m b c">No(6)</text><rect x="60" y="114" width="140" height="38" rx="6" class="xB"/><text x="130" y="139" class="m b c">No(5)</text><rect x="60" y="158" width="140" height="38" rx="6" class="xB"/><text x="130" y="183" class="m b c">No(4)</text><rect x="60" y="202" width="140" height="38" rx="6" class="xB"/><text x="130" y="227" class="m b c">No(3)</text><rect x="60" y="246" width="140" height="38" rx="6" class="xB"/><text x="130" y="271" class="m b c">No(2)</text><rect x="60" y="290" width="140" height="38" rx="6" class="xB"/><text x="130" y="315" class="m b c">No(1)</text><text x="210" y="95" class="b">← topo</text><rect x="250" y="150" width="210" height="48" rx="6" class="xG"/><text x="355.0" y="170.5" class="m b c">push(No(7))</text><text x="355.0" y="188.5" class="s c">coloca no topo</text><rect x="250" y="208" width="210" height="48" rx="6" class="xR"/><text x="355.0" y="228.5" class="m b c">pop()</text><text x="355.0" y="246.5" class="s c">tira o topo (6)</text><rect x="250" y="266" width="210" height="48" rx="6" class="xY"/><text x="355.0" y="286.5" class="m b c">peek()</text><text x="355.0" y="304.5" class="s c">só olha o topo</text><text x="240.0" y="350" class="n c">Como uma pilha de pratos:</text><text x="240.0" y="370" class="n c">só se mexe no de cima.</text></svg>