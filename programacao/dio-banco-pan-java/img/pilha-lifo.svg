<svg xmlns="http://www.w3.org/2000/svg" width="820" height="358" viewBox="0 0 820 358"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Pilha (LIFO): o último que entra é o primeiro que sai</text><rect x="300" y="70" width="200" height="36" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="380" y="94" class="m" font-size="14" fill="#1F2937" xml:space="preserve">No(6)</text><rect x="300" y="110" width="200" height="36" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="380" y="134" class="m" font-size="14" fill="#1F2937" xml:space="preserve">No(5)</text><rect x="300" y="150" width="200" height="36" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="380" y="174" class="m" font-size="14" fill="#1F2937" xml:space="preserve">No(4)</text><rect x="300" y="190" width="200" height="36" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="380" y="214" class="m" font-size="14" fill="#1F2937" xml:space="preserve">No(3)</text><rect x="300" y="230" width="200" height="36" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="380" y="254" class="m" font-size="14" fill="#1F2937" xml:space="preserve">No(2)</text><rect x="300" y="270" width="200" height="36" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="380" y="294" class="m" font-size="14" fill="#1F2937" xml:space="preserve">No(1)</text><path d="M300,68 V314 H500 V68" fill="none" stroke="#1F2937" stroke-width="2.5"/><text x="530" y="94" font-size="14" font-weight="bold" fill="#D97706">← topo</text><rect x="40" y="70" width="200" height="60" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="70" y="96" class="m" font-size="14" fill="#16A34A" xml:space="preserve">push(No(7))</text><text x="140" y="118" font-size="12" fill="#1F2937" text-anchor="middle">coloca no topo</text><path d="M240,100 C270,100 280,60 330,60" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><rect x="580" y="150" width="200" height="60" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="620" y="176" class="m" font-size="14" fill="#DC2626" xml:space="preserve">pop()</text><text x="680" y="198" font-size="12" fill="#1F2937" text-anchor="middle">tira do topo (6)</text><path d="M500,88 C540,88 560,150 600,152" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arr)"/><rect x="580" y="240" width="200" height="60" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="620" y="266" class="m" font-size="14" fill="#7C3AED" xml:space="preserve">peek()</text><text x="680" y="288" font-size="12" fill="#1F2937" text-anchor="middle">só olha o topo</text><text x="410" y="340" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Como uma pilha de pratos: só se mexe no prato de cima.</text></svg>