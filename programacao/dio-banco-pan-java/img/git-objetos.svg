<svg xmlns="http://www.w3.org/2000/svg" width="820" height="508" viewBox="0 0 820 508"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Objetos internos do Git: commit → tree → blobs</text><rect x="285" y="50" width="250" height="30" rx="6" fill="#2563EB" stroke="#2563EB" stroke-width="1.6"/><text x="297" y="70" font-size="13.5" font-weight="bold" fill="#fff">commit</text><text x="525" y="70" class="m" font-size="12" fill="#fff" text-anchor="end">a3f9c2e</text><rect x="285" y="80" width="250" height="94" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="297" y="100" class="m" font-size="12.5" fill="#1F2937">tree&#160; &#160; 7d1e4b0</text><text x="297" y="120" class="m" font-size="12.5" fill="#1F2937">parent&#160; 1234567</text><text x="297" y="140" class="m" font-size="12.5" fill="#1F2937">author&#160; Ana</text><text x="297" y="160" class="m" font-size="12.5" fill="#1F2937">msg&#160; &#160;&#160; Receita nova</text><rect x="285" y="210" width="250" height="30" rx="6" fill="#D97706" stroke="#D97706" stroke-width="1.6"/><text x="297" y="230" font-size="13.5" font-weight="bold" fill="#fff">tree</text><text x="525" y="230" class="m" font-size="12" fill="#fff" text-anchor="end">7d1e4b0</text><rect x="285" y="240" width="250" height="74" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="297" y="260" class="m" font-size="12.5" fill="#1F2937">blob&#160; e69de29&#160; README.md</text><text x="297" y="280" class="m" font-size="12.5" fill="#1F2937">blob&#160; b41c0aa&#160; strogonoff.md</text><text x="297" y="300" class="m" font-size="12.5" fill="#1F2937">tree&#160; 9f3a2c1&#160; img/</text><line x1="410" y1="174" x2="410" y2="206" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><rect x="25" y="370" width="250" height="30" rx="6" fill="#16A34A" stroke="#16A34A" stroke-width="1.6"/><text x="37" y="390" font-size="13.5" font-weight="bold" fill="#fff">blob</text><text x="265" y="390" class="m" font-size="12" fill="#fff" text-anchor="end">e69de29</text><rect x="25" y="400" width="250" height="54" rx="0" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="37" y="420" class="m" font-size="12.5" fill="#1F2937"># Receitas</text><text x="37" y="440" class="m" font-size="12.5" fill="#1F2937">(só o conteúdo)</text><rect x="285" y="370" width="250" height="30" rx="6" fill="#16A34A" stroke="#16A34A" stroke-width="1.6"/><text x="297" y="390" font-size="13.5" font-weight="bold" fill="#fff">blob</text><text x="525" y="390" class="m" font-size="12" fill="#fff" text-anchor="end">b41c0aa</text><rect x="285" y="400" width="250" height="54" rx="0" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="297" y="420" class="m" font-size="12.5" fill="#1F2937"># Strogonoff de frango</text><text x="297" y="440" class="m" font-size="12.5" fill="#1F2937">* 1 kg de frango ...</text><rect x="545" y="370" width="250" height="30" rx="6" fill="#D97706" stroke="#D97706" stroke-width="1.6"/><text x="557" y="390" font-size="13.5" font-weight="bold" fill="#fff">tree</text><text x="785" y="390" class="m" font-size="12" fill="#fff" text-anchor="end">9f3a2c1</text><rect x="545" y="400" width="250" height="34" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="557" y="420" class="m" font-size="12.5" fill="#1F2937">blob&#160; 77ab0e2&#160; foto.png</text><path d="M410,318 L150,366" fill="none" stroke="#D97706" stroke-width="1.8" marker-end="url(#aro)"/><path d="M410,318 L410,366" fill="none" stroke="#D97706" stroke-width="1.8" marker-end="url(#aro)"/><path d="M410,318 L670,366" fill="none" stroke="#D97706" stroke-width="1.8" marker-end="url(#aro)"/><text x="550" y="100" font-size="12.5" font-style="italic" fill="#2563EB">commit: quem, quando, por quê</text><text x="550" y="118" font-size="12.5" font-style="italic" fill="#2563EB">e qual tree representa o projeto</text><text x="550" y="252" font-size="12.5" font-style="italic" fill="#D97706">tree: uma pasta, com os nomes</text><text x="550" y="270" font-size="12.5" font-style="italic" fill="#D97706">e os hashes do que tem dentro</text><text x="410" y="490" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">blob: só o conteúdo de um arquivo, sem nome. Todo objeto é identificado pelo SHA-1 do seu conteúdo.</text></svg>