<svg xmlns="http://www.w3.org/2000/svg" width="880" height="328" viewBox="0 0 880 328"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="440" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Formas de injetar uma dependência</text><rect x="30" y="50" width="260" height="236" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="160" y="74" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Construtor</text><text x="160" y="92" font-size="11.5" font-weight="bold" fill="#16A34A" text-anchor="middle">recomendada</text><rect x="42" y="104" width="236" height="168" rx="6" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="52" y="126" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">@Service</text><text x="52" y="147" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">class PedidoService {</text><text x="52" y="168" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">&#160; private final Repo repo;</text><text x="52" y="189" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">&#160; PedidoService(Repo repo) {</text><text x="52" y="210" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">&#160; &#160; this.repo = repo;</text><text x="52" y="231" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">&#160; }</text><text x="52" y="252" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">}</text><rect x="310" y="50" width="260" height="236" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="440" y="74" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Setter</text><text x="440" y="92" font-size="11.5" font-weight="bold" fill="#D97706" text-anchor="middle">opcional/alterável</text><rect x="322" y="104" width="236" height="168" rx="6" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="332" y="126" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">@Service</text><text x="332" y="147" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">class PedidoService {</text><text x="332" y="168" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">&#160; private Repo repo;</text><text x="332" y="189" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">&#160; @Autowired</text><text x="332" y="210" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">&#160; void setRepo(Repo r) {</text><text x="332" y="231" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">&#160; &#160; this.repo = r;</text><text x="332" y="252" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">&#160; } }</text><rect x="590" y="50" width="260" height="236" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="720" y="74" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Atributo</text><text x="720" y="92" font-size="11.5" font-weight="bold" fill="#DC2626" text-anchor="middle">evite</text><rect x="602" y="104" width="236" height="168" rx="6" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="612" y="126" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">@Service</text><text x="612" y="147" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">class PedidoService {</text><text x="612" y="168" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">&#160; @Autowired</text><text x="612" y="189" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">&#160; private Repo repo;</text><text x="612" y="210" class="m" font-size="11.5" fill="#E5E7EB" xml:space="preserve">}</text><text x="440" y="310" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Pelo construtor a dependência fica final, obrigatória e fácil de passar num teste com new PedidoService(mock).</text></svg>