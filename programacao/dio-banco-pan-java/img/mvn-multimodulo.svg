<svg xmlns="http://www.w3.org/2000/svg" width="780" height="346" viewBox="0 0 780 346"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="390" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Projeto multi-módulo</text><rect x="260" y="50" width="260" height="56" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="390" y="75" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">loja (pai)</text><text x="390" y="93" font-size="11.5" fill="#6B7280" text-anchor="middle">packaging = pom</text><rect x="35" y="170" width="210" height="56" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="140" y="195" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">loja-dominio</text><text x="140" y="213" font-size="11.5" fill="#6B7280" text-anchor="middle">entidades</text><path d="M140,170 V140 H390 V117" fill="none" stroke="#6B7280" stroke-width="1.6"/><rect x="285" y="170" width="210" height="56" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="390" y="195" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">loja-servico</text><text x="390" y="213" font-size="11.5" fill="#6B7280" text-anchor="middle">regras de negócio</text><path d="M390,170 V140 H390 V117" fill="none" stroke="#6B7280" stroke-width="1.6"/><rect x="535" y="170" width="210" height="56" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="640" y="195" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">loja-api</text><text x="640" y="213" font-size="11.5" fill="#6B7280" text-anchor="middle">controllers REST</text><path d="M640,170 V140 H390 V117" fill="none" stroke="#6B7280" stroke-width="1.6"/><path d="M390,106 l-7,11 h14 z" fill="#fff" stroke="#6B7280" stroke-width="1.6"/><line x1="285" y1="198" x2="247" y2="198" stroke="#D97706" stroke-width="2" marker-end="url(#aro)"/><line x1="535" y1="198" x2="497" y2="198" stroke="#D97706" stroke-width="2" marker-end="url(#aro)"/><text x="266" y="250" font-size="12" fill="#D97706" text-anchor="middle">depende de</text><text x="516" y="250" font-size="12" fill="#D97706" text-anchor="middle">depende de</text><text x="390" y="300" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">Ordem do reactor:&#160; dominio&#160; →&#160; servico&#160; →&#160; api</text><text x="390" y="328" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">O Maven calcula a ordem pelas dependências entre módulos, não pela ordem em &lt;modules&gt;.</text></svg>