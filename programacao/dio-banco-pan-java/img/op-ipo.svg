<svg xmlns="http://www.w3.org/2000/svg" width="820" height="246" viewBox="0 0 820 246"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Todo programa: entrada → processamento → saída</text><rect x="40" y="60" width="220" height="120" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="150" y="96" font-size="17" font-weight="bold" fill="#2563EB" text-anchor="middle">Entrada</text><text x="150" y="130" font-size="13" fill="#1F2937" text-anchor="middle">dados do usuário,</text><text x="150" y="152" font-size="13" fill="#1F2937" text-anchor="middle">arquivo, API</text><line x1="262" y1="120" x2="298" y2="120" stroke="#6B7280" stroke-width="2.2" marker-end="url(#arg)"/><rect x="300" y="60" width="220" height="120" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="410" y="96" font-size="17" font-weight="bold" fill="#D97706" text-anchor="middle">Processamento</text><text x="410" y="130" font-size="13" fill="#1F2937" text-anchor="middle">operadores e lógica</text><text x="410" y="152" font-size="13" fill="#1F2937" text-anchor="middle">(+ - * / == &amp;&amp; …)</text><line x1="522" y1="120" x2="558" y2="120" stroke="#6B7280" stroke-width="2.2" marker-end="url(#arg)"/><rect x="560" y="60" width="220" height="120" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="670" y="96" font-size="17" font-weight="bold" fill="#16A34A" text-anchor="middle">Saída</text><text x="670" y="130" font-size="13" fill="#1F2937" text-anchor="middle">tela, arquivo,</text><text x="670" y="152" font-size="13" fill="#1F2937" text-anchor="middle">resposta</text><text x="80" y="222" class="m" font-size="14" fill="#1F2937" xml:space="preserve">int a = 5, b = 3;&#160;&#160; →&#160;&#160; int soma = a + b;&#160;&#160; →&#160;&#160; System.out.println(soma); // 8</text></svg>