<svg xmlns="http://www.w3.org/2000/svg" width="480" height="406" viewBox="0 0 480 406"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Entrada → processamento → saída</text><rect x="60" y="52" width="360" height="56" rx="6" class="xB"/><text x="240.0" y="76.5" class="b c">Entrada</text><text x="240.0" y="94.5" class="s c">usuário, arquivo, API</text><rect x="60" y="132" width="360" height="56" rx="6" class="xO"/><text x="240.0" y="156.5" class="b c">Processamento</text><text x="240.0" y="174.5" class="s c">operadores e lógica (+ - * / == &amp;&amp;)</text><path d="M240.0,108 L240.0,132" class="l" marker-end="url(#a)"/><rect x="60" y="212" width="360" height="56" rx="6" class="xG"/><text x="240.0" y="236.5" class="b c">Saída</text><text x="240.0" y="254.5" class="s c">tela, arquivo, resposta</text><path d="M240.0,188 L240.0,212" class="l" marker-end="url(#a)"/><rect x="20" y="302" width="440" height="86" rx="6" class="xW"/><text x="34" y="326" class="m">int a = 5, b = 3;          // entrada</text><text x="34" y="348" class="m">int soma = a + b;          // processa</text><text x="34" y="370" class="m">System.out.println(soma);  // saída: 8</text></svg>