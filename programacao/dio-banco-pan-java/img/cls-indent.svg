<svg xmlns="http://www.w3.org/2000/svg" width="480" height="454" viewBox="0 0 480 454"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Indentação: mesma lógica, leitura diferente</text><text x="20" y="72" class="b" style="fill:#DC2626">✘ sem indentação</text><rect x="20" y="84" width="440" height="140" rx="6" class="xW"/><text x="34" y="108" class="m">if(media&lt;6)</text><text x="34" y="128" class="m">System.out.println("REPROV");</text><text x="34" y="148" class="m">else if(media==6)</text><text x="34" y="168" class="m">System.out.println("MINERVA");</text><text x="34" y="188" class="m">else</text><text x="34" y="208" class="m">System.out.println("APROV");</text><text x="20" y="240" class="b" style="fill:#16A34A">✔ com indentação</text><rect x="20" y="252" width="440" height="140" rx="6" class="xW"/><text x="34" y="276" class="m">if (media &lt; 6)</text><text x="34" y="296" class="m">    System.out.println("REPROV");</text><text x="34" y="316" class="m">else if (media == 6)</text><text x="34" y="336" class="m">    System.out.println("MINERVA");</text><text x="34" y="356" class="m">else</text><text x="34" y="376" class="m">    System.out.println("APROV");</text><text x="240.0" y="410" class="n c">4 espaços por nível. Atalho da IDE:</text><text x="240.0" y="430" class="n c">Ctrl+Alt+L (IntelliJ), Ctrl+Shift+F (Eclipse).</text></svg>