<svg xmlns="http://www.w3.org/2000/svg" width="820" height="326" viewBox="0 0 820 326"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Escalar para cima ou para os lados</text><text x="200" y="60" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">Vertical (scale up)</text><rect x="90" y="170" width="80" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="130" y="252" font-size="12" fill="#6B7280" text-anchor="middle">antes</text><rect x="230" y="100" width="80" height="130" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="270" y="252" font-size="12" fill="#6B7280" text-anchor="middle">depois</text><line x1="178" y1="200" x2="222" y2="170" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="200" y="282" font-size="12.5" fill="#1F2937" text-anchor="middle">máquina mais forte (CPU, RAM)</text><text x="200" y="302" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">tem limite e custo alto</text><line x1="410" y1="50" x2="410" y2="310" stroke="#9CA3AF" stroke-width="2"/><text x="615" y="60" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">Horizontal (scale out)</text><rect x="470" y="170" width="60" height="60" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="500" y="205" font-size="11.5" fill="#1F2937" text-anchor="middle">nó 1</text><rect x="545" y="170" width="60" height="60" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="575" y="205" font-size="11.5" fill="#1F2937" text-anchor="middle">nó 2</text><rect x="620" y="170" width="60" height="60" rx="6" fill="#fff" stroke="#16A34A" stroke-width="2" stroke-dasharray="5 3"/><text x="650" y="205" font-size="11.5" fill="#1F2937" text-anchor="middle">nó 3</text><rect x="695" y="170" width="60" height="60" rx="6" fill="#fff" stroke="#16A34A" stroke-width="2" stroke-dasharray="5 3"/><text x="725" y="205" font-size="11.5" fill="#1F2937" text-anchor="middle">nó 4</text><text x="615" y="252" font-size="11.5" font-style="italic" fill="#6B7280" text-anchor="middle">nós 3 e 4 entram quando a carga cresce</text><text x="615" y="282" font-size="12.5" fill="#1F2937" text-anchor="middle">mais máquinas, dados distribuídos (sharding)</text><text x="615" y="302" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">padrão em bancos NoSQL</text></svg>