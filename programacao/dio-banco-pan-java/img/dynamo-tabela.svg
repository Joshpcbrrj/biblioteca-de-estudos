s podem variar de item para item (Genre falta em alguns)</text><rect x="110" y="280" width="680" height="74" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.4"/><text x="450" y="304" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Chave primária = partition key (obrigatória) + sort key (opcional)</text><text x="450" y="328" font-size="12.5" fill="#1F2937" text-anchor="middle">a partition key passa por uma função hash que decide em qual partição o item fica;</text><text x="450" y="346" font-size="12.5" fill="#1F2937" text-anchor="middle">a sort key ordena os itens dentro da mesma partição</text></svg>