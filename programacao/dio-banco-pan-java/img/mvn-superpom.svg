<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" viewBox="0 0 760 448"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Todo pom.xml herda do Super POM</text><rect x="280" y="50" width="200" height="90" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="380" y="92" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Super POM</text><text x="380" y="110" font-size="11.5" fill="#6B7280" text-anchor="middle">embutido no Maven</text><rect x="40" y="46" width="210" height="98" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="56" y="70" font-size="12" fill="#1F2937">• src/main/java</text><text x="56" y="90" font-size="12" fill="#1F2937">• src/test/java</text><text x="56" y="110" font-size="12" fill="#1F2937">• target/</text><text x="56" y="130" font-size="12" fill="#1F2937">• repositório central</text><rect x="510" y="46" width="220" height="98" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="526" y="70" font-size="12" fill="#1F2937">• versões padrão dos plugins</text><text x="526" y="90" font-size="12" fill="#1F2937">• pastas de saída</text><text x="526" y="110" font-size="12" fill="#1F2937">• nomes dos artefatos</text><text x="526" y="130" font-size="12" fill="#1F2937">• nenhuma dependência</text><rect x="250" y="200" width="260" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="380" y="230" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">pom.xml do projeto</text><path d="M380,200 V151" stroke="#6B7280" stroke-width="1.6"/><path d="M380,140 l-7,11 h14 z" fill="#fff" stroke="#6B7280" stroke-width="1.6"/><text x="392" y="178" font-size="12" fill="#6B7280">herda</text><rect x="230" y="300" width="300" height="50" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="380" y="330" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">POM efetivo</text><line x1="380" y1="250" x2="380" y2="298" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="392" y="278" font-size="12" fill="#6B7280">= Super POM + o que você declarou/sobrescreveu</text><rect x="150" y="372" width="460" height="34" rx="6" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="170" y="394" class="m" font-size="13" fill="#86EFAC" xml:space="preserve">$ mvn help:effective-pom</text><text x="380" y="430" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">O comando mostra o POM final, já com tudo o que foi herdado.</text></svg>