<svg xmlns="http://www.w3.org/2000/svg" width="480" height="484" viewBox="0 0 480 484"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Todo pom.xml herda do Super POM</text><rect x="20" y="52" width="440" height="150" rx="6" class="xP"/><text x="240" y="76" class="b c">Super POM (embutido no Maven)</text><text x="40" y="104" class="s">+ src/main/java e src/test/java</text><text x="40" y="126" class="s">+ pasta de saída target/</text><text x="40" y="148" class="s">+ repositório central</text><text x="40" y="170" class="s">+ versões padrão dos plugins</text><rect x="130" y="236" width="220" height="46" rx="6" class="xO"/><text x="240.0" y="263.5" class="b c">pom.xml do projeto</text><path d="M240,202 L240,236" class="l" marker-end="url(#a)"/><text x="250" y="224" class="s">herda</text><rect x="60" y="316" width="360" height="56" rx="6" class="xG"/><text x="240.0" y="340.5" class="b c">POM efetivo</text><text x="240.0" y="358.5" class="s c">Super POM + o que você declarou</text><path d="M240,282 L240,316" class="l" marker-end="url(#a)"/><rect x="20" y="392" width="440" height="41" rx="6" class="xW"/><text x="34" y="416" class="m">$ mvn help:effective-pom</text><text x="240.0" y="460" class="n c">Mostra o POM final, com tudo o que foi herdado.</text></svg>