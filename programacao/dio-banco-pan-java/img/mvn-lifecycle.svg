<svg xmlns="http://www.w3.org/2000/svg" width="480" height="606" viewBox="0 0 480 606"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Os três ciclos de vida</text><rect x="20" y="52" width="440" height="46" rx="6" class="xR"/><text x="240.0" y="71.5" class="b c">clean</text><text x="240.0" y="89.5" class="s c">pre-clean → clean → post-clean</text><rect x="150" y="124" width="180" height="36" rx="6" class="xB"/><text x="240.0" y="146.5" class="m b c">validate</text><rect x="150" y="172" width="180" height="36" rx="6" class="xB"/><text x="240.0" y="194.5" class="m b c">compile</text><path d="M240.0,160 L240.0,172" class="l" marker-end="url(#a)"/><rect x="150" y="220" width="180" height="36" rx="6" class="xB"/><text x="240.0" y="242.5" class="m b c">test</text><path d="M240.0,208 L240.0,220" class="l" marker-end="url(#a)"/><rect x="150" y="268" width="180" height="36" rx="6" class="xB"/><text x="240.0" y="290.5" class="m b c">package</text><path d="M240.0,256 L240.0,268" class="l" marker-end="url(#a)"/><rect x="150" y="316" width="180" height="36" rx="6" class="xB"/><text x="240.0" y="338.5" class="m b c">verify</text><path d="M240.0,304 L240.0,316" class="l" marker-end="url(#a)"/><rect x="150" y="364" width="180" height="36" rx="6" class="xB"/><text x="240.0" y="386.5" class="m b c">install</text><path d="M240.0,352 L240.0,364" class="l" marker-end="url(#a)"/><rect x="150" y="412" width="180" height="36" rx="6" class="xB"/><text x="240.0" y="434.5" class="m b c">deploy</text><path d="M240.0,400 L240.0,412" class="l" marker-end="url(#a)"/><text x="60" y="146" class="b">default</text><text x="60" y="160" class="s">(build)</text><rect x="20" y="464" width="440" height="46" rx="6" class="xG"/><text x="240.0" y="483.5" class="b c">site</text><text x="240.0" y="501.5" class="s c">pre-site → site → post-site → site-deploy</text><text x="240.0" y="542" class="n c">mvn package roda validate, compile,</text><text x="240.0" y="562" class="n c">test e package, nessa ordem.</text><text x="240.0" y="582" class="n c">(Versão simplificada: há fases intermediárias.)</text></svg>