<svg xmlns="http://www.w3.org/2000/svg" width="480" height="254" viewBox="0 0 480 254"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">H com N = 4 termos</text><rect x="20" y="70" width="200" height="50" rx="6" class="xB"/><text x="120.0" y="99.5" class="m b c">1</text><rect x="220" y="70" width="100.0" height="50" rx="6" class="xG"/><text x="270.0" y="99.5" class="m b c">1/2</text><rect x="320.0" y="70" width="66.66666666666666" height="50" rx="6" class="xO"/><text x="353.3333333333333" y="99.5" class="m b c">1/3</text><rect x="386.66666666666663" y="70" width="50.0" height="50" rx="6" class="xP"/><text x="411.66666666666663" y="99.5" class="m b c">1/4</text><text x="240.0" y="150" class="m c">1 + 0,5 + 0,333 + 0,25 = 2,083 → 2</text><text x="20" y="190" class="s">Cada termo é menor que o anterior, mas a soma</text><text x="20" y="210" class="s">cresce sem limite (bem devagar): H(8) ≈ 2,72.</text><text x="20" y="230" class="s">Use 1.0 / i: com 1 / i (inteiros) a divisão dá 0.</text></svg>