<svg xmlns="http://www.w3.org/2000/svg" width="860" height="312" viewBox="0 0 860 312"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="430" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Cache HTTP: hit, miss e revalidação</text><rect x="30" y="90" width="150" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="105" y="125" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Navegador</text><rect x="350" y="90" width="160" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="430" y="117" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Cache</text><text x="430" y="135" font-size="11.5" fill="#6B7280" text-anchor="middle">navegador / CDN</text><rect x="680" y="90" width="150" height="60" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="755" y="125" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Servidor</text><line x1="182" y1="110" x2="348" y2="110" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="265" y="102" font-size="11.5" fill="#2563EB" text-anchor="middle">pede /logo.png</text><line x1="348" y1="136" x2="182" y2="136" stroke="#D97706" stroke-width="2" marker-end="url(#aro)"/><text x="265" y="154" font-size="11.5" font-weight="bold" fill="#D97706" text-anchor="middle">HIT: devolve na hora</text><line x1="512" y1="110" x2="678" y2="110" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="595" y="102" font-size="11.5" font-weight="bold" fill="#16A34A" text-anchor="middle">MISS: busca</text><line x1="678" y1="136" x2="512" y2="136" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="595" y="154" font-size="11.5" fill="#16A34A" text-anchor="middle">guarda a cópia</text><rect x="60" y="190" width="740" height="104" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="80" y="216" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">Cache-Control: max-age=3600&#160; &#160; &#160; &#160; → pode reutilizar por 1 hora</text><text x="80" y="242" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">ETag: &quot;v7&quot;&#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160;&#160; → &quot;versão&quot; do recurso</text><text x="80" y="268" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">If-None-Match: &quot;v7&quot;&#160; →&#160; 304 Not Modified&#160;&#160; → nada mudou, use a cópia</text></svg>