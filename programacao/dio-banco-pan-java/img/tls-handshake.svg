<svg xmlns="http://www.w3.org/2000/svg" width="800" height="376" viewBox="0 0 800 376"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="400" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Handshake TLS 1.3 (simplificado)</text><rect x="70" y="44" width="160" height="34" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="150" y="66" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Cliente</text><rect x="570" y="44" width="160" height="34" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="650" y="66" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Servidor</text><path d="M150,78 V332" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M650,78 V332" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="150" y1="100" x2="648" y2="112" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="400" y="98" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">ClientHello</text><text x="400" y="128" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">versões, cifras aceitas e a parte do cliente na troca de chaves</text><line x1="650" y1="158" x2="152" y2="170" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="400" y="156" class="m" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">ServerHello + certificado + Finished</text><text x="400" y="186" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">escolhe a cifra, envia a parte dele e prova a identidade</text><line x1="150" y1="216" x2="648" y2="228" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="400" y="214" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">Finished</text><text x="400" y="244" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">depois de validar o certificado (cadeia, domínio, validade); a chave simétrica já foi calculada (ECDHE)</text><line x1="150" y1="274" x2="648" y2="286" stroke="#D97706" stroke-width="2" marker-end="url(#aro)"/><text x="400" y="272" class="m" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">GET /&#160; (cifrado)</text><text x="400" y="302" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">a partir daqui tudo vai criptografado com AES/ChaCha20</text><text x="400" y="356" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">No TLS 1.3 o handshake leva só 1 ida e volta (1-RTT).</text></svg>