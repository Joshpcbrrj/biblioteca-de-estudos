="440" height="30" rx="4" class="hB"/><text x="240" y="144" class="m b c w">SflKxwRJSMeKKF2QT4fwpM...</text><text x="240" y="174" class="s b c">header . payload . signature</text><text x="24" y="204" class="b">Header</text><rect x="22" y="215" width="440" height="59" rx="8" class="sh"/><rect x="20" y="212" width="440" height="59" rx="8" class="xW"/><path d="M28,212 h424 a8,8 0 0 1 8,8 v12 h-440 v-12 a8,8 0 0 1 8,-8z" class="fR" opacity="1"/><circle cx="34" cy="222" r="4" fill="#EF4444" stroke="#fff" stroke-width="1"/><circle cx="48" cy="222" r="4" fill="#F59E0B" stroke="#fff" stroke-width="1"/><circle cx="62" cy="222" r="4" fill="#22C55E" stroke="#fff" stroke-width="1"/><rect x="20" y="232" width="440" height="39" fill="#F8FAFC" stroke="none" rx="0"/><rect x="20" y="212" width="440" height="59" rx="8" fill="none" stroke="#94A3B8" stroke-width="1.8"/><text x="34" y="256" class="m">{ "alg": "HS256", "typ": "JWT" }</text><text x="24" y="297" class="b">Payload (claims)</text><rect x="22" y="308" width="440" height="97" rx="8" class="sh"/><rect x="20" y="305" width="440" height="97" rx="8" class="xW"/><path d="M28,305 h424 a8,8 0 0 1 8,8 v12 h-440 v-12 a8,8 0 0 1 8,-8z" class="fP" opacity="1"/><circle cx="34" cy="315" r="4" fill="#EF4444" stroke="#fff" stroke-width="1"/><circle cx="48" cy="315" r="4" fill="#F59E0B" stroke="#fff" stroke-width="1"/><circle cx="62" cy="315" r="4" fill="#22C55E" stroke="#fff" stroke-width="1"/><rect x="20" y="325" width="440" height="77" fill="#F8FAFC" stroke="none" rx="0"/><rect x="20" y="305" width="440" height="97" rx="8" fill="none" stroke="#94A3B8" stroke-width="1.8"/><text x="34" y="349" class="m">{ "sub": "jo",</text><text x="34" y="368" class="m">  "roles": ["USERS"],</text><text x="34" y="387" class="m">  "exp": 1793019600 }</text><text x="24" y="428" class="b">Signature</text><rect x="22" y="439" width="440" height="116" rx="8" class="sh"/><rect x="20" y="436" width="440" height="116" rx="8" class="xW"/><path d="M28,436 h424 a8,8 0 0 1 8,8 v12 h-440 v-12 a8,8 0 0 1 8,-8z" class="fB" opacity="1"/><circle cx="34" cy="446" r="4" fill="#EF4444" stroke="#fff" stroke-width="1"/><circle cx="48" cy="446" r="4" fill="#F59E0B" stroke="#fff" stroke-width="1"/><circle cx="62" cy="446" r="4" fill="#22C55E" stroke="#fff" stroke-width="1"/><rect x="20" y="456" width="440" height="96" fill="#F8FAFC" stroke="none" rx="0"/><rect x="20" y="436" width="440" height="116" rx="8" fill="none" stroke="#94A3B8" stroke-width="1.8"/><text x="34" y="480" class="m">HMACSHA256(</text><text x="34" y="499" class="m">  base64Url(header) + "." +</text><text x="34" y="518" class="m">  base64Url(payload),</text><text x="34" y="537" class="m">  segredo-do-servidor)</text><text x="240.0" y="580" class="n c">⚠ Header e payload são só Base64Url:</text><text x="240.0" y="600" class="n c">qualquer um lê. Nunca coloque senhas no token.</text></svg>