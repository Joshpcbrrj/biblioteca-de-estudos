<svg xmlns="http://www.w3.org/2000/svg" width="820" height="264" viewBox="0 0 820 264"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomia de um método</text><text x="60" y="120" class="m" font-size="18" fill="#7C3AED" xml:space="preserve">public</text><text x="125" y="120" class="m" font-size="18" fill="#1F2937" xml:space="preserve"> </text><text x="135.9" y="120" class="m" font-size="18" fill="#DC2626" xml:space="preserve">double</text><text x="200.9" y="120" class="m" font-size="18" fill="#1F2937" xml:space="preserve"> </text><text x="211.7" y="120" class="m" font-size="18" fill="#2563EB" xml:space="preserve">dividir</text><text x="287.6" y="120" class="m" font-size="18" fill="#1F2937" xml:space="preserve">(</text><text x="298.4" y="120" class="m" font-size="18" fill="#16A34A" xml:space="preserve">int a, int b</text><text x="428.4" y="120" class="m" font-size="18" fill="#1F2937" xml:space="preserve">)</text><text x="439.3" y="120" class="m" font-size="18" fill="#1F2937" xml:space="preserve"> </text><text x="450.1" y="120" class="m" font-size="18" fill="#D97706" xml:space="preserve">throws Exception</text><text x="623.5" y="120" class="m" font-size="18" fill="#1F2937" xml:space="preserve"> {</text><text x="60" y="150" class="m" font-size="18" fill="#1F2937" xml:space="preserve">&#160; &#160; return (double) a / b;</text><text x="60" y="180" class="m" font-size="18" fill="#1F2937" xml:space="preserve">}</text><path d="M62,92 v-6 H123.016 v6" fill="none" stroke="#7C3AED" stroke-width="1.6"/><line x1="92.5" y1="86" x2="92.5" y2="74" stroke="#7C3AED" stroke-width="1.6"/><text x="92.5" y="68" font-size="12.5" font-weight="bold" fill="#7C3AED" text-anchor="middle">visibilidade</text><path d="M137.852,190 v6 H198.868 v-6" fill="none" stroke="#DC2626" stroke-width="1.6"/><line x1="168.4" y1="196" x2="168.4" y2="208" stroke="#DC2626" stroke-width="1.6"/><text x="168.4" y="222" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">tipo de retorno</text><path d="M213.704,92 v-6 H285.5 v6" fill="none" stroke="#2563EB" stroke-width="1.6"/><line x1="249.6" y1="86" x2="249.6" y2="74" stroke="#2563EB" stroke-width="1.6"/><text x="249.6" y="68" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="middle">nome (verbo)</text><path d="M300.3,190 v6 H426.4 v-6" fill="none" stroke="#16A34A" stroke-width="1.6"/><line x1="363.4" y1="196" x2="363.4" y2="208" stroke="#16A34A" stroke-width="1.6"/><text x="363.4" y="222" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="middle">parâmetros</text><path d="M452.0,92 v-6 H621.4 v6" fill="none" stroke="#D97706" stroke-width="1.6"/><line x1="536.8" y1="86" x2="536.8" y2="74" stroke="#D97706" stroke-width="1.6"/><text x="536.8" y="68" font-size="12.5" font-weight="bold" fill="#D97706" text-anchor="middle">pode lançar exceção</text><text x="410" y="246" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Sem retorno? Use void e dispense o return.</text></svg>