<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Anatomia de um método</text><rect x="20" y="60" width="84" height="40" rx="6" class="xB"/><text x="62.0" y="86" class="m b c">public</text><text x="62.0" y="122" class="s c">visibilidade</text><rect x="108" y="60" width="84" height="40" rx="6" class="xO"/><text x="150.0" y="86" class="m b c">double</text><text x="150.0" y="122" class="s c">tipo de</text><text x="150.0" y="138" class="s c">retorno</text><rect x="196" y="60" width="92" height="40" rx="6" class="xG"/><text x="242.0" y="86" class="m b c">dividir</text><text x="242.0" y="122" class="s c">nome</text><text x="242.0" y="138" class="s c">(verbo)</text><rect x="292" y="60" width="164" height="40" rx="6" class="xY"/><text x="374.0" y="86" class="m b c">int a, int b</text><text x="374.0" y="122" class="s c">parâmetros</text><rect x="20" y="150" width="440" height="40" rx="6" class="xR"/><text x="240" y="175" class="m s c">throws Exception   → pode lançar exceção</text><rect x="20" y="210" width="440" height="86" rx="6" class="xW"/><text x="34" y="234" class="m">{</text><text x="34" y="256" class="m">  return (double) a / b;</text><text x="34" y="278" class="m">}</text><text x="240.0" y="316" class="n c">Sem retorno? Use void e dispense o return.</text></svg>