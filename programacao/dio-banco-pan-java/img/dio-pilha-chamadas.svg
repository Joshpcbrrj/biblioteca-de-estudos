<svg xmlns="http://www.w3.org/2000/svg" width="480" height="350" viewBox="0 0 480 350"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Chamada de método e pilha de execução</text><text x="30" y="66" class="m">main() {</text><text x="30" y="86" class="m">  int t = total(2, 3);</text><text x="30" y="106" class="m">}</text><text x="30" y="126" class="m">int total(int q, int p) {</text><text x="30" y="146" class="m">  return q * p;</text><text x="30" y="166" class="m">}</text><text x="330" y="66" class="b c">pilha (stack)</text><rect x="240" y="80" width="180" height="44" rx="6" class="xO"/><text x="330.0" y="106.5" class="m b c">total(q=2, p=3)</text><rect x="240" y="130" width="180" height="44" rx="6" class="xB"/><text x="330.0" y="156.5" class="m b c">main(t=?)</text><text x="330" y="204" class="s c">① main chama total: novo quadro no topo</text><text x="330" y="224" class="s c">② total devolve 6 e sai da pilha</text><text x="330" y="244" class="s c">③ main continua com t = 6</text><text x="30" y="290" class="s">Cada chamada ganha um "quadro" com seus parâmetros</text><text x="30" y="308" class="s">e variáveis locais; ao retornar, ele é removido.</text><text x="30" y="326" class="s">Recursão sem fim enche a pilha: StackOverflowError.</text></svg>