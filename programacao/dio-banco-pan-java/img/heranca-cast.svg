<svg xmlns="http://www.w3.org/2000/svg" width="820" height="404" viewBox="0 0 820 404"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Upcast e downcast na hierarquia</text><rect x="300" y="46" width="220" height="86" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="410" y="67" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Animal</text><line x1="300" y1="76" x2="520" y2="76" stroke="#2563EB" stroke-width="1.5"/><line x1="300" y1="104" x2="520" y2="104" stroke="#2563EB" stroke-width="1.5"/><text x="310" y="122" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">+ fazerBarulho()</text><rect x="300" y="210" width="220" height="106" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="410" y="231" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Cachorro</text><line x1="300" y1="240" x2="520" y2="240" stroke="#16A34A" stroke-width="1.5"/><line x1="300" y1="268" x2="520" y2="268" stroke="#16A34A" stroke-width="1.5"/><text x="310" y="286" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">+ fazerBarulho()</text><text x="310" y="306" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">+ correr()</text><path d="M410,162 l-10,16 h20 z" fill="#fff" stroke="#2563EB" stroke-width="2"/><line x1="410" y1="178" x2="410" y2="208" stroke="#2563EB" stroke-width="2"/><text x="430" y="196" font-size="12" font-style="italic" fill="#2563EB">extends</text><path d="M560,250 C640,250 640,110 560,110" fill="none" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arv)"/><text x="650" y="170" font-size="14" font-weight="bold" fill="#16A34A">upcast</text><text x="650" y="190" font-size="12" fill="#1F2937">automático e seguro</text><path d="M260,110 C180,110 180,250 260,250" fill="none" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arr)"/><text x="170" y="170" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="end">downcast</text><text x="170" y="190" font-size="12" fill="#1F2937" text-anchor="end">exige (Cachorro) e</text><text x="170" y="206" font-size="12" fill="#1F2937" text-anchor="end">pode falhar</text><rect x="40" y="320" width="740" height="70" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="60" y="346" class="m" font-size="13.5" fill="#16A34A" xml:space="preserve">Animal a = new Cachorro();&#160; &#160; &#160; // upcast: ok</text><text x="60" y="372" class="m" font-size="13.5" fill="#DC2626" xml:space="preserve">if (a instanceof Cachorro c) c.correr();&#160;&#160; // downcast seguro (Java 16+)</text></svg>