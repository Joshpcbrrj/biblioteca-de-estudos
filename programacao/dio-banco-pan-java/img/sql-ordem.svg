<svg xmlns="http://www.w3.org/2000/svg" width="720" height="670" viewBox="0 0 720 670">
<style>.t{font:bold 17px Helvetica, Arial, sans-serif;fill:#1F2937}.b{font:bold 16px Helvetica, Arial, sans-serif;fill:#1F2937}.n{font:15px Helvetica, Arial, sans-serif;fill:#1F2937}.s{font:14px Helvetica, Arial, sans-serif;fill:#4B5563}.c{font:15px Menlo, Consolas, monospace;fill:#1F2937}.r{font:bold 15px Helvetica, Arial, sans-serif;fill:#4B5563}.l{stroke:#4B5563;stroke-width:2.5;fill:none}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4B5563"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/><text x="360" y="34" class="t" text-anchor="middle">Em que ordem o banco executa um SELECT</text><rect x="150" y="56" width="420" height="58" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="170" y="92" class="b" text-anchor="start">1. FROM / JOIN</text><text x="550" y="92" class="s" text-anchor="end">junta as tabelas</text><path d="M360,114V136" class="l" marker-end="url(#a)"/><rect x="150" y="138" width="420" height="58" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="170" y="174" class="b" text-anchor="start">2. WHERE</text><text x="550" y="174" class="s" text-anchor="end">filtra linhas</text><path d="M360,196V218" class="l" marker-end="url(#a)"/><rect x="150" y="220" width="420" height="58" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="170" y="256" class="b" text-anchor="start">3. GROUP BY</text><text x="550" y="256" class="s" text-anchor="end">forma os grupos</text><path d="M360,278V300" class="l" marker-end="url(#a)"/><rect x="150" y="302" width="420" height="58" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="170" y="338" class="b" text-anchor="start">4. HAVING</text><text x="550" y="338" class="s" text-anchor="end">filtra grupos</text><path d="M360,360V382" class="l" marker-end="url(#a)"/><rect x="150" y="384" width="420" height="58" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="170" y="420" class="b" text-anchor="start">5. SELECT</text><text x="550" y="420" class="s" text-anchor="end">escolhe colunas e calcula</text><path d="M360,442V464" class="l" marker-end="url(#a)"/><rect x="150" y="466" width="420" height="58" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="170" y="502" class="b" text-anchor="start">6. ORDER BY</text><text x="550" y="502" class="s" text-anchor="end">ordena</text><path d="M360,524V546" class="l" marker-end="url(#a)"/><rect x="150" y="548" width="420" height="58" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="170" y="584" class="b" text-anchor="start">7. LIMIT</text><text x="550" y="584" class="s" text-anchor="end">corta o resultado</text><text x="360" y="646" class="s" text-anchor="middle">Por isso um apelido criado no SELECT não pode ser usado no WHERE.</text></svg>