<svg xmlns="http://www.w3.org/2000/svg" width="480" height="356" viewBox="0 0 480 356"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Rodando uma classe pelo terminal</text><rect x="20" y="52" width="440" height="230" rx="8" fill="#1F2937"/><text x="36" y="86" class="m b" style="fill:#F9FAFB">&gt; cd java-terminal</text><text x="36" y="126" class="m b" style="fill:#F9FAFB">&gt; javac -d bin src\MinhaClasse.java</text><text x="36" y="166" class="m b" style="fill:#F9FAFB">&gt; cd bin</text><text x="36" y="206" class="m b" style="fill:#F9FAFB">&gt; java MinhaClasse</text><text x="36" y="246" class="m" style="fill:#86EFAC">Oi, fui executado pelo Terminal</text><text x="240.0" y="312" class="n c">javac compila (.java → .class);</text><text x="240.0" y="332" class="n c">java executa, sem a extensão .class.</text></svg>