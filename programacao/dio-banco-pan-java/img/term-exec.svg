<svg xmlns="http://www.w3.org/2000/svg" width="680" height="233" viewBox="0 0 680 233"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="340" y="24" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Rodando uma classe pelo terminal</text><rect x="20" y="40" width="640" height="154.6" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><path d="M28,41 h624 a7,7 0 0 1 7,7 v18 h-638 v-18 a7,7 0 0 1 7,-7 z" fill="#111827"/><circle cx="36" cy="54" r="4.5" fill="#EF4444"/><circle cx="51" cy="54" r="4.5" fill="#F59E0B"/><circle cx="66" cy="54" r="4.5" fill="#22C55E"/><text x="340" y="58" font-size="12" fill="#D1D5DB" text-anchor="middle">Console</text><text x="36" y="88" class="m" font-size="13.5" fill="#E5E7EB" xml:space="preserve">C:\&gt; cd C:\estudos\dio-trilha-java-basico\java-terminal</text><text x="36" y="108.9" class="m" font-size="13.5" fill="#93C5FD" xml:space="preserve">C:\...\java-terminal&gt; javac -d bin src\MinhaClasse.java</text><text x="36" y="129.8" class="m" font-size="13.5" fill="#E5E7EB" xml:space="preserve">C:\...\java-terminal&gt; cd bin</text><text x="36" y="150.8" class="m" font-size="13.5" fill="#FDE68A" xml:space="preserve">C:\...\java-terminal\bin&gt; java MinhaClasse</text><text x="36" y="171.7" class="m" font-size="13.5" fill="#86EFAC" xml:space="preserve">Oi, fui executado pelo Terminal</text><text x="340" y="220.6" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">javac compila (.java → .class); java executa — sem a extensão .class.</text></svg>