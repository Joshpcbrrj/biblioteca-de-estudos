<svg xmlns="http://www.w3.org/2000/svg" width="860" height="352" viewBox="0 0 860 352"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="430" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Como modelar cada tipo de relacionamento</text><text x="120" y="66" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">Relação</text><text x="340" y="66" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">Exemplo</text><text x="640" y="66" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">Estratégia sugerida</text><rect x="40" y="80" width="160" height="36" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="120" y="103" class="m" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">1 : 1</text><text x="340" y="103" font-size="13" fill="#1F2937" text-anchor="middle">usuário e perfil</text><rect x="480" y="80" width="340" height="36" rx="6" fill="#fff" stroke="#2563EB" stroke-width="1.6"/><text x="650" y="103" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">embutir</text><rect x="40" y="126" width="160" height="36" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="120" y="149" class="m" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">1 : poucos</text><text x="340" y="149" font-size="13" fill="#1F2937" text-anchor="middle">pessoa e endereços</text><rect x="480" y="126" width="340" height="36" rx="6" fill="#fff" stroke="#2563EB" stroke-width="1.6"/><text x="650" y="149" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">embutir um array</text><rect x="40" y="172" width="160" height="36" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="120" y="195" class="m" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">1 : muitos</text><text x="340" y="195" font-size="13" fill="#1F2937" text-anchor="middle">produto e avaliações</text><rect x="480" y="172" width="340" height="36" rx="6" fill="#fff" stroke="#7C3AED" stroke-width="1.6"/><text x="650" y="195" font-size="13" font-weight="bold" fill="#7C3AED" text-anchor="middle">referenciar no lado “muitos”</text><rect x="40" y="218" width="160" height="36" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="120" y="241" class="m" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">1 : milhões</text><text x="340" y="241" font-size="13" fill="#1F2937" text-anchor="middle">servidor e logs</text><rect x="480" y="218" width="340" height="36" rx="6" fill="#fff" stroke="#7C3AED" stroke-width="1.6"/><text x="650" y="241" font-size="13" font-weight="bold" fill="#7C3AED" text-anchor="middle">o filho guarda o id do pai</text><rect x="40" y="264" width="160" height="36" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="120" y="287" class="m" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">N : N</text><text x="340" y="287" font-size="13" fill="#1F2937" text-anchor="middle">alunos e cursos</text><rect x="480" y="264" width="340" height="36" rx="6" fill="#fff" stroke="#7C3AED" stroke-width="1.6"/><text x="650" y="287" font-size="13" font-weight="bold" fill="#7C3AED" text-anchor="middle">arrays de ids nos dois lados</text><text x="430" y="334" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">São pontos de partida: a decisão final depende de como a aplicação lê e grava os dados.</text></svg>