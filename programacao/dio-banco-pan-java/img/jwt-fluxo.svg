<svg xmlns="http://www.w3.org/2000/svg" width="820" height="384" viewBox="0 0 820 384"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Fluxo de autenticação com JWT</text><rect x="70" y="44" width="160" height="34" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="150" y="66" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Cliente</text><rect x="590" y="44" width="160" height="34" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="670" y="66" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">API</text><path d="M150,78 V340" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M670,78 V340" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="150" y1="100" x2="668" y2="112" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="410" y="98" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">POST /login&#160; {usuário, senha}</text><line x1="670" y1="160" x2="152" y2="172" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="410" y="158" class="m" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">200 OK&#160; { token: &quot;eyJ...&quot; }</text><text x="410" y="188" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">o servidor assina o token com sua chave</text><line x1="150" y1="220" x2="668" y2="232" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="410" y="218" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">GET /pedidos&#160; Authorization: Bearer eyJ...</text><text x="410" y="248" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">o token vai em cada requisição</text><line x1="670" y1="280" x2="152" y2="292" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="410" y="278" class="m" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">200 OK (ou 401 se inválido/expirado)</text><text x="410" y="308" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">o filtro valida assinatura e exp, sem consultar sessão</text><text x="410" y="364" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Stateless: o servidor não guarda sessão; tudo o que precisa está no token assinado.</text></svg>