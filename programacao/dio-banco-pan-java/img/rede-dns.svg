<svg xmlns="http://www.w3.org/2000/svg" width="880" height="338" viewBox="0 0 880 338"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="440" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Como o DNS encontra o IP de www.loja.com.br</text><rect x="30" y="140" width="120" height="56" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="90" y="173" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Navegador</text><rect x="250" y="140" width="160" height="56" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="330" y="165" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Resolvedor</text><text x="330" y="183" font-size="11.5" fill="#6B7280" text-anchor="middle">do provedor / 8.8.8.8</text><rect x="560" y="46" width="300" height="54" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="710" y="70" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Raiz</text><text x="710" y="88" font-size="11.5" fill="#6B7280" text-anchor="middle">. → quem cuida de .br?</text><line x1="412" y1="152" x2="558" y2="66" stroke="#7C3AED" stroke-width="2" marker-end="url(#arp)"/><rect x="560" y="136" width="300" height="54" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="710" y="160" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">TLD .br</text><text x="710" y="178" font-size="11.5" fill="#6B7280" text-anchor="middle">→ quem cuida de loja.com.br?</text><line x1="412" y1="160" x2="558" y2="156" stroke="#7C3AED" stroke-width="2" marker-end="url(#arp)"/><rect x="560" y="226" width="300" height="54" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="710" y="250" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Autoritativo</text><text x="710" y="268" font-size="11.5" fill="#6B7280" text-anchor="middle">www.loja.com.br = 203.0.113.10</text><line x1="412" y1="168" x2="558" y2="246" stroke="#7C3AED" stroke-width="2" marker-end="url(#arp)"/><line x1="152" y1="160" x2="248" y2="160" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="200" y="152" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">1</text><line x1="248" y1="182" x2="152" y2="182" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="200" y="200" font-size="12" font-weight="bold" fill="#16A34A" text-anchor="middle">IP</text><text x="445" y="128" font-size="12" font-weight="bold" fill="#7C3AED" text-anchor="middle">2 a 4</text><text x="440" y="320" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">As respostas ficam em cache pelo tempo do TTL, então nas próximas vezes a resposta é quase instantânea.</text></svg>