<svg xmlns="http://www.w3.org/2000/svg" width="820" height="256" viewBox="0 0 820 256"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Composição: a parte só existe dentro do todo</text><rect x="60" y="60" width="200" height="86" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="160" y="81" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Pedido</text><line x1="60" y1="90" x2="260" y2="90" stroke="#2563EB" stroke-width="1.5"/><text x="70" y="108" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">- itens: List&lt;Item&gt;</text><line x1="60" y1="118" x2="260" y2="118" stroke="#2563EB" stroke-width="1.5"/><text x="70" y="136" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">+ adicionarItem(...)</text><rect x="560" y="60" width="200" height="86" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="660" y="81" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">ItemPedido</text><line x1="560" y1="90" x2="760" y2="90" stroke="#7C3AED" stroke-width="1.5"/><text x="570" y="108" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">- produto: String</text><line x1="560" y1="118" x2="760" y2="118" stroke="#7C3AED" stroke-width="1.5"/><text x="570" y="136" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">+ subtotal()</text><path d="M262,100 l14,-9 l14,9 l-14,9 z" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><line x1="290" y1="100" x2="556" y2="100" stroke="#7C3AED" stroke-width="2"/><text x="410" y="88" font-size="13" font-weight="bold" fill="#7C3AED" text-anchor="middle">é composto de (◆ cheio)</text><rect x="60" y="190" width="700" height="50" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="410" y="220" font-size="13" fill="#1F2937" text-anchor="middle">Os itens são criados pelo próprio Pedido; apagou o pedido, os itens deixam de existir.</text></svg>