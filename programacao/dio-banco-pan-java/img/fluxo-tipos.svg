<svg xmlns="http://www.w3.org/2000/svg" width="480" height="346" viewBox="0 0 480 346"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Estruturas de controle de fluxo</text><rect x="20" y="56" width="440" height="80" rx="6" class="xB"/><text x="36" y="82" class="b">Decisão</text><text x="444" y="82" class="s r">escolhe um caminho</text><text x="36" y="114" class="m">if / else · else if · switch · ?:</text><rect x="20" y="152" width="440" height="80" rx="6" class="xG"/><text x="36" y="178" class="b">Repetição</text><text x="444" y="178" class="s r">repete um bloco</text><text x="36" y="210" class="m">for · for-each · while · do-while</text><rect x="20" y="248" width="440" height="80" rx="6" class="xO"/><text x="36" y="274" class="b">Interrupção</text><text x="444" y="274" class="s r">desvia ou encerra</text><text x="36" y="306" class="m">break · continue · return</text></svg>