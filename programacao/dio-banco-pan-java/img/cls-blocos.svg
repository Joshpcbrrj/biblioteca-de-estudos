<svg xmlns="http://www.w3.org/2000/svg" width="820" height="338" viewBox="0 0 820 338"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Onde estou? Blocos de chaves em uma classe</text><rect x="40" y="46" width="740" height="250" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="56" y="72" class="m" font-size="15" fill="#2563EB" xml:space="preserve">public class Calculadora {</text><text x="80" y="102" class="m" font-size="14.5" fill="#1F2937" xml:space="preserve">static int memoria = 0;&#160; &#160; &#160;&#160; // atributo</text><rect x="70" y="118" width="690" height="150" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="84" y="142" class="m" font-size="15" fill="#16A34A" xml:space="preserve">public static void main(String[] args) {</text><rect x="100" y="156" width="640" height="74" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="114" y="180" class="m" font-size="15" fill="#D97706" xml:space="preserve">if (memoria == 0) {</text><text x="138" y="202" class="m" font-size="14.5" fill="#1F2937" xml:space="preserve">System.out.println(&quot;vazia&quot;);</text><text x="114" y="222" class="m" font-size="15" fill="#D97706" xml:space="preserve">}</text><text x="84" y="256" class="m" font-size="15" fill="#16A34A" xml:space="preserve">}&#160; // fim do main</text><text x="56" y="288" class="m" font-size="15" fill="#2563EB" xml:space="preserve">}&#160; // fim da classe</text><text x="720" y="72" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="end">classe</text><text x="745" y="142" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="end">método</text><text x="725" y="180" font-size="12.5" font-weight="bold" fill="#D97706" text-anchor="end">bloco if</text><text x="410" y="320" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Cada { abre um nível e cada } fecha o nível mais recente. Indentar deixa isso visível.</text></svg>