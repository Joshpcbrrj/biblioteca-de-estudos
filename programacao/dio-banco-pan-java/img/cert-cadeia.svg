<svg xmlns="http://www.w3.org/2000/svg" width="820" height="328" viewBox="0 0 820 328"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Cadeia de confiança de um certificado</text><rect x="170" y="52" width="480" height="60" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="410" y="78" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">AC raiz</text><text x="410" y="98" font-size="11.5" fill="#6B7280" text-anchor="middle">já vem instalada no SO/navegador</text><rect x="170" y="138" width="480" height="60" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="410" y="164" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">AC intermediária</text><text x="410" y="184" font-size="11.5" fill="#6B7280" text-anchor="middle">assinada pela raiz</text><line x1="410" y1="114" x2="410" y2="136" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="170" y="224" width="480" height="60" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="410" y="250" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">certificado do site</text><text x="410" y="270" font-size="11.5" fill="#6B7280" text-anchor="middle">loja.com.br + chave pública, assinado pela intermediária</text><line x1="410" y1="200" x2="410" y2="222" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="470" y="132" font-size="11.5" font-style="italic" fill="#6B7280">assina</text><text x="470" y="218" font-size="11.5" font-style="italic" fill="#6B7280">assina</text><text x="410" y="310" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">O navegador sobe a cadeia até uma raiz em que confia; se algum elo falhar, aparece o alerta de site inseguro.</text></svg>