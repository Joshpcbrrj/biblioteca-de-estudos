<svg xmlns="http://www.w3.org/2000/svg" width="480" height="382" viewBox="0 0 480 382"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Dependência: usa só durante uma operação</text><rect x="120" y="52" width="240" height="88" rx="6" class="xB"/><text x="240.0" y="75" class="b c">Pedido</text><line x1="120" y1="84" x2="360" y2="84" stroke="#9CA3AF" stroke-width="1.5"/><text x="130" y="104" class="m s">- total: double</text><line x1="120" y1="110" x2="360" y2="110" stroke="#9CA3AF" stroke-width="1.5"/><text x="130" y="130" class="m s">+ pagar(Pagamento p)</text><rect x="120" y="220" width="240" height="88" rx="6" class="xG"/><text x="240.0" y="243" class="b c">Pagamento</text><line x1="120" y1="252" x2="360" y2="252" stroke="#9CA3AF" stroke-width="1.5"/><text x="130" y="272" class="m s">- valor: double</text><line x1="120" y1="278" x2="360" y2="278" stroke="#9CA3AF" stroke-width="1.5"/><text x="130" y="298" class="m s">+ processar()</text><line x1="240" y1="140" x2="240" y2="220" stroke="#4B5563" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="256" y="190" class="s b">usa (tracejado)</text><text x="240.0" y="338" class="n c">Pedido recebe um Pagamento como parâmetro,</text><text x="240.0" y="358" class="n c">mas não guarda referência a ele.</text></svg>