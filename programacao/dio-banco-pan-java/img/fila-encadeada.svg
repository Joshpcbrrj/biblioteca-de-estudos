<svg xmlns="http://www.w3.org/2000/svg" width="820" height="196" viewBox="0 0 820 196"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Fila encadeada na implementação do curso</text><text x="30" y="98" class="m" font-size="13.5" fill="#7C3AED" xml:space="preserve">refEntrada</text><line x1="122" y1="92" x2="148" y2="92" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arp)"/><rect x="150" y="70" width="130" height="44" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><line x1="246" y1="70" x2="246" y2="114" stroke="#16A34A" stroke-width="1.5"/><text x="160" y="97" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">Quarto</text><circle cx="263" cy="92" r="4" fill="#16A34A"/><line x1="263" y1="92" x2="298" y2="92" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arb)"/><rect x="300" y="70" width="130" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><line x1="396" y1="70" x2="396" y2="114" stroke="#2563EB" stroke-width="1.5"/><text x="310" y="97" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">Terceiro</text><circle cx="413" cy="92" r="4" fill="#2563EB"/><line x1="413" y1="92" x2="448" y2="92" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arb)"/><rect x="450" y