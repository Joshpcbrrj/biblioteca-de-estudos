<svg xmlns="http://www.w3.org/2000/svg" width="860" height="322" viewBox="0 0 860 322"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="430" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Métodos HTTP e operações CRUD</text><text x="90" y="64" font-size="12.5" font-weight="bold" fill="#6B7280" text-anchor="middle">Método</text><text x="250" y="64" font-size="12.5" font-weight="bold" fill="#6B7280" text-anchor="middle">Exemplo</text><text x="430" y="64" font-size="12.5" font-weight="bold" fill="#6B7280" text-anchor="middle">Faz</text><text x="570" y="64" font-size="12.5" font-weight="bold" fill="#6B7280" text-anchor="middle">CRUD</text><text x="680" y="64" font-size="12.5" font-weight="bold" fill="#6B7280" text-anchor="middle">Seguro</text><text x="780" y="64" font-size="12.5" font-weight="bold" fill="#6B7280" text-anchor="middle">Idempotente</text><rect x="40" y="76" width="100" height="32" rx="6" fill="#2563EB" stroke="#2563EB" stroke-width="1.5"/><text x="90" y="97" class="m" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">GET</text><text x="250" y="97" class="m" font-size="12.5" fill="#1F2937" text-anchor="middle">/produtos/7</text><text x="430" y="97" font-size="12.5" fill="#1F2937" text-anchor="middle">ler</text><text x="570" y="97" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="middle">Read</text><text x="680" y="97" font-size="13" fill="#16A34A" text-anchor="middle">✔</text><text x="780" y="97" font-size="13" fill="#16A34A" text-anchor="middle">✔</text><rect x="40" y="118" width="100" height="32" rx="6" fill="#16A34A" stroke="#16A34A" stroke-width="1.5"/><text x="90" y="139" class="m" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">POST</text><text x="250" y="139" class="m" font-size="12.5" fill="#1F2937" text-anchor="middle">/produtos</text><text x="430" y="139" font-size="12.5" fill="#1F2937" text-anchor="middle">criar</text><text x="570" y="139" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="middle">Create</text><text x="680" y="139" font-size="13" fill="#DC2626" text-anchor="middle">✖</text><text x="780" y="139" font-size="13" fill="#DC2626" text-anchor="middle">✖</text><rect x="40" y="160" width="100" height="32" rx="6" fill="#D97706" stroke="#D97706" stroke-width="1.5"/><text x="90" y="181" class="m" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">PUT</text><text x="250" y="181" class="m" font-size="12.5" fill="#1F2937" text-anchor="middle">/produtos/7</text><text x="430" y="181" font-size="12.5" fill="#1F2937" text-anchor="middle">substituir inteiro</text><text x="570" y="181" font-size="12.5" font-weight="bold" fill="#D97706" text-anchor="middle">Update</text><text x="680" y="181" font-size="13" fill="#DC2626" text-anchor="middle">✖</text><text x="780" y="181" font-size="13" fill="#16A34A" text-anchor="middle">✔</text><rect x="40" y="202" width="100" height="32" rx="6" fill="#D97706" stroke="#D97706" stroke-width="1.5"/><text x="90" y="223" class="m" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">PATCH</text><text x="250" y="223" class="m" font-size="12.5" fill="#1F2937" text-anchor="middle">/produtos/7</text><text x="430" y="223" font-size="12.5" fill="#1F2937" text-anchor="middle">alterar parte</text><text x="570" y="223" font-size="12.5" font-weight="bold" fill="#D97706" text-anchor="middle">Update</text><text x="680" y="223" font-size="13" fill="#DC2626" text-anchor="middle">✖</text><text x="780" y="223" font-size="13" fill="#DC2626" text-anchor="middle">✖*</text><rect x="40" y="244" width="100" height="32" rx="6" fill="#DC2626" stroke="#DC2626" stroke-width="1.5"/><text x="90" y="265" class="m" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">DELETE</text><text x="250" y="265" class="m" font-size="12.5" fill="#1F2937" text-anchor="middle">/produtos/7</text><text x="430" y="265" font-size="12.5" fill="#1F2937" text-anchor="middle">excluir</text><text x="570" y="265" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">Delete</text><text x="680" y="265" font-size="13" fill="#DC2626" text-anchor="middle">✖</text><text x="780" y="265" font-size="13" fill="#16A34A" text-anchor="middle">✔</text><text x="430" y="304" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Seguro: não altera o servidor. Idempotente: repetir dá o mesmo resultado. *PATCH pode ou não ser idempotente.</text></svg>