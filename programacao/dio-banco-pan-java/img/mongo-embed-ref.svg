<svg xmlns="http://www.w3.org/2000/svg" width="900" height="348" viewBox="0 0 900 348"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Embedding x Referência</text><text x="220" y="60" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">Embedding (documento embutido)</text><rect x="30" y="76" width="380" height="220" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="50" y="104" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">{ _id: 1, titulo: &quot;Post&quot;,</text><text x="50" y="128" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">&#160; comentarios: [</text><text x="50" y="152" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">&#160; &#160; { autor: &quot;Ana&quot;, texto: &quot;...&quot; },</text><text x="50" y="176" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">&#160; &#160; { autor: &quot;Rui&quot;, texto: &quot;...&quot; }</text><text x="50" y="200" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">&#160; ] }</text><text x="220" y="240" font-size="12.5" fill="#16A34A" text-anchor="middle">✔ uma leitura traz tudo</text><text x="220" y="262" font-size="12.5" fill="#DC2626" text-anchor="middle">✖ limite de 16 MB por documento</text><line x1="450" y1="50" x2="450" y2="310" stroke="#9CA3AF" stroke-width="2"/><text x="680" y="60" font-size="14" font-weight="bold" fill="#7C3AED" text-anchor="middle">Referência (coleções separadas)</text><rect x="490" y="76" width="380" height="90" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="506" y="102" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">posts:</text><text x="506" y="122" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">{ _id: 1, titulo: &quot;Post&quot;,</text><text x="506" y="142" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">&#160; autor_id: 7 }</text><rect x="490" y="190" width="380" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="506" y="212" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">autores:</text><text x="506" y="232" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">{ _id: 7, nome: &quot;Bia&quot; }</text><line x1="700" y1="166" x2="700" y2="188" stroke="#7C3AED" stroke-width="2" marker-end="url(#arp)"/><text x="712" y="182" font-size="11.5" font-weight="bold" fill="#7C3AED">$lookup</text><text x="680" y="270" font-size="12.5" fill="#16A34A" text-anchor="middle">✔ sem duplicar dados, docs pequenos</text><text x="680" y="292" font-size="12.5" fill="#DC2626" text-anchor="middle">✖ duas consultas ou um $lookup</text><text x="450" y="330" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Regra prática: o que é lido junto fica junto; o que cresce sem limite ou é compartilhado vira referência.</text></svg>