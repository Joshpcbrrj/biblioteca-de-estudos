<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Caminho de uma requisição numa API Spring</text><rect x="14" y="70" width="158" height="70" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="93" y="100" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Cliente</text><text x="93" y="120" class="m" font-size="11" fill="#6B7280" text-anchor="middle">GET /usuarios/7</text><rect x="192" y="70" width="158" height="70" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="271" y="100" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">DispatcherServlet</text><text x="271" y="120" font-size="11" fill="#6B7280" text-anchor="middle">escolhe o controller</text><line x1="174" y1="96" x2="190" y2="96" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="370" y="70" width="158" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="449" y="100" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">@RestController</text><text x="449" y="120" font-size="11" fill="#6B7280" text-anchor="middle">recebe e valida</text><line x1="352" y1="96" x2="368" y2="96" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="548" y="70" width="158" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="627" y="100" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">@Service</text><text x="627" y="120" font-size="11" fill="#6B7280" text-anchor="middle">regras de negócio</text><line x1="530" y1="96" x2="546" y2="96" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="726" y="70" width="158" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="805" y="100" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">@Repository</text><text x="805" y="120" font-size="11" fill="#6B7280" text-anchor="middle">acesso a dados</text><line x1="708" y1="96" x2="724" y2="96" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><path d="M800,142 V190 H93 V144" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="450" y="208" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="middle">200 OK + JSON (o objeto Java é convertido pelo Jackson)</text><rect x="150" y="232" width="600" height="40" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="450" y="257" font-size="12.5" fill="#1F2937" text-anchor="middle">o controller só traduz HTTP ↔ Java; a lógica fica no service</text></svg>