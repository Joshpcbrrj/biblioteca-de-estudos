<svg xmlns="http://www.w3.org/2000/svg" width="820" height="266" viewBox="0 0 820 266"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Quando cada tipo de bloco é executado</text><line x1="40" y1="120" x2="790" y2="120" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><circle cx="160" cy="120" r="8" fill="#7C3AED"/><text x="160" y="100" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">classe carregada</text><rect x="70" y="145" width="180" height="70" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="118" y="176" class="m" font-size="14" fill="#7C3AED" xml:space="preserve">static { }</text><text x="160" y="200" font-size="12" fill="#1F2937" text-anchor="middle">1 vez só</text><circle cx="410" cy="120" r="8" fill="#2563EB"/><text x="410" y="100" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">new Exemplo()</text><rect x="320" y="145" width="180" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="355.4" y="176" class="m" font-size="14" fill="#2563EB" xml:space="preserve">{ } instância</text><text x="410" y="200" font-size="12" fill="#1F2937" text-anchor="middle">a cada objeto criado</text><circle cx="660" cy="120" r="8" fill="#16A34A"/><text x="660" y="100" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">método chamado</text><rect x="570" y="145" width="180" height="70" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="622.2" y="176" class="m" font-size="14" fill="#16A34A" xml:space="preserve">{ } local</text><text x="660" y="200" font-size="12" fill="#1F2937" text-anchor="middle">a cada execução</text><text x="790" y="140" font-size="12" font-style="italic" fill="#6B7280" text-anchor="end">tempo</text><text x="410" y="248" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Ordem ao criar o primeiro objeto: bloco estático → bloco de instância → construtor.</text></svg>