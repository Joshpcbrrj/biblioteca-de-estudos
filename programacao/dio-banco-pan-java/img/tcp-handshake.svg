<svg xmlns="http://www.w3.org/2000/svg" width="760" height="384" viewBox="0 0 760 384"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Three-way handshake do TCP</text><rect x="70" y="44" width="160" height="34" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="150" y="66" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Cliente</text><rect x="530" y="44" width="160" height="34" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="610" y="66" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Servidor</text><path d="M150,78 V340" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M610,78 V340" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="150" y1="100" x2="608" y2="112" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="380" y="98" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">1. SYN</text><text x="380" y="128" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">quero conversar; meu nº de sequência é x</text><line x1="610" y1="160" x2="152" y2="172" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="380" y="158" class="m" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">2. SYN-ACK</text><text x="380" y="188" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">recebi x; meu nº de sequência é y</text><line x1="150" y1="220" x2="608" y2="232" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="380" y="218" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">3. ACK</text><text x="380" y="248" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">recebi y: conexão estabelecida</text><line x1="150" y1="280" x2="608" y2="292" stroke="#7C3AED" stroke-width="2" marker-end="url(#arp)"/><text x="380" y="278" class="m" font-size="13" font-weight="bold" fill="#7C3AED" text-anchor="middle">GET /index.html</text><text x="380" y="308" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">só agora o HTTP começa</text><text x="380" y="364" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">A conexão só existe depois do terceiro passo; a segurança (criptografia) vem do TLS, não do handshake.</text></svg>