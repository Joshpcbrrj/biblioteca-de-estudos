<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="20" width="180" height="64" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="120" y="48.1" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">Último commit</text><text x="120" y="67.7" font-size="12.5" fill="#1F2937" text-anchor="middle">(HEAD)</text><rect x="290" y="20" width="180" height="64" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="380" y="56.9" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">Staging area</text><rect x="550" y="20" width="180" height="64" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="640" y="48.1" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">Diretório de</text><text x="640" y="67.7" font-size="12.5" fill="#1F2937" text-anchor="middle">trabalho</text><path d="M400,90 L400,115 L620,115 L620,92" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arb)"/><rect x="426.4" y="125" width="167.1" height="22" rx="5" fill="#fff" stroke="#fff" stroke-width="0"/><text x="510" y="140" class="m" font-size="13" fill="#2563EB" text-anchor="middle">git restore arquivo</text><text x="510" y="157" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">antes: git checkout -- arquivo</text><path d="M110,90 L110,115 L370,115 L370,92" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arv)"/><rect x="120.2" y="125" width="239.7" height="22" rx="5" fill="#fff" stroke="#fff" stroke-width="0"/><text x="240" y="140" class="m" font-size="13" fill="#16A34A" text-anchor="middle">git restore --staged arquivo</text><text x="240" y="157" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">antes: git reset HEAD arquivo</text><path d="M100,90 L100,200 L650,200 L650,92" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arp)"/><rect x="154.4" y="210" width="441.2" height="22" rx="5" fill="#fff" stroke="#fff" stroke-width="0"/><text x="375" y="225" class="m" font-size="13" fill="#7C3AED" text-anchor="middle">git restore --source=HEAD --staged --worktree arquivo</text><text x="375" y="242" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">antes: git checkout HEAD -- arquivo</text></svg>