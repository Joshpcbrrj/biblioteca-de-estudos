<svg xmlns="http://www.w3.org/2000/svg" width="480" height="278" viewBox="0 0 480 278"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Lista duplamente encadeada</text><rect x="40" y="90" width="80" height="44" rx="6" class="xB"/><text x="80" y="117" class="m b c">c1</text><path d="M120,104 L148,104" class="l" marker-end="url(#a)"/><path d="M148,122 L120,122" class="l" marker-end="url(#a)"/><rect x="148" y="90" width="80" height="44" rx="6" class="xB"/><text x="188" y="117" class="m b c">c2</text><path d="M228,104 L256,104" class="l" marker-end="url(#a)"/><path d="M256,122 L228,122" class="l" marker-end="url(#a)"/><rect x="256" y="90" width="80" height="44" rx="6" class="xB"/><text x="296" y="117" class="m b c">c3</text><path d="M336,104 L364,104" class="l" marker-end="url(#a)"/><path d="M364,122 L336,122" class="l" marker-end="url(#a)"/><rect x="364" y="90" width="80" height="44" rx="6" class="xB"/><text x="404" y="117" class="m b c">c4</text><text x="450" y="152" class="s"></text><text x="80" y="80" class="s b c">primeiroNo</text><text x="404" y="80" class="s b c">ultimoNo</text><text x="20" y="176" class="m s">→ próximo   ← anterior</text><text x="240.0" y="214" class="n c">Percorre nos dois sentidos; insere e remove</text><text x="240.0" y="234" class="n c">no início ou no fim em O(1).</text><text x="240.0" y="254" class="n c">É assim a java.util.LinkedList.</text></svg>