<svg xmlns="http://www.w3.org/2000/svg" width="820" height="296" viewBox="0 0 820 296"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Estrutura de um OKR</text><rect x="230" y="52" width="360" height="64" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="410" y="76" font-size="13" font-weight="bold" fill="#7C3AED" text-anchor="middle">Objetivo (O): qualitativo e inspirador</text><text x="410" y="100" font-size="14" font-style="italic" fill="#1F2937" text-anchor="middle">“Encantar os clientes do app”</text><path d="M410,116 V140 H160 V160" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arg)"/><rect x="40" y="160" width="240" height="64" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="160" y="184" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">KR1</text><text x="160" y="206" font-size="13.5" fill="#1F2937" text-anchor="middle">NPS de 40 para 60</text><path d="M410,116 V140 H420 V160" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arg)"/><rect x="300" y="160" width="240" height="64" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="420" y="184" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">KR2</text><text x="420" y="206" font-size="13.5" fill="#1F2937" text-anchor="middle">tempo de resposta &lt; 2h</text><path d="M410,116 V140 H680 V160" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arg)"/><rect x="560" y="160" width="240" height="64" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="680" y="184" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">KR3</text><text x="680" y="206" font-size="13.5" fill="#1F2937" text-anchor="middle">avaliação na loja ≥ 4,6</text><text x="410" y="252" font-size="13" fill="#1F2937" text-anchor="middle">Resultados-chave (KRs): de 2 a 5 por objetivo, numéricos e verificáveis (SMART)</text><text x="410" y="278" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">O diz aonde queremos chegar; os KRs dizem como saberemos que chegamos.</text></svg>