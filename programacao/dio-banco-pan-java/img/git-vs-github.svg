<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="10" y="40" width="270" height="270" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="145" y="72" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">Seu computador</text><rect x="30" y="92" width="230" height="70" rx="12" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="145" y="114.8" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="middle">Git</text><text x="145" y="134.2" font-size="12.5" fill="#1F2937" text-anchor="middle">programa instalado</text><text x="145" y="151.8" font-size="12.5" fill="#1F2937" text-anchor="middle">(funciona offline)</text><rect x="30" y="182" width="230" height="100" rx="12" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="145" y="211" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="middle">Repositório local</text><text x="145" y="230.5" font-size="12.5" fill="#1F2937" text-anchor="middle">arquivos + pasta .git</text><text x="145" y="248" font-size="12.5" fill="#1F2937" text-anchor="middle">commits, branches,</text><text x="145" y="265.5" font-size="12.5" fill="#1F2937" text-anchor="middle">histórico completo</text><rect x="480" y="40" width="270" height="270" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="615" y="72" font-size="16" font-weight="bold" fill="#7C3AED" text-anchor="middle">GitHub (nuvem)</text><rect x="500" y="92" width="230" height="70" rx="12" fill="#fff" stroke="#7C3AED" stroke-width="2"/><text x="615" y="123.5" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="middle">Repositório remoto</text><text x="615" y="143" font-size="12.5" fill="#1F2937" text-anchor="middle">cópia hospedada online</text><rect x="500" y="182" width="230" height="100" rx="12" fill="#fff" stroke="#7C3AED" stroke-width="2"/><text x="615" y="211" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="middle">Recursos extras</text><text x="615" y="230.5" font-size="12.5" fill="#1F2937" text-anchor="middle">issues · pull requests</text><text x="615" y="248" font-size="12.5" fill="#1F2937" text-anchor="middle">Actions · Pages</text><text x="615" y="265.5" font-size="12.5" fill="#1F2937" text-anchor="middle">perfil, stars, forks</text><line x1="284" y1="130" x2="476" y2="130" stroke="#1F2937" stroke-width="2.5" marker-end="url(#ara)"/><rect x="340.8" y="106" width="78.5" height="22" rx="5" fill="#fff" stroke="#fff" stroke-width="0"/><text x="380" y="121" class="m" font-size="13" fill="#1F2937" text-anchor="middle">git push</text><line x1="476" y1="200" x2="284" y2="200" stroke="#1F2937" stroke-width="2.5" marker-end="url(#ara)"/><rect x="292.4" y="176" width="175.2" height="22" rx="5" fill="#fff" stroke="#fff" stroke-width="0"/><text x="380" y="191" class="m" font-size="13" fill="#1F2937" text-anchor="middle">git pull / git clone</text><text x="380" y="26" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Git é a ferramenta · GitHub é um serviço que hospeda repositórios Git</text><text x="615" y="300" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">Alternativas: GitLab, Bitbucket, Gitea</text></svg>