<svg xmlns="http://www.w3.org/2000/svg" width="860" height="358" viewBox="0 0 860 358"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="430" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Modelo de maturidade de Richardson</text><rect x="250" y="56" width="360" height="54" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="430" y="79" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Nível 3</text><text x="430" y="98" font-size="12" fill="#6B7280" text-anchor="middle">HATEOAS: respostas com links</text><rect x="190" y="120" width="480" height="54" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="430" y="143" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Nível 2</text><text x="430" y="162" font-size="12" fill="#6B7280" text-anchor="middle">verbos HTTP + códigos de status</text><rect x="130" y="184" width="600" height="54" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="430" y="207" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Nível 1</text><text x="430" y="226" font-size="12" fill="#6B7280" text-anchor="middle">recursos com URIs próprias</text><rect x="70" y="248" width="720" height="54" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="430" y="271" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Nível 0</text><text x="430" y="290" font-size="12" fill="#6B7280" text-anchor="middle">um endpoint só, tudo via POST (RPC)</text><line x1="40" y1="300" x2="40" y2="74" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="40" y="62" font-size="11.5" font-weight="bold" fill="#16A34A" text-anchor="middle">mais REST</text><text x="430" y="340" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">A maioria das APIs do mercado chega ao nível 2; o nível 3 é o REST &quot;completo&quot; descrito por Fielding.</text></svg>