<svg xmlns="http://www.w3.org/2000/svg" width="480" height="444" viewBox="0 0 480 444"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Agilidade não é velocidade</text><rect x="20" y="52" width="440" height="150" rx="6" class="xR"/><text x="36" y="76" class="b">Só velocidade</text><circle cx="400" cy="110" r="22" class="xW"/><circle cx="400" cy="110" r="10" class="xR"/><path d="M50,170 L420,170" class="l" marker-end="url(#a)"/><text x="36" y="192" class="s">corre muito, sem corrigir o rumo</text><rect x="20" y="222" width="440" height="170" rx="6" class="xG"/><text x="36" y="246" class="b">Agilidade</text><circle cx="400" cy="300" r="22" class="xW"/><circle cx="400" cy="300" r="10" class="xG"/><path d="M50,360 L130,320" class="l" marker-end="url(#a)"/><path d="M130,320 L200,340" class="l" marker-end="url(#a)"/><path d="M200,340 L270,305" class="l" marker-end="url(#a)"/><path d="M270,305 L340,310" class="l" marker-end="url(#a)"/><path d="M340,310 L380,300" class="l" marker-end="url(#a)"/><circle cx="130" cy="320" r="6" class="xO"/><circle cx="200" cy="340" r="6" class="xO"/><circle cx="270" cy="305" r="6" class="xO"/><circle cx="340" cy="310" r="6" class="xO"/><text x="36" y="382" class="s">ciclos curtos, ajusta o rumo a cada feedback</text><text x="240.0" y="420" class="n c">○ = ponto de feedback e correção</text></svg>