<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Agilidade não é velocidade</text><rect x="30" y="50" width="370" height="230" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="215" y="80" font-size="16" font-weight="bold" fill="#DC2626" text-anchor="middle">Só velocidade</text><path d="M60,240 L370,120" fill="none" stroke="#DC2626" stroke-width="3" marker-end="url(#arr)"/><text x="70" y="120" font-size="12" fill="#6B7280">início</text><circle cx="60" cy="240" r="7" fill="#DC2626"/><rect x="300" y="200" width="80" height="30" rx="6" fill="#fff" stroke="#9CA3AF" stroke-width="1.5"/><text x="340" y="220" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">alvo</text><text x="215" y="266" font-size="12" font-style="italic" fill="#1F2937" text-anchor="middle">corre muito, sem corrigir o rumo: passa longe do alvo</text><rect x="420" y="50" width="370" height="230" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="605" y="80" font-size="16" font-weight="bold" fill="#16A34A" text-anchor="middle">Agilidade</text><circle cx="450" cy="240" r="7" fill="#16A34A"/><path d="M450,240 L520,170 L560,200 L620,150 L660,195 L700,205" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#arv)"/><circle cx="520" cy="170" r="5" fill="#fff" stroke="#16A34A" stroke-width="2"/><circle cx="560" cy="200" r="5" fill="#fff" stroke="#16A34A" stroke-width="2"/><circle cx="620" cy="150" r="5" fill="#fff" stroke="#16A34A" stroke-width="2"/><circle cx="660" cy="195" r="5" fill="#fff" stroke="#16A34A" stroke-width="2"/><rect x="690" y="190" width="80" height="30" rx="6" fill="#fff" stroke="#16A34A" stroke-width="1.5"/><text x="730" y="210" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">alvo</text><text x="605" y="266" font-size="12" font-style="italic" fill="#1F2937" text-anchor="middle">avança em ciclos curtos e ajusta o rumo a cada feedback</text><text x="605" y="118" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">○ = ponto de feedback e correção</text></svg>