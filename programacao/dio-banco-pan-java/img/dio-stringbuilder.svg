<svg xmlns="http://www.w3.org/2000/svg" width="480" height="324" viewBox="0 0 480 324"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Concatenar em laço × StringBuilder</text><text x="20" y="66" class="m b">s = s + i  (3 voltas)</text><rect x="20" y="78" width="100" height="40" rx="6" class="xR"/><text x="70.0" y="102.5" class="m b c">""</text><rect x="130" y="78" width="100" height="40" rx="6" class="xR"/><text x="180.0" y="102.5" class="m b c">"0"</text><rect x="240" y="78" width="100" height="40" rx="6" class="xR"/><text x="290.0" y="102.5" class="m b c">"01"</text><rect x="350" y="78" width="100" height="40" rx="6" class="xO"/><text x="400.0" y="102.5" class="m b c">"012"</text><text x="240.0" y="138" class="s c">cada volta cria uma String nova; as antigas viram lixo</text><text x="20" y="184" class="m b">sb.append(i)</text><rect x="20" y="196" width="440" height="48" rx="6" class="xG"/><rect x="30" y="202" width="38" height="36" rx="6" class="xW"/><text x="49.0" y="224.5" class="m b c">0</text><rect x="74" y="202" width="38" height="36" rx="6" class="xW"/><text x="93.0" y="224.5" class="m b c">1</text><rect x="118" y="202" width="38" height="36" rx="6" class="xW"/><text x="137.0" y="224.5" class="m b c">2</text><text x="300" y="226" class="s c">um único buffer que cresce</text><text x="20" y="280" class="s">Para poucas concatenações, + é suficiente.</text><text x="20" y="300" class="s">Em laços com muitas voltas, use StringBuilder.</text></svg>