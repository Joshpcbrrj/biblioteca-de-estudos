<svg xmlns="http://www.w3.org/2000/svg" width="571" height="234" viewBox="0 0 571 234"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.k{font-weight:bold}.lb{font-size:11.5px;font-style:italic;fill:#6B7280}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.if{fill:#FCE7F3;stroke:#DB2777;stroke-width:2}.lp{fill:#EDE9FE;stroke:#7C3AED;stroke-width:2}.cl{fill:#E0F2FE;stroke:#0284C7;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g transform="translate(101.9,0)"><path class="lp" d="M64,14 L294.8,14 L308.8,31 L294.8,48 L64,48 L50,31 Z"/><text class="t" x="179.4" y="35" text-anchor="middle">for (int i = 1; i &lt;= 5; i++)</text><path class="e" d="M179.4,48 L179.4,72" marker-end="url(#a)"/><text class="lb" x="184.4" y="63" text-anchor="start">próxima volta</text><path class="ou" d="M82.8,72 L290,72 L276,104 L68.8,104 Z"/><text class="t" x="179.4" y="92" text-anchor="middle" xml:space="preserve">System.out.println(i);</text><path class="e" d="M179.4,104 L179.4,116 L24,116 L24,31 L50,31" marker-end="url(#a)"/><path class="e" d="M308.8,31 L338.8,31 L338.8,136 L179.4,136"/><text class="lb" x="312.8" y="26" text-anchor="start">terminou</text><circle cx="179.4" cy="136" r="4" fill="#4B5563"/><path class="e" d="M179.4,140 L179.4,162" marker-end="url(#a)"/><rect class="te" x="82.8" y="162" width="193.2" height="32" rx="16"/><text class="t" x="179.4" y="182" text-anchor="middle" xml:space="preserve">imprimiu 1, 2, 3, 4, 5</text></g><text x="285.3