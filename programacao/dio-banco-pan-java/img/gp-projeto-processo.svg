<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Projeto x processo</text><rect x="30" y="50" width="370" height="220" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="215" y="80" font-size="17" font-weight="bold" fill="#2563EB" text-anchor="middle">Projeto</text><text x="215" y="116" font-size="14" fill="#1F2937" text-anchor="middle">esforço temporário</text><text x="215" y="146" font-size="14" fill="#1F2937" text-anchor="middle">tem início, meio e fim</text><text x="215" y="176" font-size="14" fill="#1F2937" text-anchor="middle">gera um resultado único</text><text x="215" y="206" font-size="14" font-style="italic" fill="#6B7280" text-anchor="middle">ex.: lançar um app novo</text><path d="M60,250 H370" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arb)"/><circle cx="60" cy="250" r="6" fill="#2563EB"/><rect x="420" y="50" width="370" height="220" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="605" y="80" font-size="17" font-weight="bold" fill="#D97706" text-anchor="middle">Processo</text><text x="605" y="116" font-size="14" fill="#1F2937" text-anchor="middle">atividade contínua</text><text x="605" y="146" font-size="14" fill="#1F2937" text-anchor="middle">se repete sempre igual</text><text x="605" y="176" font-size="14" fill="#1F2937" text-anchor="middle">mantém a operação</text><text x="605" y="206" font-size="14" font-style="italic" fill="#6B7280" text-anchor="middle">ex.: atender chamados</text><text x="605" y="256" font-size="30" font-weight="bold" fill="#D97706" text-anchor="middle">↻</text></svg>