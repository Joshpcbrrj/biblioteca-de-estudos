 Couchbase</text><rect x="20" y="156" width="440" height="92" rx="8" class="xG"/><text x="36" y="182" class="b">Chave-valor</text><text x="450" y="182" class="s r">busca direta pela chave</text><text x="36" y="210" class="m">"sessao:42" → {...}</text><text x="36" y="234" class="s">Ex.: Redis, DynamoDB</text><rect x="20" y="260" width="440" height="92" rx="8" class="xO"/><text x="36" y="286" class="b">Colunar</text><text x="450" y="286" class="s r">famílias de colunas</text><text x="36" y="314" class="m">linha | col1 | col2</text><text x="36" y="338" class="s">Ex.: Cassandra, HBase</text><rect x="20" y="364" width="440" height="92" rx="8" class="xP"/><text x="36" y="390" class="b">Grafo</text><text x="450" y="390" class="s r">nós e relacionamentos</text><text x="36" y="418" class="m">(Ana) -segue-&gt; (Rui)</text><text x="36" y="442" class="s">Ex.: Neo4j, Neptune</text></svg>