<svg xmlns="http://www.w3.org/2000/svg" width="480" height="486" viewBox="0 0 480 486"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Uma branch para cada tarefa</text><path d="M60,90 L420,90" class="l"/><path d="M180,90 Q200,160 240,160 L320,160 Q360,160 380,90" class="l"/><circle cx="60" cy="90" r="18" class="xB"/><text x="60" y="95" class="m b c">C1</text><circle cx="120" cy="90" r="18" class="xB"/><text x="120" y="95" class="m b c">C2</text><circle cx="180" cy="90" r="18" class="xB"/><text x="180" y="95" class="m b c">C3</text><circle cx="400" cy="90" r="18" class="xO"/><text x="400" y="95" class="m b c">M</text><circle cx="250" cy="160" r="18" class="xG"/><text x="250" y="165" class="m b c">F1</text><circle cx="320" cy="160" r="18" class="xG"/><text x="320" y="165" class="m b c">F2</text><text x="20" y="70" class="m b">main</text><text x="20" y="186" class="m b">feature</text><rect x="60" y="220" width="360" height="50" rx="6" class="xG"/><text x="240.0" y="241.5" class="m b c">git switch -c feature</text><text x="240.0" y="259.5" class="m c">cria e entra na branch</text><rect x="60" y="286" width="360" height="50" rx="6" class="xG"/><text x="240.0" y="307.5" class="m b c">git commit (F1, F2)</text><text x="240.0" y="325.5" class="m c">commits isolados da main</text><path d="M240.0,270 L240.0,286" class="l" marker-end="url(#a)"/><rect x="60" y="352" width="360" height="50" rx="6" class="xB"/><text x="240.0" y="373.5" class="m b c">git switch main</text><text x="240.0" y="391.5" class="m c">volta para a main</text><path d="M240.0,336 L240.0,352" class="l" marker-end="url(#a)"/><rect x="60" y="418" width="360" height="50" rx="6" class="xO"/><text x="240.0" y="439.5" class="m b c">git merge feature</text><text x="240.0" y="457.5" class="m c">junta tudo no commit M</text><path d="M240.0,402 L240.0,418" class="l" marker-end="url(#a)"/></svg>