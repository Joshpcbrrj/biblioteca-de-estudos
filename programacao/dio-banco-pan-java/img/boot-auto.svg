<svg xmlns="http://www.w3.org/2000/svg" width="880" height="412" viewBox="0 0 880 412"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="440" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">O que o Spring Boot faz ao iniciar</text><rect x="140" y="50" width="600" height="54" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="440" y="73" class="m" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">pom.xml</text><text x="440" y="92" font-size="11.5" fill="#6B7280" text-anchor="middle">spring-boot-starter-web</text><rect x="140" y="120" width="600" height="54" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="440" y="143" class="m" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">@SpringBootApplication</text><text x="440" y="162" font-size="11.5" fill="#6B7280" text-anchor="middle">@Configuration + @EnableAutoConfiguration + @ComponentScan</text><line x1="440" y1="105" x2="440" y2="118" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="140" y="190" width="600" height="54" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="440" y="213" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">auto-configuração</text><text x="440" y="232" font-size="11.5" fill="#6B7280" text-anchor="middle">achou Spring MVC e Tomcat no classpath? configura!</text><line x1="440" y1="175" x2="440" y2="188" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="140" y="260" width="600" height="54" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="440" y="283" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">app no ar</text><text x="440" y="302" font-size="11.5" fill="#6B7280" text-anchor="middle">Tomcat embutido na porta 8080</text><line x1="440" y1="245" x2="440" y2="258" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="140" y="332" width="600" height="36" rx="6" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="160" y="356" class="m" font-size="13" fill="#86EFAC" xml:space="preserve">$ java -jar minha-app.jar</text><text x="440" y="394" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Tudo o que você configurar explicitamente (application.properties, @Bean) tem prioridade sobre o automático.</text></svg>