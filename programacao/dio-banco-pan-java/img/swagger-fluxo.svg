<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="440" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Do código à documentação interativa</text><rect x="16" y="60" width="196" height="80" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="114" y="94" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Controllers + anotações</text><text x="114" y="116" font-size="11" fill="#6B7280" text-anchor="middle">@RestController, @Operation…</text><rect x="232" y="60" width="196" height="80" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="330" y="94" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">springdoc-openapi</text><text x="330" y="116" font-size="11" fill="#6B7280" text-anchor="middle">lê a aplicação na inicialização</text><line x1="214" y1="100" x2="230" y2="100" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="448" y="60" width="196" height="80" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="546" y="94" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">/v3/api-docs</text><text x="546" y="116" font-size="11" fill="#6B7280" text-anchor="middle">especificação OpenAPI (JSON)</text><line x1="430" y1="100" x2="446" y2="100" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="664" y="60" width="196" height="80" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="762" y="94" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">/swagger-ui.htm