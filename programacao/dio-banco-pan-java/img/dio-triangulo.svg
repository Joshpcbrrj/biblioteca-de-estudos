<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Formam um triângulo?</text><polygon points="60,200 200,200 150,90" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="130" y="224" class="m c">6.0  4.0  2.1</text><text x="130" y="246" class="m c">4 + 2,1 &gt; 6 ✓</text><path d="M280,200 L440,200 M280,200 L330,170 M440,200 L390,170" stroke="#DC2626" stroke-width="3" fill="none"/><text x="360" y="224" class="m c">6.0  4.0  2.0</text><text x="360" y="246" class="m c">4 + 2 = 6 ✗</text><text x="130" y="76" class="m b c">Perimetro = 12.1</text><text x="360" y="76" class="m b c">Area = 10.0</text><text x="360" y="150" class="s c">os lados não fecham</text><rect x="20" y="272" width="440" height="70" rx="6" class="xY"/><text x="36" y="296" class="s">Condição: cada lado &lt; soma dos outros dois.</text><text x="36" y="318" class="s">Senão: área do trapézio = (A + B) × C / 2.</text></svg>