"400" height="82" rx="8" class="xW"/><path d="M48,88 h384 a8,8 0 0 1 8,8 v12 h-400 v-12 a8,8 0 0 1 8,-8z" class="fY" opacity="0.55"/><circle cx="54" cy="98" r="4" fill="#EF4444" stroke="#fff" stroke-width="1"/><circle cx="68" cy="98" r="4" fill="#F59E0B" stroke="#fff" stroke-width="1"/><circle cx="82" cy="98" r="4" fill="#22C55E" stroke="#fff" stroke-width="1"/><rect x="40" y="108" width="400" height="62" fill="#F8FAFC" stroke="none" rx="0"/><rect x="40" y="88" width="400" height="82" rx="8" fill="none" stroke="#94A3B8" stroke-width="1.8"/><text x="54" y="132" class="m">usuário: ana</text><text x="54" y="153" class="m">senha:   ********</text><text x="40" y="204" class="s b">✔ credenciais conferem → autenticada</text><text x="40" y="228" class="s b">✖ não conferem → 401 Unauthorized</text><rect x="22" y="275" width="440" height="180" rx="8" class="sh"/><rect x="20" y="272" width="440" height="180" rx="8" class="xP"/><text x="240" y="296" class="b c">Autorização: o que você pode fazer?</text><rect x="42" y="311" width="180" height="50" rx="8" class="sh"/><rect x="40" y="308" width="180" height="50" rx="8" class="xW"/><text x="130.0" y="329.5" class="b c">Ana</text><text x="130.0" y="347.5" class="m s c">ROLE_USER</text><rect x="262" y="311" width="180" height="50" rx="8" class="sh"/><rect x="260" y="308" width="180" height="50" rx="8" class="xW"/><text x="350.0" y="329.5" class="b c">GET /admin</text><text x="350.0" y="347.5" class="m s c">exige ROLE_ADMIN</text><text x="40" y="404" class="s b">✔ tem a permissão → acesso liberado</text><text x="40" y="428" class="s b">✖ não tem → 403 Forbidden</text><text x="240.0" y="486" class="n c">Primeiro descobre quem é o usuário;</text><text x="240.0" y="506" class="n c">só depois decide o que ele pode acessar.</text></svg>