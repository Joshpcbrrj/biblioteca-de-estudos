<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="440" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Autenticação x autorização</text><rect x="30" y="54" width="400" height="210" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="230" y="84" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">Autenticação</text><text x="230" y="106" font-size="13" font-style="italic" fill="#1F2937" text-anchor="middle">Quem é você?</text><text x="60" y="140" class="m" font-size="13" fill="#1F2937" xml:space="preserve">usuário: ana</text><text x="60" y="164" class="m" font-size="13" fill="#1F2937" xml:space="preserve">senha:&#160;&#160; ********</text><text x="230" y="210" font-size="12.5" fill="#16A34A" text-anchor="middle">✔ credenciais conferem → Ana autenticada</text><text x="230" y="234" font-size="12.5" fill="#DC2626" text-anchor="middle">✖ não conferem → 401 Unauthorized</text><rect x="450" y="54" width="400" height="210" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="650" y="84" font-size="16" font-weight="bold" fill="#7C3AED" text-anchor="middle">Autorização</text><text x="650" y="106" font-size="13" font-style="italic" fill="#1F2937" text-anchor="middle">O que você pode fazer?</text><text x="480" y="140" class="m" font-size="13" fill="#1F2937" xml:space="preserve">Ana tem ROLE_USER</text><text x="480" y="164" class="m" font-size="13" fill="#1F2937" xml:space="preserve">GET /admin exige ROLE_ADMIN</text><text x="650" y="210" font-size="12.5" fill="#16A34A" text-anchor="middle">✔ tem a permissão → acesso liberado</text><text x="650" y="234" font-size="12.5" fill="#DC2626" text-anchor="middle">✖ não tem → 403 Forbidden</text><text x="440" y="292" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Primeiro o sistema descobre quem é o usuário; só depois decide o que ele pode acessar.</text></svg>