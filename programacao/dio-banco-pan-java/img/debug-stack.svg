<svg xmlns="http://www.w3.org/2000/svg" width="820" height="422" viewBox="0 0 820 422"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Pilha de execução (call stack) no momento do Thread.dumpStack()</text><rect x="250" y="56" width="220" height="46" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="328" y="85" class="m" font-size="15" fill="#1F2937" xml:space="preserve">c()</text><text x="490" y="84" font-size="12.5" fill="#1F2937">topo: método em execução</text><rect x="250" y="110" width="220" height="46" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="328" y="139" class="m" font-size="15" fill="#1F2937" xml:space="preserve">b()</text><text x="490" y="138" font-size="12.5" fill="#1F2937">esperando c() terminar</text><rect x="250" y="164" width="220" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="328" y="193" class="m" font-size="15" fill="#1F2937" xml:space="preserve">a()</text><text x="490" y="192" font-size="12.5" fill="#1F2937">esperando b() terminar</text><rect x="250" y="218" width="220" height="46" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="316" y="247" class="m" font-size="15" fill="#1F2937" xml:space="preserve">main()</text><text x="490" y="246" font-size="12.5" fill="#1F2937">base: primeiro método chamado</text><path d="M220,262 V70" fill="none" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arv)"/><text x="210" y="170" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="end">chamadas empilham</text><rect x="40" y="290" width="740" height="92" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><text x="56" y="314" class="m" font-size="12.5" fill="#E5E7EB" xml:space="preserve">java.lang.Exception: Stack trace</text><text x="56" y="333" class="m" font-size="12.5" fill="#E5E7EB" xml:space="preserve">&#160; &#160; at Debugging.c(Debugging.java:27)&#160;&#160; ← onde está agora</text><text x="56" y="352" class="m" font-size="12.5" fill="#E5E7EB" xml:space="preserve">&#160; &#160; at Debugging.b(Debugging.java:21)</text><text x="56" y="371" class="m" font-size="12.5" fill="#E5E7EB" xml:space="preserve">&#160; &#160; at Debugging.a(Debugging.java:10)&#160; ...&#160; at Debugging.main(Debugging.java:4)</text><text x="410" y="404" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">O stack trace lista do topo (onde o problema aconteceu) até o main: leia de cima para baixo para achar a origem.</text></svg>