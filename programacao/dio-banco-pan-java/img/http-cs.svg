<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 860 290"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="430" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Cliente e servidor trocando mensagens HTTP</text><rect x="30" y="90" width="190" height="110" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="125" y="142" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">🖥️&#160; Cliente</text><text x="125" y="160" font-size="11.5" fill="#6B7280" text-anchor="middle">navegador, app, Postman</text><rect x="640" y="90" width="190" height="110" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="735" y="142" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">🗄️&#160; Servidor</text><text x="735" y="160" font-size="11.5" fill="#6B7280" text-anchor="middle">Apache, Nginx, Tomcat</text><line x1="222" y1="120" x2="636" y2="120" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="430" y="110" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">Request: GET /produtos HTTP/1.1</text><line x1="638" y1="172" x2="224" y2="172" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="430" y="162" class="m" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">Response: HTTP/1.1 200 OK + JSON</text><text x="430" y="196" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">o cliente sempre pergunta; o servidor responde</text><rect x="240" y="230" width="380" height="40" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="430" y="255" font-size="12.5" fill="#1F2937" text-anchor="middle">HTTP (aplicação) sobre TCP (transporte) sobre IP (rede)</text></svg>