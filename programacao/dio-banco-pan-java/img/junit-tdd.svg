<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="360" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Ciclo do TDD: Red → Green → Refactor</text><circle cx="360" cy="120" r="58" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/><text x="360" y="122" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">RED</text><text x="430" y="124" font-size="12.5" fill="#1F2937">escreva um teste que falha</text><circle cx="460" cy="292" r="58" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="459.6" y="294.5" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">GREEN</text><text x="534.6" y="372.5" font-size="12.5" fill="#1F2937" text-anchor="middle">código mínimo para passar</text><circle cx="260" cy="292" r="58" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="260.4" y="294.5" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="middle">REFACTOR</text><text x="185.4" y="372.5" font-size="12.5" fill="#1F2937" text-anchor="middle">melhore sem quebrar</text><path d="M434,147 A115,115 0 0 1 473,215" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><path d="M399,343 A115,115 0 0 1 321,343" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><path d="M247,215 A115,115 0 0 1 286,147" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="360" y="240" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">repita</text></svg>