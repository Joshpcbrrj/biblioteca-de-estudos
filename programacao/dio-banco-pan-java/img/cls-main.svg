<svg xmlns="http://www.w3.org/2000/svg" width="820" height="214" viewBox="0 0 820 214"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomia do método main</text><text x="70" y="120" class="m" font-size="20" fill="#7C3AED" xml:space="preserve">public</text><text x="142.2" y="120" class="m" font-size="20" fill="#1F2937" xml:space="preserve"> </text><text x="154.3" y="120" class="m" font-size="20" fill="#D97706" xml:space="preserve">static</text><text x="226.5" y="120" class="m" font-size="20" fill="#1F2937" xml:space="preserve"> </text><text x="238.6" y="120" class="m" font-size="20" fill="#DC2626" xml:space="preserve">void</text><text x="286.7" y="120" class="m" font-size="20" fill="#1F2937" xml:space="preserve"> </text><text x="298.8" y="120" class="m" font-size="20" fill="#2563EB" xml:space="preserve">main</text><text x="346.9" y="120" class="m" font-size="20" fill="#1F2937" xml:space="preserve">(</text><text x="359" y="120" class="m" font-size="20" fill="#16A34A" xml:space="preserve">String[] args</text><text x="515.5" y="120" class="m" font-size="20" fill="#1F2937" xml:space="preserve">)</text><path d="M72,92 v-6 H140.24 v6" fill="none" stroke="#7C3AED" stroke-width="1.6"/><line x1="106.1" y1="86" x2="106.1" y2="74" stroke="#7C3AED" stroke-width="1.6"/><text x="106.1" y="68" font-size="12.5" font-weight="bold" fill="#7C3AED" text-anchor="middle">acessível pela JVM</text><path d="M156.28,128 v6 H224.5 v-6" fill="none" stroke="#D97706" stroke-width="1.6"/><line x1="190.4" y1="134" x2="190.4" y2="146" stroke="#D97706" stroke-width="1.6"/><text x="190.4" y="160" font-size="12.5" font-weight="bold" fill="#D97706" text-anchor="middle">roda sem criar objeto</text><path d="M240.5,92 v-6 H284.7 v6" fill="none" stroke="#DC2626" stroke-width="1.6"/><line x1="262.6" y1="86" x2="262.6" y2="74" stroke="#DC2626" stroke-width="1.6"/><text x="262.6" y="68" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">não retorna nada</text><path d="M300.76,128 v6 H344.9 v-6" fill="none" stroke="#2563EB" stroke-width="1.6"/><line x1="322.8" y1="134" x2="322.8" y2="146" stroke="#2563EB" stroke-width="1.6"/><text x="322.8" y="160" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="middle">nome fixo</text><path d="M360.96,92 v-6 H513.48 v6" fill="none" stroke="#16A34A" stroke-width="1.6"/><line x1="437.2" y1="86" x2="437.2" y2="74" stroke="#16A34A" stroke-width="1.6"/><text x="437.2" y="68" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="middle">argumentos do terminal</text><text x="410" y="196" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">É o ponto de entrada: a JVM procura exatamente essa assinatura para iniciar o programa.</text></svg>