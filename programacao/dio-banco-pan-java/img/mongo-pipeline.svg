<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Pipeline de agregação: cada estágio recebe o resultado do anterior</text><rect x="20" y="60" width="150" height="70" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="95" y="90" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">coleção</text><text x="95" y="112" font-size="12" fill="#6B7280" text-anchor="middle">1000 docs</text><rect x="196" y="60" width="150" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="271" y="90" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">$match</text><text x="271" y="112" font-size="12" fill="#6B7280" text-anchor="middle">filtra → 300</text><line x1="172" y1="95" x2="194" y2="95" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="372" y="60" width="150" height="70" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="447" y="90" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">$group</text><text x="447" y="112" font-size="12" fill="#6B7280" text-anchor="middle">agrupa → 12</text><line x1="348" y1="95" x2="370" y2="95" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="548" y="60" width="150" height="70" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="623" y="90" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">$sort</text><text x="623" y="112" font-size="12" fill="#6B7280" text-anchor="middle">ordena</text><line x1="524" y1="95" x2="546" y2="95" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="724" y="60" width="150" height="70" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="799" y="90" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">$limit</text><text x="799" y="112" font-size="12" fill="#6B7280" text-anchor="middle">top 5</text><line x1="700" y1="95" x2="722" y2="95" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="60" y="158" width="780" height="128" rx="8" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="80" y="184" class="m" font-size="13" fill="#E5E7EB" xml:space="preserve">db.pedidos.aggregate([</text><text x="80" y="205" class="m" font-size="13" fill="#93C5FD" xml:space="preserve">&#160; { $match: { status: &quot;pago&quot; } },</text><text x="80" y="226" class="m" font-size="13" fill="#FDE68A" xml:space="preserve">&#160; { $group: { _id: &quot;$cliente&quot;, total: { $sum: &quot;$valor&quot; } } },</text><text x="80" y="247" class="m" font-size="13" fill="#86EFAC" xml:space="preserve">&#160; { $sort: { total: -1 } }, { $limit: 5 }</text><text x="80" y="268" class="m" font-size="13" fill="#E5E7EB" xml:space="preserve">])</text><text x="450" y="312" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Resultado: os 5 clientes que mais gastaram em pedidos pagos.</text></svg>