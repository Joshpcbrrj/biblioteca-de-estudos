<svg xmlns="http://www.w3.org/2000/svg" width="480" height="378" viewBox="0 0 480 378"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Cada fase é executada por um plugin</text><rect x="20" y="52" width="440" height="34" rx="6" class="xP"/><text x="100.0" y="74" class="b c">fase (o quê)</text><text x="320.0" y="74" class="b c">goal do plugin (como)</text><rect x="20" y="86" width="440" height="34" rx="6" class="xW"/><text x="100.0" y="108" class="m c">compile</text><text x="320.0" y="108" class="m c">compiler:compile</text><rect x="20" y="120" width="440" height="34" rx="6" class="xY"/><text x="100.0" y="142" class="m c">test</text><text x="320.0" y="142" class="m c">surefire:test</text><rect x="20" y="154" width="440" height="34" rx="6" class="xW"/><text x="100.0" y="176" class="m c">package</text><text x="320.0" y="176" class="m c">jar:jar</text><rect x="20" y="188" width="440" height="34" rx="6" class="xY"/><text x="100.0" y="210" class="m c">install</text><text x="320.0" y="210" class="m c">install:install</text><rect x="20" y="256" width="4