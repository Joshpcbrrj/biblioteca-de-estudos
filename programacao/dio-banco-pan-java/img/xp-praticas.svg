<svg xmlns="http://www.w3.org/2000/svg" width="820" height="402" viewBox="0 0 820 402"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">XP (Extreme Programming): práticas em ciclos curtos</text><circle cx="410" cy="200" r="70" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="410" y="196" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="middle">código</text><text x="410" y="216" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="middle">de qualidade</text><rect x="25" y="52" width="250" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="150" y="76" font-size="14.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Programação em par</text><text x="150" y="96" font-size="12" fill="#6B7280" text-anchor="middle">dois devs, um teclado</text><rect x="545" y="52" width="250" height="56" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="670" y="76" font-size="14.5" font-weight="bold" fill="#1F2937" text-anchor="middle">TDD</text><text x="670" y="96" font-size="12" fill="#6B7280" text-anchor="middle">teste antes do código</text><rect x="45" y="292" width="250" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="170" y="316" font-size="14.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Integração contínua</text><text x="170" y="336" font-size="12" fill="#6B7280" text-anchor="middle">integra e testa várias vezes ao dia</text><rect x="525" y="292" width="250" height="56" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="650" y="316" font-size="14.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Design simples</text><text x="650" y="336" font-size="12" fill="#6B7280" text-anchor="middle">só o necessário, refatorando sempre</text><rect x="285" y="44" width="250" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="410" y="68" font-size="14.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Releases curtos</text><text x="410" y="88" font-size="12" fill="#6B7280" text-anchor="middle">entrega pequena e frequente</text><line x1="200" y1="108" x2="336.5" y2="158.6" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arg)"/><line x1="620" y1="108" x2="483.5" y2="158.6" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arg)"/><line x1="230" y1="292" x2="347" y2="241.4" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arg)"/><line x1="590" y1="292" x2="473" y2="241.4" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arg)"/><line x1="410" y1="100" x2="410" y2="128" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arg)"/><text x="410" y="384" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Valores do XP: comunicação, simplicidade, feedback, coragem e respeito.</text></svg>