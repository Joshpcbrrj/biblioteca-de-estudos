<svg xmlns="http://www.w3.org/2000/svg" width="480" height="436" viewBox="0 0 480 436"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">As classes do java.time</text><rect x="20" y="52" width="440" height="50" rx="6" class="xB"/><text x="34" y="74" class="m b">LocalDate</text><text x="446" y="74" class="s r">só data</text><text x="34" y="93" class="m">2024-05-10</text><rect x="20" y="110" width="440" height="50" rx="6" class="xB"/><text x="34" y="132" class="m b">LocalTime</text><text x="446" y="132" class="s r">só hora</text><text x="34" y="151" class="m">14:00</text><rect x="20" y="168" width="440" height="50" rx="6" class="xG"/><text x="34" y="190" class="m b">LocalDateTime</text><text x="446" y="190" class="s r">data e hora</text><text x="34" y="209" class="m">2024-05-10T14:00</text><rect x="20" y="226" width="440" height="50" rx="6" class="xO"/><text x="34" y="248" class="m b">ZonedDateTime</text><text x="446" y="248" class="s r">com fuso</text><text x="34" y="267" class="m">...-03:00[America/Sao_Paulo]</text><rect x="20" y="284" width="440" height="50" rx="6" class="xO"/><text x="34" y="306" class="m b">Instant</text><text x="446" y="306" class="s r">instante em UTC</text><text x="34" y="325" class="m">2024-05-10T17:00:00Z</text><rect x="20" y="342" width="440" height="50" rx="6" class="xP"/><text x="34" y="364" class="m b">Period / Duration</text><text x="446" y="364" class="s r">intervalos</text><text x="34" y="383" class="m">P2M / PT30S</text><text x="240.0" y="412" class="n c">Todas são imutáveis: plusDays() devolve um objeto novo.</text></svg>