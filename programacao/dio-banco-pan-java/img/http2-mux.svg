<svg xmlns="http://www.w3.org/2000/svg" width="880" height="274" viewBox="0 0 880 274"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="440" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">HTTP/1.1 x HTTP/2: como os recursos trafegam</text><text x="220" y="60" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">HTTP/1.1: várias conexões, uma resposta por vez</text><rect x="40" y="80" width="80" height="34" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="80" y="102" font-size="11" fill="#1F2937" text-anchor="middle">conexão 1</text><rect x="130" y="80" width="120" height="34" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="190" y="102" class="m" font-size="11.5" fill="#1F2937" text-anchor="middle">index.html</text><rect x="258" y="80" width="120" height="34" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="318" y="102" class="m" font-size="11.5" fill="#1F2937" text-anchor="middle">app.js</text><rect x="40" y="126" width="80" height="34" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="80" y="148" font-size="11" fill="#1F2937" text-anchor="middle">conexão 2</text><rect x="130" y="126" width="120" height="34" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="190" y="148" class="m" font-size="11.5" fill="#1F2937" text-anchor="middle">style.css</text><rect x="258" y="126" width="120" height="34" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="318" y="148" class="m" font-size="11.5" fill="#1F2937" text-anchor="middle">logo.png</text><rect x="40" y="172" width="80" height="34" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="80" y="194" font-size="11" fill="#1F2937" text-anchor="middle">conexão 3</text><rect x="130" y="172" width="120" height="34" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="190" y="194" class="m" font-size="11.5" fill="#1F2937" text-anchor="middle">font.woff</text><line x1="440" y1="50" x2="440" y2="230" stroke="#9CA3AF" stroke-width="2"/><text x="660" y="60" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">HTTP/2: uma conexão, streams multiplexados</text><rect x="480" y="90" width="380" height="90" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="670" y="110" font-size="11.5" font-style="italic" fill="#6B7280" text-anchor="middle">uma única conexão TCP + TLS</text><rect x="492" y="124" width="30" height="40" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><rect x="528" y="124" width="30" height="40" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><rect x="564" y="124" width="30" height="40" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><rect x="600" y="124" width="30" height="40" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><rect x="636" y="124" width="30" height="40" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><rect x="672" y="124" width="30" height="40" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><rect x="708" y="124" width="30" height="40" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><rect x="744" y="124" width="30" height="40" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><rect x="780" y="124" width="30" height="40" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><rect x="816" y="124" width="30" height="40" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="670" y="204" font-size="11.5" fill="#1F2937" text-anchor="middle">cada cor = um recurso, dividido em quadros (frames)</text><text x="440" y="256" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">No HTTP/1.1 a conexão é reaproveitada (keep-alive), mas as respostas saem em fila; no HTTP/2 elas são intercaladas.</text></svg>