<svg xmlns="http://www.w3.org/2000/svg" width="820" height="308" viewBox="0 0 820 308"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Atribuição copia o valor — para objetos, o valor é a referência</text><text x="200" y="60" font-size="15" font-weight="bold" fill="#D97706" text-anchor="middle">Primitivos</text><text x="60" y="92" class="m" font-size="14" fill="#1F2937" xml:space="preserve">int a = 1;</text><text x="60" y="113.7" class="m" font-size="14" fill="#1F2937" xml:space="preserve">int b = a;</text><text x="60" y="135.4" class="m" font-size="14" fill="#1F2937" xml:space="preserve">a = 2;</text><text x="70" y="190" class="m" font-size="15" fill="#1F2937" xml:space="preserve">a</text><rect x="100" y="168" width="80" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="132" y="192" class="m" font-size="15" fill="#1F2937" xml:space="preserve">2</text><text x="70" y="240" class="m" font-size="15" fill="#1F2937" xml:space="preserve">b</text><rect x="100" y="218" width="80" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="132" y="242" class="m" font-size="15" fill="#1F2937" xml:space="preserve">1</text><text x="200" y="290" font-size="12.5" font-style="italic" fill="#1F2937" text-anchor="middle">b não muda: cada um tem sua cópia</text><line x1="410" y1="50" x2="410" y2="300" stroke="#F3F4F6" stroke-width="2"/><text x="615" y="60" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="middle">Objetos</text><text x="450" y="92" class="m" font-size="14" fill="#1F2937" xml:space="preserve">MeuObj objA = new MeuObj(1);</text><text x="450" y="113.7" class="m" font-size="14" fill="#1F2937" xml:space="preserve">MeuObj objB = objA;</text><text x="450" y="135.4" class="m" font-size="14" fill="#1F2937" xml:space="preserve">objA.setNum(2);</text><text x="450" y="190" class="m" font-size="15" fill="#1F2937" xml:space="preserve">objA</text><rect x="500" y="168" width="50" height="36" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><circle cx="525" cy="186" r="4" fill="#7C3AED"/><text x="450" y="240" class="m" font-size="15" fill="#1F2937" xml:space="preserve">objB</text><rect x="500" y="218" width="50" height="36" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><circle cx="525" cy="236" r="4" fill="#7C3AED"/><rect x="640" y="190" width="130" height="54" rx="8" fill="#fff" stroke="#7C3AED" stroke-width="1.5"/><text x="705" y="210" font-size="12" fill="#6B7280" text-anchor="middle">MeuObj</text><text x="680" y="232" class="m" font-size="14" fill="#1F2937" xml:space="preserve">num = 2</text><path d="M529,186 C590,186 600,205 638,210" fill="none" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arp)"/><path d="M529,236 C590,236 600,225 638,225" fill="none" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arp)"/><text x="615" y="290" font-size="12.5" font-style="italic" fill="#1F2937" text-anchor="middle">os dois apontam para o MESMO objeto</text></svg>