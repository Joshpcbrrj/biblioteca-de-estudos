<svg xmlns="http://www.w3.org/2000/svg" width="480" height="468" viewBox="0 0 480 468"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Atribuição copia o valor</text><rect x="20" y="52" width="440" height="170" rx="6" class="xW"/><text x="36" y="76" class="b">Primitivos</text><rect x="36" y="88" width="220" height="80" rx="6" class="xW"/><text x="50" y="112" class="m">int a = 1;</text><text x="50" y="132" class="m">int b = a;</text><text x="50" y="152" class="m">a = 2;</text><text x="325.0" y="104" class="m s c">a</text><rect x="290" y="110" width="70" height="38" rx="6" class="xO"/><text x="325.0" y="135" class="m b c">2</text><text x="405.0" y="104" class="m s c">b</text><rect x="370" y="110" width="70" height="38" rx="6" class="xG"/><text x="405.0" y="135" class="m b c">1</text><text x="36" y="206" class="s">b não muda: cada um tem sua cópia</text><rect x="20" y="240" width="440" height="210" rx="6" class="xW"/><text x="36" y="264" class="b">Objetos</text><rect x="36" y="276" width="408" height="80" rx="6" class="xW"/><text x="50" y="300" cla