<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610">
<style>.t{font:bold 17px Helvetica, Arial, sans-serif;fill:#1F2937}.b{font:bold 16px Helvetica, Arial, sans-serif;fill:#1F2937}.n{font:15px Helvetica, Arial, sans-serif;fill:#1F2937}.s{font:14px Helvetica, Arial, sans-serif;fill:#4B5563}.c{font:15px Menlo, Consolas, monospace;fill:#1F2937}.r{font:bold 15px Helvetica, Arial, sans-serif;fill:#4B5563}.l{stroke:#4B5563;stroke-width:2.5;fill:none}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4B5563"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/><text x="360" y="34" class="t" text-anchor="middle">Do seu computador ao GitHub</text><rect x="40" y="60" width="300" height="70" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="190.0" y="92.0" class="b" text-anchor="middle">Pasta de trabalho</text><text x="190.0" y="114.0" class="s" text-anchor="middle">arquivos que você edita</text><rect x="40" y="170" width="300" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="190.0" y="202.0" class="b" text-anchor="middle">Staging</text><text x="190.0" y="224.0" class="s" text-anchor="middle">o que vai no próximo commit</text><rect x="40" y="280" width="300" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="190.0" y="312.0" class="b" text-anchor="middle">Repositório local</text><text x="190.0" y="334.0" class="s" text-anchor="middle">histórico na sua máquina</text><rect x="40" y="390" width="300" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="190.0" y="422.0" class="b" text-anchor="middle">Repositório remoto</text><text x="190.0" y="444.0" class="s" text-anchor="middle">GitHub (origin)</text><path d="M190,130V166" class="l" marker-end="url(#a)"/><text x="210" y="160" class="c" text-anchor="start">git add</text><path d="M190,240V276" class="l" marker-end="url(#a)"/><text x="210" y="270" class="c" text-anchor="start">git commit</text><path d="M190,350V386" class="l" marker-end="url(#a)"/><text x="210" y="380" class="c" text-anchor="start">git push</text><path d="M340,415H420V315H344" class="l" marker-end="url(#a)"/><text x="435" y="350" class="c" text-anchor="start">git fetch</text><text x="435" y="372" class="s" text-anchor="start">atualiza só o</text><text x="435" y="392" class="s" text-anchor="start">histórico local</text><path d="M340,445H600V95H344" class="l" marker-end="url(#a)"/><text x="615" y="230" class="c" text-anchor="start">git pull</text><text x="615" y="252" class="s" text-anchor="start">fetch +</text><text x="615" y="272" class="s" text-anchor="start">merge nos</text><text x="615" y="292" class="s" text-anchor="start">arquivos</text><rect x="40" y="520" width="640" height="70" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="360" y="550" class="n" text-anchor="middle">git clone URL: copia o remoto inteiro</text><text x="360" y="574" class="s" text-anchor="middle">e já cria a pasta, o histórico e o origin</text></svg>