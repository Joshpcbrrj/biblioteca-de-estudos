<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Caminho da execução em try / catch / finally</text><rect x="280" y="50" width="200" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="380" y="80" class="m" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">try { … }</text><rect x="60" y="160" width="200" height="50" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="160" y="190" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">catch (Tipo e) { … }</text><rect x="280" y="260" width="200" height="50" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="380" y="290" class="m" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">finally { … }</text><rect x="280" y="360" width="200" height="44" rx="8" fill="#fff" stroke="#16A34A" stroke-width="2"/><text x="380" y="387" font-size="13" fill="#1F2937" text-anchor="middle">código seguinte</text><line x1="330" y1="100" x2="190" y2="160" stroke="#DC2626" stroke-width="2" marker-end="url(#arr)"/><text x="200" y="130" font-size="12" fill="#DC2626" text-anchor="end">exceção lançada</text><line x1="430" y1="100" x2="430" y2="260" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="440" y="180" font-size="12" fill="#16A34A">sem exceção</text><line x1="190" y1="210" x2="330" y2="260" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><line x1="380" y1="310" x2="380" y2="360" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="530" y="160" width="200" height="80" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="630" y="184" font-size="12" font-weight="bold" fill="#D97706" text-anchor="middle">nenhum catch compatível?</text><text x="630" y="204" font-size="12" fill="#1F2937" text-anchor="middle">finally roda e a exceção</text><text x="630" y="222" font-size="12" fill="#1F2937" text-anchor="middle">sobe para quem chamou</text><text x="380" y="432" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">O finally só não roda se a JVM parar (ex.: System.exit) antes de chegar nele.</text><path d="M480,90 C540,100 600,120 620,160" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 4"/></svg>