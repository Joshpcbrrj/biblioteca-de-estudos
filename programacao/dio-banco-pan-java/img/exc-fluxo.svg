<svg xmlns="http://www.w3.org/2000/svg" width="480" height="464" viewBox="0 0 480 464"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Caminho no try / catch / finally</text><rect x="140" y="52" width="200" height="48" rx="6" class="xB"/><text x="240.0" y="80.5" class="m b c">try { … }</text><rect x="20" y="150" width="180" height="48" rx="6" class="xR"/><text x="110.0" y="178.5" class="m b c">catch (Tipo e)</text><rect x="140" y="248" width="200" height="48" rx="6" class="xG"/><text x="240.0" y="276.5" class="m b c">finally { … }</text><rect x="140" y="346" width="200" height="44" rx="6" class="xW"/><text x="240.0" y="372.5" class="m c">código seguinte</text><path d="M200,100 L110,150" class="l" marker-end="url(#a)"/><text x="130" y="126" class="s r">exceção</text><path d="M300,100 L300,248" class="l" marker-end="url(#a)"/><text x="310" y="176" class="s">sem exceção</text><path d="M110,198 L200,248" class="l" marker-end="url(#a)"/><path d="M240,296 L240,346" class="l" marker-end="url(#a)"/><rect x="260" y="150" width="200" height="60" rx="6" class="xY"/><text x="270" y="174" class="s">nenhum catch serve?</text><text x="270" y="192" class="s">finally roda e sobe</text><text x="240.0" y="420" class="n c">O finally só não roda se a JVM parar</text><text x="240.0" y="440" class="n c">antes (ex.: System.exit).</text></svg>