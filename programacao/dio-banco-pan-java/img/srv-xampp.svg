<svg xmlns="http://www.w3.org/2000/svg" width="820" height="304" viewBox="0 0 820 304"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="410" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">O que vem no XAMPP</text><rect x="30" y="56" width="140" height="140" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="100" y="104" font-size="34" font-weight="bold" fill="#9CA3AF" text-anchor="middle">X</text><text x="100" y="140" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">multiplataforma</text><text x="100" y="162" font-size="11" fill="#6B7280" text-anchor="middle">Windows, Linux, macOS</text><rect x="185" y="56" width="140" height="140" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="255" y="104" font-size="34" font-weight="bold" fill="#DC2626" text-anchor="middle">A</text><text x="255" y="140" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Apache</text><text x="255" y="162" font-size="11" fill="#6B7280" text-anchor="middle">servidor web</text><rect x="340" y="56" width="140" height="140" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="410" y="104" font-size="34" font-weight="bold" fill="#2563EB" text-anchor="middle">M</text><text x="410" y="140" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">MariaDB</text><text x="410" y="162" font-size="11" fill="#6B7280" text-anchor="middle">banco (antes MySQL)</text><rect x="495" y="56" width="140" height="140" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="565" y="104" font-size="34" font-weight="bold" fill="#7C3AED" text-anchor="middle">P</text><text x="565" y="140" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">PHP</text><text x="565" y="162" font-size="11" fill="#6B7280" text-anchor="middle">linguagem do servidor</text><rect x="650" y="56" width="140" height="140" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="720" y="104" font-size="34" font-weight="bold" fill="#D97706" text-anchor="middle">P</text><text x="720" y="140" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Perl</text><text x="720" y="162" font-size="11" fill="#6B7280" text-anchor="middle">linguagem de script</text><rect x="110" y="220" width="600" height="40" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="410" y="245" font-size="12.5" fill="#1F2937" text-anchor="middle">+ phpMyAdmin, OpenSSL e um painel para ligar/desligar os serviços</text><text x="410" y="286" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Feito para desenvolvimento local — não é recomendado para produção.</text></svg>