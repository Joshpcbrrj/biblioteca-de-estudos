<svg xmlns="http://www.w3.org/2000/svg" width="760" height="348" viewBox="0 0 760 348"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Estrutura gerada pelo archetype quickstart</text><text x="70" y="74" font-size="15" fill="#1F2937">📁 meu-projeto</text><text x="100" y="108" font-size="15" font-weight="bold" fill="#2563EB">📄 pom.xml</text><text x="430" y="108" font-size="13" fill="#2563EB">← configuração do projeto</text><text x="100" y="142" font-size="15" font-weight="bold" fill="#16A34A">📁 src/main/java</text><text x="430" y="142" font-size="13" fill="#16A34A">← código da aplicação</text><text x="130" y="176" font-size="15" fill="#1F2937">📄 com/exemplo/App.java</text><text x="100" y="210" font-size="15" font-weight="bold" fill="#D97706">📁 src/test/java</text><text x="430" y="210" font-size="13" fill="#D97706">← testes automatizados</text><text x="130" y="244" font-size="15" fill="#1F2937">📄 com/exemplo/AppTest.java</text><text x="100" y="278" font-size="15" font-weight="bold" fill="#6B7280">📁 target</text><text x="430" y="278" font-size="13" fill="#6B7280">← gerado na build (.class, .jar)</text><text x="380" y="330" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Seguir essa convenção dispensa configuração: o Maven já sabe onde está cada coisa.</text></svg>