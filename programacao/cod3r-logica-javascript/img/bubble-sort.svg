<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.e{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Bubble sort: ordenando [5, 3, 8, 1]</text><text x="120" y="88" class="b e">Início</text><rect x="150" y="60" width="60" height="40" rx="6" class="xB"/><text x="180" y="84.5" class="m b c">5</text><rect x="220" y="60" width="60" height="40" rx="6" class="xB"/><text x="250" y="84.5" class="m b c">3</text><rect x="290" y="60" width="60" height="40" rx="6" class="xB"/><text x="320" y="84.5" class="m b c">8</text><rect x="360" y="60" width="60" height="40" rx="6" class="xB"/><text x="390" y="84.5" class="m b c">1</text><path d="M290,102L290,120" class="l" marker-end="url(#a)"/><text x="120" y="150" class="b e">Passada 1</text><rect x="150" y="122" width="60" height="40" rx="6" class="xB"/><text x="180" y="146.5" class="m b c">3</text><rect x="220" y="122" width="60" height="40" rx="6" class="xB"/><text x="250" y="146.5" class="m b c">5</text><rect x="290" y="122" width="60" height="40" rx="6" class="xB"/><text x="320" y="146.5" class="m b c">1</text><rect x="360" y="122" width="60" height="40" rx="6" class="xG"/><text x="390" y="146.5" class="m b c">8</text><path d="M290,164L290,182" class="l" marker-end="url(#a)"/><text x="120" y="212" class="b e">Passada 2</text><rect x="150" y="184" width="60" height="40" rx="6" class="xB"/><text x="180" y="208.5" class="m b c">3</text><rect x="220" y="184" width="60" height="40" rx="6" class="xB"/><text x="250" y="208.5" class="m b c">1</text><rect x="290" y="184" width="60" height="40" rx="6" class="xG"/><text x="320" y="208.5" class="m b c">5</text><rect x="360" y="184" width="60" height="40" rx="6" class="xG"/><text x="390" y="208.5" class="m b c">8</text><path d="M290,226L290,244" class="l" marker-end="url(#a)"/><text x="120" y="274" class="b e">Passada 3</text><rect x="150" y="246" width="60" height="40" rx="6" class="xB"/><text x="180" y="270.5" class="m b c">1</text><rect x="220" y="246" width="60" height="40" rx="6" class="xG"/><text x="250" y="270.5" class="m b c">3</text><rect x="290" y="246" width="60" height="40" rx="6" class="xG"/><text x="320" y="270.5" class="m b c">5</text><rect x="360" y="246" width="60" height="40" rx="6" class="xG"/><text x="390" y="270.5" class="m b c">8</text><text x="640" y="80" class="b">Como funciona</text><text x="640" y="106" style="white-space:pre">1. Compara cada par vizinho.</text><text x="640" y="128" style="white-space:pre">2. Se o da esquerda for maior, troca.</text><text x="640" y="150" style="white-space:pre">3. Ao fim de cada passada, o maior</text><text x="640" y="172" style="white-space:pre">   valor &quot;borbulha&quot; para o final (verde).</text><text x="640" y="194" style="white-space:pre">4. Repete até não haver mais trocas.</text><text x="450" y="326" class="n c">Verde = posição já definitiva. Na prática, use array.sort((a, b) =&gt; a - b).</text></svg>