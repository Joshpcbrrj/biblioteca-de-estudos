<svg xmlns="http://www.w3.org/2000/svg" width="760" height="306" viewBox="0 0 760 306"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Classe = molde;&#160; new cria instâncias com valores próprios</text><rect x="20" y="50" width="260" height="210" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 4"/><text x="150" y="76" class="m" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="middle">class Pessoa</text><text x="40" y="108" class="m" font-size="12.5" fill="#1F2937">constructor(nome, idade)</text><text x="56" y="132" class="m" font-size="12.5" fill="#6B7280">this.nome = nome</text><text x="56" y="152" class="m" font-size="12.5" fill="#6B7280">this.idade = idade</text><text x="40" y="186" class="m" font-size="12.5" fill="#1F2937">exibirInfo() { ... }</text><text x="150" y="240" font-size="12" font-style="italic" fill="#7C3AED" text-anchor="middle">molde: define a forma</text><rect x="470" y="50" width="260" height="104" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="484" y="75" class="m" font-size="14" font-weight="bold" fill="#2563EB">pessoa1</text><rect x="482" y="88" width="70" height="26" rx="4" fill="#fff" stroke="#2563EB" stroke-width="1.4"/><text x="517" y="106" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">nome</text><rect x="558" y="88" width="160" height="26" rx="4" fill="#fff" stroke="#D1D5