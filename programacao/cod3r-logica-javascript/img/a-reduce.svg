<svg xmlns="http://www.w3.org/2000/svg" width="760" height="222" viewBox="0 0 760 222"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">reduce passo a passo:&#160; [10, 20, 30].reduce((acc, atual) =&gt; acc + atual, 0)</text><text x="100" y="64" class="m" font-size="13" fill="#6B7280" text-anchor="middle">início</text><rect x="25" y="82" width="150" height="44" rx="6" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="100" y="108.9" class="m" font-size="14" fill="#1F2937" text-anchor="middle">0</text><text x="100" y="146" class="m" font-size="13.5" font-weight="bold" fill="#D97706" text-anchor="middle">acc = 0</text><line x1="178" y1="104" x2="208" y2="104" stroke="#D97706" stroke-width="2" marker-end="url(#aro)"/><text x="286" y="64" class="m" font-size="13" fill="#6B7280" text-anchor="middle">atual = 10</text><rect x="211" y="82" width="150" height="44" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="286" y="108.9" class="m" font-size="14" fill="#1F2937" text-anchor="middle">0 + 10 = 10</text><text x="286" y="146" class="m" font-size="13.5" font-weight="bold" fill="#D97706" text-anchor="middle">acc = 10</text><line x1="364" y1="104" x2="394" y2="104" stroke="#D97706" stroke-width="2" marker-end="url(#aro)"/><text x="472" y="64" class="m" font-size="13" fill="#6B7280" text-anchor="middle">atual = 20</text><rect x="397" y="82" width="150" height="44" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="472" y="108.9" class="m" font-size="14" fill="#1F2937" text-anchor="middle">10 + 20 = 30</text><text x="472" y="146" class="m" font-size="13.5" font-weight="bold" fill="#D97706" text-anchor="middle">acc = 30</text><line x1="550" y1="104" x2="580" y2="104" stroke="#D97706" stroke-width="2" marker-end="url(#aro)"/><text x="658" y="64" class="m" font-size="13" fill="#6B7280" text-anchor="middle">atual = 30</text><rect x="583" y="82" width="150" height="44" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="658" y="108.9" class="m" font-size="14" fill="#1F2937" text-anchor="middle">30 + 30 = 60</text><text x="658" y="146" class="m" font-size="13.5" font-weight="bold" fill="#D97706" text-anchor="middle">acc = 60</text><rect x="603" y="166" width="110" height="40" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="658" y="192.3" class="m" font-size="18" font-weight="bold" fill="#16A34A" text-anchor="middle">60</text><text x="560" y="192" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="end">resultado final</text><path d="M658,152 L658,164" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/></svg>