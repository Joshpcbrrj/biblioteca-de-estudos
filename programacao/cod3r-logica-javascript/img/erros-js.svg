<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}rect{stroke-width:1.8}</style><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Os 4 tipos de erro que você mais vai encontrar</text><rect x="30" y="55" width="200" height="54" rx="6" class="xR"/><text x="130" y="79" class="m b c">SyntaxError</text><text x="130" y="96" class="s c">código escrito errado</text><text x="260" y="79" class="m" style="font-size:12.5px;white-space:pre">if (x &gt; 1 {</text><text x="260" y="99" class="s">o programa nem começa</text><rect x="30" y="123" width="200" height="54" rx="6" class="xO"/><text x="130" y="147" class="m b c">ReferenceError</text><text x="130" y="164" class="s c">nome que não existe</text><text x="260" y="147" class="m" style="font-size:12.5px;white-space:pre">console.log(totl)</text><text x="260" y="167" class="s">variável digitada errado ou fora do escopo</text><rect x="30" y="191" width="200" height="54" rx="6" class="xP"/><text x="130" y="215" class="m b c">TypeError</text><text x="130" y="232" class="s c">operação no tipo errado</text><text x="260" y="215" class="m" style="font-size:12.5px;white-space:pre">undefined.length</text><text x="260" y="235" class="s">chamar algo que não é função, ler propriedade de undefined</text><rect x="30" y="259" width="200" height="54" rx="6" class="xB"/><text x="130" y="283" class="m b c">Erro de lógica</text><text x="130" y="300" class="s c">roda, mas o resultado está errado</text><text x="260" y="283" class="m" style="font-size:12.5px;white-space:pre">media = n1 + n2 / 2</text><text x="260" y="303" class="s">sem mensagem: descubra com console.log e testes</text><text x="450" y="336" class="n c">Leia a mensagem: ela diz o tipo, o motivo e a linha do erro.</text></svg>