<svg xmlns="http://www.w3.org/2000/svg" width="760" height="256" viewBox="0 0 760 256"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">const frutas = [&quot;maçã&quot;, &quot;banana&quot;, &quot;laranja&quot;];</text><text x="80" y="104" class="m" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">frutas</text><rect x="140" y="76" width="130" height="48" rx="3" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="205" y="105.2" class="m" font-size="15" fill="#1F2937" text-anchor="middle">&quot;maçã&quot;</text><text x="205" y="68" class="m" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="middle">[0]</text><rect x="270" y="76" width="130" height="48" rx="3" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="335" y="105.2" class="m" font-size="15" fill="#1F2937" text-anchor="middle">&quot;banana&quot;</text><text x="335" y="68" class="m" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="middle">[1]</text><rect x="400" y="76" width="130" height="48" rx="3" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="465" y="105.2" class="m" font-size="15" fill="#1F2937" text-anchor="middle">&quot;laranja&quot;</text><text x="465" y="68" class="m" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="middle">[2]</text><rect x="530" y="76" width="130" height="48" rx="3" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.8" stroke-dasharray="5 4"/><text x="595" y="106" class="m" font-size="13" fill="#9CA3AF" text-anchor="middle">undefined</text><text x="595" y="68" class="m" font-size="12.5" fill="#9CA3AF" text-anchor="middle">[3]...</text><line x1="205" y1="170" x2="205" y2="130" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="205" y="188" class="m" font-size="13" fill="#2563EB" text-anchor="middle">frutas[0] → &quot;maçã&quot;</text><text x="205" y="206" font-size="12" fill="#6B7280" text-anchor="middle">primeiro índice é 0</text><line x1="465" y1="170" x2="465" y2="130" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="465" y="188" class="m" font-size="13" fill="#16A34A" text-anchor="middle">frutas[frutas.length - 1]</text><text x="465" y="206" font-size="12" fill="#6B7280" text-anchor="middle">último = length - 1 = 2</text><path d="M140,140 v8 h390 v-8" fill="none" stroke="#D97706" stroke-width="1.8"/><text x="660" y="160" class="m" font-size="14" font-weight="bold" fill="#D97706" text-anchor="end">length = 3</text><text x="380" y="240" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Índice que não existe (frutas[10]) devolve undefined, sem erro.</text></svg>