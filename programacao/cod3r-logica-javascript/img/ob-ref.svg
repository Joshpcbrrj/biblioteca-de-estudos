<svg xmlns="http://www.w3.org/2000/svg" width="760" height="358" viewBox="0 0 760 358"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Objetos também são guardados por referência</text><rect x="30" y="61" width="140" height="38" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="100" y="84.9" class="m" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">original</text><rect x="30" y="121" width="140" height="38" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="100" y="144.9" class="m" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">referencia</text><rect x="30" y="207" width="140" height="38" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="100" y="230.9" class="m" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">copia</text><rect x="420" y="66" width="220" height="104" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="434" y="91" class="m" font-size="14" font-weight="bold" fill="#2563EB">{ }</text><rect x="432" y="104" width="50" height="26" rx="4" fill="#fff" stroke="#2563EB" stroke-width="1.4"/><text x="457" y="122" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">a</text><rect x="488" y="104" width="140" height="26" rx="4" fill="#fff" stroke="#D1D5DB" stroke-width="1.2"/><text x="496" y="122" class="m" font-size="13" fill="#1F2937">100</text><rect x="432" y="136" width="50" height="26" rx="4" fill="#fff" stroke="#2563EB" stroke-width="1.4"/><text x="457" y="154" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">b</text><rect x="488" y="136" width="140" height="26" rx="4" fill="#fff" stroke="#D1D5DB" stroke-width="1.2"/><text x="496" y="154" class="m" font-size="13" fill="#1F2937">2</text><path d="M170,80 L300,80 L300,118 L414,118" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><path d="M170,140 L300,140 L300,126 L414,126" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><rect x="420" y="190" width="220" height="104" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="434" y="215" class="m" font-size="14" font-weight="bold" fill="#16A34A">{ ...original }</text><rect x="432" y="228" width="50" height="26" rx="4" fill="#fff" stroke="#16A34A" stroke-width="1.4"/><text x="457" y="246" class="m" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">a</text><rect x="488" y="228" width="140" height="26" rx="4" fill="#fff" stroke="#D1D5DB" stroke-width="1.2"/><text x="496" y="246" class="m" font-size="13" fill="#1F2937">1</text><rect x="432" y="260" width="50" height="26" rx="4" fill="#fff" stroke="#16A34A" stroke-width="1.4"/><text x="457" y="278" class="m" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">b</text><rect x="488" y="260" width="140" height="26" rx="4" fill="#fff" stroke="#D1D5DB" stroke-width="1.2"/><text x="496" y="278" class="m" font-size="13" fill="#1F2937">2</text><line x1="170" y1="226" x2="414" y2="226" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="380" y="342" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">referencia.a = 100 muda o original; a cópia continua com a = 1.</text><text x="530" y="54" class="m" font-size="12" fill="#2563EB" text-anchor="middle">original === referencia → true</text><text x="530" y="3