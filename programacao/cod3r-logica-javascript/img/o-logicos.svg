<svg xmlns="http://www.w3.org/2000/svg" width="760" height="284" viewBox="0 0 760 284"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="14" fill="#6B7280" text-anchor="middle">A = trabalho 1 recebeu&#160; &#160; &#160; B = trabalho 2 recebeu</text><text x="100" y="58" class="m" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="middle">AND&#160; &amp;&amp;</text><clipPath id="cAand"><circle cx="70" cy="130" r="46"/></clipPath><clipPath id="cBand"><circle cx="130" cy="130" r="46"/></clipPath><circle cx="130" cy="130" r="46" fill="#93C5FD" clip-path="url(#cAand)"/><circle cx="70" cy="130" r="46" fill="none" stroke="#1F2937" stroke-width="1.8"/><circle cx="130" cy="130" r="46" fill="none" stroke="#1F2937" stroke-width="1.8"/><text x="50" y="135" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">A</text><text x="150" y="135" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">B</text><text x="100" y="214" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">os dois</text><text x="100" y="234" font-size="13" fill="#2563EB" text-anchor="middle">→ TV de 50&quot;</text><text x="287" y="58" class="m" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">OR&#160; ||</text><clipPath id="cAor"><circle cx="257" cy="130" r="46"/></clipPath><clipPath id="cBor"><circle cx="317" cy="130" r="46"/></clipPath><circle cx="257" cy="130" r="46" fill="#86EFAC"/><circle cx="317" cy="130" r="46" fill="#86EFAC"/><circle cx="257" cy="130" r="46" fill="none" stroke="#1F2937" stroke-width="1.8"/><circle cx="317" cy="130" r="46" fill="none" stroke="#1F2937" stroke-width="1.8"/><text x="237" y="135" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">A</text><text x="337" y="135" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">B</text><text x="287" y="214" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">pelo menos um</text><text x="287" y="234" font-size="13" fill="#16A34A" text-anchor="middle">→ sorvete</text><text x="474" y="58" class="m" font-size="15" font-weight="bold" fill="#D97706" text-anchor="middle">XOR&#160; !==</text><clipPath id="cAxor"><circle cx="444" cy="130" r="46"/></clipPath><clipPath id="cBxor"><circle cx="504" cy="130" r="46"/></clipPath><circle cx="444" cy="130" r="46" fill="#FCD34D"/><circle cx="504" cy="130" r="46" fill="#FCD34D"/><circle cx="504" cy="130" r="46" fill="#fff" clip-path="url(#cAxor)"/><circle cx="444" cy="130" r="46" fill="none" stroke="#1F2937" stroke-width="1.8"/><circle cx="504" cy="130" r="46" fill="none" stroke="#1F2937" stroke-width="1.8"/><text x="424" y="135" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">A</text><text x="524" y="135" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">B</text><text x="474" y="214" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">só um deles</text><text x="474" y="234" font-size="13" fill="#D97706" text-anchor="middle">→ TV de 32&quot;</text><text x="661" y="58" class="m" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="middle">NOT&#160; !</text><rect x="581" y="72" width="160" height="116" rx="8" fill="#C4B5FD"/><circle cx="661" cy="130" r="46" fill="#fff"/><circle cx="661" cy="130" r="46" fill="none" stroke="#1F2937" stroke-width="1.8"/><text x="661" y="135" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">A</text><text x="661" y="214" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">inverte</text><text x="661" y="234" font-size="13" fill="#7C3AED" text-anchor="middle">→ fica em casa</text><text x="380" y="268" font-size="12.5" font-style="italic" fill="#6B7280" text-anchor="middle">Área colorida = situações em que o resultado é true.&#160; NOT: true quando A é false.</text></svg>