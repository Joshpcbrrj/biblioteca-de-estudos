<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.s{font-size:11.5px;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xP{fill:#EDE9FE;stroke:#7C3AED}.xY{fill:#F3F4F6;stroke:#9CA3AF}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Todo algoritmo segue o mesmo esqueleto</text><rect x="40" y="60" width="230" height="90" rx="6" class="xB"/><text x="155" y="102" class="b c">Entrada</text><text x="155" y="119" class="s c">dados que o programa recebe</text><rect x="335" y="60" width="230" height="90" rx="6" class="xP"/><text x="450" y="102" class="b c">Processamento</text><text x="450" y="119" class="s c">cálculos e decisões</text><rect x="630" y="60" width="230" height="90" rx="6" class="xG"/><text x="745" y="102" class="b c">Saída</text><text x="745" y="119" class="s c">resultado mostrado ao usuário</text><path d="M270,105L335,105" class="l" marker-end="url(#a)"/><path d="M565,105L630,105" class="l" marker-end="url(#a)"/><text x="155" y="180" class="b c">Exemplo: média de 2 notas</text><text x="70" y="204" class="m" style="font-size:12px;white-space:pre">nota1 = 8</text><text x="70" y="222" class="m" style="font-size:12px;white-space:pre">nota2 = 6</text><text x="450" y="180" class="b c">Exemplo</text><text x="365" y="204" class="m" style="font-size:12px;white-space:pre">media = (nota1 + nota2) / 2</text><text x="365" y="222" class="m" style="font-size:12px;white-space:pre">se media &gt;= 7 → aprovado</text><text x="745" y="180" class="b c">Exemplo</text><text x="660" y="204" class="m" style="font-size:12px;white-space:pre">&quot;Média 7: aprovado&quot;</text><rect x="40" y="250" width="820" height="60" rx="6" class="xY"/><text x="450" y="274" class="b c">Algoritmo = sequência finita e ordenada de passos que resolve um problema.</text><text x="450" y="294" class="s c">Programa = algoritmo escrito em uma linguagem que o computador entende (aqui, JavaScript).</text></svg>