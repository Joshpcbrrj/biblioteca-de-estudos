<svg xmlns="http://www.w3.org/2000/svg" width="760" height="306" viewBox="0 0 760 306"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Callback: uma função passada como argumento</text><text x="40" y="66" class="m" font-size="16" fill="#1F2937" xml:space="preserve">calcular(10, 5, (x, y) =&gt; x * y)</text><rect x="380" y="92" width="360" height="168" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="398" y="116" class="m" font-size="13.5" font-weight="bold" fill="#2563EB">function calcular(a, b, operacao)</text><rect x="410" y="135" width="80" height="34" rx="6" fill="#fff" stroke="#2563EB" stroke-width="1.8"/><text x="450" y="156.6" class="m" font-size="13" fill="#1F2937" text-anchor="middle">a = 10</text><rect x="510" y="135" width="80" height="34" rx="6" fill="#fff" stroke="#2563EB" stroke-width="1.8"/><text x="550" y="156.6" class="m" font-size="13" fill="#1F2937" text-anchor="middle">b = 5</text><rect x="600" y="135" width="120" height="34" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="660" y="156.6" class="m" font-size="13" fill="#D97706" text-anchor="middle">operacao</text><text x="560" y="214" class="m" font-size="14" fill="#1F2937" text-anchor="middle">return operacao(a, b)</text><text x="560" y="240" class="m" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">→ (10, 5) =&gt; 10 * 5 → 50</text><rect x="40" y="110" width="200" height="46" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="140" y="139" class="m" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">(x, y) =&gt; x * y</text><text x="140" y="176" font-size="12" fill="#6B7280" text-anchor="middle">a função vai inteira,</text><text x="140" y="192" font-size="12" fill="#6B7280" text-anchor="middle">sem ser executada</text><path d="M240,133 C330,133 560,100 660,134" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#aro)"/><rect x="70" y="219" width="140" height="38" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="140" y="243.9" class="m" font-size="17" font-weight="bold" fill="#16A34A" text-anchor="middle">50</text><path d="M380,240 L212,240" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="296" y="230" font-size="12" font-weight="bold" fill="#16A34A" text-anchor="middle">retorno</text><text x="380" y="290" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">executar(dizerOla) passa a função;&#160; executar(dizerOla()) passa o retorno dela.</text></svg>