<svg xmlns="http://www.w3.org/2000/svg" width="760" height="278" viewBox="0 0 760 278"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Coerção: o JavaScript converte tipos sozinho em algumas operações</text><rect x="40" y="55" width="160" height="42" rx="6" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="120" y="81.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">&quot;5&quot; + 2</text><line x1="204" y1="76" x2="262" y2="76" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><rect x="266" y="55" width="100" height="42" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="316" y="82.3" class="m" font-size="18" font-weight="bold" fill="#16A34A" text-anchor="middle">&quot;52&quot;</text><text x="386" y="81" font-size="13.5" fill="#1F2937">com uma string, + concatena (vira texto)</text><rect x="40" y="119" width="160" height="42" rx="6" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="120" y="145.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">&quot;5&quot; - 2</text><line x1="204" y1="140" x2="262" y2="140" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><rect x="266" y="119" width="100" height="42" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="316" y="146.3" class="m" font-size="18" font-weight="bold" fill="#2563EB" text-anchor="middle">3</text><text x="386" y="145" font-size="13.5" fill="#1F2937">- só faz conta: converte &quot;5&quot; para número</text><rect x="40" y="183" width="160" height="42" rx="6" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="120" y="209.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">&quot;5&quot; * &quot;2&quot;</text><line x1="204" y1="204" x2="262" y2="204" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><rect x="266" y="183" width="100" height="42" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="316" y="210.3" class="m" font-size="18" font-weight="bold" fill="#2563EB" text-anchor="middle">10</text><text x="386" y="209" font-size="13.5" fill="#1F2937">* também converte para número</text><text x="380" y="262" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Prefira converter de forma explícita: Number(&quot;5&quot;) + 2 → 7</text></svg>