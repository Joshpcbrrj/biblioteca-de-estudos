<svg xmlns="http://www.w3.org/2000/svg" width="760" height="274" viewBox="0 0 760 274"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="20" width="355" height="210" rx="12" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="197" y="50" class="m" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">++a&#160; (prefixo)</text><circle cx="60" cy="94" r="16" fill="#2563EB"/><text x="60" y="99" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1º</text><text x="88" y="99" font-size="15" font-weight="bold" fill="#1F2937">incrementa</text><rect x="212" y="76" width="140" height="36" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="282" y="98.9" class="m" font-size="14" fill="#1F2937" text-anchor="middle">a: 5 → 6</text><line x1="60" y1="112" x2="60" y2="130" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><circle cx="60" cy="152" r="16" fill="#2563EB"/><text x="60" y="157" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2º</text><text x="88" y="157" font-size="15" font-weight="bold" fill="#1F2937">devolve</text><rect x="212" y="134" width="140" height="36" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="282" y="156.9" class="m" font-size="14" fill="#1F2937" text-anchor="middle">6</text><text x="197" y="210" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">console.log(++a) → 6</text><rect x="395" y="20" width="355" height="210" rx="12" fill="#fff" stroke="#D97706" stroke-width="2"/><text x="572" y="50" class="m" font-size="16" font-weight="bold" fill="#D97706" text-anchor="middle">a++&#160; (sufixo)</text><circle cx="435" cy="94" r="16" fill="#D97706"/><text x="435" y="99" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1º</text><text x="463" y="99" font-size="15" font-weight="bold" fill="#1F2937">devolve</text><rect x="587" y="76" width="140" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="657" y="98.9" class="m" font-size="14" fill="#1F2937" text-anchor="middle">5</text><line x1="435" y1="112" x2="435" y2="130" stroke="#D97706" stroke-width="2" marker-end="url(#aro)"/><circle cx="435" cy="152" r="16" fill="#D97706"/><text x="435" y="157" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2º</text><text x="463" y="157" font-size="15" font-weight="bold" fill="#1F2937">incrementa</text><rect x="587" y="134" width="140" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="657" y="156.9" class="m" font-size="14" fill="#1F2937" text-anchor="middle">a: 5 → 6</text><text x="572" y="210" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">console.log(a++) → 5</text><text x="380" y="258" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Nos dois casos a variável termina valendo 6; muda só o valor que a expressão devolve.</text></svg>