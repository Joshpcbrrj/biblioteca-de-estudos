<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomia do for</text><text x="148.8" y="67" class="m" font-size="16" fill="#1F2937">for (</text><rect x="194" y="46" width="92.7" height="30" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="197" y="67" class="m" font-size="16" fill="#1F2937">let i = 1</text><text x="283.7" y="67" class="m" font-size="16" fill="#1F2937">;</text><rect x="299.9" y="46" width="63.8" height="30" rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="302.9" y="67" class="m" font-size="16" fill="#1F2937">i &lt;= 5</text><text x="360.7" y="67" class="m" font-size="16" fill="#1F2937">;</text><rect x="377" y="46" width="34.9" height="30" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="380" y="67" class="m" font-size="16" fill="#1F2937">i++</text><text x="408.9" y="67" class="m" font-size="16" fill="#1F2937">) {</text><rect x="444.4" y="46" width="150.5" height="30" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="447.4" y="67" class="m" font-size="16" fill="#1F2937">console.log(i);</text><text x="601.5" y="67" class="m" font-size="16" fill="#1F2937">}</text><rect x="28" y="170" width="164" height="60" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="110" y="194" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">1&#160; inicialização</text><text x="110" y="215" font-size="11.5" fill="#1F2937" text-anchor="middle">roda uma vez, no começo</text><line x1="240.3" y1="78" x2="110" y2="168" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arb)"/><rect x="218" y="170" width="164" height="60" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="300" y="194" font-size="14" font-weight="bold" fill="#7C3AED" text-anchor="middle">2&#160; condição</text><text x="300" y="215" font-size="11.5" fill="#1F2937" text-anchor="middle">testada antes de cada volta</text><line x1="331.8" y1="78" x2="300" y2="168" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arp)"/><rect x="408" y="170" width="164" height="60" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="490" y="194" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">3&#160; corpo</text><text x="490" y="215" font-size="11.5" fill="#1F2937" text-anchor="middle">executa se a condição for true</text><line x1="519.7" y1="78" x2="490" y2="168" stroke="#16A34A" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arv)"/><rect x="408" y="266" width="164" height="60" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="490" y="290" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">4&#160; atualização</text><text x="490" y="311" font-size="11.5" fill="#1F2937" text-anchor="middle">roda ao fim de cada volta</text><path d="M394.4,78 L394.4,120 L620,120 L620,296 L576,296" fill="none" stroke="#D97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#aro)"/><line x1="194" y1="200" x2="216" y2="200" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><line x1="384" y1="200" x2="406" y2="200" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><text x="395" y="192" font-size="11.5" font-weight="bold" fill="#16A34A" text-anchor="middle">true</text><line x1="490" y1="232" x2="490" y2="264" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><path d="M406,296 L330,296 L330,232" fill="none" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><path d="M262,232 L262,300 L194,300" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arr)"/><rect x="108" y="285" width="84" height="30" rx="15" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="150" y="304.6" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">fim</text><text x="272" y="270" font-size="12" font-weight="bold" fill="#DC2626">false</text><text x="380" y="340" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Saída: 1 2 3 4 5&#160;&#160; (5 voltas; na 6ª, i vale 6 e a condição é false)</text></svg>