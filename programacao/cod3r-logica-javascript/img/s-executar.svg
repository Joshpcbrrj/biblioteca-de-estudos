<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" viewBox="0 0 760 366"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="20" width="330" height="150" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><path d="M28,21 h314 a7,7 0 0 1 7,7 v18 h-328 v-18 a7,7 0 0 1 7,-7 z" fill="#E5E7EB"/><circle cx="36" cy="34" r="4.5" fill="#EF4444"/><circle cx="51" cy="34" r="4.5" fill="#F59E0B"/><circle cx="66" cy="34" r="4.5" fill="#22C55E"/><text x="185" y="38" font-size="12" fill="#6B7280" text-anchor="middle">ola.js — VS Code</text><text x="36" y="78" class="m" font-size="13.5" fill="#6B7280" xml:space="preserve">1</text><text x="64" y="78" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">console.log(&quot;Olá, mundo!&quot;);</text><text x="185" y="140" font-size="12.5" font-style="italic" fill="#6B7280" text-anchor="middle">1. escreva e salve (Ctrl + S)</text><line x1="356" y1="95" x2="404" y2="95" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><rect x="410" y="20" width="330" height="150" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><path d="M418,21 h314 a7,7 0 0 1 7,7 v18 h-328 v-18 a7,7 0 0 1 7,-7 z" fill="#111827"/><circle cx="426" cy="34" r="4.5" fill="#EF4444"/><circle cx="441" cy="34" r="4.5" fill="#F59E0B"/><circle cx="456" cy="34" r="4.5" fill="#22C55E"/><text x="575" y="38" font-size="12" fill="#D1D5DB" text-anchor="middle">Terminal</text><text x="426" y="72" class="m" font-size="13.5" fill="#93C5FD" xml:space="preserve">$ node ola.js</text><text x="426" y="92.9" class="m" font-size="13.5" fill="#F9FAFB" xml:space="preserve">Olá, mundo!</text><text x="575" y="140" font-size="12.5" font-style="italic" fill="#D1D5DB" text-anchor="middle">2. execute com node</text><rect x="410" y="196" width="330" height="150" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/><path d="M418,197 h314 a7,7 0 0 1 7,7 v18 h-328 v-18 a7,7 0 0 1 7,-7 z" fill="#111827"/><circle cx="426" cy="210" r="4.5" fill="#EF4444"/><circle cx="441" cy="210" r="4.5" fill="#F59E0B"/><circle cx="456" cy="210" r="4.5" fill="#22C55E"/><text x="575" y="214" font-size="12" fill="#D1D5DB" text-anchor="middle">Terminal — REPL (modo interativo)</text><text x="426" y="248" class="m" font-size="13.5" fill="#93C5FD" xml:space="preserve">$ node</text><text x="426" y="268.9" class="m" font-size="13.5" fill="#F9FAFB" xml:space="preserve">&gt; 2 + 3</text><text x="426" y="289.9" class="m" font-size="13.5" fill="#86EFAC" xml:space="preserve">5</text><text x="426" y="310.8" class="m" font-size="13.5" fill="#F9FAFB" xml:space="preserve">&gt;</text><text x="36" y="240" font-size="13.5" font-weight="bold" fill="#1F2937">Para testar uma linha solta:</text><text x="36" y="266" font-size="13" fill="#1F2937">digite só&#160; node&#160; no terminal,</text><text x="36" y="288" font-size="13" fill="#1F2937">escreva a expressão e veja</text><text x="36" y="310" font-size="13" fill="#1F2937">o resultado na hora.</text><text x="36" y="334" font-size="13" font-style="italic" fill="#6B7280">Sair: Ctrl + C duas vezes.</text><line x1="300" y1="270" x2="404" y2="270" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/></svg>