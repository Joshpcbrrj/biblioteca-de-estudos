<svg xmlns="http://www.w3.org/2000/svg" width="760" height="294" viewBox="0 0 760 294"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Da função tradicional à arrow function</text><rect x="40" y="44" width="420" height="42" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/><text x="56" y="72" class="m" font-size="16" fill="#DC2626" xml:space="preserve">function</text><text x="142.7" y="72" class="m" font-size="16" fill="#1F2937" xml:space="preserve">(a, b) { return a + b; }</text><line x1="56" y1="66" x2="134.7" y2="66" stroke="#DC2626" stroke-width="2"/><text x="476" y="72" font-size="12.5" fill="#6B7280">tradicional</text><line x1="250" y1="90" x2="250" y2="120" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arg)"/><rect x="40" y="126" width="420" height="42" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/><text x="56" y="154" class="m" font-size="16" fill="#1F2937" xml:space="preserve">(a, b)</text><text x="123.4" y="154" class="m" font-size="16" fill="#16A34A" xml:space="preserve">=&gt;</text><text x="152.3" y="154" class="m" font-size="16" fill="#1F2937" xml:space="preserve">{ return a + b; }</text><text x="476" y="154" font-size="12.5" fill="#1F2937">troca function por =&gt; (depois dos parâmetros)</text><line x1="250" y1="172" x2="250" y2="202" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arg)"/><rect x="40" y="208" width="420" height="42" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="56" y="236" class="m" font-size="16" fill="#1F2937" xml:space="preserve">(a, b) =&gt;</text><text x="152.3" y="236" class="m" font-size="16" fill="#16A34A" xml:space="preserve">a + b</text><text x="476" y="236" font-size="12.5" fill="#1F2937">uma só expressão: sem { } e sem return</text><text x="380" y="276" class="m" font-size="13.5" fill="#6B7280" text-anchor="middle">n =&gt; n * 2&#160; &#160; () =&gt; &quot;Olá!&quot;&#160; &#160; (x, y) =&gt; ({ x, y })</text></svg>