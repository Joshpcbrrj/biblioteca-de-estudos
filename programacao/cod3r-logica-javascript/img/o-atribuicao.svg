<svg xmlns="http://www.w3.org/2000/svg" width="760" height="192" viewBox="0 0 760 192"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Operadores de atribuição: a variável é atualizada a partir dela mesma</text><rect x="28" y="70" width="64" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="60" y="98.3" class="m" font-size="18" font-weight="bold" fill="#2563EB" text-anchor="middle">10</text><line x1="96" y1="92" x2="150" y2="92" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><text x="124" y="72" class="m" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">x += 5</text><rect x="156" y="70" width="64" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="188" y="98.3" class="m" font-size="18" font-weight="bold" fill="#2563EB" text-anchor="middle">15</text><line x1="224" y1="92" x2="278" y2="92" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><text x="252" y="72" class="m" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">x *= 2</text><rect x="284" y="70" width="64" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="316" y="98.3" class="m" font-size="18" font-weight="bold" fill="#2563EB" text-anchor="middle">30</text><line x1="352" y1="92" x2="406" y2="92" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><text x="380" y="72" class="m" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">x -= 10</text><rect x="412" y="70" width="64" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="444" y="98.3" class="m" font-size="18" font-weight="bold" fill="#2563EB" text-anchor="middle">20</text><line x1="480" y1="92" x2="534" y2="92" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><text x="508" y="72" class="m" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">x /= 4</text><rect x="540" y="70" width="64" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="572" y="98.3" class="m" font-size="18" font-weight="bold" fill="#2563EB" text-anchor="middle">5</text><line x1="608" y1="92" x2="662" y2="92" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><text x="636" y="72" class="m" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">x %= 3</text><rect x="668" y="70" width="64" height="44" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="700" y="98.3" class="m" font-size="18" font-weight="bold" fill="#16A34A" text-anchor="middle">2</text><text x="60" y="136" class="m" font-size="12" fill="#6B7280" text-anchor="middle">let x = 10</text><text x="380" y="172" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">x += 5&#160; é o mesmo que&#160; x = x + 5&#160;&#160; (vale para -, *, /, %, **)</text></svg>