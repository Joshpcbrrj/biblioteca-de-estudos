<svg xmlns="http://www.w3.org/2000/svg" width="760" height="288" viewBox="0 0 760 288"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Resto da divisão:&#160; 10 % 3 = 1</text><rect x="48" y="52" width="128" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><circle cx="74" cy="80" r="14" fill="#2563EB"/><circle cx="114" cy="80" r="14" fill="#2563EB"/><circle cx="154" cy="80" r="14" fill="#2563EB"/><text x="114" y="128" font-size="12" fill="#2563EB" text-anchor="middle">grupo 1</text><rect x="198" y="52" width="128" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><circle cx="224" cy="80" r="14" fill="#2563EB"/><circle cx="264" cy="80" r="14" fill="#2563EB"/><circle cx="304" cy="80" r="14" fill="#2563EB"/><text x="264" y="128" font-size="12" fill="#2563EB" text-anchor="middle">grupo 2</text><rect x="348" y="52" width="128" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><circle cx="374" cy="80" r="14" fill="#2563EB"/><circle cx="414" cy="80" r="14" fill="#2563EB"/><circle cx="454" cy="80" r="14" fill="#2563EB"/><text x="414" y="128" font-size="12" fill="#2563EB" text-anchor="middle">grupo 3</text><rect x="498" y="52" width="56" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><circle cx="526" cy="80" r="14" fill="#D97706"/><text x="526" y="128" font-size="12" font-weight="bold" fill="#D97706" text-anchor="middle">sobra</text><text x="380" y="168" class="m" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">10 = 3 × 3 + 1</text><text x="240" y="198" class="m" font-size="13" fill="#2563EB" text-anchor="middle">Math.floor(10 / 3) → 3&#160; (grupos)</text><text x="560" y="198" class="m" font-size="13" fill="#D97706" text-anchor="middle">10 % 3 → 1&#160; (o que sobra)</text><rect x="60" y="220" width="640" height="50" rx="8" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/><text x="380" y="251" class="m" font-size="13" fill="#1F2937" text-anchor="middle">n % 2 === 0 → par&#160; &#160; &#160; n % 2 === 1 → ímpar&#160; &#160; &#160; n % 5 === 0 → múltiplo de 5</text></svg>