<svg xmlns="http://www.w3.org/2000/svg" width="760" height="282" viewBox="0 0 760 282"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="28" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Template string: crase + ${ } para encaixar valores no texto</text><rect x="30" y="50" width="700" height="44" rx="8" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5"/><text x="40" y="78" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">`Olá, meu nome é ${nome} e tenho ${idade} anos.`</text><rect x="175.7" y="58" width="60.7" height="28" rx="4" fill="none" stroke="#2563EB" stroke-width="2.2"/><line x1="204" y1="90" x2="204" y2="128" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><rect x="159" y="130" width="90" height="32" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="204" y="150.9" class="m" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">&quot;Alice&quot;</text><line x1="204" y1="162" x2="204" y2="196" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><rect x="305.3" y="58" width="68.8" height="28" rx="4" fill="none" stroke="#16A34A" stroke-width="2.2"/><line x1="337.7" y1="90" x2="337.7" y2="128" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><rect x="292.7" y="130" width="90" height="32" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="337.7" y="150.9" class="m" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">30</text><line x1="337.7" y1="162" x2="337.7" y2="196" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><rect x="110" y="200" width="540" height="40" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="380" y="226" class="m" font-size="15" fill="#1F2937" text-anchor="middle">Olá, meu nome é Alice e tenho 30 anos.</text><text x="380" y="266" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Dentro de ${ } cabe qualquer expressão: ${idade + 5} → 35</text></svg>