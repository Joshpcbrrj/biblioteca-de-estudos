<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" viewBox="0 0 760 296"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="20" width="355" height="230" rx="12" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="39.3" y="32.5" width="41.4" height="23" rx="11.5" fill="#D97706" stroke="#D97706" stroke-width="1.5"/><text x="60" y="48.7" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">var</text><text x="98" y="49" font-size="12.5" fill="#6B7280">escopo da função / arquivo</text><rect x="40" y="66" width="315" height="76" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="54" y="86" class="m" font-size="13" fill="#6B7280">if (true) {</text><text x="66" y="110" class="m" font-size="13" fill="#1F2937" xml:space="preserve">var dentroDoIf = &quot;vazou&quot;;</text><text x="54" y="132" class="m" font-size="13" fill="#6B7280">}</text><path d="M320,142 C320,170 280,176 250,186" fill="none" stroke="#D97706" stroke-width="2.2" marker-end="url(#aro)"/><text x="200" y="200" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">a var escapa do bloco</text><text x="50" y="232" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">console.log(dentroDoIf) → &quot;vazou&quot;</text><rect x="395" y="20" width="355" height="230" rx="12" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="414.3" y="32.5" width="41.4" height="23" rx="11.5" fill="#16A34A" stroke="#16A34A" stroke-width="1.5"/><text x="435" y="48.7" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">let</text><text x="473" y="49" font-size="12.5" fill="#6B7280">escopo da função / arquivo</text><rect x="415" y="66" width="315" height="76" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="429" y="86" class="m" font-size="13" fill="#6B7280">if (true) {</text><text x="441" y="110" class="m" font-size="13" fill="#1F2937" xml:space="preserve">let soNoBloco = &quot;não vaza&quot;;</text><text x="429" y="132" class="m" font-size="13" fill="#6B7280">}</text><line x1="455" y1="160" x2="695" y2="160" stroke="#DC2626" stroke-width="3" stroke-dasharray="8 5"/><text x="575" y="185" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">a let fica presa no bloco</text><text x="425" y="232" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">typeof soNoBloco → &quot;undefined&quot;</text><text x="380" y="280" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Hoisting:&#160; console.log(x) antes de&#160; var x = 5&#160; → undefined;&#160; com let/const → ReferenceError</text></svg>