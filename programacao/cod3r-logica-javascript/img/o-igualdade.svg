text x="110" y="201.2" class="m" font-size="15" fill="#1F2937" text-anchor="middle">7</text><text x="197" y="242" class="m" font-size="15" font-weight="bold" fill="#D97706" text-anchor="middle">→ true</text><rect x="385" y="46" width="355" height="210" rx="12" fill="#fff" stroke="#16A34A" stroke-width="2"/><text x="562" y="74" class="m" font-size="17" font-weight="bold" fill="#16A34A" text-anchor="middle">7 === &quot;7&quot;</text><rect x="440" y="98" width="70" height="36" rx="6" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="475" y="121.2" class="m" font-size="15" fill="#1F2937" text-anchor="middle">7</text><rect x="615" y="98" width="70" height="36" rx="6" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="650" y="121.2" class="m" font-size="15" fill="#1F2937" text-anchor="middle">&quot;7&quot;</text><text x="475" y="146" font-size="11.5" fill="#6B7280" text-anchor="middle">number</text><text x="650" y="146" font-size="11.5" fill="#6B7280" text-anchor="middle">string</text><text x="562" y="190" font-size="14" fill="#1F2937" text-anchor="middle">tipos diferentes</text><text x="562" y="210" font-size="12.5" font-style="italic" fill="#6B7280" text-anchor="middle">nem compara o valor</text><text x="562" y="242" class="m" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">→ false</text><text x="380" y="282" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Use sempre === e !==: evita surpresas como 0 == &quot;&quot; → true.</text></svg>