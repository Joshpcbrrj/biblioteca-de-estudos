<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" viewBox="0 0 760 296"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomia de uma função</text><text x="70" y="100" class="m" font-size="16" fill="#7C3AED" xml:space="preserve">function</text><text x="156.7" y="100" class="m" font-size="16" fill="#2563EB" xml:space="preserve">somar</text><text x="204.8" y="100" class="m" font-size="16" fill="#D97706" xml:space="preserve">(a, b)</text><text x="272.2" y="100" class="m" font-size="16" fill="#1F2937" xml:space="preserve">{</text><text x="89.3" y="128" class="m" font-size="16" fill="#1F2937" xml:space="preserve">return a + b;</text><text x="70" y="156" class="m" font-size="16" fill="#1F2937" xml:space="preserve">}</text><rect x="64" y="110" width="260" height="26" rx="4" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-dasharray="4 3"/><line x1="108.5" y1="58" x2="108.5" y2="82" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arp)"/><text x="108.5" y="52" font-size="12.5" font-weight="bold" fill="#7C3AED" text-anchor="middle">palavra-chave</text><line x1="180.8" y1="58" x2="180.8" y2="82" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arb)"/><text x="180.8" y="52" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="middle">nome</text><line x1="233.7" y1="58" x2="233.7" y2="82" stroke="#D97706" stroke-width="1.5" marker-end="url(#aro)"/><text x="233.7" y="52" font-size="12.5" font-weight="bold" fill="#D97706" text-anchor="middle">parâmetros</text><text x="334" y="128" font-size="12.5" font-weight="bold" fill="#16A34A">← corpo: return devolve o resultado</text><text x="70" y="230" class="m" font-size="16" fill="#1F2937" xml:space="preserve">const resultado =</text><text x="243.4" y="230" class="m" font-size="16" fill="#2563EB" xml:space="preserve">somar</text><text x="291.5" y="230" class="m" font-size="16" fill="#DC2626" xml:space="preserve">(2, 3)</text><text x="349.3" y="230" class="m" font-size="16" fill="#1F2937" xml:space="preserve">;</text><line x1="320.4" y1="240" x2="320.4" y2="262" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr)"/><text x="320.4" y="278" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">argumentos</text><path d="M306,212 C311.5,180 234.8,150 219.3,106" fill="none" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/><path d="M334.9,212 C351.5,180 274.8,150 248.2,106" fill="none" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/><rect x="470" y="190" width="260" height="80" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="600" y="218" class="m" font-size="14" fill="#1F2937" text-anchor="middle">somar(2, 3)</text><text x="600" y="244" class="m" font-size="13" fill="#6B7280" text-anchor="middle">a = 2, b = 3 → 2 + 3</text><text x="600" y="264" class="m" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">resultado = 5</text></svg>