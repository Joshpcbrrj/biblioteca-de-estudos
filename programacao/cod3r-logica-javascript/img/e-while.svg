<svg xmlns="http://www.w3.org/2000/svg" width="646" height="358" viewBox="0 0 646 358"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.k{font-weight:bold}.lb{font-size:11.5px;font-style:italic;fill:#6B7280}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.if{fill:#FCE7F3;stroke:#DB2777;stroke-width:2}.lp{fill:#EDE9FE;stroke:#7C3AED;stroke-width:2}.cl{fill:#E0F2FE;stroke:#0284C7;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g transform="translate(171.7,0)"><rect class="as" x="76" y="14" width="147.6" height="48" rx="3"/><text class="t" x="89" y="34" text-anchor="start" xml:space="preserve">let saldo = 100;</text><text class="t" x="89" y="50" text-anchor="start" xml:space="preserve">let meses = 0;</text><path class="e" d="M149.8,62 L149.8,84" marker-end="url(#a)"/><path class="lp" d="M68.6,84 L231,84 L245,101 L231,118 L68.6,118 L54.6,101 Z"/><text class="t" x="149.8" y="105" text-anchor="middle">while (saldo &lt; 200)</text><path class="e" d="M149.8,118 L149.8,142" marker-end="url(#a)"/><text class="lb" x="154.8" y="133" text-anchor="start">Verdadeiro</text><rect class="as" x="87.4" y="142" width="124.8" height="32" rx="3"/><text class="t" x="149.8" y="162" text-anchor="middle" xml:space="preserve">saldo *= 1.1;</text><path class="e" d="M149.8,174 L149.8,196" marker-end="url(#a)"/><rect class="as" x="106.4" y="196" width="86.8" height="32" rx="3"/><text class="t" x="149.8" y="216" text-anchor="middle" xml:space="preserve">meses++;</text><path class="e" d="M149.8,228 L149.8,240 L28.6,240 L28.6,101 L54.6,101" marker-end="url(#a)"/><path class="e" d="M245,101 L275,101 L275,260 L149.8,260"/><text class="lb" x="249" y="96" text-anchor="start">Falso</text><circle cx="149.8" cy="260" r="4" fill="#4B5563"/><path class="e" d="M149.8,264 L149.8,286" marker-end="url(#a)"/><path class="ou" d="M38,286 L275.6,286 L261.6,318 L24,318 Z"/><text class="t" x="149.8" y="306" text-anchor="middle" xml:space="preserve">`Dobrou em ${meses} meses`</text></g><text x="323.2" y="340" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">A condição é testada antes de cada volta; o número de voltas não é conhecido de antemão.</text></svg>