<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="20" width="720" height="250" rx="12" fill="#F9FAFB" stroke="#2563EB" stroke-width="2"/><text x="40" y="46" font-size="14" font-weight="bold" fill="#2563EB">escopo externo</text><rect x="50" y="66" width="160" height="36" rx="6" fill="#fff" stroke="#2563EB" stroke-width="1.8"/><text x="130" y="88.9" class="m" font-size="14" fill="#1F2937" text-anchor="middle">taxa = 0.1</text><rect x="300" y="60" width="420" height="150" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="318" y="84" class="m" font-size="13.5" font-weight="bold" fill="#7C3AED">function calcularImposto(valor)</text><rect x="330" y="107" width="140" height="34" rx="6" fill="#fff" stroke="#7C3AED" stroke-width="1.8"/><text x="400" y="128.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">valor = 200</text><rect x="515" y="107" width="170" height="34" rx="6" fill="#fff" stroke="#7C3AED" stroke-width="1.8"/><text x="600" y="128.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">imposto = 20</text><text x="510" y="190" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">imposto = valor * taxa</text><path d="M440,182 C330,182 230,150 170,104" fill="none" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arv)"/><text x="250" y="158" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="end">✓ de dentro enxerga fora</text><text x="40" y="236" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">typeof imposto&#160; → &quot;undefined&quot;</text><text x="330" y="236" font-size="12.5" font-weight="bold" fill="#DC2626">✗ de fora não enxerga as variáveis da função</text><path d="M330,220 C420,226 520,200 590,144" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/></svg>