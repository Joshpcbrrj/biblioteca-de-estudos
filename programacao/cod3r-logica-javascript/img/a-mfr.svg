="#1F2937" text-anchor="middle">6</text><line x1="348" y1="160" x2="380" y2="160" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><rect x="384" y="140" width="158" height="40" rx="20" fill="#fff" stroke="#16A34A" stroke-width="2"/><text x="463" y="165" class="m" font-size="13.5" fill="#16A34A" text-anchor="middle">n =&gt; n % 2 === 0</text><line x1="546" y1="160" x2="578" y2="160" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><rect x="584" y="142" width="40" height="36" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="604" y="164.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">2</text><rect x="624" y="142" width="40" height="36" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="644" y="164.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">4</text><rect x="664" y="142" width="40" height="36" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="684" y="164.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">6</text><text x="20" y="200" font-size="12.5" font-style="italic" fill="#6B7280">só ficam os itens em que o callback devolve true</text><text x="20" y="254" class="m" font-size="16" font-weight="bold" fill="#D97706">reduce</text><rect x="100" y="232" width="40" height="36" rx="3" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="120" y="254.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">10</text><rect x="140" y="232" width="40" height="36" rx="3" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="160" y="254.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">20</text><rect x="180" y="232" width="40" height="36" rx="3" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="200" y="254.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">30</text><line x1="228" y1="250" x2="260" y2="250" stroke="#D97706" stroke-width="2" marker-end="url(#aro)"/><rect x="264" y="230" width="182.4" hei