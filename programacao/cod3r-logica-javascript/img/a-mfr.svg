<svg xmlns="http://www.w3.org/2000/svg" width="760" height="306" viewBox="0 0 760 306"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">map, filter e reduce devolvem um resultado novo (o original não muda)</text><text x="20" y="74" class="m" font-size="16" font-weight="bold" fill="#2563EB">map</text><rect x="100" y="52" width="40" height="36" rx="3" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="120" y="74.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">10</text><rect x="140" y="52" width="40" height="36" rx="3" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="160" y="74.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">20</text><rect x="180" y="52" width="40" height="36" rx="3" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="200" y="74.7" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">30</text><line x1="228" y1="70" x2="260" y2="70" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><rect x="264" y="50" width="109.3" height="40" rx="20" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="318.6" y="75" class="m" font-size="13.5" fill="#2563EB" text-anchor="middle">p =&gt; p + 5</text><line x1="377.3" y1="70" x2="409.3" y2="70" stroke="#256