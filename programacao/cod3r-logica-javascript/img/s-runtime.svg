<svg xmlns="http://www.w3.org/2000/svg" width="760" height="318" viewBox="0 0 760 318"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="28" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">O mesmo motor (V8) executa JavaScript em dois lugares</text><text x="20" y="116" font-size="14" font-weight="bold" fill="#2563EB">No navegador</text><rect x="140" y="80" width="160" height="70" rx="8" fill="#fff" stroke="#1F2937" stroke-width="1.5"/><text x="220" y="111" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">página .html</text><text x="220" y="131" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">+ script .js</text><line x1="304" y1="115" x2="356" y2="115" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><rect x="360" y="80" width="150" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="435" y="111" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="middle">Chrome</text><text x="435" y="132" font-size="12.5" fill="#6B7280" text-anchor="middle">motor V8</text><line x1="514" y1="115" x2="566" y2="115" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><rect x="570" y="80" width="170" height="70" rx="8" fill="#fff" stroke="#1F2937" stroke-width="1.5"/><text x="655" y="111" font-size="13" fill="#1F2937" text-anchor="middle">resultado na página</text><text x="655" y="131" font-size="13" fill="#1F2937" text-anchor="middle">e no console (F12)</text><text x="20" y="236" font-size="14" font-weight="bold" fill="#16A34A">Com Node.js</text><rect x="140" y="200" width="160" height="70" rx="8" fill="#fff" stroke="#1F2937" stroke-width="1.5"/><text x="220" y="231" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">arquivo</text><text x="220" y="251" class="m" font-size="13.5" fill="#1F2937" text-anchor="middle">ola.js</text><line x1="304" y1="235" x2="356" y2="235" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><rect x="360" y="200" width="150" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="435" y="231" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">node</text><text x="435" y="252" font-size="12.5" fill="#6B7280" text-anchor="middle">motor V8</text><line x1="514" y1="235" x2="566" y2="235" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><rect x="570" y="200" width="170" height="70" rx="8" fill="#fff" stroke="#1F2937" stroke-width="1.5"/><text x="655" y="231" font-size="13" fill="#1F2937" text-anchor="middle">saída no terminal:</text><text x="655" y="251" class="m" font-size="13" fill="#1F2937" text-anchor="middle">Olá, mundo!</text><text x="380" y="300" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Node.js = o motor V8 fora do navegador, rodando arquivos .js direto no terminal.</text></svg>