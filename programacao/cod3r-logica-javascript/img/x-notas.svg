<svg xmlns="http://www.w3.org/2000/svg" width="760" height="178" viewBox="0 0 760 178"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Descartar a menor nota e calcular a média das outras duas</text><rect x="16" y="70" width="46" height="40" rx="3" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="39" y="95.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">5</text><rect x="62" y="70" width="46" height="40" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="85" y="95.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">2</text><rect x="108" y="70" width="46" height="40" rx="3" fill="#fff" stroke="#1F2937" stroke-width="1.8"/><text x="131" y="95.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">8</text><text x="85" y="132" font-size="12.5" fill="#6B7280" text-anchor="middle">notas</text><line x1="156" y1="90" x2="176" y2="90" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arg)"/><rect x="178" y="62" width="172" height="56" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="264" y="84" class="m" font-size="13.5" font-weight="bold" fill="#DC2626" text-anchor="middle">menorNota()</text><text x="264" y="106" class="m" font-size="12" fill="#1F2937" text-anchor="middle">Math.min → 2</text><line x1="350" y1="90" x2="370" y2="90" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arg)"/><rect x="372" y="62" width="172" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="458" y="84" class="m" font-size="13.5" font-weight="bold" fill="#2563EB" text-anchor="middle">calcularMedia()</text><text x="458" y="106" class="m" font-size="12" fill="#1F2937" text-anchor="middle">(5+2+8 − 2) / 2 = 6.5</text><line x1="544" y1="90" x2="564" y2="90" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arg)"/><rect x="566" y="62" width="172" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="652" y="84" class="m" font-size="13.5" font-weight="bold" fill="#D97706" text-anchor="middle">situacao()</text><text x="652" y="106" class="m" font-size="12" fill="#1F2937" text-anchor="middle">6.5 ≥ 4 → Recuperação</text><text x="380" y="160" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Somar tudo e subtrair a menor = somar só as duas maiores.</text></svg>