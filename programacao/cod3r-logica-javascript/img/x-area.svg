<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><circle cx="150" cy="130" r="100" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><circle cx="150" cy="130" r="4" fill="#1F2937"/><line x1="150" y1="130" x2="250" y2="130" stroke="#D97706" stroke-width="2.5"/><text x="200" y="122" font-size="13.5" font-weight="bold" fill="#D97706" text-anchor="middle">raio = 10</text><text x="310" y="86" font-size="18" font-weight="bold" fill="#1F2937">área = π × raio²</text><text x="310" y="124" class="m" font-size="15" fill="#2563EB">Math.PI * raio ** 2</text><text x="310" y="158" class="m" font-size="15" fill="#1F2937">= 3.14159... × 100</text><text x="310" y="192" class="m" font-size="18" font-weight="bold" fill="#16A34A">≈ 314.16 m²</text></svg>