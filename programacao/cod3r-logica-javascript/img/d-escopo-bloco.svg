<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="20" width="720" height="250" rx="12" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4"/><text x="40" y="46" font-size="14" font-weight="bold" fill="#6B7280">Escopo do arquivo</text><rect x="60" y="64" width="420" height="120" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="78" y="88" font-size="13.5" font-weight="bold" fill="#2563EB">bloco { }</text><text x="80" y="118" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">let time = &quot;Flamengo&quot;;</text><text x="80" y="138.9" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">console.log(&quot;Uma vez &quot; + time ...);</text><text x="470" y="172" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="end">✓ time existe aqui dentro</text><text x="80" y="226" class="m" font-size="13.5" fill="#1F2937" xml:space="preserve">console.log(typeof time);</text><text x="340" y="226" class="m" font-size="13.5" font-weight="bold" fill="#DC2626">→ &quot;undefined&quot;</text><text x="80" y="252" font-size="12.5" font-weight="bold" fill="#DC2626">✗ fora do bloco, a variável não existe mais</text><text x="610" y="108" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">let e const</text><text x="610" y="130" font-size="13" fill="#1F2937" text-anchor="middle">só existem dentro</text><text x="610" y="150" font-size="13" fill="#1F2937" text-anchor="middle">do bloco onde</text><text x="610" y="170" font-size="13" fill="#1F2937" text-anchor="middle">foram criadas</text></svg>