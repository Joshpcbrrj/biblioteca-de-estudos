<svg xmlns="http://www.w3.org/2000/svg" width="760" height="282" viewBox="0 0 760 282"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Variável = uma caixa com etiqueta (nome) que guarda um valor</text><rect x="101.5" y="50.5" width="57" height="23" rx="11.5" fill="#2563EB" stroke="#2563EB" stroke-width="1.5"/><text x="130" y="66.7" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">const</text><path d="M60,120 l20,-24 h100 l20,24 z" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><rect x="60" y="120" width="140" height="74" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><rect x="85" y="102" width="90" height="22" rx="4" fill="#fff" stroke="#2563EB" stroke-width="1.5"/><text x="130" y="118" class="m" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">PI</text><text x="130" y="165" class="m" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">3.1415</text><rect x="176" y="168" width="18" height="15" rx="2" fill="#2563EB"/><path d="M179,168 v-5 a6,6 0 0 1 12,0 v5" fill="none" stroke="#2563EB" stroke-width="2.2"/><text x="130" y="218" font-size="13" fill="#1F2937" text-anchor="middle">não pode receber</text><text x="130" y="236" font-size="13" fill="#1F2937" text-anchor="middle">outro valor</text><text x="130" y="264" class="m" font-size="12.5" fill="#DC2626" text-anchor="middle">PI = 3&#160; ✗ TypeError</text><rect x="359.3" y="50.5" width="41.4" height="23" rx="11.5" fill="#16A34A" stroke="#16A34A" stroke-width="1.5"/><text x="380" y="66.7" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">let</text><path d="M310,120 l20,-24 h100 l20,24 z" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><rect x="310" y="120" width="140" height="74" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><rect x="335" y="102" width="90" height="22" rx="4" fill="#fff" stroke="#16A34A" stroke-width="1.5"/><text x="380" y="118" class="m" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">contador</text><text x="380" y="165" class="m" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">0 → 1</text><text x="380" y="218" font-size="13" fill="#1F2937" text-anchor="middle">pode trocar</text><text x="380" y="236" font-size="13" fill="#1F2937" text-anchor="middle">o valor</text><text x="380" y="264" class="m" font-size="12.5" fill="#16A34A" text-anchor="middle">contador = contador + 1&#160; ✓</text><rect x="609.3" y="50.5" width="41.4" height="23" rx="11.5" fill="#9CA3AF" stroke="#9CA3AF" stroke-width="1.5"/><text x="630" y="66.7" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">var</text><path d="M560,120 l20,-24 h100 l20,24 z" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/><rect x="560" y="120" width="140" height="74" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/><rect x="585" y="102" width="90" height="22" rx="4" fill="#fff" stroke="#9CA3AF" stroke-width="1.5"/><text x="630" y="118" class="m" font-size="13" font-weight="bold" fill="#9CA3AF" text-anchor="middle">x</text><text x="630" y="165" class="m" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">5</text><text x="630" y="218" font-size="13" fill="#1F2937" text-anchor="middle">forma antiga:</text><text x="630" y="236" font-size="13" fill="#1F2937" text-anchor="middle">evite</text><text x="630" y="264" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle">ignora blocos { }</text></svg>