<svg xmlns="http://www.w3.org/2000/svg" width="760" height="332" viewBox="0 0 760 332"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Closure: a função retornada leva junto as variáveis de onde nasceu</text><rect x="20" y="50" width="230" height="120" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="6 4"/><text x="135" y="74" class="m" font-size="14" font-weight="bold" fill="#6B7280" text-anchor="middle">criarContador()</text><rect x="60" y="92" width="150" height="32" rx="6" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="135" y="112.5" class="m" font-size="13" fill="#6B7280" text-anchor="middle">contagem = 0</text><text x="135" y="152" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">já terminou de executar</text><line x1="254" y1="110" x2="300" y2="110" stroke="#1F2937" stroke-width="2" marker-end="url(#ara)"/><text x="277" y="100" font-size="11.5" fill="#6B7280" text-anchor="middle">retorna</text><rect x="306" y="50" width="200" height="110" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="406" y="76" class="m" font-size="13.5" font-weight="bold" fill="#2563EB" text-anchor="middle">contador = function</text><rect x="330" y="94" width="152" height="50" rx="18" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="406" y="114" font-size="11.5" font-style="italic" fill="#2563EB" text-anchor="middle">mochila</text><text x="406" y="134" class="m" font-size="13" fill="#1F2937" text-anchor="middle">contagem = 3</text><text x="530" y="84" class="m" font-size="13.5" fill="#1F2937">contador() → 1</text><text x="530" y="110" class="m" font-size="13.5" fill="#1F2937">contador() → 2</text><text x="530" y="136" class="m" font-size="13.5" fill="#1F2937">contador() → 3</text><rect x="306" y="180" width="200" height="110" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="406" y="206" class="m" font-size="13.5" font-weight="bold" fill="#D97706" text-anchor="middle">outro = function</text><rect x="330" y="224" width="152" height="50" rx="18" fill="#fff" stroke="#D97706" stroke-width="2"/><text x="406" y="244" font-size="11.5" font-style="italic" fill="#D97706" text-anchor="middle">mochila</text><text x="406" y="264" class="m" font-size="13" fill="#1F2937" text-anchor="middle">contagem = 1</text><text x="530" y="214" class="m" font-size="13.5" fill="#1F2937">outro() → 1</text><text x="380" y="316" font-size="12.5" font-style="italic" fill="#6B7280" text-anchor="middle">Cada chamada a criarContador() cria uma contagem nova e independente; ninguém de fora consegue alterá-la.</text></svg>