<svg xmlns="http://www.w3.org/2000/svg" width="760" height="298" viewBox="0 0 760 298"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Tipos primitivos e o que typeof responde</text><rect x="20" y="48" width="134" height="116" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="87" y="76" class="m" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="middle">number</text><text x="87" y="110" class="m" font-size="14" fill="#1F2937" text-anchor="middle">42&#160; 3.14&#160; -7</text><text x="87" y="132" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">typeof →</text><text x="87" y="146" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">&quot;number&quot;</text><rect x="166" y="48" width="134" height="116" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="233" y="76" class="m" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">string</text><text x="233" y="110" class="m" font-size="14" fill="#1F2937" text-anchor="middle">&quot;Casa&quot;</text><text x="233" y="132" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">typeof →</text><text x="233" y="146" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">&quot;string&quot;</text><rect x="312" y="48" width="134" height="116" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="379" y="76" class="m" font-size="15" font-weight="bold" fill="#D97706" text-anchor="middle">boolean</text><text x="379" y="110" class="m" font-size="14" fill="#1F2937" text-anchor="middle">true&#160; false</text><text x="379" y="132" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">typeof →</text><text x="379" y="146" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">&quot;boolean&quot;</text><rect x="458" y="48" width="134" height="116" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="525" y="76" class="m" font-size="15" font-weight="bold" fill="#9CA3AF" text-anchor="middle">undefined</text><text x="525" y="110" class="m" font-size="14" fill="#1F2937" text-anchor="middle">undefined</text><text x="525" y="132" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">typeof →</text><text x="525" y="146" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">&quot;undefined&quot;</text><rect x="604" y="48" width="134" height="116" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="671" y="76" class="m" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="middle">null</text><text x="671" y="110" class="m" font-size="14" fill="#1F2937" text-anchor="middle">null</text><text x="671" y="132" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">typeof →</text><text x="671" y="146" class="m" font-size="11.5" fill="#6B7280" text-anchor="middle">&quot;object&quot; ⚠</text><rect x="20" y="182" width="720" height="76" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/><text x="40" y="208" font-size="14" font-weight="bold" fill="#1F2937">Objetos (não primitivos)</text><text x="40" y="238" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">typeof [1, 2]&#160; → &quot;object&quot;</text><text x="400" y="238" class="m" font-size="12.5" fill="#1F2937" xml:space="preserve">typeof function(){} → &quot;function&quot;</text><text x="380" y="282" font-size="12.5" font-style="italic" fill="#6B7280" text-anchor="middle">O tipo pertence ao valor, não à variável: a mesma variável pode guardar 42 e depois &quot;texto&quot;.</text></svg>