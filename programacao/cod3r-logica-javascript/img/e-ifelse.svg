 y="169.6" text-anchor="middle" xml:space="preserve">&quot;Você é menor de idade.&quot;</text><path class="e" d="M142.2,181.6 L142.2,199.6 L280.4,199.6"/><circle cx="280.4" cy="199.6" r="4" fill="#4B5563"/><path class="e" d="M280.4,203.6 L280.4,225.6" marker-end="url(#a)"/><rect class="te" x="195.2" y="225.6" width="170.4" height="32" rx="16"/><text class="t" x="280.4" y="245.6" text-anchor="middle" xml:space="preserve">o programa continua</text><text x="282.4" y="279.6" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">Com else, exatamente um dos dois blocos é executado.</text></svg>