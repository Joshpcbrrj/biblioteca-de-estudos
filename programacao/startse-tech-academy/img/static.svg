<svg xmlns="http://www.w3.org/2000/svg" width="480" height="358" viewBox="0 0 480 358"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">static: pertence à classe, não ao objeto</text><rect x="110" y="52" width="260" height="116" rx="6" class="xP"/><text x="240" y="76" class="m b c">class Usuario</text><rect x="140" y="88" width="200" height="30" rx="4" class="xO"/><text x="240" y="108" class="m b c">static total = 2</text><text x="240" y="138" class="m c">Usuario.total     ✔</text><text x="240" y="158" class="m c">Usuario.contar()  ✔</text><rect x="30" y="200" width="200" height="84" rx="6" class="xB"/><text x="130" y="224" class="m b c">ana</text><text x="130" y="248" class="m c">nome: "Ana"</text><text x="130" y="272" class="m c">ana.total → undefined</text><rect x="250" y="200" width="200" height="84" rx="6" class="xB"/><text x="350" y="224" class="m b c">beto</text><text x="350" y="248" class="m c">nome: "Beto"</text><text x="350" y="272" class="m c">beto.total → undefined</text><text x="240.0" y="316" class="n c">Use static para contadores, 