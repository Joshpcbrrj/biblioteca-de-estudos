<svg xmlns="http://www.w3.org/2000/svg" width="480" height="636" viewBox="0 0 480 636"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Valores de display</text><text x="30" y="70" class="m b">display: block</text><text x="450" y="70" class="s r">ocupa a linha</text><rect x="30" y="82" width="420" height="26" rx="6" class="xY"/><rect x="30" y="114" width="420" height="26" rx="6" class="xB"/><text x="240" y="132" class="s c">bloco: linha inteira</text><rect x="30" y="146" width="420" height="26" rx="6" class="xY"/><text x="30" y="210" class="m b">display: inline</text><text x="450" y="210" class="s r">flui no texto; ignora width</text><text x="30" y="242" class="s">texto antes</text><rect x="112" y="226" width="60" height="22" rx="6" class="xB"/><text x="142" y="242" class="s c">span</text><text x="180" y="242" class="s">texto depois, na mesma linha</text><text x="30" y="290" class="m b">display: inline-block</text><text x="450" y="290" class="s r">em linha, aceita tamanho</text><rect x="30" y="302" width="100" height="50" rx="6" class="xB"/><rect x="140" y="302" width="100" height="50" rx="6" class="xB"/><text x="80" y="332" class="b c">A</text><text x="190" y="332" class="b c">B</text><text x="260" y="332" class="s">lado a lado, com</text><text x="260" y="348" class="s">width e height</text><text x="30" y="394" class="m b">display: none</text><text x="450" y="394" class="s r">some, sem espaço</text><rect x="30" y="406" width="420" height="24" rx="6" class="xY"/><rect x="30" y="434" width="420" height="24" rx="6" class="xY"/><text x="240" y="450" class="s c">(o elemento sumiu; os vizinhos se juntam)</text><text x="30" y="496" class="m b">visibility: hidden</text><text x="450" y="496" class="s r">some, mas o espaço fica</text><rect x="30" y="508" width="420" height="24" rx="6" class="xY"/><rect x="30" y="536" width="420" height="24" rx="6" class="xW d"/><text x="240" y="552" class="s c">(espaço reservado, vazio)</text><rect x="30" y="564" width="420" height="24" rx="6" class="xY"/><text x="240.0" y="612" class="n c">Cinza = vizinhos; azul = o elemento estilizado.</text></svg>