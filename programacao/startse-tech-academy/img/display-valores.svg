xt><rect x="30" y="146" width="420" height="26" rx="8" class="xY"/><text x="30" y="210" class="m b">display: inline</text><text x="450" y="210" class="s r">flui no texto; ignora width</text><text x="30" y="242" class="s">texto antes</text><rect x="112" y="226" width="60" height="22" rx="8" class="xB"/><text x="142" y="242" class="s c">span</text><text x="180" y="242" class="s">texto depois, na mesma linha</text><text x="30" y="290" class="m b">display: inline-block</text><text x="450" y="290" class="s r">em linha, aceita tamanho</text><rect x="30" y="302" width="100" height="50" rx="8" class="xB"/><rect x="140" y="302" width="100" height="50" rx="8" class="xB"/><text x="80" y="332" class="b c">A</text><text x="190" y="332" class="b c">B</text><text x="260" y="332" class="s">lado a lado, com</text><text x="260" y="348" class="s">width e height</text><text x="30" y="394" class="m b">display: none</text><text x="450" y="394" class="s r">some, sem espaço</text><rect x="30" y="406" width="420" height="24" rx="8" class="xY"/><rect x="30" y="434" width="420" height="24" rx="8" class="xY"/><text x="240" y="450" class="s c">(o elemento sumiu; os vizinhos se juntam)</text><text x="30" y="496" class="m b">visibility: hidden</text><text x="450" y="496" class="s r">some, mas o espaço fica</text><rect x="30" y="508" width="420" height="24" rx="8" class="xY"/><rect x="30" y="536" width="420" height="24" rx="6" class="xW d"/><text x="240" y="552" class="s c">(espaço reservado, vazio)</text><rect x="30" y="564" width="420" height="24" rx="8" class="xY"/><text x="240.0" y="612" class="n c">Cinza = vizinhos; azul = o elemento estilizado.</text></svg>