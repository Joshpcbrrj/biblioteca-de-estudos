<svg xmlns="http://www.w3.org/2000/svg" width="480" height="428" viewBox="0 0 480 428"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">content-box × border-box</text><text x="240.0" y="58" class="m c">width: 300px; padding: 20px; border: 5px</text><text x="40" y="92" class="b">content-box (padrão)</text><rect x="40" y="104" width="300.0" height="90" rx="2" class="xY"/><rect x="46" y="110" width="288.0" height="78" rx="2" class="xB"/><rect x="66" y="130" width="248.0" height="38" rx="2" class="xW"/><text x="190.0" y="154" class="s c">conteúdo: 300px</text><text x="40" y="214" class="b">largura final: 350px</text><text x="40" y="234" class="m">300 + 2×20 + 2×5 = 350</text><text x="40" y="262" class="b">border-box</text><rect x="40" y="274" width="257.1428571428571" height="90" rx="2" class="xY"/><rect x="46" y="280" width="245.1428571428571" height="78" rx="2" class="xG"/><rect x="66" y="300" width="205.1428571428571" height="38" rx="2" class="xW"/><text x="168.57142857142856" y="324" class="s c">conteúdo: 250px</text><text x="40" y="384" class="b">largura final: 300px</text><text x="40" y="404" class="m">conteúdo = 300 − 50 = 250</text></svg>