<svg xmlns="http://www.w3.org/2000/svg" width="480" height="342" viewBox="0 0 480 342"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Estados de uma Promise</text><rect x="150" y="56" width="180" height="56" rx="6" class="xY"/><text x="240.0" y="80.5" class="b c">pending</text><text x="240.0" y="98.5" class="s c">aguardando</text><path d="M190,112 L110,180" class="l" marker-end="url(#a)"/><text x="132" y="140" class="m r">resolve(valor)</text><path d="M290,112 L370,180" class="l" marker-end="url(#a)"/><text x="348" y="140" class="m">reject(erro)</text><rect x="20" y="180" width="180" height="56" rx="6" class="xG"/><text x="110.0" y="204.5" class="b c">fulfilled</text><text x="110.0" y="222.5" class="m c">.then(valor)</text><rect x="280" y="180" width="180" height="56" rx="6" class="xR"/><text x="370.0" y="204.5" class="b c">rejected</text><text x="370.0" y="222.5" class="m c">.catch(erro)</text><rect x="20" y="260" width="440" height="64" rx="6" class="xW"/><text x="240" y="286" class="s c">settled: depois de resolvida, não muda mais</text><tex