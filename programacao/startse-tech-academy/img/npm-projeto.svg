<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Um projeto Node com npm</text><rect x="30" y="52" width="420" height="250" rx="6" class="xY"/><text x="46" y="76" class="m b">meu-projeto/</text><rect x="50" y="90" width="180" height="52" rx="6" class="xB"/><text x="140.0" y="112.5" class="m b c">package.json</text><text x="140.0" y="130.5" class="s c">nome, scripts, deps</text><rect x="250" y="90" width="180" height="52" rx="6" class="xP"/><text x="340.0" y="112.5" class="m b c">package-lock.json</text><text x="340.0" y="130.5" class="s c">versões exatas</text><rect x="50" y="154" width="180" height="52" rx="6" class="xO"/><text x="140.0" y="176.5" class="m b c">node_modules/</text><text x="140.0" y="194.5" class="s c">pacotes baixados</text><rect x="250" y="154" width="180" height="52" rx="6" class="xG"/><text x="340.0" y="176.5" class="m b c">index.js</text><text x="340.0" y="194.5" class="s c">seu código</text><rect x="50" y="218" width="380" height="52" rx=