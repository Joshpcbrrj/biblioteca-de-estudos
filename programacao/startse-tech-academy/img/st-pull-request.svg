<svg xmlns="http://www.w3.org/2000/svg" width="480" height="438" viewBox="0 0 480 438"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">O fluxo de pull request</text><rect x="60" y="50" width="400" height="50" rx="6" class="xB"/><text x="260.0" y="71.5" class="m b c">git switch -c feat/contato</text><text x="260.0" y="89.5" class="s c">branch nova a partir da main</text><text x="36" y="80" class="b c">1</text><rect x="60" y="114" width="400" height="50" rx="6" class="xG"/><text x="260.0" y="135.5" class="m b c">commit + git push -u origin</text><text x="260.0" y="153.5" class="s c">envia a branch</text><text x="36" y="144" class="b c">2</text><path d="M260,100 L260,114" class="l" marker-end="url(#a)"/><rect x="60" y="178" width="400" height="50" rx="6" class="xO"/><text x="260.0" y="199.5" class="m b c">Compare &amp; pull request</text><text x="260.0" y="217.5" class="s c">descreve o que e por quê</text><text x="36" y="208" class="b c">3</text><path d="M260,164 L260,178" class="l" marker-end="url(#a)"/><rect x="60" y="242" width="400" height="50" rx="6" class="xP"/><text x="260.0" y="263.5" class="m b c">Revisão</text><text x="260.0" y="281.5" class="s c">colegas comentam; novos commits</text><text x="36" y="272" class="b c">4</text><path d="M260,228 L260,242" class="l" marker-end="url(#a)"/><rect x="60" y="306" width="400" height="50" rx="6" class="xG"/><text x="260.0" y="327.5" class="m b c">Merge</text><text x="260.0" y="345.5" class="s c">entra na main; apague a branch</text><text x="36" y="336" class="b c">5</text><path d="M260,292 L260,306" class="l" marker-end="url(#a)"/><rect x="60" y="370" width="400" height="50" rx="6" class="xB"/><text x="260.0" y="391.5" class="m b c">git switch main + git pull</text><text x="260.0" y="409.5" class="s c">atualize o local</text><text x="36" y="400" class="b c">6</text><path d="M260,356 L260,370" class="l" marker-end="url(#a)"/></svg>