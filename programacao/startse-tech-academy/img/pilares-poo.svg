<svg xmlns="http://www.w3.org/2000/svg" width="480" height="468" viewBox="0 0 480 468"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Os quatro pilares da POO</text><rect x="30" y="52" width="420" height="92" rx="6" class="xB"/><text x="46" y="76" class="b">Encapsulamento</text><text x="46" y="98" class="s">esconde o estado interno;</text><text x="46" y="116" class="s">acesso só pelos métodos</text><rect x="46" y="122" width="0" height="0" rx="6" class="xW"/><text x="434" y="76" class="m r">#saldo, get/set</text><rect x="30" y="154" width="420" height="92" rx="6" class="xG"/><text x="46" y="178" class="b">Abstração</text><text x="46" y="200" class="s">expõe o essencial e</text><text x="46" y="218" class="s">esconde os detalhes</text><rect x="46" y="224" width="0" height="0" rx="6" class="xW"/><text x="434" y="178" class="m r">carro.ligar()</text><rect x="30" y="256" width="420" height="92" rx="6" class="xO"/><text x="46" y="280" class="b">Herança</text><text x="46" y="302" class="s">uma classe reaproveita</text><text x="46" y="320" class="s">outra (relação "é um")</text><rect x="46" y="326" width="0" height="0" rx="6" class="xW"/><text x="434" y="280" class="m r">class Gato extends Animal</text><rect x="30" y="358" width="420" height="92" rx="6" class="xP"/><text x="46" y="382" class="b">Polimorfismo</text><text x="46" y="404" class="s">o mesmo método age</text><text x="46" y="422" class="s">diferente em cada classe</text><rect x="46" y="428" width="0" height="0" rx="6" class="xW"/><text x="434" y="382" class="m r">animal.falar()</text></svg>