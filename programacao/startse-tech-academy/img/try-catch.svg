<svg xmlns="http://www.w3.org/2000/svg" width="480" height="434" viewBox="0 0 480 434"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">try / catch / finally</text><rect x="140" y="52" width="200" height="48" rx="6" class="xB"/><text x="240.0" y="72.5" class="b c">try</text><text x="240.0" y="90.5" class="s c">código que pode falhar</text><path d="M240,100 L240,130" class="l" marker-end="url(#a)"/><polygon points="240,130 320,160 240,190 160,160" class="xO"/><text x="240" y="165" class="b c">deu erro?</text><path d="M160,160 L90,160 L90,214" class="l" marker-end="url(#a)"/><text x="110" y="152" class="s">sim</text><path d="M320,160 L390,160 L390,214" class="l" marker-end="url(#a)"/><text x="352" y="152" class="s">não</text><rect x="20" y="214" width="140" height="56" rx="6" class="xR"/><text x="90.0" y="238.5" class="b c">catch (erro)</text><text x="90.0" y="256.5" class="s c">trata o problema</text><rect x="320" y="214" width="140" height="56" rx="6" class="xG"/><text x="390.0" y="238.5" class="b c">segue o try</text><text x="390.0" y="256.5" class="s c">até o fim</text><path d="M90,270 L90,310 L200,310" class="l" marker-end="url(#a)"/><path d="M390,270 L390,310 L280,310" class="l" marker-end="url(#a)"/><rect x="200" y="290" width="80" height="40" rx="6" class="xP"/><text x="240.0" y="314.5" class="b c">finally</text><path d="M240,330 L240,360" class="l" marker-end="url(#a)"/><text x="240.0" y="380" class="b c">o programa continua</text><text x="240.0" y="410" class="n c">finally roda sempre: com erro ou sem erro</text></svg>