<svg xmlns="http://www.w3.org/2000/svg" width="480" height="404" viewBox="0 0 480 404"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">API: requisição e resposta HTTP</text><rect x="20" y="52" width="190" height="56" rx="6" class="xB"/><text x="115.0" y="76.5" class="b c">Cliente</text><text x="115.0" y="94.5" class="s c">navegador, app</text><rect x="270" y="52" width="190" height="56" rx="6" class="xG"/><text x="365.0" y="76.5" class="b c">Servidor (API)</text><text x="365.0" y="94.5" class="s c">Node + Express</text><rect x="20" y="128" width="440" height="96" rx="6" class="xO"/><text x="36" y="150" class="b">REQUISIÇÃO  →</text><text x="36" y="174" class="m">GET /api/produtos/42 HTTP/1.1</text><text x="36" y="192" class="m">Authorization: Bearer eyJhb...</text><text x="36" y="210" class="m">Accept: application/json</text><rect x="20" y="240" width="440" height="96" rx="6" class="xP"/><text x="444" y="262" class="b r">←  RESPOSTA</text><text x="36" y="286" class="m">HTTP/1.1 200 OK</text><text x="36" y="304" class="m">Content-Type: application/json</text><text x="36" y="322" class="m">{ "id": 42, "nome": "Café" }</text><text x="240.0" y="362" class="s c">método + endpoint + cabeçalhos (+ corpo)</text><text x="240.0" y="380" class="s c">→ status + cabeçalhos + corpo (JSON)</text></svg>