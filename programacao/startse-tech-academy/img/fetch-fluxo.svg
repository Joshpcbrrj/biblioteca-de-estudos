<svg xmlns="http://www.w3.org/2000/svg" width="480" height="494" viewBox="0 0 480 494"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">fetch: do pedido aos dados na tela</text><rect x="60" y="52" width="360" height="52" rx="6" class="xB"/><text x="240.0" y="74.5" class="m b c">fetch(url)</text><text x="240.0" y="92.5" class="s c">envia a requisição HTTP</text><path d="M240,104 L240,124" class="l" marker-end="url(#a)"/><rect x="60" y="124" width="360" height="52" rx="6" class="xY"/><text x="240.0" y="146.5" class="m b c">await → resp</text><text x="240.0" y="164.5" class="s c">chegou a resposta (status, cabeçalhos)</text><path d="M240,176 L240,196" class="l" marker-end="url(#a)"/><rect x="60" y="196" width="360" height="52" rx="6" class="xO"/><text x="240.0" y="218.5" class="m b c">resp.ok ?</text><text x="240.0" y="236.5" class="s c">status 200–299? senão, throw</text><path d="M240,248 L240,268" class="l" marker-end="url(#a)"/><rect x="60" y="268" width="360" height="52" rx="6" class="xG"/><text x="240.0" y="290.5" class="m b c">await resp.json()</text><text x="240.0" y="308.5" class="s c">lê o corpo e converte o JSON</text><path d="M240,320 L240,340" class="l" marker-end="url(#a)"/><rect x="60" y="340" width="360" height="52" rx="6" class="xP"/><text x="240.0" y="362.5" class="m b c">textContent / append</text><text x="240.0" y="380.5" class="s c">mostra os dados no DOM</text><rect x="40" y="418" width="400" height="58" rx="6" class="xR"/><text x="56" y="442" class="s">Falha de rede rejeita a Promise e cai no catch.</text><text x="56" y="462" class="s b">404 e 500 não: confira resp.ok.</text></svg>