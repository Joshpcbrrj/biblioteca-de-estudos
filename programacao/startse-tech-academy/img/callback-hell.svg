<svg xmlns="http://www.w3.org/2000/svg" width="480" height="590" viewBox="0 0 480 590"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Callbacks × Promises × async/await</text><rect x="30" y="50" width="420" height="169" rx="6" class="xR"/><text x="46" y="72" class="b">callbacks aninhados</text><text x="46" y="94" class="m">buscarUsuario(id, (u) =&gt; {</text><text x="46" y="113" class="m">  buscarPedidos(u, (p) =&gt; {</text><text x="46" y="132" class="m">    buscarItens(p[0], (i) =&gt; {</text><text x="46" y="151" class="m">      console.log(i);</text><text x="46" y="170" class="m">    });</text><text x="46" y="189" class="m">  });</text><text x="46" y="208" class="m">});</text><rect x="30" y="231" width="420" height="131" rx="6" class="xO"/><text x="46" y="253" class="b">Promises encadeadas</text><text x="46" y="275" class="m">buscarUsuario(id)</text><text x="46" y="294" class="m">  .then(u =&gt; buscarPedidos(u))</text><text x="46" y="313" class="m">  .then(p =&gt; buscarItens(p[0]))</text><text x="46" y="332" class="m">  .then(i =&gt; console.log(i))</text><text x="46" y="351" class="m">  .catch(trataErro);</text><rect x="30" y="374" width="420" height="150" rx="6" class="xG"/><text x="46" y="396" class="b">async/await</text><text x="46" y="418" class="m">try {</text><text x="46" y="437" class="m">  const u = await buscarUsuario(id);</text><text x="46" y="456" class="m">  const p = await buscarPedidos(u);</text><text x="46" y="475" class="m">  const i = await buscarItens(p[0]);</text><text x="46" y="494" class="m">  console.log(i);</text><text x="46" y="513" class="m">} catch (e) { trataErro(e); }</text><text x="240.0" y="548" class="n c">Mesma lógica; de cima para baixo, fica mais</text><text x="240.0" y="566" class="n c">fácil de ler e de tratar erros.</text></svg>