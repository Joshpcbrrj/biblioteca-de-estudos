<svg xmlns="http://www.w3.org/2000/svg" width="480" height="382" viewBox="0 0 480 382"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Anatomia de uma função</text><text x="90" y="62" class="s c">palavra-chave</text><text x="170" y="62" class="s c">nome</text><text x="260" y="62" class="s c">parâmetros</text><path d="M90,68 L90,82" class="l" marker-end="url(#a)"/><path d="M170,68 L150,82" class="l" marker-end="url(#a)"/><path d="M260,68 L205,82" class="l" marker-end="url(#a)"/><rect x="40" y="86" width="400" height="96" rx="6" class="xB"/><text x="56" y="116" class="m b">function somar(a, b) {</text><text x="56" y="142" class="m b">  return a + b;</text><text x="56" y="168" class="m b">}</text><text x="260" y="147" class="s">← devolve e encerra</text><rect x="40" y="210" width="400" height="40" rx="6" class="xG"/><text x="56" y="235" class="m b">const r = somar(3, 4);  // 7</text><text x="240.0" y="272" class="s c">chamada: 3 e 4 são os argumentos</text><rect x="40" y="296" width="400" height="40" rx="6" class="xO"/><text x="56" y="321" class="m b">const somar = (a, b) =&gt; a + b;</text><text x="240.0" y="358" class="s c">arrow function equivalente</text></svg>