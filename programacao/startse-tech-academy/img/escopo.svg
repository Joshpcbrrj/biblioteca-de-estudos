<svg xmlns="http://www.w3.org/2000/svg" width="480" height="448" viewBox="0 0 480 448"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Escopo: onde cada variável existe</text><rect x="20" y="50" width="440" height="330" rx="6" class="xY"/><text x="34" y="74" class="b">escopo global</text><text x="34" y="96" class="m">const taxa = 0.1;</text><text x="446" y="96" class="s r">visível no arquivo todo</text><rect x="40" y="112" width="400" height="252" rx="6" class="xB"/><text x="54" y="136" class="m">function calcular() {</text><text x="426" y="136" class="s r">escopo da função</text><text x="54" y="160" class="m">var total = 100;</text><text x="426" y="160" class="s r">var: função inteira</text><rect x="60" y="176" width="360" height="112" rx="6" class="xG"/><text x="74" y="200" class="m">if (total &gt; 50) {</text><text x="406" y="200" class="s r">bloco</text><text x="90" y="226" class="m">let desconto = 10;</text><text x="406" y="226" class="s r">só aqui dentro</text><text x="90" y="252" class="m">var x = 1;</text><text x="406" y="252" class="s r">vaza para a função</text><text x="74" y="276" class="m">}</text><text x="54" y="316" class="m">console.log(x);        // 1</text><text x="54" y="340" class="m">console.log(desconto); // erro</text><text x="240.0" y="406" class="n c">Use const por padrão, let quando o valor</text><text x="240.0" y="424" class="n c">mudar, e evite var.</text></svg>