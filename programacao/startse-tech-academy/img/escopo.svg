"auto-start-reverse"><path d="M1,1L9,5L1,9" fill="none" stroke="#7A7F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="240.0" y="30" class="t c">Escopo: onde cada variável existe</text><rect x="200.0" y="38" width="80" height="4" rx="2" fill="url(#gT0)"/><rect x="20" y="50" width="440" height="330" rx="12" class="xY"/><text x="34" y="74" class="b">escopo global</text><text x="34" y="96" class="m">const taxa = 0.1;</text><text x="446" y="96" class="s r">visível no arquivo todo</text><rect x="40" y="112" width="400" height="252" rx="12" class="xB"/><text x="54" y="136" class="m">function calcular() {</text><text x="426" y="136" class="s r">escopo da função</text><text x="54" y="160" class="m">var total = 100;</text><text x="426" y="160" class="s r">var: função inteira</text><rect x="60" y="176" width="360" height="112" rx="12" class="xG"/><text x="74" y="200" class="m">if (total &gt; 50) {</text><text x="406" y="200" class="s r">bloco</text><text x="90" y="226" class="m">let desconto = 10;</text><text x="406" y="226" class="s r">só aqui dentro</text><text x="90" y="252" class="m">var x = 1;</text><text x="406" y="252" class="s r">vaza para a função</text><text x="74" y="276" class="m">}</text><text x="54" y="316" class="m">console.log(x);        // 1</text><text x="54" y="340" class="m">console.log(desconto); // erro</text><text x="240.0" y="406" class="n c">Use const por padrão, let quando o valor</text><text x="240.0" y="424" class="n c">mudar, e evite var.</text></svg>