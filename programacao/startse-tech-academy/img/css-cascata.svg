<svg xmlns="http://www.w3.org/2000/svg" width="480" height="388" viewBox="0 0 480 388"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Três formas de aplicar CSS</text><rect x="40" y="52" width="400" height="80" rx="6" class="xB"/><text x="56" y="76" class="b">Externo</text><text x="56" y="100" class="m">&lt;link href="estilo.css"&gt;</text><text x="56" y="120" class="s">vale para o site todo (recomendado)</text><rect x="40" y="144" width="400" height="80" rx="6" class="xG"/><text x="56" y="168" class="b">Interno</text><text x="56" y="192" class="m">&lt;style&gt; no &lt;head&gt;</text><text x="56" y="212" class="s">vale para a página</text><rect x="40" y="236" width="400" height="80" rx="6" class="xO"/><text x="56" y="260" class="b">Inline</text><text x="56" y="284" class="m">style="..." no elemento</text><text x="56" y="304" class="s">vale só para ele</text><text x="240.0" y="342" class="b c">Em conflito: !important &gt; especificidade &gt; ordem</text><text x="240.0" y="364" class="n c">Com a mesma especificidade, vence a última.</text></svg>