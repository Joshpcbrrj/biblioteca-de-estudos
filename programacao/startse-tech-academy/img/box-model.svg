<svg xmlns="http://www.w3.org/2000/svg" width="480" height="464" viewBox="0 0 480 464"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Box model</text><rect x="30" y="50" width="420" height="280" rx="0" class="xO"/><text x="42" y="70" class="s b">margin</text><rect x="60" y="80" width="360" height="220" rx="0" class="xY"/><rect x="60" y="80" width="360" height="220" fill="none" stroke="#1F2937" stroke-width="4"/><text x="72" y="100" class="s b">border</text><rect x="84" y="110" width="312" height="160" rx="0" class="xG"/><text x="96" y="130" class="s b">padding</text><rect x="124" y="146" width="232" height="90" rx="0" class="xB"/><text x="240" y="186" class="b c">content</text><text x="240" y="206" class="s c">width × height</text><rect x="30" y="350" width="420" height="96" rx="6" class="xW"/><text x="46" y="374" class="b">content-box (padrão):</text><text x="46" y="394" class="m">largura = width + padding + border</text><text x="46" y="418" class="b">border-box:</text><text x="46" y="438" class="m">largura = width (já inclui tudo)</text></svg