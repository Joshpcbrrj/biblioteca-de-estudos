<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Herança: extends e super</text><rect x="120" y="52" width="240" height="100" rx="6" class="xP"/><text x="240" y="74" class="m b c">class Animal</text><text x="136" y="98" class="m">nome</text><text x="136" y="118" class="m">falar() → "faz barulho"</text><text x="136" y="138" class="m">dormir()</text><rect x="20" y="186" width="210" height="96" rx="6" class="xB"/><text x="125" y="208" class="m b c">class Cachorro</text><text x="32" y="232" class="m">+ raca</text><text x="32" y="250" class="m">falar() → "late"</text><text x="32" y="268" class="m">dormir() ← herdado</text><path d="M125,186 L240,152" class="l" marker-end="url(#a)"/><rect x="250" y="186" width="210" height="96" rx="6" class="xB"/><text x="355" y="208" class="m b c">class Gato</text><text x="262" y="232" class="m">+ vidas = 7</text><text x="262" y="250" class="m">falar() → "mia"</text><text x="262" y="268" class="m">dormir() ← herdado</text><path d="M355,186 L240,152" class="l" marker-end="url(#a)"/><text x="150" y="168" class="s r">é um</text><text x="330" y="168" class="s">é um</text><text x="20" y="316" class="m">class Cachorro extends Animal {</text><text x="20" y="336" class="m">  constructor(nome, raca) {</text><text x="20" y="356" class="m">    // chama o constructor de Animal</text><text x="20" y="376" class="m">    super(nome);</text><text x="20" y="396" class="m">    this.raca = raca;</text><text x="20" y="416" class="m">  }</text><text x="20" y="436" class="m">}</text></svg>