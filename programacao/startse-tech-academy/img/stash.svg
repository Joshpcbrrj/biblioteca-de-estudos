<svg xmlns="http://www.w3.org/2000/svg" width="480" height="432" viewBox="0 0 480 432"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">git stash: uma gaveta temporária</text><rect x="40" y="52" width="400" height="110" rx="6" class="xO"/><text x="56" y="76" class="b">Diretório de trabalho</text><text x="56" y="100" class="m">index.html (modificado)</text><text x="56" y="120" class="m">style.css (modificado)</text><text x="56" y="140" class="m">app.js (novo: só com -u)</text><path d="M160,162 L160,222" class="l" marker-end="url(#a)"/><text x="152" y="196" class="m r">git stash</text><path d="M320,222 L320,162" class="l" marker-end="url(#a)"/><text x="328" y="196" class="m">git stash pop</text><rect x="40" y="222" width="400" height="120" rx="6" class="xP"/><text x="56" y="246" class="b">Pilha de stashes</text><text x="56" y="272" class="m">stash@{0}  (mais recente)</text><text x="56" y="294" class="m">stash@{1}</text><text x="56" y="316" class="m">stash@{2}</text><text x="240.0" y="372" class="s c">Depois do stash, o diretório fica limpo:</text><text x="240.0" y="390" class="s c">dá para trocar de branch e voltar depois.</text><text x="240.0" y="408" class="s c">pop aplica e remove; apply aplica e mantém.</text></svg>