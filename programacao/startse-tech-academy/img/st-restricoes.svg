"auto-start-reverse"><path d="M1,1L9,5L1,9" fill="none" stroke="#7A7F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="240.0" y="30" class="t c">Restrições: o banco recusa dado errado</text><rect x="200.0" y="38" width="80" height="4" rx="2" fill="url(#gT0)"/><rect x="20" y="56" width="440" height="214" rx="12" class="xW"/><text x="36" y="82" class="m">CREATE TABLE itens_pedido (</text><text x="36" y="104" class="m">  id INT PRIMARY KEY,</text><text x="36" y="126" class="m">  pedido_id INT NOT NULL,</text><text x="36" y="148" class="m">  quantidade INT DEFAULT 1</text><text x="36" y="170" class="m">    CHECK (quantidade &gt; 0),</text><text x="36" y="192" class="m">  FOREIGN KEY (pedido_id)</text><text x="36" y="214" class="m">    REFERENCES pedidos(id)</text><text x="36" y="236" class="m">);</text><rect x="20" y="290" width="440" height="38" rx="12" class="xP"/><text x="36" y="314" class="m b">PRIMARY KEY</text><text x="448" y="314" class="s r">única e não nula</text><rect x="20" y="336" width="440" height="38" rx="12" class="xB"/><text x="36" y="360" class="m b">NOT NULL / DEFAULT</text><text x="448" y="360" class="s r">obrigatório / valor padrão</text><rect x="20" y="382" width="440" height="38" rx="12" class="xB"/><text x="36" y="406" class="m b">UNIQUE</text><text x="448" y="406" class="s r">sem repetição</text><rect x="20" y="428" width="440" height="38" rx="12" class="xO"/><text x="36" y="452" class="m b">CHECK</text><text x="448" y="452" class="s r">regra de valor</text><rect x="20" y="474" width="440" height="38" rx="12" class="xG"/><text x="36" y="498" class="m b">FOREIGN KEY</text><text x="448" y="498" class="s r">aponta para outra tabela</text></svg>