<svg xmlns="http://www.w3.org/2000/svg" width="480" height="530" viewBox="0 0 480 530"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Restrições: o banco recusa dado errado</text><rect x="20" y="56" width="440" height="214" rx="6" class="xW"/><text x="36" y="82" class="m">CREATE TABLE itens_pedido (</text><text x="36" y="104" class="m">  id INT PRIMARY KEY,</text><text x="36" y="126" class="m">  pedido_id INT NOT NULL,</text><text x="36" y="148" class="m">  quantidade INT DEFAULT 1</text><text x="36" y="170" class="m">    CHECK (quantidade &gt; 0),</text><text x="36" y="192" class="m">  FOREIGN KEY (pedido_id)</text><text x="36" y="214" class="m">    REFERENCES pedidos(id)</text><text x="36" y="236" class="m">);</text><rect x="20" y="290" width="440" height="38" rx="6" class="xP"/><text x="36" y="314" class="m b">PRIMARY KEY</text><text x="448" y="314" class="s r">única e não nula</text><rect x="20" y="336" width="440" height="38" rx="6" class="xB"/><text x="36" y="360" class="m b">NOT NULL / DEFAULT</text><text x="448" y="360" class="s r">obrigatório / valor padrão</text><rect x="20" y="382" width="440" height="38" rx="6" class="xB"/><text x="36" y="406" class="m b">UNIQUE</text><text x="448" y="406" class="s r">sem repetição</text><rect x="20" y="428" width="440" height="38" rx="6" class="xO"/><text x="36" y="452" class="m b">CHECK</text><text x="448" y="452" class="s r">regra de valor</text><rect x="20" y="474" width="440" height="38" rx="6" class="xG"/><text x="36" y="498" class="m b">FOREIGN KEY</text><text x="448" y="498" class="s r">aponta para outra tabela</text></svg>