<svg xmlns="http://www.w3.org/2000/svg" width="480" height="462" viewBox="0 0 480 462"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">map, filter e reduce</text><text x="40" y="60" class="m b">const n = [1, 2, 3, 4]</text><rect x="40" y="70" width="60" height="40" rx="6" class="xB"/><text x="70.0" y="94.5" class="b c">1</text><rect x="110" y="70" width="60" height="40" rx="6" class="xB"/><text x="140.0" y="94.5" class="b c">2</text><rect x="180" y="70" width="60" height="40" rx="6" class="xB"/><text x="210.0" y="94.5" class="b c">3</text><rect x="250" y="70" width="60" height="40" rx="6" class="xB"/><text x="280.0" y="94.5" class="b c">4</text><text x="40" y="150" class="m b">n.map(x =&gt; x * 10)</text><rect x="40" y="160" width="60" height="40" rx="6" class="xG"/><text x="70.0" y="184.5" class="b c">10</text><rect x="110" y="160" width="60" height="40" rx="6" class="xG"/><text x="140.0" y="184.5" class="b c">20</text><rect x="180" y="160" width="60" height="40" rx="6" class="xG"/><text x="210.0" y="184.5" class="b c">30</text><rect x="250" y="160" width="60" height="40" rx="6" class="xG"/><text x="280.0" y="184.5" class="b c">40</text><text x="340" y="190" class="s">mesmo tamanho</text><text x="40" y="240" class="m b">n.filter(x =&gt; x % 2 === 0)</text><rect x="40" y="250" width="60" height="40" rx="6" class="xO"/><text x="70.0" y="274.5" class="b c">2</text><rect x="110" y="250" width="60" height="40" rx="6" class="xO"/><text x="140.0" y="274.5" class="b c">4</text><text x="200" y="280" class="s">só os que passaram</text><text x="40" y="330" class="m b">n.reduce((soma, x) =&gt; soma + x, 0)</text><rect x="40" y="340" width="60" height="40" rx="6" class="xP"/><text x="70.0" y="364.5" class="b c">10</text><text x="116" y="365" class="s">um único valor: 0+1+2+3+4</text><text x="240.0" y="420" class="n c">Os três devolvem algo novo:</text><text x="240.0" y="438" class="n c">o array n continua igual.</text></svg>