<svg xmlns="http://www.w3.org/2000/svg" width="480" height="386" viewBox="0 0 480 386"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">TRIGGER: o banco reage a um evento</text><rect x="100" y="52" width="280" height="52" rx="6" class="xY"/><text x="240.0" y="74.5" class="m b c">UPDATE produtos</text><text x="240.0" y="92.5" class="m c">SET preco = 50</text><path d="M240,104 L240,124" class="l" marker-end="url(#a)"/><rect x="100" y="124" width="280" height="52" rx="6" class="xB"/><text x="240.0" y="146.5" class="m b c">BEFORE UPDATE</text><text x="240.0" y="164.5" class="s c">pode alterar NEW antes de gravar</text><path d="M240,176 L240,196" class="l" marker-end="url(#a)"/><rect x="180" y="196" width="120" height="36" rx="6" class="xW"/><text x="240.0" y="218.5" class="b c">grava</text><path d="M240,232 L240,252" class="l" marker-end="url(#a)"/><rect x="100" y="252" width="280" height="52" rx="6" class="xG"/><text x="240.0" y="274.5" class="m b c">AFTER UPDATE</text><text x="240.0" y="292.5" class="s c">log, auditoria</text><text x="240.0" y="334" class="m c">OLD.preco = 40 · NEW.preco = 50</text><text x="240.0" y="362" class="n c">INSERT só tem NEW; DELETE só tem OLD.</text></svg>