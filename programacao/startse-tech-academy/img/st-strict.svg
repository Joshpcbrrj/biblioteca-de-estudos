<svg xmlns="http://www.w3.org/2000/svg" width="480" height="304" viewBox="0 0 480 304"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">"use strict": falhas silenciosas viram erro</text><rect x="20" y="56" width="210" height="150" rx="6" class="xR"/><text x="125" y="80" class="b c">sem modo estrito</text><text x="32" y="108" class="m">total = 10;</text><text x="32" y="130" class="m">// cria global</text><text x="32" y="152" class="m">// sem avisar</text><rect x="250" y="56" width="210" height="150" rx="6" class="xG"/><text x="355" y="80" class="b c">com "use strict"</text><text x="262" y="108" class="m">total = 10;</text><text x="262" y="130" class="m">// ReferenceError:</text><text x="262" y="152" class="m">// total não definido</text><text x="20" y="240" class="s">Também proíbe parâmetros duplicados e deixa</text><text x="20" y="260" class="s">this = undefined em função solta.</text><text x="20" y="280" class="s">Módulos ES e classes já são estritos.</text></svg>