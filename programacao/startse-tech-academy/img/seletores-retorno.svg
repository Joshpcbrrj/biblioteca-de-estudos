<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">O que cada seletor devolve</text><rect x="30" y="52" width="420" height="66" rx="6" class="xB"/><text x="44" y="74" class="m b">getElementById('menu')</text><text x="44" y="94" class="">1 elemento ou null</text><text x="44" y="110" class="s">sem o #</text><rect x="30" y="126" width="420" height="66" rx="6" class="xB"/><text x="44" y="148" class="m b">querySelector('.card')</text><text x="44" y="168" class="">o PRIMEIRO que casar, ou null</text><text x="44" y="184" class="s">qualquer seletor CSS</text><rect x="30" y="200" width="420" height="66" rx="6" class="xG"/><text x="44" y="222" class="m b">querySelectorAll('.card')</text><text x="44" y="242" class="">NodeList estática, com forEach</text><text x="44" y="258" class="s">qualquer seletor CSS</text><rect x="30" y="274" width="420" height="66" rx="6" class="xO"/><text x="44" y="296" class="m b">getElementsByClassName('card')</text><text x="44" y="316" class="">HTMLCollection ao vivo</text><text x="44" y="332" class="s">sem forEach</text><rect x="30" y="348" width="420" height="66" rx="6" class="xO"/><text x="44" y="370" class="m b">getElementsByTagName('li')</text><text x="44" y="390" class="">HTMLCollection ao vivo</text><text x="44" y="406" class="s">sem forEach</text><text x="240.0" y="438" class="n c">"Ao vivo": a coleção se atualiza quando o DOM</text><text x="240.0" y="456" class="n c">muda. A NodeList é uma foto do momento.</text></svg>