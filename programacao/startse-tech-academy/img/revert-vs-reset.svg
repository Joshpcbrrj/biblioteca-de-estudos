<svg xmlns="http://www.w3.org/2000/svg" width="480" height="476" viewBox="0 0 480 476"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">git revert × git reset</text><text x="40" y="60" class="b">Histórico original</text><path d="M70,100 L160,100" class="l"/><path d="M160,100 L250,100" class="l"/><circle cx="70" cy="100" r="18" class="xB" style="stroke-width:2"/><text x="70" y="105" class="b c">A</text><circle cx="160" cy="100" r="18" class="xR" style="stroke-width:2"/><text x="160" y="105" class="b c">B</text><circle cx="250" cy="100" r="18" class="xB" style="stroke-width:2"/><text x="250" y="105" class="b c">C</text><rect x="229.0" y="124" width="42" height="22" rx="4" class="xB"/><text x="250" y="140" class="s b c">main</text><text x="40" y="172" class="s">B é o commit com erro.</text><text x="40" y="200" class="b">git revert B</text><path d="M70,240 L160,240" class="l"/><path d="M160,240 L250,240" class="l"/><path d="M250,240 L340,240" class="l"/><circle cx="70" cy="240" r="18" class="xB" style="stroke-width:2"/><text x="70" y="245" class="b c">A</text><circle cx="160" cy="240" r="18" class="xR" style="stroke-width:2"/><text x="160" y="245" class="b c">B</text><circle cx="250" cy="240" r="18" class="xB" style="stroke-width:2"/><text x="250" y="245" class="b c">C</text><circle cx="340" cy="240" r="18" class="xG" style="stroke-width:2"/><text x="340" y="245" class="b c">B⁻¹</text><rect x="319.0" y="264" width="42" height="22" rx="4" class="xB"/><text x="340" y="280" class="s b c">main</text><text x="40" y="312" class="s">Cria um commit que desfaz B. Seguro após o push.</text><text x="40" y="340" class="b">git reset A</text><path d="M70,380 L160,380" class="l"/><path d="M160,380 L250,380" class="l"/><circle cx="70" cy="380" r="18" class="xB" style="stroke-width:2"/><text x="70" y="385" class="b c">A</text><circle cx="160" cy="380" r="18" class="xW d" style="stroke-width:2"/><text x="160" y="385" class="c">B</text><circle cx="250" cy="380" r="18" class="xW d" style="stroke-width:2"/><text x="250" y="385" class="c">C</text><rect x="49.0" y="404" width="42" height="22" rx="4" class="xB"/><text x="70" y="420" class="s b c">main</text><text x="40" y="452" class="s">B e C saem da branch. Só para commits locais.</text></svg>