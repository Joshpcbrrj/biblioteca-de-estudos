<svg xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Bubbling e delegação de eventos</text><rect x="40" y="52" width="400" height="190" rx="6" class="xB"/><text x="56" y="76" class="m b">ul#lista  ← um único listener aqui</text><rect x="80" y="92" width="200" height="36" rx="6" class="xW"/><text x="96" y="115" class="m">li  Item 1</text><rect x="80" y="138" width="200" height="36" rx="6" class="xG"/><text x="96" y="161" class="m">li  Item 2</text><rect x="80" y="184" width="200" height="36" rx="6" class="xW"/><text x="96" y="207" class="m">li  Item 3</text><text x="300" y="161" class="b">← clique</text><path d="M400,200 L400,96" class="l" marker-end="url(#a)"/><text x="400" y="222" class="s c">sobe</text><text x="240.0" y="262" class="m c">li → ul → body → document</text><text x="40" y="300" class="m">lista.addEventListener('click', e =&gt; {</text><text x="40" y="322" class="m">  const item = e.target.closest('li');</text><text x="40" y="344" class="m">  if (!item) return;</text><text x="40" y="366" class="m">  console.log(item.textContent);</text><text x="40" y="388" class="m">});</text><text x="240.0" y="428" class="n c">Funciona até para itens criados depois,</text><text x="240.0" y="446" class="n c">porque o ouvinte está no pai.</text></svg>