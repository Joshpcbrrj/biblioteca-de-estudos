0" height="36" rx="8" class="xG"/><text x="96" y="161" class="m">li  Item 2</text><rect x="80" y="184" width="200" height="36" rx="8" class="xW"/><text x="96" y="207" class="m">li  Item 3</text><text x="300" y="161" class="b">← clique</text><path d="M400,200 L400,96" class="l" marker-end="url(#a)"/><text x="400" y="222" class="s c">sobe</text><text x="240.0" y="262" class="m c">li → ul → body → document</text><text x="40" y="300" class="m">lista.addEventListener('click', e =&gt; {</text><text x="40" y="322" class="m">  const item = e.target.closest('li');</text><text x="40" y="344" class="m">  if (!item) return;</text><text x="40" y="366" class="m">  console.log(item.textContent);</text><text x="40" y="388" class="m">});</text><text x="240.0" y="428" class="n c">Funciona até para itens criados depois,</text><text x="240.0" y="446" class="n c">porque o ouvinte está no pai.</text></svg>