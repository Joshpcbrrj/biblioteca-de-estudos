<svg xmlns="http://www.w3.org/2000/svg" width="480" height="434" viewBox="0 0 480 434"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Closure: a função lembra onde nasceu</text><rect x="30" y="52" width="420" height="190" rx="6" class="xB"/><text x="46" y="76" class="m">function criarContador() {</text><rect x="50" y="90" width="180" height="40" rx="6" class="xO"/><text x="140" y="115" class="m b c">let total = 0</text><text x="46" y="156" class="m">  return () =&gt; ++total;</text><text x="46" y="182" class="m">}</text><text x="246" y="115" class="s">← fica guardada</text><text x="46" y="224" class="n">a função de dentro leva total junto</text><text x="40" y="276" class="m">const c = criarContador();</text><text x="40" y="302" class="m">c();  // 1</text><text x="40" y="326" class="m">c();  // 2</text><text x="40" y="350" class="m">c.total  // undefined</text><path d="M200,314 L330,314 L330,130" class="l" marker-end="url(#a)"/><text x="342" y="290" class="s">cada chamada</text><text x="342" y="308" class="s">usa o mesmo</text><text x="342" y="326" class="s">total</text><text x="240.0" y="392" class="n c">criarContador já terminou, mas total continua</text><text x="240.0" y="410" class="n c">vivo e privado dentro da closure.</text></svg>