<svg xmlns="http://www.w3.org/2000/svg" width="480" height="550" viewBox="0 0 480 550"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Event loop: uma thread, várias tarefas</text><rect x="30" y="52" width="200" height="150" rx="6" class="xB"/><text x="130" y="74" class="b c">Call stack</text><text x="130" y="92" class="s c">o que roda agora</text><rect x="50" y="104" width="160" height="34" rx="6" class="xW"/><text x="130.0" y="125.5" class="m c">console.log('fim')</text><rect x="50" y="146" width="160" height="34" rx="6" class="xW"/><text x="130.0" y="167.5" class="m c">main()</text><rect x="250" y="52" width="200" height="150" rx="6" class="xY"/><text x="350" y="74" class="b c">APIs do ambiente</text><text x="350" y="92" class="s c">navegador ou Node</text><text x="266" y="120" class="m">setTimeout 2s</text><text x="266" y="144" class="m">fetch("/api")</text><text x="266" y="168" class="m">fs.readFile</text><path d="M230,128 L250,128" class="l" marker-end="url(#a)"/><text x="240" y="220" class="b c">1</text><rect x="250" y="240" width="200" height="80" rx="6" class="xP"/><text x="350" y="262" class="b c">Microtasks</text><text x="350" y="282" class="m c">then · catch · await</text><text x="350" y="302" class="s c b">prioridade ALTA</text><rect x="250" y="336" width="200" height="80" rx="6" class="xO"/><text x="350" y="358" class="b c">Fila de tarefas</text><text x="350" y="378" class="m c">setTimeout · eventos</text><text x="350" y="398" class="s c">I/O concluído</text><path d="M350,202 L350,240" class="l" marker-end="url(#a)"/><text x="362" y="226" class="b">2</text><path d="M250,280 L130,280 L130,202" class="l" marker-end="url(#a)"/><path d="M250,376 L110,376 L110,202" class="l" marker-end="url(#a)"/><text x="140" y="300" class="b">3</text><rect x="30" y="436" width="420" height="96" rx="6" class="xW"/><text x="46" y="460" class="s">1. o lento vai para o ambiente</text><text x="46" y="480" class="s">2. ao terminar, o callback entra numa fila</text><text x="46" y="500" class="s">3. com a stack vazia, o loop esvazia as</text><text x="46" y="520" class="s">   microtasks e depois pega 1 tarefa</text></svg>