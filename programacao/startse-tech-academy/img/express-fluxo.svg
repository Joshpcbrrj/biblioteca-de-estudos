<svg xmlns="http://www.w3.org/2000/svg" width="480" height="482" viewBox="0 0 480 482"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Express: o caminho de uma requisição</text><rect x="60" y="52" width="360" height="52" rx="6" class="xY"/><text x="240.0" y="74.5" class="m b c">requisição</text><text x="240.0" y="92.5" class="s c">GET /produtos/42</text><path d="M240,104 L240,122" class="l" marker-end="url(#a)"/><rect x="60" y="122" width="360" height="52" rx="6" class="xB"/><text x="240.0" y="144.5" class="m b c">express.json()</text><text x="240.0" y="162.5" class="s c">middleware: lê o corpo JSON</text><path d="M240,174 L240,192" class="l" marker-end="url(#a)"/><rect x="60" y="192" width="360" height="52" rx="6" class="xB"/><text x="240.0" y="214.5" class="m b c">cors()</text><text x="240.0" y="232.5" class="s c">middleware: libera origens</text><path d="M240,244 L240,262" class="l" marker-end="url(#a)"/><rect x="60" y="262" width="360" height="52" rx="6" class="xG"/><text x="240.0" y="284.5" class="m b c">app.get("/produtos/:id")</text><text x="240.0" y="302.5" class="s c">rota: busca e responde</text><path d="M240,314 L240,332" class="l" marker-end="url(#a)"/><rect x="60" y="332" width="360" height="52" rx="6" class="xP"/><text x="240.0" y="354.5" class="m b c">res.status(200).json(...)</text><text x="240.0" y="372.5" class="s c">resposta enviada</text><rect x="40" y="406" width="400" height="58" rx="6" class="xR"/><text x="56" y="430" class="s">Nenhuma rota casou? 404.</text><text x="56" y="450" class="s">Erro lançado? vai ao middleware de erro (500).</text></svg>