<svg xmlns="http://www.w3.org/2000/svg" width="480" height="344" viewBox="0 0 480 344"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Subconsulta: a de dentro roda primeiro</text><rect x="20" y="56" width="440" height="128" rx="6" class="xB"/><text x="36" y="82" class="m">SELECT nome, preco</text><text x="36" y="104" class="m">FROM produtos</text><text x="36" y="126" class="m">WHERE preco &gt;</text><rect x="60" y="134" width="380" height="36" rx="6" class="xO"/><text x="250" y="157" class="m c">(SELECT AVG(preco) FROM produtos)</text><rect x="20" y="214" width="200" height="52" rx="6" class="xO"/><text x="120.0" y="236.5" class="b c">1. calcula a média</text><text x="120.0" y="254.5" class="s c">ex.: 40,00</text><rect x="260" y="214" width="200" height="52" rx="6" class="xB"/><text x="360.0" y="236.5" class="b c">2. filtra</text><text x="360.0" y="254.5" class="s c">preco &gt; 40,00</text><path d="M220,240 L260,240" class="l" marker-end="url(#a)"/><text x="20" y="300" class="s">Escalar → um valor · IN → uma lista</text><text x="20" y="320" class="s">EXISTS → existe ou não · no FROM → tabela</text></svg>