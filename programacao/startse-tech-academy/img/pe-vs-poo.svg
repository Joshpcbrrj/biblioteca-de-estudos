<svg xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Estruturada × orientada a objetos</text><text x="40" y="62" class="b">Estruturada: dados e funções separados</text><rect x="30" y="72" width="180" height="110" rx="6" class="xO"/><text x="120" y="94" class="b c">dados</text><text x="46" y="118" class="m">saldo = 1000</text><text x="46" y="138" class="m">titular = 'Ana'</text><text x="46" y="158" class="m">limite = 500</text><rect x="270" y="72" width="180" height="110" rx="6" class="xB"/><text x="360" y="94" class="b c">funções</text><text x="280" y="118" class="m">depositar(s, v)</text><text x="280" y="138" class="m">sacar(s, v)</text><text x="280" y="158" class="m">extrato(s)</text><path d="M270,127 L210,127" class="l" marker-end="url(#a)" marker-start="url(#a)"/><text x="240.0" y="204" class="n c">qualquer função mexe em qualquer dado</text><text x="40" y="244" class="b">POO: o objeto junta dados e comportamento</text><rect x="30" y="254" width="420" height="170" rx="6" class="xG"/><text x="46" y="278" class="m b">objeto conta (classe ContaBancaria)</text><rect x="46" y="290" width="180" height="120" rx="6" class="xW"/><text x="136" y="310" class="b c">atributos</text><text x="62" y="334" class="m">#saldo</text><text x="62" y="356" class="m">titular</text><text x="62" y="378" class="m">limite</text><rect x="254" y="290" width="180" height="120" rx="6" class="xW"/><text x="344" y="310" class="b c">métodos</text><text x="268" y="334" class="m">depositar(v)</text><text x="268" y="356" class="m">sacar(v)</text><text x="268" y="378" class="m">extrato()</text><text x="240.0" y="446" class="n c">os dados só mudam pelos métodos do objeto</text></svg>