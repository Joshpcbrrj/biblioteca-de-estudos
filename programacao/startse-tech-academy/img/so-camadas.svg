<svg xmlns="http://www.w3.org/2000/svg" width="480" height="462" viewBox="0 0 480 462"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Onde fica o sistema operacional</text><rect x="70" y="50" width="340" height="56" rx="6" class="xG"/><text x="240.0" y="74.5" class="b c">Aplicativos</text><text x="240.0" y="92.5" class="s c">navegador, VS Code, jogos</text><path d="M240,106 L240,126" class="l" marker-end="url(#a)" marker-start="url(#a)"/><rect x="70" y="126" width="340" height="56" rx="6" class="xY"/><text x="240.0" y="150.5" class="b c">Chamadas de sistema</text><text x="240.0" y="168.5" class="s c">abrir arquivo, enviar dados</text><path d="M240,182 L240,202" class="l" marker-end="url(#a)" marker-start="url(#a)"/><rect x="70" y="202" width="340" height="56" rx="6" class="xB"/><text x="240.0" y="226.5" class="b c">Kernel</text><text x="240.0" y="244.5" class="s c">processos, memória, arquivos</text><path d="M240,258 L240,278" class="l" marker-end="url(#a)" marker-start="url(#a)"/><rect x="70" y="278" width="340" height="56" rx="6" class="xP"/>