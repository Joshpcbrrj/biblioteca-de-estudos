<svg xmlns="http://www.w3.org/2000/svg" width="480" height="512" viewBox="0 0 480 512"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Os estados de um arquivo no Git</text><rect x="150" y="56" width="180" height="56" rx="6" class="xY"/><text x="240.0" y="80.5" class="b c">Untracked</text><text x="240.0" y="98.5" class="s c">não rastreado</text><rect x="150" y="166" width="180" height="56" rx="6" class="xG"/><text x="240.0" y="190.5" class="b c">Staged</text><text x="240.0" y="208.5" class="s c">preparado</text><rect x="150" y="276" width="180" height="56" rx="6" class="xB"/><text x="240.0" y="300.5" class="b c">Unmodified</text><text x="240.0" y="318.5" class="s c">igual ao commit</text><rect x="150" y="386" width="180" height="56" rx="6" class="xO"/><text x="240.0" y="410.5" class="b c">Modified</text><text x="240.0" y="428.5" class="s c">alterado</text><path d="M240,112 L240,166" class="l" marker-end="url(#a)"/><text x="250" y="144" class="m">git add</text><path d="M240,222 L240,276" class="l" marker-end="url(#a)"/><text x="250" y="254" class="m">git commit</text><path d="M240,332 L240,386" class="l" marker-end="url(#a)"/><text x="250" y="364" class="s">editar o arquivo</text><path d="M330,414 L400,414 L400,194 L330,194" class="l" marker-end="url(#a)"/><text x="408" y="300" class="m">git add</text><path d="M150,414 L120,414 L120,304 L150,304" class="l" marker-end="url(#a)"/><text x="8" y="364" class="m">git restore</text><text x="240.0" y="470" class="s c">git restore --staged tira do Staged</text><text x="240.0" y="488" class="s c">git rm --cached volta a Untracked</text></svg>