<svg xmlns="http://www.w3.org/2000/svg" width="480" height="314" viewBox="0 0 480 314"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">String é imutável</text><text x="240.0" y="66" class="m c">String s = "java";  String t = s.toUpperCase();</text><rect x="30" y="96" width="110" height="40" rx="6" class="xB"/><text x="85.0" y="120.5" class="m b c">s</text><rect x="30" y="170" width="110" height="40" rx="6" class="xB"/><text x="85.0" y="194.5" class="m b c">t</text><rect x="270" y="96" width="180" height="40" rx="6" class="xG"/><text x="360.0" y="120.5" class="m b c">"java"</text><rect x="270" y="170" width="180" height="40" rx="6" class="xO"/><text x="360.0" y="194.5" class="m b c">"JAVA" (novo)</text><path d="M140,116 L270,116" class="l" marker-end="url(#a)"/><path d="M140,190 L270,190" class="l" marker-end="url(#a)"/><text x="30" y="250" class="s">O método não altera "java": cria outra String.</text><text x="30" y="270" class="s">Por isso s.toUpperCase(); sozinho não muda s;</text><text x="30" y="290" class="s">é preciso guardar o resultado: s = s.toUpperCase();</text></svg>