"auto-start-reverse"><path d="M1,1L9,5L1,9" fill="none" stroke="#7A7F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="240.0" y="30" class="t c">String é imutável</text><rect x="200.0" y="38" width="80" height="4" rx="2" fill="url(#gT0)"/><text x="240.0" y="66" class="m c">String s = "java";  String t = s.toUpperCase();</text><rect x="32" y="99" width="110" height="40" rx="12" class="sh"/><rect x="30" y="96" width="110" height="40" rx="12" class="xB"/><text x="85.0" y="120.5" class="m b c">s</text><rect x="32" y="173" width="110" height="40" rx="12" class="sh"/><rect x="30" y="170" width="110" height="40" rx="12" class="xB"/><text x="85.0" y="194.5" class="m b c">t</text><rect x="272" y="99" width="180" height="40" rx="12" class="sh"/><rect x="270" y="96" width="180" height="40" rx="12" class="xG"/><text x="360.0" y="120.5" class="m b c">"java"</text><rect x="272" y="173" width="180" height="40" rx="12" class="sh"/><rect x="270" y="170" width="180" height="40" rx="12" class="xO"/><text x="360.0" y="194.5" class="m b c">"JAVA" (novo)</text><path d="M140,116 L270,116" class="l" marker-end="url(#a)"/><path d="M140,190 L270,190" class="l" marker-end="url(#a)"/><text x="30" y="250" class="s">O método não altera "java": cria outra String.</text><text x="30" y="270" class="s">Por isso s.toUpperCase(); sozinho não muda s;</text><text x="30" y="290" class="s">é preciso guardar o resultado: s = s.toUpperCase();</text></svg>