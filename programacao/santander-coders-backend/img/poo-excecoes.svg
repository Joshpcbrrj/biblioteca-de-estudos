<svg xmlns="http://www.w3.org/2000/svg" width="480" height="396" viewBox="0 0 480 396"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Hierarquia de exceções</text><rect x="170" y="52" width="140" height="40" rx="6" class="xY"/><text x="240.0" y="76.5" class="m b c">Throwable</text><rect x="30" y="130" width="160" height="52" rx="6" class="xR"/><text x="110.0" y="152.5" class="m b c">Error</text><text x="110.0" y="170.5" class="s c">falhas da JVM</text><rect x="290" y="130" width="160" height="52" rx="6" class="xO"/><text x="370.0" y="152.5" class="m b c">Exception</text><text x="370.0" y="170.5" class="s c">checadas</text><rect x="250" y="220" width="210" height="52" rx="6" class="xP"/><text x="355.0" y="242.5" class="m b c">RuntimeException</text><text x="355.0" y="260.5" class="s c">não checadas</text><path d="M240,92 L240,110 L110,110 L110,130 M240,110 L370,110 L370,130 M370,182 L370,220" class="l"/><text x="30" y="212" class="m">OutOfMemoryError</text><text x="30" y="230" class="m">StackOverflowError</text><text x="30" y="300" class="s">Checadas (o compilador obriga a tratar):</text><text x="30" y="318" class="s">  IOException, SQLException</text><text x="30" y="336" class="s">Não checadas (erros de programação):</text><text x="30" y="354" class="s">  NullPointerException, IllegalArgumentException,</text><text x="30" y="372" class="s">  ArithmeticException, ArrayIndexOutOfBounds...</text></svg>