<svg xmlns="http://www.w3.org/2000/svg" width="480" height="350" viewBox="0 0 480 350"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Laços aninhados: o interno roda inteiro</text><text x="240.0" y="66" class="m c">for i = 1..3  {  for j = 1..3  { i × j } }</text><text x="70" y="96" class="m b c">i \ j</text><text x="150" y="96" class="m b c">j = 1</text><text x="240" y="96" class="m b c">j = 2</text><text x="330" y="96" class="m b c">j = 3</text><text x="70" y="134" class="m b c">i = 1</text><rect x="110" y="110" width="80" height="44" rx="6" class="xB"/><text x="150.0" y="136.5" class="m b c">1</text><rect x="200" y="110" width="80" height="44" rx="6" class="xB"/><text x="240.0" y="136.5" class="m b c">2</text><rect x="290" y="110" width="80" height="44" rx="6" class="xB"/><text x="330.0" y="136.5" class="m b c">3</text><text x="70" y="186" class="m b c">i = 2</text><rect x="110" y="162" width="80" height="44" rx="6" class="xG"/><text x="150.0" y="188.5" class="m b c">2</text><rect x="200" y="162" width="80" height="44" rx="6" class="xG"/><text x="240.0" y="188.5" class="m b c">4</text><rect x="290" y="162" width="80" height="44" rx="6" class="xG"/><text x="330.0" y="188.5" class="m b c">6</text><text x="70" y="238" class="m b c">i = 3</text><rect x="110" y="214" width="80" height="44" rx="6" class="xB"/><text x="150.0" y="240.5" class="m b c">3</text><rect x="200" y="214" width="80" height="44" rx="6" class="xB"/><text x="240.0" y="240.5" class="m b c">6</text><rect x="290" y="214" width="80" height="44" rx="6" class="xB"/><text x="330.0" y="240.5" class="m b c">9</text><text x="20" y="286" class="s">Ordem: (1,1) (1,2) (1,3) (2,1) (2,2) ... (3,3)</text><text x="20" y="306" class="s">3 voltas de fora × 3 de dentro = 9 execuções.</text><text x="20" y="326" class="s">Com n × n elementos, o custo é O(n²).</text></svg>