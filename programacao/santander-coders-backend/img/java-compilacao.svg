<svg xmlns="http://www.w3.org/2000/svg" width="480" height="564" viewBox="0 0 480 564"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Do código-fonte à execução</text><rect x="80" y="52" width="320" height="54" rx="6" class="xB"/><text x="240.0" y="75.5" class="m b c">Main.java</text><text x="240.0" y="93.5" class="s c">código-fonte (você escreve)</text><path d="M240,106 L240,126" class="l" marker-end="url(#a)"/><rect x="80" y="126" width="320" height="54" rx="6" class="xO"/><text x="240.0" y="149.5" class="m b c">javac</text><text x="240.0" y="167.5" class="s c">compilador do JDK</text><path d="M240,180 L240,200" class="l" marker-end="url(#a)"/><rect x="80" y="200" width="320" height="54" rx="6" class="xP"/><text x="240.0" y="223.5" class="m b c">Main.class</text><text x="240.0" y="241.5" class="s c">bytecode (igual em todo sistema)</text><path d="M240,254 L240,274" class="l" marker-end="url(#a)"/><rect x="80" y="274" width="320" height="54" rx="6" class="xO"/><text x="240.0" y="297.5" class="m b c">JVM</text><text x="240.0" y="315.5" class="s c">máquina virtual do JRE</text><path d="M240,328 L240,348" class="l" marker-end="url(#a)"/><rect x="80" y="348" width="320" height="54" rx="6" class="xG"/><text x="240.0" y="371.5" class="b c">Windows · Linux · macOS</text><text x="240.0" y="389.5" class="s c">o mesmo .class roda em todos</text><text x="240.0" y="436" class="n c">"Escreva uma vez, rode em qualquer lugar."</text><rect x="30" y="454" width="420" height="92" rx="6" class="xY"/><text x="46" y="478" class="s">JDK = ferramentas de desenvolvimento + JRE</text><text x="46" y="500" class="s">JRE = JVM + bibliotecas padrão</text><text x="46" y="522" class="s">Para programar, instale só o JDK.</text></svg>