<svg xmlns="http://www.w3.org/2000/svg" width="480" height="428" viewBox="0 0 480 428"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Função: entrada → processamento → saída</text><rect x="20" y="90" width="120" height="60" rx="6" class="xB"/><text x="80.0" y="116.5" class="m b c">a = 5</text><text x="80.0" y="134.5" class="m c">b = 3</text><text x="80" y="170" class="s c">parâmetros</text><path d="M140,120 L180,120" class="l" marker-end="url(#a)"/><rect x="180" y="70" width="140" height="100" rx="6" class="xO"/><text x="250.0" y="116.5" class="m b c">f_soma(a, b)</text><text x="250.0" y="134.5" class="m c">retornar a + b</text><path d="M320,120 L360,120" class="l" marker-end="url(#a)"/><rect x="360" y="90" width="100" height="60" rx="6" class="xG"/><text x="410.0" y="124.5" class="b c">8</text><text x="410" y="170" class="s c">retorno</text><text x="40" y="220" class="m">funcao f_soma(a, b)</text><text x="40" y="242" class="m">  retornar a + b</text><text x="40" y="264" class="m">fim funcao</text><text x="40" y="286" class="m"></text><text x="40" y="308" class="m">f_soma(5, 3) -&gt; resultado</text><text x="40" y="330" class="m">// mostra 8</text><text x="40" y="352" class="m">mostrar resultado</text><text x="240.0" y="404" class="n c">Escrita uma vez, chamada quantas vezes for preciso.</text></svg>