<svg xmlns="http://www.w3.org/2000/svg" width="480" height="512" viewBox="0 0 480 512"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">HTTP: pedido e resposta</text><rect x="20" y="52" width="130" height="44" rx="6" class="xB"/><text x="85.0" y="70.5" class="b c">cliente</text><text x="85.0" y="88.5" class="s c">navegador, app</text><rect x="330" y="52" width="130" height="44" rx="6" class="xG"/><text x="395.0" y="70.5" class="b c">servidor</text><text x="395.0" y="88.5" class="s c">sua API Java</text><path d="M150,66 L330,66" class="l" marker-end="url(#a)"/><text x="240" y="60" class="s c">requisição</text><path d="M330,84 L150,84" class="l" marker-end="url(#a)"/><text x="240" y="110" class="s c">resposta</text><rect x="20" y="128" width="440" height="150" rx="6" class="xB"/><text x="34" y="150" class="b">Requisição</text><text x="34" y="176" class="m">GET /produtos/7 HTTP/1.1</text><text x="34" y="196" class="m">Host: api.exemplo.com</text><text x="34" y="216" class="m">Accept: application/json</text><text x="34" y="236" class="m"></text><text