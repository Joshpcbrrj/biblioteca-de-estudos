<svg xmlns="http://www.w3.org/2000/svg" width="480" height="424" viewBox="0 0 480 424"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">CDN: o conteúdo perto de quem pede</text><rect x="170" y="52" width="140" height="52" rx="6" class="xP"/><text x="240.0" y="74.5" class="b c">servidor de origem</text><text x="240.0" y="92.5" class="s c">São Paulo</text><rect x="20" y="170" width="140" height="48" rx="6" class="xO"/><text x="90.0" y="190.5" class="b c">borda</text><text x="90.0" y="208.5" class="s c">Recife</text><path d="M240,104 L90,170" class="l d" marker-end="url(#a)"/><rect x="170" y="170" width="140" height="48" rx="6" class="xO"/><text x="240.0" y="190.5" class="b c">borda</text><text x="240.0" y="208.5" class="s c">Porto Alegre</text><path d="M240,104 L240,170" class="l d" marker-end="url(#a)"/><rect x="320" y="170" width="140" height="48" rx="6" class="xO"/><text x="390.0" y="190.5" class="b c">borda</text><text x="390.0" y="208.5" class="s c">Lisboa</text><path d="M240,104 L390,170" class="l d" marker-end="url(#a)"/><rect x="40" y="272" width="100" height="40" rx="6" class="xB"/><text x="90.0" y="296.5" class="b c">usuário</text><path d="M90,272 L90,218" class="l" marker-end="url(#a)"/><rect x="190" y="272" width="100" height="40" rx="6" class="xB"/><text x="240.0" y="296.5" class="b c">usuário</text><path d="M240,272 L240,218" class="l" marker-end="url(#a)"/><rect x="340" y="272" width="100" height="40" rx="6" class="xB"/><text x="390.0" y="296.5" class="b c">usuário</text><path d="M390,272 L390,218" class="l" marker-end="url(#a)"/><text x="120" y="126" class="s c">cópias em cache</text><text x="30" y="346" class="s">Cada usuário é atendido pelo servidor de borda</text><text x="30" y="364" class="s">mais próximo: menos distância, menos latência.</text><text x="30" y="382" class="s">A origem só é consultada quando o cache não tem</text><text x="30" y="400" class="s">o arquivo ou ele expirou.</text></svg>