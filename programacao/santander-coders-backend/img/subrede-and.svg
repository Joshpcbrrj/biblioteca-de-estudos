<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Endereço de rede = IP AND máscara</text><rect x="20" y="56" width="440" height="64" rx="6" class="xB"/><text x="34" y="80" class="b">IP</text><text x="446" y="80" class="m b r">192.168.10.1</text><text x="240.0" y="104" class="m c">11000000.10101000.00001010.00000001</text><rect x="20" y="132" width="440" height="64" rx="6" class="xO"/><text x="34" y="156" class="b">máscara /24</text><text x="446" y="156" class="m b r">255.255.255.0</text><text x="240.0" y="180" class="m c">11111111.11111111.11111111.00000000</text><rect x="20" y="208" width="440" height="64" rx="6" class="xG"/><text x="34" y="232" class="b">rede</text><text x="446" y="232" class="m b r">192.168.10.0</text><text x="240.0" y="256" class="m c">11000000.10101000.00001010.00000000</text><text x="240.0" y="292" class="s c">AND: 1 e 1 = 1; qualquer outro caso = 0</text><rect x="20" y="310" width="440" height="112" rx="6" class="xW"/><text x="34" y="334" class="s">24 bits de rede + 8 bits de host (2⁸ = 256)</text><text x="34" y="356" class="s">rede: 192.168.10.0 (todos os bits de host em 0)</text><text x="34" y="378" class="s">broadcast: 192.168.10.255 (todos em 1)</text><text x="34" y="400" class="s">hosts úteis: .1 a .254 = 254 endereços</text></svg>