<svg xmlns="http://www.w3.org/2000/svg" width="480" height="496" viewBox="0 0 480 496"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Os três cabos, em corte</text><rect x="20" y="60" width="440" height="130" rx="6" class="xW"/><text x="36" y="84" class="b">Par trançado (cobre)</text><circle cx="90" cy="140" r="40" fill="#E5E7EB" stroke="#6B7280" stroke-width="2"/><circle cx="75" cy="125" r="10" fill="#FDBA74" stroke="#4B5563" stroke-width="2"/><circle cx="105" cy="125" r="10" fill="#86EFAC" stroke="#4B5563" stroke-width="2"/><circle cx="75" cy="155" r="10" fill="#93C5FD" stroke="#4B5563" stroke-width="2"/><circle cx="105" cy="155" r="10" fill="#D6D3D1" stroke="#4B5563" stroke-width="2"/><text x="150" y="116" class="s">4 pares de fios torcidos</text><text x="150" y="134" class="s">torção reduz interferência</text><text x="150" y="152" class="s">conector RJ-45 · até 100 m</text><text x="150" y="170" class="s">Cat 5e, Cat 6, Cat 6a...</text><rect x="20" y="204" width="440" height="130" rx="6" class="xW"/><text x="36" y="228" class="b">Coaxial (cobre)</text><circle cx="90" cy="284" r="40" fill="#374151" stroke="#111827" stroke-width="2"/><circle cx="90" cy="284" r="32" fill="#D1D5DB" stroke="#6B7280" stroke-width="2"/><circle cx="90" cy="284" r="24" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/><circle cx="90" cy="284" r="7" fill="#D97706" stroke="#92400E" stroke-width="2"/><text x="150" y="260" class="s">fio central de cobre</text><text x="150" y="278" class="s">isolante + malha de blindagem</text><text x="150" y="296" class="s">conector F ou BNC</text><text x="150" y="314" class="s">TV a cabo, internet por cabo</text><rect x="20" y="348" width="440" height="130" rx="6" class="xW"/><text x="36" y="372" class="b">Fibra óptica (luz)</text><circle cx="90" cy="428" r="40" fill="#FDE68A" stroke="#B45309" stroke-width="2"/><circle cx="90" cy="428" r="26" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><circle cx="90" cy="428" r="9" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/><text x="150" y="404" class="s">núcleo de vidro leva a luz</text><text x="150" y="422" class="s">casca reflete e mantém a luz</text><text x="150" y="440" class="s">imune a interferência elétrica</text><text x="150" y="458" class="s">quilômetros sem repetidor</text></svg>