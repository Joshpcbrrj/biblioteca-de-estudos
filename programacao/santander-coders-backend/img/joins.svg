<svg xmlns="http://www.w3.org/2000/svg" width="480" height="412" viewBox="0 0 480 412"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Tipos de JOIN</text><defs><clipPath id="cinner"><circle cx="110" cy="100" r="36"/></clipPath></defs><circle cx="150" cy="100" r="36" fill="#93C5FD" clip-path="url(#cinner)"/><circle cx="110" cy="100" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><circle cx="150" cy="100" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><text x="96" y="105" class="b c">A</text><text x="164" y="105" class="b c">B</text><text x="130" y="156" class="m b c">INNER JOIN</text><text x="130" y="174" class="s c">só o que casa nos dois</text><defs><clipPath id="cleft"><circle cx="330" cy="100" r="36"/></clipPath></defs><circle cx="330" cy="100" r="36" fill="#93C5FD"/><circle cx="370" cy="100" r="36" fill="#93C5FD" clip-path="url(#cleft)"/><circle cx="330" cy="100" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><circle cx="370" cy="100" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><text x="316" y="105" class="b c">A</text><text x="384" y="105" class="b c">B</text><text x="350" y="156" class="m b c">LEFT JOIN</text><text x="350" y="174" class="s c">tudo de A e o que casa</text><defs><clipPath id="cright"><circle cx="110" cy="250" r="36"/></clipPath></defs><circle cx="150" cy="250" r="36" fill="#93C5FD"/><circle cx="150" cy="250" r="36" fill="#93C5FD" clip-path="url(#cright)"/><circle cx="110" cy="250" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><circle cx="150" cy="250" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><text x="96" y="255" class="b c">A</text><text x="164" y="255" class="b c">B</text><text x="130" y="306" class="m b c">RIGHT JOIN</text><text x="130" y="324" class="s c">tudo de B e o que casa</text><defs><clipPath id="cfull"><circle cx="330" cy="250" r="36"/></clipPath></defs><circle cx="330" cy="250" r="36" fill="#93C5FD"/><circle cx="370" cy="250" r="36" fill="#93C5FD"/><circle cx="370" cy="250" r="36" fill="#93C5FD" clip-path="url(#cfull)"/><circle cx="330" cy="250" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><circle cx="370" cy="250" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><text x="316" y="255" class="b c">A</text><text x="384" y="255" class="b c">B</text><text x="350" y="306" class="m b c">FULL JOIN</text><text x="350" y="324" class="s c">tudo dos dois</text><text x="240.0" y="370" class="n c">Sem correspondência, o outro lado vem NULL.</text><text x="240.0" y="388" class="n c">MySQL não tem FULL JOIN: use LEFT UNION RIGHT.</text></svg>