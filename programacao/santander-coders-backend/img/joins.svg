"auto-start-reverse"><path d="M1,1L9,5L1,9" fill="none" stroke="#7A7F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="240.0" y="30" class="t c">Tipos de JOIN</text><rect x="200.0" y="38" width="80" height="4" rx="2" fill="url(#gT0)"/><defs><clipPath id="cinner"><circle cx="110" cy="100" r="36"/></clipPath></defs><circle cx="150" cy="100" r="36" fill="#93C5FD" clip-path="url(#cinner)"/><circle cx="110" cy="100" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><circle cx="150" cy="100" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><text x="96" y="105" class="b c">A</text><text x="164" y="105" class="b c">B</text><text x="130" y="156" class="m b c">INNER JOIN</text><text x="130" y="174" class="s c">só o que casa nos dois</text><defs><clipPath id="cleft"><circle cx="330" cy="100" r="36"/></clipPath></defs><circle cx="330" cy="100" r="36" fill="#93C5FD"/><circle cx="370" cy="100" r="36" fill="#93C5FD" clip-path="url(#cleft)"/><circle cx="330" cy="100" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><circle cx="370" cy="100" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><text x="316" y="105" class="b c">A</text><text x="384" y="105" class="b c">B</text><text x="350" y="156" class="m b c">LEFT JOIN</text><text x="350" y="174" class="s c">tudo de A e o que casa</text><defs><clipPath id="cright"><circle cx="110" cy="250" r="36"/></clipPath></defs><circle cx="150" cy="250" r="36" fill="#93C5FD"/><circle cx="150" cy="250" r="36" fill="#93C5FD" clip-path="url(#cright)"/><circle cx="110" cy="250" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><circle cx="150" cy="250" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><text x="96" y="255" class="b c">A</text><text x="164" y="255" class="b c">B</text><text x="130" y="306" class="m b c">RIGHT JOIN</text><text x="130" y="324" class="s c">tudo de B e o que casa</text><defs><clipPath id="cfull"><circle cx="330" cy="250" r="36"/></clipPath></defs><circle cx="330" cy="250" r="36" fill="#93C5FD"/><circle cx="370" cy="250" r="36" fill="#93C5FD"/><circle cx="370" cy="250" r="36" fill="#93C5FD" clip-path="url(#cfull)"/><circle cx="330" cy="250" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><circle cx="370" cy="250" r="36" fill="none" stroke="#2563EB" stroke-width="2"/><text x="316" y="255" class="b c">A</text><text x="384" y="255" class="b c">B</text><text x="350" y="306" class="m b c">FULL JOIN</text><text x="350" y="324" class="s c">tudo dos dois</text><text x="240.0" y="370" class="n c">Sem correspondência, o outro lado vem NULL.</text><text x="240.0" y="388" class="n c">MySQL não tem FULL JOIN: use LEFT UNION RIGHT.</text></svg>