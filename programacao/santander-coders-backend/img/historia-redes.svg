"auto-start-reverse"><path d="M1,1L9,5L1,9" fill="none" stroke="#7A7F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="240.0" y="30" class="t c">Da ARPANET à internet de hoje</text><rect x="200.0" y="38" width="80" height="4" rx="2" fill="url(#gT0)"/><circle cx="90" cy="68" r="7" fill="#374151"/><text x="76" y="73" class="s b r">1969</text><rect x="112" y="52" width="348" height="60" rx="12" class="xB"/><text x="124" y="72" class="b">ARPANET</text><text x="124" y="90" class="s">4 computadores ligados por</text><text x="124" y="106" class="s">comutação de pacotes</text><circle cx="90" cy="138" r="7" fill="#374151"/><text x="76" y="143" class="s b r">1974</text><rect x="112" y="122" width="348" height="60" rx="12" class="xG"/><text x="124" y="142" class="b">TCP/IP proposto</text><text x="124" y="160" class="s">Cerf e Kahn descrevem</text><text x="124" y="176" class="s">a "rede de redes"</text><circle cx="90" cy="208" r="7" fill="#374151"/><text x="76" y="213" class="s b r">1983</text><rect x="112" y="192" width="348" height="60" rx="12" class="xO"/><text x="124" y="212" class="b">ARPANET adota TCP/IP</text><text x="124" y="230" class="s">nasce a internet como</text><text x="124" y="246" class="s">a conhecemos</text><circle cx="90" cy="278" r="7" fill="#374151"/><text x="76" y="283" class="s b r">1985</text><rect x="112" y="262" width="348" height="60" rx="12" class="xP"/><text x="124" y="282" class="b">NSFNET</text><text x="124" y="300" class="s">liga universidades dos EUA</text><text x="124" y="316" class="s">e vira a espinha dorsal</text><circle cx="90" cy="348" r="7" fill="#374151"/><text x="76" y="353" class="s b r">1991</text><rect x="112" y="332" width="348" height="60" rx="12" class="xB"/><text x="124" y="352" class="b">World Wide Web</text><text x="124" y="370" class="s">páginas e links (HTTP, HTML)</text><text x="124" y="386" class="s">abrem a rede ao público</text><circle cx="90" cy="418" r="7" fill="#374151"/><text x="76" y="423" class="s b r">2000+</text><rect x="112" y="402" width="348" height="60" rx="12" class="xG"/><text x="124" y="422" class="b">Wi-Fi, 3G/4G/5G</text><text x="124" y="440" class="s">conexão em todo lugar,</text><text x="124" y="456" class="s">bilhões de dispositivos</text><path d="M90,68 L90,446" class="l"/></svg>