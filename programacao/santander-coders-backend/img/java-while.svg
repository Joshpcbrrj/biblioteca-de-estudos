<svg xmlns="http://www.w3.org/2000/svg" width="480" height="462" viewBox="0 0 480 462"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">while: testa antes de cada volta</text><rect x="110" y="52" width="180" height="38" rx="6" class="xB"/><text x="200.0" y="75.5" class="m b c">int c = 0;</text><path d="M200,90 L200,108" class="l" marker-end="url(#a)"/><polygon points="200,108 285.0,136.0 200,164 115.0,136.0" class="xP"/><text x="200" y="141.0" class="m b c">c &lt; 5 ?</text><rect x="110" y="190" width="180" height="58" rx="6" class="xO"/><text x="200.0" y="215.5" class="m b c">println(c);</text><text x="200.0" y="233.5" class="m c">c++;</text><path d="M200,164 L200,190" class="l" marker-end="url(#a)"/><text x="210" y="182" class="s">true</text><path d="M110,219 L40,219 L40,136 L115,136" class="l" marker-end="url(#a)"/><path d="M285,136 L360,136 L360,280" class="l" marker-end="url(#a)"/><text x="300" y="128" class="s">false</text><rect x="300" y="280" width="120" height="34" rx="17" class="xG"/><text x="360" y="302" class="b c">fim do laço</text><rect x="20" y="336" width="440" height="108" rx="6" class="xW"/><text x="36" y="358" class="b">Teste de mesa</text><text x="36" y="382" class="m">c = 0 → mostra 0      c = 3 → mostra 3</text><text x="36" y="402" class="m">c = 1 → mostra 1      c = 4 → mostra 4</text><text x="36" y="422" class="m">c = 2 → mostra 2      c = 5 → sai (5 &lt; 5 é false)</text></svg>