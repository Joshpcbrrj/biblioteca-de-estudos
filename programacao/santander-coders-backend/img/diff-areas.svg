<svg xmlns="http://www.w3.org/2000/svg" width="480" height="370" viewBox="0 0 480 370"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">O que cada git diff compara</text><rect x="40" y="56" width="300" height="56" rx="6" class="xO"/><text x="190.0" y="80.5" class="b c">Diretório de trabalho</text><text x="190.0" y="98.5" class="s c">o que você editou</text><rect x="40" y="176" width="300" height="56" rx="6" class="xG"/><text x="190.0" y="200.5" class="b c">Staging area</text><text x="190.0" y="218.5" class="s c">o que passou pelo git add</text><rect x="40" y="296" width="300" height="56" rx="6" class="xB"/><text x="190.0" y="320.5" class="b c">Último commit (HEAD)</text><text x="190.0" y="338.5" class="s c">o que está salvo</text><path d="M150,112 L150,176" class="l" marker-end="url(#a)" marker-start="url(#a)"/><text x="142" y="150" class="m r">git diff</text><path d="M230,232 L230,296" class="l" marker-end="url(#a)" marker-start="url(#a)"/><text x="238" y="270" class="m">git diff --staged</text><path d="M340,84 L390,84 L390,324 L340,324" class="l" marker-end="url(#a)" marker-start="url(#a)"/><text x="398" y="198" class="m">git diff</text><text x="398" y="216" class="m">HEAD</text></svg>