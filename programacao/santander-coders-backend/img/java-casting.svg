<svg xmlns="http://www.w3.org/2000/svg" width="480" height="368" viewBox="0 0 480 368"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Conversões entre tipos numéricos</text><rect x="20" y="70" width="68" height="40" rx="6" class="xB"/><text x="54.0" y="94.5" class="m b c">byte</text><path d="M88,90 L96,90" class="l" marker-end="url(#a)"/><rect x="96" y="70" width="68" height="40" rx="6" class="xB"/><text x="130.0" y="94.5" class="m b c">short</text><path d="M164,90 L172,90" class="l" marker-end="url(#a)"/><rect x="172" y="70" width="68" height="40" rx="6" class="xB"/><text x="206.0" y="94.5" class="m b c">int</text><path d="M240,90 L248,90" class="l" marker-end="url(#a)"/><rect x="248" y="70" width="68" height="40" rx="6" class="xB"/><text x="282.0" y="94.5" class="m b c">long</text><path d="M316,90 L324,90" class="l" marker-end="url(#a)"/><rect x="324" y="70" width="68" height="40" rx="6" class="xG"/><text x="358.0" y="94.5" class="m b c">float</text><path d="M392,90 L400,90" class="l" marker-end="url(#a)"/><rect x="400" y="70" width="68" height="40" rx="6" class="xG"/><text x="434.0" y="94.5" class="m b c">double</text><text x="240.0" y="140" class="b c">→ alargamento (widening): automático</text><path d="M440,170 L40,170" class="l" marker-end="url(#a)"/><text x="240.0" y="196" class="b c">← estreitamento (narrowing): exige (tipo)</text><rect x="30" y="220" width="420" height="130" rx="6" class="xW"/><text x="46" y="246" class="m">int x = 10;</text><text x="46" y="264" class="m">double y = x;        // 10.0</text><text x="46" y="282" class="m">double z = 9.99;</text><text x="46" y="300" class="m">int n = (int) z;     // 9: corta a parte decimal</text><text x="46" y="318" class="m">int big = 300;</text><text x="46" y="336" class="m">byte b = (byte) big; // 44: estourou</text></svg>