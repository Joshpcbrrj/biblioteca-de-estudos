<svg xmlns="http://www.w3.org/2000/svg" width="480" height="370" viewBox="0 0 480 370"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Curto-circuito no &amp;&amp;</text><text x="240.0" y="70" class="m b c">nome != null &amp;&amp; nome.length() &gt; 3</text><rect x="30" y="96" width="190" height="50" rx="6" class="xB"/><text x="125.0" y="125.5" class="m b c">nome = null</text><rect x="260" y="96" width="190" height="50" rx="6" class="xB"/><text x="355.0" y="125.5" class="m b c">nome = "Ana"</text><rect x="30" y="170" width="190" height="50" rx="6" class="xR"/><text x="125.0" y="191.5" class="m b c">1º lado: false</text><text x="125.0" y="209.5" class="s c">para aqui</text><rect x="260" y="170" width="190" height="50" rx="6" class="xG"/><text x="355.0" y="191.5" class="m b c">1º lado: true</text><text x="355.0" y="209.5" class="s c">avalia o 2º</text><path d="M125,146 L125,170" class="l" marker-end="url(#a)"/><path d="M355,146 L355,170" class="l" marker-end="url(#a)"/><rect x="30" y="244" width="190" height="50" rx="6" class="xW"/><text x="125.0" y="265.5" class="m c">length() não roda</text><text x="125.0" y="283.5" class="s c">sem erro</text><rect x="260" y="244" width="190" height="50" rx="6" class="xO"/><text x="355.0" y="265.5" class="m c">3 &gt; 3 → false</text><text x="355.0" y="283.5" class="s c">resultado false</text><path d="M125,220 L125,244" class="l d" marker-end="url(#a)"/><path d="M355,220 L355,244" class="l" marker-end="url(#a)"/><text x="30" y="326" class="s">Com &amp; (simples), os dois lados rodam sempre:</text><text x="30" y="346" class="s">null.length() lançaria NullPointerException.</text></svg>