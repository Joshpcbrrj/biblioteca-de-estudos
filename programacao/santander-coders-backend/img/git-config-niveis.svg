<svg xmlns="http://www.w3.org/2000/svg" width="480" height="408" viewBox="0 0 480 408"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Os três níveis do git config</text><rect x="40" y="52" width="400" height="250" rx="14" class="xY"/><text x="54" y="76" class="m b">--system</text><text x="54" y="96" class="s">todos os usuários da máquina</text><rect x="70" y="104" width="340" height="186" rx="14" class="xB"/><text x="84" y="128" class="m b">--global</text><text x="84" y="148" class="s">seu usuário (~/.gitconfig)</text><rect x="100" y="156" width="280" height="120" rx="14" class="xG"/><text x="114" y="180" class="m b">--local</text><text x="114" y="200" class="s">só este repositório (.git/config)</text><text x="240" y="248" class="b c">o mais interno vence</text><rect x="30" y="320" width="420" height="70" rx="6" class="xW"/><text x="46" y="344" class="m">git config --global user.name "Ana Souza"</text><text x="46" y="366" class="m">git config --list --show-origin</text></svg>