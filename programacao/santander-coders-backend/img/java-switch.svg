<svg xmlns="http://www.w3.org/2000/svg" width="480" height="436" viewBox="0 0 480 436"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">switch: com break × sem break</text><text x="125" y="64" class="b c">com break</text><rect x="40" y="80" width="170" height="44" rx="6" class="xW"/><text x="125.0" y="106.5" class="m b c">case 1</text><path d="M125,124 L125,138" class="l d"/><rect x="40" y="138" width="170" height="44" rx="6" class="xG"/><text x="125.0" y="164.5" class="m b c">case 2</text><path d="M125,182 L125,196" class="l d"/><rect x="40" y="196" width="170" height="44" rx="6" class="xW"/><text x="125.0" y="222.5" class="m b c">case 3</text><path d="M125,240 L125,254" class="l d"/><rect x="40" y="254" width="170" height="44" rx="6" class="xW"/><text x="125.0" y="280.5" class="m b c">default</text><path d="M210,160 L235,160 L235,330" class="l" marker-end="url(#a)"/><text x="220" y="346" class="m c">break</text><text x="355" y="64" class="b c">sem break</text><rect x="270" y="80" width="170" height="44" rx="6" class="xW"/><text x="355.0" y="106.5" class="m b c">case 1</text><path d="M355,124 L355,138" class="l d"/><rect x="270" y="138" width="170" height="44" rx="6" class="xG"/><text x="355.0" y="164.5" class="m b c">case 2</text><path d="M355,182 L355,196" class="l" marker-end="url(#a)"/><rect x="270" y="196" width="170" height="44" rx="6" class="xG"/><text x="355.0" y="222.5" class="m b c">case 3</text><path d="M355,240 L355,254" class="l" marker-end="url(#a)"/><rect x="270" y="254" width="170" height="44" rx="6" class="xG"/><text x="355.0" y="280.5" class="m b c">default</text><text x="240.0" y="330" class=""></text><text x="20" y="376" class="s">valor = 2. Com break: só o case 2 roda.</text><text x="20" y="394" class="s">Sem break: roda o case 2 e "cai" nos seguintes</text><text x="20" y="412" class="s">(fall-through) até o fim do switch.</text></svg>