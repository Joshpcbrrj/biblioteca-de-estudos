<svg xmlns="http://www.w3.org/2000/svg" width="480" height="404" viewBox="0 0 480 404"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">while × do-while</text><text x="125" y="62" class="m b c">while</text><polygon points="125,76 195.0,101.0 125,126 55.0,101.0" class="xP"/><text x="125" y="106.0" class="m b c">cond?</text><path d="M125,126 L125,148" class="l" marker-end="url(#a)"/><text x="135" y="142" class="s">true</text><rect x="55" y="148" width="140" height="40" rx="6" class="xO"/><text x="125.0" y="172.5" class="b c">corpo</text><path d="M55,168 L25,168 L25,101 L55,101" class="l" marker-end="url(#a)"/><path d="M195,101 L225,101 L225,220" class="l" marker-end="url(#a)"/><text x="198" y="94" class="s">false</text><text x="355" y="62" class="m b c">do-while</text><rect x="285" y="76" width="140" height="40" rx="6" class="xO"/><text x="355.0" y="100.5" class="b c">corpo</text><path d="M355,116 L355,138" class="l" marker-end="url(#a)"/><polygon points="355,138 425.0,163.0 355,188 285.0,163.0" class="xP"/><text x="355" y="168.0" class="m b c">cond?</text><text x="365" y="204" class="s">false</text><path d="M355,188 L355,220" class="l" marker-end="url(#a)"/><path d="M285,163 L255,163 L255,96 L285,96" class="l" marker-end="url(#a)"/><text x="260" y="156" class="s">true</text><text x="20" y="252" class="s">Com a condição já falsa no início (ex.: c = 10, c &lt; 5):</text><text x="20" y="272" class="s">while: o corpo roda 0 vezes.</text><text x="20" y="292" class="s">do-while: o corpo roda 1 vez, depois testa.</text><rect x="20" y="322" width="440" height="64" rx="6" class="xY"/><text x="36" y="346" class="m">do { ... } while (cond);   ← ponto e vírgula</text><text x="36" y="368" class="m">Uso típico: menu e validação de entrada.</text></svg>