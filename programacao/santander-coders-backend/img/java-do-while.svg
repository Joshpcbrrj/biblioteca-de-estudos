"auto-start-reverse"><path d="M1,1L9,5L1,9" fill="none" stroke="#7A7F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="240.0" y="30" class="t c">while × do-while</text><rect x="200.0" y="38" width="80" height="4" rx="2" fill="url(#gT0)"/><text x="125" y="62" class="m b c">while</text><polygon points="125,76 195.0,101.0 125,126 55.0,101.0" class="xP"/><text x="125" y="106.0" class="m b c">cond?</text><path d="M125,126 L125,148" class="l" marker-end="url(#a)"/><text x="135" y="142" class="s">true</text><rect x="57" y="151" width="140" height="40" rx="12" class="sh"/><rect x="55" y="148" width="140" height="40" rx="12" class="xO"/><text x="125.0" y="172.5" class="b c">corpo</text><path d="M55,168 L25,168 L25,101 L55,101" class="l" marker-end="url(#a)"/><path d="M195,101 L225,101 L225,220" class="l" marker-end="url(#a)"/><text x="198" y="94" class="s">false</text><text x="355" y="62" class="m b c">do-while</text><rect x="287" y="79" width="140" height="40" rx="12" class="sh"/><rect x="285" y="76" width="140" height="40" rx="12" class="xO"/><text x="355.0" y="100.5" class="b c">corpo</text><path d="M355,116 L355,138" class="l" marker-end="url(#a)"/><polygon points="355,138 425.0,163.0 355,188 285.0,163.0" class="xP"/><text x="355" y="168.0" class="m b c">cond?</text><text x="365" y="204" class="s">false</text><path d="M355,188 L355,220" class="l" marker-end="url(#a)"/><path d="M285,163 L255,163 L255,96 L285,96" class="l" marker-end="url(#a)"/><text x="260" y="156" class="s">true</text><text x="20" y="252" class="s">Com a condição já falsa no início (ex.: c = 10, c &lt; 5):</text><text x="20" y="272" class="s">while: o corpo roda 0 vezes.</text><text x="20" y="292" class="s">do-while: o corpo roda 1 vez, depois testa.</text><rect x="20" y="322" width="440" height="64" rx="12" class="xY"/><text x="36" y="346" class="m">do { ... } while (cond);   ← ponto e vírgula</text><text x="36" y="368" class="m">Uso típico: menu e validação de entrada.</text></svg>