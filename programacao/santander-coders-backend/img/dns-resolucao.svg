<svg xmlns="http://www.w3.org/2000/svg" width="480" height="506" viewBox="0 0 480 506"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Resolução DNS de www.exemplo.com</text><rect x="20" y="56" width="150" height="48" rx="6" class="xB"/><text x="95.0" y="76.5" class="b c">navegador</text><text x="95.0" y="94.5" class="s c">cache local</text><rect x="20" y="150" width="150" height="262" rx="6" class="xT"/><text x="95.0" y="269.5" class="b c">resolvedor</text><text x="95.0" y="287.5" class="s c">DNS do provedor</text><text x="95.0" y="303.5" class="s c">(recursivo)</text><path d="M80,104 L80,150" class="l" marker-end="url(#a)"/><text x="70" y="132" class="b r">1</text><path d="M110,150 L110,104" class="l" marker-end="url(#a)"/><text x="120" y="132" class="b">8</text><rect x="300" y="150" width="160" height="70" rx="6" class="xP"/><text x="380.0" y="181.5" class="b c">servidor raiz</text><text x="380.0" y="199.5" class="s c">conhece os TLDs</text><path d="M170,170 L300,170" class="l" marker-end="url(#a)"/><text x="235" y="164" class="b c">2</text><path d="M300,200 L170,200" class="l" marker-end="url(#a)"/><text x="235" y="216" class="s c">pergunte ao .com</text><rect x="300" y="240" width="160" height="70" rx="6" class="xO"/><text x="380.0" y="271.5" class="b c">servidor TLD .com</text><text x="380.0" y="289.5" class="s c">conhece o autoritativo</text><path d="M170,260 L300,260" class="l" marker-end="url(#a)"/><text x="235" y="254" class="b c">4</text><path d="M300,290 L170,290" class="l" marker-end="url(#a)"/><text x="235" y="306" class="s c">pergunte ao ns1</text><rect x="300" y="330" width="160" height="70" rx="6" class="xG"/><text x="380.0" y="361.5" class="b c">autoritativo</text><text x="380.0" y="379.5" class="s c">tem o registro A</text><path d="M170,350 L300,350" class="l" marker-end="url(#a)"/><text x="235" y="344" class="b c">6</text><path d="M300,380 L170,380" class="l" marker-end="url(#a)"/><text x="235" y="396" class="s c">203.0.113.10</text><text x="20" y="446" class="s">Pares de setas: pergunta (ida) e resposta (volta).</text><text x="20" y="464" class="s">8: o IP volta ao navegador e fica em cache pelo</text><text x="20" y="482" class="s">tempo definido no registro (TTL).</text></svg>