<svg xmlns="http://www.w3.org/2000/svg" width="480" height="454" viewBox="0 0 480 454"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">TCP: aperto de mão em três vias</text><rect x="30" y="52" width="140" height="40" rx="6" class="xB"/><text x="100.0" y="76.5" class="b c">cliente</text><rect x="310" y="52" width="140" height="40" rx="6" class="xG"/><text x="380.0" y="76.5" class="b c">servidor</text><path d="M100,92 L100,330 M380,92 L380,330" class="l d"/><path d="M100,120 L380,150" class="l" marker-end="url(#a)"/><text x="240" y="122" class="m b c">1. SYN</text><path d="M380,180 L100,210" class="l" marker-end="url(#a)"/><text x="240" y="186" class="m b c">2. SYN-ACK</text><path d="M100,240 L380,270" class="l" marker-end="url(#a)"/><text x="240" y="242" class="m b c">3. ACK</text><text x="240" y="306" class="s c">conexão aberta: dados com confirmação</text><rect x="30" y="344" width="420" height="92" rx="6" class="xW"/><text x="46" y="368" class="s">TCP: conexão, ordem e reenvio do que se perde.</text><text x="46" y="386" class="s">    Web, e-mail, transferência de arquivos.</text><text x="46" y="404" class="s">UDP: sem conexão nem confirmação; mais rápido.</text><text x="46" y="422" class="s">    Vídeo ao vivo, jogos, chamadas, DNS.</text></svg>