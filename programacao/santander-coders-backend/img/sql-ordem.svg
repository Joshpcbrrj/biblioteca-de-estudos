<svg xmlns="http://www.w3.org/2000/svg" width="480" height="388" viewBox="0 0 480 388"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Ordem em que o banco executa um SELECT</text><rect x="60" y="52" width="360" height="34" rx="6" class="xB"/><text x="76" y="74" class="m b">1. FROM / JOIN</text><text x="404" y="74" class="s r">de onde</text><rect x="60" y="92" width="360" height="34" rx="6" class="xB"/><text x="76" y="114" class="m b">2. WHERE</text><text x="404" y="114" class="s r">filtra linhas</text><rect x="60" y="132" width="360" height="34" rx="6" class="xG"/><text x="76" y="154" class="m b">3. GROUP BY</text><text x="404" y="154" class="s r">agrupa</text><rect x="60" y="172" width="360" height="34" rx="6" class="xG"/><text x="76" y="194" class="m b">4. HAVING</text><text x="404" y="194" class="s r">filtra grupos</text><rect x="60" y="212" width="360" height="34" rx="6" class="xO"/><text x="76" y="234" class="m b">5. SELECT</text><text x="404" y="234" class="s r">escolhe colunas</text><rect x="60" y="252" width="360" height="34" rx="6" class="xP"/><text x="76" y="274" class="m b">6. ORDER BY</text><text x="404" y="274" class="s r">ordena</text><rect x="60" y="292" width="360" height="34" rx="6" class="xP"/><text x="76" y="314" class="m b">7. LIMIT</text><text x="404" y="314" class="s r">corta</text><text x="240.0" y="346" class="n c">Um apelido criado no SELECT não vale no WHERE,</text><text x="240.0" y="364" class="n c">mas vale no ORDER BY.</text></svg>