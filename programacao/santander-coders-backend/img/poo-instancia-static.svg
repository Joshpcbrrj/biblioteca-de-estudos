<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Atributos de instância × static</text><rect x="140" y="50" width="200" height="70" rx="6" class="xP"/><text x="240" y="74" class="m b c">classe Conta</text><text x="240" y="100" class="m c">static totalContas = 2</text><rect x="20" y="170" width="190" height="90" rx="6" class="xB"/><text x="115" y="194" class="m b c">conta1</text><text x="34" y="220" class="m">titular = "Ana"</text><text x="34" y="240" class="m">saldo = 100.0</text><path d="M115,170 L115,120" class="l d" marker-end="url(#a)"/><rect x="270" y="170" width="190" height="90" rx="6" class="xB"/><text x="365" y="194" class="m b c">conta2</text><text x="284" y="220" class="m">titular = "Beto"</text><text x="284" y="240" class="m">saldo = 250.0</text><path d="M365,170 L365,120" class="l d" marker-end="url(#a)"/><text x="20" y="296" class="s">Cada objeto tem seus próprios titular e saldo.</text><text x="20" y="316" class="s">O static existe uma vez só, na classe, e é</text><text x="20" y="336" class="s">compartilhado: as duas contas veem o mesmo total.</text></svg>