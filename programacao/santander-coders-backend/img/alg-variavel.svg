<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Variável e constante: caixas na memória</text><rect x="30" y="64" width="200" height="120" rx="6" class="xB"/><text x="130" y="90" class="m b c">idade</text><text x="130" y="112" class="s c">inteiro</text><rect x="80" y="124" width="100" height="44" rx="6" class="xW"/><text x="130" y="152" class="m b c">25</text><text x="130" y="206" class="s c">pode mudar</text><rect x="250" y="64" width="200" height="120" rx="6" class="xR"/><text x="350" y="90" class="m b c">PI</text><text x="350" y="112" class="s c">real (constante)</text><rect x="300" y="124" width="100" height="44" rx="6" class="xW"/><text x="350" y="152" class="m b c">3.14</text><text x="350" y="206" class="s c">não muda</text><text x="240.0" y="250" class="m c">definir 26 -&gt; idade    ✓</text><text x="240.0" y="276" class="m c">definir 3 -&gt; PI        ✗ erro</text><text x="30" y="316" class="s">Nome: como o programa chama a caixa.</text><text x="30" y=