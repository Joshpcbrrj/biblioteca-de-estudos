<svg xmlns="http://www.w3.org/2000/svg" width="480" height="396" viewBox="0 0 480 396"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Pilha, heap e o coletor de lixo</text><rect x="20" y="56" width="170" height="250" rx="6" class="xY"/><text x="105" y="78" class="b c">pilha (stack)</text><rect x="36" y="96" width="138" height="40" rx="6" class="xB"/><text x="105.0" y="120.5" class="m b c">carro1</text><rect x="36" y="146" width="138" height="40" rx="6" class="xB"/><text x="105.0" y="170.5" class="m b c">carro2 = null</text><rect x="36" y="196" width="138" height="40" rx="6" class="xO"/><text x="105.0" y="220.5" class="m c">int ano = 2022</text><rect x="230" y="56" width="230" height="250" rx="6" class="xW"/><text x="345" y="78" class="b c">heap</text><rect x="250" y="96" width="190" height="52" rx="6" class="xG"/><text x="345.0" y="118.5" class="b c">objeto Carro</text><text x="345.0" y="136.5" class="s c">Toyota Corolla</text><rect x="250" y="196" width="190" height="52" rx="6" class="xR"/><text x="345.0" y="218.5" class="b c">objeto Carro</text><text x="345.0" y="236.5" class="s c">sem referência</text><path d="M174,116 L250,120" class="l" marker-end="url(#a)"/><text x="345" y="272" class="s c">vai ser coletado</text><text x="20" y="336" class="s">Variáveis locais e primitivos ficam na pilha; objetos</text><text x="20" y="354" class="s">ficam no heap. Quando nenhum caminho chega a um</text><text x="20" y="372" class="s">objeto, o garbage collector libera a memória dele.</text></svg>