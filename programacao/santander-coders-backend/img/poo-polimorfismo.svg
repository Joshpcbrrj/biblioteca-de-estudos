<svg xmlns="http://www.w3.org/2000/svg" width="480" height="318" viewBox="0 0 480 318"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Polimorfismo: mesma chamada, efeitos diferentes</text><rect x="20" y="56" width="440" height="40" rx="6" class="xY"/><text x="240.0" y="81" class="m c">Animal[] bichos = {new Cachorro(), new Gato()};</text><rect x="20" y="108" width="440" height="40" rx="6" class="xY"/><text x="240.0" y="133" class="m c">for (Animal a : bichos) a.emitirSom();</text><rect x="30" y="190" width="190" height="52" rx="6" class="xB"/><text x="125.0" y="212.5" class="b c">a é um Cachorro</text><text x="125.0" y="230.5" class="s c">"Au au!"</text><rect x="260" y="190" width="190" height="52" rx="6" class="xG"/><text x="355.0" y="212.5" class="b c">a é um Gato</text><text x="355.0" y="230.5" class="s c">"Miau!"</text><path d="M200,148 L125,190" class="l" marker-end="url(#a)"/><path d="M280,148 L355,190" class="l" marker-end="url(#a)"/><text x="20" y="276" class="s">O tipo da variável (Animal) decide o que pode ser</text><text x="20" y="294" class="s">chamado; o tipo do objeto decide qual versão roda.</text></svg>