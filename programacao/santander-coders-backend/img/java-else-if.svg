<svg xmlns="http://www.w3.org/2000/svg" width="480" height="388" viewBox="0 0 480 388"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">if / else if / else: vale a primeira verdadeira</text><polygon points="150,50 245.0,76.0 150,102 55.0,76.0" class="xP"/><text x="150" y="81.0" class="m b c">nota &gt;= 90 ?</text><path d="M245,76 L320,76" class="l" marker-end="url(#a)"/><text x="270" y="68" class="s">sim</text><rect x="320" y="56" width="120" height="40" rx="6" class="xG"/><text x="380.0" y="80.5" class="m b c">"A"</text><path d="M150,102 L150,124" class="l" marker-end="url(#a)"/><text x="160" y="118" class="s">não</text><polygon points="150,124 245.0,150.0 150,176 55.0,150.0" class="xP"/><text x="150" y="155.0" class="m b c">nota &gt;= 80 ?</text><path d="M245,150 L320,150" class="l" marker-end="url(#a)"/><text x="270" y="142" class="s">sim</text><rect x="320" y="130" width="120" height="40" rx="6" class="xG"/><text x="380.0" y="154.5" class="m b c">"B"</text><path d="M150,176 L150,198" class="l" marker-end="url(#a)"/><text x="160" y="192" class="s">não</text><polygon points="150,198 245.0,224.0 150,250 55.0,224.0" class="xP"/><text x="150" y="229.0" class="m b c">nota &gt;= 70 ?</text><path d="M245,224 L320,224" class="l" marker-end="url(#a)"/><text x="270" y="216" class="s">sim</text><rect x="320" y="204" width="120" height="40" rx="6" class="xG"/><text x="380.0" y="228.5" class="m b c">"C"</text><path d="M150,250 L150,272" class="l" marker-end="url(#a)"/><text x="160" y="266" class="s">não</text><rect x="90" y="272" width="120" height="40" rx="6" class="xR"/><text x="150.0" y="296.5" class="m b c">"Reprovado"</text><text x="220" y="298" class="m">else</text><text x="20" y="344" class="s">Com nota = 80: o 1º teste falha, o 2º acerta,</text><text x="20" y="364" class="s">mostra "B" e os demais nem são avaliados.</text></svg>