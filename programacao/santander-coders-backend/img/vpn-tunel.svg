<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">VPN: um túnel criptografado</text><rect x="20" y="90" width="110" height="52" rx="6" class="xB"/><text x="75.0" y="112.5" class="b c">notebook</text><text x="75.0" y="130.5" class="s c">em casa</text><rect x="350" y="90" width="110" height="52" rx="6" class="xG"/><text x="405.0" y="112.5" class="b c">servidor VPN</text><text x="405.0" y="130.5" class="s c">da empresa</text><rect x="130" y="96" width="220" height="40" rx="20" fill="#E5E7EB" stroke="#6B7280" stroke-width="2"/><text x="240" y="121" class="b c">🔒 dados cifrados</text><text x="240" y="80" class="s c">internet (rede pública)</text><rect x="380" y="180" width="80" height="40" rx="6" class="xY"/><text x="420.0" y="204.5" class="b c">sistemas</text><path d="M405,142 L420,180" class="l" marker-end="url(#a)"/><text x="240" y="170" class="s c">quem intercepta só vê dados embaralhados</text><text x="30" y="250" class="s">Para a rede da empresa, o notebook parece estar</text><text x="30" y="268" class="s">dentro do escritório. O endereço IP visto pelos</text><text x="30" y="286" class="s">sites passa a ser o do servidor VPN.</text></svg>