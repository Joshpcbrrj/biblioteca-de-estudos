<svg xmlns="http://www.w3.org/2000/svg" width="480" height="418" viewBox="0 0 480 418"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">for: as três partes e a ordem</text><text x="240.0" y="74" class="m b c">for (int i = 0; i &lt; 3; i++) {</text><text x="240.0" y="98" class="m c">System.out.println(i);</text><text x="240.0" y="120" class="m c">}</text><rect x="40" y="146" width="400" height="44" rx="6" class="xB"/><text x="56" y="174" class="b">①</text><text x="86" y="174" class="m b">int i = 0</text><text x="424" y="174" class="s r">roda 1 vez, no início</text><rect x="40" y="198" width="400" height="44" rx="6" class="xP"/><text x="56" y="226" class="b">②</text><text x="86" y="226" class="m b">i &lt; 3</text><text x="424" y="226" class="s r">testa antes de cada volta</text><rect x="40" y="250" width="400" height="44" rx="6" class="xO"/><text x="56" y="278" class="b">③</text><text x="86" y="278" class="m b">corpo</text><text x="424" y="278" class="s r">println(i)</text><rect x="40" y="302" width="400" height="44" rx="6" class="xG"/><text x="56" y="330" class="b">④</text><text x="86" y="330" class="m b">i++</text><text x="424" y="330" class="s r">depois de cada volta; volta ao ②</text><text x="240.0" y="370" class="m c">① ② ③ ④ ② ③ ④ ② ③ ④ ② (false → sai)</text><text x="240.0" y="394" class="n c">Mostra 0, 1 e 2. No fim, i vale 3.</text></svg>