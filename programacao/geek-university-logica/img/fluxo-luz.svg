<rect width="100%" height="100%" fill="#fff"/><text x="360" y="34" class="t" text-anchor="middle">Fluxograma: entrar em uma sala</text><rect x="100.0" y="56" width="220" height="50" rx="25.0" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="210.0" y="87.0" class="b" text-anchor="middle">Início: entrou na sala</text><path d="M210,106V132" class="l" marker-end="url(#a)"/><polygon points="210,135.0 325.0,180 210,225.0 95.0,180" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="210" y="185" class="b" text-anchor="middle">Está escuro?</text><path d="M325,180H510V224" class="l" marker-end="url(#a)"/><text x="340" y="168" class="r" text-anchor="start">Sim</text><rect x="420" y="226" width="180" height="52" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="510.0" y="258.0" class="b" text-anchor="middle">Acender a luz</text><path d="M210,225V282" class="l" marker-end="url(#a)"/><text x="220" y="252" class="r" text-anchor="start">Não</text><polygon points="210,285.0 335.0,330 210,375.0 85.0,330" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="210" y="335" class="b" text-anchor="middle">A luz está acesa?</text><path d="M335,330H510V374" class="l" marker-end="url(#a)"/><text x="350" y="318" class="r" text-anchor="start">Sim</text><rect x="400" y="376" width="220" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="510.0" y="408.0" class="b" text-anchor="middle">Apagar a luz</text><text x="510.0" y="430.0" class="s" text-anchor="middle">(economizar)</text><path d="M210,375V470" class="l" marker-end="url(#a)"/><text x="220" y="425" class="r" text-anchor="start">Não</text><rect x="140.0" y="472" width="140" height="50" rx="25.0" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="210.0" y="503.0" class="b" text-anchor="middle">Fim</text><path d="M600,252H670V497" class="l"/><path d="M620,411H670" class="l"/><path d="M670,497H282" class="l" marker-end="url(#a)"/></svg>