<svg xmlns="http://www.w3.org/2000/svg" width="720" height="785" viewBox="0 0 720 785">
<style>.t{font:bold 17px Helvetica, Arial, sans-serif;fill:#1F2937}.b{font:bold 16px Helvetica, Arial, sans-serif;fill:#1F2937}.n{font:15px Helvetica, Arial, sans-serif;fill:#1F2937}.s{font:14px Helvetica, Arial, sans-serif;fill:#4B5563}.c{font:15px Menlo, Consolas, monospace;fill:#1F2937}.r{font:bold 15px Helvetica, Arial, sans-serif;fill:#4B5563}.l{stroke:#4B5563;stroke-width:2.5;fill:none}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4B5563"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/><text x="360" y="34" class="t" text-anchor="middle">As três estruturas de todo algoritmo</text><text x="180" y="72" class="b" text-anchor="middle">Sequência</text><rect x="90" y="90" width="180" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="180.0" y="121.0" class="b" text-anchor="middle">Passo 1</text><path d="M180,140V168" class="l" marker-end="url(#a)"/><rect x="90" y="170" width="180" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="180.0" y="201.0" class="b" text-anchor="middle">Passo 2</text><path d="M180,220V248" class="l" marker-end="url(#a)"/><rect x="90" y="250" width="180" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="180.0" y="281.0" class="b" text-anchor="middle">Passo 3</text><text x="180" y="370" class="s" text-anchor="middle">um passo após o outro</text><text x="530" y="72" class="b" text-anchor="middle">Decisão (seleção)</text><rect x="450" y="90" width="160" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="530.0" y="121.0" class="b" text-anchor="middle">Passo 1</text><path d="M530,140V164" class="l" marker-end="url(#a)"/><polygon points="530,165.0 630.0,205 530,245.0 430.0,205" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="530" y="210" class="b" text-anchor="middle">condição?</text><path d="M430,205H420V280" class="l" marker-end="url(#a)"/><text x="415" y="192" class="r" text-anchor="end">sim</text><path d="M630,205H640V280" class="l" marker-end="url(#a)"/><text x="645" y="192" class="r" text-anchor="start">não</text><rect x="355" y="282" width="130" height="50" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="420.0" y="313.0" class="b" text-anchor="middle">Caminho A</text><rect x="575" y="282" width="130" height="50" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="640.0" y="313.0" class="b" text-anchor="middle">Caminho B</text><text x="530" y="370" class="s" text-anchor="middle">escolhe um de dois caminhos</text><line x1="40" y1="400" x2="680" y2="400" stroke="#E5E7EB" stroke-width="2"/><text x="360" y="440" class="b" text-anchor="middle">Repetição (laço)</text><rect x="250" y="460" width="160" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="330.0" y="491.0" class="b" text-anchor="middle">Passo 1</text><path d="M330,510V534" class="l" marker-end="url(#a)"/><polygon points="330,535.0 430.0,575 330,615.0 230.0,575" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="330" y="580" class="b" text-anchor="middle">continua?</text><path d="M330,615V650" class="l" marker-end="url(#a)"/><text x="340" y="638" class="r" text-anchor="start">sim</text><rect x="230" y="652" width="200" height="50" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="330.0" y="683.0" class="b" text-anchor="middle">Passo repetido</text><path d="M230,677H160V575H228" class="l" marker-end="url(#a)"/><path d="M430,575H580V690" class="l" marker-end="url(#a)"/><text x="440" y="562" class="r" text-anchor="start">não</text><text x="580" y="715" class="s" text-anchor="middle">sai do laço</text><text x="360" y="760" class="s" text-anchor="middle">volta e repete enquanto a condição valer</text></svg>