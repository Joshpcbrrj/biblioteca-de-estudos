<rect width="100%" height="100%" fill="#fff"/><text x="360" y="34" class="t" text-anchor="middle">Fluxograma: aprovado ou reprovado</text><rect x="285.0" y="56" width="150" height="50" rx="25.0" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="360.0" y="87.0" class="b" text-anchor="middle">Início</text><path d="M360,106V128" class="l" marker-end="url(#a)"/><polygon points="253.0,130 503.0,130 467.0,184 217.0,184" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="360" y="163.0" class="b" text-anchor="middle">Leia nota1, nota2</text><path d="M360,184V206" class="l" marker-end="url(#a)"/><rect x="190" y="208" width="340" height="54" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="360" y="241" class="c" text-anchor="middle">media ← (nota1 + nota2) / 2</text><path d="M360,262V284" class="l" marker-end="url(#a)"/><polygon points="360,285.0 475.0,330 360,375.0 245.0,330" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="360" y="335" class="b" text-anchor="middle">media >= 7?</text><path d="M245,330H160V398" class="l" marker-end="url(#a)"/><text x="235" y="318" class="r" text-anchor="end">Sim</text><path d="M475,330H560V398" class="l" marker-end="url(#a)"/><text x="485" y="318" class="r" text-anchor="start">Não</text><polygon points="68.0,400 288.0,400 252.0,454 32.0,454" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="160" y="433.0" class="n" text-anchor="middle">Escreva "Aprovado"</text><polygon points="458.0,400 698.0,400 662.0,454 422.0,454" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="560" y="433.0" class="n" text-anchor="middle">Escreva "Reprovado"</text><path d="M160,454V500" class="l"/><path d="M160,500H283" class="l" marker-end="url(#a)"/><path d="M560,454V500" class="l"/><path d="M560,500H437" class="l" marker-end="url(#a)"/><rect x="285.0" y="475" width="150" height="50" rx="25.0" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="360.0" y="506.0" class="b" text-anchor="m