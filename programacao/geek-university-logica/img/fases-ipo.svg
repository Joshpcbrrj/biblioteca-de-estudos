<svg xmlns="http://www.w3.org/2000/svg" width="720" height="506" viewBox="0 0 720 506">
<style>.t{font:bold 17px Helvetica, Arial, sans-serif;fill:#1F2937}.b{font:bold 16px Helvetica, Arial, sans-serif;fill:#1F2937}.n{font:15px Helvetica, Arial, sans-serif;fill:#1F2937}.s{font:14px Helvetica, Arial, sans-serif;fill:#4B5563}.c{font:15px Menlo, Consolas, monospace;fill:#1F2937}.r{font:bold 15px Helvetica, Arial, sans-serif;fill:#4B5563}.l{stroke:#4B5563;stroke-width:2.5;fill:none}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4B5563"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/><text x="360" y="34" class="t" text-anchor="middle">Todo algoritmo segue o mesmo esqueleto</text><rect x="40" y="60" width="260" height="74" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="170.0" y="94.0" class="b" text-anchor="middle">Entrada</text><text x="170.0" y="116.0" class="s" text-anchor="middle">dados que o programa recebe</text><text x="330" y="82" class="r" text-anchor="start">Exemplo: média de 2 notas</text><text x="330" y="106" class="c" text-anchor="start">nota1 = 8</text><text x="330" y="128" class="c" text-anchor="start">nota2 = 6</text><path d="M170,134V168" class="l" marker-end="url(#a)"/><rect x="40" y="172" width="260" height="74" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="170.0" y="206.0" class="b" text-anchor="middle">Processamento</text><text x="170.0" y="228.0" class="s" text-anchor="middle">cálculos e decisões</text><text x="330" y="194" class="r" text-anchor="start">Exemplo</text><text x="330" y="218" class="c" text-anchor="start">media = (nota1 + nota2) / 2</text><text x="330" y="240" class="c" text-anchor="start">se media >= 7 → aprovado</text><path d="M170,246V280" class="l" marker-end="url(#a)"/><rect x="40" y="284" width="260" height="74" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="170.0" y="318.0" class="b" text-anchor="middle">Saída</text><text x="170.0" y="340.0" class="s" text-anchor="middle">resultado mostrado</text><text x="330" y="306" class="r" text-anchor="start">Exemplo</text><text x="330" y="330" class="c" text-anchor="start">"Média 7: aprovado"</text><rect x="40" y="400" width="640" height="84" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="360" y="432" class="b" text-anchor="middle">Algoritmo: sequência finita e ordenada</text><text x="360" y="454" class="b" text-anchor="middle">de passos que resolve um problema.</text><text x="360" y="476" class="s" text-anchor="middle">Programa: algoritmo escrito em uma linguagem.</text></svg>