<svg xmlns="http://www.w3.org/2000/svg" width="720" height="582" viewBox="0 0 720 582">
<style>.t{font:bold 17px Helvetica, Arial, sans-serif;fill:#1F2937}.b{font:bold 16px Helvetica, Arial, sans-serif;fill:#1F2937}.n{font:15px Helvetica, Arial, sans-serif;fill:#1F2937}.s{font:14px Helvetica, Arial, sans-serif;fill:#4B5563}.c{font:15px Menlo, Consolas, monospace;fill:#1F2937}.r{font:bold 15px Helvetica, Arial, sans-serif;fill:#4B5563}.l{stroke:#4B5563;stroke-width:2.5;fill:none}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4B5563"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/><text x="360" y="34" class="t" text-anchor="middle">Como os conceitos da introdução se encaixam</text><rect x="180" y="60" width="360" height="64" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="360.0" y="89.0" class="b" text-anchor="middle">Lógica</text><text x="360.0" y="111.0" class="s" text-anchor="middle">raciocínio correto</text><path d="M360,124V150" class="l" marker-end="url(#a)"/><rect x="180" y="154" width="360" height="64" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="360.0" y="183.0" class="b" text-anchor="middle">Sequência lógica</text><text x="360.0" y="205.0" class="s" text-anchor="middle">passos em ordem</text><path d="M360,218V244" class="l" marker-end="url(#a)"/><rect x="180" y="248" width="360" height="64" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="360.0" y="277.0" class="b" text-anchor="middle">Instruções</text><text x="360.0" y="299.0" class="s" text-anchor="middle">cada passo</text><path d="M360,312V338" class="l" marker-end="url(#a)"/><rect x="180" y="342" width="360" height="64" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="360.0" y="371.0" class="b" text-anchor="middle">Algoritmo</text><text x="360.0" y="393.0" class="s" text-anchor="middle">resolve um problema</text><path d="M360,406V432" class="l" marker-end="url(#a)"/><rect x="180" y="436" width="360" height="64" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="360.0" y="465.0" class="b" text-anchor="middle">Programa</text><text x="360.0" y="487.0" class="s" text-anchor="middle">em uma linguagem</text><text x="360" y="544" class="s" text-anchor="middle">Do mais amplo ao mais concreto:</text><text x="360" y="564" class="s" text-anchor="middle">cada conceito se apoia no anterior.</text></svg>