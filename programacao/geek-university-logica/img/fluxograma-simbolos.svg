<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640">
<style>.t{font:bold 17px Helvetica, Arial, sans-serif;fill:#1F2937}.b{font:bold 16px Helvetica, Arial, sans-serif;fill:#1F2937}.n{font:15px Helvetica, Arial, sans-serif;fill:#1F2937}.s{font:14px Helvetica, Arial, sans-serif;fill:#4B5563}.c{font:15px Menlo, Consolas, monospace;fill:#1F2937}.r{font:bold 15px Helvetica, Arial, sans-serif;fill:#4B5563}.l{stroke:#4B5563;stroke-width:2.5;fill:none}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4B5563"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/><text x="360" y="34" class="t" text-anchor="middle">Símbolos do fluxograma</text><rect x="70" y="74" width="190" height="52" rx="26" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="310" y="96" class="b" text-anchor="start">Terminal</text><text x="310" y="118" class="s" text-anchor="start">início e fim</text><rect x="70" y="166" width="190" height="52" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="310" y="188" class="b" text-anchor="start">Processo</text><text x="310" y="210" class="s" text-anchor="start">cálculo, atribuição</text><polygon points="165,247.0 260.0,284 165,321.0 70.0,284" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/><text x="165" y="289" class="b" text-anchor="middle"></text><text x="310" y="280" class="b" text-anchor="start">Decisão</text><text x="310" y="302" class="s" text-anchor="start">pergunta sim/não</text><polygon points="98.0,350 268.0,350 232.0,402 62.0,402" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="165" y="382.0" class="b" text-anchor="middle"></text><text x="310" y="372" class="b" text-anchor="start">Entrada / Saída</text><text x="310" y="394" class="s" text-anchor="start">Leia / Escreva</text><path d="M80,468H250" class="l" marker-end="url(#a)"/><text x="310" y="464" class="b" text-anchor="start">Seta (fluxo)</text><text x="310" y="486" class="s" text-anchor="start">ordem de execução</text><rect x="40" y="526" width="640" height="92" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/><text x="360" y="558" class="n" text-anchor="middle">Regra de leitura: comece no "Início",</text><text x="360" y="580" class="n" text-anchor="middle">siga as setas e termine no "Fim".</text><text x="360" y="604" class="s" text-anchor="middle">Cada losango tem duas saídas: "Sim" e "Não".</text></svg>