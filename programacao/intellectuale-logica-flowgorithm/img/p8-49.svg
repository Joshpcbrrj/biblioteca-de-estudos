<svg xmlns="http://www.w3.org/2000/svg" width="781" height="400" viewBox="0 0 781 400"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.lb{font-size:11.5px;font-style:italic;fill:#6B7280}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.lp{fill:#EDE9FE;stroke:#7C3AED;stroke-width:2}.cl{fill:#E0F2FE;stroke:#0284C7;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect class="te" x="140.4" y="14" width="56.4" height="32" rx="16"/><text class="t" x="168.6" y="34" text-anchor="middle">Main</text><path class="e" d="M168.6,46 L168.6,68" marker-end="url(#a)"/><rect class="dc" x="113.8" y="68" width="109.6" height="46" rx="3"/><text x="168.6" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="168.6" y="102" text-anchor="middle">Integer num</text><path class="e" d="M168.6,114 L168.6,136" marker-end="url(#a)"/><path class="ou" d="M53,136 L298.2,136 L284.2,168 L39,168 Z"/><text class="t" x="168.6" y="156" text-anchor="middle">Output &quot;Digite um número: &quot;</text><path class="e" d="M168.6,168 L168.6,190" marker-end="url(#a)"/><path class="in" d="M121.4,190 L229.8,190 L215.8,222 L107.4,222 Z"/><text class="t" x="168.6" y="210" text-anchor="middle">Input num</text><path class="e" d="M168.6,222 L168.6,244" marker-end="url(#a)"/><path class="ou" d="M34,244 L317.2,244 L303.2,276 L20,276 Z"/><text class="t" x="168.6" y="264" text-anchor="middle">Output &quot;Tabuada do &quot; &amp; num &amp; &quot;:&quot;</text><path class="e" d="M168.6,276 L168.6,298" marker-end="url(#a)"/><rect class="cl" x="58.2" y="298" width="220.8" height="32" rx="3"/><line class="cl" x1="66.2" y1="298" x2="66.2" y2="330"/><line class="cl" x1="271" y1="298" x2="271" y2="330"/><text class="t" x="168.6" y="318" text-anchor="middle">Call mostraTabuada(num)</text><path class="e" d="M168.6,330 L168.6,352" marker-end="url(#a)"/><rect class="te" x="144.2" y="352" width="48.8" height="32" rx="16"/><text class="t" x="168.6" y="372" text-anchor="middle">End</text><rect class="te" x="458.8" y="14" width="208.4" height="32" rx="16"/><text class="t" x="563" y="34" text-anchor="middle">mostraTabuada(Integer n)</text><path class="e" d="M563,46 L563,68" marker-end="url(#a)"/><rect class="dc" x="515.8" y="68" width="94.4" height="46" rx="3"/><text x="563" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="563" y="102" text-anchor="middle">Integer i</text><path class="e" d="M563,114 L563,136" marker-end="url(#a)"/><path class="lp" d="M497,136 L629,136 L643,153 L629,170 L497,170 L483,153 Z"/><text class="t" x="563" y="157" text-anchor="middle">For i = 1 to 10</text><path class="e" d="M563,170 L563,194" marker-end="url(#a)"/><text class="lb" x="568" y="185" text-anchor="start">próxima volta</text><path class="ou" d="M413.2,194 L726.8,194 L712.8,226 L399.2,226 Z"/><text class="t" x="563" y="214" text-anchor="middle">Output n &amp; &quot; x &quot; &amp; i &amp; &quot; = &quot; &amp; n * i</text><path class="e" d="M563,226 L563,238 L373.2,238 L373.2,153 L483,153" marker-end="url(#a)"/><path class="e" d="M643,153 L756.8,153 L756.8,258 L563,258"/><text class="lb" x="647" y="148" text-anchor="start">terminou</text><circle cx="563" cy="258" r="4" fill="#4B5563"/><path class="e" d="M563,262 L563,284" marker-end="url(#a)"/><rect class="te" x="538.6" y="284" width="48.8" height="32" rx="16"/><text class="t" x="563" y="304" text-anchor="middle">End</text></svg>