<svg xmlns="http://www.w3.org/2000/svg" width="624" height="1488" viewBox="0 0 624 1488"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.lb{font-size:11.5px;font-style:italic;fill:#6B7280}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.if{fill:#FCE7F3;stroke:#DB2777;stroke-width:2}.lp{fill:#EDE9FE;stroke:#7C3AED;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect class="te" x="281.8" y="14" width="56.4" height="32" rx="16"/><text class="t" x="310" y="34" text-anchor="middle">Main</text><path class="e" d="M310,46 L310,68" marker-end="url(#a)"/><rect class="dc" x="175.4" y="68" width="269.2" height="110" rx="3"/><text x="310" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="188.4" y="102" text-anchor="start">Real nota1, nota2, nota3, media,</text><text class="t" x="188.4" y="118" text-anchor="start" xml:space="preserve">  mediaClasse</text><text class="t" x="188.4" y="134" text-anchor="start">Integer i</text><text class="t" x="188.4" y="150" text-anchor="start">Real acMedias</text><text class="t" x="188.4" y="166" text-anchor="start">Integer contAprov, contReprov</text><path class="e" d="M310,178 L310,200" marker-end="url(#a)"/><rect class="as" x="251.4" y="200" width="117.2" height="32" rx="3"/><text class="t" x="310" y="220" text-anchor="middle">acMedias = 0</text><path class="e" d="M310,232 L310,254" marker-end="url(#a)"/><rect class="as" x="247.6" y="254" width="124.8" height="32" rx="3"/><text class="t" x="310" y="274" text-anchor="middle">contAprov = 0</text><path class="e" d="M310,286 L310,308" marker-end="url(#a)"/><rect class="as" x="243.8" y="308" width="132.4" height="32" rx="3"/><text class="t" x="310" y="328" text-anchor="middle">contReprov = 0</text><path class="e" d="M310,340 L310,362" marker-end="url(#a)"/><path class="lp" d="M244,362 L376,362 L390,379 L376,396 L244,396 L230,379 Z"/><text class="t" x="310" y="383" text-anchor="middle">For i = 1 to 10</text><path class="e" d="M310,396 L310,420" marker-end="url(#a)"/><text class="lb" x="315" y="411" text-anchor="start">próxima volta</text><path class="ou" d="M183,420 L451,420 L437,452 L169,452 Z"/><text class="t" x="310" y="440" text-anchor="middle">Output &quot;Aluno &quot; &amp; i &amp; &quot; de 10&quot;</text><path class="e" d="M310,452 L310,474" marker-end="url(#a)"/><path class="ou" d="M198.2,474 L435.8,474 L421.8,506 L184.2,506 Z"/><text class="t" x="310" y="494" text-anchor="middle">Output &quot;Digite a 1ª nota:&quot;</text><path class="e" d="M310,506 L310,528" marker-end="url(#a)"/><path class="in" d="M255.2,528 L378.8,528 L364.8,560 L241.2,560 Z"/><text class="t" x="310" y="548" text-anchor="middle">Input nota1</text><path class="e" d="M310,560 L310,582" marker-end="url(#a)"/><path class="ou" d="M198.2,582 L435.8,582 L421.8,614 L184.2,614 Z"/><text class="t" x="310" y="602" text-anchor="middle">Output &quot;Digite a 2ª nota:&quot;</text><path class="e" d="M310,614 L310,636" marker-end="url(#a)"/><path class="in" d="M255.2,636 L378.8,636 L364.8,668 L241.2,668 Z"/><text class="t" x="310" y="656" text-anchor="middle">Input nota2</text><path class="e" d="M310,668 L310,690" marker-end="url(#a)"/><path class="ou" d="M198.2,690 L435.8,690 L421.8,722 L184.2,722 Z"/><text class="t" x="310" y="710" text-anchor="middle">Output &quot;Digite a 3ª nota:&quot;</text><path class="e" d="M310,722 L310,744" marker-end="url(#a)"/><path class="in" d="M255.2,744 L378.8,744 L364.8,776 L241.2,776 Z"/><text class="t" x="310" y="764" text-anchor="middle">Input nota3</text><path class="e" d="M310,776 L310,798" marker-end="url(#a)"/><rect class="as" x="164" y="798" width="292" height="32" rx="3"/><text class="t" x="310" y="818" text-anchor="middle">media = (nota1 + nota2 + nota3) / 3</text><path class="e" d="M310,830 L310,852" marker-end="url(#a)"/><rect class="as" x="194.4" y="852" width="231.2" height="32" rx="3"/><text class="t" x="310" y="872" text-anchor="middle">acMedias = acMedias + media</text><path class="e" d="M310,884 L310,906" marker-end="url(#a)"/><path class="ou" d="M133.6,906 L500.4,906 L486.4,938 L119.6,938 Z"/><text class="t" x="310" y="926" text-anchor="middle">Output &quot;A média final do aluno é: &quot; &amp; media</text><path class="e" d="M310,938 L310,960" marker-end="url(#a)"/><path class="if" d="M310,960 L370.9,989.8 L310,1019.6 L249.1,989.8 Z"/><text class="t" x="310" y="993.8" text-anchor="middle">media &gt;= 7</text><text class="lb" x="374.9" y="984.8" text-anchor="start">Verdadeiro</text><text class="lb" x="245.1" y="984.8" text-anchor="end">Falso</text><path class="e" d="M370.9,989.8 L448.2,989.8 L448.2,1041.6" marker-end="url(#a)"/><path class="ou" d="M344,1041.6 L566.4,1041.6 L552.4,1073.6 L330,1073.6 Z"/><text class="t" x="448.2" y="1061.6" text-anchor="middle">Output &quot;Aluno aprovado.&quot;</text><path class="e" d="M448.2,1073.6 L448.2,1095.6" marker-end="url(#a)"/><rect class="as" x="340.2" y="1095.6" width="216" height="32" rx="3"/><text class="t" x="448.2" y="1115.6" text-anchor="middle">contAprov = contAprov + 1</text><path class="e" d="M448.2,1127.6 L448.2,1145.6 L310,1145.6"/><path class="e" d="M249.1,989.8 L168,989.8 L168,1041.6" marker-end="url(#a)"/><path class="ou" d="M60,1041.6 L290,1041.6 L276,1073.6 L46,1073.6 Z"/><text class="t" x="168" y="1061.6" text-anchor="middle">Output &quot;Aluno reprovado.&quot;</text><path class="e" d="M168,1073.6 L168,1095.6" marker-end="url(#a)"/><rect class="as" x="52.4" y="1095.6" width="231.2" height="32" rx="3"/><text class="t" x="168" y="1115.6" text-anchor="middle">contReprov = contReprov + 1</text><path class="e" d="M168,1127.6 L168,1145.6 L310,1145.6"/><circle cx="310" cy="1145.6" r="4" fill="#4B5563"/><path class="e" d="M310,1149.6 L310,1161.6 L20,1161.6 L20,379 L230,379" marker-end="url(#a)"/><path class="e" d="M390,379 L600.4,379 L600.4,1181.6 L310,1181.6"/><text class="lb" x="394" y="374" text-anchor="start">terminou</text><circle cx="310" cy="1181.6" r="4" fill="#4B5563"/><path class="e" d="M310,1185.6 L310,1207.6" marker-end="url(#a)"/><rect class="as" x="194.4" y="1207.6" width="231.2" height="32" rx="3"/><text class="t" x="310" y="1227.6" text-anchor="middle">mediaClasse = acMedias / 10</text><path class="e" d="M310,1239.6 L310,1261.6" marker-end="url(#a)"/><path class="ou" d="M175.4,1261.6 L458.6,1261.6 L444.6,1293.6 L161.4,1293.6 Z"/><text class="t" x="310" y="1281.6" text-anchor="middle">Output &quot;Aprovados: &quot; &amp; contAprov</text><path class="e" d="M310,1293.6 L310,1315.6" marker-end="url(#a)"/><path class="ou" d="M167.8,1315.6 L466.2,1315.6 L452.2,1347.6 L153.8,1347.6 Z"/><text class="t" x="310" y="1335.6" text-anchor="middle">Output &quot;Reprovados: &quot; &amp; contReprov</text><path class="e" d="M310,1347.6 L310,1369.6" marker-end="url(#a)"/><path class="ou" d="M152.6,1369.6 L481.4,1369.6 L467.4,1417.6 L138.6,1417.6 Z"/><text class="t" x="165.6" y="1389.6" text-anchor="start">Output &quot;A média geral da classe é: &quot; &amp;</text><text class="t" x="165.6" y="1405.6" text-anchor="start" xml:space="preserve">  mediaClasse</text><path class="e" d="M310,1417.6 L310,1439.6" marker-end="url(#a)"/><rect class="te" x="285.6" y="1439.6" width="48.8" height="32" rx="16"/><text class="t" x="310" y="1459.6" text-anchor="middle">End</text></svg>