<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="20" width="130" height="46" rx="23" fill="#F3F4F6" stroke="#374151" stroke-width="2"/><text x="168" y="40" font-size="15" font-weight="bold" fill="#374151">Início / Fim</text><text x="168" y="59" font-size="13" fill="#1F2937">Main, End, Return</text><rect x="400" y="20" width="130" height="46" rx="3" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2"/><text x="548" y="40" font-size="15" font-weight="bold" fill="#CA8A04">Declare</text><text x="548" y="59" font-size="13" fill="#1F2937">criar variável</text><rect x="20" y="94" width="130" height="46" rx="3" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/><text x="168" y="114" font-size="15" font-weight="bold" fill="#EA580C">Assign</text><text x="168" y="133" font-size="13" fill="#1F2937">atribuir valor / cálculo</text><path d="M416,94 L530,94 L514,140 L400,140 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="548" y="114" font-size="15" font-weight="bold" fill="#2563EB">Input</text><text x="548" y="133" font-size="13" fill="#1F2937">ler do teclado</text><path d="M36,168 L150,168 L134,214 L20,214 Z" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="168" y="188" font-size="15" font-weight="bold" fill="#16A34A">Output</text><text x="168" y="207" font-size="13" fill="#1F2937">mostrar na tela</text><path d="M465,164 L530,191 L465,218 L400,191 Z" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/><text x="548" y="188" font-size="15" font-weight="bold" fill="#DB2777">If</text><text x="548" y="207" font-size="13" fill="#1F2937">decisão (V ou F)</text><path d="M36,242 L134,242 L150,265 L134,288 L36,288 L20,265 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="168" y="262" font-size="15" font-weight="bold" fill="#7C3AED">For / While / Do</text><text x="168" y="281" font-siz