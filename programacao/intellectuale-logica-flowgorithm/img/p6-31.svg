<svg xmlns="http://www.w3.org/2000/svg" width="876" height="874" viewBox="0 0 876 874"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.lb{font-size:11.5px;font-style:italic;fill:#6B7280}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.if{fill:#FCE7F3;stroke:#DB2777;stroke-width:2}.lp{fill:#EDE9FE;stroke:#7C3AED;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><path class="ou" d="M293.9,14 L607.5,14 L593.5,46 L279.9,46 Z"/><text class="t" x="443.7" y="34" text-anchor="middle">Output &quot;Digite o nome do candidato:&quot;</text><path class="e" d="M443.7,46 L443.7,68" marker-end="url(#a)"/><path class="in" d="M377.5,68 L523.9,68 L509.9,100 L363.5,100 Z"/><text class="t" x="443.7" y="88" text-anchor="middle">Input nomeCand</text><path class="e" d="M443.7,100 L443.7,122" marker-end="url(#a)"/><path class="ou" d="M290.1,122 L611.3,122 L597.3,154 L276.1,154 Z"/><text class="t" x="443.7" y="142" text-anchor="middle">Output &quot;Digite a idade do candidato:&quot;</text><path class="e" d="M443.7,154 L443.7,176" marker-end="url(#a)"/><path class="in" d="M373.7,176 L527.7,176 L513.7,208 L359.7,208 Z"/><text class="t" x="443.7" y="196" text-anchor="middle">Input idadeCand</text><path class="e" d="M443.7,208 L443.7,230" marker-end="url(#a)"/><rect class="as" x="297.7" y="230" width="292" height="32" rx="3"/><text class="t" x="443.7" y="250" text-anchor="middle">somaIdades = somaIdades + idadeCand</text><path class="e" d="M443.7,262 L443.7,284" marker-end="url(#a)"/><circle cx="443.7" cy="288" r="4" fill="#4B5563"/><path class="e" d="M443.7,288 L443.7,298" marker-end="url(#a)"/><path class="ou" d="M274.9,298 L626.5,298 L612.5,346 L260.9,346 Z"/><text class="t" x="287.9" y="318" text-anchor="start">Output &quot;O candidato tem experiência? (sim</text><text class="t" x="287.9" y="334" text-anchor="start" xml:space="preserve">  ou não):&quot;</text><path class="e" d="M443.7,346 L443.7,368" marker-end="url(#a)"/><path class="in" d="M381.3,368 L520.1,368 L506.1,400 L367.3,400 Z"/><text class="t" x="443.7" y="388" text-anchor="middle">Input expCand</text><path class="e" d="M443.7,400 L443.7,424" marker-end="url(#a)"/><path class="lp" d="M297.9,424 L589.5,424 L603.5,449 L589.5,474 L297.9,474 L283.9,449 Z"/><text class="t" x="443.7" y="445" text-anchor="middle">Do (expCand != &quot;sim&quot;) &amp;&amp; (expCand !=</text><text class="t" x="443.7" y="461" text-anchor="middle">  &quot;não&quot;)</text><path class="e" d="M283.9,449 L234.9,449 L234.9,288 L438.7,288" marker-end="url(#a)"/><text class="lb" x="229.9" y="366.5" text-anchor="end">Verdadeiro:</text><text class="lb" x="229.9" y="380.5" text-anchor="end">repete</text><text class="lb" x="448.7" y="488" text-anchor="start">Falso</text><path class="e" d="M443.7,474 L443.7,496" marker-end="url(#a)"/><path class="ou" d="M267.3,496 L634.1,496 L620.1,544 L253.3,544 Z"/><text class="t" x="280.3" y="516" text-anchor="start">Output &quot;(... mesma validação para superior,</text><text class="t" x="280.3" y="532" text-anchor="start" xml:space="preserve">  inglês e espanhol ...)&quot;</text><path class="e" d="M443.7,544 L443.7,566" marker-end="url(#a)"/><path class="if" d="M443.7,566 L685.5,647 L443.7,728 L202,647 Z"/><text class="t" x="443.7" y="619" text-anchor="middle">((estCand == &quot;sim&quot;) ||</text><text class="t" x="443.7" y="635" text-anchor="middle">  ((idadeCand &gt; 21) &amp;&amp; (expCand</text><text class="t" x="443.7" y="651" text-anchor="middle">  == &quot;sim&quot;)) || (ingCand ==</text><text class="t" x="443.7" y="667" text-anchor="middle">  &quot;sim&quot;) || (espCand == &quot;sim&quot;))</text><text class="t" x="443.7" y="683" text-anchor="middle">  &amp;&amp; (idadeCand &gt;= 18)</text><text class="lb" x="689.5" y="642" text-anchor="start">Verdadeiro</text><text class="lb" x="198" y="642" text-anchor="end">Falso</text><path class="e" d="M685.5,647 L707.5,647 L707.5,750" marker-end="url(#a)"/><rect class="as" x="599.5" y="750" width="216" height="32" rx="3"/><text class="t" x="707.5" y="770" text-anchor="middle">contAprov = contAprov + 1</text><path class="e" d="M707.5,782 L707.5,804" marker-end="url(#a)"/><path class="ou" d="M576.7,804 L852.3,804 L838.3,836 L562.7,836 Z"/><text class="t" x="707.5" y="824" text-anchor="middle">Output &quot;Candidato SELECIONADO.&quot;</text><path class="e" d="M707.5,836 L707.5,854 L443.7,854"/><path class="e" d="M202,647 L180,647 L180,750" marker-end="url(#a)"/><rect class="as" x="64.4" y="750" width="231.2" height="32" rx="3"/><text class="t" x="180" y="770" text-anchor="middle">contReprov = contReprov + 1</text><path class="e" d="M180,782 L180,804" marker-end="url(#a)"/><path class="ou" d="M34,804 L340,804 L326,836 L20,836 Z"/><text class="t" x="180" y="824" text-anchor="middle">Output &quot;Candidato não selecionado.&quot;</text><path class="e" d="M180,836 L180,854 L443.7,854"/><circle cx="443.7" cy="854" r="4" fill="#4B5563"/></svg>