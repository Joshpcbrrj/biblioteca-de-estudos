<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Assign contador = contador + 1   (leia: contador RECEBE contador + 1)</text><rect x="20" y="50" width="220" height="130" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="130" y="76" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">1. lê o valor atual</text><text x="130" y="112" class="m" font-size="15" fill="#1F2937" text-anchor="middle">contador</text><rect x="95" y="124" width="70" height="40" rx="4" fill="#fff" stroke="#2563EB" stroke-width="1.8"/><text x="130" y="151" class="m" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">5</text><rect x="270" y="50" width="220" height="130" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="380" y="76" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">2. calcula o lado direito</text><text x="380" y="112" class="m" font-size="15" fill="#1F2937" text-anchor="middle">5 + 1</text><rect x="345" y="124" width="70" height="40" rx="4" fill="#fff" stroke="#D97706" stroke-width="1.8"/><text x="380" y="151" class="m" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">6</text><line x1="242" y1="115" x2="266" y2="115" stroke="#1F2937" stroke-width="3" marker-end="url(#ara)"/><rect x="520" y="50" width="220" height="130" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="630" y="76" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">3. guarda no lado esquerdo</text><text x="630" y="112" class="m" font-size="15" fill="#1F2937" text-anchor="middle">contador</text><rect x="595" y="124" width="70" height="40" rx="4" fill="#fff" stroke="#16A34A" stroke-width="1.8"/><text x="630" y="151" class="m" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">6</text><line x1="492" y1="115" x2="516" y2="115" stroke="#1F2937" stroke-width="3" marker-end="url(#ara)"/></svg>