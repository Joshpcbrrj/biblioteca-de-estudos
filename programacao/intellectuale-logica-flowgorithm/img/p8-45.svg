<svg xmlns="http://www.w3.org/2000/svg" width="929" height="400" viewBox="0 0 929 400"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.lb{font-size:11.5px;font-style:italic;fill:#6B7280}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.if{fill:#FCE7F3;stroke:#DB2777;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect class="te" x="186" y="14" width="56.4" height="32" rx="16"/><text class="t" x="214.2" y="34" text-anchor="middle">Main</text><path class="e" d="M214.2,46 L214.2,68" marker-end="url(#a)"/><rect class="dc" x="117.6" y="68" width="193.2" height="46" rx="3"/><text x="214.2" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="214.2" y="102" text-anchor="middle">Integer num, resultado</text><path class="e" d="M214.2,114 L214.2,136" marker-end="url(#a)"/><path class="ou" d="M34,136 L408.4,136 L394.4,168 L20,168 Z"/><text class="t" x="214.2" y="156" text-anchor="middle">Output &quot;Digite um número inteiro positivo: &quot;</text><path class="e" d="M214.2,168 L214.2,190" marker-end="url(#a)"/><path class="in" d="M167,190 L275.4,190 L261.4,222 L153,222 Z"/><text class="t" x="214.2" y="210" text-anchor="middle">Input num</text><path class="e" d="M214.2,222 L214.2,244" marker-end="url(#a)"/><rect class="as" x="79.6" y="244" width="269.2" height="32" rx="3"/><text class="t" x="214.2" y="264" text-anchor="middle">resultado = retornaFatorial(num)</text><path class="e" d="M214.2,276 L214.2,298" marker-end="url(#a)"/><path class="ou" d="M83.4,298 L359,298 L345,330 L69.4,330 Z"/><text class="t" x="214.2" y="318" text-anchor="middle">Output num &amp; &quot;! = &quot; &amp; resultado</text><path class="e" d="M214.2,330 L214.2,352" marker-end="url(#a)"/><rect class="te" x="189.8" y="352" width="48.8" height="32" rx="16"/><text class="t" x="214.2" y="372" text-anchor="middle">End</text><rect class="te" x="626.6" y="14" width="223.6" height="32" rx="16"/><text class="t" x="738.4" y="34" text-anchor="middle">retornaFatorial(Integer n)</text><path class="e" d="M738.4,46 L738.4,68" marker-end="url(#a)"/><rect class="dc" x="691.2" y="68" width="94.4" height="46" rx="3"/><text x="738.4" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="738.4" y="102" text-anchor="middle">Integer r</text><path class="e" d="M738.4,114 L738.4,136" marker-end="url(#a)"/><path class="if" d="M738.4,136 L851.3,165.8 L738.4,195.6 L625.5,165.8 Z"/><text class="t" x="738.4" y="169.8" text-anchor="middle">(n == 0) || (n == 1)</text><text class="lb" x="855.3" y="160.8" text-anchor="start">Verdadeiro</text><text class="lb" x="621.5" y="160.8" text-anchor="end">Falso</text><path class="e" d="M851.3,165.8 L873.3,165.8 L873.3,217.6" marker-end="url(#a)"/><rect class="as" x="841.3" y="217.6" width="64" height="32" rx="3"/><text class="t" x="873.3" y="237.6" text-anchor="middle">r = 1</text><path class="e" d="M873.3,249.6 L873.3,267.6 L738.4,267.6"/><path class="e" d="M625.5,165.8 L591.4,165.8 L591.4,217.6" marker-end="url(#a)"/><rect class="as" x="464.4" y="217.6" width="254" height="32" rx="3"/><text class="t" x="591.4" y="237.6" text-anchor="middle">r = n * retornaFatorial(n - 1)</text><path class="e" d="M591.4,249.6 L591.4,267.6 L738.4,267.6"/><circle cx="738.4" cy="267.6" r="4" fill="#4B5563"/><path class="e" d="M738.4,271.6 L738.4,293.6" marker-end="url(#a)"/><rect class="te" x="664.6" y="293.6" width="147.6" height="32" rx="16"/><text class="t" x="738.4" y="313.6" text-anchor="middle">Return Integer r</text></svg>