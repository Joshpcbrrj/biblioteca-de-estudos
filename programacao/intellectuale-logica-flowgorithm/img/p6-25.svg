<svg xmlns="http://www.w3.org/2000/svg" width="488" height="618" viewBox="0 0 488 618"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.lb{font-size:11.5px;font-style:italic;fill:#6B7280}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.lp{fill:#EDE9FE;stroke:#7C3AED;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect class="te" x="212" y="14" width="56.4" height="32" rx="16"/><text class="t" x="240.2" y="34" text-anchor="middle">Main</text><path class="e" d="M240.2,46 L240.2,68" marker-end="url(#a)"/><rect class="dc" x="132.2" y="68" width="216" height="62" rx="3"/><text x="240.2" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="145.2" y="102" text-anchor="start">Integer cont</text><text class="t" x="145.2" y="118" text-anchor="start">Real num, somaNums, media</text><path class="e" d="M240.2,130 L240.2,152" marker-end="url(#a)"/><rect class="as" x="181.6" y="152" width="117.2" height="32" rx="3"/><text class="t" x="240.2" y="172" text-anchor="middle">somaNums = 0</text><path class="e" d="M240.2,184 L240.2,206" marker-end="url(#a)"/><path class="lp" d="M162.8,206 L317.6,206 L331.6,223 L317.6,240 L162.8,240 L148.8,223 Z"/><text class="t" x="240.2" y="227" text-anchor="middle">For cont = 1 to 10</text><path class="e" d="M240.2,240 L240.2,264" marker-end="url(#a)"/><text class="lb" x="245.2" y="255" text-anchor="start">próxima volta</text><path class="ou" d="M60,264 L434.4,264 L420.4,296 L46,296 Z"/><text class="t" x="240.2" y="284" text-anchor="middle">Output &quot;Digite o &quot; &amp; cont &amp; &quot;º valor de 10:&quot;</text><path class="e" d="M240.2,296 L240.2,318" marker-end="url(#a)"/><path class="in" d="M193,318 L301.4,318 L287.4,350 L179,350 Z"/><text class="t" x="240.2" y="338" text-anchor="middle">Input num</text><path class="e" d="M240.2,350 L240.2,372" marker-end="url(#a)"/><rect class="as" x="132.2" y="372" width="216" height="32" rx="3"/><text class="t" x="240.2" y="392" text-anchor="middle">somaNums = somaNums + num</text><path class="e" d="M240.2,404 L240.2,416 L20,416 L20,223 L148.8,223" marker-end="url(#a)"/><path class="e" d="M331.6,223 L464.4,223 L464.4,436 L240.2,436"/><text class="lb" x="335.6" y="218" text-anchor="start">terminou</text><circle cx="240.2" cy="436" r="4" fill="#4B5563"/><path class="e" d="M240.2,440 L240.2,462" marker-end="url(#a)"/><rect class="as" x="147.4" y="462" width="185.6" height="32" rx="3"/><text class="t" x="240.2" y="482" text-anchor="middle">media = somaNums / 10</text><path class="e" d="M240.2,494 L240.2,516" marker-end="url(#a)"/><path class="ou" d="M63.8,516 L430.6,516 L416.6,548 L49.8,548 Z"/><text class="t" x="240.2" y="536" text-anchor="middle">Output &quot;A média dos 10 números é: &quot; &amp; media</text><path class="e" d="M240.2,548 L240.2,570" marker-end="url(#a)"/><rect class="te" x="215.8" y="570" width="48.8" height="32" rx="16"/><text class="t" x="240.2" y="590" text-anchor="middle">End</text></svg>