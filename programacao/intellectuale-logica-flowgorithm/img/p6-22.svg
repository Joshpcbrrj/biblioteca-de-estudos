<svg xmlns="http://www.w3.org/2000/svg" width="473" height="510" viewBox="0 0 473 510"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.lb{font-size:11.5px;font-style:italic;fill:#6B7280}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.lp{fill:#EDE9FE;stroke:#7C3AED;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect class="te" x="204.4" y="14" width="56.4" height="32" rx="16"/><text class="t" x="232.6" y="34" text-anchor="middle">Main</text><path class="e" d="M232.6,46 L232.6,68" marker-end="url(#a)"/><rect class="dc" x="124.6" y="68" width="216" height="46" rx="3"/><text x="232.6" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="232.6" y="102" text-anchor="middle">Integer num, i, resultado</text><path class="e" d="M232.6,114 L232.6,136" marker-end="url(#a)"/><path class="ou" d="M79,136 L400.2,136 L386.2,184 L65,184 Z"/><text class="t" x="92" y="156" text-anchor="start">Output &quot;Digite um número inteiro para</text><text class="t" x="92" y="172" text-anchor="start" xml:space="preserve">  montar sua tabuada: &quot;</text><path class="e" d="M232.6,184 L232.6,206" marker-end="url(#a)"/><path class="in" d="M185.4,206 L293.8,206 L279.8,238 L171.4,238 Z"/><text class="t" x="232.6" y="226" text-anchor="middle">Input num</text><path class="e" d="M232.6,238 L232.6,260" marker-end="url(#a)"/><path class="lp" d="M166.6,260 L298.6,260 L312.6,277 L298.6,294 L166.6,294 L152.6,277 Z"/><text class="t" x="232.6" y="281" text-anchor="middle">For i = 1 to 10</text><path class="e" d="M232.6,294 L232.6,318" marker-end="url(#a)"/><text class="lb" x="237.6" y="309" text-anchor="start">próxima volta</text><rect class="as" x="147.4" y="318" width="170.4" height="32" rx="3"/><text class="t" x="232.6" y="338" text-anchor="middle">resultado = num * i</text><path class="e" d="M232.6,350 L232.6,372" marker-end="url(#a)"/><path class="ou" d="M60,372 L419.2,372 L405.2,404 L46,404 Z"/><text class="t" x="232.6" y="392" text-anchor="middle">Output num &amp; &quot; x &quot; &amp; i &amp; &quot; = &quot; &amp; resultado</text><path class="e" d="M232.6,404 L232.6,416 L20,416 L20,277 L152.6,277" marker-end="url(#a)"/><path class="e" d="M312.6,277 L449.2,277 L449.2,436 L232.6,436"/><text class="lb" x="316.6" y="272" text-anchor="start">terminou</text><circle cx="232.6" cy="436" r="4" fill="#4B5563"/><path class="e" d="M232.6,440 L232.6,462" marker-end="url(#a)"/><rect class="te" x="208.2" y="462" width="48.8" height="32" rx="16"/><text class="t" x="232.6" y="482" text-anchor="middle">End</text></svg>