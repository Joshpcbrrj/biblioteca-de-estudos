<svg xmlns="http://www.w3.org/2000/svg" width="421" height="1068" viewBox="0 0 421 1068"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect class="te" x="182.2" y="14" width="56.4" height="32" rx="16"/><text class="t" x="210.4" y="34" text-anchor="middle">Main</text><path class="e" d="M210.4,46 L210.4,68" marker-end="url(#a)"/><rect class="dc" x="102.4" y="68" width="216" height="78" rx="3"/><text x="210.4" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="115.4" y="102" text-anchor="start">Integer v1, v2, resultado</text><text class="t" x="115.4" y="118" text-anchor="start">Real divisao</text><text class="t" x="115.4" y="134" text-anchor="start">Integer resto</text><path class="e" d="M210.4,146 L210.4,168" marker-end="url(#a)"/><path class="ou" d="M94.8,168 L340,168 L326,200 L80.8,200 Z"/><text class="t" x="210.4" y="188" text-anchor="middle">Output &quot;Digite um número: &quot;</text><path class="e" d="M210.4,200 L210.4,222" marker-end="url(#a)"/><path class="in" d="M167,222 L267.8,222 L253.8,254 L153,254 Z"/><text class="t" x="210.4" y="242" text-anchor="middle">Input v1</text><path class="e" d="M210.4,254 L210.4,276" marker-end="url(#a)"/><path class="ou" d="M83.4,276 L351.4,276 L337.4,308 L69.4,308 Z"/><text class="t" x="210.4" y="296" text-anchor="middle">Output &quot;Digite outro número: &quot;</text><path class="e" d="M210.4,308 L210.4,330" marker-end="url(#a)"/><path class="in" d="M167,330 L267.8,330 L253.8,362 L153,362 Z"/><text class="t" x="210.4" y="350" text-anchor="middle">Input v2</text><path class="e" d="M210.4,362 L210.4,384" marker-end="url(#a)"/><path class="ou" d="M75.8,384 L359,384 L345,432 L61.8,432 Z"/><text class="t" x="88.8" y="404" text-anchor="start">Output &quot;Efetuando as 4 operações</text><text class="t" x="88.8" y="420" text-anchor="start" xml:space="preserve">  elementares&quot;</text><path class="e" d="M210.4,432 L210.4,454" marker-end="url(#a)"/><rect class="as" x="125.2" y="454" width="170.4" height="32" rx="3"/><text class="t" x="210.4" y="474" text-anchor="middle">resultado = v1 + v2</text><path class="e" d="M210.4,486 L210.4,508" marker-end="url(#a)"/><path class="ou" d="M34,508 L400.8,508 L386.8,556 L20,556 Z"/><text class="t" x="47" y="528" text-anchor="start">Output &quot;A soma de &quot; &amp; v1 &amp; &quot; com &quot; &amp; v2 &amp; &quot;</text><text class="t" x="47" y="544" text-anchor="start" xml:space="preserve">  é: &quot; &amp; resultado</text><path class="e" d="M210.4,556 L210.4,578" marker-end="url(#a)"/><rect class="as" x="125.2" y="578" width="170.4" height="32" rx="3"/><text class="t" x="210.4" y="598" text-anchor="middle">resultado = v1 - v2</text><path class="e" d="M210.4,610 L210.4,632" marker-end="url(#a)"/><path class="ou" d="M34,632 L400.8,632 L386.8,680 L20,680 Z"/><text class="t" x="47" y="652" text-anchor="start">Output &quot;A subtração de &quot; &amp; v1 &amp; &quot; menos &quot; &amp;</text><text class="t" x="47" y="668" text-anchor="start" xml:space="preserve">  v2 &amp; &quot; é: &quot; &amp; resultado</text><path class="e" d="M210.4,680 L210.4,702" marker-end="url(#a)"/><rect class="as" x="125.2" y="702" width="170.4" height="32" rx="3"/><text class="t" x="210.4" y="722" text-anchor="middle">resultado = v1 * v2</text><path class="e" d="M210.4,734 L210.4,756" marker-end="url(#a)"/><path class="ou" d="M34,756 L400.8,756 L386.8,804 L20,804 Z"/><text class="t" x="47" y="776" text-anchor="start">Output &quot;A multiplicação de &quot; &amp; v1 &amp; &quot; por &quot;</text><text class="t" x="47" y="792" text-anchor="start" xml:space="preserve">  &amp; v2 &amp; &quot; é: &quot; &amp; resultado</text><path class="e" d="M210.4,804 L210.4,826" marker-end="url(#a)"/><rect class="as" x="132.8" y="826" width="155.2" height="32" rx="3"/><text class="t" x="210.4" y="846" text-anchor="middle">divisao = v1 / v2</text><path class="e" d="M210.4,858 L210.4,880" marker-end="url(#a)"/><rect class="as" x="140.4" y="880" width="140" height="32" rx="3"/><text class="t" x="210.4" y="900" text-anchor="middle">resto = v1 % v2</text><path class="e" d="M210.4,912 L210.4,934" marker-end="url(#a)"/><path class="ou" d="M37.8,934 L397,934 L383,998 L23.8,998 Z"/><text class="t" x="50.8" y="954" text-anchor="start">Output &quot;A divisão de &quot; &amp; v1 &amp; &quot; por &quot; &amp; v2</text><text class="t" x="50.8" y="970" text-anchor="start" xml:space="preserve">  &amp; &quot; é: &quot; &amp; divisao &amp; &quot; (resto: &quot; &amp; resto</text><text class="t" x="50.8" y="986" text-anchor="start" xml:space="preserve">  &amp; &quot;)&quot;</text><path class="e" d="M210.4,998 L210.4,1020" marker-end="url(#a)"/><rect class="te" x="186" y="1020" width="48.8" height="32" rx="16"/><text class="t" x="210.4" y="1040" text-anchor="middle">End</text></svg>