<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="20" width="330" height="230" rx="12" fill="#F9FAFB" stroke="#2563EB" stroke-width="2"/><text x="185" y="46" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">Main</text><text x="40" y="86" class="m" font-size="14" fill="#1F2937">nota1 = 6</text><text x="40" y="110" class="m" font-size="14" fill="#1F2937">nota2 = 9</text><rect x="34" y="135" width="300" height="34" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="184" y="157" class="m" font-size="13" fill="#1F2937" text-anchor="middle">media = calculaMedia(nota1, nota2)</text><text x="40" y="205" class="m" font-size="15" font-weight="bold" fill="#16A34A">media → 7.5</text><rect x="410" y="20" width="330" height="230" rx="12" fill="#F9FAFB" stroke="#7C3AED" stroke-width="2"/><text x="575" y="46" class="m" font-size="13" font-weight="bold" fill="#7C3AED" text-anchor="middle">Function calculaMedia(Real a, Real b)</text><text x="430" y="86" class="m" font-size="14" fill="#1F2937">a = 6   b = 9</text><text x="430" y="120" class="m" font-size="14" fill="#1F2937">m = (a + b) / 2</text><text x="430" y="154" class="m" font-size="14" fill="#1F2937">m = 7.5</text><text x="430" y="205" class="m" font-size="15" font-weight="bold" fill="#16A34A">Return Real m</text><path d="M334,145 C370,145 380,80 426,80" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arb)"/><rect x="298.9" y="51.5" width="162.1" height="20.5" rx="5" fill="#fff" stroke="#fff" stroke-width="0"/><text x="380" y="65" font-size="11.5" fill="#2563EB" text-anchor="middle">argumentos → parâmetros</text><path d="M408,200 L182,200" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arv)"/><rect x="241.5" y="213.5" width="117" height="20.5" rx="5" fill="#fff" stroke="#fff" stroke-width="0"/><text x="300" y="227" font-size="11.5" fill="#16A34A" text-anchor="middle">valor de retorno</text></svg>