<svg xmlns="http://www.w3.org/2000/svg" width="406" height="836" viewBox="0 0 406 836"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect class="te" x="174.6" y="14" width="56.4" height="32" rx="16"/><text class="t" x="202.8" y="34" text-anchor="middle">Main</text><path class="e" d="M202.8,46 L202.8,68" marker-end="url(#a)"/><rect class="dc" x="37.8" y="68" width="330" height="62" rx="3"/><text x="202.8" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="50.8" y="102" text-anchor="start">Real valorHora, qtdHorasTrabalhadas,</text><text class="t" x="50.8" y="118" text-anchor="start" xml:space="preserve">  salarioBruto, desconto, salarioLiquido</text><path class="e" d="M202.8,130 L202.8,152" marker-end="url(#a)"/><path class="ou" d="M64.4,152 L355.2,152 L341.2,200 L50.4,200 Z"/><text class="t" x="77.4" y="172" text-anchor="start">Output &quot;Entre com o valor da hora</text><text class="t" x="77.4" y="188" text-anchor="start" xml:space="preserve">  trabalhada:&quot;</text><path class="e" d="M202.8,200 L202.8,222" marker-end="url(#a)"/><path class="in" d="M132.8,222 L286.8,222 L272.8,254 L118.8,254 Z"/><text class="t" x="202.8" y="242" text-anchor="middle">Input valorHora</text><path class="e" d="M202.8,254 L202.8,276" marker-end="url(#a)"/><path class="ou" d="M53,276 L366.6,276 L352.6,324 L39,324 Z"/><text class="t" x="66" y="296" text-anchor="start">Output &quot;Digite a quantidade de horas</text><text class="t" x="66" y="312" text-anchor="start" xml:space="preserve">  trabalhadas:&quot;</text><path class="e" d="M202.8,324 L202.8,346" marker-end="url(#a)"/><path class="in" d="M94.8,346 L324.8,346 L310.8,378 L80.8,378 Z"/><text class="t" x="202.8" y="366" text-anchor="middle">Input qtdHorasTrabalhadas</text><path class="e" d="M202.8,378 L202.8,400" marker-end="url(#a)"/><rect class="as" x="91" y="400" width="223.6" height="48" rx="3"/><text class="t" x="104" y="420" text-anchor="start">salarioBruto = valorHora *</text><text class="t" x="104" y="436" text-anchor="start" xml:space="preserve">  qtdHorasTrabalhadas</text><path class="e" d="M202.8,448 L202.8,470" marker-end="url(#a)"/><rect class="as" x="75.8" y="470" width="254" height="32" rx="3"/><text class="t" x="202.8" y="490" text-anchor="middle">desconto = salarioBruto * 0.10</text><path class="e" d="M202.8,502 L202.8,524" marker-end="url(#a)"/><rect class="as" x="37.8" y="524" width="330" height="32" rx="3"/><text class="t" x="202.8" y="544" text-anchor="middle">salarioLiquido = salarioBruto - desconto</text><path class="e" d="M202.8,556 L202.8,578" marker-end="url(#a)"/><path class="ou" d="M64.4,578 L355.2,578 L341.2,626 L50.4,626 Z"/><text class="t" x="77.4" y="598" text-anchor="start">Output &quot;O salário bruto é: R$ &quot; &amp;</text><text class="t" x="77.4" y="614" text-anchor="start" xml:space="preserve">  salarioBruto</text><path class="e" d="M202.8,626 L202.8,648" marker-end="url(#a)"/><path class="ou" d="M49.2,648 L370.4,648 L356.4,696 L35.2,696 Z"/><text class="t" x="62.2" y="668" text-anchor="start">Output &quot;O valor do desconto é: R$ &quot; &amp;</text><text class="t" x="62.2" y="684" text-anchor="start" xml:space="preserve">  desconto</text><path class="e" d="M202.8,696 L202.8,718" marker-end="url(#a)"/><path class="ou" d="M34,718 L385.6,718 L371.6,766 L20,766 Z"/><text class="t" x="47" y="738" text-anchor="start">Output &quot;O valor líquido a ser recebido é:</text><text class="t" x="47" y="754" text-anchor="start" xml:space="preserve">  R$ &quot; &amp; salarioLiquido</text><path class="e" d="M202.8,766 L202.8,788" marker-end="url(#a)"/><rect class="te" x="178.4" y="788" width="48.8" height="32" rx="16"/><text class="t" x="202.8" y="808" text-anchor="middle">End</text></svg>