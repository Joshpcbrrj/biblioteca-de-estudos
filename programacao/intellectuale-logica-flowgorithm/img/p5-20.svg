<svg xmlns="http://www.w3.org/2000/svg" width="613" height="1239" viewBox="0 0 613 1239"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.lb{font-size:11.5px;font-style:italic;fill:#6B7280}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.if{fill:#FCE7F3;stroke:#DB2777;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect class="te" x="186" y="14" width="56.4" height="32" rx="16"/><text class="t" x="214.2" y="34" text-anchor="middle">Main</text><path class="e" d="M214.2,46 L214.2,68" marker-end="url(#a)"/><rect class="dc" x="129" y="68" width="170.4" height="62" rx="3"/><text x="214.2" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="142" y="102" text-anchor="start">String nome</text><text class="t" x="142" y="118" text-anchor="start">Real alt, peso, imc</text><path class="e" d="M214.2,130 L214.2,152" marker-end="url(#a)"/><path class="ou" d="M102.4,152 L340,152 L326,184 L88.4,184 Z"/><text class="t" x="214.2" y="172" text-anchor="middle">Output &quot;Digite seu nome: &quot;</text><path class="e" d="M214.2,184 L214.2,206" marker-end="url(#a)"/><path class="in" d="M163.2,206 L279.2,206 L265.2,238 L149.2,238 Z"/><text class="t" x="214.2" y="226" text-anchor="middle">Input nome</text><path class="e" d="M214.2,238 L214.2,260" marker-end="url(#a)"/><path class="ou" d="M45.4,260 L397,260 L383,308 L31.4,308 Z"/><text class="t" x="58.4" y="280" text-anchor="start">Output &quot;Digite sua altura em metros (ex.:</text><text class="t" x="58.4" y="296" text-anchor="start" xml:space="preserve">  1.75): &quot;</text><path class="e" d="M214.2,308 L214.2,330" marker-end="url(#a)"/><path class="in" d="M167,330 L275.4,330 L261.4,362 L153,362 Z"/><text class="t" x="214.2" y="350" text-anchor="middle">Input alt</text><path class="e" d="M214.2,362 L214.2,384" marker-end="url(#a)"/><path class="ou" d="M79.6,384 L362.8,384 L348.8,416 L65.6,416 Z"/><text class="t" x="214.2" y="404" text-anchor="middle">Output &quot;Digite seu peso em kg: &quot;</text><path class="e" d="M214.2,416 L214.2,438" marker-end="url(#a)"/><path class="in" d="M163.2,438 L279.2,438 L265.2,470 L149.2,470 Z"/><text class="t" x="214.2" y="458" text-anchor="middle">Input peso</text><path class="e" d="M214.2,470 L214.2,492" marker-end="url(#a)"/><rect class="as" x="110" y="492" width="208.4" height="32" rx="3"/><text class="t" x="214.2" y="512" text-anchor="middle">imc = peso / (alt * alt)</text><path class="e" d="M214.2,524 L214.2,546" marker-end="url(#a)"/><path class="ou" d="M34,546 L408.4,546 L394.4,578 L20,578 Z"/><text class="t" x="214.2" y="566" text-anchor="middle">Output &quot;Olá &quot; &amp; nome &amp; &quot;. Seu IMC é: &quot; &amp; imc</text><path class="e" d="M214.2,578 L214.2,600" marker-end="url(#a)"/><path class="if" d="M214.2,600 L275.1,629.8 L214.2,659.6 L153.3,629.8 Z"/><text class="t" x="214.2" y="633.8" text-anchor="middle">imc &lt; 18.5</text><text class="lb" x="279.1" y="624.8" text-anchor="start">Verdadeiro</text><path class="e" d="M275.1,629.8 L430.1,629.8 L430.1,651.8" marker-end="url(#a)"/><path class="ou" d="M303.1,651.8 L571.1,651.8 L557.1,683.8 L289.1,683.8 Z"/><text class="t" x="430.1" y="671.8" text-anchor="middle">Output &quot;Abaixo do peso ideal.&quot;</text><path class="e" d="M430.1,683.8 L430.1,691.8 L589.1,691.8"/><circle cx="589.1" cy="691.8" r="3" fill="#4B5563"/><path class="e" d="M214.2,659.6 L214.2,699.8" marker-end="url(#a)"/><text class="lb" x