<svg xmlns="http://www.w3.org/2000/svg" width="421" height="556" viewBox="0 0 421 556"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect class="te" x="182.2" y="14" width="56.4" height="32" rx="16"/><text class="t" x="210.4" y="34" text-anchor="middle">Main</text><path class="e" d="M210.4,46 L210.4,68" marker-end="url(#a)"/><rect class="dc" x="75.8" y="68" width="269.2" height="46" rx="3"/><text x="210.4" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="210.4" y="102" text-anchor="middle">Real base, altura, areaTriangulo</text><path class="e" d="M210.4,114 L210.4,136" marker-end="url(#a)"/><path class="ou" d="M72,136 L362.8,136 L348.8,184 L58,184 Z"/><text class="t" x="85" y="156" text-anchor="start">Output &quot;Digite o valor da base do</text><text class="t" x="85" y="172" text-anchor="start" xml:space="preserve">  triângulo:&quot;</text><path class="e" d="M210.4,184 L210.4,206" marker-end="url(#a)"/><path class="in" d="M159.4,206 L275.4,206 L261.4,238 L145.4,238 Z"/><text class="t" x="210.4" y="226" text-anchor="middle">Input base</text><path class="e" d="M210.4,238 L210.4,260" marker-end="url(#a)"/><path class="ou" d="M64.4,260 L370.4,260 L356.4,308 L50.4,308 Z"/><text class="t" x="77.4" y="280" text-anchor="start">Output &quot;Digite o valor da altura do</text><text class="t" x="77.4" y="296" text-anchor="start" xml:space="preserve">  triângulo:&quot;</text><path class="e" d="M210.4,308 L210.4,330" marker-end="url(#a)"/><path class="in" d="M151.8,330 L283,330 L269,362 L137.8,362 Z"/><text class="t" x="210.4" y="350" text-anchor="middle">Input altura</text><path class="e" d="M210.4,362 L210.4,384" marker-end="url(#a)"/><rect class="as" x="64.4" y="384" width="292" height="32" rx="3"/><text class="t" x="210.4" y="404" text-anchor="middle">areaTriangulo = (base * altura) / 2</text><path class="e" d="M210.4,416 L210.4,438" marker-end="url(#a)"/><path class="ou" d="M34,438 L400.8,438 L386.8,486 L20,486 Z"/><text class="t" x="47" y="458" text-anchor="start">Output &quot;O valor da área do triângulo é: &quot; &amp;</text><text class="t" x="47" y="474" text-anchor="start" xml:space="preserve">  areaTriangulo</text><path class="e" d="M210.4,486 L210.4,508" marker-end="url(#a)"/><rect class="te" x="186" y="508" width="48.8" height="32" rx="16"/><text class="t" x="210.4" y="528" text-anchor="middle">End</text></svg>