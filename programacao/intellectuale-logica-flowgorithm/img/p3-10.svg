<svg xmlns="http://www.w3.org/2000/svg" width="421" height="610" viewBox="0 0 421 610"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect class="te" x="182.2" y="14" width="56.4" height="32" rx="16"/><text class="t" x="210.4" y="34" text-anchor="middle">Main</text><path class="e" d="M210.4,46 L210.4,68" marker-end="url(#a)"/><rect class="dc" x="49.2" y="68" width="322.4" height="46" rx="3"/><text x="210.4" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="210.4" y="102" text-anchor="middle">Real valorReais, cotacaoEuro, valorEuro</text><path class="e" d="M210.4,114 L210.4,136" marker-end="url(#a)"/><path class="ou" d="M45.4,136 L389.4,136 L375.4,184 L31.4,184 Z"/><text class="t" x="58.4" y="156" text-anchor="start">Output &quot;Digite o valor em reais que quer</text><text class="t" x="58.4" y="172" text-anchor="start" xml:space="preserve">  converter para euro: &quot;</text><path class="e" d="M210.4,184 L210.4,206" marker-end="url(#a)"/><path class="in" d="M136.6,206 L298.2,206 L284.2,238 L122.6,238 Z"/><text class="t" x="210.4" y="226" text-anchor="middle">Input valorReais</text><path class="e" d="M210.4,238 L210.4,260" marker-end="url(#a)"/><path class="ou" d="M41.6,260 L393.2,260 L379.2,308 L27.6,308 Z"/><text class="t" x="54.6" y="280" text-anchor="start">Output &quot;Digite o valor da cotação do euro</text><text class="t" x="54.6" y="296" text-anchor="start" xml:space="preserve">  (ex.: 6.25): &quot;</text><path class="e" d="M210.4,308 L210.4,330" marker-end="url(#a)"/><path class="in" d="M132.8,330 L302,330 L288,362 L118.8,362 Z"/><text class="t" x="210.4" y="350" text-anchor="middle">Input cotacaoEuro</text><path class="e" d="M210.4,362 L210.4,384" marker-end="url(#a)"/><rect class="as" x="60.6" y="384" width="299.6" height="32" rx="3"/><text class="t" x="210.4" y="404" text-anchor="middle">valorEuro = valorReais / cotacaoEuro</text><path class="e" d="M210.4,416 L210.4,438" marker-end="url(#a)"/><path class="ou" d="M56.8,438 L378,438 L364,470 L42.8,470 Z"/><text class="t" x="210.4" y="458" text-anchor="middle">Output &quot;1 EUR vale R$ &quot; &amp; cotacaoEuro</text><path class="e" d="M210.4,470 L210.4,492" marker-end="url(#a)"/><path class="ou" d="M34,492 L400.8,492 L386.8,540 L20,540 Z"/><text class="t" x="47" y="512" text-anchor="start">Output &quot;R$ &quot; &amp; valorReais &amp; &quot; valem EUR &quot; &amp;</text><text class="t" x="47" y="528" text-anchor="start" xml:space="preserve">  valorEuro</text><path class="e" d="M210.4,540 L210.4,562" marker-end="url(#a)"/><rect class="te" x="186" y="562" width="48.8" height="32" rx="16"/><text class="t" x="210.4" y="582" text-anchor="middle">End</text></svg>