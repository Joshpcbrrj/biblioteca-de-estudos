<svg xmlns="http://www.w3.org/2000/svg" width="624" height="1240" viewBox="0 0 624 1240"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.lb{font-size:11.5px;font-style:italic;fill:#6B7280}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.if{fill:#FCE7F3;stroke:#DB2777;stroke-width:2}.lp{fill:#EDE9FE;stroke:#7C3AED;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect class="te" x="281.8" y="14" width="56.4" height="32" rx="16"/><text class="t" x="310" y="34" text-anchor="middle">Main</text><path class="e" d="M310,46 L310,68" marker-end="url(#a)"/><rect class="dc" x="175.4" y="68" width="269.2" height="62" rx="3"/><text x="310" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="188.4" y="102" text-anchor="start">Real nota1, nota2, nota3, media</text><text class="t" x="188.4" y="118" text-anchor="start">Integer i, contAprov, contReprov</text><path class="e" d="M310,130 L310,152" marker-end="url(#a)"/><rect class="as" x="247.6" y="152" width="124.8" height="32" rx="3"/><text class="t" x="310" y="172" text-anchor="middle">contAprov = 0</text><path class="e" d="M310,184 L310,206" marker-end="url(#a)"/><rect class="as" x="243.8" y="206" width="132.4" height="32" rx="3"/><text class="t" x="310" y="226" text-anchor="middle">contReprov = 0</text><path class="e" d="M310,238 L310,260" marker-end="url(#a)"/><path class="lp" d="M247.8,260 L372.2,260 L386.2,277 L372.2,294 L247.8,294 L233.8,277 Z"/><text class="t" x="310" y="281" text-anchor="middle">For i = 1 to 5</text><path class="e" d="M310,294 L310,318" marker-end="url(#a)"/><text class="lb" x="315" y="309" text-anchor="start">próxima volta</text><path class="ou" d="M186.8,318 L447.2,318 L433.2,350 L172.8,350 Z"/><text class="t" x="310" y="338" text-anchor="middle">Output &quot;Aluno &quot; &amp; i &amp; &quot; de 5&quot;</text><path class="e" d="M310,350 L310,372" marker-end="url(#a)"/><path class="ou" d="M198.2,372 L435.8,372 L421.8,404 L184.2,404 Z"/><text class="t" x="310" y="392" text-anchor="middle">Output &quot;Digite a 1ª nota:&quot;</text><path class="e" d="M310,404 L310,426" marker-end="url(#a)"/><path class="in" d="M255.2,426 L378.8,426 L364.8,458 L241.2,458 Z"/><text class="t" x="310" y="446" text-anchor="middle">Input nota1</text><path class="e" d="M310,458 L310,480" marker-end="url(#a)"/><path class="ou" d="M198.2,480 L435.8,480 L421.8,512 L184.2,512 Z"/><text class="t" x="310" y="500" text-anchor="middle">Output &quot;Digite a 2ª nota:&quot;</text><path class="e" d="M310,512 L310,534" marker-end="url(#a)"/><path class="in" d="M255.2,534 L378.8,534 L364.8,566 L241.2,566 Z"/><text class="t" x="310" y="554" text-anchor="middle">Input nota2</text><path class="e" d="M310,566 L310,588" marker-end="url(#a)"/><path class="ou" d="M198.2,588 L435.8,588 L421.8,620 L184.2,620 Z"/><text class="t" x="310" y="608" text-anchor="middle">Output &quot;Digite a 3ª nota:&quot;</text><path class="e" d="M310,620 L310,642" marker-end="url(#a)"/><path class="in" d="M255.2,642 L378.8,642 L364.8,674 L241.2,674 Z"/><text class="t" x="310" y="662" text-anchor="middle">Input nota3</text><path class="e" d="M310,674 L310,696" marker-end="url(#a)"/><rect class="as" x="164" y="696" width="292" height="32" rx="3"/><text class="t" x="310" y="716" text-anchor="middle">media = (nota1 + nota2 + nota3) / 3</text><path class="e" d="M310,728 L310,750" marker-end="url(#a)"/><path class="ou" d="M133.6,750 L500.4,750 L486.4,782 L119.6,782 Z"/><text class="t" x="310" y="770" text-anchor="middle">Output &quot;A média final do aluno é: &quot; &amp; media</text><path class="e" d="M310,782 L310,804" marker-end="url(#a)"/><path class="if" d="M310,804 L370.9,833.8 L310,863.6 L249.1,833.8 Z"/><text class="t" x="310" y="837.8" text-anchor="middle">media &gt;= 7</text><text class="lb" x="374.9" y="828.8" text-anchor="start">Verdadeiro</text><text class="lb" x="245.1" y="828.8" text-anchor="end">Falso</text><path class="e" d="M370.9,833.8 L448.2,833.8 L448.2,885.6" marker-end="url(#a)"/><path class="ou" d="M344,885.6 L566.4,885.6 L552.4,917.6 L330,917.6 Z"/><text class="t" x="448.2" y="905.6" text-anchor="middle">Output &quot;Aluno aprovado.&quot;</text><path class="e" d="M448.2,917.6 L448.2,939.6" marker-end="url(#a)"/><rect class="as" x="340.2" y="939.6" width="216" height="32" rx="3"/><text class="t" x="448.2" y="959.6" text-anchor="middle">contAprov = contAprov + 1</text><path class="e" d="M448.2,971.6 L448.2,989.6 L310,989.6"/><path class="e" d="M249.1,833.8 L168,833.8 L168,885.6" marker-end="url(#a)"/><path class="ou" d="M60,885.6 L290,885.6 L276,917.6 L46,917.6 Z"/><text class="t" x="168" y="905.6" text-anchor="middle">Output &quot;Aluno reprovado.&quot;</text><path class="e" d="M168,917.6 L168,939.6" marker-end="url(#a)"/><rect class="as" x="52.4" y="939.6" width="231.2" height="32" rx="3"/><text class="t" x="168" y="959.6" text-anchor="middle">contReprov = contReprov + 1</text><path class="e" d="M168,971.6 L168,989.6 L310,989.6"/><circle cx="310" cy="989.6" r="4" fill="#4B5563"/><path class="e" d="M310,993.6 L310,1005.6 L20,1005.6 L20,277 L233.8,277" marker-end="url(#a)"/><path class="e" d="M386.2,277 L600.4,277 L600.4,1025.6 L310,1025.6"/><text class="lb" x="390.2" y="272" text-anchor="start">terminou</text><circle cx="310" cy="1025.6" r="4" fill="#4B5563"/><path class="e" d="M310,1029.6 L310,1051.6" marker-end="url(#a)"/><path class="ou" d="M133.6,1051.6 L500.4,1051.6 L486.4,1099.6 L119.6,1099.6 Z"/><text class="t" x="146.6" y="1071.6" text-anchor="start">Output &quot;Quantidade de alunos aprovados: &quot; &amp;</text><text class="t" x="146.6" y="1087.6" text-anchor="start" xml:space="preserve">  contAprov</text><path class="e" d="M310,1099.6 L310,1121.6" marker-end="url(#a)"/><path class="ou" d="M137.4,1121.6 L496.6,1121.6 L482.6,1169.6 L123.4,1169.6 Z"/><text class="t" x="150.4" y="1141.6" text-anchor="start">Output &quot;Quantidade de alunos reprovados: &quot;</text><text class="t" x="150.4" y="1157.6" text-anchor="start" xml:space="preserve">  &amp; contReprov</text><path class="e" d="M310,1169.6 L310,1191.6" marker-end="url(#a)"/><rect class="te" x="285.6" y="1191.6" width="48.8" height="32" rx="16"/><text class="t" x="310" y="1211.6" text-anchor="middle">End</text></svg>