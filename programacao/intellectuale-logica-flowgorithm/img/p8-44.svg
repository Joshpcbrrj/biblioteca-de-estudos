<svg xmlns="http://www.w3.org/2000/svg" width="708" height="400" viewBox="0 0 708 400"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.lb{font-size:11.5px;font-style:italic;fill:#6B7280}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.te{fill:#F3F4F6;stroke:#374151;stroke-width:2}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.in{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.lp{fill:#EDE9FE;stroke:#7C3AED;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect class="te" x="186" y="14" width="56.4" height="32" rx="16"/><text class="t" x="214.2" y="34" text-anchor="middle">Main</text><path class="e" d="M214.2,46 L214.2,68" marker-end="url(#a)"/><rect class="dc" x="117.6" y="68" width="193.2" height="46" rx="3"/><text x="214.2" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="214.2" y="102" text-anchor="middle">Integer num, resultado</text><path class="e" d="M214.2,114 L214.2,136" marker-end="url(#a)"/><path class="ou" d="M34,136 L408.4,136 L394.4,168 L20,168 Z"/><text class="t" x="214.2" y="156" text-anchor="middle">Output &quot;Digite um número inteiro positivo: &quot;</text><path class="e" d="M214.2,168 L214.2,190" marker-end="url(#a)"/><path class="in" d="M167,190 L275.4,190 L261.4,222 L153,222 Z"/><text class="t" x="214.2" y="210" text-anchor="middle">Input num</text><path class="e" d="M214.2,222 L214.2,244" marker-end="url(#a)"/><rect class="as" x="79.6" y="244" width="269.2" height="32" rx="3"/><text class="t" x="214.2" y="264" text-anchor="middle">resultado = calculaFatorial(num)</text><path class="e" d="M214.2,276 L214.2,298" marker-end="url(#a)"/><path class="ou" d="M83.4,298 L359,298 L345,330 L69.4,330 Z"/><text class="t" x="214.2" y="318" text-anchor="middle">Output num &amp; &quot;! = &quot; &amp; resultado</text><path class="e" d="M214.2,330 L214.2,352" marker-end="url(#a)"/><rect class="te" x="189.8" y="352" width="48.8" height="32" rx="16"/><text class="t" x="214.2" y="372" text-anchor="middle">End</text><rect class="te" x="464.4" y="14" width="223.6" height="32" rx="16"/><text class="t" x="576.2" y="34" text-anchor="middle">calculaFatorial(Integer n)</text><path class="e" d="M576.2,46 L576.2,68" marker-end="url(#a)"/><rect class="dc" x="517.6" y="68" width="117.2" height="46" rx="3"/><text x="576.2" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="576.2" y="102" text-anchor="middle">Integer r, i</text><path class="e" d="M576.2,114 L576.2,136" marker-end="url(#a)"/><rect class="as" x="544.2" y="136" width="64" height="32" rx="3"/><text class="t" x="576.2" y="156" text-anchor="middle">r = 1</text><path class="e" d="M576.2,168 L576.2,190" marker-end="url(#a)"/><path class="lp" d="M514,190 L638.4,190 L652.4,207 L638.4,224 L514,224 L500,207 Z"/><text class="t" x="576.2" y="211" text-anchor="middle">For i = 2 to n</text><path class="e" d="M576.2,224 L576.2,248" marker-end="url(#a)"/><text class="lb" x="581.2" y="239" text-anchor="start">próxima volta</text><rect class="as" x="529" y="248" width="94.4" height="32" rx="3"/><text class="t" x="576.2" y="268" text-anchor="middle">r = r * i</text><path class="e" d="M576.2,280 L576.2,292 L474,292 L474,207 L500,207" marker-end="url(#a)"/><path class="e" d="M652.4,207 L682.4,207 L682.4,312 L576.2,312"/><text class="lb" x="656.4" y="202" text-anchor="start">terminou</text><circle cx="576.2" cy="312" r="4" fill="#4B5563"/><path class="e" d="M576.2,316 L576.2,338" marker-end="url(#a)"/><rect class="te" x="502.4" y="338" width="147.6" height="32" rx="16"/><text class="t" x="576.2" y="358" text-anchor="middle">Return Integer r</text></svg>