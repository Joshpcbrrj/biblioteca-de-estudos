<svg xmlns="http://www.w3.org/2000/svg" width="301" height="332" viewBox="0 0 301 332"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.t{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#111827}.lb{font-size:11.5px;font-style:italic;fill:#6B7280}.e{stroke:#4B5563;stroke-width:1.7;fill:none}.dc{fill:#FEF9C3;stroke:#CA8A04;stroke-width:2}.as{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.ou{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.lp{fill:#EDE9FE;stroke:#7C3AED;stroke-width:2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect class="dc" x="72.6" y="14" width="147.6" height="46" rx="3"/><text x="146.4" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="146.4" y="48" text-anchor="middle">Integer contador</text><path class="e" d="M146.4,60 L146.4,82" marker-end="url(#a)"/><rect class="as" x="87.8" y="82" width="117.2" height="32" rx="3"/><text class="t" x="146.4" y="102" text-anchor="middle">contador = 1</text><path class="e" d="M146.4,114 L146.4,136" marker-end="url(#a)"/><path class="lp" d="M65.2,136 L227.6,136 L241.6,153 L227.6,170 L65.2,170 L51.2,153 Z"/><text class="t" x="146.4" y="157" text-anchor="middle">While contador &lt;= 5</text><path class="e" d="M146.4,170 L146.4,194" marker-end="url(#a)"/><text class="lb" x="151.4" y="185" text-anchor="start">Verdadeiro</text><path class="ou" d="M76.4,194 L230.4,194 L216.4,226 L62.4,226 Z"/><text class="t" x="146.4" y="214" text-anchor="middle">Output contador</text><path class="e" d="M146.4,226 L146.4,248" marker-end="url(#a)"/><rect class="as" x="46" y="248" width="200.8" height="32" rx="3"/><text class="t" x="146.4" y="268" text-anchor="middle">contador = contador + 1</text><path class="e" d="M146.4,280 L146.4,292 L20,292 L