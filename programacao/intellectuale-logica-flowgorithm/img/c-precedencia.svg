<svg xmlns="http://www.w3.org/2000/svg" width="760" height="318" viewBox="0 0 760 318"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="180" y="26" class="m" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">2 + 3 * 4</text><line x1="180" y1="70" x2="110" y2="150" stroke="#9CA3AF" stroke-width="2"/><line x1="180" y1="70" x2="250" y2="150" stroke="#9CA3AF" stroke-width="2"/><line x1="250" y1="150" x2="210" y2="220" stroke="#9CA3AF" stroke-width="2"/><line x1="250" y1="150" x2="290" y2="220" stroke="#9CA3AF" stroke-width="2"/><circle cx="180" cy="70" r="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="180" y="76" class="m" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">+</text><circle cx="110" cy="150" r="20" fill="#fff" stroke="#9CA3AF" stroke-width="2"/><text x="110" y="156" class="m" font-size="16" fill="#1F2937" text-anchor="middle">2</text><circle cx="250" cy="150" r="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="250" y="156" class="m" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">*</text><circle cx="210" cy="220" r="20" fill="#fff" stroke="#9CA3AF" stroke-width="2"/><text x="210" y="226" class="m" font-size="16" fill="#1F2937" text-anchor="middle">3</text><circle cx="290" cy="220" r="20" fill="#fff" stroke="#9CA3AF" stroke-width="2"/><text x="290" y="226" class="m" font-size="16" fill="#1F2937" text-anchor="middle">4</text><text x="180" y="272" class="m" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="middle">= 2 + 12 = 14</text><text x="560" y="26" class="m" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">(2 + 3) * 4</text><line x1="560" y1="70" x2="490" y2="150" stroke="#9CA3AF" stroke-width="2"/><line x1="560" y1="70" x2="630" y2="150" stroke="#9CA3AF" stroke-width="2"/><line x1="490" y1="150" x2="450" y2="220" stroke="#9CA3AF" stroke-width="2"/><line x1="490" y1="150" x2="530" y2="220" stroke="#9CA3AF" stroke-width="2"/><circle cx="560" cy="70" r="20" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="560" y="76" class="m" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">*</text><circle cx="490" cy="150" r="20" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="490" y="156" class="m" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">+</text><circle cx="630" cy="150" r="20" fill="#fff" stroke="#9CA3AF" stroke-width="2"/><text x="630" y="156" class="m" font-size="16" fill="#1F2937" text-anchor="middle">4</text><circle cx="450" cy="220" r="20" fill="#fff" stroke="#9CA3AF" stroke-width="2"/><text x="450" y="226" class="m" font-size="16" fill="#1F2937" text-anchor="middle">2</text><circle cx="530" cy="220" r="20" fill="#fff" stroke="#9CA3AF" stroke-width="2"/><text x="530" y="226" class="m" font-size="16" fill="#1F2937" text-anchor="middle">3</text><text x="560" y="272" class="m" font-size="15" font-weight="bold" fill="#D97706" text-anchor="middle">= 5 * 4 = 20</text><text x="380" y="302" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Calcula-se de baixo para cima: a operação mais funda é feita primeiro</text></svg>