 nomeAluno</text><path class="e" d="M280.2,270 L280.2,292" marker-end="url(#a)"/><path class="ou" d="M164.6,292 L409.8,292 L395.8,324 L150.6,324 Z"/><text class="t" x="280.2" y="312" text-anchor="middle">Output &quot;Digite a nota P1: &quot;</text><path class="e" d="M280.2,324 L280.2,346" marker-end="url(#a)"/><path class="in" d="M236.8,346 L337.6,346 L323.6,378 L222.8,378 Z"/><text class="t" x="280.2" y="366" text-anchor="middle">Input p1</text><path class="e" d="M280.2,378 L280.2,400" marker-end="url(#a)"/><path class="ou" d="M164.6,400 L409.8,400 L395.8,432 L150.6,432 Z"/><text class="t" x="280.2" y="420" text-anchor="middle">Output &quot;Digite a nota P2: &quot;</text><path class="e" d="M280.2,432 L280.2,454" marker-end="url(#a)"/><path class="in" d="M236.8,454 L337.6,454 L323.6,486 L222.8,486 Z"/><text class="t" x="280.2" y="474" text-anchor="middle">Input p2</text><path class="e" d="M280.2,486 L280.2,508" marker-end="url(#a)"/><circle cx="280.2" cy="512" r="4" fill="#4B5563"/><path class="e" d="M280.2,512 L280.2,522" marker-end="url(#a)"/><path class="ou" d="M138,522 L436.4,522 L422.4,570 L124,570 Z"/><text class="t" x="151" y="542" text-anchor="start">Output &quot;Digite M (aritmética) ou P</text><text class="t" x="151" y="558" text-anchor="start" xml:space="preserve">  (ponderada): &quot;</text><path class="e" d="M280.2,570 L280.2,592" marker-end="url(#a)"/><path class="in" d="M225.4,592 L349,592 L335,624 L211.4,624 Z"/><text class="t" x="280.2" y="612" text-anchor="middle">Input letra</text><path class="e" d="M280.2,624 L280.2,648" marker-end="url(#a)"/><path class="lp" d="M142,648 L418.4,648 L432.4,673 L418.4,698 L142,698 L128,673 Z"/><text class="t" x="280.2" y="669" text-anchor="middle">Do letra != &quot;M&quot; &amp;&amp; letra != &quot;m&quot; &amp;&amp;</text><text class="t" x="280.2" y="685" text-anchor="middle">  letra != &quot;P&quot; &amp;&amp; letra != &quot;p&quot;</text><path class="e" d="M128,673 L98,673 L98,512 L275.2,512" marker-end="url(#a)"/><text class="lb" x="93" y="590.5" text-anchor="end">Verdadeiro:</text><text class="lb" x="93" y="604.5" text-anchor="end">repete</text><text class="lb" x="285.2" y="712" text-anchor="start">Falso</text><path class="e" d="M280.2,698 L280.2,720" marker-end="url(#a)"/><rect class="as" x="134.2" y="720" width="292" height="32" rx="3"/><text class="t" x="280.2" y="740" text-anchor="middle">media = calculaMedia(p1, p2, letra)</text><path class="e" d="M280.2,752 L280.2,774" marker-end="url(#a)"/><path class="ou" d="M103.8,774 L470.6,774 L456.6,822 L89.8,822 Z"/><text class="t" x="116.8" y="794" text-anchor="start">Output nomeAluno &amp; &quot; | P1 = &quot; &amp; p1 &amp; &quot; | P2</text><text class="t" x="116.8" y="810" text-anchor="start" xml:space="preserve">  = &quot; &amp; p2 &amp; &quot; | média = &quot; &amp; media</text><path class="e" d="M280.2,822 L280.2,844" marker-end="url(#a)"/><rect class="te" x="255.8" y="844" width="48.8" height="32" rx="16"/><text class="t" x="280.2" y="864" text-anchor="middle">End</text><rect class="te" x="616.7" y="14" width="352.8" height="32" rx="16"/><text class="t" x="793.1" y="34" text-anchor="middle">calculaMedia(Real n1, Real n2, String tipo)</text><path class="e" d="M793.1,46 L793.1,68" marker-end="url(#a)"/><rect class="dc" x="754.9" y="68" width="76.4" height="46" rx="3"/><text x="793.1" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">Declare</text><text class="t" x="793.1" y="102" text-anchor="middle">Real m</text><path class="e" d="M793.1,114 L793.1,136" marker-end="url(#a)"/><path class="if" d="M793.1,136 L937.1,165.8 L793.1,195.6 L649,165.8 Z"/><text class="t" x="793.1" y="169.8" text-anchor="middle">tipo == &quot;M&quot; || tipo == &quot;m&quot;</text><text class="lb" x="941.1" y="160.8" text-anchor="start">Verdadeiro</text><text class="lb" x="645" y="160.8" text-anchor="end">Falso</text><path class="e" d="M937.1,165.8 L959.1,165.8 L959.1,217.6" marker-end="url(#a)"/><rect class="as" x="881.5" y="217.6" width="155.2" height="32" rx="3"/><text class="t" x="959.1" y="237.6" text-anchor="middle">m = (n1 + n2) / 2</text><path class="e" d="M959.1,249.6 L959.1,267.6 L793.1,267.6"/><path class="e" d="M649,165.8 L627,165.8 L627,217.6" marker-end="url(#a)"/><rect class="as" x="526.6" y="217.6" width="200.8" height="32" rx="3"/><text class="t" x="627" y="237.6" text-anchor="middle">m = 0.4 * n1 + 0.6 * n2</text><path class="e" d="M627,249.6 L627,267.6 L793.1,267.6"/><circle cx="793.1" cy="267.6" r="4" fill="#4B5563"/><path class="e" d="M793.1,271.6 L793.1,293.6" marker-end="url(#a)"/><rect class="te" x="730.7" y="293.6" width="124.8" height="32" rx="16"/><text class="t" x="793.1" y="313.6" text-anchor="middle">Return Real m</text></svg>