<svg xmlns="http://www.w3.org/2000/svg" width="760" height="205" viewBox="0 0 760 205"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="190" y="28" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">7 ÷ 2 na &quot;conta armada&quot;</text><text x="120" y="80" class="m" font-size="30" fill="#1F2937" text-anchor="middle">7</text><text x="205" y="80" class="m" font-size="30" fill="#1F2937" text-anchor="middle">2</text><line x1="170" y1="50" x2="170" y2="130" stroke="#1F2937" stroke-width="2.5"/><line x1="170" y1="90" x2="260" y2="90" stroke="#1F2937" stroke-width="2.5"/><text x="108" y="122" class="m" font-size="30" fill="#1F2937" text-anchor="middle">-6</text><text x="205" y="125" class="m" font-size="30" font-weight="bold" fill="#2563EB" text-anchor="middle">3</text><line x1="85" y1="136" x2="150" y2="136" stroke="#1F2937" stroke-width="2"/><text x="120" y="172" class="m" font-size="30" font-weight="bold" fill="#DC2626" text-anchor="middle">1</text><text x="250" y="127" font-size="13" fill="#2563EB">← quociente</text><text x="140" y="172" font-size="13" fill="#DC2626">← resto</text><rect x="330" y="40" width="410" height="150" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/><text x="350" y="68" class="m" font-size="15" fill="#1F2937">7 / 2 = 3.5</text><text x="560" y="68" font-size="13" font-style="italic" fill="#6B7280">divisão</text><text x="350" y="95" class="m" font-size="15" font-weight="bold" fill="#DC2626">7 % 2 = 1</text><text x="560" y="95" font-size="13" font-style="italic" fill="#6B7280">resto</text><text x="350" y="122" class="m" font-size="15" font-weight="bold" fill="#DC2626">10 % 3 = 1</text><text x="560" y="122" font-size="13" font-style="italic" fill="#6B7280">10 = 3×3 + 1</text><text x="350" y="149" class="m" font-size="15" font-weight="bold" fill="#DC2626">15 % 5 = 0</text><text x="560" y="149" font-size="13" font-style="italic" fill="#6B7280">divisão exata</text><text x="350" y="176" class="m" font-size="15" font-weight="bold" fill="#DC2626">n % 2 == 0</text><text x="560" y="176" font-size="13" font-style="italic" fill="#6B7280">n é par</text></svg>