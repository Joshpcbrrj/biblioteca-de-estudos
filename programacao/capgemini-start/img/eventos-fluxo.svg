<svg xmlns="http://www.w3.org/2000/svg" width="900" height="334" viewBox="0 0 900 334"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xY{fill:#F3F4F6;stroke:#9CA3AF}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.kO{fill:#D97706}.kP{fill:#7C3AED}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Propagação de eventos: o clique desce até o alvo e volta subindo</text><rect x="60" y="50" width="620" height="36" rx="6" class="xY"/><text x="74" y="73" class="m">window</text><rect x="100" y="94" width="540" height="36" rx="6" class="xY"/><text x="114" y="117" class="m">document</text><rect x="140" y="138" width="460" height="36" rx="6" class="xB"/><text x="154" y="161" class="m">&lt;body&gt;</text><rect x="180" y="182" width="380" height="36" rx="6" class="xB"/><text x="194" y="205" class="m">&lt;ul id=&quot;lista&quot;&gt;</text><rect x="220" y="226" width="300" height="36" rx="6" class="xG"/><text x="234" y="249" class="m">&lt;li&gt; ← clique (event.target)</text><path d="M720,58V226" class="l" style="stroke:#7C3AED" marker-end="url(#a)"/><text x="720" y="248" class="b c kP">1. captura (desce)</text><path d="M840,226V58" class="l" style="stroke:#D97706" marker-end="url(#a)"/><text x="840" y="248" class="b c kO">3. borbulha (sobe)</text><text x="450" y="290" class="b c">2. alvo: o &lt;li&gt; clicado. Por padrão, o addEventListener escuta na fase 3 (subida).</text><text x="450" y="320" class="n c">Por isso um único listener na &lt;ul&gt; consegue tratar cliques em todos os &lt;li&gt; (delegação de eventos).</text></svg>