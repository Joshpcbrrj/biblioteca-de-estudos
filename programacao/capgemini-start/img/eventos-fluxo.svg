<svg xmlns="http://www.w3.org/2000/svg" width="480" height="404" viewBox="0 0 480 404"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Propagação de eventos</text><rect x="90" y="50" width="300" height="36" rx="6" class="xW"/><text x="102" y="73" class="m">window</text><rect x="110" y="100" width="260" height="36" rx="6" class="xW"/><text x="122" y="123" class="m">document</text><rect x="130" y="150" width="220" height="36" rx="6" class="xW"/><text x="142" y="173" class="m">&lt;body&gt;</text><rect x="150" y="200" width="180" height="36" rx="6" class="xW"/><text x="162" y="223" class="m">&lt;ul id="lista"&gt;</text><rect x="170" y="250" width="140" height="36" rx="6" class="xP"/><text x="182" y="273" class="m">&lt;li&gt;  ← clique</text><path d="M40,56 L40,286" class="l" marker-end="url(#a)"/><path d="M440,286 L440,56" class="l" marker-end="url(#a)"/><text x="30" y="160" class="s c b" transform="rotate(-90 30 160)">1. captura (desce)</text><text x="452" y="160" class="s c b" transform="rotate(90 452 160)">3. borbulha (sobe)</text><text x="240.0" y="314" class="s c">2. alvo: o &lt;li&gt; clicado (event.target).</text><text x="240.0" y="332" class="s c">Por padrão, addEventListener escuta na subida.</text><text x="240.0" y="362" class="n c">Por isso um listener na &lt;ul&gt; trata cliques</text><text x="240.0" y="380" class="n c">em todos os &lt;li&gt; (delegação de eventos).</text></svg>