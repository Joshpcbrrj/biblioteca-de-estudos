<svg xmlns="http://www.w3.org/2000/svg" width="900" height="348" viewBox="0 0 900 348"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Camadas da internet (modelo TCP/IP de 5 camadas)</text><rect x="150" y="44" width="600" height="46" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="176" y="73" font-size="16" font-weight="bold" fill="#7C3AED" text-anchor="middle">5</text><text x="210" y="65" font-size="14" font-weight="bold" fill="#1F2937">Aplicação</text><text x="210" y="82" font-size="11" fill="#6B7280">o que os programas usam</text><text x="735" y="73" class="m" font-size="12" fill="#1F2937" text-anchor="end">HTTP · DNS · SMTP</text><rect x="150" y="96" width="600" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="176" y="125" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">4</text><text x="210" y="117" font-size="14" font-weight="bold" fill="#1F2937">Transporte</text><text x="210" y="134" font-size="11" fill="#6B7280">entrega entre programas (portas)</text><text x="735" y="125" class="m" font-size="12" fill="#1F2937" text-anchor="end">TCP · UDP</text><rect x="150" y="148" width="600" height="46" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="176" y="177" font-size="16" font-weight="bold" fill="#16A34A" text-anchor="middle">3</text><text x="210" y="169" font-size="14" font-weight="bold" fill="#1F2937">Rede</text><text x="210" y="186" font-size="11" fill="#6B7280">endereço e rota entre redes</text><text x="735" y="177" class="m" font-size="12" fill="#1F2937" text-anchor="end">IP · roteador</text><rect x="150" y="200" width="600" height="46" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="176" y="229" font-size="16" font-weight="bold" fill="#D97706" text-anchor="middle">2</text><text x="210" y="221" font-size="14" font-weight="bold" fill="#1F2937">Enlace</text><text x="210" y="238" font-size="11" fill="#6B7280">entrega na rede local</text><text x="735" y="229" class="m" font-size="12" fill="#1F2937" text-anchor="end">Ethernet · Wi-Fi · MAC</text><rect x="150" y="252" width="600" height="46" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="176" y="281" font-size="16" font-weight="bold" fill="#9CA3AF" text-anchor="middle">1</text><text x="210" y="273" font-size="14" font-weight="bold" fill="#1F2937">Física</text><text x="210" y="290" font-size="11" fill="#6B7280">transmissão dos bits</text><text x="735" y="281" class="m" font-size="12" fill="#1F2937" text-anchor="end">cabo · fibra · rádio</text><line x1="110" y1="50" x2="110" y2="300" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="100" y="176" font-size="11.5" fill="#6B7280" text-anchor="end">envio</text><line x1="790" y1="300" x2="790" y2="50" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="800" y="176" font-size="11.5" fill="#6B7280">recebimento</text><text x="450" y="330" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Cada camada adiciona seu cabeçalho ao enviar (encapsulamento) e o retira ao receber. O modelo OSI teórico tem 7 camadas.</text></svg>