<svg xmlns="http://www.w3.org/2000/svg" width="480" height="502" viewBox="0 0 480 502"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Camadas da internet (TCP/IP)</text><rect x="50" y="52" width="380" height="66" rx="6" class="xP"/><text x="68" y="90" class="t">5</text><text x="96" y="74" class="b">Aplicação</text><text x="96" y="92" class="s">o que os programas usam</text><text x="96" y="109" class="m" style="font-size:12.5px">HTTP · DNS · SMTP</text><rect x="50" y="130" width="380" height="66" rx="6" class="xB"/><text x="68" y="168" class="t">4</text><text x="96" y="152" class="b">Transporte</text><text x="96" y="170" class="s">entrega entre programas (portas)</text><text x="96" y="187" class="m" style="font-size:12.5px">TCP · UDP</text><rect x="50" y="208" width="380" height="66" rx="6" class="xG"/><text x="68" y="246" class="t">3</text><text x="96" y="230" class="b">Rede</text><text x="96" y="248" class="s">endereço e rota entre redes</text><text x="96" y="265" class="m" style="font-size:12.5px">IP · roteador</text><rect x="50" y="286" widt