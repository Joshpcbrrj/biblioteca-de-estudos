<svg xmlns="http://www.w3.org/2000/svg" width="900" height="308" viewBox="0 0 900 308"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">TCP/IP: o arquivo viaja em pacotes, por caminhos diferentes</text><rect x="20" y="120" width="130" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="85" y="147" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Origem</text><text x="85" y="165" font-size="11.5" fill="#6B7280" text-anchor="middle">arquivo</text><rect x="750" y="120" width="130" height="60" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="815" y="147" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Destino</text><text x="815" y="165" font-size="11.5" fill="#6B7280" text-anchor="middle">remonta 1·2·3·4</text><circle cx="300" cy="70" r="16" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="300" y="74" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="middle">R</text><circle cx="450" cy="60" r="16" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="450" y="64" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="middle">R</text><circle cx="300" cy="150" r="16" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="300" y="154" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="middle">R</text><circle cx="450" cy="160" r="16" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="450" y="164" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="middle">R</text><circle cx="600" cy="110" r="16" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="600" y="114" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="middle">R</text><circle cx="450" cy="240" r="16" fill="#F3F4F6" stroke="#9