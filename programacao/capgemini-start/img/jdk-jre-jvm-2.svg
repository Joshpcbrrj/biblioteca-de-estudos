<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">JDK ⊃ JRE ⊃ JVM</text><rect x="150" y="46" width="600" height="210" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="170" y="72" font-size="14" font-weight="bold" fill="#2563EB">JDK · Java Development Kit</text><text x="170" y="92" font-size="11.5" fill="#1F2937">para DESENVOLVER: javac, javadoc, jar, depurador...</text><rect x="190" y="108" width="520" height="130" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="210" y="132" font-size="14" font-weight="bold" fill="#16A34A">JRE · Java Runtime Environment</text><text x="210" y="152" font-size="11.5" fill="#1F2937">para RODAR: bibliotecas padrão (java.lang, java.util...)</text><rect x="230" y="168" width="440" height="54" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="450" y="192" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">JVM · Java Virtual Machine</text><text x="450" y="210" font-size="11.5" fill="#1F2937" text-anchor="middle">executa o bytecode</text><text x="450" y="282" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Para programar, instale o JDK (ele já inclui o resto). Desde o Java 11, a Oracle não distribui mais o JRE separado.</text></svg>