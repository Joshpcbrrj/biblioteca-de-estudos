<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">HTTPS = HTTP + criptografia (TLS)</text><rect x="20" y="48" width="160" height="44" rx="6" class="xB"/><text x="100.0" y="74.5" class="b c">Navegador</text><rect x="300" y="48" width="160" height="44" rx="6" class="xG"/><text x="380.0" y="74.5" class="b c">Servidor</text><path d="M100,92 L100,330" class="l d"/><path d="M380,92 L380,330" class="l d"/><text x="240" y="126" class="s c">1. olá! que cifras você aceita?</text><path d="M100,138 L380,138" class="l" marker-end="url(#a)"/><text x="240" y="178" class="s c">2. meu certificado,</text><text x="240" y="194" class="s c">assinado por uma CA</text><path d="M380,204 L100,204" class="l" marker-end="url(#a)"/><text x="240" y="244" class="s c">3. certificado ok? combinam a</text><text x="240" y="260" class="s c">chave de sessão</text><path d="M100,270 L380,270" class="l" marker-end="url(#a)"/><text x="240" y="310" class="s c">4. dados criptografados 🔒</text><path d="M100,322 L380,322" class="l" marker-end="url(#a)" marker-start="url(#a)"/><text x="240.0" y="370" class="n c">HTTP usa a porta 80; HTTPS, a 443.</text><text x="240.0" y="388" class="n c">O cadeado indica certificado válido</text><text x="240.0" y="406" class="n c">e conexão criptografada.</text></svg>