<svg xmlns="http://www.w3.org/2000/svg" width="900" height="366" viewBox="0 0 900 366"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">HTTPS = HTTP dentro de um canal criptografado (TLS)</text><rect x="30" y="60" width="150" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="105" y="100" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Navegador</text><rect x="720" y="60" width="150" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="795" y="100" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Servidor</text><line x1="184" y1="160" x2="716" y2="160" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="450" y="152" font-size="12" fill="#1F2937" text-anchor="middle">1. olá! quais cifras você aceita?</text><line x1="716" y1="202" x2="184" y2="202" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="450" y="194" font-size="12" fill="#1F2937" text-anchor="middle">2. aqui está meu certificado (assinado por uma CA)</text><line x1="184" y1="244" x2="716" y2="244" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="450" y="236" font-size="12" fill="#1F2937" text-anchor="middle">3. certificado válido? combinam uma chave de sessão</text><line x1="184" y1="286" x2="716" y2="286" stroke="#D97706" stroke-width="2.2" marker-end="url(#aro)" marker-start="url(#aro)"/><text x="450" y="278" font-size="12" fill="#1F2937" text-anchor="middle">4. dados trocados criptografados 🔒</text><text x="450" y="348" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">HTTP usa a porta 80; HTTPS, a 443. O cadeado no navegador indica certificado válido e conexão criptografada.</text></svg>