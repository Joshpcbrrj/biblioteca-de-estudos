<svg xmlns="http://www.w3.org/2000/svg" width="900" height="278" viewBox="0 0 900 278"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Silogismo: duas premissas levam a uma conclusão</text><rect x="30" y="46" width="268" height="156" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="164" y="72" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">Válido e verdadeiro</text><text x="164" y="108" font-size="13" fill="#1F2937" text-anchor="middle">Todo homem é mortal.</text><text x="164" y="142" font-size="13" fill="#1F2937" text-anchor="middle">Sócrates é homem.</text><line x1="54" y1="156" x2="274" y2="156" stroke="#16A34A" stroke-width="1.2"/><text x="164" y="176" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Logo, Sócrates é mortal.</text><rect x="316" y="46" width="268" height="156" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="450" y="72" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">Válido, mas falso</text><text x="450" y="108" font-size="13" fill="#1F2937" text-anchor="middle">Todo peixe voa.</text><text x="450" y="142" font-size="13" fill="#1F2937" text-anchor="middle">Nemo é peixe.</text><line x1="340" y1="156" x2="560" y2="156" stroke="#D97706" stroke-width="1.2"/><text x="450" y="176" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Logo, Nemo voa.</text><rect x="602" y="46" width="268" height="156" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="736" y="72" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">Inválido</text><text x="736" y="108" font-size="13" fill="#1F2937" text-anchor="middle">Todo gato é mamífero.</text><text x="736" y="142" font-size="13" fill="#1F2937" text-anchor="middle">Rex é mamífero.</text><line x1="626" y1="156" x2="846" y2="156" stroke="#DC2626" stroke-width="1.2"/><text x="736" y="176" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Logo, Rex é gato.</text><text x="173" y="226" font-size="11.5" font-style="italic" fill="#6B7280" text-anchor="middle">estrutura correta + premissas verdadeiras</text><text x="459" y="226" font-size="11.5" font-style="italic" fill="#6B7280" text-anchor="middle">estrutura correta, premissa falsa</text><text x="745" y="226" font-size="11.5" font-style="italic" fill="#6B7280" text-anchor="middle">a conclusão não decorre das premissas</text><text x="450" y="260" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">A lógica avalia a validade da estrutura do raciocínio, e não se o conteúdo é verdadeiro.</text></svg>