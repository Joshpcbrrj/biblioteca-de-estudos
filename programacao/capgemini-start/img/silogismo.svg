<svg xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Silogismo: premissas e conclusão</text><rect x="20" y="48" width="440" height="112" rx="6" class="xG"/><text x="34" y="70" class="b">Válido e verdadeiro</text><text x="34" y="92" class="">Todo homem é mortal.</text><text x="34" y="110" class="">Sócrates é homem.</text><text x="34" y="128" class="">Logo, Sócrates é mortal.</text><text x="34" y="150" class="s">estrutura correta + premissas verdadeiras</text><rect x="20" y="170" width="440" height="112" rx="6" class="xO"/><text x="34" y="192" class="b">Válido, mas falso</text><text x="34" y="214" class="">Todo peixe voa.</text><text x="34" y="232" class="">Nemo é peixe.</text><text x="34" y="250" class="">Logo, Nemo voa.</text><text x="34" y="272" class="s">estrutura correta, premissa falsa</text><rect x="20" y="292" width="440" height="112" rx="6" class="xR"/><text x="34" y="314" class="b">Inválido</text><text x="34" y="336" class="">Todo gato é mamífero.</text><text x="34" y="354" class="">Rex é mamífero.</text><text x="34" y="372" class="">Logo, Rex é gato.</text><text x="34" y="394" class="s">a conclusão não decorre das premissas</text><text x="240.0" y="428" class="n c">A lógica avalia a validade da estrutura do</text><text x="240.0" y="446" class="n c">raciocínio, e não se o conteúdo é verdadeiro.</text></svg>