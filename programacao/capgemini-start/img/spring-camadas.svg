<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Arquitetura em camadas de uma API com Spring Boot</text><rect x="30" y="60" width="150" height="70" rx="6" class="xY"/><text x="105" y="92" class="b c">Cliente</text><text x="105" y="109" class="s c">Angular / Postman</text><rect x="230" y="50" width="170" height="90" rx="6" class="xB"/><text x="315" y="92" class="m b c">@RestController</text><text x="315" y="109" class="s c">recebe HTTP e devolve JSON</text><rect x="450" y="50" width="170" height="90" rx="6" class="xG"/><text x="535" y="92" class="m b c">@Service</text><text x="535" y="109" class="s c">regras de negócio</text><rect x="670" y="50" width="200" height="90" rx="6" class="xP"/><text x="770" y="92" class="m b c">Repository</text><text x="770" y="109" class="s c">JpaRepository&lt;T, ID&gt;</text><path d="M180,88L230,88" class="l" marker-end="url(#a)"/><path d="M230,104L180,104" class="l" marker-end="url(#a)"/><path d="M400,88L450,88" class="l" marker-end="url(#a)"/><path d="M450,104L400,104" class="l" marker-end="url(#a)"/><path d="M620,88L670,88" class="l" marker-end="url(#a)"/><path d="M670,104L620,104" class="l" marker-end="url(#a)"/><text x="205" y="80" class="s c">HTTP</text><text x="205" y="124" class="s c">JSON</text><rect x="670" y="190" width="200" height="60" rx="6" class="xO"/><text x="770" y="217" class="b c">Banco de dados</text><text x="770" y="234" class="s c">H2 / PostgreSQL / MySQL</text><path d="M770,140L770,190" class="l" marker-end="url(#a)"/><rect x="230" y="180" width="390" height="100" rx="6" class="xW"/><text x="250" y="203" class="b">Exemplos de rotas:</text><text x="250" y="224" class="m" style="font-size:12px">GET /api/produtos   → listar()</text><text x="250" y="244" class="m" style="font-size:12px">POST /api/produtos  → criar(@RequestBody p)</text><text x="250" y="264" class="m" style="font-size:12px">DELETE /api/produtos/{id} → excluir(id)</text><text x="450" y="306" class="n c">Cada camada tem uma responsabilidade: o controller não acessa o banco direto.</text></svg>