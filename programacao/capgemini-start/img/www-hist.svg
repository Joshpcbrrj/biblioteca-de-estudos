<svg xmlns="http://www.w3.org/2000/svg" width="480" height="528" viewBox="0 0 480 528"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Da ARPANET à web</text><circle cx="90" cy="68" r="7" fill="#374151"/><text x="76" y="73" class="s b r">1969</text><rect x="112" y="52" width="348" height="44" rx="6" class="xB"/><text x="124" y="72" class="b">ARPANET</text><text x="124" y="90" class="s">4 universidades ligadas</text><circle cx="90" cy="122" r="7" fill="#374151"/><text x="76" y="127" class="s b r">1983</text><rect x="112" y="106" width="348" height="44" rx="6" class="xG"/><text x="124" y="126" class="b">TCP/IP</text><text x="124" y="144" class="s">vira o padrão da rede</text><circle cx="90" cy="176" r="7" fill="#374151"/><text x="76" y="181" class="s b r">1989</text><rect x="112" y="160" width="348" height="44" rx="6" class="xO"/><text x="124" y="180" class="b">Proposta da web</text><text x="124" y="198" class="s">Tim Berners-Lee, no CERN</text><circle cx="90" cy="230" r="7" fill="#374151"/><text x="76" y="235" class="s b r">1991</text><rect x="112" y="214" width="348" height="44" rx="6" class="xP"/><text x="124" y="234" class="b">1º site no ar</text><text x="124" y="252" class="s">info.cern.ch</text><circle cx="90" cy="284" r="7" fill="#374151"/><text x="76" y="289" class="s b r">1993</text><rect x="112" y="268" width="348" height="44" rx="6" class="xB"/><text x="124" y="288" class="b">Mosaic</text><text x="124" y="306" class="s">a web fica gráfica</text><circle cx="90" cy="338" r="7" fill="#374151"/><text x="76" y="343" class="s b r">1995</text><rect x="112" y="322" width="348" height="44" rx="6" class="xG"/><text x="124" y="342" class="b">Web comercial</text><text x="124" y="360" class="s">Netscape, IE, JavaScript</text><path d="M90,68 L90,350" class="l"/><rect x="20" y="382" width="214" height="76" rx="6" class="xB"/><text x="127.0" y="408.5" class="b c">Internet = a rede</text><text x="127.0" y="426.5" class="s c">cabos, roteadores e</text><text x="127.0" y="442.5" class="s c">protocolos (TCP/IP)</text><rect x="246" y="382" width="214" height="76" rx="6" class="xG"/><text x="353.0" y="408.5" class="b c">Web = um serviço</text><text x="353.0" y="426.5" class="s c">páginas HTML ligadas</text><text x="353.0" y="442.5" class="s c">por links, via HTTP</text><text x="240.0" y="486" class="n c">E-mail, jogos online e WhatsApp usam a internet,</text><text x="240.0" y="504" class="n c">mas não são a web.</text></svg>