<svg xmlns="http://www.w3.org/2000/svg" width="900" height="322" viewBox="0 0 900 322"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Da ARPANET à web</text><line x1="40" y1="106" x2="860" y2="106" stroke="#9CA3AF" stroke-width="2" marker-end="url(#ara)"/><circle cx="90" cy="106" r="8" fill="#9CA3AF"/><text x="90" y="86" font-size="13" font-weight="bold" fill="#9CA3AF" text-anchor="middle">1969</text><rect x="24" y="126" width="132" height="70" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="90" y="152" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">ARPANET</text><text x="90" y="176" font-size="10.5" fill="#6B7280" text-anchor="middle">4 universidades ligadas</text><circle cx="234" cy="106" r="8" fill="#2563EB"/><text x="234" y="86" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">1983</text><rect x="168" y="126" width="132" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="234" y="152" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">TCP/IP</text><text x="234" y="176" font-size="10.5" fill="#6B7280" text-anchor="middle">vira o padrão da rede</text><circle cx="378" cy="106" r="8" fill="#D97706"/><text x="378" y="86" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">1989</text><rect x="312" y="126" width="132" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="378" y="152" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Proposta da web</text><text x="378" y="176" font-size="10.5" fill="#6B7280" text-anchor="middle">Tim Berners-Lee, CERN</text><circle cx="522" cy="106" r="8" fill="#D97706"/><text x="522" y="86" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">1991</text><rect x="456" y="126" width="132" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="522" y="152" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">1º site no ar</text><text x="522" y="176" font-size="10.5" fill="#6B7280" text-anchor="middle">info.cern.ch</text><circle cx="666" cy="106" r="8" fill="#7C3AED"/><text x="666" y="86" font-size="13" font-weight="bold" fill="#7C3AED" text-anchor="middle">1993</text><rect x="600" y="126" width="132" height="70" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="666" y="152" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Mosaic</text><text x="666" y="176" font-size="10.5" fill="#6B7280" text-anchor="middle">a web fica gráfica</text><circle cx="810" cy="106" r="8" fill="#16A34A"/><text x="810" y="86" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">1995</text><rect x="744" y="126" width="132" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="810" y="152" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Web comercial</text><text x="810" y="176" font-size="10.5" fill="#6B7280" text-anchor="middle">Netscape, IE, JavaScript</text><rect x="60" y="222" width="360" height="56" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="240" y="244" font-size="13.5" font-weight="bold" fill="#2563EB" text-anchor="middle">Internet = a rede</text><text x="240" y="264" font-size="10.5" fill="#1F2937" text-anchor="middle">cabos, roteadores e protocolos (TCP/IP) que ligam computadores</text><rect x="480" y="222" width="360" height="56" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="660" y="244" font-size="13.5" font-weight="bold" fill="#D97706" text-anchor="middle">Web = um serviço sobre a internet</text><text x="660" y="264" font-size="10.5" fill="#1F2937" text-anchor="middle">páginas HTML ligadas por links, acessadas via HTTP</text><text x="450" y="304" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">E-mail, jogos online e WhatsApp também usam a internet, mas não são a web.</text></svg>