<svg xmlns="http://www.w3.org/2000/svg" width="480" height="452" viewBox="0 0 480 452"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Variável: um espaço nomeado na memória</text><text x="127" y="64" class="m b c">idade</text><rect x="20" y="74" width="214" height="56" rx="6" class="xB"/><text x="127" y="108" class="m b c" style="font-size:17px">20</text><text x="127" y="152" class="s c">tipo: inteiro</text><text x="353" y="64" class="m b c">media</text><rect x="246" y="74" width="214" height="56" rx="6" class="xG"/><text x="353" y="108" class="m b c" style="font-size:17px">7.5</text><text x="353" y="152" class="s c">tipo: real</text><text x="127" y="194" class="m b c">nome</text><rect x="20" y="204" width="214" height="56" rx="6" class="xO"/><text x="127" y="238" class="m b c" style="font-size:17px">"Maria"</text><text x="127" y="282" class="s c">tipo: caractere</text><text x="353" y="194" class="m b c">aprovado</text><rect x="246" y="204" width="214" height="56" rx="6" class="xP"/><text x="353" y="238" class="m b c" style="font-size:17px">VERDADEIRO</text><text x="353" y="282" class="s c">tipo: logico</text><text x="30" y="330" class="m">declarar:  idade : inteiro</text><text x="30" y="350" class="m">atribuir:  idade &lt;- 20</text><text x="30" y="370" class="m">ler:       leia(idade)</text><text x="240.0" y="410" class="n c">O nome identifica a caixa, o tipo diz o que cabe</text><text x="240.0" y="428" class="n c">nela e o valor pode mudar durante o programa.</text></svg>