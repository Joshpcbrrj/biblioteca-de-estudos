<svg xmlns="http://www.w3.org/2000/svg" width="900" height="242" viewBox="0 0 900 242"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Variável: um espaço nomeado na memória</text><rect x="40" y="60" width="190" height="90" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="135" y="92" class="m" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">20</text><text x="135" y="128" font-size="12" fill="#6B7280" text-anchor="middle">tipo: inteiro</text><text x="135" y="50" class="m" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">idade</text><rect x="250" y="60" width="190" height="90" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="345" y="92" class="m" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">7.5</text><text x="345" y="128" font-size="12" fill="#6B7280" text-anchor="middle">tipo: real</text><text x="345" y="50" class="m" font-size="14" font-weight="bold" fill="#7C3AED" text-anchor="middle">media</text><rect x="460" y="60" width="190" height="90" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="555" y="92" class="m" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">&quot;Maria&quot;</text><text x="555" y="128" font-size="12" fill="#6B7280" text-anchor="middle">tipo: caractere</text><text x="555" y="50" class="m" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">nome</text><rect x="670" y="60" width="190" height="90" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="765" y="92" class="m" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">VERDADEIRO</text><text x="765" y="128" font-size="12" fill="#6B7280" text-anchor="middle">tipo: logico</text><text x="765" y="50" class="m" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">aprovado</text><text x="450" y="190" class="m" font-size="13" fill="#1F2937" text-anchor="middle">declarar:&#160; idade : inteiro&#160; &#160;&#160; atribuir:&#160; idade &lt;- 20&#160; &#160;&#160; ler:&#160; leia(idade)</text><text x="450" y="224" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">O nome identifica a caixa, o tipo diz o que cabe nela e o valor pode mudar durante o programa.</text></svg>