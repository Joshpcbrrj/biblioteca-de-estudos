<svg xmlns="http://www.w3.org/2000/svg" width="480" height="518" viewBox="0 0 480 518"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">CORS: quem pode ler a resposta</text><rect x="30" y="50" width="180" height="52" rx="6" class="xB"/><text x="120.0" y="72.5" class="b c">Navegador</text><text x="120.0" y="90.5" class="s c">página em :4200</text><rect x="270" y="50" width="180" height="52" rx="6" class="xG"/><text x="360.0" y="72.5" class="b c">API</text><text x="360.0" y="90.5" class="s c">localhost:8080</text><path d="M210,68 L270,68" class="l" marker-end="url(#a)"/><path d="M270,88 L210,88" class="l" marker-end="url(#a)"/><text x="30" y="128" class="m">1. GET /produtos</text><text x="30" y="146" class="m">   Origin: http://localhost:4200</text><text x="30" y="170" class="m">2. Access-Control-Allow-Origin:</text><text x="30" y="188" class="m">   http://localhost:4200</text><rect x="20" y="206" width="440" height="82" rx="6" class="xG"/><text x="34" y="228" class="b">✅ cabeçalho presente e com a origem certa</text><text x="34" y="248" class="s">o navegador entrega a resposta ao JavaScript;</text><text x="34" y="266" class="s">fetch(...) funciona normalmente</text><rect x="20" y="300" width="440" height="100" rx="6" class="xR"/><text x="34" y="322" class="b">❌ cabeçalho ausente ou com outra origem</text><text x="34" y="342" class="s">o navegador bloqueia: "blocked by CORS policy".</text><text x="34" y="360" class="s">O pedido chegou ao servidor; só a resposta</text><text x="34" y="378" class="s">fica retida.</text><text x="240.0" y="428" class="s c b">Origem = protocolo + domínio + porta.</text><text x="240.0" y="446" class="s c b">:4200 e :8080 são origens diferentes.</text><text x="240.0" y="476" class="n c">Quem resolve é o back-end (liberando a origem),</text><text x="240.0" y="494" class="n c">não o código do front-end.</text></svg>