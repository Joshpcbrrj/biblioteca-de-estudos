<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xR{fill:#FEE2E2;stroke:#DC2626}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">CORS: o servidor diz quais origens podem ler a resposta</text><rect x="20" y="60" width="170" height="64" rx="6" class="xB"/><text x="105" y="89" class="b c">Navegador</text><text x="105" y="106" class="s c">página em :4200</text><rect x="710" y="60" width="170" height="64" rx="6" class="xG"/><text x="795" y="89" class="b c">API</text><text x="795" y="106" class="s c">localhost:8080</text><path d="M190,80L710,80" class="l" marker-end="url(#a)"/><text x="450" y="72" class="m c" style="font-size:11.5px">1. GET /produtos  ·  Origin: http://localhost:4200</text><path d="M710,112L190,112" class="l" marker-end="url(#a)"/><text x="450" y="104" class="m c" style="font-size:11.5px">2. Access-Control-Allow-Origin: http://localhost:4200</text><rect x="20" y="150" width="410" height="96" rx="6" class="xG"/><text x="36" y="174" class="b">✅ cabeçalho presente e com a origem certa</text><text x="36" y="198">o navegador entrega a resposta ao JavaScript</text><text x="36" y="222" class="m">fetch(...) funciona normalmente</text><rect x="470" y="150" width="410" height="96" rx="6" class="xR"/><text x="486" y="174" class="b">❌ cabeçalho ausente ou com outra origem</text><text x="486" y="198">o navegador bloqueia: &quot;blocked by CORS policy&quot;</text><text x="486" y="222" class="s">a requisição chegou ao servidor, a resposta é que fica retida</text><text x="450" y="276" class="b c">Origem = protocolo + domínio + porta. http://localhost:4200 e http://localhost:8080 são origens diferentes.</text><text x="450" y="306" class="n c">Quem resolve é o back-end (configurando os cabeçalhos), e não o código do front-end.</text></svg>