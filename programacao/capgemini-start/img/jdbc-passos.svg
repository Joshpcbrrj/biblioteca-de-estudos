<svg xmlns="http://www.w3.org/2000/svg" width="900" height="188" viewBox="0 0 900 188"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Roteiro de todo método do controller (JDBC)</text><rect x="14" y="60" width="136" height="76" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="82" y="95" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">SQL com ?</text><text x="82" y="113" font-size="11.5" fill="#6B7280" text-anchor="middle">INSERT ... VALUES (?,?)</text><circle cx="30" cy="60" r="12" fill="#2563EB"/><text x="30" y="65" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1</text><line x1="152" y1="98" x2="160" y2="98" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="162" y="60" width="136" height="76" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="230" y="95" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Conexão</text><text x="230" y="113" font-size="11.5" fill="#6B7280" text-anchor="middle">getConnection()</text><circle cx="178" cy="60" r="12" fill="#7C3AED"/><text x="178" y="65" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">2</text><line x1="300" y1="98" x2="308" y2="98" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="310" y="60" width="136" height="76" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="378" y="95" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Preparar</text><text x="378" y="113" font-size="11.5" fill="#6B7280" text-anchor="middle">prepareStatement(sql)</text><circle cx="326" cy="60" r="12" fill="#D97706"/><text x="326" y="65" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">3</text><line x1="448" y1="98" x2="456" y2="98" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="458" y="60" width="136" height="76" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="526" y="95" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Preencher</text><text x="526" y="113" font-size="11.5" fill="#6B7280" text-anchor="middle">setString(1, ...)</text><circle cx="474" cy="60" r="12" fill="#16A34A"/><text x="474" y="65" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">4</text><line x1="596" y1="98" x2="604" y2="98" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="606" y="60" width="136" height="76" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="674" y="95" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Executar</text><text x="674" y="113" font-size="11.5" fill="#6B7280" text-anchor="middle">execute / executeQuery</text><circle cx="622" cy="60" r="12" fill="#DC2626"/><text x="622" y="65" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">5</text><line x1="744" y1="98" x2="752" y2="98" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="754" y="60" width="136" height="76" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="822" y="95" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Fechar</text><text x="822" y="113" font-size="11.5" fill="#6B7280" text-anchor="middle">no finally</text><circle cx="770" cy="60" r="12" fill="#9CA3AF"/><text x="770" y="65" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="450" y="170" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Os ? (PreparedStatement) separam o comando dos dados e impedem SQL Injection. Os índices começam em 1.</text></svg>