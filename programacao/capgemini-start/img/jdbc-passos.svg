<svg xmlns="http://www.w3.org/2000/svg" width="480" height="418" viewBox="0 0 480 418"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Roteiro de um método JDBC</text><circle cx="40" cy="72" r="13" fill="#374151"/><text x="40" y="77" class="b c" style="fill:#fff">1</text><rect x="64" y="50" width="396" height="44" rx="6" class="xB"/><text x="78" y="77" class="b">SQL com ?</text><text x="180" y="77" class="m" style="font-size:12.5px">INSERT ... VALUES (?, ?)</text><circle cx="40" cy="124" r="13" fill="#374151"/><text x="40" y="129" class="b c" style="fill:#fff">2</text><rect x="64" y="102" width="396" height="44" rx="6" class="xP"/><text x="78" y="129" class="b">Conexão</text><text x="180" y="129" class="m" style="font-size:12.5px">getConnection()</text><circle cx="40" cy="176" r="13" fill="#374151"/><text x="40" y="181" class="b c" style="fill:#fff">3</text><rect x="64" y="154" width="396" height="44" rx="6" class="xO"/><text x="78" y="181" class="b">Preparar</text><text x="180" y="181" class="m" style="font-size:12.5px">prepareStatement(sql)</text><circle cx="40" cy="228" r="13" fill="#374151"/><text x="40" y="233" class="b c" style="fill:#fff">4</text><rect x="64" y="206" width="396" height="44" rx="6" class="xG"/><text x="78" y="233" class="b">Preencher</text><text x="180" y="233" class="m" style="font-size:12.5px">setString(1, ...)</text><circle cx="40" cy="280" r="13" fill="#374151"/><text x="40" y="285" class="b c" style="fill:#fff">5</text><rect x="64" y="258" width="396" height="44" rx="6" class="xT"/><text x="78" y="285" class="b">Executar</text><text x="180" y="285" class="m" style="font-size:12.5px">execute / executeQuery</text><circle cx="40" cy="332" r="13" fill="#374151"/><text x="40" y="337" class="b c" style="fill:#fff">6</text><rect x="64" y="310" width="396" height="44" rx="6" class="xY"/><text x="78" y="337" class="b">Fechar</text><text x="180" y="337" class="m" style="font-size:12.5px">no finally (ou try-with-resources)</text><text x="240.0" y="376" class="n c">Os ? separam o comando dos dados e impedem</text><text x="240.0" y="394" class="n c">SQL Injection. Os índices começam em 1.</text></svg>