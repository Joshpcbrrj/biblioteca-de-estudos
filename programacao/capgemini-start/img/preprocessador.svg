<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.k{font-family:Menlo,Consolas,monospace;font-size:12px;white-space:pre}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.kB{fill:#2563EB}.kO{fill:#D97706}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Pré-processador: você escreve SCSS/Less, o navegador recebe CSS</text><rect x="30" y="60" width="230" height="150" rx="6" class="xP"/><text x="145" y="82" class="m b c">estilo.scss</text><text x="46" y="106" class="k">$cor: #1a73e8;</text><text x="46" y="121" class="k">.btn {</text><text x="46" y="136" class="k">&#160; color: $cor;</text><text x="46" y="151" class="k">&#160; &amp;:hover {</text><text x="46" y="166" class="k">&#160;&#160;&#160; opacity: .8;</text><text x="46" y="181" class="k">&#160; }</text><text x="46" y="196" class="k">}</text><path d="M260,135L340,135" class="l" marker-end="url(#a)"/><rect x="340" y="100" width="180" height="70" rx="6" class="xO"/><text x="430" y="132" class="b c">compilador</text><text x="430" y="149" class="s c">sass · lessc · Vite</text><path d="M520,135L600,135" class="l" marker-end="url(#a)"/><rect x="600" y="60" width="270" height="150" rx="6" class="xB"/><text x="735" y="82" class="m b c">estilo.css</text><text x="616" y="106" class="k">.btn {</text><text x="616" y="121" class="k">&#160; color: #1a73e8;</text><text x="616" y="136" class="k">}</text><text x="616" y="151" class="k">.btn:hover {</text><text x="616" y="166" class="k">&#160; opacity: .8;</text><text x="616" y="181" class="k">}</text><text x="450" y="246" class="b c kO">No build (antes de publicar)</text><text x="735" y="246" class="b c kB">o HTML carrega só o .css</text><text x="450" y="276" class="n c">O navegador não entende .scss nem .less: a compilação acontece no seu computador ou no build.</text></svg>