<svg xmlns="http://www.w3.org/2000/svg" width="900" height="336" viewBox="0 0 900 336"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Bubble sort: a cada passada, o maior &quot;sobe&quot; para o fim</text><text x="250" y="78" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="end">início</text><rect x="280" y="50" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="312" y="77.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">5</text><rect x="344" y="50" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="376" y="77.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">3</text><rect x="408" y="50" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="440" y="77.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">8</text><rect x="472" y="50" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="504" y="77.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">1</text><text x="250" y="140" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="end">1ª passada</text><rect x="280" y="112" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="312" y="139.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">3</text><rect x="344" y="112" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="376" y="139.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">5</text><rect x="408" y="112" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="440" y="139.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">1</text><rect x="472" y="112" width="64" height="44" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="504" y="139.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">8</text><text x="560" y="140" font-size="12" font-style="italic" fill="#6B7280">troca 5↔3 e 8↔1: o 8 chega ao fim</text><text x="250" y="202" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="end">2ª passada</text><rect x="280" y="174" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="312" y="201.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">3</text><rect x="344" y="174" width="64" height="44" rx="5" fill="#fff" stroke="#9CA3AF" stroke-width="1.8"/><text x="376" y="201.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">1</text><rect x="408" y="174" width="64" height="44" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="440" y="201.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">5</text><rect x="472" y="174" width="64" height="44" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="504" y="201.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">8</text><text x="560" y="202" font-size="12" font-style="italic" fill="#6B7280">troca 5↔1: o 5 chega ao seu lugar</text><text x="250" y="264" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="end">3ª passada</text><rect x="280" y="236" width="64" height="44" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="312" y="263.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">1</text><rect x="344" y="236" width="64" height="44" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="376" y="263.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">3</text><rect x="408" y="236" width="64" height="44" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="440" y="263.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">5</text><rect x="472" y="236" width="64" height="44" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="504" y="263.6" class="m" font-size="16" fill="#1F2937" text-anchor="middle">8</text><text x="560" y="264" font-size="12" font-style="italic" fill="#6B7280">troca 3↔1: vetor ordenado ✅</text><text x="450" y="318" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Verde = posição já definitiva. Com n elementos, são até n-1 passadas e cerca de n² comparações.</text></svg>