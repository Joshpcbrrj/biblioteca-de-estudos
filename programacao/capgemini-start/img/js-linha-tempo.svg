<svg xmlns="http://www.w3.org/2000/svg" width="480" height="484" viewBox="0 0 480 484"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">A evolução do JavaScript</text><circle cx="90" cy="68" r="7" fill="#374151"/><text x="76" y="73" class="s b r">1995</text><rect x="112" y="52" width="348" height="44" rx="6" class="xB"/><text x="124" y="72" class="b">JavaScript criado</text><text x="124" y="90" class="s">por Brendan Eich, em 10 dias</text><circle cx="90" cy="122" r="7" fill="#374151"/><text x="76" y="127" class="s b r">1997</text><rect x="112" y="106" width="348" height="44" rx="6" class="xG"/><text x="124" y="126" class="b">ECMAScript 1</text><text x="124" y="144" class="s">a linguagem é padronizada</text><circle cx="90" cy="176" r="7" fill="#374151"/><text x="76" y="181" class="s b r">2006</text><rect x="112" y="160" width="348" height="44" rx="6" class="xO"/><text x="124" y="180" class="b">jQuery</text><text x="124" y="198" class="s">simplifica o DOM</text><circle cx="90" cy="230" r="7" fill="#374151"/><text x="76" y="235" class="s b r">2009</text><rect x="112" y="214" width="348" height="44" rx="6" class="xP"/><text x="124" y="234" class="b">ES5 e Node.js</text><text x="124" y="252" class="s">JavaScript também no servidor</text><circle cx="90" cy="284" r="7" fill="#374151"/><text x="76" y="289" class="s b r">2015</text><rect x="112" y="268" width="348" height="44" rx="6" class="xB"/><text x="124" y="288" class="b">ES6 / ES2015</text><text x="124" y="306" class="s">let, const, =&gt;, classes, módulos</text><circle cx="90" cy="338" r="7" fill="#374151"/><text x="76" y="343" class="s b r">2017</text><rect x="112" y="322" width="348" height="44" rx="6" class="xG"/><text x="124" y="342" class="b">async/await</text><text x="124" y="360" class="s">ES2017</text><circle cx="90" cy="392" r="7" fill="#374151"/><text x="76" y="397" class="s b r">hoje</text><rect x="112" y="376" width="348" height="44" rx="6" class="xO"/><text x="124" y="396" class="b">uma versão nova por ano</text><text x="124" y="414" class="s">ES2016, ES2017, ...</text><path d="M90,68 L90,404" class="l"/><text x="240.0" y="442" class="n c">ECMAScript é a especificação;</text><text x="240.0" y="460" class="n c">JavaScript é a linguagem que a implementa.</text></svg>