<svg xmlns="http://www.w3.org/2000/svg" width="900" height="262" viewBox="0 0 900 262"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xY{fill:#F3F4F6;stroke:#9CA3AF}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}</style><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">A evolução do JavaScript</text><path d="M30,120H870" class="l"/><circle cx="80" cy="120" r="7" class="xB"/><text x="80" y="102" class="b c">1995</text><path d="M80,127V146" class="l"/><rect x="20" y="146" width="120" height="40" rx="6" class="xB"/><text x="80" y="163" class="c">JavaScript criado</text><text x="80" y="178" class="s c">por Brendan Eich</text><circle cx="204" cy="120" r="7" class="xY"/><text x="204" y="102" class="b c">1997</text><path d="M204,127V190" class="l"/><rect x="144" y="190" width="120" height="40" rx="6" class="xY"/><text x="204" y="207" class="c">ECMAScript 1</text><text x="204" y="222" class="s c">(padronização)</text><circle cx="328" cy="120" r="7" class="xO"/><text x="328" y="102" class="b c">2006</text><path d="M328,127V146" class="l"/><rect x="268" y="146" width="120" height="40" rx="6" class="xO"/><text x="328" y="171" class="c">jQuery</text><circle cx="452" cy="120" r="7" class="xY"/><text x="452" y="102" class="b c">2009</text><path d="M452,127V190" class="l"/><rect x="392" y="190" width="120" height="40" rx="6" class="xY"/><text x="452" y="207" class="c">ES5 e</text><text x="452" y="222" class="s c">Node.js</text><circle cx="576" cy="120" r="7" class="xG"/><text x="576" y="102" class="b c">2015</text><path d="M576,127V146" class="l"/><rect x="516" y="146" width="120" height="40" rx="6" class="xG"/><text x="576" y="163" class="c">ES6 / ES2015</text><text x="576" y="178" class="s c">let, const, =&gt;, classes</text><circle cx="700" cy="120" r="7" class="xG"/><text x="700" y="102" class="b c">2017</text><path d="M700,127V190" class="l"/><rect x="640" y="190" width="120" height="40" rx="6" class="xG"/><text x="700" y="207" class="c">async/await</text><text x="700" y="222" class="s c">(ES2017)</text><circle cx="824" cy="120" r="7" class="xP"/><text x="824" y="102" class="b c">hoje</text><path d="M824,127V146" class="l"/><rect x="764" y="146" width="120" height="40" rx="6" class="xP"/><text x="824" y="163" class="c">uma versão</text><text x="824" y="178" class="s c">nova por ano</text><text x="450" y="248" class="n c">ECMAScript é o nome oficial da especificação; JavaScript é a linguagem que a implementa.</text></svg>