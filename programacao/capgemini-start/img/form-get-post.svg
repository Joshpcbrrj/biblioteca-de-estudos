<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Como o formulário envia os dados</text><rect x="140" y="48" width="200" height="128" rx="6" class="xY"/><text x="240" y="68" class="m b c">&lt;form&gt;</text><rect x="156" y="80" width="168" height="26" rx="3" class="xW"/><text x="164" y="98" class="s">nome: Ana</text><rect x="156" y="112" width="168" height="26" rx="3" class="xW"/><text x="164" y="130" class="s">senha: ••••</text><rect x="190" y="144" width="100" height="26" rx="6" class="xB"/><text x="240.0" y="161.5" class="b c">Enviar</text><rect x="20" y="196" width="440" height="104" rx="6" class="xO"/><text x="34" y="218" class="b">GET: os dados vão na URL</text><text x="34" y="240" class="m">GET /login?nome=Ana&amp;senha=1234</text><text x="34" y="266" class="s">visível, fica no histórico;</text><text x="34" y="284" class="s">bom para buscas e filtros</text><rect x="20" y="312" width="440" height="118" rx="6" class="xG"/><text x="34" y="334" class="b">POST: os dados vão no corpo</text><text x="34" y="356" class="m">POST /login HTTP/1.1</text><text x="34" y="373" class="m">Content-Type: application/x-www-</text><text x="34" y="390" class="m">  form-urlencoded</text><text x="34" y="407" class="m">nome=Ana&amp;senha=1234</text><text x="240.0" y="458" class="n c">Os dados só ficam protegidos de verdade</text><text x="240.0" y="476" class="n c">com HTTPS, que criptografa a requisição.</text></svg>