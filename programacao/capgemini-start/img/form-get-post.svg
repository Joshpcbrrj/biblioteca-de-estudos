<svg xmlns="http://www.w3.org/2000/svg" width="900" height="318" viewBox="0 0 900 318"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xW{fill:#fff;stroke:#9CA3AF}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Como o formulário envia os dados</text><rect x="30" y="50" width="250" height="170" rx="6" class="xB"/><text x="155" y="74" class="m c b">&lt;form&gt;</text><rect x="50" y="88" width="210" height="30" rx="6" class="xW"/><text x="60" y="108" class="m">nome: Ana</text><rect x="50" y="126" width="210" height="30" rx="6" class="xW"/><text x="60" y="146" class="m">senha: ••••</text><rect x="110" y="168" width="90" height="32" rx="6" class="xG"/><text x="155" y="189" class="b c">Enviar</text><path d="M280,100L360,80" class="l" marker-end="url(#a)"/><path d="M280,170L360,200" class="l" marker-end="url(#a)"/><rect x="360" y="48" width="510" height="96" rx="6" class="xO"/><text x="376" y="72" class="b">GET: os dados vão na URL</text><text x="376" y="98" class="m">GET /login?nome=Ana&amp;senha=1234 HTTP/1.1</text><text x="376" y="124" class="s">visível, fica no histórico · bom para buscas e filtros</text><rect x="360" y="160" width="510" height="110" rx="6" class="xG"/><text x="376" y="184" class="b">POST: os dados vão no corpo da requisição</text><text x="376" y="208" class="m">POST /login HTTP/1.1</text><text x="376" y="226" class="m">Content-Type: application/x-www-form-urlencoded</text><text x="376" y="248" class="m">nome=Ana&amp;senha=1234</text><text x="450" y="304" class="n c">Mesmo no POST os dados só ficam protegidos de verdade com HTTPS, que criptografa a requisição.</text></svg>