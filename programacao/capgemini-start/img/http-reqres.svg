" class="s r">header</text><text x="34" y="332" class="m">[{"id":1,"nome":"Café"}]</text><text x="450" y="332" class="s r">body</text><text x="240.0" y="366" class="n c">HTTP é stateless: cada request é independente.</text><text x="240.0" y="384" class="n c">Cookies e tokens fazem o servidor "lembrar".</text></svg>