<svg xmlns="http://www.w3.org/2000/svg" width="480" height="408" viewBox="0 0 480 408"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">HTTP: request e response</text><rect x="20" y="48" width="180" height="50" rx="6" class="xB"/><text x="110.0" y="69.5" class="b c">Cliente</text><text x="110.0" y="87.5" class="s c">navegador, app</text><rect x="280" y="48" width="180" height="50" rx="6" class="xG"/><text x="370.0" y="69.5" class="b c">Servidor</text><text x="370.0" y="87.5" class="s c">site, API</text><path d="M200,64 L280,64" class="l" marker-end="url(#a)"/><path d="M280,84 L200,84" class="l" marker-end="url(#a)"/><text x="240" y="58" class="s c">request</text><text x="240" y="102" class="s c">response</text><rect x="20" y="124" width="440" height="110" rx="6" class="xB"/><text x="34" y="145" class="b">Request</text><text x="34" y="168" class="m">GET /produtos?cat=1 HTTP/1.1</text><text x="450" y="168" class="s r">linha</text><text x="34" y="188" class="m">Host: loja.com</text><text x="450" y="188" class="s r">header</text><text x="34" y="208" class="m">Accept: application/json</text><text x="450" y="208" class="s r">header</text><text x="34" y="228" class="m">(sem body no GET)</text><text x="450" y="228" class="s r">body</text><rect x="20" y="248" width="440" height="90" rx="6" class="xG"/><text x="34" y="269" class="b">Response</text><text x="34" y="292" class="m">HTTP/1.1 200 OK</text><text x="450" y="292" class="s r">status</text><text x="34" y="312" class="m">Content-Type: application/json</text><text x="450" y="312" class="s r">header</text><text x="34" y="332" class="m">[{"id":1,"nome":"Café"}]</text><text x="450" y="332" class="s r">body</text><text x="240.0" y="366" class="n c">HTTP é stateless: cada request é independente.</text><text x="240.0" y="384" class="n c">Cookies e tokens fazem o servidor "lembrar".</text></svg>