<svg xmlns="http://www.w3.org/2000/svg" width="900" height="354" viewBox="0 0 900 354"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">HTTP: o cliente pede (request), o servidor responde (response)</text><rect x="30" y="54" width="150" height="80" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="105" y="91" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Cliente</text><text x="105" y="109" font-size="11.5" fill="#6B7280" text-anchor="middle">navegador, app</text><rect x="720" y="54" width="150" height="80" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="795" y="91" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Servidor</text><text x="795" y="109" font-size="11.5" fill="#6B7280" text-anchor="middle">site, API</text><line x1="184" y1="76" x2="716" y2="76" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="450" y="68" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="middle">request</text><line x1="716" y1="114" x2="184" y2="114" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="450" y="132" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="middle">response</text><rect x="30" y="160" width="410" height="150" rx="8" fill="#fff" stroke="#2563EB" stroke-width="1.6"/><text x="46" y="182" font-size="13" font-weight="bold" fill="#2563EB">Request</text><text x="46" y="208" class="m" font-size="12" fill="#1F2937">GET /produtos?cat=1 HTTP/1.1</text><text x="424" y="208" font-size="10.5" font-style="italic" fill="#6B7280" text-anchor="end">linha: método + caminho + versão</text><text x="46" y="232" class="m" font-size="12" fill="#1F2937">Host: loja.com</text><text x="424" y="232" font-size="10.5" font-style="italic" fill="#6B7280" text-anchor="end">headers</text><text x="46" y="256" class="m" font-size="12" fill="#1F2937">Accept: application/json</text><text x="46" y="280" class="m" font-size="12" fill="#1F2937">(sem body no GET)</text><text x="424" y="280" font-size="10.5" font-style="italic" fill="#6B7280" text-anchor="end">body</text><rect x="460" y="160" width="410" height="150" rx="8" fill="#fff" stroke="#16A34A" stroke-width="1.6"/><text x="476" y="182" font-size="13" font-weight="bold" fill="#16A34A">Response</text><text x="476" y="208" class="m" font-size="12" fill="#1F2937">HTTP/1.1 200 OK</text><text x="854" y="208" font-size="10.5" font-style="italic" fill="#6B7280" text-anchor="end">versão + status</text><text x="476" y="232" class="m" font-size="12" fill="#1F2937">Content-Type: application/json</text><text x="854" y="232" font-size="10.5" font-style="italic" fill="#6B7280" text-anchor="end">headers</text><text x="476" y="280" class="m" font-size="12" fill="#1F2937">[{&quot;id&quot;:1,&quot;nome&quot;:&quot;Café&quot;}]</text><text x="854" y="280" font-size="10.5" font-style="italic" fill="#6B7280" text-anchor="end">body</text><text x="450" y="336" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">HTTP é stateless: cada request é independente; o servidor não lembra das anteriores (cookies e tokens resolvem isso).</text></svg>