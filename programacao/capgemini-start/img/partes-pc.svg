<svg xmlns="http://www.w3.org/2000/svg" width="900" height="336" viewBox="0 0 900 336"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Como as partes do computador trabalham juntas</text><rect x="30" y="70" width="170" height="80" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="115" y="107" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Entrada</text><text x="115" y="125" font-size="11.5" fill="#6B7280" text-anchor="middle">teclado, mouse, microfone</text><rect x="260" y="50" width="380" height="130" rx="12" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="450" y="72" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="middle">Placa-mãe</text><rect x="285" y="85" width="150" height="76" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="360" y="120" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">CPU</text><text x="360" y="138" font-size="11.5" fill="#6B7280" text-anchor="middle">executa instruções</text><rect x="465" y="85" width="150" height="76" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="540" y="120" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">RAM</text><text x="540" y="138" font-size="11.5" fill="#6B7280" text-anchor="middle">dados em uso (volátil)</text><line x1="436" y1="123" x2="464" y2="123" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)" marker-start="url(#arg)"/><rect x="700" y="70" width="170" height="80" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="785" y="107" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Saída</text><text x="785" y="125" font-size="11.5" fill="#6B7280" text-anchor="middle">monitor, caixa de som</text><line x1="202" y1="110" x2="258" y2="110" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><line x1="642" y1="110" x2="698" y2="110" stroke="#D97706" stroke-width="2" marker-end="url(#aro)"/><rect x="355" y="220" width="190" height="66" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="450" y="250" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Armazenamento</text><text x="450" y="268" font-size="11.5" fill="#6B7280" text-anchor="middle">SSD / HD (permanente)</text><line x1="540" y1="182" x2="470" y2="218" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)" marker-start="url(#arg)"/><text x="450" y="318" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">O programa e os arquivos ficam no SSD/HD; para rodar, são copiados para a RAM, onde a CPU os executa.</text></svg>