<svg xmlns="http://www.w3.org/2000/svg" width="480" height="394" viewBox="0 0 480 394"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Como as partes do computador trabalham juntas</text><rect x="20" y="50" width="200" height="52" rx="6" class="xB"/><text x="120.0" y="72.5" class="b c">Entrada</text><text x="120.0" y="90.5" class="s c">teclado, mouse, microfone</text><rect x="260" y="50" width="200" height="52" rx="6" class="xG"/><text x="360.0" y="72.5" class="b c">Saída</text><text x="360.0" y="90.5" class="s c">monitor, caixa de som</text><rect x="20" y="130" width="440" height="110" rx="6" class="xY"/><text x="34" y="150" class="b">Placa-mãe</text><rect x="40" y="164" width="180" height="60" rx="6" class="xP"/><text x="130.0" y="190.5" class="b c">CPU</text><text x="130.0" y="208.5" class="s c">executa instruções</text><rect x="260" y="164" width="180" height="60" rx="6" class="xO"/><text x="350.0" y="190.5" class="b c">RAM</text><text x="350.0" y="208.5" class="s c">dados em uso (volátil)</text><path d="M220,194 L260,194" class="l" marker-end="url(#a)" marker-start="url(#a)"/><path d="M120,102 L120,164" class="l" marker-end="url(#a)"/><path d="M350,164 L350,102" class="l" marker-end="url(#a)"/><rect x="120" y="272" width="240" height="52" rx="6" class="xT"/><text x="240.0" y="294.5" class="b c">Armazenamento</text><text x="240.0" y="312.5" class="s c">SSD / HD (permanente)</text><path d="M300,272 L330,224" class="l" marker-end="url(#a)"/><text x="318" y="258" class="s">copia para a RAM</text><text x="240.0" y="352" class="n c">Programas e arquivos ficam no SSD/HD; para rodar,</text><text x="240.0" y="370" class="n c">vão para a RAM, onde a CPU os executa.</text></svg>