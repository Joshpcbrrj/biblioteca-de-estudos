<svg xmlns="http://www.w3.org/2000/svg" width="480" height="344" viewBox="0 0 480 344"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Procedimento × função</text><rect x="20" y="48" width="440" height="126" rx="6" class="xY"/><text x="34" y="70" class="b">Programa principal</text><text x="34" y="96" class="m">mostrarMenu()</text><text x="34" y="114" class="s">↳ só executa</text><text x="34" y="142" class="m">total &lt;- somar(2, 3)</text><text x="34" y="160" class="s">↳ recebe o valor devolvido: 5</text><rect x="20" y="210" width="200" height="64" rx="6" class="xB"/><text x="120.0" y="230.5" class="b c">procedimento</text><text x="120.0" y="248.5" class="s c">mostrarMenu()</text><text x="120.0" y="264.5" class="s c">não retorna valor</text><rect x="260" y="210" width="200" height="64" rx="6" class="xG"/><text x="360.0" y="230.5" class="b c">função</text><text x="360.0" y="248.5" class="s c">somar(a, b): inteiro</text><text x="360.0" y="264.5" class="s c">retorne a + b</text><path d="M120,174 L120,210" class="l" marker-end="url(#a)"/><path d="M330,174 L330,210" class="l" marker-end="url(#a)"/><path d="M400,210 L400,174" class="l" marker-end="url(#a)"/><text x="408" y="196" class="s b">devolve 5</text><text x="240.0" y="302" class="n c">Variáveis declaradas dentro da rotina são locais:</text><text x="240.0" y="320" class="n c">só existem enquanto ela executa.</text></svg>