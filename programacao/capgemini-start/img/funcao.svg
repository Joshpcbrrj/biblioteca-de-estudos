<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Procedimento × função</text><rect x="30" y="50" width="400" height="190" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="230" y="76" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">Programa principal</text><text x="60" y="116" class="m" font-size="14" fill="#1F2937">mostrarMenu()</text><text x="60" y="136" font-size="11.5" font-style="italic" fill="#6B7280">↳ só executa</text><text x="60" y="186" class="m" font-size="14" fill="#1F2937">total &lt;- somar(2, 3)</text><text x="60" y="206" font-size="11.5" font-style="italic" fill="#6B7280">↳ recebe o valor devolvido: 5</text><rect x="510" y="70" width="360" height="60" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="690" y="97" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">procedimento mostrarMenu()</text><text x="690" y="115" font-size="11.5" fill="#6B7280" text-anchor="middle">executa e não retorna valor</text><rect x="510" y="160" width="360" height="60" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="690" y="187" class="m" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">funcao somar(a, b): inteiro</text><text x="690" y="205" font-size="11.5" fill="#6B7280" text-anchor="middle">retorne a + b</text><line x1="260" y1="112" x2="506" y2="100" stroke="#7C3AED" stroke-width="2" marker-end="url(#arp)"/><line x1="300" y1="182" x2="506" y2="186" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><path d="M506,206 C440,224 340,222 300,200" fill="none" stroke="#16A34A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arv)"/><text x="460" y="238" font-size="12" font-weight="bold" fill="#16A34A" text-anchor="middle">devolve 5</text><text x="450" y="272" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Variáveis declaradas dentro da rotina são locais: só existem enquanto ela executa.</text></svg>