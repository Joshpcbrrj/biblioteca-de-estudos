<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Collections do Java</text><text x="70" y="62" class="s b c">interfaces</text><text x="370" y="62" class="s b c">implementações</text><rect x="10" y="72" width="200" height="34" rx="6" class="xY"/><text x="110.0" y="93.5" class="m b c">Collection&lt;E&gt;</text><rect x="50" y="124" width="200" height="52" rx="6" class="xB"/><text x="150.0" y="146.5" class="m b c">List&lt;E&gt;</text><text x="150.0" y="164.5" class="s c">ordem · repetidos · índice</text><path d="M28,150 L48,150" class="l" marker-end="url(#a)"/><rect x="290" y="123" width="180" height="25" rx="6" class="xW"/><text x="380" y="140" class="m c">ArrayList</text><rect x="290" y="151" width="180" height="25" rx="6" class="xW"/><text x="380" y="168" class="m c">LinkedList</text><path d="M250,150 L288,150" class="l" marker-end="url(#a)"/><rect x="50" y="196" width="200" height="52" rx="6" class="xG"/><text x="150.0" y="218.5" class="m b c">Set&lt;E&gt;</text><text x="150.0" y="236.5" class="s c">sem repetidos</text><path d="M28,222 L48,222" class="l" marker-end="url(#a)"/><rect x="290" y="195" width="180" height="25" rx="6" class="xW"/><text x="380" y="212" class="m c">HashSet</text><rect x="290" y="223" width="180" height="25" rx="6" class="xW"/><text x="380" y="240" class="m c">TreeSet</text><path d="M250,222 L288,222" class="l" marker-end="url(#a)"/><rect x="50" y="268" width="200" height="52" rx="6" class="xO"/><text x="150.0" y="290.5" class="m b c">Queue&lt;E&gt;</text><text x="150.0" y="308.5" class="s c">fila (FIFO)</text><path d="M28,294 L48,294" class="l" marker-end="url(#a)"/><rect x="290" y="267" width="180" height="25" rx="6" class="xW"/><text x="380" y="284" class="m c">ArrayDeque</text><rect x="290" y="295" width="180" height="25" rx="6" class="xW"/><text x="380" y="312" class="m c">PriorityQueue</text><path d="M250,294 L288,294" class="l" marker-end="url(#a)"/><path d="M28,106 L28,294" class="l"/><rect x="50" y="350" width="200" height="52" rx="6" class="xP"/><text x="150.0" y="372.5" class="m b c">Map&lt;K, V&gt;</text><text x="150.0" y="390.5" class="s c">chave → valor (chaves únicas)</text><rect x="290" y="349" width="180" height="25" rx="6" class="xW"/><text x="380" y="366" class="m c">HashMap</text><rect x="290" y="377" width="180" height="25" rx="6" class="xW"/><text x="380" y="394" class="m c">TreeMap</text><path d="M250,376 L288,376" class="l" marker-end="url(#a)"/><text x="150" y="422" class="s c">Map não herda de Collection</text><text x="240.0" y="458" class="s c">Declare pela interface:</text><text x="240.0" y="476" class="s c">List&lt;String&gt; nomes = new ArrayList&lt;&gt;();</text></svg>