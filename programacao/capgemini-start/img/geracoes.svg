<svg xmlns="http://www.w3.org/2000/svg" width="900" height="262" viewBox="0 0 900 262"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">As quatro gerações de computadores</text><rect x="30" y="50" width="200" height="150" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="130" y="76" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">1ª · 1946–1959</text><text x="130" y="112" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Válvulas</text><text x="130" y="150" font-size="11.5" fill="#6B7280" text-anchor="middle">ENIAC: ~17 mil válvulas, 27 t</text><line x1="232" y1="125" x2="242" y2="125" stroke="#9CA3AF" stroke-width="2" marker-end="url(#ara)"/><rect x="244" y="50" width="200" height="150" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="344" y="76" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">2ª · 1959–1965</text><text x="344" y="112" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Transistores</text><text x="344" y="150" font-size="11.5" fill="#6B7280" text-anchor="middle">IBM 1401: uso comercial</text><line x1="446" y1="125" x2="456" y2="125" stroke="#9CA3AF" stroke-width="2" marker-end="url(#ara)"/><rect x="458" y="50" width="200" height="150" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="558" y="76" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">3ª · 1965–1975</text><text x="558" y="112" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Circuitos integrados</text><text x="558" y="150" font-size="11.5" fill="#6B7280" text-anchor="middle">IBM System/360</text><line x1="660" y1="125" x2="670" y2="125" stroke="#9CA3AF" stroke-width="2" marker-end="url(#ara)"/><rect x="672" y="50" width="200" height="150" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="772" y="76" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">4ª · 1975–hoje</text><text x="772" y="112" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Microprocessador</text><text x="772" y="150" font-size="11.5" fill="#6B7280" text-anchor="middle">Apple II, PCs, smartphones</text><line x1="60" y1="222" x2="840" y2="222" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arg)"/><text x="450" y="244" font-size="12.5" font-style="italic" fill="#6B7280" text-anchor="middle">menor · mais rápido · mais barato · menos energia</text></svg>