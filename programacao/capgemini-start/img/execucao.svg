<svg xmlns="http://www.w3.org/2000/svg" width="480" height="454" viewBox="0 0 480 454"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">O que acontece ao abrir um programa</text><rect x="80" y="48" width="320" height="50" rx="6" class="xB"/><text x="240.0" y="69.5" class="b c">Clique no ícone</text><text x="240.0" y="87.5" class="s c">o mouse avisa o sistema operacional</text><circle cx="56" cy="73" r="13" fill="#374151"/><text x="56" y="78" class="b c" style="fill:#fff">1</text><path d="M240,98 L240,118" class="l" marker-end="url(#a)"/><rect x="80" y="118" width="320" height="50" rx="6" class="xP"/><text x="240.0" y="139.5" class="b c">SO localiza</text><text x="240.0" y="157.5" class="s c">o programa no SSD/HD</text><circle cx="56" cy="143" r="13" fill="#374151"/><text x="56" y="148" class="b c" style="fill:#fff">2</text><path d="M240,168 L240,188" class="l" marker-end="url(#a)"/><rect x="80" y="188" width="320" height="50" rx="6" class="xO"/><text x="240.0" y="209.5" class="b c">Carrega na RAM</text><text x="240.0" y="227.5" class="s c">código e dados iniciais</text><circle cx="56" cy="213" r="13" fill="#374151"/><text x="56" y="218" class="b c" style="fill:#fff">3</text><path d="M240,238 L240,258" class="l" marker-end="url(#a)"/><rect x="80" y="258" width="320" height="58" rx="6" class="xG"/><text x="240.0" y="275.5" class="b c">CPU executa</text><text x="240.0" y="293.5" class="s c">busca → decodifica → executa,</text><text x="240.0" y="309.5" class="s c">bilhões de vezes por segundo</text><circle cx="56" cy="283" r="13" fill="#374151"/><text x="56" y="288" class="b c" style="fill:#fff">4</text><path d="M240,316 L240,336" class="l" marker-end="url(#a)"/><rect x="80" y="336" width="320" height="50" rx="6" class="xY"/><text x="240.0" y="357.5" class="b c">Resultado</text><text x="240.0" y="375.5" class="s c">aparece no monitor</text><circle cx="56" cy="361" r="13" fill="#374151"/><text x="56" y="366" class="b c" style="fill:#fff">5</text><text x="240.0" y="412" class="n c">Periféricos geram eventos (tecla, clique) que</text><text x="240.0" y="430" class="n c">interrompem a CPU para tratar a entrada.</text></svg>