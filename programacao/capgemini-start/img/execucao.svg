<svg xmlns="http://www.w3.org/2000/svg" width="900" height="264" viewBox="0 0 900 264"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">O que acontece quando você abre um programa</text><rect x="22" y="56" width="160" height="92" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="102" y="99" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Clique no ícone</text><text x="102" y="117" font-size="11.5" fill="#6B7280" text-anchor="middle">evento do mouse avisa o SO</text><circle cx="40" cy="56" r="13" fill="#16A34A"/><text x="40" y="61" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text><line x1="184" y1="102" x2="196" y2="102" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="198" y="56" width="160" height="92" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="278" y="99" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">SO localiza</text><text x="278" y="117" font-size="11.5" fill="#6B7280" text-anchor="middle">o programa no SSD/HD</text><circle cx="216" cy="56" r="13" fill="#2563EB"/><text x="216" y="61" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text><line x1="360" y1="102" x2="372" y2="102" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="374" y="56" width="160" height="92" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="454" y="99" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Carrega na RAM</text><text x="454" y="117" font-size="11.5" fill="#6B7280" text-anchor="middle">código e dados iniciais</text><circle cx="392" cy="56" r="13" fill="#7C3AED"/><text x="392" y="61" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text><line x1="536" y1="102" x2="548" y2="102" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="550" y="56" width="160" height="92" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="630" y="99" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">CPU executa</text><text x="630" y="117" font-size="11.5" fill="#6B7280" text-anchor="middle">instrução por instrução</text><circle cx="568" cy="56" r="13" fill="#D97706"/><text x="568" y="61" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">4</text><line x1="712" y1="102" x2="724" y2="102" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="726" y="56" width="160" height="92" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="806" y="99" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Resultado</text><text x="806" y="117" font-size="11.5" fill="#6B7280" text-anchor="middle">aparece no monitor</text><circle cx="744" cy="56" r="13" fill="#DC2626"/><text x="744" y="61" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="626" y="172" font-size="11.5" font-weight="bold" fill="#D97706" text-anchor="middle">busca → decodifica → executa</text><text x="626" y="190" font-size="11.5" font-style="italic" fill="#D97706" text-anchor="middle">bilhões de vezes por segundo</text><text x="450" y="246" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Periféricos geram eventos (tecla, clique) que interrompem a CPU para tratar a entrada.</text></svg>