<svg xmlns="http://www.w3.org/2000/svg" width="480" height="478" viewBox="0 0 480 478"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Do código-fonte à execução em Java</text><rect x="110" y="48" width="260" height="50" rx="6" class="xY"/><text x="240.0" y="69.5" class="m b c">Main.java</text><text x="240.0" y="87.5" class="s c">código-fonte</text><path d="M240.0,98 L240.0,120" class="l" marker-end="url(#a)"/><rect x="110" y="120" width="260" height="50" rx="6" class="xP"/><text x="240.0" y="141.5" class="m b c">javac</text><text x="240.0" y="159.5" class="s c">compilador</text><path d="M240.0,170 L240.0,192" class="l" marker-end="url(#a)"/><rect x="110" y="192" width="260" height="50" rx="6" class="xG"/><text x="240.0" y="213.5" class="m b c">Main.class</text><text x="240.0" y="231.5" class="s c">bytecode (compila uma vez)</text><path d="M240,242 L240,264" class="l" marker-end="url(#a)"/><rect x="40" y="264" width="400" height="96" rx="6" class="xO"/><text x="240" y="286" class="b c">JVM</text><text x="240" y="306" class="s c">carrega e verifica o bytecode</text><text x="240" y="322" class="s c">interpreta + compila trechos (JIT)</text><text x="240" y="338" class="s c">gerencia memória (garbage collector)</text><rect x="40" y="372" width="128" height="36" rx="6" class="xB"/><text x="104.0" y="394.5" class="b c">Windows</text><rect x="176" y="372" width="128" height="36" rx="6" class="xB"/><text x="240.0" y="394.5" class="b c">Linux</text><rect x="312" y="372" width="128" height="36" rx="6" class="xB"/><text x="376.0" y="394.5" class="b c">macOS</text><text x="240.0" y="436" class="n c">"Write once, run anywhere": cada sistema tem</text><text x="240.0" y="454" class="n c">a sua JVM, e o bytecode é o mesmo.</text></svg>