<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Do código-fonte à execução em Java</text><rect x="30" y="70" width="160" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="110" y="102" class="m" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Main.java</text><text x="110" y="120" font-size="11.5" fill="#6B7280" text-anchor="middle">código-fonte</text><line x1="192" y1="105" x2="218" y2="105" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="220" y="70" width="160" height="70" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="300" y="102" class="m" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">javac</text><text x="300" y="120" font-size="11.5" fill="#6B7280" text-anchor="middle">compilador</text><line x1="382" y1="105" x2="408" y2="105" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="410" y="70" width="160" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="490" y="102" class="m" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Main.class</text><text x="490" y="120" font-size="11.5" fill="#6B7280" text-anchor="middle">bytecode</text><line x1="572" y1="105" x2="598" y2="105" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="600" y="46" width="270" height="120" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="735" y="68" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">JVM</text><text x="735" y="92" font-size="11.5" fill="#1F2937" text-anchor="middle">carrega e verifica o bytecode</text><text x="735" y="112" font-size="11.5" fill="#1F2937" text-anchor="middle">interpreta + compila trechos (JIT)</text><text x="735" y="132" font-size="11.5" fill="#1F2937" text-anchor="middle">gerencia memória (garbage collector)</text><rect x="600" y="200" width="84" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="642" y="225" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Windows</text><line x1="735" y1="168" x2="642" y2="198" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="692" y="200" width="84" height="40" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="734" y="225" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Linux</text><line x1="735" y1="168" x2="734" y2="198" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="784" y="200" width="84" height="40" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="826" y="225" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">macOS</text><line x1="735" y1="168" x2="826" y2="198" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="300" y="190" font-size="13" font-weight="bold" fill="#7C3AED" text-anchor="middle">compila uma vez</text><text x="300" y="210" font-size="11.5" font-style="italic" fill="#6B7280" text-anchor="middle">o mesmo .class serve para todos os sistemas</text><text x="450" y="272" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">&quot;Write once, run anywhere&quot;: cada sistema tem a sua JVM, e o bytecode é o mesmo.</text></svg>