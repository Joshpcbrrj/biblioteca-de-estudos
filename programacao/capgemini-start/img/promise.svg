<svg xmlns="http://www.w3.org/2000/svg" width="900" height="272" viewBox="0 0 900 272"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xR{fill:#FEE2E2;stroke:#DC2626}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Promise: um valor que vai chegar no futuro</text><rect x="30" y="80" width="150" height="60" rx="6" class="xB"/><text x="105" y="107" class="b c">fetch(url)</text><text x="105" y="124" class="s c">dispara o pedido</text><path d="M180,110L250,110" class="l" marker-end="url(#a)"/><rect x="250" y="80" width="170" height="60" rx="6" class="xO"/><text x="335" y="107" class="b c">Promise</text><text x="335" y="124" class="s c">pending (aguardando)</text><path d="M420,95L520,62" class="l" marker-end="url(#a)"/><path d="M420,125L520,158" class="l" marker-end="url(#a)"/><rect x="520" y="36" width="170" height="56" rx="6" class="xG"/><text x="605" y="61" class="b c">fulfilled</text><text x="605" y="78" class="s c">deu certo</text><rect x="520" y="130" width="170" height="56" rx="6" class="xR"/><text x="605" y="155" class="b c">rejected</text><text x="605" y="172" class="s c">falha de rede</text><path d="M690,64L760,64" class="l" marker-end="url(#a)"/><path d="M690,158L760,158" class="l" marker-end="url(#a)"/><text x="770" y="60" class="m">.then(...)</text><text x="770" y="76" class="s">ou await</text><text x="770" y="154" class="m">.catch(...)</text><text x="770" y="170" class="s">ou try/catch</text><text x="450" y="230" class="c">Enquanto a Promise está pendente, a página continua respondendo: nada trava esperando o servidor.</text><text x="450" y="258" class="n c">fetch só rejeita em falha de rede; respostas 404 e 500 chegam em then, por isso confira response.ok.</text></svg>