<svg xmlns="http://www.w3.org/2000/svg" width="480" height="446" viewBox="0 0 480 446"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Promise: um valor que vai chegar</text><rect x="130" y="48" width="220" height="48" rx="6" class="xY"/><text x="240.0" y="68.5" class="m b c">fetch(url)</text><text x="240.0" y="86.5" class="s c">dispara o pedido</text><rect x="130" y="124" width="220" height="48" rx="6" class="xB"/><text x="240.0" y="144.5" class="b c">Promise</text><text x="240.0" y="162.5" class="s c">pending (aguardando)</text><path d="M240,96 L240,124" class="l" marker-end="url(#a)"/><rect x="20" y="210" width="200" height="48" rx="6" class="xG"/><text x="120.0" y="230.5" class="b c">fulfilled</text><text x="120.0" y="248.5" class="s c">deu certo</text><rect x="260" y="210" width="200" height="48" rx="6" class="xR"/><text x="360.0" y="230.5" class="b c">rejected</text><text x="360.0" y="248.5" class="s c">falha de rede</text><path d="M200,172 L120,210" class="l" marker-end="url(#a)"/><path d="M280,172 L360,210" class="l" marker-end="url(#a)"/><rect x="20" y="282" width="200" height="48" rx="6" class="xW"/><text x="120.0" y="302.5" class="m b c">.then(...)</text><text x="120.0" y="320.5" class="s c">ou await</text><rect x="260" y="282" width="200" height="48" rx="6" class="xW"/><text x="360.0" y="302.5" class="m b c">.catch(...)</text><text x="360.0" y="320.5" class="s c">ou try/catch</text><path d="M120,258 L120,282" class="l" marker-end="url(#a)"/><path d="M360,258 L360,282" class="l" marker-end="url(#a)"/><text x="240.0" y="360" class="s c">Enquanto a Promise está pendente, a página</text><text x="240.0" y="378" class="s c">continua respondendo: nada trava.</text><text x="240.0" y="404" class="n c">fetch só rejeita em falha de rede; 404 e 500</text><text x="240.0" y="422" class="n c">chegam no then: confira response.ok.</text></svg>