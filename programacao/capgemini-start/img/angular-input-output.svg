<svg xmlns="http://www.w3.org/2000/svg" width="480" height="438" viewBox="0 0 480 438"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Pai e filho: @Input e @Output</text><rect x="90" y="50" width="300" height="56" rx="6" class="xB"/><text x="240.0" y="74.5" class="b c">ListaComponent (pai)</text><text x="240.0" y="92.5" class="s c">produtos = [...]</text><rect x="90" y="230" width="300" height="56" rx="6" class="xG"/><text x="240.0" y="254.5" class="b c">ProdutoCardComponent (filho)</text><text x="240.0" y="272.5" class="s c">@Input produto · @Output comprar</text><path d="M170,106 L170,230" class="l" marker-end="url(#a)"/><path d="M310,230 L310,106" class="l" marker-end="url(#a)"/><text x="160" y="150" class="m r">[produto]="p"</text><text x="160" y="170" class="s r b">@Input</text><text x="160" y="188" class="s r">pai → filho</text><text x="320" y="150" class="m">(comprar)</text><text x="320" y="170" class="s b">@Output</text><text x="320" y="188" class="s">filho → pai</text><text x="240.0" y="322" class="s c b">No template do pai:</text><tex