<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.e{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.kB{fill:#2563EB}.kO{fill:#D97706}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Comunicação entre componentes: @Input e @Output</text><rect x="300" y="50" width="300" height="64" rx="6" class="xB"/><text x="450" y="79" class="b c">ListaComponent (pai)</text><text x="450" y="96" class="s c">produtos = [...]</text><rect x="300" y="200" width="300" height="64" rx="6" class="xG"/><text x="450" y="229" class="b c">ProdutoCardComponent (filho)</text><text x="450" y="246" class="s c">@Input() produto · @Output() comprar</text><path d="M400,114L400,200" class="l" marker-end="url(#a)"/><text x="392" y="152" class="m kB e">[produto]="p"</text><text x="392" y="170" class="s e">@Input: pai → filho</text><path d="M500,200L500,114" class="l" marker-end="url(#a)"/><text x="508" y="152" class="m kO">(comprar)="adicionar($event)"</text><text x="508" y="170" class="s">@Output: filho → pai (evento)</text><text x="450" y="300" class="m c">&lt;app-produto-card [produto]="p" (comprar)="adicionar($event)" /&gt;</text><text x="450" y="326" class="n c">Componentes distantes (sem relação pai e filho) compartilham dados por meio de um service.</text></svg>