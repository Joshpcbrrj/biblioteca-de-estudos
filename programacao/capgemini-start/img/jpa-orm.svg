<svg xmlns="http://www.w3.org/2000/svg" width="480" height="516" viewBox="0 0 480 516"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">ORM com JPA: objetos ↔ tabelas</text><rect x="20" y="48" width="440" height="200" rx="6" class="xB"/><text x="34" y="70" class="b">Classe Java (@Entity)</text><text x="34" y="96" class="m">@Entity</text><text x="34" y="114" class="m">@Table(name = "pessoas")</text><text x="34" y="132" class="m">class Pessoa {</text><text x="34" y="150" class="m">  @Id @GeneratedValue</text><text x="34" y="168" class="m">  Long id;</text><text x="34" y="186" class="m">  String nome;</text><text x="34" y="204" class="m">  int idade;</text><text x="34" y="222" class="m">}</text><rect x="140" y="270" width="200" height="52" rx="6" class="xP"/><text x="240.0" y="292.5" class="b c">JPA</text><text x="240.0" y="310.5" class="s c">Hibernate (ORM)</text><path d="M240,248 L240,270" class="l" marker-end="url(#a)"/><path d="M240,322 L240,344" class="l" marker-end="url(#a)"/><text x="350" y="290" class="m" style="font-size:12px">persist → INSERT</text><text x="350" y="308" class="m" style="font-size:12px">find ← SELECT</text><rect x="20" y="344" width="440" height="28" rx="6" class="xG"/><text x="240" y="363" class="b c">tabela pessoas</text><rect x="20" y="372" width="440" height="26" rx="0" class="xW"/><text x="34" y="390" class="m b">id (PK)</text><text x="184" y="390" class="m b">nome</text><text x="334" y="390" class="m b">idade</text><rect x="20" y="398" width="440" height="26" rx="0" class="xW"/><text x="34" y="416" class="m">1</text><text x="184" y="416" class="m">Ana Souza</text><text x="334" y="416" class="m">30</text><rect x="20" y="424" width="440" height="26" rx="0" class="xW"/><text x="34" y="442" class="m">2</text><text x="184" y="442" class="m">Bia Lima</text><text x="334" y="442" class="m">25</text><text x="240.0" y="474" class="n c">Você trabalha com objetos; o Hibernate gera o</text><text x="240.0" y="492" class="n c">SQL e converte linhas em objetos.</text></svg>