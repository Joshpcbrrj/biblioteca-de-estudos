<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xW{fill:#fff;stroke:#9CA3AF}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">ORM com JPA: objetos de um lado, tabelas do outro</text><rect x="40" y="60" width="320" height="190" rx="6" class="xB"/><text x="200" y="84" class="b c">Classe Java (@Entity)</text><text x="58" y="110" class="m" style="font-size:11.5px">@Entity</text><text x="58" y="127" class="m" style="font-size:11.5px">@Table(name = &quot;pessoas&quot;)</text><text x="58" y="144" class="m" style="font-size:11.5px">class Pessoa {</text><text x="58" y="161" class="m" style="font-size:11.5px">  @Id @GeneratedValue</text><text x="58" y="178" class="m" style="font-size:11.5px">  Long id;</text><text x="58" y="195" class="m" style="font-size:11.5px">  String nome;</text><text x="58" y="212" class="m" style="font-size:11.5px">  int idade;</text><text x="58" y="229" class="m" style="font-size:11.5px">}</text><rect x="540" y="60" width="320" height="190" rx="6" class="xO"/><text x="700" y="84" class="b c">Tabela no banco</text><rect x="560" y="104" width="94" height="30" rx="0" class="xW"/><text x="607" y="124" class="m b c" style="font-size:11.5px">id (PK)</text><rect x="654" y="104" width="94" height="30" rx="0" class="xW"/><text x="701" y="124" class="m b c" style="font-size:11.5px">nome</text><rect x="748" y="104" width="94" height="30" rx="0" class="xW"/><text x="795" y="124" class="m b c" style="font-size:11.5px">idade</text><rect x="560" y="134" width="94" height="30" rx="0" class="xW"/><text x="607" y="154" class="m c">1</text><rect x="654" y="134" width="94" height="30" rx="0" class="xW"/><text x="701" y="154" class="m c">João</text><rect x="748" y="134" width="94" height="30" rx="0" class="xW"/><text x="795" y="154" class="m c">30</text><rect x="560" y="164" width="94" height="30" rx="0" class="xW"/><text x="607" y="184" class="m c">2</text><rect x="654" y="164" width="94" height="30" rx="0" class="xW"/><text x="701" y="184" class="m c">Ana</text><rect x="748" y="164" width="94" height="30" rx="0" class="xW"/><text x="795" y="184" class="m c">25</text><rect x="380" y="110" width="140" height="90" rx="6" class="xP"/><text x="450" y="152" class="b c">JPA</text><text x="450" y="169" class="s c">Hibernate (ORM)</text><path d="M360,140L380,140" class="l" marker-end="url(#a)"/><path d="M520,140L540,140" class="l" marker-end="url(#a)"/><path d="M540,180L520,180" class="l" marker-end="url(#a)"/><path d="M380,180L360,180" class="l" marker-end="url(#a)"/><text x="450" y="230" class="m c" style="font-size:11.5px">em.persist(p) → INSERT</text><text x="450" y="248" class="m c" style="font-size:11.5px">em.find(...) ← SELECT</text><text x="450" y="286" class="n c">Você trabalha com objetos Java; o Hibernate gera o SQL e converte as linhas da tabela em objetos.</text></svg>