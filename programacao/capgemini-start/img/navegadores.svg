<svg xmlns="http://www.w3.org/2000/svg" width="480" height="562" viewBox="0 0 480 562"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Navegadores e seus motores</text><circle cx="90" cy="68" r="7" fill="#374151"/><text x="76" y="73" class="s b r">1990</text><rect x="112" y="52" width="348" height="44" rx="6" class="xB"/><text x="124" y="72" class="b">WorldWideWeb</text><text x="124" y="90" class="s">o primeiro, de Tim Berners-Lee</text><circle cx="90" cy="122" r="7" fill="#374151"/><text x="76" y="127" class="s b r">1993</text><rect x="112" y="106" width="348" height="28" rx="6" class="xG"/><text x="124" y="126" class="b">Mosaic</text><circle cx="90" cy="160" r="7" fill="#374151"/><text x="76" y="165" class="s b r">1994</text><rect x="112" y="144" width="348" height="28" rx="6" class="xO"/><text x="124" y="164" class="b">Netscape</text><circle cx="90" cy="198" r="7" fill="#374151"/><text x="76" y="203" class="s b r">1995</text><rect x="112" y="182" width="348" height="28" rx="6" class="xP"/><text x="124" y="202" class="b">Internet Explorer</text><circle cx="90" cy="236" r="7" fill="#374151"/><text x="76" y="241" class="s b r">1996</text><rect x="112" y="220" width="348" height="28" rx="6" class="xB"/><text x="124" y="240" class="b">Opera</text><circle cx="90" cy="274" r="7" fill="#374151"/><text x="76" y="279" class="s b r">2003</text><rect x="112" y="258" width="348" height="28" rx="6" class="xG"/><text x="124" y="278" class="b">Safari</text><circle cx="90" cy="312" r="7" fill="#374151"/><text x="76" y="317" class="s b r">2004</text><rect x="112" y="296" width="348" height="28" rx="6" class="xO"/><text x="124" y="316" class="b">Firefox</text><circle cx="90" cy="350" r="7" fill="#374151"/><text x="76" y="355" class="s b r">2008</text><rect x="112" y="334" width="348" height="28" rx="6" class="xP"/><text x="124" y="354" class="b">Chrome</text><circle cx="90" cy="388" r="7" fill="#374151"/><text x="76" y="393" class="s b r">2015</text><rect x="112" y="372" width="348" height="28" rx="6" class="xB"/><text x="124" y="392" class="b">Edge</text><path d="M90,68 L90,384" class="l"/><text x="240.0" y="424" class="b c">Motores em uso hoje</text><rect x="20" y="438" width="140" height="52" rx="6" class="xO"/><text x="90.0" y="460.5" class="b c">Gecko</text><text x="90.0" y="478.5" class="s c">Firefox</text><rect x="170" y="438" width="140" height="52" rx="6" class="xB"/><text x="240.0" y="460.5" class="b c">WebKit</text><text x="240.0" y="478.5" class="s c">Safari</text><rect x="320" y="438" width="140" height="52" rx="6" class="xG"/><text x="390.0" y="460.5" class="b c">Blink</text><text x="390.0" y="478.5" class="s c">Chrome, Edge, Opera</text><text x="240.0" y="520" class="n c">O Blink nasceu do WebKit em 2013; por isso</text><text x="240.0" y="538" class="n c">Chrome, Edge e Opera se parecem tanto.</text></svg>