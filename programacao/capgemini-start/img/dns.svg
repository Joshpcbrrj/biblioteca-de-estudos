<svg xmlns="http://www.w3.org/2000/svg" width="900" height="258" viewBox="0 0 900 258"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">DNS: traduzindo nome em endereço IP</text><rect x="20" y="60" width="170" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="105" y="92" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Navegador</text><text x="105" y="110" font-size="11.5" fill="#6B7280" text-anchor="middle">quero loja.com</text><rect x="250" y="60" width="170" height="70" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="335" y="92" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Resolvedor DNS</text><text x="335" y="110" font-size="11.5" fill="#6B7280" text-anchor="middle">provedor / 8.8.8.8</text><rect x="490" y="60" width="170" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="575" y="92" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Servidores DNS</text><text x="575" y="110" font-size="11.5" fill="#6B7280" text-anchor="middle">raiz → .com → loja.com</text><rect x="715" y="60" width="170" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="800" y="92" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Servidor da loja</text><text x="800" y="110" font-size="11.5" fill="#6B7280" text-anchor="middle">IP 203.0.113.10</text><line x1="192" y1="85" x2="248" y2="85" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="220" y="76" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">1</text><line x1="422" y1="85" x2="488" y2="85" stroke="#7C3AED" stroke-width="2" marker-end="url(#arp)"/><text x="455" y="76" font-size="12" font-weight="bold" fill="#7C3AED" text-anchor="middle">2</text><line x1="488" y1="108" x2="422" y2="108" stroke="#D97706" stroke-width="2" marker-end="url(#aro)"/><text x="455" y="124" font-size="12" font-weight="bold" fill="#D97706" text-anchor="middle">3: IP</text><line x1="248" y1="108" x2="192" y2="108" stroke="#7C3AED" stroke-width="2" marker-end="url(#arp)"/><text x="220" y="124" font-size="12" font-weight="bold" fill="#7C3AED" text-anchor="middle">4</text><path d="M105,132 C105,200 800,200 800,134" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="435" y="196" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="middle">5. agora sim, o request HTTP vai direto para o IP do servidor</text><text x="450" y="240" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">A resposta fica em cache pelo tempo do TTL; por isso uma mudança de DNS pode levar horas para &quot;propagar&quot;.</text></svg>