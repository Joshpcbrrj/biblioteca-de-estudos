<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">DNS: de nome para endereço IP</text><rect x="20" y="56" width="200" height="52" rx="6" class="xB"/><text x="120.0" y="78.5" class="b c">Navegador</text><text x="120.0" y="96.5" class="s c">quero loja.com</text><rect x="260" y="56" width="200" height="52" rx="6" class="xP"/><text x="360.0" y="78.5" class="b c">Resolvedor DNS</text><text x="360.0" y="96.5" class="s c">provedor ou 8.8.8.8</text><rect x="260" y="190" width="200" height="52" rx="6" class="xO"/><text x="360.0" y="212.5" class="b c">Servidores DNS</text><text x="360.0" y="230.5" class="s c">raiz → .com → loja.com</text><rect x="20" y="330" width="200" height="52" rx="6" class="xG"/><text x="120.0" y="352.5" class="b c">Servidor da loja</text><text x="120.0" y="370.5" class="s c">IP 203.0.113.10</text><path d="M220,74 L260,74" class="l" marker-end="url(#a)"/><text x="240" y="66" class="s b c">1</text><path d="M340,108 L340,190" class="l" marker-end="url(#a)"/><text x="330" y="154" class="s b r">2</text><path d="M400,190 L400,108" class="l" marker-end="url(#a)"/><text x="410" y="154" class="s b">3: IP</text><path d="M260,94 L220,94" class="l" marker-end="url(#a)"/><text x="240" y="112" class="s b c">4</text><path d="M120,108 L120,330" class="l" marker-end="url(#a)"/><text x="130" y="224" class="s b">5: request HTTP</text><text x="130" y="242" class="s">direto para o IP</text><text x="240.0" y="420" class="n c">A resposta fica em cache pelo tempo do TTL;</text><text x="240.0" y="438" class="n c">por isso uma mudança de DNS pode levar horas</text><text x="240.0" y="456" class="n c">para "propagar".</text></svg>