<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Operadores lógicos no código e no circuito</text><rect x="40" y="50" width="260" height="150" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="170" y="82" class="m" font-size="18" font-weight="bold" fill="#DC2626" text-anchor="middle">NÃO&#160; !</text><text x="170" y="114" font-size="12.5" fill="#1F2937" text-anchor="middle">inverte</text><text x="170" y="156" class="m" font-size="13" fill="#1F2937" text-anchor="middle">!true → false</text><rect x="320" y="50" width="260" height="150" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="450" y="82" class="m" font-size="18" font-weight="bold" fill="#2563EB" text-anchor="middle">E&#160; &amp;&amp;</text><text x="450" y="114" font-size="12.5" fill="#1F2937" text-anchor="middle">V só se todos forem V</text><text x="450" y="156" class="m" font-size="13" fill="#1F2937" text-anchor="middle">true &amp;&amp; false → false</text><rect x="600" y="50" width="260" height="150" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="730" y="82" class="m" font-size="18" font-weight="bold" fill="#16A34A" text-anchor="middle">OU&#160; ||</text><text x="730" y="114" font-size="12.5" fill="#1F2937" text-anchor="middle">V se ao menos um for V</text><text x="730" y="156" class="m" font-size="13" fill="#1F2937" text-anchor="middle">true || false → true</text><text x="450" y="232" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Os mesmos operadores existem como portas lógicas (NOT, AND, OR) nos circuitos do processador.</text></svg>