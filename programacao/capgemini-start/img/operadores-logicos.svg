<svg xmlns="http://www.w3.org/2000/svg" width="480" height="358" viewBox="0 0 480 358"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Operadores lógicos</text><rect x="20" y="50" width="440" height="70" rx="6" class="xP"/><text x="36" y="76" class="m b" style="font-size:16px">NÃO  !</text><text x="160" y="76" class="s">inverte o valor</text><text x="36" y="104" class="m">!true → false</text><rect x="20" y="132" width="440" height="70" rx="6" class="xB"/><text x="36" y="158" class="m b" style="font-size:16px">E  &amp;&amp;</text><text x="160" y="158" class="s">V só se todos forem V</text><text x="36" y="186" class="m">true &amp;&amp; false → false</text><rect x="20" y="214" width="440" height="70" rx="6" class="xG"/><text x="36" y="240" class="m b" style="font-size:16px">OU  ||</text><text x="160" y="240" class="s">V se ao menos um for V</text><text x="36" y="268" class="m">true || false → true</text><text x="240.0" y="316" class="n c">Os mesmos operadores existem como portas lógicas</text><text x="240.0" y="334" class="n c">(NOT, AND, OR) nos circuitos do processador.</text></svg>