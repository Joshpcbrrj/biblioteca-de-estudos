<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.l{stroke:#6B7280;stroke-width:1.8;fill:none}</style><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Estrutura de um projeto Angular (ng new, versão 17 ou mais nova)</text><text x="60" y="58" class="m b">📁 meu-projeto/</text><text x="88" y="82" class="m b">📁 src/</text><text x="470" y="82" class="s">código da aplicação</text><path d="M74,68V78H84" class="l"/><text x="116" y="106" class="m b">📁 app/</text><text x="470" y="106" class="s">componentes, serviços, rotas</text><path d="M102,92V102H112" class="l"/><text x="144" y="130" class="m">📄 app.component.ts</text><text x="470" y="130" class="s">componente raiz (lógica)</text><path d="M130,116V126H140" class="l"/><text x="144" y="154" class="m">📄 app.component.html</text><text x="470" y="154" class="s">template do componente raiz</text><path d="M130,140V150H140" class="l"/><text x="144" y="178" class="m">📄 app.config.ts</text><text x="470" y="178" class="s">configuração (providers)</text><path d="M130,164V174H140" class="l"/><text x="144" y="202" class="m">📄 app.routes.ts</text><text x="470" y="202" class="s">rotas</text><path d="M130,188V198H140" class="l"/><text x="116" y="226" class="m">📄 index.html</text><text x="470" y="226" class="s">a única página HTML (SPA)</text><path d="M102,212V222H112" class="l"/><text x="116" y="250" class="m">📄 main.ts</text><text x="470" y="250" class="s">ponto de entrada: inicia o app</text><path d="M102,236V246H112" class="l"/><text x="116" y="274" class="m">📄 styles.css</text><text x="470" y="274" class="s">estilos globais</text><path d="M102,260V270H112" class="l"/><text x="88" y="298" class="m b">📁 public/</text><text x="470" y="298" class="s">imagens e arquivos estáticos (antes: src/assets)</text><path d="M74,284V294H84" class="l"/><text x="88" y="322" class="m">📄 angular.json</text><text x="470" y="322" class="s">configuração do projeto e do build</text><path d="M74,308V318H84" class="l"/><text x="88" y="346" class="m">📄 package.json</text><text x="470" y="346" class="s">dependências e scripts (npm start)</text><path d="M74,332V342H84" class="l"/><text x="88" y="370" class="m">📄 tsconfig.json</text><text x="470" y="370" class="s">configuração do TypeScript</text><path d="M74,356V366H84" class="l"/><text x="450" y="406" class="n c">Projetos antigos (até a versão 16) têm também app.module.ts e app-routing.module.ts.</text></svg>