<svg xmlns="http://www.w3.org/2000/svg" width="900" height="256" viewBox="0 0 900 256"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Roteiro para resolver um problema</text><rect x="20" y="60" width="160" height="76" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="100" y="95" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Entender</text><text x="100" y="113" font-size="11.5" fill="#6B7280" text-anchor="middle">o que se pede?</text><line x1="182" y1="98" x2="194" y2="98" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="196" y="60" width="160" height="76" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="276" y="103" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Identificar</text><text x="276" y="156" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">entradas · processamento · saídas</text><line x1="358" y1="98" x2="370" y2="98" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="372" y="60" width="160" height="76" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="452" y="95" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Planejar</text><text x="452" y="113" font-size="11.5" fill="#6B7280" text-anchor="middle">passos em ordem</text><line x1="534" y1="98" x2="546" y2="98" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="548" y="60" width="160" height="76" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="628" y="103" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Testar</text><text x="628" y="156" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">teste de mesa com exemplos</text><line x1="710" y1="98" x2="722" y2="98" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="724" y="60" width="160" height="76" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="804" y="95" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Refinar</text><text x="804" y="113" font-size="11.5" fill="#6B7280" text-anchor="middle">corrigir e simplificar</text><path d="M626,170 C626,226 276,226 276,172" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="451" y="238" font-size="11.5" font-style="italic" fill="#DC2626" text-anchor="middle">achou erro no teste? volte e ajuste</text></svg>