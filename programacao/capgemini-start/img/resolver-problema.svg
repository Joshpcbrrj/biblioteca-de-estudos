<svg xmlns="http://www.w3.org/2000/svg" width="480" height="404" viewBox="0 0 480 404"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Roteiro para resolver um problema</text><rect x="90" y="48" width="300" height="50" rx="6" class="xB"/><text x="240.0" y="69.5" class="b c">1. Entender</text><text x="240.0" y="87.5" class="s c">o que se pede?</text><path d="M240.0,98 L240.0,120" class="l" marker-end="url(#a)"/><rect x="90" y="120" width="300" height="50" rx="6" class="xP"/><text x="240.0" y="141.5" class="b c">2. Identificar</text><text x="240.0" y="159.5" class="s c">entradas · processamento · saídas</text><path d="M240.0,170 L240.0,192" class="l" marker-end="url(#a)"/><rect x="90" y="192" width="300" height="50" rx="6" class="xO"/><text x="240.0" y="213.5" class="b c">3. Planejar</text><text x="240.0" y="231.5" class="s c">passos em ordem</text><path d="M240.0,242 L240.0,264" class="l" marker-end="url(#a)"/><rect x="90" y="264" width="300" height="50" rx="6" class="xG"/><text x="240.0" y="285.5" class="b c">4. Testar</text><text x="240.0" y="303.5" class="s c">teste de mesa com exemplos</text><path d="M240.0,314 L240.0,336" class="l" marker-end="url(#a)"/><rect x="90" y="336" width="300" height="50" rx="6" class="xT"/><text x="240.0" y="357.5" class="b c">5. Refinar</text><text x="240.0" y="375.5" class="s c">corrigir e simplificar</text><path d="M390,289 L412,289 L412,217 L392,217" class="l" marker-end="url(#a)"/><text x="420" y="244" class="s b">achou</text><text x="420" y="260" class="s b">erro?</text><text x="420" y="276" class="s b">volte</text></svg>