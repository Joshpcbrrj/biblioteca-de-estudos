<svg xmlns="http://www.w3.org/2000/svg" width="900" height="336" viewBox="0 0 900 336"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Hierarquia de memória: velocidade × capacidade</text><rect x="350" y="44" width="200" height="44" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="450" y="64" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Registradores</text><text x="450" y="80" font-size="11" fill="#6B7280" text-anchor="middle">dentro da CPU</text><rect x="295" y="94" width="310" height="44" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="450" y="114" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Cache</text><text x="450" y="130" font-size="11" fill="#6B7280" text-anchor="middle">L1 · L2 · L3</text><rect x="240" y="144" width="420" height="44" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="450" y="164" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">RAM</text><text x="450" y="180" font-size="11" fill="#6B7280" text-anchor="middle">GB · volátil</text><rect x="185" y="194" width="530" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="450" y="214" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">SSD</text><text x="450" y="230" font-size="11" fill="#6B7280" text-anchor="middle">centenas de GB a TB</text><rect x="130" y="244" width="640" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="450" y="264" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">HD</text><text x="450" y="280" font-size="11" fill="#6B7280" text-anchor="middle">TB · mecânico</text><line x1="90" y1="290" x2="90" y2="50" stroke="#DC2626" stroke-width="2" marker-end="url(#arr)"/><text x="80" y="170" font-size="12" font-weight="bold" fill="#DC2626" text-anchor="end">mais rápida</text><line x1="810" y1="50" x2="810" y2="290" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="820" y="170" font-size="12" font-weight="bold" fill="#2563EB">maior e</text><text x="820" y="186" font-size="12" font-weight="bold" fill="#2563EB">mais barata</text><text x="450" y="318" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">ROM/firmware fica à parte: guarda o programa que liga o computador e não se apaga.</text></svg>