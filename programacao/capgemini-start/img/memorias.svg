<svg xmlns="http://www.w3.org/2000/svg" width="480" height="388" viewBox="0 0 480 388"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Hierarquia de memória</text><rect x="150.0" y="50" width="180" height="48" rx="6" class="xR"/><text x="240.0" y="70.5" class="b c">Registradores</text><text x="240.0" y="88.5" class="s c">dentro da CPU</text><rect x="125.0" y="106" width="230" height="48" rx="6" class="xO"/><text x="240.0" y="126.5" class="b c">Cache</text><text x="240.0" y="144.5" class="s c">L1 · L2 · L3</text><rect x="100.0" y="162" width="280" height="48" rx="6" class="xG"/><text x="240.0" y="182.5" class="b c">RAM</text><text x="240.0" y="200.5" class="s c">GB · volátil</text><rect x="75.0" y="218" width="330" height="48" rx="6" class="xB"/><text x="240.0" y="238.5" class="b c">SSD</text><text x="240.0" y="256.5" class="s c">centenas de GB a TB</text><rect x="50.0" y="274" width="380" height="48" rx="6" class="xP"/><text x="240.0" y="294.5" class="b c">HD</text><text x="240.0" y="312.5" class="s c">TB · mecânico</text><path d="M30,310 L30,56" class="l" marker-end="url(#a)"/><path d="M450,56 L450,310" class="l" marker-end="url(#a)"/><text x="22" y="190.0" class="s c b" transform="rotate(-90 22 190.0)">mais rápida</text><text x="462" y="190.0" class="s c b" transform="rotate(90 462 190.0)">maior e mais barata</text><text x="240.0" y="346" class="n c">ROM/firmware fica à parte: guarda o programa</text><text x="240.0" y="364" class="n c">que liga o computador e não se apaga.</text></svg>