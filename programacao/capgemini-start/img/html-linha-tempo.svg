="s">criado por Tim Berners-Lee</text><circle cx="90" cy="122" r="7" fill="#374151"/><text x="76" y="127" class="s b r">1994</text><rect x="114.0" y="109.0" width="348" height="28" rx="8" class="sh"/><rect x="112" y="106" width="348" height="28" rx="8" class="xG"/><text x="124" y="126" class="b">W3C é fundado</text><circle cx="90" cy="160" r="7" fill="#374151"/><text x="76" y="165" class="s b r">1995</text><rect x="114.0" y="147.0" width="348" height="28" rx="8" class="sh"/><rect x="112" y="144" width="348" height="28" rx="8" class="xO"/><text x="124" y="164" class="b">HTML 2.0</text><circle cx="90" cy="198" r="7" fill="#374151"/><text x="76" y="203" class="s b r">1997</text><rect x="114.0" y="185.0" width="348" height="28" rx="8" class="sh"/><rect x="112" y="182" width="348" height="28" rx="8" class="xP"/><text x="124" y="202" class="b">HTML 3.2 e HTML 4.0</text><circle cx="90" cy="236" r="7" fill="#374151"/><text x="76" y="241" class="s b r">2000</text><rect x="114.0" y="223.0" width="348" height="28" rx="8" class="sh"/><rect x="112" y="220" width="348" height="28" rx="8" class="xB"/><text x="124" y="240" class="b">XHTML 1.0</text><circle cx="90" cy="274" r="7" fill="#374151"/><text x="76" y="279" class="s b r">2004</text><rect x="114.0" y="261.0" width="348" height="28" rx="8" class="sh"/><rect x="112" y="258" width="348" height="28" rx="8" class="xG"/><text x="124" y="278" class="b">WHATWG é criado</text><circle cx="90" cy="312" r="7" fill="#374151"/><text x="76" y="317" class="s b r">2014</text><rect x="114.0" y="299.0" width="348" height="28" rx="8" class="sh"/><rect x="112" y="296" width="348" height="28" rx="8" class="xO"/><text x="124" y="316" class="b">HTML5 (W3C)</text><circle cx="90" cy="350" r="7" fill="#374151"/><text x="76" y="355" class="s b r">2019</text><rect x="114.0" y="337.0" width="348" height="44" rx="8" class="sh"/><rect x="112" y="334" width="348" height="44" rx="8" class="xP"/><text x="124" y="354" class="b">HTML Living Standard</text><text x="124" y="372" class="s">atualizado continuamente pelo WHATWG</text><path d="M90,68 L90,362" class="l"/><text x="240.0" y="400" class="n c">Desde 2019 o HTML é um "padrão vivo".</text></svg>