<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Os quatro pilares da orientação a objetos</text><rect x="20" y="50" width="204" height="130" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="122" y="82" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">Abstração</text><text x="122" y="112" font-size="11.5" fill="#1F2937" text-anchor="middle">modelar só o essencial</text><text x="122" y="160" class="m" font-size="10.5" fill="#6B7280" text-anchor="middle">Pessoa: nome, peso, altura</text><rect x="238" y="50" width="204" height="130" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="340" y="82" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">Encapsulamento</text><text x="340" y="112" font-size="11.5" fill="#1F2937" text-anchor="middle">esconder o estado interno</text><text x="340" y="160" class="m" font-size="10.5" fill="#6B7280" text-anchor="middle">private + getters/setters</text><rect x="456" y="50" width="204" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="558" y="82" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="middle">Herança</text><text x="558" y="112" font-size="11.5" fill="#1F2937" text-anchor="middle">reaproveitar e especializar</text><text x="558" y="160" class="m" font-size="10.5" fill="#6B7280" text-anchor="middle">Vendedor extends Funcionario</text><rect x="674" y="50" width="204" height="130" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="776" y="82" font-size="15" font-weight="bold" fill="#D97706" text-anchor="middle">Polimorfismo</text><text x="776" y="112" font-size="11.5" fill="#1F2937" text-anchor="middle">mesma chamada, outro comportamento</text><text x="776" y="160" class="m" font-size="10.5" fill="#6B7280" text-anchor="middle">calculaSalario() varia</text></svg>