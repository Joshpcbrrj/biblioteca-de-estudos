arquivos estáticos</text><rect x="680" y="60" width="190" height="50" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="775" y="90" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">app (Node/Java) #1</text><line x1="520" y1="155" x2="680" y2="85" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><rect x="680" y="130" width="190" height="50" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="775" y="160" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">app (Node/Java) #2</text><line x1="520" y1="155" x2="680" y2="155" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><rect x="680" y="200" width="190" height="50" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="775" y="230" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">app (Node/Java) #3</text><line x1="520" y1="155" x2="680" y2="225" stroke="#16A34A" stroke-width="2" marker-end="url(#arv)"/><text x="600" y="290" font-size="12" font-weight="bold" fill="#16A34A" text-anchor="middle">divide os pedidos entre as instâncias</text><text x="450" y="320" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">O cliente só enxerga o Nginx; as aplicações ficam protegidas atrás dele e podem ser multiplicadas para escalar.</text></svg>