<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xY{fill:#F3F4F6;stroke:#9CA3AF}rect{stroke-width:1.8}</style><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Box model: toda caixa tem conteúdo, padding, borda e margem</text><rect x="170" y="50" width="560" height="300" rx="6" class="xO"/><text x="186" y="72" class="b">margin (externo, transparente)</text><rect x="230" y="90" width="440" height="220" rx="6" class="xY" style="stroke:#1F2937;stroke-width:6"/><text x="246" y="114" class="b">border</text><rect x="250" y="124" width="400" height="166" rx="6" class="xG"/><text x="266" y="146" class="b">padding (interno, com a cor de fundo)</text><rect x="320" y="170" width="260" height="80" rx="6" class="xB"/><text x="450" y="206" class="b c">conteúdo</text><text x="450" y="226" class="m c">width × height</text><text x="450" y="388" class="b c">box-sizing: border-box → o width passa a incluir padding e borda (o mais previsível)</text></svg>