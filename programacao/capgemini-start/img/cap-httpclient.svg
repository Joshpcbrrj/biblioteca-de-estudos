<svg xmlns="http://www.w3.org/2000/svg" width="480" height="448" viewBox="0 0 480 448"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">HttpClient: nada acontece sem subscribe</text><rect x="60" y="56" width="360" height="52" rx="6" class="xB"/><text x="240.0" y="78.5" class="b c">Componente</text><text x="240.0" y="96.5" class="m c">service.listar()</text><rect x="60" y="124" width="360" height="52" rx="6" class="xP"/><text x="240.0" y="146.5" class="m b c">ProdutoService</text><text x="240.0" y="164.5" class="m c">http.get&lt;Produto[]&gt;(url)</text><path d="M240,108 L240,124" class="l" marker-end="url(#a)"/><rect x="60" y="192" width="360" height="52" rx="6" class="xY"/><text x="240.0" y="214.5" class="b c">Observable</text><text x="240.0" y="232.5" class="m c">pronto, mas parado</text><path d="M240,176 L240,192" class="l" marker-end="url(#a)"/><rect x="60" y="260" width="360" height="52" rx="6" class="xO"/><text x="240.0" y="282.5" class="m b c">.subscribe({ next })</text><text x="240.0" y="300.5" class="m c">agora a requisição sai</text><path d="M240,244 L240,260" class="l" marker-end="url(#a)"/><rect x="60" y="328" width="360" height="52" rx="6" class="xG"/><text x="240.0" y="350.5" class="b c">API REST</text><text x="240.0" y="368.5" class="m c">GET /produtos → JSON</text><path d="M240,312 L240,328" class="l" marker-end="url(#a)"/><text x="20" y="404" class="s">Promise: começa na hora, uma resposta.</text><text x="20" y="424" class="s">Observable: começa no subscribe e pode ser cancelado.</text></svg>