<svg xmlns="http://www.w3.org/2000/svg" width="900" height="272" viewBox="0 0 900 272"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xW{fill:#fff;stroke:#9CA3AF}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.kB{fill:#2563EB}.kG{fill:#16A34A}.kO{fill:#D97706}</style><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Como a página aparece no Google</text><rect x="40" y="50" width="640" height="150" rx="10" class="xW"/><text x="70" y="82" class="s">https://www.minhaloja.com.br › camisas › polo-azul</text><text x="70" y="108" class="b" style="font-size:19px;fill:#1A0DAB">Camisa Polo Masculina Azul | Minha Loja</text><text x="70" y="136">Camisa polo 100% algodão com frete grátis para todo o Brasil. Escolha seu tamanho</text><text x="70" y="156">e receba em até 3 dias. Troca grátis em 30 dias.</text><path d="M680,82L720,82" class="l"/><text x="728" y="86" class="b kG">URL amigável</text><path d="M680,106L720,118" class="l"/><text x="728" y="122" class="m b kB">&lt;title&gt;</text><path d="M680,146L720,158" class="l"/><text x="728" y="162" class="b kO">meta description</text><text x="450" y="230" class="c">title: até ~60 caracteres · description: até ~155 caracteres; o que passa disso é cortado</text><text x="450" y="258" class="n c">O Google pode reescrever o título e a descrição se achar que não representam bem a página.</text></svg>