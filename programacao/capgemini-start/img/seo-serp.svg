<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Como a página aparece no Google</text><rect x="20" y="48" width="440" height="140" rx="6" class="xW"/><text x="34" y="74" class="s" style="fill:#166534">minhaloja.com.br › camisas › polo-azul</text><text x="34" y="102" class="b" style="fill:#1D4ED8;font-size:15px">Camisa Polo Masculina Azul | Minha Loja</text><text x="34" y="128" class="s">Camisa polo 100% algodão com frete grátis</text><text x="34" y="146" class="s">para todo o Brasil. Escolha seu tamanho e</text><text x="34" y="164" class="s">receba em até 3 dias. Troca grátis em 30 dias.</text><rect x="20" y="208" width="440" height="44" rx="6" class="xG"/><text x="34" y="235" class="m b">URL amigável</text><text x="200" y="235" class="s">o endereço legível (1ª linha)</text><rect x="20" y="260" width="440" height="44" rx="6" class="xB"/><text x="34" y="287" class="m b">&lt;title&gt;</text><text x="200" y="287" class="s">o título azul · até ~60 caracteres</text><rect x="20" y="312" width="440" height="44" rx="6" class="xO"/><text x="34" y="339" class="m b">meta description</text><text x="200" y="339" class="s">o resumo · até ~155 caracteres</text><text x="240.0" y="380" class="n c">O que passa do limite é cortado. O Google pode</text><text x="240.0" y="398" class="n c">reescrever título e descrição se não representarem</text><text x="240.0" y="416" class="n c">bem a página.</text></svg>