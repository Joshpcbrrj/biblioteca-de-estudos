;font-size:15px">Camisa Polo Masculina Azul | Minha Loja</text><text x="34" y="128" class="s">Camisa polo 100% algodão com frete grátis</text><text x="34" y="146" class="s">para todo o Brasil. Escolha seu tamanho e</text><text x="34" y="164" class="s">receba em até 3 dias. Troca grátis em 30 dias.</text><rect x="22.0" y="211.0" width="440" height="44" rx="8" class="sh"/><rect x="20" y="208" width="440" height="44" rx="8" class="xG"/><text x="34" y="235" class="m b">URL amigável</text><text x="200" y="235" class="s">o endereço legível (1ª linha)</text><rect x="22.0" y="263.0" width="440" height="44" rx="8" class="sh"/><rect x="20" y="260" width="440" height="44" rx="8" class="xB"/><text x="34" y="287" class="m b">&lt;title&gt;</text><text x="200" y="287" class="s">o título azul · até ~60 caracteres</text><rect x="22.0" y="315.0" width="440" height="44" rx="8" class="sh"/><rect x="20" y="312" width="440" height="44" rx="8" class="xO"/><text x="34" y="339" class="m b">meta description</text><text x="200" y="339" class="s">o resumo · até ~155 caracteres</text><text x="240.0" y="380" class="n c">O que passa do limite é cortado. O Google pode</text><text x="240.0" y="398" class="n c">reescrever título e descrição se não representarem</text><text x="240.0" y="416" class="n c">bem a página.</text></svg>