<svg xmlns="http://www.w3.org/2000/svg" width="900" height="286" viewBox="0 0 900 286"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.e{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.kB{fill:#2563EB}.kG{fill:#16A34A}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Flexbox: um eixo principal e um eixo cruzado</text><rect x="40" y="50" width="380" height="130" rx="6" class="xY"/><text x="56" y="70" class="m">display: flex (flex-direction: row)</text><rect x="60" y="90" width="80" height="70" rx="6" class="xB"/><text x="100" y="130" class="b c">1</text><rect x="150" y="90" width="80" height="70" rx="6" class="xB"/><text x="190" y="130" class="b c">2</text><rect x="240" y="90" width="80" height="70" rx="6" class="xB"/><text x="280" y="130" class="b c">3</text><path d="M60,172L400,172" class="l" marker-end="url(#a)"/><text x="230" y="198" class="b c kB">eixo principal → justify-content</text><path d="M350,90L350,160" class="l" marker-end="url(#a)"/><text x="362" y="120" class="b kG">eixo</text><text x="362" y="136" class="b kG">cruzado</text><text x="240" y="222" class="b c kG">align-items alinha no eixo cruzado</text><rect x="560" y="50" width="310" height="30" rx="6" class="xW"/><text x="552" y="70" class="m e" style="font-size:11.5px">flex-start</text><rect x="564" y="54" width="40" height="22" rx="4" class="xB"/><rect x="608" y="54" width="40" height="22" rx="4" class="xB"/><rect x="652" y="54" width="40" height="22" rx="4" class="xB"/><rect x="560" y="86" width="310" height="30" rx="6" class="xW"/><text x="552" y="106" class="m e" style="font-size:11.5px">center</text><rect x="649" y="90" width="40" height="22" rx="4" class="xB"/><rect x="695" y="90" width="40" height="22" rx="4" class="xB"/><rect x="741" y="90" width="40" height="22" rx="4" class="xB"/><rect x="560" y="122" width="310" height="30" rx="6" class="xW"/><text x="552" y="142" class="m e" style="font-size:11.5px">space-between</text><rect x="564" y="126" width="40" height="22" rx="4" class="xB"/><rect x="695" y="126" width="40" height="22" rx="4" class="xB"/><rect x="826" y="126" width="40" height="22" rx="4" class="xB"/><rect x="560" y="158" width="310" height="30" rx="6" class="xW"/><text x="552" y="178" class="m e" style="font-size:11.5px">space-around</text><rect x="591.667" y="162" width="40" height="22" rx="4" class="xB"/><rect x="695" y="162" width="40" height="22" rx="4" class="xB"/><rect x="798.333" y="162" width="40" height="22" rx="4" class="xB"/><rect x="560" y="194" width="310" height="30" rx="6" class="xW"/><text x="552" y="214" class="m e" style="font-size:11.5px">space-evenly</text><rect x="607.5" y="198" width="40" height="22" rx="4" class="xB"/><rect x="695" y="198" width="40" height="22" rx="4" class="xB"/><rect x="782.5" y="198" width="40" height="22" rx="4" class="xB"/><text x="715" y="250" class="s c">justify-content: distribuição no eixo principal</text><text x="450" y="272" class="n c">Com flex-direction: column os eixos trocam: o principal passa a ser vertical.</text></svg>