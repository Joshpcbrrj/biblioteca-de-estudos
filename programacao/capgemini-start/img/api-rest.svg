<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.u{font-family:Menlo,Consolas,monospace;font-size:11px}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">API REST: o front pede, a API acessa o banco e devolve JSON</text><rect x="30" y="90" width="170" height="70" rx="6" class="xB"/><text x="115" y="122" class="b c">Front-end</text><text x="115" y="139" class="s c">Angular · navegador · app</text><rect x="360" y="90" width="180" height="70" rx="6" class="xP"/><text x="450" y="122" class="b c">API REST</text><text x="450" y="139" class="s c">Java (Spring) · Node · C#</text><rect x="700" y="90" width="170" height="70" rx="6" class="xO"/><text x="785" y="122" class="b c">Banco de dados</text><text x="785" y="139" class="s c">MySQL · PostgreSQL</text><path d="M200,112L360,112" class="l" marker-end="url(#a)"/><text x="280" y="104" class="m c">GET /produtos/1</text><path d="M360,140L200,140" class="l" marker-end="url(#a)"/><text x="280" y="162" class="m c">200 OK + JSON</text><path d="M540,125L700,125" class="l" marker-end="url(#a)"/><text x="620" y="116" class="m c">SQL</text><rect x="40" y="200" width="130" height="64" rx="6" class="xB"/><text x="105" y="222" class="m b c">GET</text><text x="105" y="240" class="u c">/produtos</text><text x="105" y="256" class="s c">listar</text><rect x="180" y="200" width="130" height="64" rx="6" class="xB"/><text x="245" y="222" class="m b c">GET</text><text x="245" y="240" class="u c">/produtos/1</text><text x="245" y="256" class="s c">buscar um</text><rect x="320" y="200" width="130" height="64" rx="6" class="xG"/><text x="385" y="222" class="m b c">POST</text><text x="385" y="240" class="u c">/produtos</text><text x="385" y="256" class="s c">criar</text><rect x="460" y="200" width="130" height="64" rx="6" class="xO"/><text x="525" y="222" class="m b c">PUT</text><text x="525" y="240" class="u c">/produtos/1</text><text x="525" y="256" class="s c">substituir</text><rect x="600" y="200" width="130" height="64" rx="6" class="xO"/><text x="665" y="222" class="m b c">PATCH</text><text x="665" y="240" class="u c">/produtos/1</text><text x="665" y="256" class="s c">alterar parte</text><rect x="740" y="200" width="130" height="64" rx="6" class="xR"/><text x="805" y="222" class="m b c">DELETE</text><text x="805" y="240" class="u c">/produtos/1</text><text x="805" y="256" class="s c">excluir</text><text x="450" y="296" class="n c">Cada recurso tem uma URL; o método HTTP diz o que fazer com ele.</text></svg>