<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Do seu computador ao GitHub</text><rect x="20" y="50" width="250" height="56" rx="6" class="xY"/><text x="145.0" y="74.5" class="b c">Pasta de trabalho</text><text x="145.0" y="92.5" class="s c">arquivos que você edita</text><path d="M145,106 L145,150" class="l" marker-end="url(#a)"/><text x="155" y="134" class="m b">git add</text><rect x="20" y="150" width="250" height="56" rx="6" class="xO"/><text x="145.0" y="174.5" class="b c">Staging</text><text x="145.0" y="192.5" class="s c">o que vai no próximo commit</text><path d="M145,206 L145,250" class="l" marker-end="url(#a)"/><text x="155" y="234" class="m b">git commit</text><rect x="20" y="250" width="250" height="56" rx="6" class="xB"/><text x="145.0" y="274.5" class="b c">Repositório local</text><text x="145.0" y="292.5" class="s c">histórico na sua máquina</text><path d="M145,306 L145,350" class="l" marker-end="url(#a)"/><text x="155" y="334" class="m b">git push</text><rect x="20" y="350" width="250" height="56" rx="6" class="xG"/><text x="145.0" y="374.5" class="b c">Repositório remoto</text><text x="145.0" y="392.5" class="s c">GitHub (origin)</text><path d="M270,378 L330,378 L330,262 L272,262" class="l" marker-end="url(#a)"/><text x="338" y="360" class="m b">git fetch</text><text x="338" y="300" class="s">atualiza só o</text><text x="338" y="318" class="s">histórico local</text><path d="M270,390 L420,390 L420,78 L272,78" class="l" marker-end="url(#a)"/><text x="428" y="200" class="m b">git</text><text x="428" y="218" class="m b">pull</text><text x="428" y="240" class="s">fetch</text><text x="428" y="258" class="s">+ merge</text><text x="240.0" y="458" class="n c">git clone URL: copia o remoto inteiro e já</text><text x="240.0" y="476" class="n c">cria a pasta, o histórico e o origin.</text></svg>