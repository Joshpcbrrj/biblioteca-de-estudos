<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xY{fill:#F3F4F6;stroke:#9CA3AF}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Pipeline de uma Stream: fonte → operações intermediárias → operação terminal</text><rect x="30" y="70" width="150" height="70" rx="6" class="xY"/><text x="105" y="102" class="b c">Fonte</text><text x="105" y="119" class="s c">lista.stream()</text><rect x="230" y="70" width="150" height="70" rx="6" class="xP"/><text x="305" y="102" class="m b c">filter</text><text x="305" y="119" class="s c">mantém quem passa</text><rect x="410" y="70" width="150" height="70" rx="6" class="xB"/><text x="485" y="102" class="m b c">map</text><text x="485" y="119" class="s c">transforma cada item</text><rect x="590" y="70" width="150" height="70" rx="6" class="xG"/><text x="665" y="102" class="m b c">sorted</text><text x="665" y="119" class="s c">ordena</text><rect x="770" y="70" width="110" height="70" rx="6" class="xO"/><text x="825" y="102" class="m b c">collect</text><text x="825" y="119" class="s c">toList(), sum...</text><path d="M180,105L230,105" class="l" marker-end="url(#a)"/><path d="M380,105L410,105" class="l" marker-end="url(#a)"/><path d="M560,105L590,105" class="l" marker-end="url(#a)"/><path d="M740,105L770,105" class="l" marker-end="url(#a)"/><text x="455" y="170" class="s c">operações intermediárias (preguiçosas: só rodam quando há uma terminal)</text><path d="M230,155H740" class="l"/><text x="825" y="170" class="s c">terminal</text><text x="80" y="210" class="m" style="font-size:12px;white-space:pre">[&quot;Ana&quot;, &quot;bruno&quot;, &quot;Carla&quot;, &quot;alice&quot;]</text><text x="80" y="232" class="m" style="font-size:12px;white-space:pre">→ filter(n -&gt; n.length() &gt; 3)  → [&quot;bruno&quot;, &quot;Carla&quot;, &quot;alice&quot;]</text><text x="80" y="254" class="m" style="font-size:12px;white-space:pre">→ map(String::toUpperCase)    → [&quot;BRUNO&quot;, &quot;CARLA&quot;, &quot;ALICE&quot;]</text><text x="80" y="276" class="m" style="font-size:12px;white-space:pre">→ sorted() → toList()          → [&quot;ALICE&quot;, &quot;BRUNO&quot;, &quot;CARLA&quot;]</text><text x="450" y="306" class="n c">A lista original não é alterada: a stream produz um resultado novo.</text></svg>