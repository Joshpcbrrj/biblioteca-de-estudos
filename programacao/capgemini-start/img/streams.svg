"auto-start-reverse"><path d="M1,1L9,5L1,9" fill="none" stroke="#7A7F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="240.0" y="30" class="t c">Pipeline de uma Stream</text><rect x="200.0" y="38" width="80" height="4" rx="2" fill="url(#gT0)"/><rect x="112.0" y="51.0" width="260" height="44" rx="12" class="sh"/><rect x="110" y="48" width="260" height="44" rx="12" class="xY"/><text x="240.0" y="66.5" class="m b c">Fonte</text><text x="240.0" y="84.5" class="s c">lista.stream()</text><path d="M240,92 L240,108" class="l" marker-end="url(#a)"/><rect x="112.0" y="111.0" width="260" height="44" rx="12" class="sh"/><rect x="110" y="108" width="260" height="44" rx="12" class="xB"/><text x="240.0" y="126.5" class="m b c">filter</text><text x="240.0" y="144.5" class="s c">mantém quem passa</text><path d="M240,152 L240,168" class="l" marker-end="url(#a)"/><rect x="112.0" y="171.0" width="260" height="44" rx="12" class="sh"/><rect x="110" y="168" width="260" height="44" rx="12" class="xB"/><text x="240.0" y="186.5" class="m b c">map</text><text x="240.0" y="204.5" class="s c">transforma cada item</text><path d="M240,212 L240,228" class="l" marker-end="url(#a)"/><rect x="112.0" y="231.0" width="260" height="44" rx="12" class="sh"/><rect x="110" y="228" width="260" height="44" rx="12" class="xB"/><text x="240.0" y="246.5" class="m b c">sorted</text><text x="240.0" y="264.5" class="s c">ordena</text><path d="M240,272 L240,288" class="l" marker-end="url(#a)"/><rect x="112.0" y="291.0" width="260" height="44" rx="12" class="sh"/><rect x="110" y="288" width="260" height="44" rx="12" class="xG"/><text x="240.0" y="306.5" class="m b c">toList / sum</text><text x="240.0" y="324.5" class="s c">operação terminal</text><path d="M384,108 L396,108 L396,272 L384,272" class="l"/><text x="404" y="180" class="s">inter-</text><text x="404" y="196" class="s">mediárias</text><text x="30" y="356" class="m">["Ana", "bruno", "Carla", "alice"]</text><text x="30" y="380" class="m">filter(n -&gt; n.length() &gt; 3)</text><text x="30" y="399" class="m">  → ["bruno", "Carla", "alice"]</text><text x="30" y="418" class="m">map(String::toUpperCase)</text><text x="30" y="437" class="m">  → ["BRUNO", "CARLA", "ALICE"]</text><text x="30" y="456" class="m">sorted().toList()</text><text x="30" y="475" class="m">  → ["ALICE", "BRUNO", "CARLA"]</text><text x="240.0" y="508" class="n c">Intermediárias são preguiçosas: só rodam quando</text><text x="240.0" y="526" class="n c">há uma terminal. A lista original não muda.</text></svg>