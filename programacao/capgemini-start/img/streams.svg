<svg xmlns="http://www.w3.org/2000/svg" width="480" height="550" viewBox="0 0 480 550"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Pipeline de uma Stream</text><rect x="110" y="48" width="260" height="44" rx="6" class="xY"/><text x="240.0" y="66.5" class="m b c">Fonte</text><text x="240.0" y="84.5" class="s c">lista.stream()</text><path d="M240,92 L240,108" class="l" marker-end="url(#a)"/><rect x="110" y="108" width="260" height="44" rx="6" class="xB"/><text x="240.0" y="126.5" class="m b c">filter</text><text x="240.0" y="144.5" class="s c">mantém quem passa</text><path d="M240,152 L240,168" class="l" marker-end="url(#a)"/><rect x="110" y="168" width="260" height="44" rx="6" class="xB"/><text x="240.0" y="186.5" class="m b c">map</text><text x="240.0" y="204.5" class="s c">transforma cada item</text><path d="M240,212 L240,228" class="l" marker-end="url(#a)"/><rect x="110" y="228" width="260" height="44" rx="6" class="xB"/><text x="240.0" y="246.5" class="m b c">sorted</text><text x="240.0" y="264.5" class="s c">ordena</text><path d="M240,272 L240,288" class="l" marker-end="url(#a)"/><rect x="110" y="288" width="260" height="44" rx="6" class="xG"/><text x="240.0" y="306.5" class="m b c">toList / sum</text><text x="240.0" y="324.5" class="s c">operação terminal</text><path d="M384,108 L396,108 L396,272 L384,272" class="l"/><text x="404" y="180" class="s">inter-</text><text x="404" y="196" class="s">mediárias</text><text x="30" y="356" class="m">["Ana", "bruno", "Carla", "alice"]</text><text x="30" y="380" class="m">filter(n -&gt; n.length() &gt; 3)</text><text x="30" y="399" class="m">  → ["bruno", "Carla", "alice"]</text><text x="30" y="418" class="m">map(String::toUpperCase)</text><text x="30" y="437" class="m">  → ["BRUNO", "CARLA", "ALICE"]</text><text x="30" y="456" class="m">sorted().toList()</text><text x="30" y="475" class="m">  → ["ALICE", "BRUNO", "CARLA"]</text><text x="240.0" y="508" class="n c">Intermediárias são preguiçosas: só rodam quando</text><text x="240.0" y="526" class="n c">há uma terminal. A lista original não muda.</text></svg>