<svg xmlns="http://www.w3.org/2000/svg" width="480" height="457" viewBox="0 0 480 457"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Data binding: classe e template</text><rect x="20" y="50" width="200" height="40" rx="6" class="xB"/><text x="120.0" y="74.5" class="b c">Classe (.ts)</text><rect x="260" y="50" width="200" height="40" rx="6" class="xG"/><text x="360.0" y="74.5" class="b c">Template (.html)</text><rect x="20" y="110" width="200" height="34" rx="6" class="xW"/><text x="30" y="132" class="m">nome = 'Ana';</text><rect x="260" y="110" width="200" height="34" rx="6" class="xW"/><text x="270" y="132" class="m">{{ nome }}</text><path d="M222,127 L258,127" class="l" marker-end="url(#a)"/><text x="240" y="162" class="s c b">interpolação {{ }}</text><rect x="20" y="182" width="200" height="34" rx="6" class="xW"/><text x="30" y="204" class="m">url = 'foto.png';</text><rect x="260" y="182" width="200" height="34" rx="6" class="xW"/><text x="270" y="204" class="m">&lt;img [src]="url"&gt;</text><path d="M222,199 L258,199" class="l" marker-end="url(#a)"/><text x="240" y="234" class="s c b">property binding [ ]</text><rect x="20" y="254" width="200" height="34" rx="6" class="xW"/><text x="30" y="276" class="m">salvar() { ... }</text><rect x="260" y="254" width="200" height="34" rx="6" class="xW"/><text x="270" y="276" class="m">(click)="salvar()"</text><path d="M258,271 L222,271" class="l" marker-end="url(#a)"/><text x="240" y="306" class="s c b">event binding ( )</text><rect x="20" y="326" width="200" height="34" rx="6" class="xW"/><text x="30" y="348" class="m">nome = 'Ana';</text><rect x="260" y="326" width="200" height="34" rx="6" class="xW"/><text x="270" y="348" class="m">[(ngModel)]="nome"</text><path d="M224,343 L256,343" class="l" marker-end="url(#a)" marker-start="url(#a)"/><text x="240" y="378" class="s c b">two-way [( )]</text><text x="240.0" y="415" class="n c">[ ] leva dados da classe para a tela; ( ) leva</text><text x="240.0" y="433" class="n c">eventos da tela para a classe; [( )] faz os dois.</text></svg>