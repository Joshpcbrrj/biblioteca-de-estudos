<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.k{font-family:Menlo,Consolas,monospace;font-size:11.5px}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.kB{fill:#2563EB}.kG{fill:#16A34A}.kO{fill:#D97706}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Data binding: como classe e template conversam</text><rect x="40" y="60" width="280" height="230" rx="6" class="xB"/><text x="180" y="84" class="b c">Classe (.ts)</text><text x="60" y="120" class="m">nome = 'Ana';</text><text x="60" y="148" class="m">url = 'foto.png';</text><text x="60" y="176" class="m">salvar() { ... }</text><rect x="580" y="60" width="280" height="230" rx="6" class="xG"/><text x="720" y="84" class="b c">Template (.html)</text><text x="596" y="120" class="k">{{ nome }}</text><text x="596" y="164" class="k">&lt;img [src]="url"&gt;</text><text x="596" y="208" class="k">&lt;button (click)="salvar()"&gt;</text><text x="596" y="252" class="k">&lt;input [(ngModel)]="nome"&gt;</text><path d="M320,116L580,116" class="l" marker-end="url(#a)"/><text x="450" y="108" class="b c kB">interpolação {{ }}</text><path d="M320,160L580,160" class="l" marker-end="url(#a)"/><text x="450" y="152" class="b c kB">property binding [ ]</text><path d="M580,204L320,204" class="l" marker-end="url(#a)"/><text x="450" y="196" class="b c kO">event binding ( )</text><path d="M320,250H580" class="l" marker-end="url(#a)"/><path d="M580,256H320" class="l" marker-end="url(#a)"/><text x="450" y="242" class="b c kG">two-way [( )]</text><text x="450" y="316" class="n c">[ ] leva dados da classe para a tela; ( ) leva eventos da tela para a classe; [( )] faz os dois.</text></svg>