<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">Hierarquia de exceções do Java</text><rect x="370" y="46" width="160" height="40" rx="6" class="xY"/><text x="450" y="70.5" class="m b c">Throwable</text><rect x="150" y="120" width="200" height="52" rx="6" class="xR"/><text x="250" y="143" class="m b c">Error</text><text x="250" y="160" class="s c">falhas graves da JVM: não trate</text><rect x="560" y="120" width="220" height="52" rx="6" class="xO"/><text x="670" y="143" class="m b c">Exception</text><text x="670" y="160" class="s c">checked: obrigado a tratar</text><path d="M450,86L250,120" class="l" marker-end="url(#a)"/><path d="M450,86L670,120" class="l" marker-end="url(#a)"/><text x="250" y="198" class="m c">OutOfMemoryError</text><text x="250" y="216" class="m c">StackOverflowError</text><rect x="420" y="220" width="230" height="52" rx="6" class="xG"/><text x="535" y="243" class="m b c">RuntimeException</text><text x="535" y="260" class="s c">unchecked: erros de programação</text><path d="M670,172L535,220" class="l" marker-end="url(#a)"/><rect x="690" y="220" width="180" height="52" rx="6" class="xO"/><text x="780" y="243" class="m c">IOException</text><text x="780" y="260" class="s c">SQLException...</text><path d="M670,172L780,220" class="l" marker-end="url(#a)"/><text x="535" y="298" class="m c" style="font-size:11.5px">NullPointerException</text><text x="535" y="316" class="m c" style="font-size:11.5px">ArithmeticException</text><text x="535" y="334" class="m c" style="font-size:11.5px">ArrayIndexOutOfBounds...</text><text x="535" y="352" class="m c" style="font-size:11.5px">NumberFormatException</text><text x="450" y="390" class="n c">Checked (laranja) exigem try/catch ou throws; unchecked (verde) indicam bug a corrigir no código.</text></svg>