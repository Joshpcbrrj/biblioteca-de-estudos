<svg xmlns="http://www.w3.org/2000/svg" width="900" height="204" viewBox="0 0 900 204"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Toda solução tem três fases</text><rect x="40" y="54" width="230" height="100" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="155" y="101" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">Entrada</text><text x="155" y="119" font-size="11.5" fill="#6B7280" text-anchor="middle">leia nota1, nota2</text><rect x="335" y="54" width="230" height="100" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="450" y="101" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">Processamento</text><text x="450" y="119" font-size="11.5" fill="#6B7280" text-anchor="middle">media = (nota1 + nota2) / 2</text><rect x="630" y="54" width="230" height="100" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="745" y="101" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">Saída</text><text x="745" y="119" font-size="11.5" fill="#6B7280" text-anchor="middle">escreva media</text><line x1="272" y1="104" x2="333" y2="104" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><line x1="567" y1="104" x2="628" y2="104" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="450" y="186" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Antes de escrever o algoritmo, responda: o que eu recebo? o que eu faço? o que eu devolvo?</text></svg>