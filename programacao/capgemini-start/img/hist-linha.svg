<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Da contagem manual à máquina programável</text><line x1="40" y1="120" x2="860" y2="120" stroke="#9CA3AF" stroke-width="2" marker-end="url(#ara)"/><circle cx="90" cy="120" r="8" fill="#9CA3AF"/><text x="90" y="98" font-size="12.5" font-weight="bold" fill="#9CA3AF" text-anchor="middle">c. 2500 a.C.</text><rect x="24" y="142" width="132" height="84" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="90" y="166" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Ábaco</text><text x="90" y="192" font-size="11" fill="#6B7280" text-anchor="middle">contas que</text><text x="90" y="208" font-size="11" fill="#6B7280" text-anchor="middle">deslizam</text><circle cx="234" cy="120" r="8" fill="#2563EB"/><text x="234" y="98" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="middle">1642</text><rect x="168" y="142" width="132" height="84" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="234" y="166" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Pascalina</text><text x="234" y="192" font-size="11" fill="#6B7280" text-anchor="middle">soma e subtrai</text><text x="234" y="208" font-size="11" fill="#6B7280" text-anchor="middle">com engrenagens</text><circle cx="378" cy="120" r="8" fill="#2563EB"/><text x="378" y="98" font-size="12.5" font-weight="bold" fill="#2563EB" text-anchor="middle">1673</text><rect x="312" y="142" width="132" height="84" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="378" y="166" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Leibniz</text><text x="378" y="192" font-size="11" fill="#6B7280" text-anchor="middle">multiplica;</text><text x="378" y="208" font-size="11" fill="#6B7280" text-anchor="middle">sistema binário</text><circle cx="522" cy="120" r="8" fill="#D97706"/><text x="522" y="98" font-size="12.5" font-weight="bold" fill="#D97706" text-anchor="middle">1804</text><rect x="456" y="142" width="132" height="84" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="522" y="166" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Tear de Jacquard</text><text x="522" y="192" font-size="11" fill="#6B7280" text-anchor="middle">cartões perfurados</text><text x="522" y="208" font-size="11" fill="#6B7280" text-anchor="middle">= programa</text><circle cx="666" cy="120" r="8" fill="#7C3AED"/><text x="666" y="98" font-size="12.5" font-weight="bold" fill="#7C3AED" text-anchor="middle">1837</text><rect x="600" y="142" width="132" height="84" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="666" y="166" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Máquina analítica</text><text x="666" y="192" font-size="11" fill="#6B7280" text-anchor="middle">Babbage: projeto</text><text x="666" y="208" font-size="11" fill="#6B7280" text-anchor="middle">de uso geral</text><circle cx="810" cy="120" r="8" fill="#16A34A"/><text x="810" y="98" font-size="12.5" font-weight="bold" fill="#16A34A" text-anchor="middle">1854</text><rect x="744" y="142" width="132" height="84" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="810" y="166" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Álgebra de Boole</text><text x="810" y="192" font-size="11" fill="#6B7280" text-anchor="middle">lógica com</text><text x="810" y="208" font-size="11" fill="#6B7280" text-anchor="middle">V/F (1/0)</text><text x="450" y="262" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Ideias-chave: calcular automaticamente → guardar o programa fora da máquina → representar tudo com 0 e 1.</text></svg>