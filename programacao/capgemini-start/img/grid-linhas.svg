<svg xmlns="http://www.w3.org/2000/svg" width="480" height="508" viewBox="0 0 480 508"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">CSS Grid: linhas, colunas e áreas</text><rect x="60" y="80" width="400" height="50" rx="6" class="xB"/><text x="260.0" y="109.5" class="b c">header</text><rect x="60" y="130" width="100" height="120" rx="6" class="xG"/><text x="110.0" y="194.5" class="b c">aside</text><rect x="160" y="130" width="300" height="120" rx="6" class="xO"/><text x="385" y="196" class="b c">main</text><rect x="60" y="250" width="400" height="50" rx="6" class="xY"/><text x="260.0" y="279.5" class="b c">footer</text><path d="M60,70 L60,310" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 3"/><text x="60" y="64" class="s b c" style="fill:#7C3AED">1</text><path d="M160,70 L160,310" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 3"/><text x="160" y="64" class="s b c" style="fill:#7C3AED">2</text><path d="M310,70 L310,310" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 3"/><text x="310" y="64" class="s b c" style="fill:#7C3AED">3</text><path d="M460,70 L460,310" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 3"/><text x="460" y="64" class="s b c" style="fill:#7C3AED">4</text><path d="M50,80 L470,80" stroke="#D97706" stroke-width="2" stroke-dasharray="4 3"/><text x="40" y="85" class="s b r" style="fill:#D97706">1</text><path d="M50,130 L470,130" stroke="#D97706" stroke-width="2" stroke-dasharray="4 3"/><text x="40" y="135" class="s b r" style="fill:#D97706">2</text><path d="M50,250 L470,250" stroke="#D97706" stroke-width="2" stroke-dasharray="4 3"/><text x="40" y="255" class="s b r" style="fill:#D97706">3</text><path d="M50,300 L470,300" stroke="#D97706" stroke-width="2" stroke-dasharray="4 3"/><text x="40" y="305" class="s b r" style="fill:#D97706">4</text><text x="30" y="342" class="m">grid-template-columns: 200px 1fr 1fr;</text><text x="30" y="360" class="m">grid-template-areas:</text><text x="30" y="378" class="m">  "header header header"</text><text x="30" y="396" class="m">  "aside  main   main"</text><text x="30" y="414" class="m">  "footer footer footer";</text><text x="30" y="432" class="m">gap: 10px;</text><text x="240.0" y="466" class="n c">Roxo = linhas de coluna; laranja = linhas de linha.</text><text x="240.0" y="484" class="n c">main vai da coluna 2 à 4: grid-column: 2 / 4.</text></svg>