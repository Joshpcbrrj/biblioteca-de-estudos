<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Interpretada × Java (híbrido)</text><text x="220" y="60" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Interpretada (JavaScript, Python)</text><rect x="40" y="76" width="150" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="115" y="108" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Código-fonte</text><text x="115" y="126" font-size="11.5" fill="#6B7280" text-anchor="middle">app.js</text><rect x="240" y="76" width="170" height="70" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="325" y="108" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Interpretador</text><text x="325" y="126" font-size="11.5" fill="#6B7280" text-anchor="middle">lê e executa linha a linha</text><line x1="192" y1="111" x2="238" y2="111" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="220" y="176" font-size="11.5" font-style="italic" fill="#6B7280" text-anchor="middle">sem executável · roda onde houver interpretador</text><line x1="450" y1="50" x2="450" y2="290" stroke="#9CA3AF" stroke-width="2"/><text x="680" y="60" font-size="13.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Java</text><rect x="468" y="76" width="96" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="516" y="108" class="m" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Main.java</text><text x="516" y="126" font-size="11.5" fill="#6B7280" text-anchor="middle">fonte</text><line x1="565" y1="111" x2="577" y2="111" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="578" y="76" width="96" height="70" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="626" y="108" class="m" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">javac</text><text x="626" y="126" font-size="11.5" fill="#6B7280" text-anchor="middle">compila</text><line x1="675" y1="111" x2="687" y2="111" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="688" y="76" width="96" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="736" y="108" class="m" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">Main.class</text><text x="736" y="126" font-size="11.5" fill="#6B7280" text-anchor="middle">bytecode</text><line x1="785" y1="111" x2="797" y2="111" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="798" y="76" width="96" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="846" y="108" class="m" font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">JVM</text><text x="846" y="126" font-size="11.5" fill="#6B7280" text-anchor="middle">executa</text><text x="680" y="176" font-size="11.5" font-style="italic" fill="#6B7280" text-anchor="middle">compila uma vez → roda em qualquer sistema com JVM</text><text x="680" y="196" font-size="11.5" font-style="italic" fill="#6B7280" text-anchor="middle">(Windows, Linux, macOS: &quot;write once, run anywhere&quot;)</text><text x="220" y="236" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">navegador = interpretador de JavaScript</text><text x="680" y="236" font-size="12" fill="#1F2937" text-anchor="middle">a JVM interpreta e também compila em tempo real (JIT)</text></svg>