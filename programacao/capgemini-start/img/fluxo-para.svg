<svg xmlns="http://www.w3.org/2000/svg" width="480" height="358" viewBox="0 0 480 358"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Laço para</text><rect x="70.0" y="48" width="260" height="36" rx="2" class="xO"/><text x="200" y="71" class="m c">soma &lt;- 0</text><path d="M200,84 L200,104" class="l" marker-end="url(#a)"/><polygon points="70,104 310,104 330,132 310,160 70,160" class="xP"/><text x="200" y="137" class="m c">i de 1 ate 5</text><path d="M200,160 L200,190" class="l" marker-end="url(#a)"/><rect x="70.0" y="190" width="260" height="36" rx="2" class="xO"/><text x="200" y="213" class="m c">soma &lt;- soma + i</text><path d="M70,208 L30,208 L30,132 L68,132" class="l" marker-end="url(#a)"/><text x="34" y="98" class="s">próxima volta</text><path d="M330,132 L400,132 L400,250 L240,250" class="l" marker-end="url(#a)"/><text x="404" y="124" class="s r">terminou</text><rect x="80.0" y="250" width="240" height="36" rx="2" class="xO"/><text x="200" y="273" class="m c">escreval(soma)  // 15</text><text x="240.0" y="316" class="n c">O para cuida