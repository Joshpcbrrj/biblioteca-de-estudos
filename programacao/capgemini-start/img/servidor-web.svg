<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Como o servidor web atende um pedido</text><rect x="20" y="48" width="180" height="52" rx="6" class="xB"/><text x="110.0" y="70.5" class="b c">Navegador</text><text x="110.0" y="88.5" class="s c">cliente</text><rect x="280" y="48" width="180" height="52" rx="6" class="xG"/><text x="370.0" y="70.5" class="b c">Servidor web</text><text x="370.0" y="88.5" class="s c">Apache · Nginx</text><path d="M200,64 L280,64" class="l" marker-end="url(#a)"/><path d="M280,86 L200,86" class="l" marker-end="url(#a)"/><text x="240" y="58" class="s c">request</text><text x="240" y="104" class="s c">response</text><text x="20" y="148" class="b">1 · estático</text><rect x="20" y="160" width="440" height="48" rx="6" class="xY"/><text x="240.0" y="180.5" class="b c">Arquivos prontos</text><text x="240.0" y="198.5" class="s c">index.html · .css · .png</text><text x="20" y="244" class="b">2 · dinâmico</text><rect x="20" y="256" width="260"