<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xY{fill:#F3F4F6;stroke:#9CA3AF}rect{stroke-width:1.8}</style><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">position: como o elemento sai (ou não) do fluxo normal</text><rect x="40" y="50" width="150" height="42" rx="6" class="xY"/><text x="115" y="76" class="m b c">static</text><text x="210" y="76">padrão: segue o fluxo; top/left não funcionam</text><rect x="40" y="102" width="150" height="42" rx="6" class="xB"/><text x="115" y="128" class="m b c">relative</text><text x="210" y="128">desloca a partir da posição original, sem tirar do fluxo</text><rect x="40" y="154" width="150" height="42" rx="6" class="xO"/><text x="115" y="180" class="m b c">absolute</text><text x="210" y="180">sai do fluxo; posiciona em relação ao ancestral posicionado mais próximo</text><rect x="40" y="206" width="150" height="42" rx="6" class="xP"/><text x="115" y="232" class="m b c">fixed</text><text x="210" y="232">sai do fluxo; preso à janela (não rola)</text><rect x="40" y="258" width="150" height="42" rx="6" class="xG"/><text x="115" y="284" class="m b c">sticky</text><text x="210" y="284">normal até chegar no limite (ex.: top: 0), depois gruda</text><text x="450" y="326" class="n c">absolute dentro de um pai com position: relative é a combinação mais usada.</text></svg>