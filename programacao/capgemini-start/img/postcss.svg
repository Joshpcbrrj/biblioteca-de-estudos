<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#1F2937}.t{font-size:15px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:11px}.s{font-size:11.5px;fill:#6B7280}.n{font-size:13px;font-style:italic;fill:#6B7280}.c{text-anchor:middle}.xB{fill:#DBEAFE;stroke:#2563EB}.xP{fill:#EDE9FE;stroke:#7C3AED}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}rect{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="450" y="26" class="t c">PostCSS: o CSS passa por uma esteira de plugins</text><rect x="30" y="80" width="150" height="60" rx="6" class="xY"/><text x="105" y="107" class="b c">CSS de entrada</text><text x="105" y="124" class="s c">seu .css ou saída do Sass</text><path d="M180,110L240,110" class="l" marker-end="url(#a)"/><rect x="240" y="50" width="420" height="120" rx="6" class="xP"/><text x="450" y="72" class="b c">PostCSS + plugins</text><rect x="254" y="86" width="128" height="70" rx="6" class="xW"/><text x="318" y="114" class="m c">autoprefixer</text><text x="318" y="134" class="s c">prefixos de</text><text x="318" y="148" class="s c">navegador</text><rect x="390" y="86" width="128" height="70" rx="6" class="xW"/><text x="454" y="114" class="m c">postcss-preset-env</text><text x="454" y="134" class="s c">CSS moderno</text><text x="454" y="148" class="s c">compatível</text><rect x="526" y="86" width="128" height="70" rx="6" class="xW"/><text x="590" y="114" class="m c">cssnano</text><text x="590" y="134" class="s c">minifica</text><path d="M660,110L720,110" class="l" marker-end="url(#a)"/><rect x="720" y="80" width="150" height="60" rx="6" class="xB"/><text x="795" y="107" class="b c">CSS final</text><text x="795" y="124" class="s c">pronto para produção</text><text x="450" y="216" class="n c">Cada plugin faz uma transformação; você escolhe quais usar.</text></svg>