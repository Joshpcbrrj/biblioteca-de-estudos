<svg xmlns="http://www.w3.org/2000/svg" width="480" height="472" viewBox="0 0 480 472"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">O documento vira uma árvore (DOM)</text><rect x="180.0" y="48" width="120" height="32" rx="6" class="xY"/><text x="240.0" y="68.5" class="m c">document</text><rect x="185.0" y="108" width="110" height="32" rx="6" class="xP"/><text x="240.0" y="128.5" class="m c">&lt;html&gt;</text><path d="M240,80 L240,108" class="l" marker-end="url(#a)"/><rect x="65.0" y="168" width="110" height="32" rx="6" class="xB"/><text x="120.0" y="188.5" class="m c">&lt;head&gt;</text><rect x="305.0" y="168" width="110" height="32" rx="6" class="xG"/><text x="360.0" y="188.5" class="m c">&lt;body&gt;</text><path d="M220,140 L130,168" class="l" marker-end="url(#a)"/><path d="M260,140 L350,168" class="l" marker-end="url(#a)"/><text x="120" y="222" class="s c">sobre a página</text><text x="360" y="222" class="s c">o que aparece</text><rect x="70.0" y="240" width="100" height="32" rx="6" class="xB"/><text x="120.0" y="260.5" class="m c">&lt;meta&gt;</text><rect x="70.0" y="284" width="100" height="32" rx="6" class="xB"/><text x="120.0" y="304.5" class="m c">&lt;title&gt;</text><rect x="70.0" y="328" width="100" height="32" rx="6" class="xB"/><text x="120.0" y="348.5" class="m c">&lt;link&gt;</text><rect x="305.0" y="240" width="110" height="32" rx="6" class="xG"/><text x="360.0" y="260.5" class="m c">&lt;header&gt;</text><rect x="305.0" y="284" width="110" height="32" rx="6" class="xG"/><text x="360.0" y="304.5" class="m c">&lt;main&gt;</text><rect x="305.0" y="328" width="110" height="32" rx="6" class="xG"/><text x="360.0" y="348.5" class="m c">&lt;footer&gt;</text><text x="120" y="394" class="m c" style="font-size:12px">&lt;title&gt;Minha página</text><text x="360" y="394" class="m c">&lt;h1&gt;, &lt;section&gt;...</text><text x="240.0" y="430" class="n c">Cada tag é um nó; quem está dentro é filho.</text><text x="240.0" y="448" class="n c">O JavaScript navega e altera essa árvore.</text></svg>