<svg xmlns="http://www.w3.org/2000/svg" width="480" height="424" viewBox="0 0 480 424"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Classe é o molde; objetos, as instâncias</text><text x="240.0" y="62" class="s c">classe (molde)</text><rect x="110" y="70" width="260" height="28" rx="6" class="xB"/><text x="240" y="89" class="b c">ContaBancaria</text><rect x="110" y="98" width="260" height="52" rx="0" class="xW"/><text x="124" y="118" class="m">- numero: String</text><text x="124" y="136" class="m">- saldo: double</text><rect x="110" y="150" width="260" height="70" rx="0" class="xW"/><text x="124" y="170" class="m">+ depositar(valor)</text><text x="124" y="188" class="m">+ sacar(valor)</text><text x="124" y="206" class="m">+ consultarSaldo()</text><path d="M180,220 L130,262" class="l" marker-end="url(#a)"/><path d="M300,220 L350,262" class="l" marker-end="url(#a)"/><text x="240" y="248" class="m b c">new</text><rect x="20" y="262" width="210" height="92" rx="6" class="xG"/><text x="125" y="284" class="m b c">conta1</text><text x="32" y="310" class="m">numero = "1234-5"</text><text x="32" y="332" class="m">saldo  = 1500.0</text><rect x="250" y="262" width="210" height="92" rx="6" class="xG"/><text x="355" y="284" class="m b c">conta2</text><text x="262" y="310" class="m">numero = "5678-9"</text><text x="262" y="332" class="m">saldo  = 400.0</text><text x="240.0" y="382" class="n c">Cada objeto tem seus próprios valores, mas</text><text x="240.0" y="400" class="n c">todos compartilham os métodos da classe.</text></svg>