<svg xmlns="http://www.w3.org/2000/svg" width="900" height="368" viewBox="0 0 900 368"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Surface web, deep web e dark web</text><rect x="0" y="120" width="900" height="3" rx="0" fill="#2563EB" stroke="#2563EB" stroke-width="0"/><path d="M400,50 L500,50 L540,120 L360,120 Z" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="450" y="100" font-size="13" font-weight="bold" fill="#16A34A" text-anchor="middle">Surface web</text><text x="600" y="80" font-size="12" fill="#1F2937">indexada por buscadores: notícias, blogs, lojas</text><path d="M360,123 L540,123 L620,260 L280,260 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="450" y="200" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">Deep web</text><text x="640" y="190" font-size="12" fill="#1F2937">não indexada: e-mail, internet banking,</text><text x="640" y="206" font-size="12" fill="#1F2937">intranets, áreas logadas (a maior parte!)</text><path d="M280,262 L620,262 L560,320 L340,320 Z" fill="#E5E7EB" stroke="#1F2937" stroke-width="2"/><text x="450" y="298" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Dark web</text><text x="600" y="298" font-size="12" fill="#1F2937">acessível só por redes anônimas (Tor)</text><text x="450" y="350" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Deep web não é sinônimo de ilegal: seu e-mail e sua conta no banco estão nela.</text></svg>