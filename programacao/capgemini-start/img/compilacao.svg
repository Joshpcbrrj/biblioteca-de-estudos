<svg xmlns="http://www.w3.org/2000/svg" width="480" height="592" viewBox="0 0 480 592"><style>text{white-space:pre;font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1F2937}.t{font-size:17px;font-weight:bold}.b{font-weight:bold}.m{font-family:Menlo,Consolas,monospace;font-size:13px}.s{font-size:12.5px;fill:#4B5563}.n{font-size:13px;font-style:italic;fill:#4B5563}.c{text-anchor:middle}.r{text-anchor:end}.xB{fill:#DBEAFE;stroke:#2563EB}.xG{fill:#DCFCE7;stroke:#16A34A}.xO{fill:#FEF3C7;stroke:#D97706}.xP{fill:#EDE9FE;stroke:#7C3AED}.xR{fill:#FEE2E2;stroke:#DC2626}.xY{fill:#F3F4F6;stroke:#9CA3AF}.xW{fill:#fff;stroke:#9CA3AF}.xT{fill:#CCFBF1;stroke:#0D9488}.xK{fill:#FCE7F3;stroke:#DB2777}rect,ellipse,polygon{stroke-width:1.8}.l{stroke:#6B7280;stroke-width:1.8;fill:none}.d{stroke-dasharray:5 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240.0" y="30" class="t c">Linguagem compilada</text><rect x="110" y="48" width="260" height="48" rx="6" class="xY"/><text x="240.0" y="68.5" class="b c">Código-fonte</text><text x="240.0" y="86.5" class="s c">programa.c</text><path d="M240,96 L240,118" class="l" marker-end="url(#a)"/><rect x="110" y="118" width="260" height="48" rx="6" class="xP"/><text x="240.0" y="138.5" class="b c">Compilador</text><text x="240.0" y="156.5" class="s c">verifica e traduz</text><path d="M240,166 L240,188" class="l" marker-end="url(#a)"/><text x="250" y="182" class="s" style="fill:#DC2626">erros aparecem aqui</text><rect x="110" y="188" width="260" height="48" rx="6" class="xG"/><text x="240.0" y="208.5" class="b c">Executável</text><text x="240.0" y="226.5" class="s c">programa.exe (binário)</text><path d="M240,236 L240,258" class="l" marker-end="url(#a)"/><rect x="110" y="258" width="260" height="48" rx="6" class="xO"/><text x="240.0" y="278.5" class="b c">CPU</text><text x="240.0" y="296.5" class="s c">executa direto</text><text x="240.0" y="344" class="b c">Níveis de linguagem</text><rect x="30" y="358" width="420" height="46" rx="6" class="xB"/><text x="44" y="377" class="s b">Alto nível</text><text x="44" y="395" class="m">total = preco * qtd;</text><text x="240" y="418" class="s c">↓</text><rect x="30" y="420" width="420" height="46" rx="6" class="xP"/><text x="44" y="439" class="s b">Assembly</text><text x="44" y="457" class="m">MOV EAX,[preco]  IMUL EAX,[qtd]</text><text x="240" y="480" class="s c">↓</text><rect x="30" y="482" width="420" height="46" rx="6" class="xY"/><text x="44" y="501" class="s b">Máquina</text><text x="44" y="519" class="m">10001011 01000101 ...</text><text x="240.0" y="550" class="n c">O Assembler converte Assembly em linguagem de</text><text x="240.0" y="568" class="n c">máquina, a única que o processador entende.</text></svg>