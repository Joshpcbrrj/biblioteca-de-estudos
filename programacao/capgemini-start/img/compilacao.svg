<svg xmlns="http://www.w3.org/2000/svg" width="900" height="386" viewBox="0 0 900 386"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Linguagem compilada: traduz tudo antes de rodar</text><rect x="30" y="56" width="180" height="86" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="120" y="96" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Código-fonte</text><text x="120" y="114" font-size="11.5" fill="#6B7280" text-anchor="middle">programa.c</text><rect x="270" y="56" width="160" height="86" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="350" y="96" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Compilador</text><text x="350" y="114" font-size="11.5" fill="#6B7280" text-anchor="middle">verifica e traduz</text><rect x="490" y="56" width="170" height="86" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="575" y="96" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Executável</text><text x="575" y="114" font-size="11.5" fill="#6B7280" text-anchor="middle">programa.exe (binário)</text><rect x="720" y="56" width="150" height="86" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="795" y="96" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">CPU</text><text x="795" y="114" font-size="11.5" fill="#6B7280" text-anchor="middle">executa direto</text><line x1="212" y1="99" x2="268" y2="99" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><line x1="432" y1="99" x2="488" y2="99" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><line x1="662" y1="99" x2="718" y2="99" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="350" y="166" font-size="11.5" font-style="italic" fill="#DC2626" text-anchor="middle">erros aparecem aqui</text><text x="450" y="200" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Níveis de linguagem</text><rect x="120" y="216" width="660" height="38" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="140" y="240" font-size="13" font-weight="bold" fill="#2563EB">Alto nível</text><text x="300" y="240" class="m" font-size="13" fill="#1F2937">total = preco * qtd;</text><text x="800" y="258" font-size="16" fill="#6B7280" text-anchor="middle">↓</text><rect x="120" y="262" width="660" height="38" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="140" y="286" font-size="13" font-weight="bold" fill="#7C3AED">Assembly</text><text x="300" y="286" class="m" font-size="13" fill="#1F2937">MOV EAX, [preco]&#160; ·&#160; IMUL EAX, [qtd]</text><text x="800" y="304" font-size="16" fill="#6B7280" text-anchor="middle">↓</text><rect x="120" y="308" width="660" height="38" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="140" y="332" font-size="13" font-weight="bold" fill="#9CA3AF">Máquina</text><text x="300" y="332" class="m" font-size="13" fill="#1F2937">10001011 01000101 11111000 ...</text><text x="450" y="368" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">O Assembler converte Assembly em linguagem de máquina, a única que o processador entende.</text></svg>