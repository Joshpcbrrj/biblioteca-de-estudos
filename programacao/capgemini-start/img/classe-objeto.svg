<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280"><style>text{font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif}.m{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace}</style><defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="26" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Classe é o molde; objetos são as peças criadas com ele</text><rect x="40" y="50" width="250" height="180" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="40" y="50" width="250" height="34" rx="10" fill="#2563EB" stroke="#2563EB" stroke-width="1"/><text x="165" y="73" class="m" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">class Cliente</text><text x="56" y="108" font-size="11.5" font-style="italic" fill="#6B7280">atributos</text><text x="70" y="130" class="m" font-size="13" fill="#1F2937">nome</text><text x="70" y="150" class="m" font-size="13" fill="#1F2937">rg</text><text x="70" y="170" class="m" font-size="13" fill="#1F2937">idade</text><text x="56" y="200" font-size="11.5" font-style="italic" fill="#6B7280">métodos</text><text x="70" y="220" class="m" font-size="13" fill="#1F2937">apresentar()</text><rect x="470" y="44" width="380" height="56" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="490" y="77" class="m" font-size="14" font-weight="bold" fill="#16A34A">c1</text><text x="530" y="77" class="m" font-size="12.5" fill="#1F2937">nome=&quot;Ana&quot;&#160; rg=&quot;123&quot;&#160; idade=30</text><line x1="292" y1="140" x2="466" y2="72" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="470" y="110" width="380" height="56" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="490" y="143" class="m" font-size="14" font-weight="bold" fill="#16A34A">c2</text><text x="530" y="143" class="m" font-size="12.5" fill="#1F2937">nome=&quot;Beto&quot;&#160; rg=&quot;456&quot;&#160; idade=25</text><line x1="292" y1="140" x2="466" y2="138" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><rect x="470" y="176" width="380" height="56" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="490" y="209" class="m" font-size="14" font-weight="bold" fill="#16A34A">c3</text><text x="530" y="209" class="m" font-size="12.5" fill="#1F2937">nome=&quot;Carla&quot;&#160; rg=&quot;789&quot;&#160; idade=41</text><line x1="292" y1="140" x2="466" y2="204" stroke="#6B7280" stroke-width="2" marker-end="url(#arg)"/><text x="380" y="128" class="m" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">new</text><text x="450" y="262" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Cada objeto tem seus próprios valores, mas todos seguem a estrutura definida na classe.</text></svg>