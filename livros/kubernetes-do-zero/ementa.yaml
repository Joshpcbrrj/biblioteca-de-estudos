titulo: "Kubernetes do zero"
slug: kubernetes-do-zero
trilha: devops
ordem_na_trilha: 3
nivel: iniciante
publico: "Quem já monta stacks com Compose e Swarm e quer entender o Kubernetes"
objetivo: "Implantar, expor e atualizar uma aplicação com banco num cluster Kubernetes local, usando manifests e Helm"
pre_requisitos: [docker-do-zero, docker-compose-na-pratica, docker-swarm-do-zero]
versao_referencia: "Kubernetes 1.37.1 com kind no Docker Desktop 4.97.0 (conferido em 2026-11-17)"
fontes:
  - {titulo: "Kubernetes releases", url: "https://kubernetes.io/releases/", conferido_em: "2026-11-17"}
  - {titulo: "Docker Desktop: Kubernetes", url: "https://docs.docker.com/desktop/features/kubernetes/", conferido_em: "2026-11-17"}
  - {titulo: "Ingress NGINX Retirement (Kubernetes blog)", url: "https://www.kubernetes.io/blog/2025/11/11/ingress-nginx-retirement/", conferido_em: "2026-11-17"}
aprovada_em: "2026-11-17"
capitulos:
  - {n: 1, titulo: "Por que o Kubernetes existe", objetivo: "Explicar o que um cluster resolve que um swarm não resolve", topicos: [cluster, control-plane, estado-desejado]}
  - {n: 2, titulo: "Criar o cluster com kind no Docker Desktop", objetivo: "Criar um cluster kind com vários nós e conferir versão e contexto com kubectl", topicos: [kind, kubectl, contexto, nos]}
  - {n: 3, titulo: "Pods", objetivo: "Criar, listar, ler logs e remover um pod", topicos: [pod, kubectl-get, logs]}
  - {n: 4, titulo: "Deployments e réplicas", objetivo: "Declarar um deployment em YAML e ver pods recriados", topicos: [deployment, replicaset, self-healing]}
  - {n: 5, titulo: "Services", objetivo: "Expor um deployment dentro do cluster e para a máquina", topicos: [clusterip, nodeport, dns-do-cluster]}
  - {n: 6, titulo: "ConfigMaps", objetivo: "Entregar configuração não sensível a um pod", topicos: [configmap, env-from, volume-de-configmap]}
  - {n: 7, titulo: "Secrets", objetivo: "Entregar uma senha a um pod por Secret", topicos: [secret, base64-nao-e-cifra, rbac-basico]}
  - {n: 8, titulo: "Volumes e PersistentVolumeClaim", objetivo: "Guardar dados de um banco que sobrevivem ao pod", topicos: [pvc, storageclass, pv]}
  - {n: 9, titulo: "Probes de saúde", objetivo: "Configurar liveness e readiness", topicos: [liveness, readiness, startup]}
  - {n: 10, titulo: "Atualizações e rollback", objetivo: "Atualizar a imagem de um deployment e desfazer com rollout undo", topicos: [rollout, strategy, rollback]}
  - {n: 11, titulo: "Namespaces", objetivo: "Separar ambientes no mesmo cluster com namespaces", topicos: [namespace, contexto-de-namespace, quotas-basicas]}
  - {n: 12, titulo: "Helm: pacotes e templates", objetivo: "Instalar um chart oficial e criar um chart próprio com values", topicos: [helm-install, chart, values]}
  - {n: 13, titulo: "Entrada HTTP: Ingress (conceito e legado)", objetivo: "Explicar o recurso Ingress, o papel do controlador e por que o Ingress NGINX saiu de uso", topicos: [ingress, ingress-controller, ingress-nginx-aposentado]}
  - {n: 14, titulo: "Entrada HTTP com Gateway API", objetivo: "Expor a aplicação com Gateway e HTTPRoute", topicos: [gateway-api, gatewayclass, httproute]}
  - {n: 15, titulo: "Projeto final: API, banco e entrada HTTP", objetivo: "Publicar API e banco com Helm, PVC, Secret, probes e rota HTTP", topicos: [projeto]}
cobre: [pod, deployment, service, configmap, secret, pvc, probes, namespace, helm, ingress, gateway-api]
fica_para_depois: [seguranca-de-imagens, operadores, monitoramento, cluster-de-producao]
