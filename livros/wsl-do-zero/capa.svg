<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560">
<defs>
<radialGradient id="luz" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F2B33D" stop-opacity="0.38"/><stop offset="1" stop-color="#F2B33D" stop-opacity="0"/></radialGradient>
<linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1D21"/><stop offset="1" stop-color="#26292E"/></linearGradient>
<pattern id="grade" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/></pattern>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="brilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="2560" fill="url(#fundo)"/>
<rect width="1600" height="2560" fill="url(#grade)"/>
<!-- rótulo -->
<text x="140" y="210" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="38" fill="#F2B33D" letter-spacing="9">LIVRO 1 · TRILHA WSL</text>
<rect x="140" y="240" width="150" height="8" fill="#F2B33D"/>
<!-- título -->
<g transform="translate(130,0) scale(0.84,1)">
<text x="0" y="640" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="420" font-weight="bold" fill="#F7F3EA" letter-spacing="-6">WSL</text>
</g>
<text x="142" y="800" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="150" font-weight="bold" fill="#F2B33D" letter-spacing="2">DO ZERO</text>
<text x="146" y="900" font-family="DejaVu Serif, Georgia, serif" font-size="62" font-style="italic" fill="#CFC9BC">Linux no Windows para programar</text>
<!-- luz central -->
<circle cx="820" cy="1580" r="620" fill="url(#luz)"/>
<!-- janela de trás: o Windows (clara) -->
<rect x="250" y="1150" width="980" height="700" rx="26" fill="#000" opacity="0.45" filter="url(#sombra)"/>
<rect x="230" y="1120" width="980" height="700" rx="26" fill="#ECE7DB"/>
<rect x="230" y="1120" width="980" height="80" rx="26" fill="#D9D2C2"/>
<rect x="230" y="1170" width="980" height="30" fill="#D9D2C2"/>
<rect x="290" y="1150" width="220" height="20" rx="10" fill="#BDB4A0"/>
<rect x="290" y="1260" width="420" height="22" rx="11" fill="#CFC7B4"/>
<rect x="290" y="1310" width="320" height="22" rx="11" fill="#CFC7B4"/>
<rect x="290" y="1360" width="380" height="22" rx="11" fill="#CFC7B4"/>
<rect x="290" y="1410" width="260" height="22" rx="11" fill="#CFC7B4"/>
<!-- janela da frente: o Linux (terminal escuro) -->
<rect x="560" y="1430" width="900" height="720" rx="26" fill="#000" opacity="0.55" filter="url(#sombra)"/>
<rect x="540" y="1400" width="900" height="720" rx="26" fill="#121316" stroke="#F2B33D" stroke-width="5"/>
<rect x="542" y="1402" width="896" height="78" rx="24" fill="#202227"/>
<rect x="542" y="1450" width="896" height="30" fill="#202227"/>
<circle cx="600" cy="1441" r="13" fill="#F2B33D"/>
<circle cx="645" cy="1441" r="13" fill="#5A5D66"/>
<circle cx="690" cy="1441" r="13" fill="#5A5D66"/>
<g font-family="DejaVu Sans Mono, Menlo, monospace" font-size="50">
<text x="600" y="1600" fill="#8FD18F">~$ <tspan fill="#F7F3EA">wsl --install</tspan></text>
<text x="600" y="1690" fill="#8FD18F">~$ <tspan fill="#F7F3EA">sudo apt update</tspan></text>
<text x="600" y="1780" fill="#8FD18F">~$ <tspan fill="#F7F3EA">nvm install --lts</tspan></text>
<text x="600" y="1870" fill="#8FD18F">~$ <tspan fill="#F7F3EA">claude</tspan></text>
<text x="600" y="1960" fill="#8FD18F">~$ <tspan fill="#F2B33D" filter="url(#brilho)">▌</tspan></text>
</g>
<!-- rodapé -->
<rect x="140" y="2290" width="1320" height="3" fill="#F7F3EA" opacity="0.25"/>
<text x="140" y="2380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="44" fill="#CFC9BC" letter-spacing="2">Curso criado a partir de ementa</text>
<text x="140" y="2450" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#F7F3EA">Criado por: Josué B. Almeida</text>
</svg>
