<svg xmlns="http://www.w3.org/2000/svg" width="480" height="474" viewBox="0 0 480 474"><style>text{white-space:pre;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;fill:#2B2B2B}.t{font-size:18px;font-weight:800;fill:#1E1E1E;letter-spacing:.2px}.b{font-weight:700}.m{font-family:'Courier New',Menlo,Consolas,monospace;font-size:13.5px;font-weight:600}.s{font-size:12.5px;fill:#55555F}.n{font-size:13px;font-style:italic;fill:#55555F}.c{text-anchor:middle}.r{text-anchor:end}.w{fill:#fff}.xB{fill:#E3EEFF;stroke:#9DBEF5}.hB{fill:#2F5FB3;stroke:#2F5FB3}.fB{fill:#2F5FB3}.xG{fill:#DDF5EA;stroke:#94D8B8}.hG{fill:#21835A;stroke:#21835A}.fG{fill:#21835A}.xO{fill:#FFF4CC;stroke:#EBCF6E}.hO{fill:#8A6A00;stroke:#8A6A00}.fO{fill:#8A6A00}.xP{fill:#EEE6FB;stroke:#C3ADEE}.hP{fill:#6B44B8;stroke:#6B44B8}.fP{fill:#6B44B8}.xR{fill:#FFE7E0;stroke:#F5AE9B}.hR{fill:#B4472B;stroke:#B4472B}.fR{fill:#B4472B}.xY{fill:#F3F0EA;stroke:#D9D2C5}.hY{fill:#6F685C;stroke:#6F685C}.fY{fill:#6F685C}.xT{fill:#DDF3F3;stroke:#93D2D2}.hT{fill:#1C7A7A;stroke:#1C7A7A}.fT{fill:#1C7A7A}.xK{fill:#FFE7E0;stroke:#F5AE9B}.hK{fill:#B4472B;stroke:#B4472B}.fK{fill:#B4472B}.xW{fill:#FFFFFF;stroke:#E4DED3}.hW{fill:#8A8478;stroke:#8A8478}.fW{fill:#8A8478}.xZ{fill:#EEE6FB;stroke:#C3ADEE}.hZ{fill:#6B44B8;stroke:#6B44B8}.fZ{fill:#6B44B8}.xV{fill:#FFFFFF;stroke:#E4DED3}.hV{fill:#8A8478;stroke:#8A8478}.fV{fill:#8A8478}rect,ellipse,polygon,circle{stroke-width:2}.l{stroke:#7A7F8C;stroke-width:2.4;fill:none;stroke-dasharray:1.5 6;stroke-linecap:round;stroke-linejoin:round}.d{stroke-dasharray:9 6;stroke-linecap:butt}.sh{fill:#3A3226;opacity:.07;stroke:none}</style><defs><linearGradient id="gT0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9DBEF5"/><stop offset=".33" stop-color="#C3ADEE"/><stop offset=".66" stop-color="#F5AE9B"/><stop offset="1" stop-color="#EBCF6E"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1L9,5L1,9" fill="none" stroke="#7A7F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="240.0" y="30" class="t c">O que entra em cada tipo de backup</text><rect x="200.0" y="38" width="80" height="4" rx="2" fill="url(#gT0)"/><rect x="22" y="63" width="210" height="224" rx="12" class="sh"/><rect x="20" y="60" width="210" height="224" rx="12" class="xB"/><text x="125" y="86" class="b c">Só os projetos</text><text x="34" y="114" class="s">tar -czf de ~/projetos</text><text x="34" y="133" class="s">ou git push</text><text x="34" y="152" class="s">leva: código e .git</text><text x="34" y="171" class="s">fica: programas,</text><text x="34" y="190" class="s">  configs, nvm, uv</text><text x="34" y="209" class="s"></text><text x="34" y="228" class="s">tamanho: KB a MB</text><text x="34" y="247" class="s">restaura: em minutos</text><text x="34" y="266" class="s">  (mas reinstale tudo)</text><rect x="252" y="63" width="210" height="224" rx="12" class="sh"/><rect x="250" y="60" width="210" height="224" rx="12" class="xP"/><text x="355" y="86" class="b c">A distro inteira</text><text x="264" y="114" class="s">wsl --export</text><text x="264" y="133" class="s">(arquivo .tar)</text><text x="264" y="152" class="s">leva: tudo do Linux</text><text x="264" y="171" class="s">(usuário, programas,</text><text x="264" y="190" class="s">  configs e projetos)</text><text x="264" y="209" class="s"></text><text x="264" y="228" class="s">tamanho: GB</text><text x="264" y="247" class="s">restaura: pronta</text><text x="264" y="266" class="s">  para usar</text><rect x="22" y="307" width="440" height="103" rx="12" class="sh"/><rect x="20" y="304" width="440" height="103" rx="12" class="xW"/><path d="M28,304 h424 a8,8 0 0 1 8,8 v12 h-440 v-12 a8,8 0 0 1 8,-8z" class="fG" opacity="1"/><circle cx="34" cy="314" r="4" fill="#EF4444" stroke="#fff" stroke-width="1"/><circle cx="48" cy="314" r="4" fill="#F59E0B" stroke="#fff" stroke-width="1"/><circle cx="62" cy="314" r="4" fill="#22C55E" stroke="#fff" stroke-width="1"/><rect x="20" y="324" width="440" height="83" fill="#F0F0F0" stroke="none" rx="0"/><rect x="20" y="304" width="440" height="103" rx="8" fill="none" stroke="#D6D2CA" stroke-width="1.8"/><text x="34" y="348" class="m"># medido no ambiente do livro</text><text x="34" y="369" class="m">du -sh ~/projetos           5.0M</text><text x="34" y="390" class="m">tar.gz sem node_modules     12K</text><text x="240.0" y="430" class="n c">Use os dois: projetos toda semana,</text><text x="240.0" y="450" class="n c">a distro antes de mudanças grandes.</text></svg>