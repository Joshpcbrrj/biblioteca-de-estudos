 y="337.5" class="s c">toda distro nova nasce na versão 2</text><path d="M240,351 L240,367" class="l" marker-end="url(#a)"/><rect x="42" y="370" width="400" height="56" rx="12" class="sh"/><rect x="40" y="367" width="400" height="56" rx="12" class="xG"/><text x="240.0" y="391.5" class="b c">4. Baixa e instala o Ubuntu</text><text x="240.0" y="409.5" class="s c">e abre para criar o usuário</text><text x="240.0" y="449" class="n c">Os componentes da tarefa 1 só valem depois de reiniciar.</text></svg>