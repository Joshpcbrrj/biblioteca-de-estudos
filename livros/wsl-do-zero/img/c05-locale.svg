<svg xmlns="http://www.w3.org/2000/svg" width="480" height="584" viewBox="0 0 480 584"><style>text{white-space:pre;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;fill:#2B2B2B}.t{font-size:18px;font-weight:800;fill:#1E1E1E;letter-spacing:.2px}.b{font-weight:700}.m{font-family:'Courier New',Menlo,Consolas,monospace;font-size:13.5px;font-weight:600}.s{font-size:12.5px;fill:#55555F}.n{font-size:13px;font-style:italic;fill:#55555F}.c{text-anchor:middle}.r{text-anchor:end}.w{fill:#fff}.xB{fill:#E3EEFF;stroke:#9DBEF5}.hB{fill:#2F5FB3;stroke:#2F5FB3}.fB{fill:#2F5FB3}.xG{fill:#DDF5EA;stroke:#94D8B8}.hG{fill:#21835A;stroke:#21835A}.fG{fill:#21835A}.xO{fill:#FFF4CC;stroke:#EBCF6E}.hO{fill:#8A6A00;stroke:#8A6A00}.fO{fill:#8A6A00}.xP{fill:#EEE6FB;stroke:#C3ADEE}.hP{fill:#6B44B8;stroke:#6B44B8}.fP{fill:#6B44B8}.xR{fill:#FFE7E0;stroke:#F5AE9B}.hR{fill:#B4472B;stroke:#B4472B}.fR{fill:#B4472B}.xY{fill:#F3F0EA;stroke:#D9D2C5}.hY{fill:#6F685C;stroke:#6F685C}.fY{fill:#6F685C}.xT{fill:#DDF3F3;stroke:#93D2D2}.hT{fill:#1C7A7A;stroke:#1C7A7A}.fT{fill:#1C7A7A}.xK{fill:#FFE7E0;stroke:#F5AE9B}.hK{fill:#B4472B;stroke:#B4472B}.fK{fill:#B4472B}.xW{fill:#FFFFFF;stroke:#E4DED3}.hW{fill:#8A8478;stroke:#8A8478}.fW{fill:#8A8478}.xZ{fill:#EEE6FB;stroke:#C3ADEE}.hZ{fill:#6B44B8;stroke:#6B44B8}.fZ{fill:#6B44B8}.xV{fill:#FFFFFF;stroke:#E4DED3}.hV{fill:#8A8478;stroke:#8A8478}.fV{fill:#8A8478}rect,ellipse,polygon,circle{stroke-width:2}.l{stroke:#7A7F8C;stroke-width:2.4;fill:none;stroke-dasharray:1.5 6;stroke-linecap:round;stroke-linejoin:round}.d{stroke-dasharray:9 6;stroke-linecap:butt}.sh{fill:#3A3226;opacity:.07;stroke:none}</style><defs><linearGradient id="gT0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9DBEF5"/><stop offset=".33" stop-color="#C3ADEE"/><stop offset=".66" stop-color="#F5AE9B"/><stop offset="1" stop-color="#EBCF6E"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1L9,5L1,9" fill="none" stroke="#7A7F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="240.0" y="30" class="t c">LANG é o padrão; cada LC_ troca uma parte</text><rect x="200.0" y="38" width="80" height="4" rx="2" fill="url(#gT0)"/><rect x="22" y="59" width="440" height="124" rx="12" class="sh"/><rect x="20" y="56" width="440" height="124" rx="12" class="xW"/><path d="M28,56 h424 a8,8 0 0 1 8,8 v12 h-440 v-12 a8,8 0 0 1 8,-8z" class="fP" opacity="1"/><circle cx="34" cy="66" r="4" fill="#EF4444" stroke="#fff" stroke-width="1"/><circle cx="48" cy="66" r="4" fill="#F59E0B" stroke="#fff" stroke-width="1"/><circle cx="62" cy="66" r="4" fill="#22C55E" stroke="#fff" stroke-width="1"/><rect x="20" y="76" width="440" height="104" fill="#F0F0F0" stroke="none" rx="0"/><rect x="20" y="56" width="440" height="124" rx="8" fill="none" stroke="#D6D2CA" stroke-width="1.8"/><text x="34" y="100" class="m"># /etc/default/locale</text><text x="34" y="121" class="m">LANG=C.UTF-8</text><text x="34" y="142" class="m">LC_TIME=pt_BR.UTF-8</text><text x="34" y="163" class="m">LC_NUMERIC=pt_BR.UTF-8</text><path d="M240,188 L240,206" class="l" marker-end="url(#a)"/><rect x="22" y="209" width="440" height="92" rx="12" class="sh"/><rect x="20" y="206" width="440" height="92" rx="12" class="xY"/><text x="36" y="232" class="b">LC_MESSAGES = LANG (C)</text><text x="36" y="258" class="m">$ ls /naoexiste</text><text x="36" y="282" class="m">cannot access ...</text><path d="M240,306 L240,324" class="l" marker-end="url(#a)"/><rect x="22" y="327" width="440" height="92" rx="12" class="sh"/><rect x="20" y="324" width="440" height="92" rx="12" class="xG"/><text x="36" y="350" class="b">LC_TIME = pt_BR</text><text x="36" y="376" class="m">$ date</text><text x="36" y="400" class="m">dom 15 nov 2026 23:45:25</text><path d="M240,424 L240,442" class="l" marker-end="url(#a)"/><rect x="22" y="445" width="440" height="92" rx="12" class="sh"/><rect x="20" y="442" width="440" height="92" rx="12" class="xG"/><text x="36" y="468" class="b">LC_NUMERIC = pt_BR</text><text x="36" y="494" class="m">$ printf "%.2f" 3,5</text><text x="36" y="518" class="m">3,50</text><text x="240" y="560" class="n c">erros em inglês (fáceis de pesquisar), datas do Brasil</text></svg>