titulo: "Docker Swarm do zero"
slug: docker-swarm-do-zero
trilha: devops
ordem_na_trilha: 2
nivel: iniciante
publico: "Quem já escreve compose.yaml e quer rodar a aplicação em mais de uma máquina"
objetivo: "Montar um cluster Swarm com managers e workers e publicar uma stack com réplicas, redes overlay, secrets, configs e atualizações sem derrubar o serviço"
pre_requisitos: [docker-do-zero, docker-compose-na-pratica]
versao_referencia: "Docker Engine 29.9.2 com Docker Desktop 4.97.0 (conferido em 2026-11-17)"
fontes:
  - {titulo: "Swarm mode overview", url: "https://docs.docker.com/engine/swarm/", conferido_em: "2026-11-17"}
  - {titulo: "Swarm getting started tutorial", url: "https://docs.docker.com/engine/swarm/swarm-tutorial/", conferido_em: "2026-11-17"}
  - {titulo: "Manage secrets in Swarm", url: "https://docs.docker.com/engine/swarm/secrets/", conferido_em: "2026-11-17"}
  - {titulo: "Swarm networking", url: "https://docs.docker.com/engine/swarm/networking/", conferido_em: "2026-11-17"}
  - {titulo: "docker stack deploy", url: "https://docs.docker.com/reference/cli/docker/stack/deploy/", conferido_em: "2026-11-17"}
  - {titulo: "Compose deploy specification", url: "https://docs.docker.com/reference/compose-file/deploy/", conferido_em: "2026-11-17"}
aprovada_em: "2026-11-17"
capitulos:
  - {n: 1, titulo: "Por que orquestrar", objetivo: "Explicar quando um host só deixa de bastar e o que um orquestrador resolve", topicos: [host-unico, falha-de-no, orquestracao]}
  - {n: 2, titulo: "Swarm embutido no Engine", objetivo: "Iniciar um swarm de um nó e listá-lo com docker node ls", topicos: [swarm-init, node-ls, advertise-addr]}
  - {n: 3, titulo: "Managers, workers e quórum", objetivo: "Entrar com workers e managers usando tokens e explicar por que managers vêm em número ímpar", topicos: [join-token, managers, raft-quorum]}
  - {n: 4, titulo: "Primeiro service", objetivo: "Criar, listar, inspecionar e remover um service com docker service", topicos: [service-create, service-ls, service-ps]}
  - {n: 5, titulo: "Réplicas e escala", objetivo: "Escalar um service e ver o swarm recriar tarefas que falham", topicos: [replicas, service-scale, reconciliacao]}
  - {n: 6, titulo: "Stack a partir do compose.yaml", objetivo: "Implantar um compose.yaml com docker stack deploy e ler a chave deploy", topicos: [stack-deploy, deploy-replicas, compose-x-swarm]}
  - {n: 7, titulo: "Redes overlay e DNS", objetivo: "Fazer serviços de nós diferentes se encontrarem pelo nome", topicos: [overlay, service-discovery, rede-ingress]}
  - {n: 8, titulo: "Portas publicadas e routing mesh", objetivo: "Publicar uma porta e acessá-la em qualquer nó do swarm", topicos: [publish, routing-mesh, vip]}
  - {n: 9, titulo: "Placement com labels", objetivo: "Fixar serviços em nós com label usando constraints e preferences", topicos: [node-label, constraints, spread]}
  - {n: 10, titulo: "Secrets", objetivo: "Entregar uma senha a um service por secret em /run/secrets", topicos: [secret-create, run-secrets, rotacao]}
  - {n: 11, titulo: "Configs", objetivo: "Distribuir um arquivo de configuração não sensível com config", topicos: [config-create, mount-config, secret-x-config]}
  - {n: 12, titulo: "Atualizações contínuas", objetivo: "Atualizar a imagem de um service em lotes com update_config", topicos: [rolling-update, parallelism, delay, order]}
  - {n: 13, titulo: "Rollback e drenagem de nós", objetivo: "Desfazer uma atualização com rollback e tirar um nó de uso com drain", topicos: [service-rollback, failure-action, drain]}
  - {n: 14, titulo: "Projeto final: stack em vários nós", objetivo: "Publicar uma aplicação com API, banco, secret, config e atualização em um swarm de vários nós", topicos: [projeto]}
cobre: [swarm, service, stack-deploy, overlay, secrets, configs, rolling-update, rollback, drain]
fica_para_depois: [kubernetes, seguranca-de-imagens, build-multiplataforma, volumes-distribuidos]
