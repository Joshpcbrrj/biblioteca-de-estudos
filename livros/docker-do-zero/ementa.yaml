titulo: "Docker do zero"
slug: docker-do-zero
trilha: docker
ordem_na_trilha: 1
nivel: iniciante
publico: "Quem programa, mas nunca usou contêineres"
objetivo: "Empacotar uma aplicação com banco de dados em contêineres, com dados persistentes, e publicar a imagem"
pre_requisitos: []
versao_referencia: "Docker Desktop 4.96, com Docker Engine 29.9 (conferido em 2026-11-15)"
fontes:
  - {titulo: "Docker Desktop release notes", url: "https://docs.docker.com/desktop/release-notes/", conferido_em: "2026-11-15"}
  - {titulo: "Docker Engine 29 release notes", url: "https://docs.docker.com/engine/release-notes/29/", conferido_em: "2026-11-15"}
  - {titulo: "Install Docker Desktop on Windows", url: "https://docs.docker.com/desktop/setup/install/windows-install/", conferido_em: "2026-11-15"}
  - {titulo: "Install Docker Engine on Ubuntu", url: "https://docs.docker.com/engine/install/ubuntu/", conferido_em: "2026-11-15"}
  - {titulo: "Docker workshop", url: "https://docs.docker.com/get-started/workshop/", conferido_em: "2026-11-15"}
aprovada_em: "2026-11-15"
capitulos:
  - {n: 1, titulo: "Por que contêineres existem", objetivo: "Rodar um servidor web num contêiner e explicar o que o Docker isolou", topicos: [isolamento, conteiner-x-vm]}
  - {n: 2, titulo: "Docker Desktop no Windows: ativar e instalar", objetivo: "Ativar a virtualização e o WSL 2 e instalar o Docker Desktop no Windows", topicos: [virtualizacao, recursos-do-windows, wsl2-backend, instalador]}
  - {n: 3, titulo: "Instalar no Linux e no Mac", objetivo: "Instalar o Docker Engine no Ubuntu pelo repositório oficial e o Docker Desktop no Mac", topicos: [apt-repo-docker, grupo-docker, docker-desktop-mac]}
  - {n: 4, titulo: "Ciclo de vida do contêiner pela linha de comando", objetivo: "Rodar, listar, parar, remover e ler os logs de um contêiner com porta publicada", topicos: [docker-run, docker-ps, logs]}
  - {n: 5, titulo: "Docker Desktop na prática: interface x linha de comando", objetivo: "Fazer as mesmas tarefas pela interface e pela CLI e saber quando usar cada uma", topicos: [dashboard, logs-e-terminal, configuracoes, comparacao-cli]}
  - {n: 6, titulo: "Imagens e o Docker Hub", objetivo: "Baixar, inspecionar, marcar e remover imagens", topicos: [imagem, tag, registro]}
  - {n: 7, titulo: "Seu primeiro Dockerfile", objetivo: "Construir a imagem de uma API pequena e rodá-la", topicos: [dockerfile, build]}
  - {n: 8, titulo: "Builds rápidos e imagens enxutas", objetivo: "Medir e reduzir o tempo de build e o tamanho da imagem", topicos: [cache, multi-stage]}
  - {n: 9, titulo: "Volumes: dados que sobrevivem", objetivo: "Manter os dados de um PostgreSQL depois de recriar o contêiner", topicos: [volumes, bind-mounts]}
  - {n: 10, titulo: "Redes: contêineres que conversam", objetivo: "Fazer a API achar o banco pelo nome numa rede própria", topicos: [redes-basicas]}
  - {n: 11, titulo: "Publicar a imagem", objetivo: "Enviar a imagem para o Docker Hub e rodá-la a partir do registro", topicos: [push, pull]}
  - {n: 12, titulo: "Projeto final: API com banco em contêineres", objetivo: "Entregar API e banco numa rede própria, com volume e imagem publicada", topicos: [projeto]}
cobre: [docker-desktop, instalacao-docker, conteiner, imagem, dockerfile, volumes, redes-basicas, docker-hub]
fica_para_depois: [compose, seguranca-de-imagens, build-multiplataforma, docker-em-producao, kubernetes]
