"auto-start-reverse"><path d="M1,1L9,5L1,9" fill="none" stroke="#7A7F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="240.0" y="30" class="t c">Cada opção do docker run vira uma chave</text><rect x="200.0" y="38" width="80" height="4" rx="2" fill="url(#gT0)"/><rect x="22" y="63" width="440" height="272" rx="12" class="sh"/><rect x="20" y="60" width="440" height="272" rx="12" class="xW"/><rect x="20" y="60" width="440" height="34" rx="6" class="hP"/><text x="125.0" y="82" class="b c w">docker run</text><text x="345.0" y="82" class="b c w">compose.yaml</text><rect x="20" y="94" width="440" height="34" rx="3" class="xV"/><text x="125.0" y="116" class="m c">docker build api</text><text x="345.0" y="116" class="m c">build: ./api</text><rect x="20" y="128" width="440" height="34" rx="3" class="xZ"/><text x="125.0" y="150" class="m c">--network tarefas-net</text><text x="345.0" y="150" class="m c">networks: [tarefas-net]</text><rect x="20" y="162" width="440" height="34" rx="3" class="xV"/><text x="125.0" y="184" class="m c">-v tarefas-dados:...</text><text x="345.0" y="184" class="m c">volumes:</text><rect x="20" y="196" width="440" height="34" rx="3" class="xZ"/><text x="125.0" y="218" class="m c">-e DB_HOST=banco</text><text x="345.0" y="218" class="m c">environment:</text><rect x="20" y="230" width="440" height="34" rx="3" class="xV"/><text x="125.0" y="252" class="m c">-p 8080:8000</text><text x="345.0" y="252" class="m c">ports: ["8080:8000"]</text><rect x="20" y="264" width="440" height="34" rx="3" class="xZ"/><text x="125.0" y="286" class="m c">subir o banco antes</text><text x="345.0" y="286" class="m c">depends_on: (healthy)</text><rect x="20" y="298" width="440" height="34" rx="3" class="xV"/><text x="125.0" y="320" class="m c">docker stop/rm api banco</text><text x="345.0" y="320" class="m c">docker compose down</text><text x="240.0" y="356" class="n c">Os mesmos contêineres, rede e volume:</text><text x="240.0" y="376" class="n c">um comando no lugar de seis.</text></svg>