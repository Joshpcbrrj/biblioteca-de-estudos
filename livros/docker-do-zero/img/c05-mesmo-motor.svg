"auto-start-reverse"><path d="M1,1L9,5L1,9" fill="none" stroke="#7A7F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="240.0" y="30" class="t c">Três portas de entrada, um motor só</text><rect x="200.0" y="38" width="80" height="4" rx="2" fill="url(#gT0)"/><rect x="16" y="63" width="140" height="64" rx="12" class="sh"/><rect x="14" y="60" width="140" height="64" rx="12" class="xB"/><text x="84.0" y="88.5" class="b c">Interface</text><text x="84.0" y="106.5" class="s c">Dashboard</text><rect x="172" y="63" width="140" height="64" rx="12" class="sh"/><rect x="170" y="60" width="140" height="64" rx="12" class="xT"/><text x="240.0" y="88.5" class="b c">PowerShell</text><text x="240.0" y="106.5" class="s c">docker.exe</text><rect x="328" y="63" width="140" height="64" rx="12" class="sh"/><rect x="326" y="60" width="140" height="64" rx="12" class="xG"/><text x="396.0" y="88.5" class="b c">Ubuntu (WSL)</text><text x="396.0" y="106.5" class="s c">docker</text><path d="M84,124 L150,196" class="l" marker-end="url(#a)"/><path d="M240,124 L240,196" class="l" marker-end="url(#a)"/><path d="M396,124 L330,196" class="l" marker-end="url(#a)"/><rect x="62" y="201" width="360" height="76" rx="12" class="sh"/><rect x="60" y="198" width="360" height="76" rx="12" class="xP"/><text x="240.0" y="224.5" class="b c">Docker Engine 29.9</text><text x="240.0" y="242.5" class="s c">um só motor, na VM Linux do WSL 2</text><text x="240.0" y="258.5" class="s c">mesmos contêineres, imagens e volumes</text><text x="20" y="312" class="b">Na sessão do livro (Linux): dois contextos,</text><text x="20" y="332" class="b">o mesmo socket, a mesma lista</text><rect x="16" y="349" width="452" height="166" rx="12" class="sh"/><rect x="14" y="346" width="452" height="166" rx="12" class="xW"/><path d="M22,346 h436 a8,8 0 0 1 8,8 v12 h-452 v-12 a8,8 0 0 1 8,-8z" class="fP" opacity="1"/><circle cx="28" cy="356" r="4" fill="#EF4444" stroke="#fff" stroke-width="1"/><circle cx="42" cy="356" r="4" fill="#F59E0B" stroke="#fff" stroke-width="1"/><circle cx="56" cy="356" r="4" fill="#22C55E" stroke="#fff" stroke-width="1"/><rect x="14" y="366" width="452" height="146" fill="#F0F0F0" stroke="none" rx="0"/><rect x="14" y="346" width="452" height="166" rx="8" fill="none" stroke="#D6D2CA" stroke-width="1.8"/><text x="28" y="390" class="m">$ docker --context default ps \</text><text x="28" y="411" class="m">    --format "{{.Names}}"</text><text x="28" y="432" class="m">visto-por-dois</text><text x="28" y="453" class="m">$ docker --context mesmo-motor ps \</text><text x="28" y="474" class="m">    --format "{{.Names}}"</text><text x="28" y="495" class="m">visto-por-dois</text><text x="240.0" y="546" class="n c">Um contexto é só um endereço do motor.</text><text x="240.0" y="566" class="n c">Quem cria pela interface vê pela CLI, e vice-versa.</text></svg>