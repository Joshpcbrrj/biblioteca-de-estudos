"auto-start-reverse"><path d="M1,1L9,5L1,9" fill="none" stroke="#7A7F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="240.0" y="30" class="t c">O contêiner tem visão própria; o kernel é um só</text><rect x="200.0" y="38" width="80" height="4" rx="2" fill="url(#gT0)"/><rect x="20" y="58" width="440" height="380" rx="14" class="xY"/><text x="36" y="84" class="b">Máquina (host) · hostname vm</text><text x="36" y="104" class="m s">ps no host vê: PID 5845 python3</text><rect x="42" y="127" width="400" height="226" rx="14" class="sh"/><rect x="40" y="124" width="400" height="226" rx="14" class="xB"/><text x="56" y="150" class="b">Contêiner web · hostname ff12d19f4d5c</text><rect x="56" y="166" width="368" height="50" rx="10" class="xW"/><text x="72" y="187" class="b">Processos</text><text x="72" y="205" class="m s">PID 1 = python3 (e mais nada)</text><rect x="56" y="224" width="368" height="50" rx="10" class="xW"/><text x="72" y="245" class="b">Rede</text><text x="72" y="263" class="m s">IP 172.17.0.2, porta 8000</text><rect x="56" y="282" width="368" height="50" rx="10" class="xW"/><text x="72" y="303" class="b">Arquivos</text><text x="72" y="321" class="m s">/site/index.html (só aqui)</text><text x="240" y="382" class="m s c">curl localhost:8080  --(-p 8080:8000)--&gt;  8000</text><text x="240" y="402" class="s c">sem -p, a porta 8000 não aparece no host</text><rect x="22" y="461" width="440" height="50" rx="12" class="sh"/><rect x="20" y="458" width="440" height="50" rx="12" class="xP"/><rect x="18" y="456" width="444" height="54" rx="14" fill="none" stroke="#6B44B8" stroke-width="3"/><text x="240" y="479" class="b c">Kernel Linux 6.18.44: compartilhado</text><text x="240" y="497" class="s c">separa as visões (namespaces) e limita recursos</text><path d="M240,438 L240,458" class="l" marker-end="url(#a)"/><text x="240.0" y="540" class="n c">Dentro: PID 1. Fora: PID 5845. É o me